name: M5 human candidate review

on:
  pull_request:
    paths:
      - 'scripts/timetable/human-review-decision.mjs'
      - 'scripts/create-m5-human-review-decision.mjs'
      - 'scripts/check-m5-human-review-workflow.mjs'
      - 'docs/runbooks/m5-human-review-workflow.md'
      - '.github/workflows/m5-human-review.yml'
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Successful M5 candidate source workflow run ID'
        required: true
        type: string
      expected_candidate_sha256:
        description: 'Candidate SHA-256 copied from the reviewed run log'
        required: true
        type: string
      decision:
        description: 'Human decision after reviewing source links and candidate diff'
        required: true
        type: choice
        options:
          - approve
          - reject
      reason_code:
        description: 'Short lowercase audit code, e.g. official-source-reviewed'
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  deterministic-validation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - run: node scripts/check-m5-human-review-workflow.mjs
      - run: git diff --exit-code

  human-review-decision:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - id: source
        name: Resolve trusted source run metadata
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          metadata="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")"
          workflow_name="$(jq -r '.name' <<<"$metadata")"
          head_sha="$(jq -r '.head_sha' <<<"$metadata")"
          head_branch="$(jq -r '.head_branch' <<<"$metadata")"
          source_event="$(jq -r '.event' <<<"$metadata")"
          conclusion="$(jq -r '.conclusion' <<<"$metadata")"
          run_attempt="$(jq -r '.run_attempt' <<<"$metadata")"
          [[ "$workflow_name" == 'Calendar TJK current/future candidates' ]]
          [[ "$head_branch" == 'main' ]]
          [[ "$conclusion" == 'success' ]]
          [[ "$source_event" == 'push' || "$source_event" == 'schedule' || "$source_event" == 'workflow_dispatch' ]]
          artifact_name="m5-tjk-scheduled-dry-run-${SOURCE_RUN_ID}-${run_attempt}"
          {
            echo "workflow_name=$workflow_name"
            echo "head_sha=$head_sha"
            echo "head_branch=$head_branch"
            echo "source_event=$source_event"
            echo "run_attempt=$run_attempt"
            echo "artifact_name=$artifact_name"
          } >> "$GITHUB_OUTPUT"

      - name: Download the exact reviewed source artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.source.outputs.artifact_name }}
          path: artifacts/review-source/${{ inputs.source_run_id }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}

      - id: clock
        name: Capture review timestamp
        shell: bash
        run: echo "reviewed_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build non-publishing human review decision
        run: >-
          node scripts/create-m5-human-review-decision.mjs
          --source-dir 'artifacts/review-source/${{ inputs.source_run_id }}'
          --source-run-id '${{ inputs.source_run_id }}'
          --source-workflow-name '${{ steps.source.outputs.workflow_name }}'
          --source-head-sha '${{ steps.source.outputs.head_sha }}'
          --source-head-branch '${{ steps.source.outputs.head_branch }}'
          --source-event '${{ steps.source.outputs.source_event }}'
          --source-artifact-name '${{ steps.source.outputs.artifact_name }}'
          --reviewer '${{ github.actor }}'
          --decision '${{ inputs.decision }}'
          --reason-code '${{ inputs.reason_code }}'
          --reviewed-at '${{ steps.clock.outputs.reviewed_at }}'
          --expected-candidate-sha256 '${{ inputs.expected_candidate_sha256 }}'
          --output 'artifacts/m5-human-review/${{ inputs.source_run_id }}-${{ steps.source.outputs.run_attempt }}-decision.json'

      - name: Prove tracked repository state is unchanged
        run: git diff --exit-code

      - name: Upload human review decision artifact
        uses: actions/upload-artifact@v4
        with:
          name: m5-human-review-${{ inputs.source_run_id }}-${{ steps.source.outputs.run_attempt }}
          path: artifacts/m5-human-review/${{ inputs.source_run_id }}-${{ steps.source.outputs.run_attempt }}-decision.json
          retention-days: 30
          if-no-files-found: error
