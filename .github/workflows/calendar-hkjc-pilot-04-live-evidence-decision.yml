name: Calendar HKJC PILOT-04 live evidence decision

on:
  pull_request:
    paths:
      - 'data/audits/calendar-hkjc-pilot-04-live-evidence-v1.json'
      - 'data/static/calendar-acquisition-registry.json'
      - 'docs/project-roadmap.md'
      - 'docs/calendar/implementation-roadmap.md'
      - 'docs/calendar/acquisition-control-plane-implementation-plan.md'
      - 'docs/calendar/hkjc-pilot-reconciliation.md'
      - 'docs/calendar/hkjc-pilot-04-live-evidence.md'
      - 'docs/calendar/README.md'
      - 'scripts/check-calendar-hkjc-pilot-04-live-evidence-decision.mjs'
      - '.github/workflows/calendar-hkjc-pilot-04-live-evidence-decision.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Validate PILOT-04 evidence decision
        run: |
          node scripts/check-calendar-hkjc-pilot-04-live-evidence-decision.mjs
          node scripts/check-calendar-acquisition-registry.mjs
          node scripts/check-project-governance-docs.mjs
      - name: Prove workflow boundary
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const workflow = fs.readFileSync('.github/workflows/calendar-hkjc-pilot-04-live-evidence-decision.yml', 'utf8');
          if (!workflow.includes('permissions:\n  contents: read')) throw new Error('contents permission must remain read-only');
          if (/contents:\s*write/.test(workflow) || /pull-requests:\s*write/.test(workflow)) throw new Error('write permission enabled');
          if (/\bschedule\s*:|\bcron\s*:/.test(workflow)) throw new Error('scheduled execution enabled');
          console.log('PILOT_04_DECISION_CI_BOUNDARY: pass');
          NODE
