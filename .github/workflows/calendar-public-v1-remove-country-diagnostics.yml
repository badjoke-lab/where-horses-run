name: Calendar Public v1 remove country diagnostics

on:
  pull_request:
    paths:
      - '.github/workflows/calendar-public-v1-remove-country-diagnostics.yml'

permissions:
  contents: write

concurrency:
  group: calendar-public-v1-remove-country-diagnostics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  remove-internal-diagnostics:
    if: github.head_ref == 'work/calendar-nar-current-window-promotion-apply'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Remove internal Fetch and Probe diagnostics from Public v1
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const file = 'src/components/CountryDetailPage.astro';
          let text = fs.readFileSync(file, 'utf8');
          const internalState = `const fetchStatuses = siteData.generated.fetchStatus.sources ?? [];
          const countryFetchStatuses = fetchStatuses.filter((status) => status.country_id === country.id);
          const liveFetchProbes = siteData.generated.liveFetchProbeStatus?.probes ?? [];
          const countryLiveFetchProbes = liveFetchProbes.filter((probe) => probe.country_id === country.id);
          `;
          if (text.includes(internalState)) text = text.replace(internalState, '');
          const startMarker = '    <details class="country-technical">';
          const start = text.indexOf(startMarker);
          if (start < 0) throw new Error('country technical section is missing');
          const closeMarker = '    </details>';
          const close = text.indexOf(closeMarker, start);
          if (close < 0) throw new Error('country technical section closing tag is missing');
          const end = close + closeMarker.length;
          const replacement = `    <details class="country-technical">
          <summary>{pick('Dataset coverage details', 'データセット掲載状況')}</summary>
          <div class="country-grid country-grid--1">
            <article class="card country-card">
              <h3>{pick('Dataset status', 'データセット状態')}</h3>
              <p><strong>{pick('Country status:', '国status:')}</strong> {country.status}</p>
              <p><strong>Coverage level:</strong> {country.coverage_level}</p>
              <p><strong>Automation level:</strong> {country.auto_level}</p>
              <p><strong>{pick('Active 30-day records:', '30日範囲内records:')}</strong> {activeWindowRecords.length}</p>
              <p><strong>{pick('Out-of-window records:', '30日範囲外records:')}</strong> {outOfWindowRecords}</p>
              {countryInventory && <p><strong>Seed state:</strong> {countryInventory.current_seed_state}</p>}
            </article>
          </div>
        </details>`;
          text = `${text.slice(0, start)}${replacement}${text.slice(end)}`;
          for (const forbidden of ['countryFetchStatuses', 'countryLiveFetchProbes', 'Fetch status', 'Probe status', 'liveFetchProbeStatus']) {
            if (text.includes(forbidden)) throw new Error(`internal country diagnostic remains: ${forbidden}`);
          }
          fs.writeFileSync(file, text);
          NODE
      - name: Validate Public v1 internal boundary
        run: |
          node scripts/check-live-fetch-probe-status-ui.mjs
          node scripts/check-m3-hong-kong-alpha-ui.mjs
          node scripts/check-m3-uae-generated-fallback.mjs
      - name: Commit Public v1 boundary correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/CountryDetailPage.astro
          if git diff --cached --quiet; then
            echo 'Public v1 country diagnostics are already removed.'
          else
            git commit -m 'Remove internal country fetch diagnostics from Public v1'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
