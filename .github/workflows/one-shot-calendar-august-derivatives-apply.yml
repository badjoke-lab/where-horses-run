name: One-shot Calendar August derivatives apply

on:
  pull_request:
    paths:
      - '.github/workflows/one-shot-calendar-august-derivatives-apply.yml'

permissions:
  contents: write
  actions: read

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/calendar-horizon-recovery-2026-08-08'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: calendar-horizon-public-recovery-output
          path: /tmp/recovery-output
          github-token: ${{ github.token }}
          run-id: 31262181075
      - name: Apply exact derived output
        shell: bash
        run: |
          cp /tmp/recovery-output/generated/timetable/public/japan-a-plus-overrides.json data/generated/timetable/public/japan-a-plus-overrides.json
          cp /tmp/recovery-output/generated/timetable/operations-status.json data/generated/timetable/operations-status.json
          cp /tmp/recovery-output/generated/timetable/operations-review-package.json data/generated/timetable/operations-review-package.json
          node scripts/check-calendar-japan-a-plus-public-overrides.mjs
          node scripts/check-calendar-operations-status.mjs
          node scripts/check-calendar-operations-review-package.mjs
          git diff --check
      - name: Commit derived output to Draft PR branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            data/generated/timetable/public/japan-a-plus-overrides.json \
            data/generated/timetable/operations-status.json \
            data/generated/timetable/operations-review-package.json
          if git diff --cached --quiet; then
            echo 'Derived output already current.'
            exit 0
          fi
          git commit -m '[CF-Pages-Skip] Refresh Calendar public and operations derivatives'
          git push origin HEAD:${{ github.head_ref }}
