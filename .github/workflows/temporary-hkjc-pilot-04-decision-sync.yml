name: Temporary HKJC PILOT-04 decision sync

on:
  push:
    branches:
      - work/calendar-hkjc-fixture-parser-resilience

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/calendar-hkjc-fixture-parser-resilience
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Apply PILOT-04 evidence decision sync
        run: node scripts/temporary-sync-hkjc-pilot-04-decision.mjs
      - name: Validate decision boundary
        run: |
          node scripts/check-calendar-hkjc-pilot-04-live-evidence-decision.mjs
          node scripts/check-calendar-acquisition-registry.mjs
          node scripts/check-project-governance-docs.mjs
      - name: Commit synchronized state when needed
        run: |
          if git diff --quiet; then
            echo "No synchronization changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/static/calendar-acquisition-registry.json \
            docs/project-roadmap.md \
            docs/calendar/implementation-roadmap.md \
            docs/calendar/acquisition-control-plane-implementation-plan.md \
            docs/calendar/hkjc-pilot-reconciliation.md \
            docs/calendar/README.md
          git commit -m "[CF-Pages-Skip] Sync HKJC PILOT-04 evidence decision"
          git push origin HEAD:work/calendar-hkjc-fixture-parser-resilience

# Temporary workflow removed after synchronization.
