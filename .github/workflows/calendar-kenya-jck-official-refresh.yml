name: Kenya JCK official Calendar refresh

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Refresh scope
        required: true
        default: near
        type: choice
        options:
          - near
          - full
  # On a Kenya collector/workflow production change, verify and publish the full
  # official season window immediately instead of waiting for the weekly job.
  # Generated-data commits do not match these paths and cannot trigger a loop.
  push:
    branches: [main]
    paths:
      - '.github/workflows/calendar-kenya-jck-official-refresh.yml'
      - 'scripts/timetable/kenya-jck-calendar-core.mjs'
      - 'scripts/timetable/run-kenya-jck-official-window.mjs'
      - 'scripts/check-kenya-jck-full-projection.mjs'
  schedule:
    - cron: '53 4 * * *'
    - cron: '23 5 * * 1'
  pull_request:
    paths:
      - '.github/workflows/calendar-kenya-jck-official-refresh.yml'
      - '.github/workflows/calendar-unified-official-refresh.yml'
      - '.github/workflows/calendar-near-official-refresh.yml'
      - 'scripts/timetable/kenya-jck-calendar-core.mjs'
      - 'scripts/timetable/run-kenya-jck-official-window.mjs'
      - 'scripts/check-kenya-jck-adapter.mjs'
      - 'scripts/check-kenya-jck-full-projection.mjs'
      - 'scripts/timetable/rebuild-unified-non-japan-on-main.sh'
      - 'scripts/timetable/build-refresh-audit-summary.mjs'
      - 'data/static/authority-source-inventory.json'
      - 'data/static/calendar-acquisition-registry.json'
      - 'data/static/calendar-readiness-registry.json'
      - 'data/static/calendar-public-country-support-v1.json'
      - 'data/static/calendar-non-running-evidence-registry-v1.json'
      - 'data/static/calendar-98-tier-execution-coverage.json'
      - 'data/static/racecourses.json'
      - 'data/static/racecourse-locations-v1.json'
      - 'data/static/racecourse-location-supplement-evidence-v1.json'
      - 'package.json'

permissions:
  contents: write

concurrency:
  group: kenya-jck-official-calendar-refresh
  cancel-in-progress: false

jobs:
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm run validate:kenya-jck
      - name: Exercise Kenya production path
        run: |
          mkdir -p .calendar-kenya
          node scripts/timetable/run-kenya-jck-official-window.mjs --days=180 --output=.calendar-kenya/kenya.json
          node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync('.calendar-kenya/kenya.json','utf8'));if(a.acquisition_attempt?.status!=='success'||(a.diagnostics?.source_errors?.length??0)!==0||(a.diagnostics?.parse_failures?.length??0)!==0||(a.records?.length??0)<1){console.error(JSON.stringify({attempt:a.acquisition_attempt,discovery:a.discovery,diagnostics:a.diagnostics,records:a.records?.length??0}));process.exit(1)}"
          node scripts/timetable/apply-official-rolling-observations.mjs --artifact=.calendar-kenya/kenya.json --country-id=kenya --authority-id=jockey-club-of-kenya --racing-system-id=ngong-jck-racing-system --timezone=Africa/Nairobi
          node scripts/check-kenya-jck-full-projection.mjs
          node scripts/check-calendar-public-country-support.mjs
          node scripts/check-calendar-public-map-parity.mjs
          node scripts/check-calendar-non-running-evidence-registry.mjs
          node scripts/check-calendar-unified-audit-coverage.mjs

  refresh:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --no-audit --no-fund
      - id: scope
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then scope="${{ inputs.scope }}"; elif [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event.schedule }}" = "23 5 * * 1" ]; then scope=full; else scope=near; fi
          if [ "$scope" = full ]; then days=180; else days=30; fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "days=$days" >> "$GITHUB_OUTPUT"
      - name: Collect and apply Kenya
        run: |
          mkdir -p .calendar-kenya
          node scripts/timetable/run-kenya-jck-official-window.mjs --days="${{ steps.scope.outputs.days }}" --output=.calendar-kenya/kenya.json
          node scripts/timetable/apply-official-rolling-observations.mjs --artifact=.calendar-kenya/kenya.json --country-id=kenya --authority-id=jockey-club-of-kenya --racing-system-id=ngong-jck-racing-system --timezone=Africa/Nairobi
          node scripts/timetable/apply-reviewed-calendar-observations.mjs
          if [ "${{ steps.scope.outputs.scope }}" = full ]; then node scripts/check-kenya-jck-full-projection.mjs; fi
          node scripts/check-calendar-public-country-support.mjs
          node scripts/check-calendar-public-map-parity.mjs
          node scripts/check-calendar-non-running-evidence-registry.mjs
      - name: Persist generated Kenya JCK timetable (latest-main safe)
        shell: bash
        run: |
          set -euo pipefail
          recollect_on_main() {
            npm install --no-package-lock --no-audit --no-fund
            rm -rf .calendar-kenya
            mkdir -p .calendar-kenya
            node scripts/timetable/run-kenya-jck-official-window.mjs --days="${{ steps.scope.outputs.days }}" --output=.calendar-kenya/kenya.json
            node scripts/timetable/apply-official-rolling-observations.mjs --artifact=.calendar-kenya/kenya.json --country-id=kenya --authority-id=jockey-club-of-kenya --racing-system-id=ngong-jck-racing-system --timezone=Africa/Nairobi
            node scripts/timetable/apply-reviewed-calendar-observations.mjs
            if [ "${{ steps.scope.outputs.scope }}" = full ]; then node scripts/check-kenya-jck-full-projection.mjs; fi
            node scripts/check-calendar-public-country-support.mjs
            node scripts/check-calendar-public-map-parity.mjs
            node scripts/check-calendar-non-running-evidence-registry.mjs
          }
          source scripts/timetable/persist-country-on-main.sh
          persist_country_on_main 'Kenya JCK' '${{ steps.scope.outputs.scope }}' recollect_on_main
