name: Temporary Review Cohort diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/temp-review-cohort-diagnostic.yml'

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Capture checker output
        run: |
          mkdir -p .diagnostics
          node scripts/check-calendar-review-cohort-planner.mjs > .diagnostics/review-cohort-check.log 2>&1 || true
      - name: Commit diagnostic output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .diagnostics/review-cohort-check.log
          git commit -m "[CF-Pages-Skip] Capture Review Cohort diagnostic"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
