name: Calendar Due-job month-boundary push apply

on:
  push:
    branches:
      - fix/daily-acquisition-month-boundary
    paths:
      - '.github/workflows/calendar-due-job-month-boundary-push-apply.yml'
      - 'scripts/tmp-apply-calendar-month-boundary-fix.py'

permissions:
  contents: write

concurrency:
  group: calendar-due-job-month-boundary-push-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/daily-acquisition-month-boundary
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Apply bounded planner repair
        run: python3 scripts/tmp-apply-calendar-month-boundary-fix.py
      - name: Validate repaired planner and contracts
        run: |
          node --check scripts/timetable/due-job-planner.mjs
          node --check scripts/check-calendar-due-job-planner.mjs
          node scripts/check-calendar-due-job-planner.mjs
          node scripts/check-calendar-collection-job.mjs
          node scripts/check-calendar-collection-plan.mjs
          node scripts/check-calendar-actions-multi-job.mjs
          node scripts/check-calendar-daily-acquisition-policy.mjs
      - name: Reproduce failed live planning time
        run: |
          node scripts/timetable/build-calendar-live-planner-state.mjs \
            --as-of=2026-08-25T01:46:04Z \
            --output=.calendar-live-state.json
          node scripts/timetable/plan-calendar-due-jobs.mjs \
            --state=.calendar-live-state.json \
            --output=.calendar-due-job-plan.json
          node scripts/timetable/plan-actions-multi-job.mjs \
            --plan-file=.calendar-due-job-plan.json \
            --output=.calendar-actions-plan.json \
            --matrix-output=.calendar-actions-matrix.json
          node scripts/timetable/validate-daily-acquisition-plan.mjs \
            --due-plan=.calendar-due-job-plan.json \
            --actions-plan=.calendar-actions-plan.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const due = JSON.parse(fs.readFileSync('.calendar-due-job-plan.json', 'utf8'));
          const jra = due.collection_plan.jobs.filter((job) => job.system_id === 'japan-jra-system' && job.reason === 'regular_refresh');
          const scopes = jra.map((job) => job.requested_scope);
          const expected = [
            { start_date: '2026-08-26', end_date_exclusive: '2026-09-01', timezone: 'Asia/Tokyo' },
            { start_date: '2026-09-01', end_date_exclusive: '2026-09-02', timezone: 'Asia/Tokyo' },
          ];
          if (JSON.stringify(scopes) !== JSON.stringify(expected)) throw new Error(`JRA live month-boundary scopes differ: ${JSON.stringify(scopes)}`);
          const matrix = JSON.parse(fs.readFileSync('.calendar-actions-matrix.json', 'utf8'));
          if ((matrix.include ?? []).some((entry) => entry.collection_job?.system_id === 'japan-jra-system')) throw new Error('JRA leaked into hosted Actions matrix');
          NODE
      - name: Commit repaired source and remove temporary files
        run: |
          git rm \
            .github/workflows/calendar-due-job-month-boundary-push-apply.yml \
            .github/workflows/calendar-due-job-month-boundary-bounded-fix.yml \
            scripts/tmp-apply-calendar-month-boundary-fix.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            scripts/timetable/due-job-planner.mjs \
            scripts/check-calendar-due-job-planner.mjs \
            .github/workflows/calendar-daily-acquisition.yml
          git diff --cached --check
          git commit -m 'Split non-cross-month due-job windows at month boundaries'
          git push origin HEAD:fix/daily-acquisition-month-boundary
