name: Calendar KRA Control Plane Actions

on:
  pull_request:
    paths:
      - 'data/static/calendar-acquisition-registry.json'
      - 'data/static/calendar-runner-compatibility-contract-v1.json'
      - 'scripts/timetable/run-calendar-actions-job.mjs'
      - 'scripts/timetable/run-kra-todayrace-actions-job.mjs'
      - 'scripts/timetable/collect-kra-todayrace.mjs'
      - 'scripts/timetable/kra-todayrace-core.mjs'
      - '.github/workflows/calendar-kra-control-plane-actions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-control-plane-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Compile KRA selected-meeting execution
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { loadCalendarAcquisitionRegistryV1 } from './scripts/timetable/load-calendar-acquisition-registry.mjs';
          import { compileRunnerExecutionV1 } from './scripts/timetable/runner-compatibility.mjs';

          const job = {
            schema_version: 'calendar-collection-job-v1',
            job_id: 'kra-control-plane-live-proof-job',
            campaign_id: 'kra-control-plane-live-proof',
            system_id: 'kra-national-racing-system',
            runner_policy: { mode: 'exact', runner: 'github_actions' },
            collection_mode: 'selected_meetings',
            requested_scope: { meeting_ids: ['kra-seoul-racecourse-2026-06-06'] },
            rank_strategy: 'best_available',
            target_rank: null,
            reason: 'source_revalidation',
            requested_at: '2026-09-01T00:00:00Z',
          };
          const registry = loadCalendarAcquisitionRegistryV1(process.cwd());
          const contract = JSON.parse(fs.readFileSync('data/static/calendar-runner-compatibility-contract-v1.json', 'utf8'));
          const execution = compileRunnerExecutionV1(job, { batch_id: 'kra-control-plane-live-proof-batch' }, registry, contract);
          fs.writeFileSync('/tmp/kra-control-plane-job.json', `${JSON.stringify(job, null, 2)}\n`);
          fs.writeFileSync('/tmp/kra-control-plane-execution.json', `${JSON.stringify(execution, null, 2)}\n`);
          NODE
      - name: Run KRA through shared Actions dispatcher
        shell: bash
        run: |
          before="$(sha256sum data/generated/timetable/canonical/meetings.json)"
          node scripts/timetable/run-calendar-actions-job.mjs \
            --execution=/tmp/kra-control-plane-execution.json \
            --job=/tmp/kra-control-plane-job.json \
            --status-output=/tmp/kra-control-plane-status.json
          after="$(sha256sum data/generated/timetable/canonical/meetings.json)"
          test "$before" = "$after"
      - name: Validate review-only A+ proof artifacts
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { validateCoverageObservation } from './scripts/timetable/coverage-observation-validation.mjs';
          import { validateCollectionResultManifestV1 } from './scripts/timetable/collection-result-manifest-validation.mjs';

          const base = 'data/generated/timetable/actions-multi-job/kra-control-plane-live-proof-batch';
          const candidate = JSON.parse(fs.readFileSync(`${base}/candidates.json`, 'utf8'));
          const coverage = JSON.parse(fs.readFileSync(`${base}/coverage-observation.json`, 'utf8'));
          const manifest = JSON.parse(fs.readFileSync(`${base}/result-manifest.json`, 'utf8'));
          const status = JSON.parse(fs.readFileSync('/tmp/kra-control-plane-status.json', 'utf8'));
          const coverageValidation = validateCoverageObservation(coverage);
          if (!coverageValidation.valid) throw new Error(coverageValidation.errors.join('; '));
          const manifestErrors = validateCollectionResultManifestV1(manifest);
          if (manifestErrors.length) throw new Error(manifestErrors.join('; '));
          if (candidate.review?.status !== 'needs_review') throw new Error('KRA candidate escaped review boundary');
          if (candidate.records?.length !== 1) throw new Error('KRA proof expected exactly one candidate');
          if (candidate.records[0].capability_rank !== 'A+') throw new Error(`KRA historical proof rank ${candidate.records[0].capability_rank}`);
          if (manifest.rank_counts['A+'] !== 1) throw new Error('KRA manifest A+ accounting differs');
          if (status.execution_mode !== 'source_execution') throw new Error('shared dispatcher did not execute source route');
          if (JSON.stringify(candidate).includes('raw_html')) throw new Error('raw HTML marker leaked into KRA candidate');
          console.log(JSON.stringify({
            control_plane_status: status.status,
            rank_counts: manifest.rank_counts,
            review_status: candidate.review.status,
            canonical_write: false,
            public_write: false,
          }));
          NODE
