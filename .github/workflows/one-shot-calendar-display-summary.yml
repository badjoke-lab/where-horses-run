name: One-shot Calendar display summary

on:
  pull_request:
    paths:
      - '.github/workflows/one-shot-calendar-display-summary.yml'

permissions:
  contents: read

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Summarize current production Calendar window
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const data = JSON.parse(fs.readFileSync('data/generated/timetable/public/meeting-list.json', 'utf8'));
          const start = '2026-07-20';
          const end = '2026-08-18';
          const records = data.meetings.filter((record) => record.date >= start && record.date <= end);
          const byAuthority = new Map();
          for (const record of records) {
            const entry = byAuthority.get(record.authority_id) ?? {
              authority_id: record.authority_id,
              meeting_count: 0,
              first_date: record.date,
              last_date: record.date,
              rank_counts: {},
              racecourses: new Set(),
              source_status_counts: {},
            };
            entry.meeting_count += 1;
            entry.first_date = entry.first_date < record.date ? entry.first_date : record.date;
            entry.last_date = entry.last_date > record.date ? entry.last_date : record.date;
            entry.rank_counts[record.effective_public_rank] = (entry.rank_counts[record.effective_public_rank] ?? 0) + 1;
            entry.source_status_counts[record.source_status] = (entry.source_status_counts[record.source_status] ?? 0) + 1;
            entry.racecourses.add(record.racecourse_id);
            byAuthority.set(record.authority_id, entry);
          }
          const summary = [...byAuthority.values()]
            .map((entry) => ({ ...entry, racecourses: [...entry.racecourses].sort() }))
            .sort((a, b) => a.authority_id.localeCompare(b.authority_id));
          console.log('CALENDAR_DISPLAY_WINDOW_SUMMARY');
          console.log(JSON.stringify({
            generated_at: data.generated_at,
            window_start: start,
            window_end_inclusive: end,
            total_meetings: records.length,
            systems: summary,
          }, null, 2));
          NODE
