name: Temporary HKJC PILOT-03 checker dependency updater

on:
  pull_request:
    paths:
      - 'scripts/update-hkjc-pilot-03-checker-dependencies.mjs'
      - '.github/workflows/temp-hkjc-pilot-03-checker-dependencies.yml'

permissions:
  contents: write

jobs:
  update:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Update HKJC PILOT-03 checker dependencies
        run: node scripts/update-hkjc-pilot-03-checker-dependencies.mjs
      - name: Commit checker dependency updates
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/check-calendar-acquisition-registry.mjs \
            scripts/check-calendar-hkjc-pilot-reconciliation.mjs
          git commit -m "[CF-Pages-Skip] Align HKJC PILOT-03 checker dependencies"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
