name: Calendar August 2026 horizon recovery promotion

on:
  pull_request:
    paths:
      - '.github/workflows/calendar-august-2026-horizon-recovery-promotion.yml'
      - '.github/workflows/calendar-august-2026-horizon-recovery-acquisition.yml'
      - 'scripts/timetable/build-calendar-live-planner-state.mjs'
      - 'scripts/timetable/due-job-planner.mjs'
      - 'scripts/timetable/write-calendar-daily-acquisition-status.mjs'
      - 'scripts/check-calendar-current-horizon-recovery.mjs'
      - 'scripts/check-calendar-daily-acquisition-activation-status.mjs'
      - 'data/static/calendar-system-season-state-v1.json'
      - 'data/static/calendar-daily-acquisition-activation-status.schema.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: calendar-august-2026-horizon-recovery-promotion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generate-and-validate:
    if: github.event.pull_request.head.ref == 'agent/calendar-horizon-recovery-2026-08-08'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Download exact reviewed acquisition artifact
        uses: actions/download-artifact@v4
        with:
          name: calendar-august-2026-horizon-recovery-review-artifacts
          path: /tmp/calendar-recovery
          github-token: ${{ github.token }}
          run-id: 31261234892
      - name: Build exact approved Rank C envelopes
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const read = (rel) => JSON.parse(fs.readFileSync(path.join('/tmp/calendar-recovery', rel), 'utf8'));
          const write = (rel, value) => { const out = path.resolve(rel); fs.mkdirSync(path.dirname(out), { recursive: true }); fs.writeFileSync(out, `${JSON.stringify(value, null, 2)}\n`); };
          const reviewedAt = '2026-08-08T14:15:00Z';
          const jra = read('jra/source-snapshot.json');
          const nar = read('nar/candidates.json');
          const b8 = read('banei/2026-08/candidates.json');
          const b9 = read('banei/2026-09/candidates.json');
          const hkjc = read('hkjc/candidates.json');

          const jraRecords = jra.observations.flatMap((observation) => observation.meetings ?? [])
            .filter((meeting) => meeting.date > '2026-08-17' && meeting.date <= '2026-09-06')
            .sort((a, b) => `${a.date}:${a.racecourse_id}`.localeCompare(`${b.date}:${b.racecourse_id}`))
            .map((meeting) => ({
              candidate_id: `approved-${meeting.meeting_id}`, meeting_id: meeting.meeting_id,
              country_id: 'japan', authority_id: 'jra', racing_system_id: 'japan-jra-system', racecourse_id: meeting.racecourse_id,
              date: meeting.date, timezone: 'Asia/Tokyo', capability_rank: 'C', first_race_time_local: null, last_race_time_local: null, timetable_rows: [],
              source: { source_id: 'jra-programme', official_url: meeting.official_source_url, checked_at: jra.generated_at, extraction_method: 'reviewed_snapshot' },
              confidence: 'high', review_status: 'approved',
              notes: 'Official JRA programme confirms the meeting date and racecourse identity. Published recovery is intentionally capped at Rank C; collected race times and programme rows are not promoted by this envelope.'
            }));
          const jraApproved = {
            schema_version: 'timetable-candidate-v1', generated_at: jra.generated_at, adapter_id: 'jra-august-2026-rolling-horizon-reviewed-promotion-v1',
            country_id: 'japan', authority_id: 'jra', source_id: 'jra-programme', candidate_window: { start_date: '2026-08-18', end_date_exclusive: '2026-09-07', timezone: 'Asia/Tokyo' },
            records: jraRecords, review: { status: 'approved', reviewed_at: reviewedAt, reviewer: 'badjoke-lab', summary: `Approved ${jraRecords.length} Rank C JRA meeting identities from official programme pages through September 6; collected programme detail is intentionally not promoted.`, promotion_target: 'canonical-timetable-v0' }
          };

          const narRecords = nar.records.map((record) => ({
            candidate_id: `approved-${record.meeting_id}`, meeting_id: record.meeting_id,
            country_id: 'japan', authority_id: 'nar-local-government-racing', racing_system_id: 'japan-nar-system', racecourse_id: record.racecourse_id,
            date: record.date, timezone: 'Asia/Tokyo', capability_rank: 'C', first_race_time_local: null, last_race_time_local: null, timetable_rows: [],
            source: { source_id: 'nar-monthly-schedule-grid', official_url: record.official_source_url, checked_at: nar.generated_at, extraction_method: 'reviewed_monthly_schedule_grid' },
            confidence: 'high', review_status: 'approved', notes: 'Approved from the official NAR August/September 2026 monthly schedule. Meeting date and racecourse only; race times and programme detail are not promoted.'
          }));
          const narApproved = {
            schema_version: 'timetable-candidate-v1', generated_at: nar.generated_at, adapter_id: 'nar-august-2026-rolling-horizon-reviewed-schedule-promotion-v1',
            country_id: 'japan', authority_id: 'nar-local-government-racing', source_id: 'nar-monthly-schedule-grid', candidate_window: { start_date: '2026-08-18', end_date_exclusive: '2026-09-07', timezone: 'Asia/Tokyo' },
            records: narRecords, review: { status: 'approved', reviewed_at: reviewedAt, reviewer: 'badjoke-lab', summary: `Approved ${narRecords.length} Rank C NAR meeting identities from official August/September monthly schedules through September 6.`, promotion_target: 'canonical-timetable-v0' }
          };

          const baneiRecords = [b8, b9].flatMap((source) => source.meetings
            .filter((meeting) => meeting.date > '2026-08-17' && meeting.date <= '2026-09-06')
            .map((meeting) => ({
              candidate_id: `approved-${meeting.meeting_id}`, meeting_id: meeting.meeting_id,
              country_id: 'japan', authority_id: 'banei-tokachi', racing_system_id: 'japan-banei-system', racecourse_id: 'obihiro-racecourse',
              date: meeting.date, timezone: 'Asia/Tokyo', capability_rank: 'C', first_race_time_local: null, last_race_time_local: null, timetable_rows: [],
              source: { source_id: 'banei-official-schedule', official_url: source.source.official_schedule_url, checked_at: source.generated_at, extraction_method: 'adapter_candidate' },
              confidence: 'low', review_status: 'approved', notes: 'Approved official Banei monthly-schedule meeting identity. No race times or programme rows are claimed; ordinary automated Banei refresh remains disabled.'
            }))).sort((a, b) => a.date.localeCompare(b.date));
          const baneiApproved = {
            schema_version: 'timetable-candidate-v1', generated_at: [b8.generated_at, b9.generated_at].sort().at(-1), adapter_id: 'banei-august-2026-rolling-horizon-reviewed-schedule-promotion-v1',
            country_id: 'japan', authority_id: 'banei-tokachi', source_id: 'banei-official-schedule', candidate_window: { start_date: '2026-08-18', end_date_exclusive: '2026-09-07', timezone: 'Asia/Tokyo' },
            records: baneiRecords, review: { status: 'approved', reviewed_at: reviewedAt, reviewer: 'badjoke-lab', summary: `Approved ${baneiRecords.length} Rank C Banei Obihiro meeting identities from official August/September schedules; ordinary automated Banei refresh remains disabled.`, promotion_target: 'canonical-timetable-v0' }
          };

          const hkjcRecords = hkjc.records.map((record) => ({
            candidate_id: `approved-${record.meeting_id}`, meeting_id: record.meeting_id,
            country_id: 'hong-kong', authority_id: 'hkjc', racing_system_id: 'hong-kong-hkjc-system', racecourse_id: record.racecourse_id,
            date: record.date, timezone: 'Asia/Hong_Kong', capability_rank: 'C', first_race_time_local: null, last_race_time_local: null, timetable_rows: [],
            source: { source_id: 'hkjc-fixture-list', official_url: record.source.official_url, checked_at: record.source.checked_at, extraction_method: 'reviewed_fixture_parser' },
            confidence: 'high', review_status: 'approved', notes: 'Official HKJC fixture confirms the September 6 Sha Tin meeting identity. Recovery is capped at Rank C; no race times or programme rows are claimed.'
          }));
          const hkjcApproved = {
            schema_version: 'timetable-candidate-v1', generated_at: hkjc.generated_at, adapter_id: 'hkjc-september-2026-season-wakeup-reviewed-promotion-v1',
            country_id: 'hong-kong', authority_id: 'hkjc', source_id: 'hkjc-fixture-list', candidate_window: { start_date: '2026-09-06', end_date_exclusive: '2026-09-07', timezone: 'Asia/Hong_Kong' },
            records: hkjcRecords, review: { status: 'approved', reviewed_at: reviewedAt, reviewer: 'badjoke-lab', summary: 'Approved the September 6 Sha Tin season-opening meeting identity at Rank C from the official HKJC fixture.', promotion_target: 'canonical-timetable-v0' }
          };

          const files = [
            ['data/candidates/jra-horizon-recovery-2026-08-18-through-2026-09-06-approved.json', jraApproved, 18],
            ['data/candidates/nar-horizon-recovery-2026-08-18-through-2026-09-06-approved.json', narApproved, 69],
            ['data/candidates/banei-horizon-recovery-2026-08-18-through-2026-09-06-approved.json', baneiApproved, 8],
            ['data/candidates/hkjc-horizon-recovery-2026-09-06-approved.json', hkjcApproved, 1],
          ];
          const ids = [];
          for (const [file, value, expected] of files) {
            if (value.records.length !== expected) throw new Error(`${file}: expected ${expected}, got ${value.records.length}`);
            for (const record of value.records) {
              ids.push(record.meeting_id);
              if (record.capability_rank !== 'C' || record.first_race_time_local !== null || record.last_race_time_local !== null || record.timetable_rows.length !== 0) throw new Error(`${record.meeting_id}: exceeds Rank C`);
            }
            write(file, value);
          }
          if (ids.length !== 96 || new Set(ids).size !== 96) throw new Error(`recovery identity total differs: ${ids.length}/${new Set(ids).size}`);
          fs.mkdirSync('data/generated/timetable/horizon-recovery-2026-08-08', { recursive: true });
          for (const [src, dst] of [
            ['/tmp/calendar-recovery/jra/collection-report.json', 'data/generated/timetable/horizon-recovery-2026-08-08/jra-collection-report.json'],
            ['/tmp/calendar-recovery/nar/collection-report.json', 'data/generated/timetable/horizon-recovery-2026-08-08/nar-collection-report.json'],
            ['/tmp/calendar-recovery/banei/2026-08/collection-report.json', 'data/generated/timetable/horizon-recovery-2026-08-08/banei-august-collection-report.json'],
            ['/tmp/calendar-recovery/banei/2026-09/collection-report.json', 'data/generated/timetable/horizon-recovery-2026-08-08/banei-september-collection-report.json'],
            ['/tmp/calendar-recovery/hkjc/collection-report.json', 'data/generated/timetable/horizon-recovery-2026-08-08/hkjc-collection-report.json'],
            ['/tmp/calendar-recovery/hkjc/coverage-observation.json', 'data/generated/timetable/horizon-recovery-2026-08-08/hkjc-coverage-observation.json'],
            ['/tmp/calendar-recovery/planner/live-state.json', 'data/generated/timetable/horizon-recovery-2026-08-08/planner-live-state.json'],
            ['/tmp/calendar-recovery/planner/due-job-plan.json', 'data/generated/timetable/horizon-recovery-2026-08-08/planner-due-job-plan.json'],
          ]) fs.copyFileSync(src, dst);
          console.log('AUG8_APPROVED_CANDIDATES: JRA=18 NAR=69 BANEI=8 HKJC=1 TOTAL=96');
          NODE
      - name: Dry-run Promotion Validation for all four systems
        run: |
          node scripts/timetable/promote-timetable.mjs --input data/candidates/jra-horizon-recovery-2026-08-18-through-2026-09-06-approved.json --dry-run
          node scripts/timetable/promote-timetable.mjs --input data/candidates/nar-horizon-recovery-2026-08-18-through-2026-09-06-approved.json --dry-run
          node scripts/timetable/promote-timetable.mjs --input data/candidates/banei-horizon-recovery-2026-08-18-through-2026-09-06-approved.json --dry-run
          node scripts/timetable/promote-timetable.mjs --input data/candidates/hkjc-horizon-recovery-2026-09-06-approved.json --dry-run
      - name: Promote reviewed candidates in read-only workspace
        run: |
          node scripts/timetable/promote-timetable.mjs --input data/candidates/jra-horizon-recovery-2026-08-18-through-2026-09-06-approved.json
          node scripts/timetable/promote-timetable.mjs --input data/candidates/nar-horizon-recovery-2026-08-18-through-2026-09-06-approved.json
          node scripts/timetable/promote-timetable.mjs --input data/candidates/banei-horizon-recovery-2026-08-18-through-2026-09-06-approved.json
          node scripts/timetable/promote-timetable.mjs --input data/candidates/hkjc-horizon-recovery-2026-09-06-approved.json
          node scripts/timetable/build-public-timetable-view.mjs
      - name: Verify exact Rank C public recovery through September 6
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const paths = [
            ['data/candidates/jra-horizon-recovery-2026-08-18-through-2026-09-06-approved.json', 18],
            ['data/candidates/nar-horizon-recovery-2026-08-18-through-2026-09-06-approved.json', 69],
            ['data/candidates/banei-horizon-recovery-2026-08-18-through-2026-09-06-approved.json', 8],
            ['data/candidates/hkjc-horizon-recovery-2026-09-06-approved.json', 1],
          ];
          const ids = [];
          for (const [file, count] of paths) {
            const value = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (value.records.length !== count || value.review.status !== 'approved') throw new Error(`${file}: approval/count differs`);
            ids.push(...value.records.map((record) => record.meeting_id));
          }
          if (ids.length !== 96 || new Set(ids).size !== 96) throw new Error('approved recovery identity total differs');
          const canonical = JSON.parse(fs.readFileSync('data/generated/timetable/canonical/meetings.json', 'utf8'));
          const publicList = JSON.parse(fs.readFileSync('data/generated/timetable/public/meeting-list.json', 'utf8'));
          const canonicalById = new Map(canonical.meetings.map((meeting) => [meeting.meeting_id, meeting]));
          const publicById = new Map(publicList.meetings.map((meeting) => [meeting.meeting_id, meeting]));
          for (const id of ids) {
            if (canonicalById.get(id)?.capability_rank !== 'C') throw new Error(`${id}: canonical Rank C missing`);
            const meeting = publicById.get(id);
            if (!meeting || meeting.effective_public_rank !== 'C' || meeting.first_race_time_local !== null || meeting.last_race_time_local !== null) throw new Error(`${id}: public Rank C boundary differs`);
          }
          const dates = ids.map((id) => publicById.get(id).date).sort();
          if (dates[0] !== '2026-08-18' || dates.at(-1) !== '2026-09-06') throw new Error(`public recovery range differs ${dates[0]}..${dates.at(-1)}`);
          const publicMax = publicList.meetings.map((meeting) => meeting.date).sort().at(-1);
          if (publicMax !== '2026-09-06') throw new Error(`public maximum date differs ${publicMax}`);
          console.log(`AUG8_PUBLIC_RECOVERY: pass records=${ids.length} total_public=${publicList.meetings.length} max_date=${publicMax}`);
          NODE
          node scripts/validate-data.mjs
          node scripts/timetable/build-public-timetable-view.mjs --check
          git diff --check
      - name: Upload exact recovery output
        uses: actions/upload-artifact@v4
        with:
          name: calendar-august-2026-horizon-recovery-promotion-output
          retention-days: 14
          path: |
            data/candidates/jra-horizon-recovery-2026-08-18-through-2026-09-06-approved.json
            data/candidates/nar-horizon-recovery-2026-08-18-through-2026-09-06-approved.json
            data/candidates/banei-horizon-recovery-2026-08-18-through-2026-09-06-approved.json
            data/candidates/hkjc-horizon-recovery-2026-09-06-approved.json
            data/generated/timetable/horizon-recovery-2026-08-08/
            data/generated/timetable/canonical/meetings.json
            data/generated/timetable/canonical/meeting-details.json
            data/generated/timetable/public/meeting-list.json
            data/generated/timetable/public/meeting-details.json
