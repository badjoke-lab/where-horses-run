name: Calendar NAR August 24-25 A+ bounded apply

on:
  pull_request:
    paths:
      - '.github/workflows/calendar-nar-regular-refresh-2026-08-24-25-a-plus-bounded-apply.yml'
      - 'scripts/timetable/build-calendar-nar-regular-refresh-2026-08-24-through-2026-08-25-a-plus-approved-candidates.mjs'

permissions:
  contents: write

concurrency:
  group: calendar-nar-august-24-25-a-plus-bounded-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact review head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Checkout exact daily-review source evidence
        uses: actions/checkout@v4
        with:
          ref: 9806279dc43b51299124405fffb70d7010b258a9
          path: review-source
          sparse-checkout: |
            data/candidates/nar-incremental-batches/due-job-plan-2026-08-22-due-japan-nar-regular-refresh-001-run-001/batch.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Build exactly seven newly reviewed A+ candidates
        env:
          WHR_NAR_REVIEW_BATCH: ${{ github.workspace }}/review-source/data/candidates/nar-incremental-batches/due-job-plan-2026-08-22-due-japan-nar-regular-refresh-001-run-001/batch.json
        run: node scripts/timetable/build-calendar-nar-regular-refresh-2026-08-24-through-2026-08-25-a-plus-approved-candidates.mjs

      - name: Extend cumulative reviewed promotion contract
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'scripts/check-calendar-nar-incremental-v2-promotion-output-determinism.mjs';
          let text = fs.readFileSync(path, 'utf8');
          const constAnchor = "const septemberNarExtensionSeptember20Path = 'data/candidates/nar-horizon-extension-2026-09-20-approved.json';\n";
          if (!text.includes("const augustNarRegularRefreshAPlusSecondPath =")) {
            if (!text.includes(constAnchor)) throw new Error('determinism const anchor missing');
            text = text.replace(constAnchor, `${constAnchor}const augustNarRegularRefreshAPlusSecondPath = 'data/candidates/nar-regular-refresh-2026-08-24-through-2026-08-25-a-plus-approved.json';\n`);
          }
          const sequenceAnchor = '  septemberNarExtensionSeptember20Path,\n];';
          if (!text.includes('  augustNarRegularRefreshAPlusSecondPath,\n];')) {
            if (!text.includes(sequenceAnchor)) throw new Error('determinism continuation anchor missing');
            text = text.replace(sequenceAnchor, '  septemberNarExtensionSeptember20Path,\n  augustNarRegularRefreshAPlusSecondPath,\n];');
          }
          const countAnchor = '  [septemberNarExtensionSeptember20Path, [2, 0]],\n]);';
          if (!text.includes('  [augustNarRegularRefreshAPlusSecondPath, [7, 7]],')) {
            if (!text.includes(countAnchor)) throw new Error('determinism count anchor missing');
            text = text.replace(countAnchor, '  [septemberNarExtensionSeptember20Path, [2, 0]],\n  [augustNarRegularRefreshAPlusSecondPath, [7, 7]],\n]);');
          }
          fs.writeFileSync(path, text);
          NODE

      - name: Validate reviewed promotion before apply
        run: node scripts/timetable/promote-timetable.mjs --input data/candidates/nar-regular-refresh-2026-08-24-through-2026-08-25-a-plus-approved.json --dry-run

      - name: Apply reviewed Candidate to canonical timetable
        run: node scripts/timetable/promote-timetable.mjs --input data/candidates/nar-regular-refresh-2026-08-24-through-2026-08-25-a-plus-approved.json

      - name: Rebuild deterministic public and operations projections
        run: |
          node scripts/timetable/build-public-timetable-view.mjs
          node scripts/timetable/build-japan-a-plus-public-overrides.mjs
          node scripts/timetable/build-operations-status.mjs --reference-date 2026-07-01
          node scripts/timetable/build-operations-review-package.mjs

      - name: Validate applied repository state
        run: |
          node scripts/validate-data.mjs
          node scripts/check-japan-a-plus-public-overrides.mjs
          node scripts/check-calendar-operations-status.mjs
          node scripts/check-calendar-operations-review-package.mjs

      - name: Verify exact seven-record A+ publication boundary
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const ids = [
            'nar-funabashi-racecourse-2026-08-24',
            'nar-funabashi-racecourse-2026-08-25',
            'nar-kasamatsu-racecourse-2026-08-25',
            'nar-monbetsu-racecourse-2026-08-25',
            'nar-morioka-racecourse-2026-08-24',
            'nar-morioka-racecourse-2026-08-25',
            'nar-nagoya-racecourse-2026-08-24',
          ].sort();
          const candidate = JSON.parse(fs.readFileSync('data/candidates/nar-regular-refresh-2026-08-24-through-2026-08-25-a-plus-approved.json', 'utf8'));
          if (candidate.review?.status !== 'approved' || candidate.review?.promotion_target !== 'canonical-timetable-v0') throw new Error('review contract differs');
          const actualIds = candidate.records.map((record) => record.meeting_id).sort();
          if (JSON.stringify(actualIds) !== JSON.stringify(ids)) throw new Error('reviewed A+ identities differ');
          if (candidate.records.reduce((sum, record) => sum + record.timetable_rows.length, 0) !== 82) throw new Error('reviewed timetable row total differs');

          const canonical = JSON.parse(fs.readFileSync('data/generated/timetable/canonical/meetings.json', 'utf8'));
          const details = JSON.parse(fs.readFileSync('data/generated/timetable/canonical/meeting-details.json', 'utf8'));
          const publicList = JSON.parse(fs.readFileSync('data/generated/timetable/public/meeting-list.json', 'utf8'));
          const publicDetails = JSON.parse(fs.readFileSync('data/generated/timetable/public/meeting-details.json', 'utf8'));
          const canonicalById = new Map(canonical.meetings.map((row) => [row.meeting_id, row]));
          const detailById = new Map(details.details.map((row) => [row.meeting_id, row]));
          const publicById = new Map(publicList.meetings.map((row) => [row.meeting_id, row]));
          const publicDetailById = new Map(publicDetails.details.map((row) => [row.meeting_id, row]));
          for (const record of candidate.records) {
            const meeting = canonicalById.get(record.meeting_id);
            const detail = detailById.get(record.meeting_id);
            const publicMeeting = publicById.get(record.meeting_id);
            const publicDetail = publicDetailById.get(record.meeting_id);
            if (meeting?.capability_rank !== 'A+') throw new Error(`${record.meeting_id}: canonical meeting rank differs`);
            if (detail?.capability_rank !== 'A+' || detail.timetable_rows?.length !== record.timetable_rows.length) throw new Error(`${record.meeting_id}: canonical detail differs`);
            if ((publicMeeting?.effective_public_rank ?? publicMeeting?.capability_rank) !== 'A+') throw new Error(`${record.meeting_id}: public meeting rank differs`);
            if ((publicDetail?.effective_public_rank ?? publicDetail?.capability_rank) !== 'A+' || publicDetail.timetable_rows?.length !== record.timetable_rows.length) throw new Error(`${record.meeting_id}: public detail differs`);
            if (meeting.first_race_time_local !== record.first_race_time_local || meeting.last_race_time_local !== record.last_race_time_local) throw new Error(`${record.meeting_id}: canonical meeting times differ`);
          }
          const status = JSON.parse(fs.readFileSync('data/generated/timetable/operations-status.json', 'utf8'));
          if (canonical.meetings.length !== 433) throw new Error(`expected 433 canonical meetings, got ${canonical.meetings.length}`);
          if (details.details.length !== 94) throw new Error(`expected 94 canonical details, got ${details.details.length}`);
          if (status.public_projection?.meeting_count !== 420) throw new Error(`expected 420 public meetings, got ${status.public_projection?.meeting_count}`);
          if (status.public_projection?.detail_count !== 94) throw new Error(`expected 94 public details, got ${status.public_projection?.detail_count}`);
          if (status.public_projection?.latest_meeting_date !== '2026-09-20') throw new Error(`expected horizon 2026-09-20, got ${status.public_projection?.latest_meeting_date}`);
          NODE

      - name: Verify cumulative NAR promotion determinism
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-calendar-nar-incremental-v2-promotion-output-determinism.mjs

      - name: Remove one-shot workflow and commit bounded output
        run: |
          git rm .github/workflows/calendar-nar-regular-refresh-2026-08-24-25-a-plus-bounded-apply.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            data/candidates/nar-regular-refresh-2026-08-24-through-2026-08-25-a-plus-approved.json \
            data/generated/timetable/canonical/meetings.json \
            data/generated/timetable/canonical/meeting-details.json \
            data/generated/timetable/public/meeting-list.json \
            data/generated/timetable/public/meeting-details.json \
            data/generated/timetable/public/japan-a-plus-overrides.json \
            data/generated/timetable/operations-status.json \
            data/generated/timetable/operations-review-package.json \
            scripts/check-calendar-nar-incremental-v2-promotion-output-determinism.mjs \
            .github/workflows/calendar-nar-regular-refresh-2026-08-24-25-a-plus-bounded-apply.yml
          git diff --cached --check
          git commit -m "Apply next reviewed NAR A+ detail promotion"
          git push origin HEAD:post-v1-calendar-nar-a-plus-2026-08-24-25-review
