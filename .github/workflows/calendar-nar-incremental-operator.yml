name: NAR next-window review collection

on:
  pull_request:
    paths:
      - '.github/workflows/calendar-nar-incremental-operator.yml'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Collect review-only NAR window
        run: |
          node scripts/timetable/run-nar-incremental-local.mjs \
            --start-date=2026-07-05 \
            --end-date-exclusive=2026-07-08
      - name: Validate generated artifacts
        run: |
          node scripts/check-calendar-nar-incremental.mjs
          node scripts/check-calendar-runtime-import-boundary.mjs
          git status --short
      - name: Upload review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nar-next-window-review-${{ github.run_id }}
          path: |
            data/candidates/nar-incremental-meeting-candidates.json
            data/generated/timetable/nar-incremental-collection-report.json
            data/generated/timetable/nar-coverage-observation.json
            data/generated/timetable/nar-retry-targets.json
          if-no-files-found: error
          retention-days: 7
