name: NAR incremental promotion batch generator

on:
  pull_request:
    paths:
      - '.github/workflows/calendar-nar-incremental-operator.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Switch to promotion batch branch
        run: |
          git fetch origin work/nar-incremental-promotion-batch
          git switch -C work/nar-incremental-promotion-batch origin/work/nar-incremental-promotion-batch
      - name: Validate builder syntax
        run: node --check scripts/timetable/build-reviewed-nar-incremental-promotion-candidate.mjs
      - name: Generate approved promotion batch
        run: |
          node scripts/timetable/build-reviewed-nar-incremental-promotion-candidate.mjs
          node scripts/timetable/build-reviewed-nar-incremental-promotion-candidate.mjs --check
      - name: Validate normal promotion dry run
        run: |
          node scripts/timetable/promote-approved-candidate-v1.mjs \
            --input data/candidates/nar-incremental-2026-07-05-through-2026-07-07-approved.json \
            --dry-run
      - name: Confirm generated path boundary
        run: |
          changed=$(git status --porcelain --untracked-files=all | sed 's/^...//')
          echo "$changed"
          test "$changed" = "data/candidates/nar-incremental-2026-07-05-through-2026-07-07-approved.json"
      - name: Commit generated approved batch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/candidates/nar-incremental-2026-07-05-through-2026-07-07-approved.json
          git commit -m "Add approved NAR incremental promotion batch"
          git push origin HEAD:work/nar-incremental-promotion-batch
