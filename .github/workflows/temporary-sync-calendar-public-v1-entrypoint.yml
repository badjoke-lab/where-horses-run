name: Temporary Calendar Public v1 entrypoint sync

on:
  push:
    branches:
      - work/calendar-public-v1-entrypoint
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/calendar-public-v1-entrypoint
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Apply Calendar Public v1 entrypoint synchronization
        run: node scripts/temporary-sync-calendar-public-v1-entrypoint.mjs
      - name: Validate project governance entrypoint
        run: node scripts/check-project-governance-docs.mjs
      - name: Validate baseline reconciliation entrypoint
        run: node scripts/check-calendar-baseline-reconciliation.mjs
      - name: Validate Dynamic Dates entrypoint
        run: node scripts/check-calendar-dynamic-dates-release-gate.mjs
      - name: Validate Operations v1 entrypoint marker only
        run: |
          node --check scripts/check-calendar-operations-v1-release-gate.mjs
          node - <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('scripts/check-calendar-operations-v1-release-gate.mjs', 'utf8');
          if (!source.includes('Current Work ID: `WHR-CAL-PUBLIC-V1`')) throw new Error('Operations v1 checker missing Public v1 marker');
          if (!source.includes('CURRENT_WORK_ID: WHR-CAL-PUBLIC-V1')) throw new Error('Operations v1 checker output missing Public v1 marker');
          if (source.includes('Current Work ID: `WHR-CAL-UAE-ERA`') || source.includes('NEXT_PROGRAMME_WORK_ID: WHR-CAL-PUBLIC-V1')) throw new Error('Operations v1 checker retains consumed UAE/Next marker');
          console.log('OPERATIONS_V1_PUBLIC_V1_ENTRYPOINT_MARKER: pass');
          NODE
      - name: Validate Pipeline v1 entrypoint
        run: node scripts/check-calendar-pipeline-v1-release-gate.mjs
      - name: Preserve UAE handoff evidence
        run: node scripts/check-calendar-uae-era-handoff-decision.mjs
      - name: Validate diff hygiene
        run: git diff --check
      - name: Commit synchronized entrypoint state
        run: |
          if git diff --quiet; then
            echo "No synchronization changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            START-HERE.md \
            docs/project-roadmap.md \
            docs/calendar/implementation-roadmap.md \
            scripts/check-calendar-baseline-reconciliation.mjs \
            scripts/check-calendar-dynamic-dates-release-gate.mjs \
            scripts/check-calendar-operations-v1-release-gate.mjs \
            scripts/check-calendar-pipeline-v1-release-gate.mjs \
            scripts/check-project-governance-docs.mjs
          git commit -m "[CF-Pages-Skip] Switch Calendar entrypoint to Public v1"
          git pull --rebase origin work/calendar-public-v1-entrypoint
          git push origin HEAD:work/calendar-public-v1-entrypoint
