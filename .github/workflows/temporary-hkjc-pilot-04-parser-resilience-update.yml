name: Temporary HKJC PILOT-04 parser resilience update

on:
  push:
    branches:
      - work/calendar-hkjc-fixture-parser-resilience

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/calendar-hkjc-fixture-parser-resilience
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Apply PILOT-04 parser resilience update
        run: node scripts/temporary-apply-hkjc-pilot-04-parser-resilience.mjs
      - name: Validate changed implementation
        run: |
          node --check scripts/timetable/hkjc-fixture-artifact-bridge-core.mjs
          node scripts/check-calendar-hkjc-fixture-artifact-bridge.mjs
      - name: Commit update when needed
        run: |
          if git diff --quiet; then
            echo "No implementation changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/timetable/hkjc-fixture-artifact-bridge-core.mjs \
            data/fixtures/calendar-hkjc-fixture-artifact-bridge-fixtures-v1.json \
            scripts/check-calendar-hkjc-fixture-artifact-bridge.mjs \
            docs/calendar/hkjc-live-fixture-artifact-bridge.md
          git commit -m "[CF-Pages-Skip] Add HKJC fail-closed empty-window semantics"
          git push origin HEAD:work/calendar-hkjc-fixture-parser-resilience
