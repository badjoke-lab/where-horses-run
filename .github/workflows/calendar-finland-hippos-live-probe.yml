name: Finland Hippos live probe

on:
  pull_request:
    paths:
      - '.github/workflows/calendar-finland-hippos-live-probe.yml'
      - 'scripts/timetable/finland-hippos-core.mjs'
      - 'scripts/timetable/run-finland-hippos-official-window.mjs'
      - 'scripts/check-finland-hippos-adapter.mjs'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Validate Finland adapter
        run: npm run validate:finland-hippos
      - name: Probe live Suomen Hippos 30-day window
        run: |
          mkdir -p .calendar-finland-probe
          node scripts/timetable/run-finland-hippos-official-window.mjs \
            --as-of=2026-09-25 \
            --days=30 \
            --output=.calendar-finland-probe/finland.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const data=JSON.parse(fs.readFileSync('.calendar-finland-probe/finland.json','utf8'));
          console.log(JSON.stringify({
            records:data.records.length,
            venues:[...new Set(data.records.map(r=>r.racecourse_id))].sort(),
            dates:[...new Set(data.records.map(r=>r.date))].sort(),
            diagnostics:data.diagnostics,
            discovery:data.discovery
          }));
          NODE
