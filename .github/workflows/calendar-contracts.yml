name: Calendar contracts

on:
  pull_request:
    paths:
      - 'START-HERE.md'
      - 'docs/project-roadmap.md'
      - 'docs/calendar/**'
      - 'docs/country-pages/98-country-tracker.tsv'
      - 'docs/timetable-source-tests/**'
      - 'docs/specs/authority-source-inventory-schema.md'
      - 'docs/specs/authority-source-inventory-2026-06-28-addendum.md'
      - 'data/static/source-test-v2.schema.json'
      - 'data/static/calendar-readiness.schema.json'
      - 'data/static/calendar-readiness-registry.json'
      - 'data/static/calendar-coverage-observation.schema.json'
      - 'data/static/authority-source-inventory.schema.json'
      - 'data/static/authority-source-inventory.json'
      - 'data/static/racecourses.json'
      - 'scripts/timetable/coverage-observation-validation.mjs'
      - 'scripts/check-calendar-coverage-observation-schema.mjs'
      - 'scripts/check-calendar-contracts.mjs'
      - 'scripts/check-authority-source-inventory-schema.mjs'
      - '.github/workflows/calendar-contracts.yml'
  push:
    branches: [main]
    paths:
      - 'START-HERE.md'
      - 'docs/project-roadmap.md'
      - 'docs/calendar/**'
      - 'docs/country-pages/98-country-tracker.tsv'
      - 'docs/timetable-source-tests/**'
      - 'docs/specs/authority-source-inventory-schema.md'
      - 'docs/specs/authority-source-inventory-2026-06-28-addendum.md'
      - 'data/static/source-test-v2.schema.json'
      - 'data/static/calendar-readiness.schema.json'
      - 'data/static/calendar-readiness-registry.json'
      - 'data/static/calendar-coverage-observation.schema.json'
      - 'data/static/authority-source-inventory.schema.json'
      - 'data/static/authority-source-inventory.json'
      - 'data/static/racecourses.json'
      - 'scripts/timetable/coverage-observation-validation.mjs'
      - 'scripts/check-calendar-coverage-observation-schema.mjs'
      - 'scripts/check-calendar-contracts.mjs'
      - 'scripts/check-authority-source-inventory-schema.mjs'
      - '.github/workflows/calendar-contracts.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture Calendar contract validation
        shell: bash
        run: |
          set +e
          node scripts/check-calendar-contracts.mjs > /tmp/calendar-contracts.log 2>&1
          status=$?
          printf '%s\n' "$status" > /tmp/calendar-contracts.exit
          cat /tmp/calendar-contracts.log
          exit 0
      - name: Upload Calendar contract diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calendar-contracts-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: error
          path: |
            /tmp/calendar-contracts.log
            /tmp/calendar-contracts.exit
      - name: Enforce Calendar contract validation
        run: |
          status="$(cat /tmp/calendar-contracts.exit)"
          if [ "$status" != "0" ]; then
            exit "$status"
          fi
      - name: Validate Coverage Observation schema
        run: node scripts/check-calendar-coverage-observation-schema.mjs
      - name: Validate authority source inventory compatibility
        run: node scripts/check-authority-source-inventory-schema.mjs
