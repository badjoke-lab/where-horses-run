name: Philippines official current Calendar source probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/calendar-philippines-source-probe.yml'
      - 'scripts/timetable/probe-philippines-source.mjs'

permissions:
  contents: read

jobs:
  source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/timetable/probe-philippines-source.mjs
