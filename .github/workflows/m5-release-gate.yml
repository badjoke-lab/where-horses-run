name: M5 release gate

on:
  pull_request:
    paths:
      - 'docs/runbooks/m5-release-note.md'
      - 'docs/runbooks/m5-scheduled-candidate-generation-design.md'
      - 'docs/runbooks/m5-auto-candidate-pr-generation.md'
      - 'docs/runbooks/m5-human-review-workflow.md'
      - 'scripts/timetable/scheduled-candidate-run-log.mjs'
      - 'scripts/timetable/candidate-diff-page.mjs'
      - 'scripts/timetable/human-review-decision.mjs'
      - 'scripts/run-m5-tjk-scheduled-dry-run.mjs'
      - 'src/lib/timetable/publicFreshnessState.mjs'
      - 'src/components/TimetableMeetingList.astro'
      - '.github/workflows/calendar-tjk-current-future-candidates.yml'
      - '.github/workflows/m5-human-review.yml'
      - 'scripts/check-m5-release-gate.mjs'
      - '.github/workflows/m5-release-gate.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/runbooks/m5-release-note.md'
      - 'scripts/check-m5-release-gate.mjs'
      - '.github/workflows/m5-release-gate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - run: node scripts/check-m5-release-gate.mjs
      - run: git diff --exit-code
