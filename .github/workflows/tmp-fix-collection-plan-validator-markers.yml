name: Temporary Collection Plan validator marker fix

on:
  pull_request:
    paths:
      - 'scripts/tmp-fix-collection-plan-validator-markers.mjs'
      - '.github/workflows/tmp-fix-collection-plan-validator-markers.yml'
  push:
    branches:
      - work/calendar-collection-plan-schema

permissions:
  contents: write

jobs:
  fix-and-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/calendar-collection-plan-schema
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Fix validator markers
        run: node scripts/tmp-fix-collection-plan-validator-markers.mjs
      - name: Validate Plan contract
        run: node scripts/check-calendar-collection-plan.mjs
      - name: Commit validator fix and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check-calendar-collection-plan.mjs
          git rm \
            .github/workflows/tmp-fix-collection-plan-validator-markers.yml \
            scripts/tmp-fix-collection-plan-validator-markers.mjs
          git diff --cached --check
          git commit -m "[CF-Pages-Skip] Fix Collection Plan validator contract markers"
          git push origin HEAD:work/calendar-collection-plan-schema
