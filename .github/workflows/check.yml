name: Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

  apply-september-horizon-extension:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'post-v1-calendar-horizon-2026-09-17-review'
    name: Apply September horizon extension
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout extension branch
        uses: actions/checkout@v4
        with:
          ref: post-v1-calendar-horizon-2026-09-17-review
          fetch-depth: 0
          path: work

      - name: Checkout exact daily-review source evidence
        uses: actions/checkout@v4
        with:
          ref: 1124243b474615092a9ba85bc0eafa1c641c82f6
          path: review-source
          sparse-checkout: |
            data/candidates/nar-incremental-batches/due-job-plan-2026-08-19-due-japan-nar-coverage-gap-001-run-001/batch.json
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Rebuild reviewed Rank C candidate envelope
        working-directory: work
        env:
          WHR_NAR_REVIEW_BATCH: ${{ github.workspace }}/review-source/data/candidates/nar-incremental-batches/due-job-plan-2026-08-19-due-japan-nar-coverage-gap-001-run-001/batch.json
        run: node scripts/timetable/build-calendar-september-2026-horizon-extension-approved-candidates.mjs

      - name: Verify reviewed candidate remains deterministic
        working-directory: work
        run: git diff --exit-code -- data/candidates/nar-horizon-extension-2026-09-17-approved.json

      - name: Dry-run promotion validation
        working-directory: work
        run: node scripts/timetable/promote-timetable.mjs --input data/candidates/nar-horizon-extension-2026-09-17-approved.json --dry-run

      - name: Apply reviewed candidates to canonical timetable
        working-directory: work
        run: node scripts/timetable/promote-timetable.mjs --input data/candidates/nar-horizon-extension-2026-09-17-approved.json

      - name: Build deterministic public timetable projection
        working-directory: work
        run: node scripts/timetable/build-public-timetable-view.mjs

      - name: Rebuild coupled public and operations derivatives
        working-directory: work
        run: |
          node scripts/timetable/build-japan-a-plus-public-overrides.mjs
          node scripts/timetable/build-operations-status.mjs --reference-date 2026-07-01
          node scripts/timetable/build-operations-review-package.mjs

      - name: Validate generated repository data
        working-directory: work
        run: node scripts/validate-data.mjs

      - name: Verify coupled public derivatives
        working-directory: work
        run: |
          node scripts/check-japan-a-plus-public-overrides.mjs
          node scripts/check-calendar-operations-status.mjs
          node scripts/check-calendar-operations-review-package.mjs

      - name: Verify exact Rank C extension output
        working-directory: work
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const candidate = JSON.parse(fs.readFileSync('data/candidates/nar-horizon-extension-2026-09-17-approved.json', 'utf8'));
          const ids = candidate.records.map((record) => record.meeting_id);
          if (candidate.review?.status !== 'approved' || ids.length !== 8 || new Set(ids).size !== 8) throw new Error('approved extension envelope differs');
          for (const record of candidate.records) {
            if (record.capability_rank !== 'C' || record.first_race_time_local !== null || record.last_race_time_local !== null || record.timetable_rows.length !== 0) throw new Error(`${record.meeting_id}: exceeds Rank C publication boundary`);
          }
          const canonical = JSON.parse(fs.readFileSync('data/generated/timetable/canonical/meetings.json', 'utf8'));
          const publicList = JSON.parse(fs.readFileSync('data/generated/timetable/public/meeting-list.json', 'utf8'));
          const canonicalById = new Map(canonical.meetings.map((meeting) => [meeting.meeting_id, meeting]));
          const publicById = new Map(publicList.meetings.map((meeting) => [meeting.meeting_id, meeting]));
          for (const id of ids) {
            if (canonicalById.get(id)?.capability_rank !== 'C') throw new Error(`${id}: canonical Rank C output missing`);
            if (publicById.get(id)?.capability_rank !== 'C') throw new Error(`${id}: public Rank C output missing`);
          }
          const dates = ids.map((id) => publicById.get(id).date).sort();
          if (dates[0] !== '2026-09-16' || dates.at(-1) !== '2026-09-17') throw new Error('public extension date range differs');
          console.log(JSON.stringify({ approved_records: ids.length, first_date: dates[0], last_date: dates.at(-1), rank: 'C' }));
          NODE

      - name: Verify deterministic public projection
        working-directory: work
        run: node scripts/timetable/build-public-timetable-view.mjs --check

      - name: Commit reviewed output and restore Check workflow
        working-directory: work
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout origin/main -- .github/workflows/check.yml
          git add \
            .github/workflows/check.yml \
            data/candidates/nar-horizon-extension-2026-09-17-approved.json \
            data/generated/timetable/canonical/meetings.json \
            data/generated/timetable/canonical/meeting-details.json \
            data/generated/timetable/public/meeting-list.json \
            data/generated/timetable/public/meeting-details.json \
            data/generated/timetable/public/japan-a-plus-overrides.json \
            data/generated/timetable/operations-status.json \
            data/generated/timetable/operations-review-package.json
          git diff --cached --check
          git diff --cached --quiet && { echo 'No reviewed extension output to commit'; exit 1; }
          git commit -m 'Apply reviewed September calendar horizon extension'
          git push origin HEAD:post-v1-calendar-horizon-2026-09-17-review
