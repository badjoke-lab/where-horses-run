name: Race Acquisition Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  acquisition:
    name: Acquisition contracts and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Install dependencies
        run: npm install

      - name: Check race acquisition
        run: npm run check

      - name: Check racecourse location contract
        run: node scripts/check-racecourse-location-schema.mjs

      - name: Print MAP-002 racecourse target ledger
        run: node scripts/print-racecourse-location-targets.mjs

      - name: Check public racecourse location registry
        run: node scripts/check-racecourse-location-registry.mjs

      - name: Check current NAR RaceList markup
        run: node scripts/check-nar-racelist-current-markup.mjs
