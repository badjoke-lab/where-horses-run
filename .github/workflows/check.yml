name: Race Acquisition Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  acquisition:
    name: Acquisition contracts and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Install dependencies
        run: npm install

      - name: Check race acquisition
        run: npm run check

      - name: Check sitemap freshness metadata
        run: node scripts/check-sitemap-freshness.mjs dist/sitemap.xml

      - name: Check IndexNow changed-URL logic
        run: |
          node --check scripts/indexnow-changed-urls.mjs
          node scripts/indexnow-changed-urls.mjs --before=HEAD --after=HEAD

      - name: Check meeting lifecycle state
        run: node scripts/check-meeting-lifecycle-state.mjs

      - name: Check Calendar context state
        run: node scripts/check-calendar-context-state.mjs

      - name: Check Calendar stream and brand regressions
        run: node scripts/check-calendar-stream-brand-regressions.mjs

      - name: Check Japan freshness local date
        run: node scripts/check-japan-freshness-local-date.mjs

      - name: Check meeting stream state
        run: node scripts/check-meeting-stream-state.mjs

      - name: Check Calendar display names
        run: node scripts/check-calendar-display-names.mjs

      - name: Check map UI contract
        run: node scripts/check-map-ui-contract.mjs

      - name: Check racecourse location contract
        run: node scripts/check-racecourse-location-schema.mjs

      - name: Print MAP-002 racecourse target ledger
        run: node scripts/print-racecourse-location-targets.mjs

      - name: Check public racecourse location registry
        run: node scripts/check-racecourse-location-registry.mjs

      - name: Check current NAR RaceList markup
        run: node scripts/check-nar-racelist-current-markup.mjs
