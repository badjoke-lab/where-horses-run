name: Race Acquisition Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  acquisition:
    name: Acquisition contracts and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Install dependencies
        run: npm install

      - name: Check race acquisition
        run: npm run check
