name: Check

on:
  pull_request:
  push:
    branches:
      - main
      - post-v1-calendar-horizon-2026-09-15

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

  apply-september-horizon-recovery:
    if: github.event_name == 'push' && github.ref == 'refs/heads/post-v1-calendar-horizon-2026-09-15'
    name: Apply September horizon recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: post-v1-calendar-horizon-2026-09-15
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Build reviewed Rank C candidate envelope
        run: node scripts/timetable/build-calendar-september-2026-horizon-recovery-approved-candidates.mjs

      - name: Dry-run Promotion Validation
        run: node scripts/timetable/promote-timetable.mjs --input data/candidates/nar-horizon-recovery-2026-09-15-approved.json --dry-run

      - name: Apply reviewed candidates to canonical timetable
        run: node scripts/timetable/promote-timetable.mjs --input data/candidates/nar-horizon-recovery-2026-09-15-approved.json

      - name: Build deterministic public timetable projection
        run: node scripts/timetable/build-public-timetable-view.mjs

      - name: Validate repository data
        run: node scripts/validate-data.mjs

      - name: Verify deterministic public projection
        run: node scripts/timetable/build-public-timetable-view.mjs --check

      - name: Verify Rank C-only recovery boundary
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const candidate = JSON.parse(fs.readFileSync('data/candidates/nar-horizon-recovery-2026-09-15-approved.json', 'utf8'));
          if (candidate.review?.status !== 'approved') throw new Error('candidate envelope is not approved');
          const ids = candidate.records.map((record) => record.meeting_id);
          if (!ids.length || new Set(ids).size !== ids.length) throw new Error('candidate IDs are empty or duplicated');
          for (const record of candidate.records) {
            if (record.date < '2026-09-07' || record.date > '2026-09-15') throw new Error(`${record.meeting_id}: outside reviewed recovery window`);
            if (record.capability_rank !== 'C' || record.first_race_time_local !== null || record.last_race_time_local !== null || record.timetable_rows.length !== 0) throw new Error(`${record.meeting_id}: exceeds Rank C publication boundary`);
          }
          const canonical = JSON.parse(fs.readFileSync('data/generated/timetable/canonical/meetings.json', 'utf8'));
          const publicList = JSON.parse(fs.readFileSync('data/generated/timetable/public/meeting-list.json', 'utf8'));
          const canonicalById = new Map(canonical.meetings.map((meeting) => [meeting.meeting_id, meeting]));
          const publicById = new Map(publicList.meetings.map((meeting) => [meeting.meeting_id, meeting]));
          for (const id of ids) {
            if (canonicalById.get(id)?.capability_rank !== 'C') throw new Error(`${id}: canonical Rank C output missing`);
            if (publicById.get(id)?.capability_rank !== 'C') throw new Error(`${id}: public Rank C output missing`);
          }
          const dates = ids.map((id) => publicById.get(id).date).sort();
          if (dates[0] !== '2026-09-07' || dates.at(-1) !== '2026-09-15') throw new Error('public recovery horizon differs');
          console.log(JSON.stringify({ approved_records: ids.length, first_date: dates[0], last_date: dates.at(-1), rank: 'C' }));
          NODE

      - name: Commit reviewed output and restore temporary workflow changes
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout origin/main -- .github/workflows/check.yml
          git rm --ignore-unmatch .github/workflows/calendar-september-2026-horizon-recovery-apply.yml
          git add \
            data/candidates/nar-horizon-recovery-2026-09-15-approved.json \
            data/generated/timetable/canonical/meetings.json \
            data/generated/timetable/canonical/meeting-details.json \
            data/generated/timetable/public/meeting-list.json \
            data/generated/timetable/public/meeting-details.json
          git diff --cached --check
          git diff --cached --quiet && { echo 'No reviewed recovery output to commit'; exit 1; }
          git commit -m 'Apply reviewed September calendar horizon recovery'
          git push origin HEAD:post-v1-calendar-horizon-2026-09-15
