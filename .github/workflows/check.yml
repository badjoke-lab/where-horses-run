name: Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

  patch-hkjc-promotion-contract-fixture:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'post-v1-calendar-hkjc-september-2026-review'
    name: Patch HKJC promotion contract fixture
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: post-v1-calendar-hkjc-september-2026-review
          fetch-depth: 0

      - name: Patch promotion contract fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/check-calendar-pipeline-v1-promotion.mjs')
          s = p.read_text()

          old = """const approved = clone(sample);\napproved.review = {\n  status: 'approved',\n  reviewed_at: '2026-07-01T01:00:00.000Z',"""
          new = """const approved = clone(sample);\nconst hkjcAuthoritySource = authorityInventory.records.find((record) =>\n  record.country_id === 'hong-kong' && record.authority_id === 'hkjc' && record.official_source_id === 'hkjc-fixture-list'\n);\nconst hkjcReadiness = readinessRegistry.records.find((record) =>\n  record.authority_source_key === 'hong-kong/hkjc/hkjc-fixture-list'\n);\nif (!hkjcAuthoritySource || !hkjcReadiness) throw new Error('HKJC promotion test fixtures require reviewed source records');\nconst hkjcMinimumCheckedDate = [hkjcAuthoritySource.last_checked_date, hkjcReadiness.checked_date].sort().at(-1);\nconst hkjcSourceCheckedAt = `${hkjcMinimumCheckedDate}T00:00:00.000Z`;\nconst hkjcReviewAt = `${hkjcMinimumCheckedDate}T01:00:00.000Z`;\n\napproved.review = {\n  status: 'approved',\n  reviewed_at: hkjcReviewAt,"""
          if old not in s:
              raise SystemExit('approved fixture marker missing')
          s = s.replace(old, new, 1)

          old = "approved.records = approved.records.map((record) => ({ ...record, review_status: 'approved' }));"
          new = """approved.records = approved.records.map((record) => ({\n  ...record,\n  review_status: 'approved',\n  source: { ...record.source, checked_at: hkjcSourceCheckedAt },\n}));"""
          if old not in s:
              raise SystemExit('approved records marker missing')
          s = s.replace(old, new, 1)

          old = """  lowerRank.generated_at = '2026-07-01T01:30:00.000Z';\n  lowerRank.review.reviewed_at = '2026-07-01T02:00:00.000Z';"""
          new = """  lowerRank.generated_at = `${hkjcMinimumCheckedDate}T01:30:00.000Z`;\n  lowerRank.review.reviewed_at = `${hkjcMinimumCheckedDate}T02:00:00.000Z`;"""
          if old not in s:
              raise SystemExit('lower-rank marker missing')
          s = s.replace(old, new, 1)

          old = """const wrongRacecourse = clone(approved);\nwrongRacecourse.records[0].racecourse_id = 'happy-valley-racecourse';\nwrongRacecourse.records[0].meeting_id = 'hkjc-happy-valley-racecourse-2026-06-07';\nexpectThrow('outside readiness racecourse scope', () => promoteApprovedCandidateV1({ ...baseArgs, candidate: wrongRacecourse }), 'outside reviewed readiness scope');"""
          new = """const wrongRacecourse = clone(approved);\nwrongRacecourse.records[0].racecourse_id = 'happy-valley-racecourse';\nwrongRacecourse.records[0].meeting_id = 'hkjc-happy-valley-racecourse-2026-06-07';\nconst shaTinOnlyReadiness = clone(readinessRegistry);\nshaTinOnlyReadiness.records.find((record) => record.authority_source_key === 'hong-kong/hkjc/hkjc-fixture-list').racecourse_ids = ['sha-tin-racecourse'];\nexpectThrow('outside readiness racecourse scope', () => promoteApprovedCandidateV1({\n  ...baseArgs,\n  candidate: wrongRacecourse,\n  readinessRegistry: shaTinOnlyReadiness,\n}), 'outside reviewed readiness scope');"""
          if old not in s:
              raise SystemExit('outside-scope marker missing')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - name: Validate patched promotion contract
        run: node scripts/check-calendar-pipeline-v1-promotion.mjs

      - name: Commit patch and restore Check workflow
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout origin/main -- .github/workflows/check.yml
          git add .github/workflows/check.yml scripts/check-calendar-pipeline-v1-promotion.mjs
          git diff --cached --check
          git diff --cached --quiet && { echo 'No contract patch to commit'; exit 1; }
          git commit -m 'Update HKJC promotion contract fixture'
          git push origin HEAD:post-v1-calendar-hkjc-september-2026-review
