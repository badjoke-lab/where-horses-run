name: Calendar Rank-aware Retry Queue

on:
  pull_request:
    paths:
      - 'data/static/calendar-rank-aware-retry-queue.schema.json'
      - 'data/fixtures/calendar-rank-aware-retry-queue-fixtures-v1.json'
      - 'data/fixtures/calendar-rank-aware-retry-queue-invalid-cases-v1.json'
      - 'data/generated/timetable/nar-incremental-batches/**/retry-targets.json'
      - 'data/generated/timetable/canonical/meetings.json'
      - 'data/static/calendar-acquisition-registry.json'
      - 'scripts/timetable/rank-aware-retry-queue-validation.mjs'
      - 'scripts/timetable/load-calendar-acquisition-registry.mjs'
      - 'scripts/check-calendar-rank-aware-retry-queue.mjs'
      - 'scripts/check-calendar-acquisition-registry.mjs'
      - 'scripts/check-project-governance-docs.mjs'
      - 'docs/calendar/rank-aware-retry-queue.md'
      - 'docs/calendar/acquisition-control-plane-implementation-plan.md'
      - 'docs/calendar/machine-readable-contracts.md'
      - 'docs/calendar/README.md'
      - 'docs/calendar/implementation-roadmap.md'
      - 'docs/project-roadmap.md'
      - 'START-HERE.md'
      - '.github/workflows/calendar-rank-aware-retry-queue.yml'
  push:
    branches:
      - main
    paths:
      - 'data/static/calendar-rank-aware-retry-queue.schema.json'
      - 'data/fixtures/calendar-rank-aware-retry-queue-fixtures-v1.json'
      - 'data/fixtures/calendar-rank-aware-retry-queue-invalid-cases-v1.json'
      - 'data/generated/timetable/nar-incremental-batches/**/retry-targets.json'
      - 'data/generated/timetable/canonical/meetings.json'
      - 'data/static/calendar-acquisition-registry.json'
      - 'scripts/timetable/rank-aware-retry-queue-validation.mjs'
      - 'scripts/check-calendar-rank-aware-retry-queue.mjs'
      - 'docs/calendar/rank-aware-retry-queue.md'
      - 'docs/calendar/acquisition-control-plane-implementation-plan.md'
      - 'docs/calendar/machine-readable-contracts.md'
      - 'docs/calendar/README.md'
      - 'docs/calendar/implementation-roadmap.md'
      - 'docs/project-roadmap.md'
      - 'START-HERE.md'
      - '.github/workflows/calendar-rank-aware-retry-queue.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Check Node syntax
        run: |
          node --check scripts/timetable/rank-aware-retry-queue-validation.mjs
          node --check scripts/check-calendar-rank-aware-retry-queue.mjs

      - name: Validate Rank-aware Retry Queue contract and fixtures
        run: node scripts/check-calendar-rank-aware-retry-queue.mjs

      - name: Validate Acquisition Registry dependency
        run: node scripts/check-calendar-acquisition-registry.mjs

      - name: Validate Calendar contracts and governance
        run: |
          node scripts/check-calendar-contracts.mjs
          node scripts/check-project-governance-docs.mjs

      - name: Validate runtime import boundary
        run: node scripts/check-calendar-runtime-import-boundary.mjs

      - name: Check diff formatting
        run: git diff --check
