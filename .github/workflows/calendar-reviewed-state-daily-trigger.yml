name: Calendar reviewed state daily acquisition trigger

on:
  pull_request:
    paths:
      - '.github/workflows/calendar-reviewed-state-daily-trigger.yml'
      - 'data/static/calendar-reviewed-source-coverage-v1.json'
      - 'data/static/calendar-reviewed-source-health-v1.json'
      - 'scripts/timetable/load-calendar-reviewed-source-coverage.mjs'
      - 'scripts/timetable/build-calendar-live-planner-state.mjs'
      - 'scripts/check-calendar-reviewed-source-coverage.mjs'
      - 'scripts/check-calendar-reviewed-source-health.mjs'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/calendar-reviewed-state-daily-trigger.yml'
      - 'data/static/calendar-reviewed-source-coverage-v1.json'
      - 'data/static/calendar-reviewed-source-health-v1.json'
      - 'scripts/timetable/load-calendar-reviewed-source-coverage.mjs'
      - 'scripts/timetable/build-calendar-live-planner-state.mjs'

permissions:
  contents: read

concurrency:
  group: calendar-reviewed-state-daily-trigger-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-reviewed-state:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Verify reviewed source coverage
        run: node scripts/check-calendar-reviewed-source-coverage.mjs
      - name: Verify reviewed source health
        run: node scripts/check-calendar-reviewed-source-health.mjs
      - name: Check formatting
        run: git diff --check

  dispatch-daily-acquisition:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify-reviewed-state
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch the canonical daily acquisition workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run calendar-daily-acquisition.yml --ref main
