name: One-shot country map parity fix

on:
  push:
    branches:
      - fix/country-racecourse-count-map-parity-20260911
    paths:
      - '.github/workflows/one-shot-country-map-parity.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/country-racecourse-count-map-parity-20260911
          fetch-depth: 0

      - name: Apply data and map parity fixes
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const replaceOnce = (text, from, to, label) => {
            const first = text.indexOf(from);
            if (first < 0) throw new Error(`${label}: source snippet not found`);
            if (text.indexOf(from, first + from.length) >= 0) throw new Error(`${label}: source snippet occurs more than once`);
            return text.slice(0, first) + to + text.slice(first + from.length);
          };

          // Chile: remove the stale duplicate physical venue identity. The canonical
          // Calendar/master identity is hipodromo-chile in racecourses.json.
          const chilePath = 'data/static/country-page-racecourses-01-04.json';
          const chileText = fs.readFileSync(chilePath, 'utf8');
          const chileLines = chileText.split('\n');
          const legacyIndex = chileLines.findIndex((line) => line.includes('"id":"hipodromo-chile-racecourse"'));
          if (legacyIndex < 0) throw new Error('legacy Hipodromo Chile duplicate not found');
          chileLines.splice(legacyIndex, 1);
          fs.writeFileSync(chilePath, chileLines.join('\n'));

          // Country pages should show one physical marker per listed racecourse.
          const mapPath = 'src/components/RacecourseMap.astro';
          let map = fs.readFileSync(mapPath, 'utf8');
          map = replaceOnce(map,
            '  initialZoom?: number;\n  geojsonUrl?: string;',
            '  initialZoom?: number;\n  clusterPoints?: boolean;\n  geojsonUrl?: string;',
            'RacecourseMap props');
          map = replaceOnce(map,
            '  initialZoom = 2,\n  geojsonUrl =',
            '  initialZoom = 2,\n  clusterPoints = true,\n  geojsonUrl =',
            'RacecourseMap defaults');
          map = replaceOnce(map,
            '  data-initial-zoom={String(initialZoom)}\n  data-geojson-url={geojsonUrl}',
            "  data-initial-zoom={String(initialZoom)}\n  data-cluster-points={clusterPoints ? 'true' : 'false'}\n  data-geojson-url={geojsonUrl}",
            'RacecourseMap dataset');
          map = replaceOnce(map,
            "    const initialZoom = Number(root.dataset.initialZoom || '2');\n    const geojsonUrl =",
            "    const initialZoom = Number(root.dataset.initialZoom || '2');\n    const clusterPoints = root.dataset.clusterPoints !== 'false';\n    const geojsonUrl =",
            'RacecourseMap client config');
          map = replaceOnce(map,
            '          cluster: features.length > 1,',
            '          cluster: clusterPoints && features.length > 1,',
            'RacecourseMap source cluster flag');
          fs.writeFileSync(mapPath, map);

          const hubPath = 'src/components/CountryHubPage.astro';
          let hub = fs.readFileSync(hubPath, 'utf8');
          hub = replaceOnce(hub,
            '<RacecourseMap racecourseIds={countryMapRacecourseIds} visibleRacecourseIds={countryMapRacecourseIds} initialZoom={4} ariaLabel=',
            '<RacecourseMap racecourseIds={countryMapRacecourseIds} visibleRacecourseIds={countryMapRacecourseIds} initialZoom={4} clusterPoints={false} ariaLabel=',
            'CountryHub unclustered country map');
          fs.writeFileSync(hubPath, hub);

          const checkPath = 'scripts/check-country-page-map-scope.mjs';
          let check = fs.readFileSync(checkPath, 'utf8');
          check = replaceOnce(check,
            "const component = fs.readFileSync('src/components/CountryHubPage.astro', 'utf8');\nconst registry =",
            "const component = fs.readFileSync('src/components/CountryHubPage.astro', 'utf8');\nconst mapComponent = fs.readFileSync('src/components/RacecourseMap.astro', 'utf8');\nconst registry =",
            'validator map component read');
          check = replaceOnce(check,
            "assert.match(component, /visibleRacecourseIds=\\{countryMapRacecourseIds\\}/);",
            "assert.match(component, /visibleRacecourseIds=\\{countryMapRacecourseIds\\}/);\nassert.match(component, /clusterPoints=\\{false\\}/, 'Country pages must render physical racecourses without clustering them together.');\nassert.match(mapComponent, /cluster: clusterPoints && features\\.length > 1,/, 'RacecourseMap must honor the clusterPoints switch.');",
            'validator cluster assertions');
          check = replaceOnce(check,
            "assert.equal(expectedCountryMapIds.length, 41, 'expected 41 regression racecourses');",
            "const racecourseDataPaths = [\n  'data/static/racecourses.json',\n  'data/static/racecourses-extensions.json',\n  'data/static/racecourses-public-timetable-identities-v1.json',\n  'data/static/country-page-racecourses-01-04.json',\n  'data/static/country-page-racecourses-11-oman.json',\n  'data/static/country-page-racecourses-12-zimbabwe.json',\n];\nconst racecourseRecords = racecourseDataPaths.flatMap((path) => JSON.parse(fs.readFileSync(path, 'utf8')));\nconst activeIdsForCountry = (countryId) => [...new Set(racecourseRecords\n  .filter((record) => record?.country_id === countryId && ['active', 'current'].includes(record?.status))\n  .map((record) => record.id))].sort();\n\nassert.deepEqual(activeIdsForCountry('chile'), [\n  'club-hipico-de-concepcion-racecourse',\n  'club-hipico-de-santiago-racecourse',\n  'hipodromo-chile',\n  'valparaiso-sporting-club-racecourse',\n].sort(), 'Chile must expose four physical active racecourses with no legacy duplicate identity.');\nassert.deepEqual(activeIdsForCountry('south-korea'), [\n  'busan-gyeongnam-racecourse',\n  'jeju-racecourse',\n  'seoul-racecourse',\n  'yeongcheon-racecourse',\n].sort(), 'South Korea must expose four active racecourses.');\n\nassert.equal(expectedCountryMapIds.length, 41, 'expected 41 regression racecourses');",
            'validator country identity parity assertions');
          check = replaceOnce(check,
            "console.log('ACTIVE_COUNTRY_MAP_41_LOCATIONS: pass');",
            "console.log('ACTIVE_COUNTRY_MAP_41_LOCATIONS: pass');\nconsole.log('CHILE_LIST_MAP_PARITY_4_OF_4: pass');\nconsole.log('SOUTH_KOREA_LIST_MAP_PARITY_4_OF_4: pass');\nconsole.log('COUNTRY_MAP_UNCLUSTERED_PHYSICAL_POINTS: pass');",
            'validator parity logs');
          fs.writeFileSync(checkPath, check);

          const workflowPath = '.github/workflows/racecourse-map-regression.yml';
          let workflow = fs.readFileSync(workflowPath, 'utf8');
          workflow = replaceOnce(workflow,
            "      - 'data/static/racecourse-locations-v1.json'\n      - 'data/static/racecourse-location-supplement-evidence-v1.json'",
            "      - 'data/static/racecourse-locations-v1.json'\n      - 'data/static/racecourse-location-supplement-evidence-v1.json'\n      - 'data/static/racecourses.json'\n      - 'data/static/country-page-racecourses-01-04.json'",
            'regression workflow data paths');
          workflow = replaceOnce(workflow,
            "      - 'src/components/CountryHubPage.astro'",
            "      - 'src/components/CountryHubPage.astro'\n      - 'src/components/RacecourseMap.astro'",
            'regression workflow component paths');
          fs.writeFileSync(workflowPath, workflow);

          fs.unlinkSync('.github/workflows/one-shot-country-map-parity.yml');
          NODE

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: align country racecourse counts with map points'
          git push origin HEAD:fix/country-racecourse-count-map-parity-20260911
