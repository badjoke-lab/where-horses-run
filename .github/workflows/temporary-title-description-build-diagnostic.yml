name: Temporary title description build diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - 'astro.config.mjs'
      - 'scripts/title-description-normalization-integration.mjs'
      - '.github/workflows/temporary-title-description-build-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install dependencies without generating a lockfile
        run: npm install --package-lock=false
      - name: Build and capture diagnostics
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee title-description-build.log
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: title-description-build-diagnostic
          path: title-description-build.log
          retention-days: 1
