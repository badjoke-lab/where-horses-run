name: Temporary activate UAE ERA detail recovery

on:
  pull_request:
  push:
    branches:
      - agent/uae-era-detail-recovery

permissions:
  contents: write

jobs:
  synchronize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/uae-era-detail-recovery
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Repair temporary synchronization quoting
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/temporary-activate-uae-era-detail-recovery.mjs')
          text = path.read_text()
          text = text.replace("\\\\`", "'")
          path.write_text(text)
          PY
          node --check scripts/temporary-activate-uae-era-detail-recovery.mjs
      - name: Apply reviewed UAE detail activation
        run: node scripts/temporary-activate-uae-era-detail-recovery.mjs
      - name: Validate synchronized contracts
        run: |
          set +e
          : > /tmp/uae-activation-validation.log
          status=0
          for command in \
            "node scripts/check-calendar-uae-era-detail-recovery.mjs" \
            "node scripts/check-calendar-acquisition-registry.mjs" \
            "node scripts/check-calendar-uae-era-pilot-06-profile-foundation.mjs" \
            "node scripts/check-calendar-uae-era-handoff-decision.mjs" \
            "node scripts/check-calendar-readiness-registry.mjs" \
            "node scripts/check-authority-source-inventory.mjs"
          do
            printf '\n$ %s\n' "$command" | tee -a /tmp/uae-activation-validation.log
            bash -lc "$command" 2>&1 | tee -a /tmp/uae-activation-validation.log
            current=${PIPESTATUS[0]}
            if [ "$current" -ne 0 ]; then status="$current"; fi
          done
          exit "$status"
      - name: Upload synchronization diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uae-detail-activation-diagnostics-${{ github.run_id }}
          path: /tmp/uae-activation-validation.log
          if-no-files-found: warn
          retention-days: 7
      - name: Commit synchronized activation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            data/static/authority-source-inventory.json \
            data/static/calendar-readiness-registry.json \
            data/static/calendar-acquisition-registry.json \
            src/data/publicationDisplayPolicies.json \
            scripts/check-calendar-acquisition-registry.mjs \
            scripts/check-calendar-uae-era-pilot-06-profile-foundation.mjs \
            scripts/check-calendar-uae-era-handoff-decision.mjs \
            docs/calendar/uae-era-handoff-decision.md \
            docs/calendar/uae-era-detail-recovery.md \
            scripts/temporary-activate-uae-era-detail-recovery.mjs \
            .github/workflows/temporary-activate-uae-era-detail-recovery.yml
          git commit -m "Activate UAE ERA A-level detail capability"
          git push origin HEAD:agent/uae-era-detail-recovery
