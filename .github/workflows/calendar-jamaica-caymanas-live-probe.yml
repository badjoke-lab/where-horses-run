name: Jamaica Caymanas live probe

on:
  pull_request:
    paths:
      - '.github/workflows/calendar-jamaica-caymanas-live-probe.yml'
      - 'scripts/timetable/jamaica-caymanas-core.mjs'
      - 'scripts/timetable/run-jamaica-caymanas-official-window.mjs'
      - 'scripts/check-jamaica-caymanas-adapter.mjs'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Validate Jamaica Caymanas adapter
        run: npm run validate:jamaica-caymanas
      - name: Probe live Jamaica 30-day source-visible window
        run: |
          mkdir -p .calendar-jamaica-probe
          node scripts/timetable/run-jamaica-caymanas-official-window.mjs \
            --as-of=2026-09-27 \
            --days=30 \
            --output=.calendar-jamaica-probe/jamaica.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const data=JSON.parse(fs.readFileSync('.calendar-jamaica-probe/jamaica.json','utf8'));
          console.log(JSON.stringify({
            records:data.records.length,
            dates:data.records.map(r=>r.date),
            venues:[...new Set(data.records.map(r=>r.racecourse_id))],
            diagnostics:data.diagnostics,
            discovery:data.discovery,
          }));
          if(data.diagnostics.source_errors.length||data.diagnostics.parse_failures.length) process.exitCode=1;
          if(data.records.length===0) process.exitCode=1;
          if(data.records.some(r=>r.first_race_time_local!==null||r.last_race_time_local!==null)) process.exitCode=1;
          NODE
