name: Temporary HKJC live fixture bridge diagnostics

on:
  pull_request:
    paths:
      - 'scripts/update-hkjc-live-fixture-bridge-parser-failure-expectations.mjs'
      - '.github/workflows/temp-hkjc-live-fixture-bridge-diagnostics.yml'

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Align parser-failure expectations
        run: node scripts/update-hkjc-live-fixture-bridge-parser-failure-expectations.mjs
      - name: Capture bridge checker diagnostics
        run: |
          mkdir -p .diagnostics
          set +e
          node scripts/check-calendar-hkjc-live-fixture-bridge.mjs > .diagnostics/hkjc-live-fixture-bridge.log 2>&1
          status=$?
          echo "EXIT_STATUS=${status}" >> .diagnostics/hkjc-live-fixture-bridge.log
          exit 0
      - name: Commit checker and diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/check-calendar-hkjc-live-fixture-bridge.mjs \
            .diagnostics/hkjc-live-fixture-bridge.log
          git commit -m "[CF-Pages-Skip] Align HKJC parser-failure expectations"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
