# Probe only: no production timetable files are changed.
name: JRA official PDF fetch probe

on:
  pull_request:
    paths:
      - '.github/workflows/jra-official-pdf-fetch-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch official JRA summer programme PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/jra-pdf-probe
          urls=(
            'https://www.jra.go.jp/keiba/program/2026/pdf/jikoku02.pdf'
            'https://www.jra.go.jp/keiba/program/2026/pdf/bangumi/fukushima2.pdf'
            'https://www.jra.go.jp/keiba/program/2026/pdf/bangumi/kokura2.pdf'
            'https://www.jra.go.jp/keiba/program/2026/pdf/bangumi/hakodate1-2.pdf'
          )
          index=0
          for url in "${urls[@]}"; do
            index=$((index + 1))
            file="/tmp/jra-pdf-probe/${index}.pdf"
            curl --fail --location --silent --show-error \
              --retry 2 --connect-timeout 15 --max-time 60 \
              --user-agent 'WhereHorsesRun/1.0 (+https://github.com/badjoke-lab/where-horses-run)' \
              "$url" -o "$file"
            test "$(head -c 4 "$file")" = '%PDF'
            test "$(wc -c < "$file")" -gt 50000
            printf '%s  %s\n' "$(sha256sum "$file" | cut -d' ' -f1)" "$url"
          done
      - name: Upload probe files
        uses: actions/upload-artifact@v4
        with:
          name: jra-official-pdf-fetch-probe
          path: /tmp/jra-pdf-probe/*.pdf
          retention-days: 1
