name: Calendar NAR August 28 bounded manual retry

on:
  push:
    branches:
      - ops/nar-2026-08-28-manual-retry
    paths:
      - '.github/workflows/calendar-nar-2026-08-28-manual-retry-once.yml'

permissions:
  contents: read

concurrency:
  group: calendar-nar-2026-08-28-bounded-manual-retry
  cancel-in-progress: false

jobs:
  collect-review-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WHR_BATCH_ID: nar-manual-retry-2026-08-28-funabashi-kasamatsu-001
      WHR_MODE: selected_meetings
      WHR_START_DATE: ''
      WHR_END_DATE_EXCLUSIVE: ''
      WHR_MEETING_IDS: nar-funabashi-racecourse-2026-08-28,nar-kasamatsu-racecourse-2026-08-28
      WHR_CHECKED_AT: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Confirm exact targets are still pending in Draft PR 559 review lane
        shell: bash
        run: |
          git fetch origin automation/calendar-daily-acquisition-review:refs/remotes/origin/calendar-review
          git show refs/remotes/origin/calendar-review:data/generated/timetable/nar-incremental-batches/due-job-plan-2026-08-24-due-japan-nar-regular-refresh-001-run-001/retry-targets.json > .nar-current-retry-targets.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const retry = JSON.parse(fs.readFileSync('.nar-current-retry-targets.json', 'utf8'));
          const expected = [
            'nar-funabashi-racecourse-2026-08-28',
            'nar-kasamatsu-racecourse-2026-08-28',
          ];
          if (retry.operator_mode !== 'manual_irregular_retry') throw new Error(`unexpected operator_mode: ${retry.operator_mode}`);
          if (retry.scheduled_retry !== 'disabled') throw new Error(`scheduled retry unexpectedly enabled: ${retry.scheduled_retry}`);
          if (retry.canonical_write !== 'disabled' || retry.public_write !== 'disabled') throw new Error('review lane write boundary changed');
          const pending = new Set(retry.meeting_targets ?? []);
          const missing = expected.filter((id) => !pending.has(id));
          if (missing.length) throw new Error(`targets are no longer pending: ${missing.join(',')}`);
          console.log(`NAR_RETRY_PRECHECK: exact_pending_targets=${expected.length}`);
          NODE

      - name: Validate existing manual operator contract
        run: |
          node --check scripts/timetable/nar-incremental-v2-actions-core.mjs
          node --check scripts/timetable/run-nar-incremental-v2-actions.mjs
          node scripts/check-calendar-nar-incremental-v2-actions-operator.mjs

      - name: Collect only the two August 28 pending meetings
        run: node scripts/timetable/run-nar-incremental-v2-actions.mjs

      - name: Validate generated review batch
        run: |
          node scripts/check-calendar-nar-incremental-v2.mjs "--batch-id=${WHR_BATCH_ID}"
          node scripts/check-calendar-coverage-observation-schema.mjs
          node scripts/check-calendar-validation-responsibilities.mjs
          node scripts/check-calendar-runtime-import-boundary.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p = `data/candidates/nar-incremental-batches/${process.env.WHR_BATCH_ID}/batch.json`;
          const batch = JSON.parse(fs.readFileSync(p, 'utf8'));
          const ids = (batch.scheduled_meetings ?? []).map((x) => x.meeting_id).sort();
          const expected = process.env.WHR_MEETING_IDS.split(',').sort();
          if (JSON.stringify(ids) !== JSON.stringify(expected)) throw new Error(`generated scope escaped exact target set: ${JSON.stringify(ids)}`);
          if (batch.review?.canonical_write !== 'disabled' || batch.review?.public_write !== 'disabled') throw new Error('generated batch write boundary changed');
          NODE

      - name: Upload bounded review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nar-v2-nar-manual-retry-2026-08-28-funabashi-kasamatsu-001-review-artifacts
          if-no-files-found: error
          retention-days: 30
          path: |
            data/candidates/nar-incremental-batches/${{ env.WHR_BATCH_ID }}/batch.json
            data/generated/timetable/nar-incremental-batches/${{ env.WHR_BATCH_ID }}/collection-report.json
            data/generated/timetable/nar-incremental-batches/${{ env.WHR_BATCH_ID }}/coverage-observation.json
            data/generated/timetable/nar-incremental-batches/${{ env.WHR_BATCH_ID }}/retry-targets.json
