name: Calendar NAR August 26-28 A+ review

on:
  pull_request:
    paths:
      - '.github/workflows/calendar-nar-regular-refresh-2026-08-26-through-2026-08-28-a-plus-review.yml'
      - 'scripts/timetable/build-calendar-nar-regular-refresh-2026-08-26-through-2026-08-28-a-plus-approved-candidates.mjs'
      - 'data/candidates/nar-regular-refresh-2026-08-26-through-2026-08-28-a-plus-approved.json'
      - 'data/generated/timetable/canonical/**'
      - 'data/generated/timetable/public/**'
      - 'data/generated/timetable/operations-status.json'
      - 'data/generated/timetable/operations-review-package.json'
      - 'scripts/check-calendar-nar-incremental-v2-promotion-output-determinism.mjs'

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          path: work
          fetch-depth: 0

      - name: Checkout exact daily-review source evidence
        uses: actions/checkout@v4
        with:
          ref: c83090d2114c745f631d6875dd9dccec0d385cf0
          path: review-source
          sparse-checkout: |
            data/candidates/nar-incremental-batches/due-job-plan-2026-08-24-due-japan-nar-regular-refresh-001-run-001/batch.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Rebuild exact reviewed Candidate
        working-directory: work
        env:
          WHR_NAR_REVIEW_BATCH: ${{ github.workspace }}/review-source/data/candidates/nar-incremental-batches/due-job-plan-2026-08-24-due-japan-nar-regular-refresh-001-run-001/batch.json
        run: node scripts/timetable/build-calendar-nar-regular-refresh-2026-08-26-through-2026-08-28-a-plus-approved-candidates.mjs

      - name: Verify Candidate and repository state
        working-directory: work
        run: |
          git diff --exit-code -- data/candidates/nar-regular-refresh-2026-08-26-through-2026-08-28-a-plus-approved.json
          node scripts/timetable/promote-timetable.mjs --input data/candidates/nar-regular-refresh-2026-08-26-through-2026-08-28-a-plus-approved.json --dry-run
          node scripts/timetable/build-public-timetable-view.mjs --check
          node scripts/validate-data.mjs
          node scripts/check-japan-a-plus-public-overrides.mjs
          node scripts/check-calendar-operations-status.mjs
          node scripts/check-calendar-operations-review-package.mjs

      - name: Verify seven A+ records
        working-directory: work
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const expected = new Map([
            ['nar-funabashi-racecourse-2026-08-26', [12, '14:35', '20:50']],
            ['nar-funabashi-racecourse-2026-08-27', [12, '14:35', '20:50']],
            ['nar-kasamatsu-racecourse-2026-08-27', [12, '10:55', '17:00']],
            ['nar-monbetsu-racecourse-2026-08-26', [12, '14:15', '20:30']],
            ['nar-sonoda-racecourse-2026-08-26', [12, '10:40', '16:30']],
            ['nar-sonoda-racecourse-2026-08-27', [12, '10:40', '16:30']],
            ['nar-sonoda-racecourse-2026-08-28', [12, '14:20', '20:40']],
          ]);
          const candidate = JSON.parse(fs.readFileSync('data/candidates/nar-regular-refresh-2026-08-26-through-2026-08-28-a-plus-approved.json', 'utf8'));
          const meetings = JSON.parse(fs.readFileSync('data/generated/timetable/canonical/meetings.json', 'utf8')).meetings;
          const details = JSON.parse(fs.readFileSync('data/generated/timetable/canonical/meeting-details.json', 'utf8')).details;
          if (candidate.records.length !== 7) throw new Error(`expected 7 records, got ${candidate.records.length}`);
          if (candidate.records.reduce((sum, row) => sum + row.timetable_rows.length, 0) !== 84) throw new Error('expected 84 race rows');
          for (const [id, [count, first, last]] of expected) {
            const record = candidate.records.find((row) => row.meeting_id === id);
            const meeting = meetings.find((row) => row.meeting_id === id);
            const detail = details.find((row) => row.meeting_id === id);
            if (record?.capability_rank !== 'A+' || record.timetable_rows?.length !== count) throw new Error(`${id} candidate differs`);
            if (record.first_race_time_local !== first || record.last_race_time_local !== last) throw new Error(`${id} candidate times differ`);
            if (meeting?.capability_rank !== 'A+' || meeting.first_race_time_local !== first || meeting.last_race_time_local !== last) throw new Error(`${id} canonical meeting differs`);
            if (detail?.capability_rank !== 'A+' || detail.timetable_rows?.length !== count) throw new Error(`${id} canonical detail differs`);
            const serialized = JSON.stringify(record).toLowerCase();
            for (const field of ['horse_name','jockey','trainer','odds','payout','result','prediction','raw_html','stream_url']) {
              if (serialized.includes(field)) throw new Error(`${id} contains forbidden field ${field}`);
            }
          }
          NODE

      - name: Verify cumulative determinism and clean output
        working-directory: work
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node scripts/check-calendar-nar-incremental-v2-promotion-output-determinism.mjs
          git diff --check
