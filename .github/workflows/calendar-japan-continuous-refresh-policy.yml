name: Calendar Japan continuous refresh policy

on:
  pull_request:
    paths:
      - 'data/static/calendar-due-job-policy-v1.json'
      - 'scripts/check-calendar-japan-continuous-refresh-policy.mjs'
      - '.github/workflows/calendar-japan-continuous-refresh-policy.yml'
  push:
    branches:
      - main
    paths:
      - 'data/static/calendar-due-job-policy-v1.json'
      - 'scripts/check-calendar-japan-continuous-refresh-policy.mjs'
      - '.github/workflows/calendar-japan-continuous-refresh-policy.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - run: node --check scripts/check-calendar-japan-continuous-refresh-policy.mjs
      - run: node scripts/check-calendar-japan-continuous-refresh-policy.mjs
      - run: node scripts/check-calendar-due-job-planner.mjs
