name: Calendar HKJC handoff decision

on:
  pull_request:
    paths:
      - 'data/audits/calendar-hkjc-handoff-decision-v1.json'
      - 'data/static/calendar-acquisition-registry.json'
      - 'data/static/calendar-route-runner-policy-v1.json'
      - 'docs/project-roadmap.md'
      - 'docs/calendar/implementation-roadmap.md'
      - 'docs/calendar/hkjc-handoff-decision.md'
      - 'docs/calendar/README.md'
      - 'scripts/check-calendar-hkjc-handoff-decision.mjs'
      - '.github/workflows/calendar-hkjc-handoff-decision.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Validate HKJC handoff decision
        run: |
          node --check scripts/check-calendar-hkjc-handoff-decision.mjs
          node scripts/check-calendar-hkjc-handoff-decision.mjs
      - name: Revalidate accepted HKJC operating dependencies
        run: |
          node scripts/check-calendar-route-runner-policy.mjs
          node scripts/check-calendar-acquisition-registry.mjs
          node scripts/check-calendar-hkjc-pilot-04-live-evidence-decision.mjs
          node scripts/check-calendar-hkjc-pilot-05-detail-route-evidence.mjs
          node scripts/check-calendar-hkjc-pilot-06-reviewed-import-evidence.mjs
          node scripts/check-project-governance-docs.mjs
      - name: Prove workflow boundary
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const workflow = fs.readFileSync('.github/workflows/calendar-hkjc-handoff-decision.yml', 'utf8');
          if (!workflow.includes('permissions:\n  contents: read')) throw new Error('contents permission must remain read-only');
          if (/contents:\s*write/.test(workflow) || /pull-requests:\s*write/.test(workflow)) throw new Error('write permission enabled');
          if (/\bschedule\s*:|\bcron\s*:/.test(workflow)) throw new Error('scheduled execution enabled');
          console.log('HKJC_HANDOFF_DECISION_CI_BOUNDARY: pass');
          NODE
      - name: Check diff formatting
        run: git diff --check
