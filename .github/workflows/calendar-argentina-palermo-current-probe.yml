name: Argentina Palermo current Calendar probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/calendar-argentina-palermo-current-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Probe official Palermo 2026 calendar sources
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (compatible; WhereHorsesRun/1.0; +https://github.com/badjoke-lab/where-horses-run)'
          mkdir -p /tmp/palermo
          for item in \
            'calendar-html|https://old.palermo.com.ar/es/turf/n/calendario-2026' \
            'schedule-html|https://old.palermo.com.ar/en/turf/racing-schedule-and-results/2026' \
            'calendar-pdf|https://old.palermo.com.ar/assets/upload/CALENDARIO.pdf'; do
            name="${item%%|*}"
            url="${item#*|}"
            out="/tmp/palermo/$name.out"
            code="$(curl -L -sS -A "$UA" --connect-timeout 12 --max-time 35 -o "$out" -w '%{http_code}' "$url" || true)"
            echo "PALERMO_SOURCE name=$name HTTP=$code BYTES=$(wc -c < "$out" 2>/dev/null || echo 0) URL=$url"
          done
          file /tmp/palermo/calendar-pdf.out || true

      - name: Extract official Palermo calendar PDF
        shell: bash
        run: |
          set -euo pipefail
          pdftotext -layout /tmp/palermo/calendar-pdf.out /tmp/palermo/calendar.txt
          python3 - /tmp/palermo/calendar.txt <<'PY'
          import re,sys
          raw=open(sys.argv[1],errors='replace').read()
          text=re.sub(r'\s+',' ',raw).strip()
          print('PALERMO_PDF_TEXT',text[:22000])
          print('PALERMO_PDF_RAW_LEN',len(raw))
          for needle in ['OCTUBRE','NOVIEMBRE','DICIEMBRE','Octubre','Noviembre','Diciembre']:
              p=text.find(needle)
              if p>=0:
                  print('PALERMO_PDF_MONTH',needle,text[max(0,p-500):p+6500])
          # Extract all explicit 2026 date forms if present.
          seen=[]
          for pat in [
            r'\b(\d{1,2})[/-](\d{1,2})[/-](2026)\b',
            r'\b(\d{1,2})\s+de\s+(enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|octubre|noviembre|diciembre)\s+(?:de\s+)?2026\b'
          ]:
              for m in re.finditer(pat,text,re.I):
                  s=m.group(0)
                  if s not in seen: seen.append(s)
          print('PALERMO_PDF_EXPLICIT_DATES',len(seen))
          for s in seen: print('PALERMO_PDF_DATE',s)
          PY
