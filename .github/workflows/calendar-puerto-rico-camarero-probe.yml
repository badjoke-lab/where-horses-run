name: Puerto Rico Camarero current source probe

on:
  pull_request:
    paths:
      - ".github/workflows/calendar-puerto-rico-camarero-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Probe current official Camarero routes
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (compatible; WhereHorsesRun/1.0; +https://github.com/badjoke-lab/where-horses-run)'
          mkdir -p /tmp/camarero

          probe() {
            local name="$1"
            local url="$2"
            local out="/tmp/camarero/$name.html"
            echo "::group::$name $url"
            code="$(curl -L -sS -A "$UA" --connect-timeout 15 --max-time 45 -o "$out" -w '%{http_code}' "$url" || true)"
            echo "HTTP=$code BYTES=$(wc -c < "$out" 2>/dev/null || echo 0)"
            if [ -s "$out" ]; then
              python3 - "$out" <<'PY'
          import html,re,sys
          from pathlib import Path
          raw=Path(sys.argv[1]).read_text(errors='replace')
          plain=re.sub(r'<script\b[^>]*>.*?</script>',' ',raw,flags=re.I|re.S)
          plain=re.sub(r'<style\b[^>]*>.*?</style>',' ',plain,flags=re.I|re.S)
          plain=html.unescape(re.sub(r'<[^>]+>',' ',plain))
          plain=re.sub(r'\s+',' ',plain)
          for needle in ['Semana:','Programa','Inscripción','octubre de 2026','septiembre de 2026','Descargar']:
              pos=plain.lower().find(needle.lower())
              if pos>=0:
                  print('WINDOW',needle,plain[max(0,pos-250):pos+3000])
          print('LINKS')
          seen=set()
          for m in re.finditer(r'href=["\']([^"\']+)["\']',raw,re.I):
              u=html.unescape(m.group(1))
              if any(k in u.lower() for k in ['pdf','program','inscrip','download','semana','week','fecha','date','wp-content/uploads']):
                  if u not in seen:
                      seen.add(u); print(u[:900])
          print('FORM_FIELDS')
          for m in re.finditer(r'<(?:form|input|select|option)\b[^>]*>',raw,re.I):
              s=html.unescape(m.group(0))
              if any(k in s.lower() for k in ['date','fecha','week','semana','program','inscrip','filter','name=','value=']):
                  print(s[:1000])
          PY
            fi
            echo "::endgroup::"
          }

          probe programas 'https://www.hipodromo-camarero.com/carreras/programas'
          probe inscripciones 'https://www.hipodromo-camarero.com/carreras/inscripciones'
          probe programa-dia 'https://www.hipodromo-camarero.com/programa-de-carreras/'
          probe download-dia 'https://hipodromo-camarero.com/downloads/programa-del-dia/'


      - name: Extract Camarero programme document targets
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (compatible; WhereHorsesRun/1.0; +https://github.com/badjoke-lab/where-horses-run)'
          curl -L -sS -A "$UA" --connect-timeout 15 --max-time 45             'https://www.hipodromo-camarero.com/carreras/programas'             -o /tmp/camarero-programas.html

          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import html,re

          raw=Path('/tmp/camarero-programas.html').read_text(errors='replace')

          class P(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.stack=[]
                  self.anchors=[]
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  self.stack.append((tag,d,[]))
              def handle_data(self,data):
                  for i in range(len(self.stack)):
                      self.stack[i][2].append(data)
              def handle_endtag(self,tag):
                  for i in range(len(self.stack)-1,-1,-1):
                      if self.stack[i][0]==tag:
                          t,a,parts=self.stack.pop(i)
                          if t=='a':
                              self.anchors.append((a,' '.join(parts)))
                          break
          p=P(); p.feed(raw)
          print('ANCHORS_WITH_DOWNLOAD_OR_PROGRAMME_CONTEXT')
          for attrs,text in p.anchors:
              txt=re.sub(r'\s+',' ',html.unescape(text)).strip()
              blob=(txt+' '+str(attrs)).lower()
              if any(k in blob for k in ['descargar','programa','2026','download','pdf']):
                  print('TEXT=',txt[:300],'ATTRS=',attrs)

          print('RAW_CONTEXT_AROUND_DESCARGAR')
          for m in list(re.finditer(r'Descargar',raw,re.I))[:20]:
              print('---')
              print(html.unescape(raw[max(0,m.start()-1800):m.end()+500])[:3000])

          print('CANDIDATE_URL_ATTRS')
          for m in re.finditer(r'(?:href|src|data-[a-z0-9_-]+)=["\']([^"\']+)["\']',raw,re.I):
              u=html.unescape(m.group(1))
              if any(k in u.lower() for k in ['2026','pdf','program','archivo','file','download','document','media','uploads']):
                  print(m.group(0)[:1200])
          PY


      - name: Install PDF parser
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate current Camarero programme PDFs
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (compatible; WhereHorsesRun/1.0; +https://github.com/badjoke-lab/where-horses-run)'
          base='https://www.hipodromo-camarero.com'
          declare -A urls
          urls[2026-10-02]='/api/public/pdf/d83060a6-ff4b-4640-a4ee-dd2885bc24ee?v=1235015'
          urls[2026-10-03]='/api/public/pdf/2a55c336-0ede-4b24-80bc-5fd2adec9b44?v=1467440'
          urls[2026-10-04]='/api/public/pdf/36e99513-05b5-4df1-99f3-df09e46155fb?v=1316650'
          mkdir -p /tmp/camarero-pdf
          for date in 2026-10-02 2026-10-03 2026-10-04; do
            out="/tmp/camarero-pdf/$date.pdf"
            code="$(curl -L -sS -A "$UA" --retry 3 --retry-delay 2 --retry-all-errors --connect-timeout 20 --max-time 90 -o "$out" -w '%{http_code}' "$base${urls[$date]}" || true)"
            echo "PDF_FETCH date=$date HTTP=$code BYTES=$(wc -c < "$out" 2>/dev/null || echo 0) TYPE=$(file -b "$out" || true)"
          done

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import * as pdfjsLib from 'pdfjs-dist/legacy/build/pdf.mjs';

          const dates=['2026-10-02','2026-10-03','2026-10-04'];
          for (const date of dates) {
            const file=`/tmp/camarero-pdf/${date}.pdf`;
            if(!fs.existsSync(file)){console.log(`PDF_PARSE_SKIP date=${date} reason=missing_after_retries`);continue;}
            const data=new Uint8Array(fs.readFileSync(file));
            const doc=await pdfjsLib.getDocument({data,disableWorker:true}).promise;
            let all='';
            for(let p=1;p<=doc.numPages;p++){
              const page=await doc.getPage(p);
              const tc=await page.getTextContent();
              all += '\n' + tc.items.map(x=>x.str).join(' ');
            }
            const norm=all.replace(/\s+/g,' ').trim();
            console.log(`PDF_PARSE date=${date} pages=${doc.numPages} chars=${norm.length}`);
            console.log('HEAD',norm.slice(0,3500));
            const patterns=[
              /(?:HIP[ÓO]DROMO\s+CAMARERO|CAMARERO)/gi,
              /(?:ENERO|FEBRERO|MARZO|ABRIL|MAYO|JUNIO|JULIO|AGOSTO|SEPTIEMBRE|OCTUBRE|NOVIEMBRE|DICIEMBRE)[^.;]{0,100}2026/gi,
              /(?:PRIMERA|SEGUNDA|TERCERA|CUARTA|QUINTA|SEXTA|S[ÉE]PTIMA|OCTAVA|NOVENA|D[ÉE]CIMA|\d{1,2}(?:RA|DA|TA)?)[^.;]{0,100}CARRERA/gi,
              /\b(?:1[0-2]|0?[1-9]):[0-5][0-9]\s*(?:A\.?M\.?|P\.?M\.?)\b/gi,
              /\b(?:POST\s*TIME|HORA(?:\s+DE\s+SALIDA)?)[^.;]{0,100}/gi
            ];
            const seen=new Set();
            for(const re of patterns){
              for(const m of norm.matchAll(re)){
                const start=Math.max(0,(m.index??0)-180), end=Math.min(norm.length,(m.index??0)+m[0].length+260);
                const s=norm.slice(start,end);
                if(!seen.has(s)){seen.add(s);console.log('MATCH',s);}
              }
            }
          }
          NODE


      - name: Probe Camarero future programme weeks
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (compatible; WhereHorsesRun/1.0; +https://github.com/badjoke-lab/where-horses-run)'
          for semana in 0 1 2 3 4; do
            if [ "$semana" = 0 ]; then
              url='https://www.hipodromo-camarero.com/carreras/programas'
            else
              url="https://www.hipodromo-camarero.com/carreras/programas?semana=$semana"
            fi
            out="/tmp/camarero-week-$semana.html"
            code="$(curl -L -sS -A "$UA" --connect-timeout 15 --max-time 45 -o "$out" -w '%{http_code}' "$url" || true)"
            python3 - "$semana" "$code" "$out" <<'PY'
          import html,re,sys
          from pathlib import Path
          semana,code,path=sys.argv[1:]
          raw=Path(path).read_text(errors='replace')
          plain=re.sub(r'<script\b[^>]*>.*?</script>',' ',raw,flags=re.I|re.S)
          plain=re.sub(r'<style\b[^>]*>.*?</style>',' ',plain,flags=re.I|re.S)
          plain=html.unescape(re.sub(r'<[^>]+>',' ',plain))
          plain=re.sub(r'\s+',' ',plain)
          week=re.search(r'Semana:\s*([^<]{0,80}?)(?:Semana anterior|Siguiente|Fecha\s*:)',plain,re.I)
          rx=re.compile(r'Programa\s+(?:lunes|martes|miércoles|miercoles|jueves|viernes|sábado|sabado|domingo),\s*(\d{1,2})\s+de\s+(enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|octubre|noviembre|diciembre)\s+de\s+(20\d{2})',re.I)
          dates=[m.group(0) for m in rx.finditer(plain)]
          pdfs=sorted(set(html.unescape(x) for x in re.findall(r'/api/public/pdf/[0-9a-f-]+\?v=\d+',raw,re.I)))
          print(f'WEEK semana={semana} HTTP={code} BYTES={len(raw)} RANGE={week.group(1).strip() if week else "MISSING"} PROGRAM_COUNT={len(dates)} PDF_COUNT={len(pdfs)}')
          for d in dates: print('PROGRAM',d)
          for p in pdfs: print('PDF',p)
          PY
          done
