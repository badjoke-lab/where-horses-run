name: Temporary v1 performance QA discovery

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'astro.config.mjs'
      - 'scripts/**'
      - 'data/**'
      - 'package.json'
      - '.github/workflows/temporary-v1-performance-qa-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install dependencies without generating a lockfile
        run: npm install --package-lock=false
      - name: Validate discovery script syntax
        run: |
          node --check scripts/temporary-discover-v1-performance-qa.mjs
          node --check scripts/temporary-measure-v1-performance-key-pages.mjs
      - name: Build complete static site
        run: npm run build
      - name: Measure complete static performance inventory
        shell: bash
        run: |
          set +e
          node scripts/temporary-discover-v1-performance-qa.mjs > v1-performance-qa-discovery.log 2>&1
          status=$?
          printf '%s\n' "$status" > v1-performance-qa-discovery.exit
          cat v1-performance-qa-discovery.log
          exit 0
      - name: Measure key public routes
        run: node scripts/temporary-measure-v1-performance-key-pages.mjs
      - name: Upload performance discovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-performance-qa-discovery
          path: |
            v1-performance-qa-discovery.log
            v1-performance-qa-discovery.exit
            v1-performance-qa-discovery.json
            v1-performance-key-pages.json
          if-no-files-found: warn
          retention-days: 1
      - name: Enforce discovery success
        run: |
          status="$(cat v1-performance-qa-discovery.exit)"
          if [ "$status" != "0" ]; then
            exit "$status"
          fi
