name: Temporary HKJC PILOT-03 evidence state updater

on:
  pull_request:
    paths:
      - 'scripts/update-hkjc-pilot-03-evidence-state.mjs'
      - '.github/workflows/temp-hkjc-pilot-03-evidence-state.yml'

permissions:
  contents: write

jobs:
  update:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Update HKJC PILOT-03 evidence state
        run: node scripts/update-hkjc-pilot-03-evidence-state.mjs
      - name: Commit canonical evidence state
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/calendar/hkjc-shared-actions-live-evidence.md \
            docs/project-roadmap.md \
            docs/calendar/implementation-roadmap.md \
            docs/calendar/acquisition-control-plane-implementation-plan.md \
            docs/calendar/README.md \
            docs/governance/document-authority.md
          git commit -m "[CF-Pages-Skip] Record HKJC PILOT-03 evidence decision"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
