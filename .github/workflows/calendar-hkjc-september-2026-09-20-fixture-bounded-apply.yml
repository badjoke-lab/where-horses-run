name: Calendar HKJC September 20 fixture bounded apply

on:
  pull_request:
    paths:
      - '.github/workflows/calendar-hkjc-september-2026-09-20-fixture-bounded-apply.yml'
      - 'scripts/timetable/build-calendar-hkjc-september-2026-09-20-fixture-approved-candidates.mjs'

permissions:
  contents: write

concurrency:
  group: calendar-hkjc-september-20-fixture-bounded-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact review head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Checkout exact daily-review source evidence
        uses: actions/checkout@v4
        with:
          ref: 087feda950f547e7cec13c3845dfdecba36164fa
          path: review-source
          sparse-checkout: |
            data/generated/timetable/actions-multi-job/due-job-plan-2026-08-23-due-hong-kong-hkjc-season-wake-up-001-run-001/candidates.json
            data/generated/timetable/actions-multi-job/due-job-plan-2026-08-23-due-hong-kong-hkjc-season-wake-up-001-run-001/collection-report.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Build exactly one reviewed HKJC Rank C candidate
        env:
          WHR_HKJC_REVIEW_CANDIDATES: ${{ github.workspace }}/review-source/data/generated/timetable/actions-multi-job/due-job-plan-2026-08-23-due-hong-kong-hkjc-season-wake-up-001-run-001/candidates.json
          WHR_HKJC_REVIEW_REPORT: ${{ github.workspace }}/review-source/data/generated/timetable/actions-multi-job/due-job-plan-2026-08-23-due-hong-kong-hkjc-season-wake-up-001-run-001/collection-report.json
        run: node scripts/timetable/build-calendar-hkjc-september-2026-09-20-fixture-approved-candidates.mjs

      - name: Extend cumulative reviewed promotion contract
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'scripts/check-calendar-nar-incremental-v2-promotion-output-determinism.mjs';
          let text = fs.readFileSync(file, 'utf8');
          const constAnchor = "const augustNarRegularRefreshAPlusThirdPath = 'data/candidates/nar-regular-refresh-2026-08-26-a-plus-approved.json';\n";
          if (!text.includes("const septemberHkjcFixtureSeptember20Path =")) {
            if (!text.includes(constAnchor)) throw new Error('determinism const anchor missing');
            text = text.replace(constAnchor, `${constAnchor}const septemberHkjcFixtureSeptember20Path = 'data/candidates/hkjc-september-2026-09-20-fixture-approved.json';\n`);
          }
          const sequenceAnchor = '  augustNarRegularRefreshAPlusThirdPath,\n];';
          if (!text.includes('  septemberHkjcFixtureSeptember20Path,\n];')) {
            if (!text.includes(sequenceAnchor)) throw new Error('determinism continuation anchor missing');
            text = text.replace(sequenceAnchor, '  augustNarRegularRefreshAPlusThirdPath,\n  septemberHkjcFixtureSeptember20Path,\n];');
          }
          const countAnchor = '  [augustNarRegularRefreshAPlusThirdPath, [1, 1]],\n]);';
          if (!text.includes('  [septemberHkjcFixtureSeptember20Path, [1, 0]],')) {
            if (!text.includes(countAnchor)) throw new Error('determinism count anchor missing');
            text = text.replace(countAnchor, '  [augustNarRegularRefreshAPlusThirdPath, [1, 1]],\n  [septemberHkjcFixtureSeptember20Path, [1, 0]],\n]);');
          }
          fs.writeFileSync(file, text);
          NODE

      - name: Validate and apply reviewed promotion
        run: |
          node scripts/timetable/promote-timetable.mjs --input data/candidates/hkjc-september-2026-09-20-fixture-approved.json --dry-run
          node scripts/timetable/promote-timetable.mjs --input data/candidates/hkjc-september-2026-09-20-fixture-approved.json

      - name: Rebuild deterministic public and operations projections
        run: |
          node scripts/timetable/build-public-timetable-view.mjs
          node scripts/timetable/build-japan-a-plus-public-overrides.mjs
          node scripts/timetable/build-operations-status.mjs --reference-date 2026-07-01
          node scripts/timetable/build-operations-review-package.mjs

      - name: Validate applied repository state
        run: |
          node scripts/validate-data.mjs
          node scripts/check-japan-a-plus-public-overrides.mjs
          node scripts/check-calendar-operations-status.mjs
          node scripts/check-calendar-operations-review-package.mjs

      - name: Verify exact HKJC Rank C publication boundary
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const id = 'hkjc-sha-tin-racecourse-2026-09-20';
          const candidate = JSON.parse(fs.readFileSync('data/candidates/hkjc-september-2026-09-20-fixture-approved.json', 'utf8'));
          if (candidate.review?.status !== 'approved' || candidate.review?.promotion_target !== 'canonical-timetable-v0') throw new Error('review contract differs');
          if (candidate.records.length !== 1 || candidate.records[0].meeting_id !== id) throw new Error('reviewed HKJC identity differs');
          const record = candidate.records[0];
          if (record.capability_rank !== 'C') throw new Error('HKJC reviewed rank differs');
          if (record.first_race_time_local !== null || record.last_race_time_local !== null) throw new Error('HKJC reviewed fixture must not claim race times');
          if (!Array.isArray(record.timetable_rows) || record.timetable_rows.length !== 0) throw new Error('HKJC reviewed fixture must not contain timetable rows');

          const canonical = JSON.parse(fs.readFileSync('data/generated/timetable/canonical/meetings.json', 'utf8'));
          const details = JSON.parse(fs.readFileSync('data/generated/timetable/canonical/meeting-details.json', 'utf8'));
          const publicList = JSON.parse(fs.readFileSync('data/generated/timetable/public/meeting-list.json', 'utf8'));
          const publicDetails = JSON.parse(fs.readFileSync('data/generated/timetable/public/meeting-details.json', 'utf8'));
          const meeting = canonical.meetings.find((row) => row.meeting_id === id);
          const publicMeeting = publicList.meetings.find((row) => row.meeting_id === id);
          if (meeting?.capability_rank !== 'C') throw new Error('HKJC canonical rank differs');
          if ((publicMeeting?.effective_public_rank ?? publicMeeting?.capability_rank) !== 'C') throw new Error('HKJC public rank differs');
          if (meeting.first_race_time_local !== null || meeting.last_race_time_local !== null) throw new Error('HKJC canonical fixture claims race times');
          if (details.details.some((row) => row.meeting_id === id)) throw new Error('HKJC fixture unexpectedly created canonical detail');
          if (publicDetails.details.some((row) => row.meeting_id === id)) throw new Error('HKJC fixture unexpectedly created public detail');

          const status = JSON.parse(fs.readFileSync('data/generated/timetable/operations-status.json', 'utf8'));
          if (canonical.meetings.length !== 437) throw new Error(`expected 437 canonical meetings, got ${canonical.meetings.length}`);
          if (details.details.length !== 95) throw new Error(`expected 95 canonical details, got ${details.details.length}`);
          if (status.public_projection?.meeting_count !== 424) throw new Error(`expected 424 public meetings, got ${status.public_projection?.meeting_count}`);
          if (status.public_projection?.detail_count !== 95) throw new Error(`expected 95 public details, got ${status.public_projection?.detail_count}`);
          if (status.public_projection?.latest_meeting_date !== '2026-09-21') throw new Error(`expected horizon 2026-09-21, got ${status.public_projection?.latest_meeting_date}`);
          NODE

      - name: Verify cumulative reviewed promotion determinism
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-calendar-nar-incremental-v2-promotion-output-determinism.mjs

      - name: Remove one-shot workflow and commit bounded output
        run: |
          git rm .github/workflows/calendar-hkjc-september-2026-09-20-fixture-bounded-apply.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            data/candidates/hkjc-september-2026-09-20-fixture-approved.json \
            data/generated/timetable/canonical/meetings.json \
            data/generated/timetable/canonical/meeting-details.json \
            data/generated/timetable/public/meeting-list.json \
            data/generated/timetable/public/meeting-details.json \
            data/generated/timetable/public/japan-a-plus-overrides.json \
            data/generated/timetable/operations-status.json \
            data/generated/timetable/operations-review-package.json \
            scripts/check-calendar-nar-incremental-v2-promotion-output-determinism.mjs
          git diff --cached --check
          git commit -m "Apply reviewed HKJC September 20 fixture"
          git push origin HEAD:post-v1-calendar-hkjc-2026-09-20-fixture-review
