name: Temporary Public v1 compatibility diagnostics

on:
  push:
    branches:
      - work/calendar-public-v1-surface-audit
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Capture compatibility diagnostics
        shell: bash
        run: |
          set +e
          {
            echo '=== calendar-operations-v2 ==='
            node scripts/check-calendar-operations-v2.mjs
            operations_v2_status=$?
            echo "OPERATIONS_V2_STATUS=$operations_v2_status"
            echo '=== calendar-operations-status ==='
            node scripts/check-calendar-operations-status.mjs
            operations_status_status=$?
            echo "OPERATIONS_STATUS_STATUS=$operations_status_status"
            echo '=== calendar-readiness-backfill-37-52 ==='
            node scripts/check-calendar-readiness-backfill-37-52.mjs
            readiness_status=$?
            echo "READINESS_37_52_STATUS=$readiness_status"
            if [ "$operations_v2_status" -ne 0 ] || [ "$operations_status_status" -ne 0 ] || [ "$readiness_status" -ne 0 ]; then
              exit 1
            fi
          } 2>&1 | tee /tmp/public-v1-compatibility-diagnostics.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"
      - name: Upload compatibility diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-v1-compatibility-diagnostics-${{ github.run_id }}
          path: /tmp/public-v1-compatibility-diagnostics.log
          if-no-files-found: warn
          retention-days: 7
