name: Temporary Public v1 compatibility synchronization

on:
  push:
    branches:
      - work/calendar-public-v1-surface-audit
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/calendar-public-v1-surface-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Apply compatibility synchronization
        run: node scripts/temporary-sync-public-v1-compatibility.mjs
      - name: Regenerate read-only Operations status
        run: node scripts/timetable/build-operations-status.mjs --reference-date 2026-07-02
      - name: Validate compatibility checks
        shell: bash
        run: |
          set +e
          {
            echo '=== calendar-operations-v2 ==='
            node scripts/check-calendar-operations-v2.mjs
            operations_v2_status=$?
            echo "OPERATIONS_V2_STATUS=$operations_v2_status"
            echo '=== calendar-operations-status ==='
            node scripts/check-calendar-operations-status.mjs
            operations_status_status=$?
            echo "OPERATIONS_STATUS_STATUS=$operations_status_status"
            echo '=== calendar-readiness-backfill-37-52 ==='
            node scripts/check-calendar-readiness-backfill-37-52.mjs
            readiness_status=$?
            echo "READINESS_37_52_STATUS=$readiness_status"
            echo '=== calendar-public-v1-surface-audit ==='
            node scripts/check-calendar-public-v1-surface-audit.mjs
            surface_status=$?
            echo "PUBLIC_V1_SURFACE_STATUS=$surface_status"
            if [ "$operations_v2_status" -ne 0 ] || [ "$operations_status_status" -ne 0 ] || [ "$readiness_status" -ne 0 ] || [ "$surface_status" -ne 0 ]; then
              exit 1
            fi
          } 2>&1 | tee /tmp/public-v1-compatibility-sync.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"
      - name: Upload compatibility synchronization diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-v1-compatibility-sync-${{ github.run_id }}
          path: /tmp/public-v1-compatibility-sync.log
          if-no-files-found: warn
          retention-days: 7
      - name: Validate diff hygiene
        run: git diff --check
      - name: Commit synchronized compatibility state
        run: |
          if git diff --quiet; then
            echo "No synchronization changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/fixtures/calendar-operations-v2-fixtures-v1.json \
            data/generated/timetable/operations-status.json \
            scripts/check-calendar-readiness-backfill-37-52.mjs
          git commit -m "[CF-Pages-Skip] Synchronize Public v1 compatibility state"
          git pull --rebase origin work/calendar-public-v1-surface-audit
          git push origin HEAD:work/calendar-public-v1-surface-audit
