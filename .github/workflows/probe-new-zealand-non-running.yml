name: Probe New Zealand non-running routes

on:
  pull_request:
    paths:
      - 'scripts/diagnostics/probe-new-zealand-non-running.mjs'
      - '.github/workflows/probe-new-zealand-non-running.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Probe NZTR and HRNZ official non-running routes
        run: node scripts/diagnostics/probe-new-zealand-non-running.mjs
      - name: Upload bounded diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: new-zealand-non-running-route-probe
          path: probe-new-zealand-non-running.json
          if-no-files-found: warn
