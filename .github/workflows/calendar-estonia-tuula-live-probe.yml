name: Estonia Tuula live probe

on:
  pull_request:
    paths:
      - '.github/workflows/calendar-estonia-tuula-live-probe.yml'
      - 'scripts/timetable/estonia-tuula-core.mjs'
      - 'scripts/timetable/run-estonia-tuula-official-window.mjs'
      - 'scripts/check-estonia-tuula-adapter.mjs'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Validate Estonia adapter
        run: npm run validate:estonia-tuula
      - name: Probe live Estonia 30-day window
        run: |
          mkdir -p .calendar-estonia-probe
          node scripts/timetable/run-estonia-tuula-official-window.mjs \
            --as-of=2026-09-27 \
            --days=30 \
            --output=.calendar-estonia-probe/estonia.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const d = JSON.parse(fs.readFileSync('.calendar-estonia-probe/estonia.json', 'utf8'));
          console.log(JSON.stringify({ dates: d.records.map((r) => r.date), diagnostics: d.diagnostics, discovery: d.discovery }));
          if (d.diagnostics.source_errors.length || d.diagnostics.parse_failures.length) process.exitCode = 1;
          for (const expected of ['2026-10-03','2026-10-17']) if (!d.records.some((r) => r.date === expected)) process.exitCode = 1;
          if (d.records.some((r) => r.first_race_time_local !== null || r.last_race_time_local !== null)) process.exitCode = 1;
          NODE
