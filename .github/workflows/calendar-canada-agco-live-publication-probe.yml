name: Calendar Canada AGCO live production publication probe

on:
  pull_request:
    paths:
      - '.github/workflows/calendar-canada-agco-live-publication-probe.yml'
      - 'scripts/timetable/check-canada-agco-live-publication.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check current main public data and actual bilingual deployed Calendar
        run: node scripts/timetable/check-canada-agco-live-publication.mjs
