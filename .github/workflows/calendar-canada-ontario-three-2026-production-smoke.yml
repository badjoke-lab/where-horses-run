name: Calendar Canada Ontario AGCO three-venue production smoke

on:
  pull_request:
    paths:
      - '.github/workflows/calendar-canada-ontario-three-2026-production-smoke.yml'
      - 'scripts/timetable/canada-ontario-three-agco-2026-core.mjs'
      - 'scripts/timetable/run-canada-ontario-three-agco-2026-window.mjs'
      - 'data/static/calendar-acquisition-registry.json'
      - 'data/static/calendar-readiness-registry.json'
      - 'data/static/racecourses.json'
      - '.github/workflows/calendar-unified-official-refresh.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  three-track-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --no-audit --no-fund
      - name: Acquire official 2026 dates and verify denominators
        run: |
          mkdir -p .calendar-canada-ontario
          node scripts/timetable/run-canada-ontario-three-agco-2026-window.mjs --as-of=2026-10-12 --days=90 --output-dir=.calendar-canada-ontario
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const expected={
            woodbine_thoroughbred:{year:128,forward:36,system:'canada-ontario-woodbine-thoroughbred-system'},
            fort_erie_thoroughbred:{year:34,forward:4,system:'canada-ontario-fort-erie-thoroughbred-system'},
            ajax_quarter_horse:{year:22,forward:2,system:'canada-ontario-ajax-quarter-horse-system'}
          };
          for(const [k,e] of Object.entries(expected)){
            const a=JSON.parse(fs.readFileSync('.calendar-canada-ontario/'+k+'.json','utf8'));
            if(a.acquisition_attempt.status!=='success'||a.discovery.source_visible_rows!==e.year||a.records.length!==e.forward||a.racing_system_id!==e.system)throw Error('Ontario source mismatch '+k+' '+JSON.stringify(a.diagnostics));
            for(const x of a.records)if(x.capability_rank!=='C'||x.first_race_time_local!==null||x.timetable_rows.length!==0)throw Error('Ontario non-C data '+k);
          }
          console.log('ONTARIO_THREE_AGCO_184_DATES_42_FORWARD: PASS');
          JS
      - name: Apply each independent Ontario racing code into PR canonical/public output
        run: |
          node scripts/timetable/apply-official-rolling-observations.mjs --artifact=.calendar-canada-ontario/woodbine_thoroughbred.json --country-id=canada --authority-id=ontario-racing --racing-system-id=canada-ontario-woodbine-thoroughbred-system --timezone=America/Toronto
          node scripts/timetable/apply-official-rolling-observations.mjs --artifact=.calendar-canada-ontario/fort_erie_thoroughbred.json --country-id=canada --authority-id=ontario-racing --racing-system-id=canada-ontario-fort-erie-thoroughbred-system --timezone=America/Toronto
          node scripts/timetable/apply-official-rolling-observations.mjs --artifact=.calendar-canada-ontario/ajax_quarter_horse.json --country-id=canada --authority-id=ontario-racing --racing-system-id=canada-ontario-ajax-quarter-horse-system --timezone=America/Toronto
      - name: Existing Calendar all-country contract checks
        run: |
          node scripts/check-calendar-acquisition-registry.mjs
          node scripts/check-calendar-98-tier-execution-coverage.mjs
          node scripts/check-calendar-98-tier-acquisition-methods.mjs
          node scripts/check-calendar-public-country-support.mjs
          node scripts/check-calendar-non-running-evidence-registry.mjs
          node scripts/check-calendar-public-map-parity.mjs
          node scripts/check-calendar-unified-audit-coverage.mjs
