name: Temporary glossary page metadata discovery

on:
  pull_request:
    branches:
      - main
    paths:
      - 'astro.config.mjs'
      - 'scripts/glossary-page-metadata-integration.mjs'
      - '.github/workflows/temporary-glossary-page-metadata-discovery.yml'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install dependencies without generating a lockfile
        run: npm install --package-lock=false
      - name: Build complete static site
        run: npm run build
      - name: Capture glossary metadata measurements
        shell: bash
        run: |
          node <<'NODE' > glossary-page-metadata-discovery.json
          const fs = require('node:fs');
          const path = require('node:path');

          function walk(directory) {
            return fs.readdirSync(directory, { withFileTypes: true }).flatMap((entry) => {
              const absolute = path.join(directory, entry.name);
              return entry.isDirectory() ? walk(absolute) : [absolute];
            });
          }

          function decode(value) {
            return value
              .replace(/&#x([0-9a-f]+);/gi, (_, hex) => String.fromCodePoint(Number.parseInt(hex, 16)))
              .replace(/&#(\d+);/g, (_, decimal) => String.fromCodePoint(Number.parseInt(decimal, 10)))
              .replaceAll('&quot;', '"')
              .replaceAll('&#39;', "'")
              .replaceAll('&#x27;', "'")
              .replaceAll('&lt;', '<')
              .replaceAll('&gt;', '>')
              .replaceAll('&amp;', '&');
          }

          const allGlossaryFiles = walk('dist').filter((file) => /(?:^|\/)glossary\/[^/]+\/index\.html$/.test(file.split(path.sep).join('/')));
          const files = allGlossaryFiles.filter((file) => !/\/glossary\/relationships\/index\.html$/.test(file.split(path.sep).join('/')));
          const relationshipFiles = allGlossaryFiles.filter((file) => /\/glossary\/relationships\/index\.html$/.test(file.split(path.sep).join('/')));
          const summary = {
            pages: files.length,
            englishPages: 0,
            japanesePages: 0,
            slugs: 0,
            scripts: 0,
            validJsonScripts: 0,
            collectionPageNodes: 0,
            definedTermNodes: 0,
            baselineLinks: 0,
            termSetLinks: 0,
            reviewDates: 0,
            alternateNameArrays: 0,
            alternateNameValues: 0,
            canonicalMismatches: 0,
            pageFieldMismatches: 0,
            termNameMismatches: 0,
            summaryMismatches: 0,
            missingAlternateNames: 0,
            unexpectedTypes: 0,
            sameAsClaims: 0,
            termCodeClaims: 0,
            unsafeLessThanCharacters: 0,
            relationshipPages: relationshipFiles.length,
            relationshipMetadataScripts: 0,
          };
          const slugs = new Set();

          for (const file of relationshipFiles) {
            const html = fs.readFileSync(file, 'utf8');
            summary.relationshipMetadataScripts += (html.match(/data-glossary-page-metadata=/g) || []).length;
          }

          for (const file of files) {
            const normalized = file.split(path.sep).join('/');
            const route = normalized.match(/dist\/(ja\/)?glossary\/([^/]+)\/index\.html$/);
            if (!route) continue;
            const locale = route[1] ? 'ja' : 'en';
            const slug = route[2];
            slugs.add(slug);
            if (locale === 'ja') summary.japanesePages += 1;
            else summary.englishPages += 1;

            const html = fs.readFileSync(file, 'utf8');
            const canonical = decode(html.match(/<link\s+[^>]*rel="canonical"[^>]*href="([^"]+)"|<link\s+[^>]*href="([^"]+)"[^>]*rel="canonical"/)?.slice(1).find(Boolean) || '');
            const title = decode(html.match(/<title>([\s\S]*?)<\/title>/)?.[1]?.replace(/<[^>]*>/g, '').trim() || '');
            const description = decode(html.match(/<meta\s+[^>]*name="description"[^>]*content="([^"]+)"|<meta\s+[^>]*content="([^"]+)"[^>]*name="description"/)?.slice(1).find(Boolean) || '');
            const lang = html.match(/<html\s+[^>]*lang="([^"]+)"/)?.[1];
            const termName = decode(html.match(/<h1[^>]*id="page-title"[^>]*>([\s\S]*?)<\/h1>/)?.[1]?.replace(/<[^>]*>/g, '').trim() || '');
            const visibleSummary = decode(html.match(/<p[^>]*class="hero__summary"[^>]*>([\s\S]*?)<\/p>/)?.[1]?.replace(/<[^>]*>/g, '').trim() || '');
            const reviewDate = html.match(/<time\s+[^>]*datetime="([^"]+)"/)?.[1] || '';

            const scripts = [...html.matchAll(/<script[^>]*type="application\/ld\+json"[^>]*data-glossary-page-metadata="collection-defined-term-v1"[^>]*>([\s\S]*?)<\/script>/g)];
            summary.scripts += scripts.length;
            if (scripts.length !== 1) continue;
            if (scripts[0][1].includes('<')) summary.unsafeLessThanCharacters += 1;
            let data;
            try {
              data = JSON.parse(scripts[0][1]);
              summary.validJsonScripts += 1;
            } catch {
              continue;
            }
            const graph = Array.isArray(data['@graph']) ? data['@graph'] : [];
            const collection = graph.find((node) => node['@type'] === 'CollectionPage');
            const term = graph.find((node) => node['@type'] === 'DefinedTerm');
            summary.collectionPageNodes += collection ? 1 : 0;
            summary.definedTermNodes += term ? 1 : 0;
            summary.unexpectedTypes += graph.filter((node) => !['CollectionPage', 'DefinedTerm'].includes(node['@type'])).length;
            summary.sameAsClaims += graph.filter((node) => Object.hasOwn(node, 'sameAs')).length;
            summary.termCodeClaims += graph.filter((node) => Object.hasOwn(node, 'termCode')).length;
            if (collection?.['@id'] === `${canonical}#webpage` && term?.mainEntityOfPage?.['@id'] === `${canonical}#webpage`) summary.baselineLinks += 1;
            const expectedSet = locale === 'ja' ? 'https://whr.badjoke-lab.com/ja/glossary/#defined-term-set' : 'https://whr.badjoke-lab.com/glossary/#defined-term-set';
            if (term?.inDefinedTermSet?.['@id'] === expectedSet) summary.termSetLinks += 1;
            if (/^\d{4}-\d{2}-\d{2}$/.test(collection?.lastReviewed || '') && collection.lastReviewed === reviewDate) summary.reviewDates += 1;
            if (Array.isArray(term?.alternateName)) {
              summary.alternateNameArrays += 1;
              summary.alternateNameValues += term.alternateName.length;
            } else {
              summary.missingAlternateNames += 1;
            }
            if (collection?.url !== canonical || term?.url !== canonical || collection?.about?.['@id'] !== `${canonical}#defined-term` || collection?.mainEntity?.['@id'] !== `${canonical}#defined-term`) summary.canonicalMismatches += 1;
            if (collection?.name !== title || collection?.description !== description || collection?.inLanguage !== lang) summary.pageFieldMismatches += 1;
            if (term?.name !== termName) summary.termNameMismatches += 1;
            if (term?.description !== visibleSummary) summary.summaryMismatches += 1;
          }

          summary.slugs = slugs.size;
          console.log(JSON.stringify(summary, null, 2));
          NODE
          cat glossary-page-metadata-discovery.json
      - name: Upload glossary metadata discovery
        uses: actions/upload-artifact@v4
        with:
          name: glossary-page-metadata-discovery
          path: glossary-page-metadata-discovery.json
          retention-days: 1
