name: Calendar KRA Rank C promotion gate

on:
  pull_request:
    paths:
      - 'data/candidates/kra-2026-08-07-through-2026-09-06-rank-c-approved.json'
      - 'data/candidates/kra-2026-08-07-through-2026-09-06-rank-c-review-v1.json'
      - 'data/static/kra-2026-reviewed-public-timetable-identities-v1.json'
      - 'data/static/racecourses-public-timetable-identities-v1.json'
      - 'data/generated/timetable/canonical/meetings.json'
      - 'data/generated/timetable/canonical/meeting-details.json'
      - 'data/generated/timetable/public/meeting-list.json'
      - 'data/generated/timetable/public/meeting-details.json'
      - 'data/generated/timetable/public/japan-a-plus-overrides.json'
      - 'data/generated/timetable/operations-status.json'
      - '.github/workflows/calendar-kra-rank-c-promotion-gate.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Regenerate deterministic KRA-dependent derivatives
        run: |
          node scripts/timetable/build-japan-a-plus-public-overrides.mjs
          node scripts/timetable/build-operations-status.mjs --reference-date 2026-07-14
          node scripts/timetable/build-japan-a-plus-public-overrides.mjs --check
          node scripts/timetable/build-operations-status.mjs --reference-date 2026-07-14 --check
      - name: Stage exact derivative output as unreachable Git tree
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import base64, json, os, subprocess, tempfile
          from pathlib import Path
          repo = os.environ['GITHUB_REPOSITORY']
          head_sha = os.environ['HEAD_SHA']
          files = [
            'data/generated/timetable/public/japan-a-plus-overrides.json',
            'data/generated/timetable/operations-status.json',
          ]
          def gh_json(args, payload=None):
            cmd = ['gh', 'api', *args]
            if payload is None:
              return json.loads(subprocess.check_output(cmd, text=True))
            with tempfile.NamedTemporaryFile('w', delete=False, encoding='utf-8') as handle:
              json.dump(payload, handle); p = handle.name
            try:
              return json.loads(subprocess.check_output(cmd + ['--input', p], text=True))
            finally:
              os.unlink(p)
          commit = gh_json([f'repos/{repo}/git/commits/{head_sha}'])
          tree = []
          for file_path in files:
            raw = Path(file_path).read_bytes()
            blob = gh_json(['--method','POST',f'repos/{repo}/git/blobs'], {'content':base64.b64encode(raw).decode(),'encoding':'base64'})
            tree.append({'path':file_path,'mode':'100644','type':'blob','sha':blob['sha']})
          staged = gh_json(['--method','POST',f'repos/{repo}/git/trees'], {'base_tree':commit['tree']['sha'],'tree':tree})
          Path('kra-derived-stage.json').write_text(json.dumps({'head_sha':head_sha,'staged_tree_sha':staged['sha'],'files':files},indent=2)+'\n')
          print(staged['sha'])
          PY
      - name: Upload staged tree manifest
        uses: actions/upload-artifact@v4
        with:
          name: kra-derived-stage
          path: kra-derived-stage.json
          retention-days: 7
      - name: Cleanup
        run: rm -f kra-derived-stage.json
      - name: Prove repository clean except regenerated derivatives
        run: |
          git checkout -- data/generated/timetable/public/japan-a-plus-overrides.json data/generated/timetable/operations-status.json
          test -z "$(git status --porcelain --untracked-files=all)"
