name: Calendar KRA Rank C promotion gate

on:
  pull_request:
    paths:
      - 'data/candidates/kra-2026-08-07-through-2026-09-06-rank-c-review-v1.json'
      - 'data/static/authority-source-inventory-kra-calendar-plan-v1.json'
      - 'data/static/calendar-readiness-kra-calendar-plan-v1.json'
      - 'data/static/kra-2026-reviewed-calendar-plan-v1.json'
      - 'data/static/kra-2026-reviewed-public-timetable-identities-v1.json'
      - 'scripts/timetable/kra-calendar-plan-adapter.mjs'
      - 'scripts/timetable/build-kra-rank-c-approved-candidate.mjs'
      - 'scripts/timetable/manual-promote-reviewed-kra-rank-c.mjs'
      - 'scripts/timetable/load-authority-source-inventory.mjs'
      - 'scripts/timetable/load-calendar-readiness.mjs'
      - 'scripts/check-kra-calendar-plan-adapter.mjs'
      - 'scripts/check-kra-rank-c-promotion-gate.mjs'
      - '.github/workflows/calendar-kra-rank-c-promotion-gate.yml'
  push:
    branches:
      - main
    paths:
      - 'data/candidates/kra-2026-08-07-through-2026-09-06-rank-c-review-v1.json'
      - 'data/static/authority-source-inventory-kra-calendar-plan-v1.json'
      - 'data/static/calendar-readiness-kra-calendar-plan-v1.json'
      - 'data/static/kra-2026-reviewed-calendar-plan-v1.json'
      - 'data/static/kra-2026-reviewed-public-timetable-identities-v1.json'
      - 'scripts/timetable/kra-calendar-plan-adapter.mjs'
      - 'scripts/timetable/build-kra-rank-c-approved-candidate.mjs'
      - 'scripts/timetable/manual-promote-reviewed-kra-rank-c.mjs'
      - 'scripts/timetable/load-authority-source-inventory.mjs'
      - 'scripts/timetable/load-calendar-readiness.mjs'
      - 'scripts/check-kra-calendar-plan-adapter.mjs'
      - 'scripts/check-kra-rank-c-promotion-gate.mjs'
      - '.github/workflows/calendar-kra-rank-c-promotion-gate.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Validate deterministic KRA candidate adapter
        run: node scripts/check-kra-calendar-plan-adapter.mjs
      - name: Build approved KRA candidate from reviewed manifest
        run: |
          node scripts/timetable/build-kra-rank-c-approved-candidate.mjs
          node scripts/timetable/build-kra-rank-c-approved-candidate.mjs --check
      - name: Exercise shared promotion core without writing canonical data
        run: node scripts/timetable/promote-approved-candidate-v1.mjs --input data/candidates/kra-2026-08-07-through-2026-09-06-rank-c-approved.json --dry-run
      - name: Validate approved KRA promotion gate
        run: node scripts/check-kra-rank-c-promotion-gate.mjs
      - name: Upload pre-promotion baseline artifact
        uses: actions/upload-artifact@v4
        with:
          name: kra-rank-c-pre-promotion-baseline
          if-no-files-found: error
          retention-days: 7
          path: |
            data/candidates/kra-2026-08-07-through-2026-09-06-rank-c-review-v1.json
            data/static/kra-2026-reviewed-public-timetable-identities-v1.json
            data/static/racecourses-public-timetable-identities-v1.json
            data/generated/timetable/canonical/meetings.json
            data/generated/timetable/canonical/meeting-details.json
            data/generated/timetable/public/meeting-list.json
            data/generated/timetable/public/meeting-details.json
      - name: Materialize reviewed KRA publication output
        run: node scripts/timetable/manual-promote-reviewed-kra-rank-c.mjs
      - name: Upload reviewed KRA publication artifact
        uses: actions/upload-artifact@v4
        with:
          name: kra-rank-c-reviewed-publication
          if-no-files-found: error
          retention-days: 7
          path: |
            data/candidates/kra-2026-08-07-through-2026-09-06-rank-c-approved.json
            data/candidates/kra-2026-08-07-through-2026-09-06-rank-c-review-v1.json
            data/static/kra-2026-reviewed-public-timetable-identities-v1.json
            data/static/racecourses-public-timetable-identities-v1.json
            data/generated/timetable/canonical/meetings.json
            data/generated/timetable/canonical/meeting-details.json
            data/generated/timetable/public/meeting-list.json
            data/generated/timetable/public/meeting-details.json
      - name: Stage exact reviewed output as unreachable Git tree
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import subprocess
          import tempfile

          repo = os.environ['GITHUB_REPOSITORY']
          head_sha = os.environ['HEAD_SHA']
          files = [
              'data/candidates/kra-2026-08-07-through-2026-09-06-rank-c-approved.json',
              'data/candidates/kra-2026-08-07-through-2026-09-06-rank-c-review-v1.json',
              'data/static/kra-2026-reviewed-public-timetable-identities-v1.json',
              'data/static/racecourses-public-timetable-identities-v1.json',
              'data/generated/timetable/canonical/meetings.json',
              'data/generated/timetable/canonical/meeting-details.json',
              'data/generated/timetable/public/meeting-list.json',
              'data/generated/timetable/public/meeting-details.json',
          ]

          def gh_json(args, payload=None):
              cmd = ['gh', 'api', *args]
              if payload is None:
                  return json.loads(subprocess.check_output(cmd, text=True))
              with tempfile.NamedTemporaryFile('w', delete=False, encoding='utf-8') as handle:
                  json.dump(payload, handle)
                  temp_path = handle.name
              try:
                  return json.loads(subprocess.check_output(cmd + ['--input', temp_path], text=True))
              finally:
                  os.unlink(temp_path)

          commit = gh_json([f'repos/{repo}/git/commits/{head_sha}'])
          base_tree_sha = commit['tree']['sha']
          tree = []
          staged = []
          for file_path in files:
              raw = open(file_path, 'rb').read()
              blob = gh_json(
                  ['--method', 'POST', f'repos/{repo}/git/blobs'],
                  {'content': base64.b64encode(raw).decode('ascii'), 'encoding': 'base64'},
              )
              tree.append({'path': file_path, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
              staged.append({'path': file_path, 'blob_sha': blob['sha'], 'sha256': hashlib.sha256(raw).hexdigest(), 'bytes': len(raw)})

          staged_tree = gh_json(
              ['--method', 'POST', f'repos/{repo}/git/trees'],
              {'base_tree': base_tree_sha, 'tree': tree},
          )
          manifest = {
              'schema_version': 'kra-reviewed-publication-staged-tree-v1',
              'head_sha': head_sha,
              'base_tree_sha': base_tree_sha,
              'staged_tree_sha': staged_tree['sha'],
              'files': staged,
              'branch_ref_updated': False,
              'commit_created': False,
          }
          with open('kra-reviewed-staged-tree.json', 'w', encoding='utf-8') as handle:
              json.dump(manifest, handle, indent=2)
              handle.write('\n')
          print(json.dumps(manifest, indent=2))
          PY
      - name: Upload staged-tree manifest
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: kra-rank-c-staged-tree
          if-no-files-found: error
          retention-days: 7
          path: kra-reviewed-staged-tree.json
      - name: Restore checkout after artifact capture
        run: |
          git reset --hard HEAD
          git clean -fd
      - name: Prove repository clean
        run: |
          changes="$(git status --porcelain --untracked-files=all)"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            exit 1
          fi
