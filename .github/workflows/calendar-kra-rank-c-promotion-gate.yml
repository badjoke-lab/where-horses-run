name: Calendar KRA Rank C promotion gate

on:
  pull_request:
    paths:
      - 'data/candidates/kra-2026-08-07-through-2026-09-06-rank-c-approved.json'
      - 'data/candidates/kra-2026-08-07-through-2026-09-06-rank-c-review-v1.json'
      - 'data/static/kra-2026-reviewed-public-timetable-identities-v1.json'
      - 'data/static/racecourses-public-timetable-identities-v1.json'
      - 'data/generated/timetable/canonical/meetings.json'
      - 'data/generated/timetable/public/meeting-list.json'
      - 'data/generated/timetable/public/japan-a-plus-overrides.json'
      - 'data/generated/timetable/operations-status.json'
      - 'data/generated/timetable/operations-review-package.json'
      - '.github/workflows/calendar-kra-rank-c-promotion-gate.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Regenerate deterministic operations review package
        run: |
          node scripts/timetable/build-operations-review-package.mjs
          node scripts/timetable/build-operations-review-package.mjs --check
      - name: Stage exact review package as unreachable Git tree
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import base64, json, os, subprocess, tempfile
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']; head=os.environ['HEAD_SHA']
          file_path='data/generated/timetable/operations-review-package.json'
          def gh(args,payload=None):
            cmd=['gh','api',*args]
            if payload is None: return json.loads(subprocess.check_output(cmd,text=True))
            with tempfile.NamedTemporaryFile('w',delete=False,encoding='utf-8') as h:
              json.dump(payload,h); p=h.name
            try: return json.loads(subprocess.check_output(cmd+['--input',p],text=True))
            finally: os.unlink(p)
          commit=gh([f'repos/{repo}/git/commits/{head}'])
          raw=Path(file_path).read_bytes()
          blob=gh(['--method','POST',f'repos/{repo}/git/blobs'],{'content':base64.b64encode(raw).decode(),'encoding':'base64'})
          tree=gh(['--method','POST',f'repos/{repo}/git/trees'],{'base_tree':commit['tree']['sha'],'tree':[{'path':file_path,'mode':'100644','type':'blob','sha':blob['sha']}]})
          Path('kra-ops-review-stage.json').write_text(json.dumps({'head_sha':head,'staged_tree_sha':tree['sha'],'file':file_path},indent=2)+'\n')
          PY
      - name: Upload staged tree manifest
        uses: actions/upload-artifact@v4
        with:
          name: kra-ops-review-stage
          path: kra-ops-review-stage.json
          retention-days: 7
      - name: Cleanup and prove source clean
        run: |
          rm -f kra-ops-review-stage.json
          git checkout -- data/generated/timetable/operations-review-package.json
          test -z "$(git status --porcelain --untracked-files=all)"
