name: Calendar daily acquisition

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/calendar-daily-acquisition.yml'
      - 'scripts/timetable/actions-multi-job-core.mjs'
      - 'scripts/timetable/run-calendar-actions-job.mjs'
      - 'scripts/timetable/build-calendar-live-retry-queue.mjs'
      - 'scripts/timetable/build-calendar-live-planner-state.mjs'
      - 'scripts/timetable/plan-calendar-due-jobs.mjs'
      - 'scripts/timetable/plan-actions-multi-job.mjs'
      - 'scripts/timetable/write-calendar-daily-plan-outputs.mjs'
      - 'data/static/calendar-due-job-policy-v1.json'
      - 'data/static/calendar-system-season-state-v1.json'
      - 'data/static/calendar-acquisition-registry.json'
      - 'data/generated/timetable/canonical/meetings.json'
      - 'data/generated/timetable/public/meeting-list.json'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/calendar-daily-acquisition.yml'
      - 'scripts/timetable/actions-multi-job-core.mjs'
      - 'scripts/timetable/run-calendar-actions-job.mjs'
      - 'scripts/timetable/build-calendar-live-retry-queue.mjs'
      - 'scripts/timetable/build-calendar-live-planner-state.mjs'
      - 'scripts/timetable/plan-calendar-due-jobs.mjs'
      - 'scripts/timetable/plan-actions-multi-job.mjs'
      - 'scripts/timetable/write-calendar-daily-plan-outputs.mjs'
      - 'data/static/calendar-due-job-policy-v1.json'
      - 'data/static/calendar-system-season-state-v1.json'
      - 'data/static/calendar-acquisition-registry.json'
      - 'data/generated/timetable/canonical/meetings.json'
      - 'data/generated/timetable/public/meeting-list.json'

permissions:
  contents: read

concurrency:
  group: calendar-daily-acquisition-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Check acquisition runtime syntax
        run: |
          node --check scripts/timetable/actions-multi-job-core.mjs
          node --check scripts/timetable/run-calendar-actions-job.mjs
          node --check scripts/timetable/build-calendar-live-retry-queue.mjs
          node --check scripts/timetable/build-calendar-live-planner-state.mjs
          node --check scripts/timetable/plan-calendar-due-jobs.mjs
          node --check scripts/timetable/plan-actions-multi-job.mjs
          node --check scripts/timetable/write-calendar-daily-plan-outputs.mjs
      - name: Exercise planner on committed public state
        shell: bash
        run: |
          as_of="$(node --input-type=module -e "import fs from 'node:fs'; const data=JSON.parse(fs.readFileSync('data/generated/timetable/public/meeting-list.json','utf8')); if (!data.generated_at || Number.isNaN(Date.parse(data.generated_at))) throw new Error('invalid meeting-list generated_at'); process.stdout.write(data.generated_at);")"
          node scripts/timetable/build-calendar-live-retry-queue.mjs --as-of="$as_of" --output=.calendar-live-retry-queue.json
          node scripts/timetable/build-calendar-live-planner-state.mjs --as-of="$as_of" --retry-queue=.calendar-live-retry-queue.json --output=.calendar-live-state.json
          node scripts/timetable/plan-calendar-due-jobs.mjs --state=.calendar-live-state.json --output=.calendar-due-job-plan.json
          node scripts/timetable/plan-actions-multi-job.mjs --plan-file=.calendar-due-job-plan.json --output=.calendar-actions-plan.json --matrix-output=.calendar-actions-matrix.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const queue = JSON.parse(fs.readFileSync('.calendar-live-retry-queue.json', 'utf8'));
          if (!Array.isArray(queue.entries)) throw new Error('live retry queue entries must be an array');
          if (queue.entries.some((entry) => entry.system_id !== 'japan-nar-system')) throw new Error('live retry queue contains non-NAR entry');
          const matrix = JSON.parse(fs.readFileSync('.calendar-actions-matrix.json', 'utf8'));
          if (!Array.isArray(matrix.include)) throw new Error('actions matrix include must be an array');
          for (const entry of matrix.include) {
            if (entry.collection_job?.job_id !== entry.execution?.job_id) throw new Error('collection/execution job identity mismatch');
          }
          NODE
      - name: Check diff formatting
        run: git diff --check

  plan:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.outputs.outputs.matrix }}
      hosted_jobs: ${{ steps.outputs.outputs.hosted_jobs }}
      plan_id: ${{ steps.outputs.outputs.plan_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - id: clock
        name: Resolve planning time
        shell: bash
        run: echo "as_of=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build current live retry queue
        run: node scripts/timetable/build-calendar-live-retry-queue.mjs --as-of="${{ steps.clock.outputs.as_of }}" --output=.calendar-live-retry-queue.json
      - name: Build current planner state
        run: node scripts/timetable/build-calendar-live-planner-state.mjs --as-of="${{ steps.clock.outputs.as_of }}" --retry-queue=.calendar-live-retry-queue.json --output=.calendar-live-state.json
      - name: Plan due acquisition jobs
        run: node scripts/timetable/plan-calendar-due-jobs.mjs --state=.calendar-live-state.json --output=.calendar-due-job-plan.json
      - name: Compile hosted jobs
        run: node scripts/timetable/plan-actions-multi-job.mjs --plan-file=.calendar-due-job-plan.json --output=.calendar-actions-plan.json --matrix-output=.calendar-actions-matrix.json
      - id: outputs
        name: Write plan outputs
        run: node scripts/timetable/write-calendar-daily-plan-outputs.mjs --due-plan=.calendar-due-job-plan.json --actions-plan=.calendar-actions-plan.json --matrix=.calendar-actions-matrix.json --collection-plan=.calendar-collection-plan.json --github-output="$GITHUB_OUTPUT"
      - name: Upload planning artifacts
        uses: actions/upload-artifact@v4
        with:
          name: calendar-daily-acquisition-plan
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
          path: |
            .calendar-live-retry-queue.json
            .calendar-live-state.json
            .calendar-due-job-plan.json
            .calendar-collection-plan.json
            .calendar-actions-plan.json
            .calendar-actions-matrix.json

  execute:
    if: needs.plan.result == 'success' && needs.plan.outputs.hosted_jobs != '0'
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Write collection and execution specs
        env:
          COLLECTION_JOB_JSON: ${{ toJson(matrix.collection_job) }}
          EXECUTION_JSON: ${{ toJson(matrix.execution) }}
        shell: bash
        run: |
          printf '%s\n' "$COLLECTION_JOB_JSON" > .calendar-collection-job.json
          printf '%s\n' "$EXECUTION_JSON" > .calendar-execution.json
      - name: Run hosted acquisition job
        run: node scripts/timetable/run-calendar-actions-job.mjs --job=.calendar-collection-job.json --execution=.calendar-execution.json
      - name: Upload acquisition artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calendar-daily-job-${{ matrix.job_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            data/generated/timetable/actions-multi-job-status/${{ matrix.batch_id }}.json
            data/generated/timetable/nar-incremental-batches/${{ matrix.batch_id }}/
            data/candidates/nar-incremental-batches/${{ matrix.batch_id }}/
            data/generated/timetable/actions-multi-job/${{ matrix.batch_id }}/
