name: SOREC detail route probe

on:
  pull_request:
    paths:
      - 'scripts/probe-sorec-detail-route.mjs'
      - 'scripts/probe-sorec-browser-download.mjs'
      - '.github/workflows/sorec-detail-route-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install Playwright probe dependency
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Probe SOREC programme download in Chromium
        run: node scripts/probe-sorec-browser-download.mjs
