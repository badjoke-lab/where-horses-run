name: Calendar US New Jersey Meadowlands turf production smoke

on:
  pull_request:
    paths:
      - '.github/workflows/calendar-us-nj-meadowlands-turf-official-refresh.yml'
      - '.github/workflows/calendar-unified-official-refresh.yml'
      - '.github/workflows/calendar-near-official-refresh.yml'
      - 'scripts/timetable/us-nj-meadowlands-turf-core.mjs'
      - 'scripts/timetable/run-us-nj-meadowlands-turf-window.mjs'
      - 'scripts/check-us-nj-meadowlands-turf-adapter.mjs'
      - 'data/static/calendar-acquisition-registry.json'
      - 'data/static/calendar-public-country-support-v1.json'
      - 'data/static/calendar-98-tier-execution-coverage.json'
      - 'data/static/racecourses.json'
      - 'data/static/racecourse-locations-v1.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --no-audit --no-fund
      - name: Validate standalone NJ parser and candidate
        run: npm run validate:us-nj-meadowlands-turf
      - name: Fetch real 2026 Meadowlands turf calendar and apply scoped evidence
        run: |
          mkdir -p .calendar-us-nj
          node scripts/timetable/run-us-nj-meadowlands-turf-window.mjs --as-of=2026-10-12 --days=90 --output=.calendar-us-nj/nj.json
          node --input-type=module -e "import fs from 'node:fs';let a=JSON.parse(fs.readFileSync('.calendar-us-nj/nj.json','utf8'));if(a.acquisition_attempt.status!=='success'||a.discovery.source_visible_rows!==8||a.discovery.reviewed_regulator_approved_dates!==9||a.records.length!==1||a.records[0].date!=='2026-10-16')throw Error('NJ turf source-visible date assertion failed')"
          node scripts/timetable/apply-official-rolling-observations.mjs --artifact=.calendar-us-nj/nj.json --country-id=united-states --authority-id=new-jersey-racing-commission --racing-system-id=us-nj-meadowlands-thoroughbred-turf-system --timezone=America/New_York
          node scripts/check-calendar-public-country-support.mjs
          node scripts/check-calendar-public-map-parity.mjs
          node scripts/check-calendar-non-running-evidence-registry.mjs
          node scripts/check-calendar-unified-audit-coverage.mjs
          node scripts/check-calendar-98-tier-execution-coverage.mjs
