name: Patch Chile unified refresh once

on:
  push:
    branches:
      - feat/calendar-chile-official-20260909
    paths:
      - '.github/workflows/patch-chile-unified-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/calendar-chile-official-20260909
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Patch unified refresh, guard, and racecourse identities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          workflow_path = Path('.github/workflows/calendar-unified-official-refresh.yml')
          text = workflow_path.read_text()
          text = text.replace('Collect TJK and SOREC official windows', 'Collect TJK, SOREC and Chile official windows')

          sorec_collect = '''          node scripts/timetable/run-sorec-official-window.mjs \\
            --days="${{ steps.scope.outputs.days }}" \\
            --output=.calendar-unified/sorec.json'''
          chile_collect = sorec_collect + '''
          node scripts/timetable/run-chile-teletrak-official-window.mjs \\
            --days="${{ steps.scope.outputs.days }}" \\
            --output=.calendar-unified/chile.json'''
          assert text.count(sorec_collect) == 2, text.count(sorec_collect)
          text = text.replace(sorec_collect, chile_collect)

          sorec_exclusion = '            --artifact=.calendar-unified/sorec.json'
          assert text.count(sorec_exclusion) == 2, text.count(sorec_exclusion)
          text = text.replace(sorec_exclusion, sorec_exclusion + ' \\\n            --artifact=.calendar-unified/chile.json')

          sorec_apply = '''          node scripts/timetable/apply-official-rolling-observations.mjs \\
            --artifact=.calendar-unified/sorec.json \\
            --country-id=morocco \\
            --authority-id=sorec \\
            --racing-system-id=sorec-racing-information-system \\
            --timezone=Africa/Casablanca'''
          chile_apply = sorec_apply + '''
          node scripts/timetable/apply-official-rolling-observations.mjs \\
            --artifact=.calendar-unified/chile.json \\
            --country-id=chile \\
            --authority-id=teletrak-chile \\
            --racing-system-id=chile-teletrak-racing-system \\
            --timezone=America/Santiago'''
          assert text.count(sorec_apply) == 2, text.count(sorec_apply)
          text = text.replace(sorec_apply, chile_apply)
          workflow_path.write_text(text)

          checker_path = Path('scripts/check-chile-teletrak-weekly-adapter.mjs')
          checker = checker_path.read_text()
          marker = "console.log('CHILE_TELETRAK_WEEKLY_ADAPTER: pass');"
          guard = '''const unifiedWorkflow = fs.readFileSync('.github/workflows/calendar-unified-official-refresh.yml', 'utf8');
          assert.equal((unifiedWorkflow.match(/run-chile-teletrak-official-window\\.mjs/g) ?? []).length, 2, 'Chile collector must run in normal and latest-main rebuild paths');
          assert.equal((unifiedWorkflow.match(/--authority-id=teletrak-chile/g) ?? []).length, 2, 'Chile apply must run in normal and latest-main rebuild paths');
          assert.equal((unifiedWorkflow.match(/--artifact=\\.calendar-unified\\/chile\\.json/g) ?? []).length, 4, 'Chile artifact must be excluded/applied in both paths');
          assert.doesNotMatch(unifiedWorkflow, /chile[^\\n]{0,80}(?:public_rank_ceiling|capability_rank:\\s*['\"]C['\"])/i, 'Chile unified refresh must not hard-code C');
          console.log('CHILE_UNIFIED_REFRESH_WIRING: pass');

          '''
          assert marker in checker
          if 'CHILE_UNIFIED_REFRESH_WIRING: pass' not in checker:
              checker = checker.replace(marker, guard + marker)
          checker_path.write_text(checker)

          racecourse_path = Path('data/static/country-page-racecourses-01-04.json')
          raw = racecourse_path.read_text().rstrip()
          existing = json.loads(raw)
          existing_ids = {row.get('id') for row in existing}
          common = {
            'timezone': 'America/Santiago',
            'racing_types': ['thoroughbred-flat'],
            'status': 'active',
            'surfaces': [],
            'direction': None,
            'course_profile': {
              'turf_circumference_m': None, 'dirt_circumference_m': None, 'home_straight_m': None,
              'has_inner_outer_courses': None, 'has_lighting': None, 'elevation_notes_en': None, 'elevation_notes_ja': None,
              'course_notes_en': 'Teletrak identifies this venue in Chile’s official weekly domestic racing view. Detailed course metrics remain unverified.',
              'course_notes_ja': 'Teletrakのチリ国内公式週間開催表示で確認できる競馬場。詳細なコース指標は未確認。'
            },
            'distance_profile': {
              'turf': {'min_m': None, 'max_m': None, 'known_distances_m': []},
              'dirt': {'min_m': None, 'max_m': None, 'known_distances_m': []},
              'all_weather': {'min_m': None, 'max_m': None, 'known_distances_m': []},
              'jump': {'min_m': None, 'max_m': None, 'known_distances_m': []},
              'harness': {'min_m': None, 'max_m': None, 'known_distances_m': []},
              'upcoming_conditions': []
            },
            'schedule_summary': {'today_status': 'unknown', 'next_meeting_date': None, 'upcoming_meetings': [], 'status': 'official-source-verified', 'last_checked': '2026-09-10'},
            'notable_races': [],
            'seasonality': {'summary_en': 'Use Teletrak’s official weekly view for current meeting identity.', 'summary_ja': '現行の開催競馬場はTeletrak公式週間表示で確認する。', 'status': 'partial'},
            'official_links': [{'label_en': 'Teletrak Chile weekly racing', 'label_ja': 'Teletrak Chile 週間開催', 'source_id': 'chile-teletrak-weekly-programme', 'url': 'https://teletrak.cl/', 'link_type': 'official'}],
            'related_terms': ['racecourse', 'meeting', 'fixture'],
            'related_sources': ['chile-teletrak-weekly-programme'],
            'data_status': {'course_profile': 'unverified', 'schedule': 'official-source-verified', 'source_status': 'verified', 'last_checked': '2026-09-10'},
            'image_status': 'planned', 'image_path': None, 'course_diagram_status': 'pending'
          }
          venues = [
            ('club-hipico-de-santiago-racecourse', 'Club Hípico de Santiago', 'サンティアゴ競馬場', 'Club Hípico de Santiago', 'Santiago', 'Santiago Metropolitan Region'),
            ('hipodromo-chile-racecourse', 'Hipódromo Chile', 'イポドロモ・チレ', 'Hipódromo Chile', 'Santiago', 'Santiago Metropolitan Region'),
            ('valparaiso-sporting-club-racecourse', 'Valparaíso Sporting Club', 'バルパライソ・スポーティングクラブ', 'Valparaíso Sporting Club', 'Viña del Mar', 'Valparaíso Region'),
            ('club-hipico-de-concepcion-racecourse', 'Club Hípico de Concepción', 'コンセプシオン競馬場', 'Club Hípico de Concepción', 'Concepción', 'Biobío Region'),
          ]
          additions = []
          for rid, en, ja, local, city, region in venues:
              if rid in existing_ids:
                  continue
              row = {'id': rid, 'slug': rid, 'country_id': 'chile', 'name_en': en, 'name_ja': ja, 'name_local': local, 'city': city, 'region': region, **common}
              row['image_alt_en'] = f'Planned illustrative image for {en}.'
              row['image_alt_ja'] = f'{ja}の説明用イメージ画像予定地。'
              row['image'] = {'src': '', 'alt_en': row['image_alt_en'], 'alt_ja': row['image_alt_ja'], 'image_type': 'placeholder', 'is_official_photo': False, 'note_en': 'Illustrative image. Not an official venue photo.', 'note_ja': '説明用のイメージ画像です。公式写真ではありません。', 'status': 'planned'}
              additions.append(row)
          if additions:
              assert raw.endswith(']')
              prefix = raw[:-1].rstrip()
              if prefix != '[':
                  prefix += ','
              serialized = ',\n'.join(json.dumps(row, ensure_ascii=False, separators=(',', ':')) for row in additions)
              racecourse_path.write_text(prefix + '\n' + serialized + '\n]\n')
          PY

          node scripts/check-chile-teletrak-weekly-adapter.mjs
          node --check scripts/timetable/chile-teletrak-weekly-core.mjs
          node --check scripts/timetable/run-chile-teletrak-official-window.mjs
          node scripts/check-calendar-refresh-publication-boundaries.mjs
          npm install --no-package-lock --no-audit --no-fund
          npm run build
          git diff --check
      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-chile-unified-once.yml
          git add .github/workflows/calendar-unified-official-refresh.yml scripts/check-chile-teletrak-weekly-adapter.mjs data/static/country-page-racecourses-01-04.json
          git commit -m "feat: wire Chile into unified refresh and racecourse identities"
          git push origin HEAD:feat/calendar-chile-official-20260909
