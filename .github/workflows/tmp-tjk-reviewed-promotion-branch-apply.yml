name: Temporary TJK reviewed promotion branch apply

on:
  push:
    branches:
      - timetable/tjk-current-reviewed-promotion
    paths:
      - '.github/workflows/tmp-tjk-reviewed-promotion-branch-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: timetable/tjk-current-reviewed-promotion
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Apply explicitly approved TJK promotion locally on branch
        run: node scripts/timetable/manual-promote-reviewed-tjk-current.mjs
      - name: Reject unexpected generated paths
        run: |
          changed="$(git status --porcelain --untracked-files=all | sed -E 's/^.. //')"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(data/candidates/tjk-current-2026-08-11-approved.json|data/candidates/tjk-current-2026-08-11-promotion-review-v1.json|data/static/tjk-2026-08-11-reviewed-public-timetable-identities-v1.json|data/static/racecourses-public-timetable-identities-v1.json|data/generated/timetable/canonical/meetings.json|data/generated/timetable/canonical/meeting-details.json|data/generated/timetable/public/meeting-list.json|data/generated/timetable/public/meeting-details.json)$' || true)"
          if [ -n "$unexpected" ]; then
            echo 'Unexpected files changed by TJK promotion:' >&2
            echo "$unexpected" >&2
            exit 1
          fi
      - name: Commit generated reviewed promotion output to branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/candidates/tjk-current-2026-08-11-approved.json \
            data/candidates/tjk-current-2026-08-11-promotion-review-v1.json \
            data/static/tjk-2026-08-11-reviewed-public-timetable-identities-v1.json \
            data/static/racecourses-public-timetable-identities-v1.json \
            data/generated/timetable/canonical/meetings.json \
            data/generated/timetable/canonical/meeting-details.json \
            data/generated/timetable/public/meeting-list.json \
            data/generated/timetable/public/meeting-details.json
          git diff --cached --quiet && { echo 'No generated TJK promotion changes to commit.'; exit 0; }
          git commit -m 'Generate reviewed TJK A publication output'
          git push origin HEAD:timetable/tjk-current-reviewed-promotion
