name: Calendar NAR fixture probe

on:
  pull_request:
    paths:
      - 'START-HERE.md'
      - 'docs/calendar/nar-a-plus-pilot-plan.md'
      - 'docs/calendar/nar-fixture-probe.md'
      - 'data/fixtures/timetable/nar/route-probe-v1.json'
      - 'data/audits/nar-fixture-probe-v1.json'
      - 'data/static/nar-source-route-architecture-v1.json'
      - 'data/static/japan-a-plus-runtime-control.json'
      - 'scripts/check-calendar-nar-fixture-probe.mjs'
      - '.github/workflows/calendar-nar-fixture-probe.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/calendar/nar-a-plus-pilot-plan.md'
      - 'docs/calendar/nar-fixture-probe.md'
      - 'data/fixtures/timetable/nar/route-probe-v1.json'
      - 'data/audits/nar-fixture-probe-v1.json'
      - 'scripts/check-calendar-nar-fixture-probe.mjs'
      - '.github/workflows/calendar-nar-fixture-probe.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Validate NAR fixture probe
        run: node scripts/check-calendar-nar-fixture-probe.mjs
      - name: Validate NAR source architecture
        run: node scripts/check-calendar-nar-source-architecture.mjs
      - name: Validate project governance
        run: node scripts/check-project-governance-docs.mjs
      - name: Confirm full checks are delegated
        run: echo 'Repository-wide Check and Calendar release gates run independently on this pull request.'
