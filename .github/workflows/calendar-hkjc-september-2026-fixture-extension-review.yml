name: Calendar HKJC September 2026 fixture extension review

on:
  pull_request:
    paths:
      - '.github/workflows/calendar-hkjc-september-2026-fixture-extension-review.yml'
      - 'scripts/timetable/build-hkjc-september-2026-fixture-extension-approved-candidates.mjs'
      - 'scripts/timetable/apply-hkjc-september-2026-readiness-review.mjs'
      - 'data/candidates/hkjc-september-2026-fixture-extension-approved.json'
      - 'data/static/calendar-readiness-registry.json'
      - 'scripts/check-calendar-nar-incremental-v2-promotion-output-determinism.mjs'
      - 'data/generated/timetable/canonical/**'
      - 'data/generated/timetable/public/**'
      - 'data/generated/timetable/operations-status.json'
      - 'data/generated/timetable/operations-review-package.json'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/calendar-hkjc-september-2026-fixture-extension-review.yml'
      - 'scripts/timetable/build-hkjc-september-2026-fixture-extension-approved-candidates.mjs'
      - 'scripts/timetable/apply-hkjc-september-2026-readiness-review.mjs'
      - 'data/candidates/hkjc-september-2026-fixture-extension-approved.json'
      - 'data/static/calendar-readiness-registry.json'
      - 'scripts/check-calendar-nar-incremental-v2-promotion-output-determinism.mjs'
      - 'data/generated/timetable/canonical/**'
      - 'data/generated/timetable/public/**'
      - 'data/generated/timetable/operations-status.json'
      - 'data/generated/timetable/operations-review-package.json'

permissions:
  contents: read

concurrency:
  group: calendar-hkjc-september-2026-fixture-extension-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          path: work

      - name: Checkout exact daily-review source evidence
        uses: actions/checkout@v4
        with:
          ref: 89757a0289a0237490aebf5683ffa026f79ccb88
          path: review-source
          sparse-checkout: |
            data/generated/timetable/actions-multi-job/due-job-plan-2026-08-20-due-hong-kong-hkjc-season-wake-up-001-run-001/candidates.json
            data/generated/timetable/actions-multi-job/due-job-plan-2026-08-20-due-hong-kong-hkjc-season-wake-up-002-run-001/candidates.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Rebuild approved Rank C HKJC fixture candidate from exact review evidence
        working-directory: work
        env:
          WHR_HKJC_REVIEW_BATCH_1: ${{ github.workspace }}/review-source/data/generated/timetable/actions-multi-job/due-job-plan-2026-08-20-due-hong-kong-hkjc-season-wake-up-001-run-001/candidates.json
          WHR_HKJC_REVIEW_BATCH_2: ${{ github.workspace }}/review-source/data/generated/timetable/actions-multi-job/due-job-plan-2026-08-20-due-hong-kong-hkjc-season-wake-up-002-run-001/candidates.json
        run: node scripts/timetable/build-hkjc-september-2026-fixture-extension-approved-candidates.mjs

      - name: Verify reviewed candidate remains deterministic
        working-directory: work
        run: git diff --exit-code -- data/candidates/hkjc-september-2026-fixture-extension-approved.json

      - name: Apply reviewed HKJC readiness scope
        working-directory: work
        run: node scripts/timetable/apply-hkjc-september-2026-readiness-review.mjs

      - name: Verify reviewed readiness scope remains deterministic
        working-directory: work
        run: git diff --exit-code -- data/static/calendar-readiness-registry.json

      - name: Dry-run promotion validation
        working-directory: work
        run: node scripts/timetable/promote-timetable.mjs --input data/candidates/hkjc-september-2026-fixture-extension-approved.json --dry-run

      - name: Snapshot current committed meeting records before historical replay
        working-directory: work
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const canonical = JSON.parse(fs.readFileSync('data/generated/timetable/canonical/meetings.json', 'utf8'));
          const publicList = JSON.parse(fs.readFileSync('data/generated/timetable/public/meeting-list.json', 'utf8'));
          const snapshot = {
            canonical: canonical.meetings,
            public: publicList.meetings,
          };
          const output = path.join(process.env.RUNNER_TEMP, 'hkjc-september-pre-replay-meetings.json');
          fs.writeFileSync(output, `${JSON.stringify(snapshot)}\n`);
          console.log(JSON.stringify({
            canonical_meetings: snapshot.canonical.length,
            public_meetings: snapshot.public.length,
          }));
          NODE

      - name: Replay reviewed candidate into canonical timetable
        working-directory: work
        run: node scripts/timetable/promote-timetable.mjs --input data/candidates/hkjc-september-2026-fixture-extension-approved.json

      - name: Rebuild deterministic public timetable projection
        working-directory: work
        run: node scripts/timetable/build-public-timetable-view.mjs

      - name: Rebuild coupled public and operations derivatives
        working-directory: work
        run: |
          node scripts/timetable/build-japan-a-plus-public-overrides.mjs
          node scripts/timetable/build-operations-status.mjs --reference-date 2026-07-01
          node scripts/timetable/build-operations-review-package.mjs

      - name: Validate generated repository data
        working-directory: work
        run: node scripts/validate-data.mjs

      - name: Verify coupled public derivatives
        working-directory: work
        run: |
          node scripts/check-japan-a-plus-public-overrides.mjs
          node scripts/check-calendar-operations-status.mjs
          node scripts/check-calendar-operations-review-package.mjs

      - name: Verify exact Rank C HKJC September extension output
        working-directory: work
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const candidate = JSON.parse(fs.readFileSync('data/candidates/hkjc-september-2026-fixture-extension-approved.json', 'utf8'));
          const expectedIds = [
            'hkjc-happy-valley-racecourse-2026-09-09',
            'hkjc-sha-tin-racecourse-2026-09-13',
            'hkjc-happy-valley-racecourse-2026-09-16',
          ];
          if (candidate.review?.status !== 'approved') throw new Error('review status differs');
          if (candidate.review?.promotion_target !== 'canonical-timetable-v0') throw new Error('promotion target differs');
          if (JSON.stringify(candidate.records.map((record) => record.meeting_id)) !== JSON.stringify(expectedIds)) throw new Error('reviewed meeting identities differ');
          for (const record of candidate.records) {
            if (record.capability_rank !== 'C') throw new Error(`${record.meeting_id}: rank exceeds C`);
            if (record.first_race_time_local !== null || record.last_race_time_local !== null) throw new Error(`${record.meeting_id}: race time leaked`);
            if (!Array.isArray(record.timetable_rows) || record.timetable_rows.length !== 0) throw new Error(`${record.meeting_id}: timetable rows leaked`);
          }

          const readiness = JSON.parse(fs.readFileSync('data/static/calendar-readiness-registry.json', 'utf8'));
          const readinessRecord = readiness.records.find((record) => record.readiness_id === 'hong-kong--hong-kong-hkjc-system--hkjc-fixture-list');
          if (JSON.stringify(readinessRecord?.racecourse_ids) !== JSON.stringify(['sha-tin-racecourse', 'happy-valley-racecourse'])) throw new Error('reviewed HKJC fixture racecourse scope differs');

          const canonical = JSON.parse(fs.readFileSync('data/generated/timetable/canonical/meetings.json', 'utf8'));
          const publicList = JSON.parse(fs.readFileSync('data/generated/timetable/public/meeting-list.json', 'utf8'));
          const canonicalById = new Map(canonical.meetings.map((meeting) => [meeting.meeting_id, meeting]));
          const publicById = new Map(publicList.meetings.map((meeting) => [meeting.meeting_id, meeting]));
          for (const id of expectedIds) {
            if (canonicalById.get(id)?.capability_rank !== 'C') throw new Error(`${id}: canonical Rank C output missing`);
            if (publicById.get(id)?.capability_rank !== 'C') throw new Error(`${id}: public Rank C output missing`);
            if (publicById.get(id)?.first_race_time_local !== null || publicById.get(id)?.last_race_time_local !== null) throw new Error(`${id}: public race time leaked`);
            if (publicById.get(id)?.detail_path !== null) throw new Error(`${id}: public detail path must remain null`);
          }

          const status = JSON.parse(fs.readFileSync('data/generated/timetable/operations-status.json', 'utf8'));
          if ((status.public_projection?.meeting_count ?? 0) < 417) throw new Error(`public meeting count regressed below HKJC extension baseline: ${status.public_projection?.meeting_count}`);
          if ((status.public_projection?.latest_meeting_date ?? '') < '2026-09-18') throw new Error(`public latest date regressed below existing horizon: ${status.public_projection?.latest_meeting_date}`);
          console.log(JSON.stringify({ approved_records: expectedIds.length, meeting_count: status.public_projection.meeting_count, latest_meeting_date: status.public_projection.latest_meeting_date, max_rank: 'C' }));
          NODE

      - name: Verify deterministic public projection
        working-directory: work
        run: node scripts/timetable/build-public-timetable-view.mjs --check

      - name: Verify historical replay preserves every current meeting record
        working-directory: work
        run: |
          git diff --exit-code -- \
            data/candidates/hkjc-september-2026-fixture-extension-approved.json \
            data/static/calendar-readiness-registry.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const snapshot = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'hkjc-september-pre-replay-meetings.json'), 'utf8'));
          const canonical = JSON.parse(fs.readFileSync('data/generated/timetable/canonical/meetings.json', 'utf8'));
          const publicList = JSON.parse(fs.readFileSync('data/generated/timetable/public/meeting-list.json', 'utf8'));

          const verifyPreserved = (label, before, after) => {
            const afterById = new Map(after.map((meeting) => [meeting.meeting_id, meeting]));
            for (const meeting of before) {
              const current = afterById.get(meeting.meeting_id);
              if (!current) throw new Error(`${label}: historical replay removed ${meeting.meeting_id}`);
              if (JSON.stringify(current) !== JSON.stringify(meeting)) {
                throw new Error(`${label}: historical replay changed current meeting ${meeting.meeting_id}`);
              }
            }
            if (after.length < before.length) {
              throw new Error(`${label}: historical replay reduced meeting count ${before.length} -> ${after.length}`);
            }
          };

          verifyPreserved('canonical', snapshot.canonical, canonical.meetings);
          verifyPreserved('public', snapshot.public, publicList.meetings);
          console.log(JSON.stringify({
            preserved_canonical_meetings: snapshot.canonical.length,
            preserved_public_meetings: snapshot.public.length,
            replay_canonical_meetings: canonical.meetings.length,
            replay_public_meetings: publicList.meetings.length,
          }));
          NODE

      - name: Check formatting
        working-directory: work
        run: git diff --check

      - name: Upload reviewed HKJC extension output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calendar-hkjc-september-2026-fixture-extension-output
          if-no-files-found: error
          retention-days: 14
          path: |
            work/data/candidates/hkjc-september-2026-fixture-extension-approved.json
            work/data/static/calendar-readiness-registry.json
            work/data/generated/timetable/canonical/meetings.json
            work/data/generated/timetable/canonical/meeting-details.json
            work/data/generated/timetable/public/meeting-list.json
            work/data/generated/timetable/public/meeting-details.json
            work/data/generated/timetable/public/japan-a-plus-overrides.json
            work/data/generated/timetable/operations-status.json
            work/data/generated/timetable/operations-review-package.json
