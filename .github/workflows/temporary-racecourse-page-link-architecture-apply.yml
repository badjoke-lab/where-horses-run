name: Temporary racecourse page link architecture apply

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/apply-racecourse-page-link-architecture.mjs'
      - 'scripts/check-racecourse-page-link-architecture.mjs'
      - 'data/audits/racecourse-page-link-architecture-v1.json'
      - '.github/workflows/temporary-racecourse-page-link-architecture-apply.yml'
  push:
    branches:
      - work/racecourse-page-link-architecture
    paths:
      - 'scripts/apply-racecourse-page-link-architecture.mjs'
      - 'scripts/check-racecourse-page-link-architecture.mjs'
      - 'data/audits/racecourse-page-link-architecture-v1.json'
      - '.github/workflows/temporary-racecourse-page-link-architecture-apply.yml'

permissions:
  contents: write

concurrency:
  group: temporary-racecourse-page-link-architecture-apply
  cancel-in-progress: true

jobs:
  apply:
    if: github.repository == 'badjoke-lab/where-horses-run' && (github.event_name == 'push' || github.head_ref == 'work/racecourse-page-link-architecture')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      WHR_CALENDAR_REFERENCE_DATE: '2026-07-14'
      WHR_CALENDAR_TIMEZONE: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/racecourse-page-link-architecture
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Apply reviewed link architecture
        run: |
          node --check scripts/apply-racecourse-page-link-architecture.mjs
          node scripts/apply-racecourse-page-link-architecture.mjs
      - name: Align checker with rendered meeting-date scope
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const file = 'scripts/check-racecourse-page-link-architecture.mjs';
          let text = fs.readFileSync(file, 'utf8');
          const replaceOnce = (search, replacement, label) => {
            if (!text.includes(search)) throw new Error(`${label}: expected checker text missing`);
            text = text.replace(search, replacement);
          };
          replaceOnce(
            `  surface_link_applicable_pages: 54,\n  surface_links_complete: 54,\n  direction_link_applicable_pages: 46,\n  direction_links_complete: 46,\n  meeting_date_link_applicable_pages: 52,\n  meeting_date_links_complete: 52,`,
            `  surface_link_applicable_pages: 52,\n  surface_links_complete: 52,\n  direction_link_applicable_pages: 46,\n  direction_links_complete: 46,`,
            'audit count contract',
          );
          replaceOnce(
            `})) if (finalCounts[key] !== expected) fail(\`audit implemented count \${key} differs\`);`,
            `})) if (finalCounts[key] !== expected) fail(\`audit implemented count \${key} differs\`);\nif (finalCounts.rendered_meeting_date_links_complete !== true) fail('rendered meeting-date link contract differs');`,
            'meeting-date audit flag',
          );
          replaceOnce(
            `    const dates = [...new Set((meetingsByRacecourse.get(record.id) ?? []).map((meeting) => meeting.date))];\n    if (dates.length) {\n      dateApplicable += 1;\n      dateComplete += Number(dates.every((date) => hasHref(html, \`\${calendarHref}?date=\${date}\`)));\n    }`,
            `    const sourceRows = [...(meetingsByRacecourse.get(record.id) ?? [])].sort((left, right) => left.date.localeCompare(right.date) || left.meeting_id.localeCompare(right.meeting_id));\n    const referenceDate = '2026-07-14';\n    const windowEndExclusive = '2026-08-13';\n    const windowRows = sourceRows.filter((meeting) => meeting.date >= referenceDate && meeting.date < windowEndExclusive);\n    const todayRows = windowRows.filter((meeting) => meeting.date === referenceDate);\n    const upcomingRows = windowRows.filter((meeting) => meeting.date > referenceDate);\n    const nextDate = upcomingRows[0]?.date ?? null;\n    const nextRows = nextDate ? upcomingRows.filter((meeting) => meeting.date === nextDate) : [];\n    const renderedRows = [...todayRows, ...nextRows, ...upcomingRows.slice(0, 8)];\n    const dates = [...new Set(renderedRows.map((meeting) => meeting.date))];\n    if (dates.length) {\n      dateApplicable += 1;\n      dateComplete += Number(dates.every((date) => hasHref(html, \`\${calendarHref}?date=\${date}\`)));\n    }`,
            'rendered meeting-date derivation',
          );
          replaceOnce(
            `  surfaceApplicable: 54,\n  surfaceComplete: 54,`,
            `  surfaceApplicable: 52,\n  surfaceComplete: 52,`,
            'surface rendered counts',
          );
          replaceOnce(
            `  directionComplete: 46,\n  dateApplicable: 52,\n  dateComplete: 52,\n  methodologyComplete: 72,`,
            `  directionComplete: 46,\n  methodologyComplete: 72,`,
            'remove fixed date counts',
          );
          replaceOnce(
            `for (const [key, expected] of Object.entries(expectedActual)) if (actual[key] !== expected) fail(\`rendered count \${key} expected \${expected}; found \${actual[key]}\`);`,
            `for (const [key, expected] of Object.entries(expectedActual)) if (actual[key] !== expected) fail(\`rendered count \${key} expected \${expected}; found \${actual[key]}\`);\nif (dateApplicable === 0 || dateComplete !== dateApplicable) fail(\`rendered meeting-date links expected complete scope; found \${dateComplete}/\${dateApplicable}\`);`,
            'dynamic meeting-date assertion',
          );
          replaceOnce(
            `console.log('MEETING_DATE_LINKS: 52/52');`,
            `console.log(\`MEETING_DATE_LINKS: \${dateComplete}/\${dateApplicable}\`);`,
            'dynamic meeting-date output',
          );
          fs.writeFileSync(file, text);
          NODE
      - name: Install dependencies without lockfile mutation
        run: npm install --package-lock=false
      - name: Build deterministic bilingual site
        run: npm run build
      - name: Capture link architecture validation
        shell: bash
        run: |
          set +e
          node scripts/check-racecourse-page-link-architecture.mjs > /tmp/racecourse-page-link-architecture.log 2>&1
          status=$?
          printf '%s\n' "$status" > /tmp/racecourse-page-link-architecture.exit
          cat /tmp/racecourse-page-link-architecture.log
          exit 0
      - name: Upload link architecture diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: racecourse-page-link-architecture-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: error
          path: |
            /tmp/racecourse-page-link-architecture.log
            /tmp/racecourse-page-link-architecture.exit
      - name: Enforce link architecture validation
        run: |
          status="$(cat /tmp/racecourse-page-link-architecture.exit)"
          if [ "$status" != "0" ]; then
            exit "$status"
          fi
      - name: Validate inherited racecourse and Public v1 gates
        run: |
          node scripts/check-racecourse-page-identity-reconciliation.mjs
          node scripts/check-racecourse-page-public-timetable-connection.mjs
          node scripts/check-racecourse-page-profile-evidence.mjs
          node scripts/check-calendar-public-v1-navigation-qa.mjs
          node scripts/check-project-governance-docs.mjs
      - name: Remove temporary discovery and apply mechanisms
        run: |
          rm scripts/audit-racecourse-page-link-architecture.mjs
          rm .github/workflows/temporary-racecourse-page-link-architecture-discovery.yml
          rm scripts/apply-racecourse-page-link-architecture.mjs
          rm .github/workflows/temporary-racecourse-page-link-architecture-apply.yml
      - name: Commit exact link architecture state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --exit-code && {
            echo 'Expected racecourse page-link changes were not produced.' >&2
            exit 1
          }
          git commit -m 'Complete racecourse page-link architecture'
          git push origin HEAD:work/racecourse-page-link-architecture
