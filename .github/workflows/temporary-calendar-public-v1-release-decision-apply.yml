name: Temporary Calendar Public v1 release decision apply

on:
  push:
    branches:
      - work/calendar-public-v1-release-decision
    paths:
      - 'scripts/apply-calendar-public-v1-release-decision.mjs'
      - '.github/workflows/temporary-calendar-public-v1-release-decision-apply.yml'

permissions:
  contents: write

concurrency:
  group: temporary-calendar-public-v1-release-decision-apply
  cancel-in-progress: true

jobs:
  apply:
    if: github.repository == 'badjoke-lab/where-horses-run'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/calendar-public-v1-release-decision
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Validate and apply deterministic roadmap transition
        run: |
          node --check scripts/apply-calendar-public-v1-release-decision.mjs
          node scripts/apply-calendar-public-v1-release-decision.mjs
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const file = 'docs/calendar/implementation-roadmap.md';
          const before = fs.readFileSync(file, 'utf8');
          const oldText = 'Completed Work ID: `WHR-CAL-UAE-ERA`\nCurrent Work ID: `WHR-CAL-PUBLIC-V1`';
          const newText = 'Completed Work ID: `WHR-CAL-UAE-ERA`\nCompleted Work ID: `WHR-CAL-PUBLIC-V1`\nCurrent Work ID: `WHR-RACECOURSE-PAGES-V1`';
          if (before.includes(oldText)) fs.writeFileSync(file, before.replace(oldText, newText));
          NODE
      - name: Install dependencies without lockfile mutation
        run: npm install --package-lock=false
      - name: Build static site
        run: npm run build
      - name: Validate Public v1 release decision
        run: node scripts/check-calendar-public-v1-release-decision.mjs
      - name: Remove temporary apply mechanism
        run: |
          rm scripts/apply-calendar-public-v1-release-decision.mjs
          rm .github/workflows/temporary-calendar-public-v1-release-decision-apply.yml
      - name: Commit exact release-decision transition
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --exit-code && {
            echo 'Expected release-decision changes were not produced.' >&2
            exit 1
          }
          git commit -m 'Complete Calendar Public v1 release decision'
          git push origin HEAD:work/calendar-public-v1-release-decision
