name: M6 SEO sitemap metadata pass

on:
  pull_request:
    paths:
      - 'src/**'
      - 'astro.config.mjs'
      - 'data/static/m6-seo-sitemap-metadata-pass-v1.json'
      - 'data/static/m6-methods-data-policy-final-v1.json'
      - 'data/static/m6-source-freshness-badges-v1.json'
      - 'scripts/check-m6-seo-sitemap-metadata-pass.mjs'
      - 'scripts/check-m6-methods-data-policy-final.mjs'
      - 'scripts/check-m6-country-coverage-matrix.mjs'
      - 'scripts/check-seo-qa-release.mjs'
      - '.github/workflows/m6-seo-sitemap-metadata-pass.yml'
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'astro.config.mjs'
      - 'data/static/m6-seo-sitemap-metadata-pass-v1.json'
      - 'data/static/m6-methods-data-policy-final-v1.json'
      - 'data/static/m6-source-freshness-badges-v1.json'
      - 'scripts/check-m6-seo-sitemap-metadata-pass.mjs'
      - 'scripts/check-m6-methods-data-policy-final.mjs'
      - 'scripts/check-m6-country-coverage-matrix.mjs'
      - 'scripts/check-seo-qa-release.mjs'
      - '.github/workflows/m6-seo-sitemap-metadata-pass.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - run: npm install --package-lock=false
      - run: npm run build
      - run: node scripts/check-seo-qa-release.mjs
      - run: node scripts/check-m6-country-coverage-matrix.mjs
      - run: node scripts/check-m6-methods-data-policy-final.mjs
      - run: node scripts/check-m6-seo-sitemap-metadata-pass.mjs
      - run: git diff --exit-code
