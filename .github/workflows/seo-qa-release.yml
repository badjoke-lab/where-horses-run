name: Phase 11 SEO QA release gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'astro.config.mjs'
      - 'data/static/**'
      - 'data/audits/**'
      - 'docs/seo/**'
      - 'scripts/check-*.mjs'
      - 'scripts/*-integration.mjs'
      - 'src/**'
      - '.github/workflows/seo-qa-release.yml'
  push:
    branches:
      - main
    paths:
      - 'astro.config.mjs'
      - 'data/static/**'
      - 'data/audits/**'
      - 'docs/seo/**'
      - 'scripts/check-*.mjs'
      - 'scripts/*-integration.mjs'
      - 'src/**'
      - '.github/workflows/seo-qa-release.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install dependencies without generating a lockfile
        run: npm install --package-lock=false
      - name: Build complete static site
        run: npm run build
      - name: Preserve Phase 10 UX release
        run: node scripts/check-ux-polish-release.mjs
      - name: Preserve sitemap and robots
        run: node scripts/check-sitemap-robots.mjs
      - name: Preserve structured data baseline
        run: node scripts/check-structured-data-baseline.mjs
      - name: Preserve country page metadata
        run: node scripts/check-country-page-metadata.mjs
      - name: Preserve racecourse page metadata
        run: node scripts/check-racecourse-page-metadata.mjs
      - name: Preserve glossary page metadata
        run: node scripts/check-glossary-page-metadata.mjs
      - name: Preserve canonical and hreflang review
        run: node scripts/check-canonical-hreflang-review.mjs
      - name: Preserve Open Graph social cards
        run: node scripts/check-open-graph-social-cards.mjs
      - name: Preserve title and description normalization
        run: node scripts/check-title-description-normalization.mjs
      - name: Preserve FAQ content pages
        run: node scripts/check-faq-content-pages.mjs
      - name: Preserve methods and data policy
        run: node scripts/check-methods-data-policy.mjs
      - name: Validate Phase 11 SEO QA release
        run: node scripts/check-seo-qa-release.mjs
      - name: Prove repository clean
        run: |
          changes="$(git status --porcelain --untracked-files=all)"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            exit 1
          fi
