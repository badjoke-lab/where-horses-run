# Exact reviewed source evidence is pinned intentionally.
name: Calendar NAR August 29 Saga A+ review

on:
  pull_request:
    paths:
      - '.github/workflows/calendar-nar-2026-08-29-saga-a-plus-review.yml'
      - 'scripts/timetable/build-calendar-nar-2026-08-29-saga-a-plus-approved-candidates.mjs'
      - 'data/candidates/nar-regular-refresh-2026-08-29-saga-a-plus-approved.json'
      - 'data/generated/timetable/canonical/**'
      - 'data/generated/timetable/public/**'
      - 'data/generated/timetable/operations-status.json'
      - 'data/generated/timetable/operations-review-package.json'
      - 'scripts/check-calendar-nar-incremental-v2-promotion-output-determinism.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/calendar-nar-2026-08-29-saga-a-plus-review.yml'
      - 'scripts/timetable/build-calendar-nar-2026-08-29-saga-a-plus-approved-candidates.mjs'
      - 'data/candidates/nar-regular-refresh-2026-08-29-saga-a-plus-approved.json'
      - 'data/generated/timetable/canonical/**'
      - 'data/generated/timetable/public/**'
      - 'data/generated/timetable/operations-status.json'
      - 'data/generated/timetable/operations-review-package.json'
      - 'scripts/check-calendar-nar-incremental-v2-promotion-output-determinism.mjs'

permissions:
  contents: read

concurrency:
  group: calendar-nar-august-29-saga-a-plus-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          path: work
          fetch-depth: 0

      - name: Checkout exact daily-review source evidence
        uses: actions/checkout@v4
        with:
          ref: d0521542429ad44da61b3b13fbcf5c0cf49abfa7
          path: review-source
          sparse-checkout: |
            data/candidates/nar-incremental-batches/due-job-plan-2026-08-27-due-japan-nar-regular-refresh-001-run-001/batch.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Rebuild exact reviewed Candidate and classify all complete details
        working-directory: work
        env:
          WHR_NAR_REVIEW_BATCH: ${{ github.workspace }}/review-source/data/candidates/nar-incremental-batches/due-job-plan-2026-08-27-due-japan-nar-regular-refresh-001-run-001/batch.json
        run: node scripts/timetable/build-calendar-nar-2026-08-29-saga-a-plus-approved-candidates.mjs

      - name: Verify Candidate deterministic and promotion valid
        working-directory: work
        run: |
          git diff --exit-code -- data/candidates/nar-regular-refresh-2026-08-29-saga-a-plus-approved.json
          node scripts/timetable/promote-timetable.mjs --input data/candidates/nar-regular-refresh-2026-08-29-saga-a-plus-approved.json --dry-run

      - name: Rebuild and validate deterministic projections
        working-directory: work
        run: |
          node scripts/timetable/build-public-timetable-view.mjs
          node scripts/timetable/build-japan-a-plus-public-overrides.mjs
          node scripts/timetable/build-operations-status.mjs --reference-date 2026-07-01
          node scripts/timetable/build-operations-review-package.mjs
          node scripts/validate-data.mjs
          node scripts/check-japan-a-plus-public-overrides.mjs
          node scripts/check-calendar-operations-status.mjs
          node scripts/check-calendar-operations-review-package.mjs

      - name: Verify cumulative reviewed promotion determinism
        working-directory: work
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-calendar-nar-incremental-v2-promotion-output-determinism.mjs

      - name: Verify Saga August 29 reviewed A+ invariant
        working-directory: work
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const id = 'nar-saga-racecourse-2026-08-29';
          const expected = { rows: 9, first: '16:30', last: '20:50' };
          const forbiddenKeys = new Set(['horse_name','jockey','trainer','odds','payout','result','prediction','raw_html','stream_url']);
          const assertNoForbiddenKeys = (value, path = 'value') => {
            if (Array.isArray(value)) {
              value.forEach((item, index) => assertNoForbiddenKeys(item, `${path}[${index}]`));
              return;
            }
            if (!value || typeof value !== 'object') return;
            for (const [key, child] of Object.entries(value)) {
              if (forbiddenKeys.has(key.toLowerCase())) throw new Error(`forbidden field key ${path}.${key}`);
              assertNoForbiddenKeys(child, `${path}.${key}`);
            }
          };

          const candidate = JSON.parse(fs.readFileSync('data/candidates/nar-regular-refresh-2026-08-29-saga-a-plus-approved.json', 'utf8'));
          if (candidate.review?.status !== 'approved' || candidate.review?.promotion_target !== 'canonical-timetable-v0') throw new Error('review contract differs');
          if (candidate.records.length !== 1 || candidate.records[0].meeting_id !== id) throw new Error('reviewed identity differs');
          const record = candidate.records[0];
          if (record.country_id !== 'japan' || record.authority_id !== 'nar-local-government-racing' || record.racecourse_id !== 'saga-racecourse' || record.date !== '2026-08-29' || record.timezone !== 'Asia/Tokyo') throw new Error('reviewed meeting coordinates differ');
          if (record.capability_rank !== 'A+' || record.first_race_time_local !== expected.first || record.last_race_time_local !== expected.last || record.timetable_rows?.length !== expected.rows) throw new Error('reviewed A+ boundary differs');
          for (const [index, row] of record.timetable_rows.entries()) {
            if (row.label !== `Race ${index + 1}`) throw new Error(`Race ${index + 1} label differs`);
            for (const field of ['post_time_local','race_name','distance_m','surface','course_label']) {
              if (row[field] === null || row[field] === '') throw new Error(`Race ${index + 1} missing ${field}`);
            }
          }
          if (record.source?.source_id !== 'nar-race-list-deba-table') throw new Error('reviewed source ID differs');
          if (new URL(record.source?.official_url).hostname !== 'www.keiba.go.jp') throw new Error('reviewed source hostname differs');
          assertNoForbiddenKeys(record, 'candidate');

          const canonical = JSON.parse(fs.readFileSync('data/generated/timetable/canonical/meetings.json', 'utf8'));
          const details = JSON.parse(fs.readFileSync('data/generated/timetable/canonical/meeting-details.json', 'utf8'));
          const publicList = JSON.parse(fs.readFileSync('data/generated/timetable/public/meeting-list.json', 'utf8'));
          const publicDetails = JSON.parse(fs.readFileSync('data/generated/timetable/public/meeting-details.json', 'utf8'));
          const meeting = canonical.meetings.find((row) => row.meeting_id === id);
          const detail = details.details.find((row) => row.meeting_id === id);
          const publicMeeting = publicList.meetings.find((row) => row.meeting_id === id);
          const publicDetail = publicDetails.details.find((row) => row.meeting_id === id);
          if (!meeting || !detail || !publicMeeting || !publicDetail) throw new Error('reviewed A+ meeting/detail missing from canonical/public projection');
          if (meeting.capability_rank !== 'A+' || meeting.first_race_time_local !== expected.first || meeting.last_race_time_local !== expected.last) throw new Error('canonical A+ meeting differs');
          if (detail.capability_rank !== 'A+' || detail.timetable_rows?.length !== expected.rows) throw new Error('canonical A+ detail differs');
          if ((publicMeeting.effective_public_rank ?? publicMeeting.capability_rank) !== 'A+') throw new Error('public rank differs');
          if ((publicDetail.effective_public_rank ?? publicDetail.capability_rank) !== 'A+' || publicDetail.timetable_rows?.length !== expected.rows) throw new Error('public A+ detail differs');
          assertNoForbiddenKeys(meeting, 'canonicalMeeting');
          assertNoForbiddenKeys(detail, 'canonicalDetail');
          assertNoForbiddenKeys(publicMeeting, 'publicMeeting');
          assertNoForbiddenKeys(publicDetail, 'publicDetail');

          const status = JSON.parse(fs.readFileSync('data/generated/timetable/operations-status.json', 'utf8'));
          if ((status.public_projection?.meeting_count ?? 0) < 425) throw new Error(`public meeting count regressed: ${status.public_projection?.meeting_count}`);
          if ((status.public_projection?.detail_count ?? 0) < 112) throw new Error(`public detail count regressed: ${status.public_projection?.detail_count}`);
          if ((status.public_projection?.latest_meeting_date ?? '') < '2026-09-23') throw new Error(`public horizon regressed: ${status.public_projection?.latest_meeting_date}`);
          NODE

      - name: Verify deterministic current outputs and formatting
        working-directory: work
        run: |
          node scripts/timetable/build-public-timetable-view.mjs --check
          git diff --exit-code -- \
            data/candidates/nar-regular-refresh-2026-08-29-saga-a-plus-approved.json \
            data/generated/timetable/canonical/meetings.json \
            data/generated/timetable/canonical/meeting-details.json \
            data/generated/timetable/public/meeting-list.json \
            data/generated/timetable/public/meeting-details.json \
            data/generated/timetable/public/japan-a-plus-overrides.json \
            data/generated/timetable/operations-status.json \
            data/generated/timetable/operations-review-package.json
          git diff --check
