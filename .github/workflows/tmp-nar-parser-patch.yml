name: Temp NAR parser patch

on:
  push:
    branches: [fix/nar-unquoted-race-name-links]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/nar-unquoted-race-name-links
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Patch and test
        run: |
          node scripts/tmp-patch-nar-unquoted-race-name.mjs
          node --check scripts/timetable/japan-official-30d-adapters.mjs
          node scripts/check-japan-zero-based-30d.mjs
          git diff --check
      - name: Commit source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/timetable/japan-official-30d-adapters.mjs scripts/check-japan-zero-based-30d.mjs
          git commit -m "fix: parse unquoted NAR race-name links"
          git push origin HEAD:fix/nar-unquoted-race-name-links
