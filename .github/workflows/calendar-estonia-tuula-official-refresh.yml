name: Estonia Tuula official Calendar refresh

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Refresh scope
        required: true
        default: near
        type: choice
        options:
          - near
          - full
  schedule:
    - cron: '7 5 * * *'
    - cron: '37 5 * * 1'
  pull_request:
    paths:
      - '.github/workflows/calendar-estonia-tuula-official-refresh.yml'
      - '.github/workflows/calendar-unified-official-refresh.yml'
      - '.github/workflows/calendar-near-official-refresh.yml'
      - 'scripts/timetable/estonia-tuula-calendar-core.mjs'
      - 'scripts/timetable/run-estonia-tuula-official-window.mjs'
      - 'scripts/check-estonia-tuula-adapter.mjs'
      - 'scripts/timetable/rebuild-unified-non-japan-on-main.sh'
      - 'scripts/timetable/build-refresh-audit-summary.mjs'
      - 'data/static/authority-source-inventory.json'
      - 'data/static/calendar-acquisition-registry.json'
      - 'data/static/calendar-readiness-registry.json'
      - 'data/static/calendar-public-country-support-v1.json'
      - 'data/static/calendar-non-running-evidence-registry-v1.json'
      - 'data/static/calendar-98-tier-execution-coverage.json'
      - 'data/static/racecourses.json'
      - 'data/static/racecourse-locations-v1.json'
      - 'data/static/racecourse-location-supplement-evidence-v1.json'
      - 'package.json'

permissions:
  contents: write

concurrency:
  group: estonia-tuula-official-calendar-refresh
  cancel-in-progress: false

jobs:
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm run validate:estonia-tuula
      - name: Exercise Estonia production path
        run: |
          mkdir -p .calendar-estonia
          node scripts/timetable/run-estonia-tuula-official-window.mjs --days=90 --output=.calendar-estonia/estonia.json
          node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync('.calendar-estonia/estonia.json','utf8'));if(a.acquisition_attempt?.status!=='success'||(a.diagnostics?.source_errors?.length??0)!==0||(a.diagnostics?.parse_failures?.length??0)!==0||(a.records?.length??0)<1){console.error(JSON.stringify({attempt:a.acquisition_attempt,discovery:a.discovery,diagnostics:a.diagnostics,records:a.records?.length??0}));process.exit(1)}"
          node scripts/timetable/apply-official-rolling-observations.mjs --artifact=.calendar-estonia/estonia.json --country-id=estonia --authority-id=estonian-trotting-union --racing-system-id=tuula-trotting-system --timezone=Europe/Tallinn
          node scripts/check-calendar-public-country-support.mjs
          node scripts/check-calendar-public-map-parity.mjs
          node scripts/check-calendar-non-running-evidence-registry.mjs
          node scripts/check-calendar-unified-audit-coverage.mjs

  refresh:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --no-audit --no-fund
      - id: scope
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then scope="${{ inputs.scope }}"; elif [ "${{ github.event.schedule }}" = "37 5 * * 1" ]; then scope=full; else scope=near; fi
          if [ "$scope" = full ]; then days=90; else days=30; fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "days=$days" >> "$GITHUB_OUTPUT"
      - name: Collect and apply Estonia
        run: |
          mkdir -p .calendar-estonia
          node scripts/timetable/run-estonia-tuula-official-window.mjs --days="${{ steps.scope.outputs.days }}" --output=.calendar-estonia/estonia.json
          node scripts/timetable/apply-official-rolling-observations.mjs --artifact=.calendar-estonia/estonia.json --country-id=estonia --authority-id=estonian-trotting-union --racing-system-id=tuula-trotting-system --timezone=Europe/Tallinn
          node scripts/timetable/apply-reviewed-calendar-observations.mjs
          node scripts/check-calendar-public-country-support.mjs
          node scripts/check-calendar-public-map-parity.mjs
          node scripts/check-calendar-non-running-evidence-registry.mjs
      - name: Persist generated Estonia timetable (latest-main safe)
        shell: bash
        run: |
          set -euo pipefail
          recollect_on_main() {
            npm install --no-package-lock --no-audit --no-fund
            rm -rf .calendar-estonia
            mkdir -p .calendar-estonia
            node scripts/timetable/run-estonia-tuula-official-window.mjs --days="${{ steps.scope.outputs.days }}" --output=.calendar-estonia/estonia.json
            node scripts/timetable/apply-official-rolling-observations.mjs --artifact=.calendar-estonia/estonia.json --country-id=estonia --authority-id=estonian-trotting-union --racing-system-id=tuula-trotting-system --timezone=Europe/Tallinn
            node scripts/timetable/apply-reviewed-calendar-observations.mjs
            node scripts/check-calendar-public-country-support.mjs
            node scripts/check-calendar-public-map-parity.mjs
            node scripts/check-calendar-non-running-evidence-registry.mjs
          }
          source scripts/timetable/persist-country-on-main.sh
          persist_country_on_main 'Estonia' '${{ steps.scope.outputs.scope }}' recollect_on_main
