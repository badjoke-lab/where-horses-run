name: Calendar NAR fixture probe diagnostic

on:
  pull_request:
    paths:
      - 'data/fixtures/timetable/nar/route-probe-v1.json'
      - 'data/audits/nar-fixture-probe-v1.json'
      - 'scripts/check-calendar-nar-fixture-probe.mjs'
      - '.github/workflows/calendar-nar-fixture-probe-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Run diagnostic
        shell: bash
        run: |
          set +e
          node scripts/check-calendar-nar-fixture-probe.mjs > /tmp/diagnostic.log 2>&1
          status=$?
          cat /tmp/diagnostic.log
          echo $status > /tmp/status.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: nar-fixture-probe-diagnostic
          path: |
            /tmp/diagnostic.log
            /tmp/status.txt
          retention-days: 7
