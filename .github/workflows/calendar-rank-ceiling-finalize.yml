name: Calendar rank ceiling finalize

on:
  push:
    branches:
      - fix/remove-calendar-authority-rank-ceilings-20260911
    paths:
      - '.github/workflows/calendar-rank-ceiling-finalize.yml'
      - 'scripts/timetable/finalize-rank-ceiling-removal-temp.mjs'
      - 'scripts/timetable/cleanup-fixed-rank-residue-temp.mjs'
      - 'scripts/timetable/cleanup-active-rank-ceilings-v2-temp.mjs'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-calendar-authority-rank-ceilings-20260911
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Merge current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          echo "Merging main $(git rev-parse origin/main)"
          git merge --no-commit --no-ff origin/main || true
          allowed='^(data/generated/timetable/canonical/meeting-details.json|data/generated/timetable/canonical/meetings.json|data/generated/timetable/japan-zero-based-30d-reconciliation.json|data/generated/timetable/public/meeting-details.json|data/generated/timetable/public/meeting-list.json)$'
          unexpected="$(git diff --name-only --diff-filter=U | grep -Ev "$allowed" || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected merge conflicts:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            git checkout --theirs -- "$file"
            git add "$file"
          done < <(git diff --name-only --diff-filter=U)
      - name: Remove fixed-rank implementation residue
        shell: bash
        run: |
          set -euo pipefail
          node scripts/timetable/finalize-rank-ceiling-removal-temp.mjs
          node scripts/timetable/cleanup-fixed-rank-residue-temp.mjs
          node scripts/timetable/cleanup-active-rank-ceilings-v2-temp.mjs
          rm -f scripts/timetable/finalize-rank-ceiling-removal-temp.mjs
          rm -f scripts/timetable/cleanup-fixed-rank-residue-temp.mjs
          rm -f scripts/timetable/cleanup-active-rank-ceilings-v2-temp.mjs
          rm -f .github/workflows/calendar-first-paint-consistency.yml
          rm -f .github/workflows/calendar-dynamic-dates.yml
          rm -f scripts/check-calendar-first-paint-consistency.mjs
          rm -f scripts/check-calendar-dynamic-dates.mjs
          rm -f scripts/check-calendar-30d-timetable-ui.mjs
          rm -f .github/workflows/calendar-rank-ceiling-finalize.yml
      - name: Assert obsolete rank and audit paths are absent
        shell: bash
        run: |
          set -euo pipefail
          runtime_matches="$(git grep -n -E 'max_public_rank|public_ceiling|publication_ceiling|expected_public_ceiling|japan-a-plus-overrides' -- data/static data/generated/timetable/public src scripts/timetable package.json || true)"
          if [[ -n "$runtime_matches" ]]; then
            echo "$runtime_matches" >&2
            exit 1
          fi
          stale_refs="$(git grep -n -E 'build-japan-a-plus-public-overrides|check-japan-a-plus-public-overrides|calendar-first-paint-consistency|check-calendar-dynamic-dates|check-calendar-30d-timetable-ui' -- .github package.json scripts src || true)"
          if [[ -n "$stale_refs" ]]; then
            echo "$stale_refs" >&2
            exit 1
          fi
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Validate Calendar rank contract
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-calendar-field-publication-diagnostics.mjs
          node scripts/check-calendar-refresh-publication-boundaries.mjs
          node scripts/check-calendar-acquisition-registry.mjs
          node scripts/check-japan-best-available-rank.mjs
          node scripts/check-non-japan-best-available-rank.mjs
          node scripts/check-calendar-runtime-import-boundary.mjs
          node scripts/check-calendar-operations-v2.mjs
          for f in scripts/check-calendar-readiness*.mjs; do
            [[ -f "$f" ]] && node "$f"
          done
          node scripts/timetable/apply-reviewed-calendar-observations.mjs
          node scripts/check-calendar-field-publication-diagnostics.mjs
      - name: Build and integrity check
        run: |
          npm run build
          git diff --check
      - name: Commit finalized branch
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m "fix: finish evidence-derived Calendar rank contract"
          git push origin HEAD:fix/remove-calendar-authority-rank-ceilings-20260911
