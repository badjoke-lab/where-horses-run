name: Calendar France Spain repair probe

on:
  push:
    branches:
      - fix/calendar-production-integrity-20260926
    paths:
      - 'scripts/check-france-fnch-adapter.mjs'
      - 'scripts/timetable/france-fnch-core.mjs'
      - 'scripts/timetable/run-france-fnch-official-window.mjs'
      - 'scripts/check-spain-zarzuela-adapter.mjs'
      - 'scripts/timetable/spain-zarzuela-core.mjs'
      - 'scripts/timetable/run-spain-zarzuela-official-window.mjs'
      - '.github/workflows/calendar-france-spain-repair-probe.yml'

permissions:
  contents: read

jobs:
  france:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - run: npm ci --ignore-scripts
      - name: Probe France live parser and dedupe
        run: node scripts/check-france-fnch-adapter.mjs
  spain:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - run: npm ci --ignore-scripts
      - name: Probe Spain live recovery
        run: node scripts/check-spain-zarzuela-adapter.mjs
