name: Calendar Banei retry activation

on:
  pull_request:
    paths:
      - 'data/static/calendar-acquisition-registry.json'
      - 'data/static/calendar-due-job-policy-v1.json'
      - 'data/fixtures/calendar-due-job-planner-fixtures-v1.json'
      - 'scripts/check-calendar-banei-retry-activation.mjs'
      - 'docs/calendar/banei-retry-activation.md'
      - 'scripts/check-calendar-acquisition-registry.mjs'
      - 'scripts/check-calendar-due-job-planner.mjs'
      - 'scripts/timetable/banei-control-plane-bridge.mjs'
      - 'scripts/check-calendar-banei-control-plane-bridge.mjs'
      - 'docs/calendar/banei-control-plane-bridge.md'
      - 'scripts/check-calendar-banei-detail-registry-activation.mjs'
      - 'docs/calendar/banei-detail-registry-activation.md'
      - 'docs/calendar/banei-actions-executor.md'
      - 'scripts/check-calendar-banei-retry-execution-proof.mjs'
      - 'docs/calendar/banei-retry-execution-proof.md'
      - '.github/workflows/calendar-banei-retry-execution-proof.yml'
      - '.github/workflows/calendar-banei-retry-activation.yml'
  push:
    branches:
      - main
    paths:
      - 'data/static/calendar-acquisition-registry.json'
      - 'data/static/calendar-due-job-policy-v1.json'
      - 'data/fixtures/calendar-due-job-planner-fixtures-v1.json'
      - 'scripts/check-calendar-banei-retry-activation.mjs'
      - 'docs/calendar/banei-retry-activation.md'
      - 'scripts/check-calendar-acquisition-registry.mjs'
      - 'scripts/check-calendar-due-job-planner.mjs'
      - 'scripts/timetable/banei-control-plane-bridge.mjs'
      - 'scripts/check-calendar-banei-control-plane-bridge.mjs'
      - 'docs/calendar/banei-control-plane-bridge.md'
      - 'scripts/check-calendar-banei-detail-registry-activation.mjs'
      - 'docs/calendar/banei-detail-registry-activation.md'
      - 'docs/calendar/banei-actions-executor.md'
      - 'scripts/check-calendar-banei-retry-execution-proof.mjs'
      - 'docs/calendar/banei-retry-execution-proof.md'
      - '.github/workflows/calendar-banei-retry-execution-proof.yml'
      - '.github/workflows/calendar-banei-retry-activation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Check Node syntax
        run: |
          node --check scripts/check-calendar-banei-retry-activation.mjs
          node --check scripts/check-calendar-banei-retry-execution-proof.mjs
          node --check scripts/timetable/banei-retry-execution-proof.mjs

      - name: Validate Banei retry activation boundary
        run: node scripts/check-calendar-banei-retry-activation.mjs

      - name: Revalidate proof and shared retry planning contracts
        run: |
          node scripts/check-calendar-banei-retry-execution-proof.mjs
          node scripts/check-calendar-rank-aware-retry-queue.mjs
          node scripts/check-calendar-due-job-planner.mjs

      - name: Validate Banei bridge, Registry, and executor dependencies
        run: |
          node scripts/check-calendar-banei-control-plane-bridge.mjs
          node scripts/check-calendar-banei-detail-registry-activation.mjs
          node scripts/check-calendar-acquisition-registry.mjs
          node scripts/check-calendar-banei-actions-executor.mjs
          node scripts/check-calendar-runner-compatibility.mjs

      - name: Validate shared planning and result dependencies
        run: |
          node scripts/check-calendar-collection-job.mjs
          node scripts/check-calendar-collection-plan.mjs
          node scripts/check-calendar-actions-multi-job.mjs
          node scripts/check-calendar-collection-result-manifest.mjs
          node scripts/check-calendar-review-queue.mjs

      - name: Validate Operations and governance dependencies
        run: |
          node scripts/check-calendar-operations-v2.mjs
          node scripts/check-calendar-contracts.mjs
          node scripts/check-project-governance-docs.mjs

      - name: Validate runtime import boundary
        run: node scripts/check-calendar-runtime-import-boundary.mjs

      - name: Check scheduler remains planning-only
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const policy = JSON.parse(fs.readFileSync('data/static/calendar-due-job-policy-v1.json', 'utf8'));
          const rule = policy.system_rules.find((entry) => entry.system_id === 'japan-banei-system');
          if (policy.scheduler.artifact_only !== true || policy.scheduler.execute_jobs !== false) throw new Error('scheduler execution boundary differs');
          if (rule.enabled !== true || rule.rank_retry.enabled !== true) throw new Error('Banei retry planning activation missing');
          if (rule.regular_refresh.enabled || rule.coverage_gap.enabled || rule.source_revalidation.enabled) throw new Error('unrelated Banei automation must remain disabled');
          if (rule.rank_retry.max_selected_meetings_per_job !== 2 || rule.rank_retry.max_attempt_count !== 3) throw new Error('Banei proof-bounded limits differ');
          console.log('BANEI_RETRY_PLANNING: enabled');
          console.log('AUTOMATIC_EXECUTION: disabled');
          NODE

      - name: Check diff formatting
        run: git diff --check
