name: Calendar Public v1 operations presentation

on:
  pull_request:
    paths:
      - 'data/audits/calendar-public-v1-operations-presentation-v1.json'
      - 'docs/calendar/public-v1-operations-presentation.md'
      - 'docs/calendar/README.md'
      - 'docs/calendar/implementation-roadmap.md'
      - 'data/generated/timetable/public/meeting-list.json'
      - 'data/generated/timetable/public/meeting-details.json'
      - 'data/generated/timetable/public/japan-a-plus-overrides.json'
      - 'src/lib/timetable/publicOperationsPresentation.mjs'
      - 'src/components/CalendarOperationsNotice.astro'
      - 'src/pages/calendar/**'
      - 'src/pages/ja/calendar/**'
      - 'src/pages/today.astro'
      - 'src/pages/ja/today.astro'
      - 'src/pages/tomorrow.astro'
      - 'src/pages/ja/tomorrow.astro'
      - 'scripts/check-calendar-public-v1-operations-presentation.mjs'
      - 'scripts/check-calendar-public-v1-operations-rendered.mjs'
      - '.github/workflows/calendar-public-v1-operations-presentation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install dependencies
        run: npm install
      - name: Validate operations presentation contract
        run: node scripts/check-calendar-public-v1-operations-presentation.mjs
      - name: Build current-window fixture
        env:
          WHR_CALENDAR_REFERENCE_DATE: '2026-07-01'
          WHR_CALENDAR_TIMEZONE: Asia/Tokyo
        run: npm run build
      - name: Validate current-window operations presentation
        env:
          WHR_EXPECTED_CALENDAR_DATA_STATUS: current_window_available
        run: node scripts/check-calendar-public-v1-operations-rendered.mjs
      - name: Reset rendered output
        run: rm -rf dist
      - name: Prepare deterministic stale-window fixture
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const files = [
            'data/generated/timetable/public/meeting-list.json',
            'data/generated/timetable/public/meeting-details.json',
            'data/generated/timetable/public/japan-a-plus-overrides.json',
          ];
          const datasets = new Map(files.map((file) => [file, JSON.parse(fs.readFileSync(file, 'utf8'))]));
          const projection = datasets.get(files[0]);
          const dates = [...new Set((projection.meetings ?? []).map((meeting) => meeting.date).filter(Boolean))].sort();
          if (dates.length === 0) throw new Error('public meeting-list has no meeting dates for stale fixture');
          const referenceDate = dates.at(-1);
          const generated = new Date(`${referenceDate}T00:00:00.000Z`);
          generated.setUTCDate(generated.getUTCDate() - 10);
          const generatedAt = generated.toISOString();
          for (const [file, dataset] of datasets) {
            dataset.generated_at = generatedAt;
            fs.writeFileSync(file, `${JSON.stringify(dataset, null, 2)}\n`);
          }
          fs.appendFileSync(process.env.GITHUB_ENV, `WHR_CALENDAR_REFERENCE_DATE=${referenceDate}\n`);
          console.log(`STALE_FIXTURE_REFERENCE_DATE: ${referenceDate}`);
          console.log(`STALE_FIXTURE_GENERATED_AT: ${generatedAt}`);
          NODE
      - name: Build stale-window fixture
        env:
          WHR_CALENDAR_TIMEZONE: Asia/Tokyo
        run: npm run build
      - name: Validate stale-window operations presentation
        env:
          WHR_EXPECTED_CALENDAR_DATA_STATUS: stale_generation_with_window_records
        run: node scripts/check-calendar-public-v1-operations-rendered.mjs
      - name: Restore committed projection after fixture
        if: always()
        run: |
          git restore \
            data/generated/timetable/public/meeting-list.json \
            data/generated/timetable/public/meeting-details.json \
            data/generated/timetable/public/japan-a-plus-overrides.json
          rm -rf dist
      - name: Validate read-only boundary and diff hygiene
        run: |
          git diff --check
          node - <<'NODE'
          const fs = require('node:fs');
          const workflow = fs.readFileSync('.github/workflows/calendar-public-v1-operations-presentation.yml', 'utf8');
          if (!workflow.includes('permissions:\n  contents: read')) throw new Error('contents permission must remain read-only');
          if (/contents:\s*write/.test(workflow) || /pull-requests:\s*write/.test(workflow)) throw new Error('write permission enabled');
          if (/\bschedule\s*:|\bcron\s*:/.test(workflow)) throw new Error('scheduled execution enabled');
          console.log('CALENDAR_PUBLIC_V1_OPERATIONS_PRESENTATION_BOUNDARY: pass');
          NODE
