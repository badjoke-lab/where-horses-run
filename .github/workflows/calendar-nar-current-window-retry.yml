name: Calendar NAR current-window retry

on:
  pull_request:
    paths:
      - 'data/static/calendar-nar-current-window-retry-policy-v1.json'
      - 'data/audits/calendar-japan-current-window-decision-2026-07-13-v1.json'
      - 'data/audits/calendar-nar-current-window-retry-result-v1.json'
      - 'data/candidates/nar-current-window-a-plus-approved.json'
      - 'data/generated/timetable/canonical/meetings.json'
      - 'data/static/calendar-acquisition-registry.json'
      - 'data/static/calendar-runner-compatibility-contract-v1.json'
      - 'scripts/timetable/build-nar-current-window-retry-spec.mjs'
      - 'scripts/timetable/run-nar-incremental-v2-actions.mjs'
      - 'scripts/check-calendar-nar-current-window-retry.mjs'
      - 'docs/calendar/nar-current-window-retry.md'
      - '.github/workflows/calendar-nar-current-window-retry.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calendar-nar-current-window-retry-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  PULL_REQUEST_LIVE_FETCH: 'false'
  WHR_BATCH_ID: nar-current-window-remaining-retry-2026-07-batch-001
  WHR_MODE: selected_meetings
  WHR_START_DATE: ''
  WHR_END_DATE_EXCLUSIVE: ''

jobs:
  validate-remaining-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Validate completed campaign and remaining scope
        run: |
          node --check scripts/timetable/build-nar-current-window-retry-spec.mjs
          node --check scripts/check-calendar-nar-current-window-retry.mjs
          node scripts/check-calendar-nar-current-window-retry.mjs
          node scripts/check-calendar-acquisition-registry.mjs
          node scripts/check-calendar-runner-compatibility.mjs
      - name: Build immutable remaining retry specification
        run: |
          rm -rf /tmp/nar-current-window-retry-spec
          node scripts/timetable/build-nar-current-window-retry-spec.mjs \
            --output-dir=/tmp/nar-current-window-retry-spec \
            --requested-at="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > /tmp/nar-current-window-retry-spec-summary.json
      - name: Validate remaining 51-meeting closure
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const scope = JSON.parse(fs.readFileSync('/tmp/nar-current-window-retry-spec/retry-scope.json', 'utf8'));
          const job = JSON.parse(fs.readFileSync('/tmp/nar-current-window-retry-spec/collection-job.json', 'utf8'));
          const execution = JSON.parse(fs.readFileSync('/tmp/nar-current-window-retry-spec/runner-execution.json', 'utf8'));
          const ids = fs.readFileSync('/tmp/nar-current-window-retry-spec/meeting-ids.txt', 'utf8').trim().split(/\r?\n/);
          if (scope.scope_kind !== 'remaining_after_reviewed_promotion') throw new Error('remaining scope kind differs');
          if (scope.historical_selected_meeting_count !== 66 || scope.promoted_a_plus_meeting_count !== 15 || scope.selected_meeting_count !== 51) throw new Error('remaining scope counts differ');
          if (ids.length !== 51 || job.requested_scope.meeting_ids.length !== 51) throw new Error('remaining meeting count differs');
          if (job.runner_policy.runner !== 'github_actions' || job.collection_mode !== 'selected_meetings' || job.target_rank !== 'A+') throw new Error('remaining Job differs');
          if (execution.executor_id !== 'nar-incremental-v2-actions' || execution.review_required !== true) throw new Error('remaining Runner Execution differs');
          if (Object.values(execution.side_effect_boundary).some((value) => value !== false)) throw new Error('remaining execution side-effect boundary differs');
          console.log('NAR_REMAINING_RETRY_SCOPE: pass');
          console.log(JSON.stringify({ historical: 66, promoted_a_plus: 15, remaining_c: 51, pull_request_live_fetch: false }));
          NODE
      - name: Upload remaining retry specification
        uses: actions/upload-artifact@v4
        with:
          name: nar-current-window-remaining-retry-spec-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: |
            /tmp/nar-current-window-retry-spec/collection-job.json
            /tmp/nar-current-window-retry-spec/runner-execution.json
            /tmp/nar-current-window-retry-spec/retry-scope.json
            /tmp/nar-current-window-retry-spec/meeting-ids.txt
            /tmp/nar-current-window-retry-spec-summary.json
      - name: Prove repository clean
        if: always()
        run: |
          rm -rf /tmp/nar-current-window-retry-spec
          rm -f /tmp/nar-current-window-retry-spec-summary.json
          changes="$(git status --porcelain --untracked-files=all)"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            exit 1
          fi

  collect-review-artifacts:
    if: github.event_name == 'workflow_dispatch'
    needs: validate-remaining-scope
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Build manual remaining retry specification
        run: |
          rm -rf /tmp/nar-current-window-retry-spec
          node scripts/timetable/build-nar-current-window-retry-spec.mjs \
            --output-dir=/tmp/nar-current-window-retry-spec \
            --requested-at="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > /tmp/nar-current-window-retry-spec-summary.json
          {
            echo 'WHR_MEETING_IDS<<EOF'
            paste -sd, /tmp/nar-current-window-retry-spec/meeting-ids.txt
            echo 'EOF'
            echo "WHR_CHECKED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_ENV"
      - name: Record protected state hashes
        run: |
          sha256sum \
            data/generated/timetable/canonical/meetings.json \
            data/generated/timetable/canonical/meeting-details.json \
            data/generated/timetable/public/meeting-list.json \
            data/generated/timetable/public/meeting-details.json \
            > /tmp/nar-current-window-protected-before.sha256
      - name: Run official NAR selected-meeting retry
        shell: bash
        run: |
          node scripts/timetable/run-nar-incremental-v2-actions.mjs > /tmp/nar-current-window-live.log 2>&1
          cat /tmp/nar-current-window-live.log
      - name: Validate immutable NAR batch outputs
        run: node scripts/check-calendar-nar-incremental-v2.mjs --batch-id="$WHR_BATCH_ID"
      - name: Build reviewed operational result summary
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const batchId = process.env.WHR_BATCH_ID;
          const candidatePath = `data/candidates/nar-incremental-batches/${batchId}/batch.json`;
          const generatedRoot = `data/generated/timetable/nar-incremental-batches/${batchId}`;
          const candidates = JSON.parse(fs.readFileSync(candidatePath, 'utf8'));
          const report = JSON.parse(fs.readFileSync(`${generatedRoot}/collection-report.json`, 'utf8'));
          const coverage = JSON.parse(fs.readFileSync(`${generatedRoot}/coverage-observation.json`, 'utf8'));
          const retries = JSON.parse(fs.readFileSync(`${generatedRoot}/retry-targets.json`, 'utf8'));
          const scope = JSON.parse(fs.readFileSync('/tmp/nar-current-window-retry-spec/retry-scope.json', 'utf8'));
          const requestedIds = [...scope.meeting_ids].sort();
          const coverageRequestedIds = [...coverage.requested_scope.meeting_ids].sort();
          if (requestedIds.length !== 51 || JSON.stringify(requestedIds) !== JSON.stringify(coverageRequestedIds)) throw new Error('manual remaining retry scope differs');
          const detailCandidates = candidates.detail_candidates ?? [];
          const scheduleCandidates = candidates.schedule_candidates ?? [];
          const unresolved = coverage.unresolved_meeting_ids ?? [];
          const summary = {
            schema_version: 'calendar-nar-current-window-remaining-retry-result-v1',
            work_id: 'WHR-CAL-JAPAN-NAR-CURRENT-WINDOW-RETRY-REMAINING',
            generated_at: coverage.checked_at,
            batch_id: batchId,
            selected_meeting_count: requestedIds.length,
            coverage_claim: coverage.coverage_claim,
            a_plus_candidate_count: detailCandidates.length,
            schedule_c_candidate_count: scheduleCandidates.length,
            unresolved_meeting_count: unresolved.length,
            retry_target_count: (retries.meeting_targets ?? []).length,
            source_error_count: (coverage.source_errors ?? []).length,
            review_state: candidates.review.status,
            promotion_eligible: candidates.review.promotion_eligible,
            canonical_write: candidates.review.canonical_write,
            public_write: candidates.review.public_write,
            publication_effect: report.publication_effect,
          };
          if (summary.review_state !== 'needs_review' || summary.promotion_eligible !== false) throw new Error('manual retry review boundary differs');
          if (summary.canonical_write !== 'disabled' || summary.public_write !== 'disabled' || summary.publication_effect !== 'none') throw new Error('manual retry write boundary differs');
          if (summary.a_plus_candidate_count + summary.schedule_c_candidate_count !== 51) throw new Error('manual retry candidate counts do not close');
          if (summary.retry_target_count !== summary.unresolved_meeting_count) throw new Error('manual retry target closure differs');
          fs.writeFileSync('/tmp/nar-current-window-result.json', `${JSON.stringify(summary, null, 2)}\n`);
          console.log(JSON.stringify(summary, null, 2));
          NODE
      - name: Prove protected state unchanged
        run: sha256sum --check /tmp/nar-current-window-protected-before.sha256
      - name: Upload NAR remaining retry evidence
        uses: actions/upload-artifact@v4
        with:
          name: nar-current-window-remaining-retry-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: |
            /tmp/nar-current-window-retry-spec/
            /tmp/nar-current-window-retry-spec-summary.json
            /tmp/nar-current-window-live.log
            /tmp/nar-current-window-result.json
            data/candidates/nar-incremental-batches/${{ env.WHR_BATCH_ID }}/
            data/generated/timetable/nar-incremental-batches/${{ env.WHR_BATCH_ID }}/
      - name: Cleanup generated review artifacts and prove repository clean
        if: always()
        run: |
          rm -rf \
            /tmp/nar-current-window-retry-spec \
            "data/candidates/nar-incremental-batches/$WHR_BATCH_ID" \
            "data/generated/timetable/nar-incremental-batches/$WHR_BATCH_ID"
          rm -f /tmp/nar-current-window-retry-spec-summary.json /tmp/nar-current-window-live.log /tmp/nar-current-window-result.json
          changes="$(git status --porcelain --untracked-files=all)"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            exit 1
          fi
