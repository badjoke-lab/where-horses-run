name: Publish UAE exact four Rank A meetings once

on:
  push:
    branches: [publish/uae-four-rank-a-20260901]
    paths:
      - '.github/workflows/publish-uae-four-rank-a-20260901-once.yml'
      - 'data/candidates/uae-four-rank-a-automated-approved-20260901.json'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22.12.0' }

      - name: Verify exact pinned ERA evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/badjoke-lab/where-horses-run/actions/artifacts/9792598245/zip > /tmp/uae.zip
          echo '24f359830315c7de3dbe7c532a69785cb044984ff35b042f18d71cccc6095271  /tmp/uae.zip' | sha256sum -c -
          rm -rf /tmp/uae && mkdir /tmp/uae && unzip -q /tmp/uae.zip -d /tmp/uae
          echo 'eda7fd10ee5ac1ea0f571c5814958bc4641ac25a30a1c1c7703ffb8789c84f51  /tmp/uae/candidates.json' | sha256sum -c -
          echo 'b4bd443550357ee0dba8000de294e8b1ab1f0827538dd68293a1b631b7fa867a  /tmp/uae/manifest.json' | sha256sum -c -
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source=JSON.parse(fs.readFileSync('/tmp/uae/candidates.json','utf8'));
          const approved=JSON.parse(fs.readFileSync('data/candidates/uae-four-rank-a-automated-approved-20260901.json','utf8'));
          const review=JSON.parse(fs.readFileSync('data/candidates/uae-four-rank-a-review-20260901.json','utf8'));
          const ids=['era-abu-dhabi-turf-club-2026-04-04','era-abu-dhabi-turf-club-2026-04-11','era-al-ain-racecourse-2026-04-03','era-al-ain-racecourse-2026-04-10'].sort();
          const fail=m=>{throw new Error(m)};
          if(review.source?.workflow_run_id!==33488095481||review.source?.artifact_id!==9792598245||review.source?.candidate_sha256!=='eda7fd10ee5ac1ea0f571c5814958bc4641ac25a30a1c1c7703ffb8789c84f51'||review.source?.source_error_count!==0) fail('review source differs');
          if(review.excluded?.[0]?.meeting_id!=='era-meydan-racecourse-2026-04-01') fail('Meydan exclusion differs');
          if(JSON.stringify(source.records.map(x=>x.meeting_id).sort())!==JSON.stringify(ids)) fail('source identity set differs');
          if(JSON.stringify(approved.records.map(x=>x.meeting_id).sort())!==JSON.stringify(ids)) fail('approved identity set differs');
          const sm=new Map(source.records.map(x=>[x.meeting_id,x]));
          for(const a of approved.records){
            const s=sm.get(a.meeting_id); if(!s) fail(`source missing ${a.meeting_id}`);
            if(a.capability_rank!=='A'||a.review_status!=='approved'||a.timetable_rows.length!==s.timetable_rows.length) fail(`${a.meeting_id} rank/row count differs`);
            if(JSON.stringify(a.timetable_rows)!==JSON.stringify(s.timetable_rows)||a.first_race_time_local!==s.first_race_time_local||a.last_race_time_local!==s.last_race_time_local) fail(`${a.meeting_id} schedule differs from artifact`);
            for(const row of a.timetable_rows) if(JSON.stringify(Object.keys(row).sort())!==JSON.stringify(['label','post_time_local'])) fail(`${a.meeting_id} crossed Rank A boundary`);
          }
          if(approved.review?.reviewer!=='automated-publication-gate'||approved.review?.status!=='approved') fail('automated gate differs');
          NODE

      - name: Snapshot and require exact C prestates
        shell: bash
        run: |
          set -euo pipefail
          cp data/generated/timetable/canonical/meetings.json /tmp/bcm.json
          cp data/generated/timetable/canonical/meeting-details.json /tmp/bcd.json
          cp data/generated/timetable/public/meeting-list.json /tmp/bpm.json
          cp data/generated/timetable/public/meeting-details.json /tmp/bpd.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const ids=['era-abu-dhabi-turf-club-2026-04-04','era-abu-dhabi-turf-club-2026-04-11','era-al-ain-racecourse-2026-04-03','era-al-ain-racecourse-2026-04-10'];
          const cm=JSON.parse(fs.readFileSync('/tmp/bcm.json','utf8')).meetings;
          const cd=JSON.parse(fs.readFileSync('/tmp/bcd.json','utf8')).details;
          const pm=JSON.parse(fs.readFileSync('/tmp/bpm.json','utf8')).meetings;
          const pd=JSON.parse(fs.readFileSync('/tmp/bpd.json','utf8')).details;
          for(const id of ids){
            const c=cm.find(x=>x.meeting_id===id), p=pm.find(x=>x.meeting_id===id);
            if(c?.capability_rank!=='C'||p?.effective_public_rank!=='C') throw new Error(`${id} is not exact C prestate`);
            if(cd.some(x=>x.meeting_id===id)||pd.some(x=>x.meeting_id===id)) throw new Error(`${id} C prestate has detail`);
          }
          const mey=cm.find(x=>x.meeting_id==='era-meydan-racecourse-2026-04-01');
          if(mey?.capability_rank!=='C') throw new Error('Meydan prestate differs');
          NODE

      - name: Dry-run apply and rebuild public
        run: |
          node scripts/timetable/promote-approved-candidate-v1.mjs --input data/candidates/uae-four-rank-a-automated-approved-20260901.json --dry-run
          node scripts/timetable/promote-approved-candidate-v1.mjs --input data/candidates/uae-four-rank-a-automated-approved-20260901.json
          node scripts/timetable/build-public-timetable-view.mjs

      - name: Prove exact four C to A mutation
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const ids=new Set(['era-abu-dhabi-turf-club-2026-04-04','era-abu-dhabi-turf-club-2026-04-11','era-al-ain-racecourse-2026-04-03','era-al-ain-racecourse-2026-04-10']);
          const load=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const before=[load('/tmp/bcm.json').meetings,load('/tmp/bcd.json').details,load('/tmp/bpm.json').meetings,load('/tmp/bpd.json').details];
          const after=[load('data/generated/timetable/canonical/meetings.json').meetings,load('data/generated/timetable/canonical/meeting-details.json').details,load('data/generated/timetable/public/meeting-list.json').meetings,load('data/generated/timetable/public/meeting-details.json').details];
          const non=a=>a.filter(x=>!ids.has(x.meeting_id));
          for(let i=0;i<4;i++) if(JSON.stringify(non(before[i]))!==JSON.stringify(non(after[i]))) throw new Error(`non-target dataset ${i} changed`);
          if(after[0].length!==before[0].length||after[2].length!==before[2].length) throw new Error('meeting count changed');
          const maps=after.map(a=>new Map(a.map(x=>[x.meeting_id,x])));
          for(const id of ids){
            if(maps[0].get(id)?.capability_rank!=='A'||maps[2].get(id)?.effective_public_rank!=='A') throw new Error(`${id} not public A`);
            const cd=maps[1].get(id), pd=maps[3].get(id); if(!cd||!pd) throw new Error(`${id} detail missing`);
            for(const d of [cd,pd]) for(const row of d.timetable_rows??[]) for(const k of ['race_name','distance_m','surface','course_label','horse','jockey','trainer','odds','result','payout']) if(row[k]!=null) throw new Error(`${id} forbidden ${k}`);
          }
          if(maps[0].get('era-meydan-racecourse-2026-04-01')?.capability_rank!=='C'||maps[2].get('era-meydan-racecourse-2026-04-01')?.effective_public_rank!=='C') throw new Error('Meydan changed');
          console.log(JSON.stringify({promoted:[...ids].sort(),rank:'A',meeting_count_delta:0,non_target_changes:0,meydan:'C unchanged'},null,2));
          NODE
          node scripts/timetable/build-public-timetable-view.mjs --check
          git diff --check

      - name: Retire one-shot and commit bounded publication
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/publish-uae-four-rank-a-20260901-once.yml
          git config user.name badjoke-lab
          git config user.email badjoke.lab@gmail.com
          git add data/candidates/uae-four-rank-a-automated-approved-20260901.json data/generated/timetable/canonical/meetings.json data/generated/timetable/canonical/meeting-details.json data/generated/timetable/public/meeting-list.json data/generated/timetable/public/meeting-details.json .github/workflows/publish-uae-four-rank-a-20260901-once.yml
          git diff --cached --check
          git commit -m 'Publish four UAE historical meetings as Rank A'
          git push origin HEAD:publish/uae-four-rank-a-20260901
