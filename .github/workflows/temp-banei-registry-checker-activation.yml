name: Temporary Banei Registry checker activation

on:
  pull_request:
    paths:
      - 'scripts/update-banei-registry-checker-activation.mjs'
      - '.github/workflows/temp-banei-registry-checker-activation.yml'

permissions:
  contents: write

jobs:
  update:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Update Acquisition Registry checker
        run: node scripts/update-banei-registry-checker-activation.mjs
      - name: Commit checker activation
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check-calendar-acquisition-registry.mjs
          git commit -m "[CF-Pages-Skip] Activate Banei detail Registry checks"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
