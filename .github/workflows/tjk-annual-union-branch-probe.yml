name: TJK annual fixture union branch probe

on:
  push:
    branches:
      - fix/tjk-annual-fixture-union

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Acquire annual fixture union
        run: |
          mkdir -p .probe
          node scripts/timetable/run-tjk-current-best-available.mjs --days=30 --output=.probe/candidates.json
          node scripts/check-tjk-current-future-candidates.mjs .probe/candidates.json
      - uses: actions/upload-artifact@v4
        with:
          name: tjk-annual-union-${{ github.run_id }}
          path: .probe
          retention-days: 3
