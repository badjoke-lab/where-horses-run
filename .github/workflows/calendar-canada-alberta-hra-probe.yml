name: Canada Alberta HRA 2026 fixture source probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/calendar-canada-alberta-hra-probe.yml'
      - 'scripts/timetable/probe-canada-alberta-hra.mjs'

permissions:
  contents: read

jobs:
  source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/timetable/probe-canada-alberta-hra.mjs
      - name: Extract current 2026 Century Mile Standardbred meetings
        run: |
          node scripts/timetable/run-canada-alberta-hra-official-window.mjs --as-of=2026-10-13 --days=30 --output=/tmp/hra-candidates.json
          node --input-type=module -e "import fs from 'node:fs';let x=JSON.parse(fs.readFileSync('/tmp/hra-candidates.json','utf8'));if(x.acquisition_attempt.status!=='success'||x.records.length<5)throw Error('HRA C grade candidate run not ready: '+JSON.stringify({status:x.acquisition_attempt.status,rows:x.records.length}));if(new Set(x.records.map(r=>r.date)).size!==x.records.length)throw Error('HRA date duplication');console.log('HRA_C_CANDIDATES_OK',x.records.length)"
