name: Temporary Banei Collection Job fixture activation

on:
  pull_request:
    paths:
      - 'scripts/update-banei-collection-job-fixture-activation.mjs'
      - '.github/workflows/temp-banei-collection-job-fixture-activation.yml'

permissions:
  contents: write

jobs:
  update:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Update Banei Collection Job fixture boundary
        run: node scripts/update-banei-collection-job-fixture-activation.mjs
      - name: Commit fixture update
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/fixtures/calendar-collection-job-invalid-cases-v1.json \
            scripts/check-calendar-collection-job.mjs
          git commit -m "[CF-Pages-Skip] Align Banei Collection Job invalid fixture"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
