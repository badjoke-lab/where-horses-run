name: Temporary TJK dependent derived refresh

on:
  push:
    branches:
      - timetable/tjk-current-reviewed-promotion
    paths:
      - '.github/workflows/tmp-tjk-derived-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: timetable/tjk-current-reviewed-promotion
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Refresh public Japan A+ override derivative
        run: node scripts/timetable/build-japan-a-plus-public-overrides.mjs
      - name: Refresh operations status derivative
        run: node scripts/timetable/build-operations-status.mjs --reference-date 2026-07-01
      - name: Refresh operations review package derivative
        run: node scripts/timetable/build-operations-review-package.mjs
      - name: Validate refreshed derivatives
        run: |
          node scripts/timetable/build-japan-a-plus-public-overrides.mjs --check
          node scripts/timetable/build-operations-status.mjs --reference-date 2026-07-01 --check
          node scripts/timetable/build-operations-review-package.mjs --check
      - name: Reject unexpected changed paths
        run: |
          changed="$(git status --porcelain --untracked-files=all | sed -E 's/^.. //')"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(data/generated/timetable/public/japan-a-plus-overrides.json|data/generated/timetable/operations-status.json|data/generated/timetable/operations-review-package.json)$' || true)"
          if [ -n "$unexpected" ]; then
            echo 'Unexpected files changed by TJK dependent refresh:' >&2
            echo "$unexpected" >&2
            exit 1
          fi
      - name: Commit refreshed derivatives to branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/generated/timetable/public/japan-a-plus-overrides.json \
            data/generated/timetable/operations-status.json \
            data/generated/timetable/operations-review-package.json
          git diff --cached --quiet && { echo 'No derivative changes to commit.'; exit 0; }
          git commit -m 'Refresh TJK-dependent Calendar derivatives'
          git push origin HEAD:timetable/tjk-current-reviewed-promotion
