name: Temporary meeting-state consistency patch

on:
  push:
    branches:
      - fix/unify-meeting-state-and-home-copy-20260907

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unify-meeting-state-and-home-copy-20260907
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Apply targeted UI/state patch
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing expected block in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new))

          # TimetableMeetingList is the single state classifier used by Home/Calendar rows.
          replace(
              'src/components/TimetableMeetingList.astro',
              "const isMeetingStateEligible = (record: TimetableMeetingRow) =>\n  (record.capability_rank === 'A' || record.capability_rank === 'A+') &&\n  Boolean(record.first_race_time_local && record.last_race_time_local);",
              "const isMeetingStateEligible = (record: TimetableMeetingRow) =>\n  (record.capability_rank === 'A+' || record.capability_rank === 'A' || record.capability_rank === 'B+') &&\n  Boolean(record.first_race_time_local && record.last_race_time_local);"
          )
          replace(
              'src/components/TimetableMeetingList.astro',
              '                data-meeting-state="unknown"\n                data-meeting-day-state="unknown"',
              '                data-meeting-state="unknown"\n                data-meeting-state-policy="unknown"\n                data-meeting-day-state="unknown"'
          )
          old_state = """  const setMeetingState = (row, now = Date.now()) => {
    if (!(row instanceof HTMLElement)) return;
    setMeetingDayState(row, now);
    if (row.dataset.meetingStateEligible !== 'true') {
      row.dataset.meetingState = 'unknown';
      return;
    }
    const sourceDate = row.dataset.sourceDate || '';
    const sourceTimeZone = row.dataset.sourceTimezone || '';
    const firstTime = row.dataset.firstRaceTime || '';
    const lastTime = row.dataset.lastRaceTime || '';
    const start = localDateTimeToInstant(sourceDate, firstTime, sourceTimeZone);
    const rawEnd = localDateTimeToInstant(sourceDate, lastTime, sourceTimeZone);
    if (!start || !rawEnd) { row.dataset.meetingState = 'unknown'; return; }
    let endMs = rawEnd.getTime();
    if (endMs < start.getTime()) endMs += 86_400_000;
    row.dataset.sortStart = String(start.getTime());
    const state = now < start.getTime() ? 'upcoming' : now <= endMs ? 'running' : 'ended';
    row.dataset.meetingState = state;
    const upcoming = row.querySelector('[data-meeting-upcoming-badge]');
    const running = row.querySelector('[data-meeting-running-badge]');
    const ended = row.querySelector('[data-meeting-ended-badge]');
    if (upcoming instanceof HTMLElement) upcoming.hidden = state !== 'upcoming';
    if (running instanceof HTMLElement) running.hidden = state !== 'running';
    if (ended instanceof HTMLElement) ended.hidden = state !== 'ended';
  };"""
          new_state = """  const setMeetingState = (row, now = Date.now()) => {
    if (!(row instanceof HTMLElement)) return;
    setMeetingDayState(row, now);
    const sourceDate = row.dataset.sourceDate || '';
    const sourceTimeZone = row.dataset.sourceTimezone || '';
    const firstTime = row.dataset.firstRaceTime || '';
    const lastTime = row.dataset.lastRaceTime || '';
    const timed = row.dataset.meetingStateEligible === 'true';
    const policy = timed ? 'timed' : 'day';
    let state = 'future';

    if (timed) {
      const start = localDateTimeToInstant(sourceDate, firstTime, sourceTimeZone);
      const rawEnd = localDateTimeToInstant(sourceDate, lastTime, sourceTimeZone);
      if (start && rawEnd) {
        let endMs = rawEnd.getTime();
        if (endMs < start.getTime()) endMs += 86_400_000;
        row.dataset.sortStart = String(start.getTime());
        state = now < start.getTime() ? 'upcoming' : now <= endMs ? 'running' : 'ended';
      } else {
        const dayState = row.dataset.meetingDayState || 'unknown';
        state = dayState === 'past' ? 'ended' : dayState === 'today' ? 'upcoming' : dayState === 'future' ? 'future' : 'unknown';
      }
    } else {
      const dayState = row.dataset.meetingDayState || 'unknown';
      state = dayState === 'past' ? 'ended' : dayState === 'today' ? 'upcoming' : dayState === 'future' ? 'future' : 'unknown';
    }

    row.dataset.meetingState = state;
    row.dataset.meetingStatePolicy = policy;
    const root = row.closest('[data-display-timezone-root]');
    const isJa = root?.dataset.lang === 'ja';
    const upcoming = row.querySelector('[data-meeting-upcoming-badge]');
    const running = row.querySelector('[data-meeting-running-badge]');
    const ended = row.querySelector('[data-meeting-ended-badge]');
    if (upcoming instanceof HTMLElement) {
      upcoming.textContent = policy === 'day' ? (isJa ? '本日開催' : 'Racing today') : (isJa ? '開催前' : 'Upcoming');
      upcoming.hidden = state !== 'upcoming';
    }
    if (running instanceof HTMLElement) running.hidden = state !== 'running';
    if (ended instanceof HTMLElement) ended.hidden = state !== 'ended';
  };"""
          replace('src/components/TimetableMeetingList.astro', old_state, new_state)
          replace(
              'src/components/TimetableMeetingList.astro',
              ".meeting-row[data-meeting-state='upcoming'][data-meeting-day-state='today'], .meeting-row[data-meeting-state='unknown'][data-meeting-day-state='today'] { background: #fff3c4; box-shadow: inset .25rem 0 0 #d18a00; }",
              ".meeting-row[data-meeting-state='upcoming'] { background: #fff3c4; box-shadow: inset .25rem 0 0 #d18a00; }"
          )
          replace(
              'src/components/TimetableMeetingList.astro',
              ".meeting-row[data-meeting-state='ended'], .meeting-row[data-meeting-state='unknown'][data-meeting-day-state='past'] { background: #f3f3f3; opacity: .58; }",
              ".meeting-row[data-meeting-state='ended'] { background: #f3f3f3; opacity: .58; }"
          )
          replace(
              'src/components/TimetableMeetingList.astro',
              ".meeting-row[data-live-available='true'][data-stream-state='unknown'][data-meeting-state='running'] [data-live-link],\n  .meeting-row[data-live-available='true'][data-stream-state='unknown'][data-meeting-state='upcoming'][data-meeting-day-state='today'] [data-live-link],\n  .meeting-row[data-live-available='true'][data-stream-state='unknown'][data-meeting-state='unknown'][data-meeting-day-state='today'] [data-live-link] {",
              ".meeting-row[data-live-available='true'][data-stream-state='unknown'][data-meeting-state='running'] [data-live-link],\n  .meeting-row[data-live-available='true'][data-stream-state='unknown'][data-meeting-state='upcoming'] [data-live-link] {"
          )

          # MeetingStatePolicy now supplies shared color CSS only; classification lives in TimetableMeetingList.
          Path('src/components/MeetingStatePolicy.astro').write_text("""<style is:global>
  .meeting-row[data-meeting-state='upcoming'] {
    background: #fff3c4;
    box-shadow: inset .25rem 0 0 #d18a00;
    opacity: 1;
  }

  .meeting-row[data-meeting-state='running'] {
    background: #fff0ef;
    box-shadow: inset .25rem 0 0 #c40000;
    opacity: 1;
  }

  .meeting-row[data-meeting-state='ended'] {
    background: #f3f3f3;
    box-shadow: none;
    opacity: .58;
  }

  .meeting-row[data-meeting-state='future'],
  .meeting-row[data-meeting-state='unknown'] {
    background: #fff;
    box-shadow: none;
    opacity: 1;
  }
</style>
""")

          # Selected-map card must PRESENT the row's policy result, never classify independently.
          old_popup = """        const statusForRow = (row) => {
          const meetingState = row.dataset.meetingState || 'unknown';
          const dayState = row.dataset.meetingDayState || 'unknown';
          if (meetingState === 'running') return { key: 'running', label: isJa ? '開催中' : 'Racing now' };
          if ((meetingState === 'upcoming' || meetingState === 'unknown') && dayState === 'today') {
            return { key: 'upcoming', label: isJa ? '今日これから' : 'Later today' };
          }
          if (meetingState === 'ended' || dayState === 'past') return { key: 'ended', label: isJa ? '終了' : 'Finished' };
          return { key: 'future', label: isJa ? '開催予定' : 'Scheduled' };
        };"""
          new_popup = """        const statusForRow = (row) => {
          const meetingState = row.dataset.meetingState || 'unknown';
          const policy = row.dataset.meetingStatePolicy || 'day';
          if (meetingState === 'running') return { key: 'running', label: isJa ? '開催中' : 'Racing now' };
          if (meetingState === 'upcoming') {
            return { key: 'upcoming', label: policy === 'day' ? (isJa ? '本日開催' : 'Racing today') : (isJa ? '開催前' : 'Upcoming') };
          }
          if (meetingState === 'ended') return { key: 'ended', label: isJa ? '終了' : 'Finished' };
          return { key: 'future', label: isJa ? '開催予定' : 'Scheduled' };
        };"""
          replace('src/components/TodayMeetingMap.astro', old_popup, new_popup)
          replace('src/components/TodayMeetingMap.astro', "<p class=\"today-meeting-map__eyebrow\">{isJapanese ? '同じ公開開催データ' : 'Same public meeting data'}</p>", "<p class=\"today-meeting-map__eyebrow\">{isJapanese ? '開催マップ' : 'Meeting map'}</p>")
          replace(
              'src/components/TodayMeetingMap.astro',
              "      ? '地図と下の開催一覧は同じ公開meeting recordを使用します。地図の地点を選ぶと対応する開催が選択され、一覧の「地図」から地点へフォーカスできます。'\n      : 'The map and meeting list below use the same public meeting records. Select a point to select its meeting, or use Map on a row to focus that venue.'",
              "      ? '地図の競馬場を選ぶと対応する開催を確認できます。一覧の「地図」からも競馬場へ移動できます。'\n      : 'Select a racecourse on the map to see its meeting, or use Map on a list row to focus that venue.'"
          )

          # Map marker presentation consumes row state; remove the old unknown+today guess and obsolete copy.
          replace('src/components/RacecourseMap.astro', '>Later today<', '>Before start / racing today<')
          replace('src/components/RacecourseMap.astro', '>今日これから<', '>開催前・本日開催<')
          old_map_status = """  const statusFromMeetingRow = (row) => {
    const meetingState = row.dataset.meetingState || 'unknown';
    const dayState = row.dataset.meetingDayState || 'unknown';
    if (meetingState === 'running') return 'running';
    if ((meetingState === 'upcoming' || meetingState === 'unknown') && dayState === 'today') return 'upcoming';
    if (meetingState === 'ended' || dayState === 'past') return 'ended';
    return 'future';
  };"""
          new_map_status = """  const statusFromMeetingRow = (row) => {
    const meetingState = row.dataset.meetingState || 'unknown';
    if (meetingState === 'running') return 'running';
    if (meetingState === 'upcoming') return 'upcoming';
    if (meetingState === 'ended') return 'ended';
    return 'future';
  };"""
          replace('src/components/RacecourseMap.astro', old_map_status, new_map_status)

          # Home hero is a Home page, not a renamed Today page. Range-specific copy stays on map/list sections.
          replace('src/pages/ja/index.astro', '<p class="hero__eyebrow" data-window-eyebrow>今日</p>\n      <h1 id="page-title" data-window-title>今日の開催</h1>', '<p class="hero__eyebrow">世界の競馬開催</p>\n      <h1 id="page-title">競馬開催を探す</h1>')
          replace('src/pages/ja/index.astro', '今日・明日・今後7日間を、同じ地図と同じ開催一覧で切り替えます。開催一覧はカレンダーと同じ公開meeting rowと状態判定を使います。', '今日・明日・今後7日間の競馬開催を、地図と一覧で確認できます。期間、タイムゾーン、国・地域、主催・管轄、公開ランクで絞り込めます。')
          replace('src/pages/ja/index.astro', '地図・トップ・カレンダーは同じ公開meeting rowとランク別状態ルールを使います。', '表示中の期間と絞り込み条件に合う開催を一覧表示します。')
          replace('src/pages/index.astro', '<p class="hero__eyebrow" data-window-eyebrow>Today</p>\n      <h1 id="page-title" data-window-title>Today’s racing</h1>', '<p class="hero__eyebrow">Global horse racing</p>\n      <h1 id="page-title">Find horse racing meetings</h1>')
          replace('src/pages/index.astro', 'Use one map and one timetable for today, tomorrow, or the next seven days. The list uses the same public meeting rows and state rules as Calendar.', 'Find meetings today, tomorrow, or over the next seven days on one map and list. Filter by timezone, country, authority, or public rank.')
          replace('src/pages/index.astro', 'Map, Home, and Calendar use the same public meeting rows and rank-aware state policy.', 'The list follows the selected period and active filters.')

          # Remove this temporary workflow from the resulting branch.
          Path('.github/workflows/tmp-fix-meeting-state.yml').unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ui): unify meeting state across list and map'
          git push origin HEAD:fix/unify-meeting-state-and-home-copy-20260907
