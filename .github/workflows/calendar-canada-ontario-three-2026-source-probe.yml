name: Calendar Canada Ontario other three AGCO 2026 source probe

on:
  pull_request:
    paths:
      - '.github/workflows/calendar-canada-ontario-three-2026-source-probe.yml'
      - 'scripts/timetable/probe-canada-agco-ontario-three-2026.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --no-audit --no-fund
      - name: Inspect three 2026 AGCO regulator PDFs without publication
        run: node scripts/timetable/probe-canada-agco-ontario-three-2026.mjs
