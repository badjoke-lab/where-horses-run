name: Temporary Saga official calendar live proof

on:
  pull_request:
    paths:
      - '.github/workflows/saga-live-proof-temp.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install pinned parser dependency
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Inspect Saga PDF geometry and monthly home column
        shell: bash
        run: |
          set -euo pipefail
          ua='Mozilla/5.0 (compatible; WhereHorsesRun/1.0)'
          curl -fsSL --retry 3 --retry-delay 2 -A "$ua" 'https://www.sagakeiba.net/race/schedule/' -o /tmp/saga-schedule.html
          node --input-type=module <<'NODE' > /tmp/saga-pdf-url.txt
          import fs from 'node:fs';
          const html=fs.readFileSync('/tmp/saga-schedule.html','utf8');
          const links=[...html.matchAll(/<a\b[^>]*href=["']([^"']+\.pdf(?:\?[^"']*)?)["'][^>]*>([\s\S]*?)<\/a>/gi)].map((m)=>({href:m[1],text:m[2].replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim()}));
          const target=links.find((row)=>/2026|令和\s*8|R\s*8/i.test(`${row.href} ${row.text}`)) ?? links[0];
          if(!target) throw new Error('official Saga annual PDF link not found');
          console.error('ANNUAL_LINK',JSON.stringify(target));
          console.log(new URL(target.href,'https://www.sagakeiba.net/').toString());
          NODE
          pdf="$(tail -n1 /tmp/saga-pdf-url.txt)"
          curl -fsSL --retry 3 --retry-delay 2 -A "$ua" "$pdf" -o /tmp/saga-annual.pdf
          echo "ANNUAL_PDF=$pdf bytes=$(wc -c < /tmp/saga-annual.pdf) sha256=$(sha256sum /tmp/saga-annual.pdf | awk '{print $1}')"
          curl -fsSL --retry 3 --retry-delay 2 -A "$ua" 'https://www.sagakeiba.net/schedule/sch202609/' -o /tmp/saga-202609.html
          code="$(curl -sSL -o /tmp/saga-202610.html -w '%{http_code}' --retry 3 --retry-delay 2 -A "$ua" 'https://www.sagakeiba.net/schedule/sch202610/')"
          echo "OCT_MONTHLY_STATUS=$code"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { getDocument } from 'pdfjs-dist/legacy/build/pdf.mjs';
          const normalize=(value)=>String(value??'').replace(/[０-９]/g,(c)=>String(c.charCodeAt(0)-0xfee0)).replace(/\s+/g,'').trim();
          const data=new Uint8Array(fs.readFileSync('/tmp/saga-annual.pdf'));
          const pdf=await getDocument({data,useWorkerFetch:false,isEvalSupported:false}).promise;
          if(pdf.numPages!==1) throw new Error(`unexpected pages ${pdf.numPages}`);
          const page=await pdf.getPage(1);
          const text=await page.getTextContent();
          const items=text.items.filter((item)=>item.str?.trim()).map((item)=>({str:item.str.trim(),norm:normalize(item.str),x:+item.transform[4].toFixed(2),y:+item.transform[5].toFixed(2),w:+Number(item.width??0).toFixed(2)}));
          console.log('PDF_ITEM_COUNT',items.length);
          for(const month of [9,10]){
            const marker=items.find((item)=>item.norm===`${month}月`);
            if(!marker) throw new Error(`month marker missing ${month}`);
            console.log('MONTH_MARKER',month,JSON.stringify(marker));
            const nearby=items.filter((item)=>Math.abs(item.y-marker.y)<=32 && item.x>=marker.x-10).sort((a,b)=>b.y-a.y||a.x-b.x);
            for(const item of nearby) if(item.norm==='●'||/^\d{1,2}$/.test(item.norm)||item.norm===`${month}月`) console.log('MONTH_ITEM',month,JSON.stringify(item));
          }
          const html=fs.readFileSync('/tmp/saga-202609.html','utf8');
          const plain=(value)=>String(value??'').replace(/<!--[\s\S]*?-->/g,' ').replace(/<br\s*\/?>/gi,' | ').replace(/<[^>]+>/g,' ').replace(/&nbsp;|&#160;/gi,' ').replace(/&amp;/gi,'&').replace(/\s+/g,' ').trim();
          const table=html.match(/<table\b[^>]*>[\s\S]*?<\/table>/i)?.[0];
          if(!table) throw new Error('September schedule table missing');
          const rows=[...table.matchAll(/<tr\b[^>]*>([\s\S]*?)<\/tr>/gi)].map((m)=>[...m[1].matchAll(/<t[dh]\b[^>]*>([\s\S]*?)<\/t[dh]>/gi)].map((cell)=>plain(cell[1]))).filter((row)=>row.length);
          const header=rows[0];
          console.log('MONTHLY_HEADER',JSON.stringify(header));
          const homeIndex=header.findIndex((value)=>/本場/.test(value));
          if(homeIndex<0) throw new Error('home column missing');
          const homeDays=rows.slice(1).filter((row)=>row[homeIndex]==='佐賀').map((row)=>Number(row[0])).filter(Number.isInteger);
          console.log('SEP_HOME_DAYS',JSON.stringify(homeDays));
          NODE
