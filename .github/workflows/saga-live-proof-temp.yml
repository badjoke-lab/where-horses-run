name: Temporary Saga official calendar live proof

on:
  pull_request:
    paths:
      - '.github/workflows/saga-live-proof-temp.yml'
      - 'scripts/timetable/saga-official-30d-discovery.mjs'
      - 'scripts/check-saga-official-30d.mjs'
      - 'package.json'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install pinned parser dependency
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Run permanent Saga adapter for current 30-day proof window
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { discoverSagaOfficial30d } from './scripts/timetable/saga-official-30d-discovery.mjs';
          const dates=[];
          const cursor=new Date('2026-09-04T00:00:00Z');
          for(let index=0;index<30;index+=1){
            dates.push(cursor.toISOString().slice(0,10));
            cursor.setUTCDate(cursor.getUTCDate()+1);
          }
          const result=await discoverSagaOfficial30d({dates});
          console.log(JSON.stringify(result.completeness,null,2));
          console.log(JSON.stringify(result.meetings,null,2));
          const expected=[
            'nar-saga-racecourse-2026-09-05',
            'nar-saga-racecourse-2026-09-06',
            'nar-saga-racecourse-2026-09-12',
            'nar-saga-racecourse-2026-09-19',
            'nar-saga-racecourse-2026-09-20',
            'nar-saga-racecourse-2026-09-21',
            'nar-saga-racecourse-2026-09-26',
            'nar-saga-racecourse-2026-09-27',
            'nar-saga-racecourse-2026-10-01',
          ];
          assert.equal(result.completeness.completeness,'complete');
          assert.equal(result.completeness.failure_count,0);
          assert.equal(result.completeness.parsed_meeting_count,9);
          assert.equal(result.completeness.annual_calendar_bytes,139103);
          assert.equal(result.completeness.annual_calendar_sha256,'c10c577d9593d8e9271fb1b6ae0a46ad8af8dc51accabd42dca50d0c5001acaa');
          assert.equal(result.completeness.annual_parsed_months.length,12);
          assert.ok(result.completeness.annual_parsed_months.includes('2026-09'));
          assert.ok(result.completeness.annual_parsed_months.includes('2026-10'));
          const sep=result.completeness.monthly_diagnostics.find((row)=>row.year===2026&&row.month===9);
          const oct=result.completeness.monthly_diagnostics.find((row)=>row.year===2026&&row.month===10);
          assert.deepEqual({status:sep?.status,count:sep?.meeting_count},{status:'parsed',count:9});
          assert.equal(oct?.status,'not_published');
          assert.deepEqual(result.meetings.map((row)=>row.meeting_id),expected);
          assert.ok(result.meetings.every((row)=>row.venue_code==='32'&&row.racecourse_id==='saga-racecourse'));
          NODE
