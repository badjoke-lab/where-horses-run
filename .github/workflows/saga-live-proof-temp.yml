name: Temporary Saga official calendar live proof

on:
  pull_request:
    paths:
      - '.github/workflows/saga-live-proof-temp.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install pinned parser dependency
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Inspect official Saga annual and monthly schedule sources
        shell: bash
        run: |
          set -euo pipefail
          ua='Mozilla/5.0 (compatible; WhereHorsesRun/1.0)'
          schedule='https://www.sagakeiba.net/race/schedule/'
          curl -fsSL --retry 3 --retry-delay 2 -A "$ua" "$schedule" -o /tmp/saga-schedule.html
          node --input-type=module <<'NODE' > /tmp/saga-pdf-url.txt
          import fs from 'node:fs';
          const html=fs.readFileSync('/tmp/saga-schedule.html','utf8');
          const links=[...html.matchAll(/<a\b[^>]*href=["']([^"']+\.pdf(?:\?[^"']*)?)["'][^>]*>([\s\S]*?)<\/a>/gi)].map((m)=>({href:m[1],text:m[2].replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim()}));
          console.error('PDF_LINKS', JSON.stringify(links));
          const target=links.find((row)=>/2026|令和\s*8|R\s*8/i.test(`${row.href} ${row.text}`)) ?? links[0];
          if(!target) throw new Error('official Saga annual PDF link not found');
          console.log(new URL(target.href,'https://www.sagakeiba.net/').toString());
          NODE
          pdf="$(tail -n1 /tmp/saga-pdf-url.txt)"
          echo "ANNUAL_PDF $pdf"
          curl -fsSL --retry 3 --retry-delay 2 -A "$ua" "$pdf" -o /tmp/saga-annual.pdf
          echo "ANNUAL bytes=$(wc -c < /tmp/saga-annual.pdf) sha256=$(sha256sum /tmp/saga-annual.pdf | awk '{print $1}')"

          sep='https://www.sagakeiba.net/schedule/sch202609/'
          curl -fsSL --retry 3 --retry-delay 2 -A "$ua" "$sep" -o /tmp/saga-202609.html
          echo "MONTH 202609 status=200 bytes=$(wc -c < /tmp/saga-202609.html) sha256=$(sha256sum /tmp/saga-202609.html | awk '{print $1}')"
          oct='https://www.sagakeiba.net/schedule/sch202610/'
          code="$(curl -sSL -o /tmp/saga-202610.html -w '%{http_code}' --retry 3 --retry-delay 2 -A "$ua" "$oct")"
          echo "MONTH 202610 status=$code bytes=$(wc -c < /tmp/saga-202610.html)"

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { getDocument } from 'pdfjs-dist/legacy/build/pdf.mjs';
          const plain=(value)=>String(value??'').replace(/<!--[\s\S]*?-->/g,' ').replace(/<br\s*\/?>/gi,' | ').replace(/<[^>]+>/g,' ').replace(/&nbsp;|&#160;/gi,' ').replace(/&amp;/gi,'&').replace(/\s+/g,' ').trim();
          const data=new Uint8Array(fs.readFileSync('/tmp/saga-annual.pdf'));
          const pdf=await getDocument({data,useWorkerFetch:false,isEvalSupported:false}).promise;
          console.log('PDF_PAGES',pdf.numPages);
          for(let p=1;p<=pdf.numPages;p+=1){
            const page=await pdf.getPage(p);
            const text=await page.getTextContent();
            const items=text.items.filter((item)=>item.str?.trim()).map((item)=>({str:item.str.trim(),x:+item.transform[4].toFixed(2),y:+item.transform[5].toFixed(2),w:+Number(item.width??0).toFixed(2),h:+Number(item.height??0).toFixed(2)})).sort((a,b)=>b.y-a.y||a.x-b.x);
            const joined=items.map((item)=>item.str).join(' ');
            if(/9月|10月/.test(joined)){
              console.log('PDF_MONTH_PAGE',p,joined.slice(0,1200));
              for(const item of items){
                if(/^(?:9月|10月|9|10|佐賀|☆|◎|●|○|■|□)$/.test(item.str) || /^\d{1,2}$/.test(item.str)) console.log('PDF_ITEM',p,JSON.stringify(item));
              }
            }
          }
          const html=fs.readFileSync('/tmp/saga-202609.html','utf8');
          console.log('SEP_TITLE',plain(html.match(/<title[^>]*>([\s\S]*?)<\/title>/i)?.[1]??''));
          const tables=[...html.matchAll(/<table\b[^>]*>[\s\S]*?<\/table>/gi)].map((m)=>m[0]);
          console.log('SEP_TABLE_COUNT',tables.length);
          for(const [ti,table] of tables.entries()){
            const rows=[...table.matchAll(/<tr\b[^>]*>([\s\S]*?)<\/tr>/gi)].map((m)=>m[1]);
            const normalized=plain(table);
            if(!/佐賀|本場|開催|日/.test(normalized)) continue;
            console.log('SEP_TABLE',ti,'rows',rows.length,'text',normalized.slice(0,500));
            for(const row of rows){
              const cells=[...row.matchAll(/<t[dh]\b[^>]*>([\s\S]*?)<\/t[dh]>/gi)].map((m)=>plain(m[1]));
              if(cells.length) console.log('SEP_ROW',ti,JSON.stringify(cells));
            }
          }
          NODE
