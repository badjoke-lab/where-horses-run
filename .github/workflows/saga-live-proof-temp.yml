name: Temporary Saga official calendar live proof

on:
  pull_request:
    paths:
      - '.github/workflows/saga-live-proof-temp.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install pinned parser dependency
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Dump Saga annual calendar rows
        shell: bash
        run: |
          set -euo pipefail
          ua='Mozilla/5.0 (compatible; WhereHorsesRun/1.0)'
          curl -fsSL --retry 3 --retry-delay 2 -A "$ua" 'https://www.sagakeiba.net/wp-content/uploads/2026/02/R8kaisainittei.pdf' -o /tmp/saga.pdf
          curl -fsSL --retry 3 --retry-delay 2 -A "$ua" 'https://www.sagakeiba.net/schedule/sch202609/' -o /tmp/saga-202609.html
          code="$(curl -sSL -o /tmp/saga-202610.html -w '%{http_code}' --retry 3 --retry-delay 2 -A "$ua" 'https://www.sagakeiba.net/schedule/sch202610/')"
          echo "PDF bytes=$(wc -c < /tmp/saga.pdf) sha256=$(sha256sum /tmp/saga.pdf | awk '{print $1}') OCT_STATUS=$code"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { getDocument } from 'pdfjs-dist/legacy/build/pdf.mjs';
          const normalize=(value)=>String(value??'').replace(/[０-９]/g,(c)=>String(c.charCodeAt(0)-0xfee0)).replace(/[１２３４５６７８９０]/g,(c)=>String(c.charCodeAt(0)-0xfee0)).replace(/\s+/g,'').trim();
          const data=new Uint8Array(fs.readFileSync('/tmp/saga.pdf'));
          const pdf=await getDocument({data,useWorkerFetch:false,isEvalSupported:false}).promise;
          const page=await pdf.getPage(1);
          const text=await page.getTextContent();
          const items=text.items.filter((item)=>item.str?.trim()).map((item)=>({str:item.str.trim(),norm:normalize(item.str),x:+item.transform[4].toFixed(2),y:+item.transform[5].toFixed(2),w:+Number(item.width??0).toFixed(2)}));
          const groups=new Map();
          for(const item of items){
            const key=item.y.toFixed(1);
            const row=groups.get(key)??[]; row.push(item); groups.set(key,row);
          }
          for(const [key,row] of [...groups.entries()].sort((a,b)=>Number(b[0])-Number(a[0]))){
            row.sort((a,b)=>a.x-b.x);
            const text=row.map((item)=>item.norm).join(' ');
            const nums=row.filter((item)=>/^\d{1,2}$/.test(item.norm)).length;
            const bullets=row.filter((item)=>item.norm==='●').length;
            if(nums>=20||bullets>0||/月/.test(text)||/令和8年度|開催日程/.test(text)){
              console.log('PDF_ROW',key,'nums',nums,'bullets',bullets,JSON.stringify(row));
            }
          }
          const html=fs.readFileSync('/tmp/saga-202609.html','utf8');
          const plain=(value)=>String(value??'').replace(/<!--[\s\S]*?-->/g,' ').replace(/<br\s*\/?>/gi,' | ').replace(/<[^>]+>/g,' ').replace(/&nbsp;|&#160;/gi,' ').replace(/&amp;/gi,'&').replace(/\s+/g,' ').trim();
          const table=html.match(/<table\b[^>]*>[\s\S]*?<\/table>/i)?.[0];
          const rows=[...table.matchAll(/<tr\b[^>]*>([\s\S]*?)<\/tr>/gi)].map((m)=>[...m[1].matchAll(/<t[dh]\b[^>]*>([\s\S]*?)<\/t[dh]>/gi)].map((cell)=>plain(cell[1]))).filter((row)=>row.length);
          const homeIndex=rows[0].findIndex((value)=>/本場/.test(value));
          console.log('SEP_HOME_DAYS',JSON.stringify(rows.slice(1).filter((row)=>row[homeIndex]==='佐賀').map((row)=>Number(row[0]))));
          NODE
