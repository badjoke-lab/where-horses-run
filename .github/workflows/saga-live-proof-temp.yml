name: Temporary Saga official branch wiring

on:
  pull_request:
    paths:
      - '.github/workflows/saga-live-proof-temp.yml'

permissions:
  contents: write

jobs:
  wire:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Apply exact Saga wiring
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          function replaceExact(text, needle, replacement, label, expected = 1) {
            const count = text.split(needle).length - 1;
            if (count !== expected) throw new Error(`${label}: expected ${expected} matches, got ${count}`);
            return text.split(needle).join(replacement);
          }

          const runnerPath = 'scripts/timetable/run-japan-zero-based-30d.mjs';
          let runner = fs.readFileSync(runnerPath, 'utf8');
          runner = replaceExact(
            runner,
            "import { discoverKochiOfficial30d, KOCHI_OFFICIAL_ANNUAL_PDF_URL } from './kochi-official-30d-discovery.mjs';\nimport { withSagaOfficialStartFallback } from './saga-official-start-fallback.mjs';",
            "import { discoverKochiOfficial30d, KOCHI_OFFICIAL_ANNUAL_PDF_URL } from './kochi-official-30d-discovery.mjs';\nimport { discoverSagaOfficial30d, SAGA_OFFICIAL_ANNUAL_PDF_URL } from './saga-official-30d-discovery.mjs';\nimport { withSagaOfficialStartFallback } from './saga-official-start-fallback.mjs';",
            'runner import',
          );
          runner = replaceExact(
            runner,
            "  }\n\n  return mergeOfficialPositiveEvidence(\n    narMeetings,\n    southKanto.meetings ?? [],\n    iwate.meetings ?? [],\n    hyogo.meetings ?? [],\n    tokai.meetings ?? [],\n    hokkaido.meetings ?? [],\n    kanazawa.meetings ?? [],\n    kochi.meetings ?? [],\n  );\n}",
            "  }\n\n  let saga = { meetings: [], completeness: null };\n  const sagaStartedAt = new Date().toISOString();\n  try {\n    saga = await discoverSagaOfficial30d(context);\n    sourceCompleteness.set('saga-keiba-official-calendar', {\n      ...saga.completeness,\n      requested_window: selectedRange,\n      fetch_started_at: sagaStartedAt,\n      fetch_ended_at: new Date().toISOString(),\n    });\n    recordSourceObservations(saga.meetings, 'saga-keiba-official-calendar');\n  } catch (error) {\n    sourceCompleteness.set('saga-keiba-official-calendar', sourceState({\n      sourceId: 'saga-keiba-official-calendar',\n      sourceUrl: SAGA_OFFICIAL_ANNUAL_PDF_URL,\n      startedAt: sagaStartedAt,\n      endedAt: new Date().toISOString(),\n      status: 'failed',\n      failures: [{ source_url: SAGA_OFFICIAL_ANNUAL_PDF_URL, reason: String(error?.message ?? error) }],\n    }));\n  }\n\n  return mergeOfficialPositiveEvidence(\n    narMeetings,\n    southKanto.meetings ?? [],\n    iwate.meetings ?? [],\n    hyogo.meetings ?? [],\n    tokai.meetings ?? [],\n    hokkaido.meetings ?? [],\n    kanazawa.meetings ?? [],\n    kochi.meetings ?? [],\n    saga.meetings ?? [],\n  );\n}",
            'runner Saga block',
          );
          runner = replaceExact(
            runner,
            "  kochi: assessMotherSetCompleteness(completenessRows, [\n    'nar-monthly-convene-info',\n    'kochi-keiba-official-calendar',\n  ]).complete,\n  other_nar: false,",
            "  kochi: assessMotherSetCompleteness(completenessRows, [\n    'nar-monthly-convene-info',\n    'kochi-keiba-official-calendar',\n  ]).complete,\n  saga: assessMotherSetCompleteness(completenessRows, [\n    'nar-monthly-convene-info',\n    'saga-keiba-official-calendar',\n  ]).complete,\n  other_nar: false,",
            'runner Saga family status',
          );
          fs.writeFileSync(runnerPath, runner);

          const packagePath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          if (pkg.scripts['validate:saga-official-30d']) throw new Error('Saga package script already exists');
          if (!pkg.scripts.check.includes('npm run validate:kochi-official-30d && npm run build')) throw new Error('package aggregate anchor missing');
          pkg.scripts.check = pkg.scripts.check.replace('npm run validate:kochi-official-30d && npm run build', 'npm run validate:kochi-official-30d && npm run validate:saga-official-30d && npm run build');
          pkg.scripts['validate:saga-official-30d'] = 'node scripts/check-saga-official-30d.mjs';
          fs.writeFileSync(packagePath, `${JSON.stringify(pkg, null, 2)}\n`);

          const inventoryPath = 'data/static/authority-source-inventory-japan-v2.json';
          const inventory = JSON.parse(fs.readFileSync(inventoryPath, 'utf8'));
          const key = 'japan/nar-local-government-racing/saga-keiba-official-calendar';
          if (inventory.supersedes_records.includes(key) || inventory.records.some((row) => row.authority_source_key === key)) throw new Error('Saga inventory record already exists');
          inventory.supersedes_records.push(key);
          inventory.records.push({
            authority_source_key: key,
            system_id: 'japan-nar-system',
            capability_rank: 'C',
            source_status: 'verified',
            adapter_candidate_status: 'candidate',
            implementation_boundary: 'production_mother_set_union_v1',
            notes: "Saga Keiba's FY2026 annual official schedule PDF is the independent positive mother_set baseline for Saga, with structurally complete published monthly schedule pages contributing newer positive home-meeting evidence. A future monthly 404 is treated as not-yet-published rather than negative evidence. Positive evidence is unioned with NAR; absence removal requires both NAR monthly convene info and this source to be complete, while annual/PDF/monthly structural failures fail closed.",
          });
          fs.writeFileSync(inventoryPath, `${JSON.stringify(inventory, null, 2)}\n`);

          const workflowPath = '.github/workflows/calendar-unified-official-refresh.yml';
          let workflow = fs.readFileSync(workflowPath, 'utf8');
          workflow = replaceExact(workflow, "      - 'scripts/timetable/kochi-official-30d-discovery.mjs'\n", "      - 'scripts/timetable/kochi-official-30d-discovery.mjs'\n      - 'scripts/timetable/saga-official-30d-discovery.mjs'\n", 'workflow discovery paths', 2);
          workflow = replaceExact(workflow, "      - 'scripts/check-kochi-official-30d.mjs'\n", "      - 'scripts/check-kochi-official-30d.mjs'\n      - 'scripts/check-saga-official-30d.mjs'\n", 'workflow check paths', 2);
          workflow = replaceExact(workflow, "          node --check scripts/timetable/kochi-official-30d-discovery.mjs\n", "          node --check scripts/timetable/kochi-official-30d-discovery.mjs\n          node --check scripts/timetable/saga-official-30d-discovery.mjs\n", 'workflow syntax', 2);
          workflow = replaceExact(workflow, "          node scripts/check-kochi-official-30d.mjs\n", "          node scripts/check-kochi-official-30d.mjs\n          node scripts/check-saga-official-30d.mjs\n", 'workflow fixtures');
          fs.writeFileSync(workflowPath, workflow);
          NODE
          git diff --check
          git diff -- scripts/timetable/run-japan-zero-based-30d.mjs package.json data/static/authority-source-inventory-japan-v2.json .github/workflows/calendar-unified-official-refresh.yml
      - name: Commit exact Saga wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/timetable/run-japan-zero-based-30d.mjs package.json data/static/authority-source-inventory-japan-v2.json .github/workflows/calendar-unified-official-refresh.yml
          git diff --cached --quiet && { echo 'expected Saga wiring diff missing'; exit 1; }
          git commit -m 'feat: wire Saga official mother-set source'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
