name: One-shot production Calendar probe

on:
  pull_request:
    paths:
      - '.github/workflows/one-shot-production-calendar-probe.yml'

permissions:
  contents: read

concurrency:
  group: one-shot-production-calendar-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Verify deployed English and Japanese Calendar surfaces
        run: |
          node --input-type=module <<'NODE'
          const targets = [
            {
              url: 'https://whr.badjoke-lab.com/calendar/',
              label: 'English Calendar',
              markers: ['2026-08-17', 'Obihiro Racecourse', 'Public rank: C', 'Meeting date and racecourse only'],
              forbiddenInFinalDay: ['First race', 'Last race'],
            },
            {
              url: 'https://whr.badjoke-lab.com/ja/calendar/',
              label: 'Japanese Calendar',
              markers: ['2026-08-17', '帯広競馬場', '公開ランク: C', '開催日・競馬場のみ'],
              forbiddenInFinalDay: ['第1レース', '最終レース'],
            },
          ];

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          let lastErrors = [];
          for (let attempt = 1; attempt <= 30; attempt += 1) {
            const errors = [];
            for (const target of targets) {
              try {
                const response = await fetch(`${target.url}?production_probe=${Date.now()}`, {
                  headers: { 'cache-control': 'no-cache' },
                  redirect: 'follow',
                });
                if (!response.ok) {
                  errors.push(`${target.label}: HTTP ${response.status}`);
                  continue;
                }
                const html = await response.text();
                if (html.length < 1000) errors.push(`${target.label}: unexpectedly small response`);
                for (const marker of target.markers) {
                  if (!html.includes(marker)) errors.push(`${target.label}: missing ${marker}`);
                }
                for (const marker of ['Internal Server Error', '[object Object]', '>undefined<', '>NaN<']) {
                  if (html.includes(marker)) errors.push(`${target.label}: contains render error ${marker}`);
                }
                const sectionStart = html.indexOf('id="date-2026-08-17"');
                const sectionEnd = sectionStart === -1 ? -1 : html.indexOf('</section>', sectionStart);
                if (sectionStart === -1 || sectionEnd === -1) {
                  errors.push(`${target.label}: final-day section missing`);
                } else {
                  const finalDay = html.slice(sectionStart, sectionEnd);
                  for (const forbidden of target.forbiddenInFinalDay) {
                    if (finalDay.includes(forbidden)) errors.push(`${target.label}: Rank C final-day section exposes ${forbidden}`);
                  }
                }
              } catch (error) {
                errors.push(`${target.label}: ${error.message}`);
              }
            }

            if (errors.length === 0) {
              console.log(JSON.stringify({
                production_probe: 'pass',
                attempts: attempt,
                verified_urls: targets.map((target) => target.url),
                recovered_through: '2026-08-17',
                public_rank: 'C',
                race_times_exposed_on_final_day: false,
              }));
              process.exit(0);
            }
            lastErrors = errors;
            console.log(`attempt ${attempt}: ${errors.join('; ')}`);
            if (attempt < 30) await sleep(10000);
          }
          throw new Error(`production Calendar probe failed: ${lastErrors.join('; ')}`);
          NODE
