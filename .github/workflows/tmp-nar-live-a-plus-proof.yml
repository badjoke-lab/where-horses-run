name: Temp NAR live A+ proof

on:
  push:
    branches: [fix/nar-unquoted-race-name-links]

permissions:
  contents: read

jobs:
  proof:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Verify live Kochi and Saga A+
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { japanOfficial30dAdapters } from './scripts/timetable/japan-official-30d-adapters.mjs';
          const adapter = japanOfficial30dAdapters['nar-standard'];
          const targets = [
            ['nar-kochi-racecourse-2026-09-05', '2026-09-05'],
            ['nar-kochi-racecourse-2026-09-06', '2026-09-06'],
            ['nar-saga-racecourse-2026-09-05', '2026-09-05'],
          ];
          for (const [meetingId, date] of targets) {
            const end = new Date(`${date}T00:00:00Z`);
            end.setUTCDate(end.getUTCDate() + 1);
            const discovered = await adapter.discover({ start: date, end_exclusive: end.toISOString().slice(0, 10), dates: [date] });
            const meeting = discovered.find((row) => row.meeting_id === meetingId);
            assert.ok(meeting, `missing discovery ${meetingId}`);
            const inspected = await adapter.inspect(meeting, { attempt: 1 });
            console.log('LIVE_A_PLUS=' + JSON.stringify({ meetingId, status: inspected.status, rank: inspected.meeting?.capability_rank, rows: inspected.meeting?.timetable_rows?.length, names: inspected.meeting?.timetable_rows?.map((row) => row.race_name) }));
            assert.equal(inspected.status, 'ok');
            assert.equal(inspected.meeting.capability_rank, 'A+');
            assert.ok(inspected.meeting.timetable_rows.every((row) => row.race_name && row.distance_m && row.surface && row.course_label));
          }
          NODE
