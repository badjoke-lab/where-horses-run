name: Calendar US Texas regulator live-date probe

on:
  pull_request:
    paths:
      - '.github/workflows/calendar-us-texas-fast-probe.yml'
      - 'scripts/timetable/probe-us-texas-2026-live-dates.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  texas-live-dates-source:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --no-audit --no-fund
      - name: Probe TXRC official 2026 race dates (no publication)
        run: node scripts/timetable/probe-us-texas-2026-live-dates.mjs
