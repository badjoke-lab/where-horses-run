name: Lithuania trotting current Calendar probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/calendar-lithuania-trotting-current-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Probe Lithuanian Trotting Horse League calendar
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (compatible; WhereHorsesRun/1.0; +https://github.com/badjoke-lab/where-horses-run)'
          mkdir -p /tmp/lith
          for item in \
            'calendar|https://ristunusportas.lt/paskelbtas-2026-metu-lenktyniu-kalendorius/' \
            'home|https://ristunusportas.lt/'; do
            name="${item%%|*}"
            url="${item#*|}"
            out="/tmp/lith/$name.html"
            code="$(curl -L -sS -A "$UA" --connect-timeout 15 --max-time 45 -o "$out" -w '%{http_code}' "$url" || true)"
            final="$(curl -L -sS -A "$UA" --connect-timeout 15 --max-time 45 -o /dev/null -w '%{url_effective}' "$url" || true)"
            echo "LITH_PAGE name=$name HTTP=$code BYTES=$(wc -c < "$out" 2>/dev/null || echo 0) FINAL=$final"
          done

      - name: Inspect 2026 calendar text and links
        shell: bash
        run: |
          set -euo pipefail
          python3 - /tmp/lith/calendar.html <<'PY'
          import html,re,sys
          from pathlib import Path
          raw=Path(sys.argv[1]).read_text(errors='replace')
          text=re.sub(r'<script\b[^>]*>.*?</script>',' ',raw,flags=re.I|re.S)
          text=re.sub(r'<style\b[^>]*>.*?</style>',' ',text,flags=re.I|re.S)
          text=html.unescape(re.sub(r'<[^>]+>',' ',text))
          text=re.sub(r'\s+',' ',text).strip()
          print('TEXT_LEN',len(text))
          for needle in ['2026','kalendorius','lenktyn','Uten','Duset','Sart','Rasein','Širv','Sirv','Lazdij','Panev']:
              p=text.lower().find(needle.lower())
              if p>=0:
                  print('LITH_TEXT',needle,text[max(0,p-500):p+6000])
          pats=[
            r'\b(20\d{2})[./-](\d{1,2})[./-](\d{1,2})\b',
            r'\b(\d{1,2})[./-](\d{1,2})[./-](20\d{2})\b',
            r'\b(\d{1,2})\s+(sausio|vasario|kovo|balandžio|balandzio|gegužės|geguzes|birželio|birzelio|liepos|rugpjūčio|rugpjucio|rugsėjo|rugsejo|spalio|lapkričio|lapkricio|gruodžio|gruodzio)\s+(20\d{2})\b'
          ]
          seen=[]
          for pat in pats:
              for m in re.finditer(pat,text,re.I):
                  s=m.group(0)
                  if s not in seen: seen.append(s)
          print('DATE_MATCHES',len(seen))
          for x in seen[:120]: print('DATE',x)
          links=[]
          for m in re.finditer(r'href=["\']([^"\']+)["\']',raw,re.I):
              u=html.unescape(m.group(1))
              low=u.lower()
              if any(k in low for k in ['2026','lenktyn','kalend','ristun','hipodrom','start','program']):
                  if u not in links: links.append(u)
          for u in links[:160]: print('LINK',u)
          PY

      - name: Probe official iCalendar and Events API
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (compatible; WhereHorsesRun/1.0; +https://github.com/badjoke-lab/where-horses-run)'
          mkdir -p /tmp/lith-structured
          for item in \
            'ical|https://ristunusportas.lt/renginiai/?ical=1' \
            'api|https://ristunusportas.lt/wp-json/tribe/events/v1/events?start_date=2026-10-09%2000:00:00&end_date=2026-12-31%2023:59:59&per_page=50'; do
            name="${item%%|*}"
            url="${item#*|}"
            out="/tmp/lith-structured/$name.out"
            code="$(curl -L -sS -A "$UA" --connect-timeout 15 --max-time 45 -o "$out" -w '%{http_code}' "$url" || true)"
            echo "LITH_STRUCTURED name=$name HTTP=$code BYTES=$(wc -c < "$out" 2>/dev/null || echo 0) URL=$url"
          done
          echo '--- ICAL ---'
          head -n 240 /tmp/lith-structured/ical.out || true
          echo '--- API SUMMARY ---'
          python3 - /tmp/lith-structured/api.out <<'PY'
          import json,sys
          raw=open(sys.argv[1],errors='replace').read()
          obj=json.loads(raw)
          print('API_KEYS',sorted(obj.keys()))
          events=obj.get('events') or []
          print('API_EVENTS',len(events))
          for e in events:
              venue=e.get('venue') or {}
              print('EVENT',json.dumps({
                  'id':e.get('id'),
                  'title':e.get('title'),
                  'url':e.get('url'),
                  'start_date':e.get('start_date'),
                  'end_date':e.get('end_date'),
                  'venue_id':e.get('venue_id'),
                  'venue':venue.get('venue'),
                  'address':venue.get('address'),
                  'city':venue.get('city'),
                  'country':venue.get('country'),
                  'geo_lat':venue.get('geo_lat'),
                  'geo_lng':venue.get('geo_lng')
              },ensure_ascii=False))
          PY

      - name: Inspect current official event detail
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (compatible; WhereHorsesRun/1.0; +https://github.com/badjoke-lab/where-horses-run)'
          python3 - /tmp/lith-structured/api.out > /tmp/lith-structured/event-urls.txt <<'PY'
          import json,sys
          obj=json.load(open(sys.argv[1]))
          for e in obj.get('events') or []:
              u=e.get('url')
              if u: print(u)
          PY
          n=0
          while IFS= read -r url; do
            [ -n "$url" ] || continue
            n=$((n+1))
            out="/tmp/lith-structured/event-$n.html"
            code="$(curl -L -sS -A "$UA" --connect-timeout 15 --max-time 45 -o "$out" -w '%{http_code}' "$url" || true)"
            echo "LITH_EVENT_PAGE index=$n HTTP=$code BYTES=$(wc -c < "$out" 2>/dev/null || echo 0) URL=$url"
            python3 - "$out" <<'PY'
          import html,re,sys
          raw=open(sys.argv[1],errors='replace').read()
          text=re.sub(r'<script\b[^>]*>.*?</script>',' ',raw,flags=re.I|re.S)
          text=re.sub(r'<style\b[^>]*>.*?</style>',' ',text,flags=re.I|re.S)
          text=html.unescape(re.sub(r'<[^>]+>',' ',text))
          text=re.sub(r'\s+',' ',text).strip()
          print('EVENT_TEXT',text[:7000])
          for needle in ['hipodrom','Uten','Duset','Sart','Rasein','Širv','Sirv','viet','Vieta','location']:
              p=text.lower().find(needle.lower())
              if p>=0: print('VENUE_TEXT',needle,text[max(0,p-500):p+2200])
          for m in re.finditer(r'<script[^>]+type=["\']application/ld\+json["\'][^>]*>(.*?)</script>',raw,re.I|re.S):
              print('EVENT_JSONLD',html.unescape(m.group(1))[:5000].replace('\n',' '))
          PY
          done < /tmp/lith-structured/event-urls.txt

      - name: Geocode official Sirvintos venue address
        shell: bash
        run: |
          set -euo pipefail
          UA='WhereHorsesRun/1.0 (+https://github.com/badjoke-lab/where-horses-run)'
          query='Ristūnų g. 6, Kalnalaukio k., Širvintų r., Lithuania'
          curl -L -sS -A "$UA" --get             --data-urlencode "q=$query"             --data 'format=jsonv2'             --data 'limit=5'             'https://nominatim.openstreetmap.org/search'             -o /tmp/lith-structured/geocode.json
          python3 - /tmp/lith-structured/geocode.json <<'PY'
          import json,sys
          rows=json.load(open(sys.argv[1]))
          print('GEOCODE_RESULTS',len(rows))
          for r in rows:
              print('GEOCODE',json.dumps({
                  'lat':r.get('lat'),
                  'lon':r.get('lon'),
                  'display_name':r.get('display_name'),
                  'osm_type':r.get('osm_type'),
                  'osm_id':r.get('osm_id'),
                  'type':r.get('type'),
                  'class':r.get('class')
              },ensure_ascii=False))
          if not rows:
              raise SystemExit('NO_GEOCODE_RESULT')
          PY
