name: HKJC sync Japan override timestamp

on:
  push:
    branches:
      - promote/hkjc-2026-09-06-sha-tin-a-plus
    paths:
      - '.github/workflows/hkjc-sync-japan-override-timestamp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: promote/hkjc-2026-09-06-sha-tin-a-plus
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Sync override timestamp to public generation timestamp
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const publicPath = 'data/generated/timetable/public/meeting-list.json';
          const overridePath = 'data/generated/timetable/public/japan-a-plus-overrides.json';
          const publicData = JSON.parse(fs.readFileSync(publicPath, 'utf8'));
          const overrides = JSON.parse(fs.readFileSync(overridePath, 'utf8'));
          overrides.generated_at = publicData.generated_at;
          fs.writeFileSync(overridePath, JSON.stringify(overrides) + '\n');
          console.log(`SYNCED_GENERATED_AT=${overrides.generated_at}`);
          NODE
      - name: Commit timestamp-only sync
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/generated/timetable/public/japan-a-plus-overrides.json
          git diff --cached --check
          git diff --cached --quiet && { echo 'No timestamp delta'; exit 1; }
          git commit -m 'Sync Japan override generation timestamp'
          git push origin HEAD:promote/hkjc-2026-09-06-sha-tin-a-plus
