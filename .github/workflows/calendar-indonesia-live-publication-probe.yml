name: Calendar Indonesia live EN-JA publication QA

on:
  pull_request:
    paths:
      - '.github/workflows/calendar-indonesia-live-publication-probe.yml'
      - 'scripts/timetable/check-indonesia-porprov-live-publication.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  indonesia-published-en-ja:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser controller and Japanese glyph fonts
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund puppeteer-core
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
      - name: Compare Nov 7/8 public C facts with deployed bilingual selected dates
        run: node scripts/timetable/check-indonesia-porprov-live-publication.mjs
      - name: Preserve eight screen captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indonesia-live-en-ja-20261028
          path: indonesia-live-qa-20261028/
          if-no-files-found: ignore
