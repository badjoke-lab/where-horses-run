name: Temporary Tokai joint-calendar live proof

on:
  pull_request:
    paths:
      - '.github/workflows/tokai-live-proof-temp.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run live Tokai official adapter for current 30-day window
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { discoverTokaiOfficial30d } from './scripts/timetable/tokai-official-30d-discovery.mjs';
          const dates = [];
          const cursor = new Date('2026-09-04T00:00:00Z');
          for (let i = 0; i < 30; i += 1) {
            dates.push(cursor.toISOString().slice(0, 10));
            cursor.setUTCDate(cursor.getUTCDate() + 1);
          }
          const result = await discoverTokaiOfficial30d({ dates });
          console.log(JSON.stringify(result.completeness, null, 2));
          console.log(JSON.stringify(result.meetings.map((row) => ({ meeting_id: row.meeting_id, source: row.official_source_url })), null, 2));
          assert.equal(result.completeness.completeness, 'complete');
          assert.equal(result.completeness.failure_count, 0);
          assert.equal(result.meetings.length, 19);
          assert.ok(result.meetings.some((row) => row.meeting_id === 'nar-nagoya-racecourse-2026-10-02'));
          assert.ok(result.meetings.some((row) => row.meeting_id === 'nar-kasamatsu-racecourse-2026-09-25'));
          NODE
