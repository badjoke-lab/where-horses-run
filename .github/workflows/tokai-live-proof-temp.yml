name: Temporary Tokai joint-calendar live proof

on:
  pull_request:
    paths:
      - '.github/workflows/tokai-live-proof-temp.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Inspect official Tokai joint schedule PDF vector geometry
        shell: bash
        run: |
          set -euo pipefail
          url='https://www.kasamatsu-keiba.com/resources/pdfs/news/2026/1768888484_abd42430844a7f06de8d.pdf'
          curl -fsSL --retry 3 --retry-delay 2 -A 'Mozilla/5.0 (compatible; WhereHorsesRun/1.0)' "$url" -o /tmp/tokai.pdf
          echo "bytes=$(wc -c < /tmp/tokai.pdf)"
          echo "sha256=$(sha256sum /tmp/tokai.pdf | awk '{print $1}')"
          npm install --no-save --no-package-lock --no-audit --no-fund pdfjs-dist@5.4.149 >/dev/null
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { getDocument, OPS } from 'pdfjs-dist/legacy/build/pdf.mjs';
          const data = new Uint8Array(fs.readFileSync('/tmp/tokai.pdf'));
          const pdf = await getDocument({ data, useWorkerFetch: false, isEvalSupported: false }).promise;
          const page = await pdf.getPage(1);
          const opList = await page.getOperatorList();
          const names = new Map(Object.entries(OPS).map(([name, value]) => [value, name]));
          const counts = new Map();
          for (const fn of opList.fnArray) counts.set(names.get(fn) ?? fn, (counts.get(names.get(fn) ?? fn) ?? 0) + 1);
          console.log('OP_COUNTS=' + JSON.stringify(Object.fromEntries([...counts.entries()].sort())));
          const interesting = new Set(['constructPath','setLineDash','setLineWidth','transform','save','restore','stroke','closePath','fill','eoFill','fillStroke','eoFillStroke']);
          let emitted = 0;
          for (let i = 0; i < opList.fnArray.length; i += 1) {
            const name = names.get(opList.fnArray[i]) ?? String(opList.fnArray[i]);
            if (!interesting.has(name)) continue;
            const args = opList.argsArray[i];
            if (name === 'constructPath') {
              const flat = JSON.stringify(args);
              // Calendar body x/y lives roughly inside 60..560 / 50..730. Dump paths
              // that contain coordinates in the Sep/Oct vertical region or broad long lines.
              const nums = flat.match(/-?\d+(?:\.\d+)?/g)?.map(Number) ?? [];
              const hasSepOctY = nums.some((n) => n >= 330 && n <= 445);
              const hasCalendarX = nums.some((n) => n >= 60 && n <= 560);
              const broad = nums.length >= 6 && (Math.max(...nums) - Math.min(...nums) > 40);
              if (!(hasCalendarX && (hasSepOctY || broad))) continue;
            }
            console.log(`OP ${i} ${name} ${JSON.stringify(args)}`);
            emitted += 1;
            if (emitted >= 1200) break;
          }
          console.log(`EMITTED=${emitted}`);
          NODE
