name: Temporary Tokai joint-calendar live proof

on:
  pull_request:
    paths:
      - '.github/workflows/tokai-live-proof-temp.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect official Tokai monthly HTML structure
        shell: bash
        run: |
          set -euo pipefail
          for ym in 2026/09 2026/10; do
            url="https://www.kasamatsu-keiba.com/schedule/$ym"
            curl -fsSL --retry 3 --retry-delay 2 -A 'Mozilla/5.0 (compatible; WhereHorsesRun/1.0)' "$url" -o "/tmp/${ym//\//-}.html"
            echo "=== $url bytes=$(wc -c < /tmp/${ym//\//-}.html) ==="
            node --input-type=module - "/tmp/${ym//\//-}.html" <<'NODE'
          import fs from 'node:fs';
          const file = process.argv[2];
          const html = fs.readFileSync(file, 'utf8');
          console.log('title=', html.match(/<title[^>]*>([\s\S]*?)<\/title>/i)?.[1]?.replace(/\s+/g,' ').trim());
          const markers = ['笠松 (', '名古屋'];
          for (const marker of markers) {
            console.log(`MARKER ${marker} count=${html.split(marker).length - 1}`);
            let pos = 0;
            for (let i = 0; i < 8; i += 1) {
              pos = html.indexOf(marker, pos);
              if (pos < 0) break;
              console.log(html.slice(Math.max(0, pos - 700), Math.min(html.length, pos + 500)).replace(/\s+/g, ' '));
              pos += marker.length;
            }
          }
          NODE
          done
