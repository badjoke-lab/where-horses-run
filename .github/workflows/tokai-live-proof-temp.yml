name: Temporary Tokai joint-calendar live proof

on:
  pull_request:
    paths:
      - '.github/workflows/tokai-live-proof-temp.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Inspect official Tokai joint schedule PDF with Node coordinates
        shell: bash
        run: |
          set -euo pipefail
          url='https://www.kasamatsu-keiba.com/resources/pdfs/news/2026/1768888484_abd42430844a7f06de8d.pdf'
          curl -fsSL --retry 3 --retry-delay 2 -A 'Mozilla/5.0 (compatible; WhereHorsesRun/1.0)' "$url" -o /tmp/tokai.pdf
          echo "bytes=$(wc -c < /tmp/tokai.pdf)"
          echo "sha256=$(sha256sum /tmp/tokai.pdf | awk '{print $1}')"
          npm install --no-save --no-package-lock --no-audit --no-fund pdfjs-dist@5.4.149 >/dev/null
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { getDocument } from 'pdfjs-dist/legacy/build/pdf.mjs';
          const data = new Uint8Array(fs.readFileSync('/tmp/tokai.pdf'));
          const pdf = await getDocument({ data, useWorkerFetch: false, isEvalSupported: false }).promise;
          console.log(`pages=${pdf.numPages}`);
          const page = await pdf.getPage(1);
          const viewport = page.getViewport({ scale: 1 });
          console.log(`viewport=${viewport.width}x${viewport.height}`);
          const content = await page.getTextContent();
          const items = content.items.filter((item) => item.str?.trim()).map((item) => ({
            str: item.str.trim(),
            x: Number(item.transform[4].toFixed(2)),
            y: Number(item.transform[5].toFixed(2)),
            w: Number(item.width.toFixed(2)),
            h: Number(item.height.toFixed(2)),
          }));
          console.log(`items=${items.length}`);
          const rows = [];
          for (const item of [...items].sort((a,b) => b.y-a.y || a.x-b.x)) {
            let row = rows.find((candidate) => Math.abs(candidate.y - item.y) < 1.5);
            if (!row) { row = { y: item.y, items: [] }; rows.push(row); }
            row.items.push(item);
          }
          rows.sort((a,b) => b.y-a.y);
          for (const [index,row] of rows.entries()) {
            row.items.sort((a,b) => a.x-b.x);
            console.log(`ROW ${index} y=${row.y.toFixed(2)} :: ${row.items.map((i)=>`${i.str}@${i.x}`).join(' | ')}`);
          }
          NODE
