name: Calendar NAR August 28 Funabashi Kasamatsu A+ review

on:
  pull_request:
    paths:
      - '.github/workflows/calendar-nar-2026-08-28-funabashi-kasamatsu-a-plus-review.yml'
      - 'scripts/timetable/build-calendar-nar-2026-08-28-funabashi-kasamatsu-a-plus-approved-candidates.mjs'
      - 'data/candidates/nar-regular-refresh-2026-08-28-funabashi-kasamatsu-a-plus-approved.json'
      - 'data/generated/timetable/canonical/**'
      - 'data/generated/timetable/public/**'
      - 'data/generated/timetable/operations-status.json'
      - 'data/generated/timetable/operations-review-package.json'
      - 'scripts/check-calendar-nar-incremental-v2-promotion-output-determinism.mjs'

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          path: work
          fetch-depth: 0

      - name: Checkout exact daily-review source evidence
        uses: actions/checkout@v4
        with:
          ref: 21e162cf642551eced81451e09b021f389b9edc0
          path: review-source
          sparse-checkout: |
            data/candidates/nar-incremental-batches/due-job-plan-2026-08-24-due-japan-nar-regular-refresh-001-run-001/batch.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Rebuild exact reviewed Candidate and classify all complete details
        working-directory: work
        env:
          WHR_NAR_REVIEW_BATCH: ${{ github.workspace }}/review-source/data/candidates/nar-incremental-batches/due-job-plan-2026-08-24-due-japan-nar-regular-refresh-001-run-001/batch.json
        run: node scripts/timetable/build-calendar-nar-2026-08-28-funabashi-kasamatsu-a-plus-approved-candidates.mjs

      - name: Verify Candidate and repository state
        working-directory: work
        run: |
          git diff --exit-code -- data/candidates/nar-regular-refresh-2026-08-28-funabashi-kasamatsu-a-plus-approved.json
          node scripts/timetable/promote-timetable.mjs --input data/candidates/nar-regular-refresh-2026-08-28-funabashi-kasamatsu-a-plus-approved.json --dry-run
          node scripts/timetable/build-public-timetable-view.mjs --check
          node scripts/validate-data.mjs
          node scripts/check-japan-a-plus-public-overrides.mjs
          node scripts/check-calendar-operations-status.mjs
          node scripts/check-calendar-operations-review-package.mjs

      - name: Verify two A+ records and publication boundary
        working-directory: work
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const expected = new Map([
            ['nar-funabashi-racecourse-2026-08-28', [12, '14:45', '20:50']],
            ['nar-kasamatsu-racecourse-2026-08-28', [12, '10:40', '16:45']],
          ]);
          const candidate = JSON.parse(fs.readFileSync('data/candidates/nar-regular-refresh-2026-08-28-funabashi-kasamatsu-a-plus-approved.json', 'utf8'));
          const meetings = JSON.parse(fs.readFileSync('data/generated/timetable/canonical/meetings.json', 'utf8')).meetings;
          const details = JSON.parse(fs.readFileSync('data/generated/timetable/canonical/meeting-details.json', 'utf8')).details;
          const publicMeetings = JSON.parse(fs.readFileSync('data/generated/timetable/public/meeting-list.json', 'utf8')).meetings;
          const publicDetails = JSON.parse(fs.readFileSync('data/generated/timetable/public/meeting-details.json', 'utf8')).details;
          if (candidate.records.length !== 2) throw new Error(`expected 2 records, got ${candidate.records.length}`);
          if (candidate.records.reduce((sum, row) => sum + row.timetable_rows.length, 0) !== 24) throw new Error('expected 24 race rows');
          for (const [id, [count, first, last]] of expected) {
            const record = candidate.records.find((row) => row.meeting_id === id);
            const meeting = meetings.find((row) => row.meeting_id === id);
            const detail = details.find((row) => row.meeting_id === id);
            const publicMeeting = publicMeetings.find((row) => row.meeting_id === id);
            const publicDetail = publicDetails.find((row) => row.meeting_id === id);
            if (record?.capability_rank !== 'A+' || record.timetable_rows?.length !== count) throw new Error(`${id} candidate differs`);
            if (record.first_race_time_local !== first || record.last_race_time_local !== last) throw new Error(`${id} candidate times differ`);
            if (meeting?.capability_rank !== 'A+' || meeting.first_race_time_local !== first || meeting.last_race_time_local !== last) throw new Error(`${id} canonical meeting differs`);
            if (detail?.capability_rank !== 'A+' || detail.timetable_rows?.length !== count) throw new Error(`${id} canonical detail differs`);
            if ((publicMeeting?.effective_public_rank ?? publicMeeting?.capability_rank) !== 'A+') throw new Error(`${id} public meeting differs`);
            if ((publicDetail?.effective_public_rank ?? publicDetail?.capability_rank) !== 'A+' || publicDetail.timetable_rows?.length !== count) throw new Error(`${id} public detail differs`);
            const serialized = JSON.stringify(record).toLowerCase();
            for (const field of ['horse_name','jockey','trainer','odds','payout','result','prediction','raw_html','stream_url']) {
              if (serialized.includes(field)) throw new Error(`${id} contains forbidden field ${field}`);
            }
          }
          NODE

      - name: Verify cumulative determinism and clean output
        working-directory: work
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node scripts/check-calendar-nar-incremental-v2-promotion-output-determinism.mjs
          git diff --check
