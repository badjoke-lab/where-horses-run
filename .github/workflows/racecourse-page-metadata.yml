name: Racecourse page metadata gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'astro.config.mjs'
      - 'data/audits/racecourse-page-metadata-v1.json'
      - 'data/static/racecourse-page-metadata-contract-v1.json'
      - 'docs/seo/racecourse-page-metadata.md'
      - 'scripts/check-racecourse-page-metadata.mjs'
      - 'scripts/racecourse-page-metadata-integration.mjs'
      - '.github/workflows/racecourse-page-metadata.yml'
      - '.github/workflows/temporary-racecourse-page-metadata-discovery.yml'
  push:
    branches:
      - main
    paths:
      - 'astro.config.mjs'
      - 'data/audits/racecourse-page-metadata-v1.json'
      - 'data/static/racecourse-page-metadata-contract-v1.json'
      - 'docs/seo/racecourse-page-metadata.md'
      - 'scripts/check-racecourse-page-metadata.mjs'
      - 'scripts/racecourse-page-metadata-integration.mjs'
      - '.github/workflows/racecourse-page-metadata.yml'
      - '.github/workflows/temporary-racecourse-page-metadata-discovery.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      WHR_CALENDAR_REFERENCE_DATE: '2026-07-14'
      WHR_CALENDAR_TIMEZONE: Asia/Tokyo
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install dependencies without generating a lockfile
        run: npm install --package-lock=false
      - name: Build complete static site
        run: npm run build
      - name: Preserve Phase 10 UX release contract
        run: node scripts/check-ux-polish-release.mjs
      - name: Preserve sitemap and robots contract
        run: node scripts/check-sitemap-robots.mjs
      - name: Preserve structured data baseline
        run: node scripts/check-structured-data-baseline.mjs
      - name: Preserve country page metadata
        run: node scripts/check-country-page-metadata.mjs
      - name: Preserve racecourse bilingual release readiness
        run: node scripts/check-racecourse-page-bilingual-qa.mjs
      - name: Preserve inherited racecourse release chain
        run: |
          node scripts/check-racecourse-page-identity-reconciliation.mjs
          node scripts/check-racecourse-page-public-timetable-connection.mjs
          node scripts/check-racecourse-page-profile-evidence.mjs
          node scripts/check-racecourse-page-link-architecture.mjs
          node scripts/check-project-governance-docs.mjs
      - name: Validate racecourse page metadata
        run: node scripts/check-racecourse-page-metadata.mjs
      - name: Prove repository clean
        run: |
          changes="$(git status --porcelain --untracked-files=all)"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            exit 1
          fi
