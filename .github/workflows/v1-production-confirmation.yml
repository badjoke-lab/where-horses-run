name: v1 production confirmation gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'data/static/v1-production-confirmation-v1.json'
      - 'data/audits/v1-production-confirmation-v1.json'
      - 'docs/release/v1-production-confirmation.md'
      - 'scripts/run-v1-production-confirmation.mjs'
      - 'scripts/check-v1-production-confirmation.mjs'
      - '.github/workflows/v1-production-confirmation.yml'
      - 'data/static/v1-release-decision-v1.json'
  push:
    branches:
      - main
    paths:
      - 'data/static/v1-production-confirmation-v1.json'
      - 'data/audits/v1-production-confirmation-v1.json'
      - 'docs/release/v1-production-confirmation.md'
      - 'scripts/run-v1-production-confirmation.mjs'
      - 'scripts/check-v1-production-confirmation.mjs'
      - '.github/workflows/v1-production-confirmation.yml'
      - 'data/static/v1-release-decision-v1.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Validate production-confirmation scripts
        run: |
          node --check scripts/run-v1-production-confirmation.mjs
          node --check scripts/check-v1-production-confirmation.mjs
      - name: Probe production public surface
        shell: bash
        run: |
          set +e
          node scripts/run-v1-production-confirmation.mjs > v1-production-confirmation.log 2>&1
          status=$?
          printf '%s\n' "$status" > v1-production-confirmation.exit
          cat v1-production-confirmation.log
          exit 0
      - name: Upload production-confirmation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-production-confirmation-report
          path: |
            v1-production-confirmation-report.json
            v1-production-confirmation.log
            v1-production-confirmation.exit
          if-no-files-found: warn
          retention-days: 14
      - name: Enforce production probe success
        run: |
          status="$(cat v1-production-confirmation.exit)"
          if [ "$status" != "0" ]; then
            exit "$status"
          fi
      - name: Validate production-confirmation contract
        run: node scripts/check-v1-production-confirmation.mjs
      - name: Remove generated production evidence
        if: always()
        run: rm -f v1-production-confirmation-report.json v1-production-confirmation.log v1-production-confirmation.exit
      - name: Prove repository clean
        run: |
          changes="$(git status --porcelain --untracked-files=all)"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            exit 1
          fi
