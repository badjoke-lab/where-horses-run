name: Calendar HKJC September 23 boundary PR diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout exact acquisition evidence
        uses: actions/checkout@v4
        with:
          ref: ca20dce8e061ed082ba6d61aac8e9ede7360ff6d
          path: review-source
          sparse-checkout: |
            data/generated/timetable/actions-multi-job/due-job-plan-2026-08-26-due-hong-kong-hkjc-season-wake-up-001-run-001/candidates.json
            data/generated/timetable/actions-multi-job/due-job-plan-2026-08-26-due-hong-kong-hkjc-season-wake-up-001-run-001/collection-report.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Rebuild exact post-promotion state
        env:
          WHR_HKJC_REVIEW_CANDIDATES: ${{ github.workspace }}/review-source/data/generated/timetable/actions-multi-job/due-job-plan-2026-08-26-due-hong-kong-hkjc-season-wake-up-001-run-001/candidates.json
          WHR_HKJC_REVIEW_REPORT: ${{ github.workspace }}/review-source/data/generated/timetable/actions-multi-job/due-job-plan-2026-08-26-due-hong-kong-hkjc-season-wake-up-001-run-001/collection-report.json
        run: |
          node scripts/timetable/build-calendar-hkjc-september-2026-09-23-fixture-approved-candidates.mjs
          node scripts/timetable/promote-timetable.mjs --input data/candidates/hkjc-september-2026-09-23-fixture-approved.json
          node scripts/timetable/build-public-timetable-view.mjs
          node scripts/timetable/build-japan-a-plus-public-overrides.mjs
          node scripts/timetable/build-operations-status.mjs --reference-date 2026-07-01
          node scripts/timetable/build-operations-review-package.mjs

      - name: A1 canonical meetings must be base plus one
        continue-on-error: true
        env: { BASE_SHA: c9f9d464acfdf9edc230b263f000e89b11db3c07 }
        run: node --input-type=module -e "import fs from 'node:fs';import{execFileSync}from'node:child_process';const b=JSON.parse(execFileSync('git',['show',process.env.BASE_SHA+':data/generated/timetable/canonical/meetings.json'],{encoding:'utf8'}));const h=JSON.parse(fs.readFileSync('data/generated/timetable/canonical/meetings.json'));console.log('ACTUAL',b.meetings.length,'->',h.meetings.length);if(h.meetings.length!==b.meetings.length+1)process.exit(1)"

      - name: A2 canonical details must be unchanged
        continue-on-error: true
        env: { BASE_SHA: c9f9d464acfdf9edc230b263f000e89b11db3c07 }
        run: node --input-type=module -e "import fs from 'node:fs';import{execFileSync}from'node:child_process';const b=JSON.parse(execFileSync('git',['show',process.env.BASE_SHA+':data/generated/timetable/canonical/meeting-details.json'],{encoding:'utf8'}));const h=JSON.parse(fs.readFileSync('data/generated/timetable/canonical/meeting-details.json'));console.log('ACTUAL',b.details.length,'->',h.details.length);if(h.details.length!==b.details.length)process.exit(1)"

      - name: A3 raw public meetings must be base plus one
        continue-on-error: true
        env: { BASE_SHA: c9f9d464acfdf9edc230b263f000e89b11db3c07 }
        run: node --input-type=module -e "import fs from 'node:fs';import{execFileSync}from'node:child_process';const b=JSON.parse(execFileSync('git',['show',process.env.BASE_SHA+':data/generated/timetable/public/meeting-list.json'],{encoding:'utf8'}));const h=JSON.parse(fs.readFileSync('data/generated/timetable/public/meeting-list.json'));console.log('ACTUAL',b.meetings.length,'->',h.meetings.length);if(h.meetings.length!==b.meetings.length+1)process.exit(1)"

      - name: A4 raw public details must be unchanged
        continue-on-error: true
        env: { BASE_SHA: c9f9d464acfdf9edc230b263f000e89b11db3c07 }
        run: node --input-type=module -e "import fs from 'node:fs';import{execFileSync}from'node:child_process';const b=JSON.parse(execFileSync('git',['show',process.env.BASE_SHA+':data/generated/timetable/public/meeting-details.json'],{encoding:'utf8'}));const h=JSON.parse(fs.readFileSync('data/generated/timetable/public/meeting-details.json'));console.log('ACTUAL',b.details.length,'->',h.details.length);if(h.details.length!==b.details.length)process.exit(1)"

      - name: A5 target must remain public C with no detail or times
        continue-on-error: true
        run: node --input-type=module -e "import fs from'node:fs';const id='hkjc-happy-valley-racecourse-2026-09-23';const m=JSON.parse(fs.readFileSync('data/generated/timetable/canonical/meetings.json')).meetings.find(x=>x.meeting_id===id);const p=JSON.parse(fs.readFileSync('data/generated/timetable/public/meeting-list.json')).meetings.find(x=>x.meeting_id===id);const cd=JSON.parse(fs.readFileSync('data/generated/timetable/canonical/meeting-details.json')).details;const pd=JSON.parse(fs.readFileSync('data/generated/timetable/public/meeting-details.json')).details;console.log(JSON.stringify({m,p,canonicalDetail:cd.some(x=>x.meeting_id===id),publicDetail:pd.some(x=>x.meeting_id===id)}));if(m?.capability_rank!=='C'||m.first_race_time_local!==null||m.last_race_time_local!==null||(p?.effective_public_rank??p?.capability_rank)!=='C'||cd.some(x=>x.meeting_id===id)||pd.some(x=>x.meeting_id===id))process.exit(1)"

      - name: A6 operations projection must be unchanged
        continue-on-error: true
        env: { BASE_SHA: c9f9d464acfdf9edc230b263f000e89b11db3c07 }
        run: node --input-type=module -e "import fs from'node:fs';import{execFileSync}from'node:child_process';const b=JSON.parse(execFileSync('git',['show',process.env.BASE_SHA+':data/generated/timetable/operations-status.json'],{encoding:'utf8'})).public_projection;const h=JSON.parse(fs.readFileSync('data/generated/timetable/operations-status.json')).public_projection;console.log('ACTUAL',JSON.stringify(b),'->',JSON.stringify(h));if(h?.meeting_count!==b?.meeting_count||h?.detail_count!==b?.detail_count||h?.latest_meeting_date!==b?.latest_meeting_date)process.exit(1)"

      - name: A7 forbidden fields must be absent
        continue-on-error: true
        run: node --input-type=module -e "import fs from'node:fs';const r=JSON.parse(fs.readFileSync('data/generated/timetable/canonical/meetings.json')).meetings.find(x=>x.meeting_id==='hkjc-happy-valley-racecourse-2026-09-23');const s=JSON.stringify(r).toLowerCase();for(const f of['horse_name','jockey','trainer','odds','payout','result','prediction','raw_html','stream_url'])if(s.includes(f)){console.log('FOUND',f);process.exit(1)}"

      - name: A8 git diff check must be clean
        continue-on-error: true
        run: git diff --check
