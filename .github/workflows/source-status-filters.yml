name: Source status filters gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'data/audits/source-status-filters-v1.json'
      - 'data/static/source-status-filter-contract-v1.json'
      - 'docs/search/source-status-filters.md'
      - 'scripts/check-source-status-filters.mjs'
      - 'src/components/SourceDirectoryPage.astro'
      - 'src/lib/source-filter-data.ts'
      - 'src/pages/sources/index.astro'
      - 'src/pages/ja/sources/index.astro'
      - '.github/workflows/source-status-filters.yml'
      - '.github/workflows/temporary-source-filter-discovery.yml'
  push:
    branches:
      - main
    paths:
      - 'data/audits/source-status-filters-v1.json'
      - 'data/static/source-status-filter-contract-v1.json'
      - 'docs/search/source-status-filters.md'
      - 'scripts/check-source-status-filters.mjs'
      - 'src/components/SourceDirectoryPage.astro'
      - 'src/lib/source-filter-data.ts'
      - 'src/pages/sources/index.astro'
      - 'src/pages/ja/sources/index.astro'
      - '.github/workflows/source-status-filters.yml'
      - '.github/workflows/temporary-source-filter-discovery.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install dependencies without generating a lockfile
        run: npm install --package-lock=false
      - name: Build bilingual source directories and site
        run: npm run build
      - name: Preserve glossary public v1 contract
        run: node scripts/check-glossary-qa-release.mjs
      - name: Preserve global search foundation contract
        run: node scripts/check-global-search-foundation.mjs
      - name: Preserve country filter contract
        run: node scripts/check-country-filters.mjs
      - name: Preserve race type filter contract
        run: node scripts/check-race-type-filters.mjs
      - name: Preserve region filter contract
        run: node scripts/check-region-filters.mjs
      - name: Capture source ID diagnostics
        shell: bash
        run: |
          node <<'NODE' > "$RUNNER_TEMP/source-status-filter-duplicates.json"
          const fs = require('node:fs');
          const html = fs.readFileSync('dist/sources/index.html', 'utf8');
          const ids = [...html.matchAll(/data-source-id="([^"]*)"/g)].map((match) => match[1]);
          const counts = ids.reduce((map, id) => map.set(id, (map.get(id) ?? 0) + 1), new Map());
          const duplicates = [...counts.entries()].filter(([, count]) => count > 1);
          console.log(JSON.stringify({ total: ids.length, unique: counts.size, duplicates }, null, 2));
          NODE
      - name: Validate source status filters
        shell: bash
        run: |
          set -o pipefail
          node scripts/check-source-status-filters.mjs 2>&1 | tee "$RUNNER_TEMP/source-status-filter-check.log"
      - name: Upload source filter diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: source-status-filter-diagnostics
          path: ${{ runner.temp }}/source-status-filter-*
          retention-days: 1
      - name: Prove repository clean
        run: |
          changes="$(git status --porcelain --untracked-files=all)"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            exit 1
          fi
