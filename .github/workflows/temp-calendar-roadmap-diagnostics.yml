name: Temporary Calendar roadmap diagnostics

on:
  pull_request:
    paths:
      - '.github/workflows/temp-calendar-roadmap-diagnostics.yml'

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Capture governance and pipeline diagnostics
        run: |
          mkdir -p .diagnostics
          node scripts/check-project-governance-docs.mjs > .diagnostics/calendar-roadmap-governance.log 2>&1 || true
          node scripts/check-calendar-pipeline-v1-release-gate.mjs > .diagnostics/calendar-roadmap-pipeline.log 2>&1 || true
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .diagnostics/calendar-roadmap-governance.log .diagnostics/calendar-roadmap-pipeline.log
          git commit -m "[CF-Pages-Skip] Capture Calendar roadmap diagnostics"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
