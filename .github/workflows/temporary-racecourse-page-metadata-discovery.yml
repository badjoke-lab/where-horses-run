name: Temporary racecourse page metadata discovery

on:
  pull_request:
    branches:
      - main
    paths:
      - 'astro.config.mjs'
      - 'scripts/racecourse-page-metadata-integration.mjs'
      - '.github/workflows/temporary-racecourse-page-metadata-discovery.yml'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install dependencies without generating a lockfile
        run: npm install --package-lock=false
      - name: Build complete static site
        run: npm run build
      - name: Capture racecourse metadata measurements
        shell: bash
        run: |
          node <<'NODE' > racecourse-page-metadata-discovery.json
          const fs = require('node:fs');
          const path = require('node:path');

          function walk(directory) {
            return fs.readdirSync(directory, { withFileTypes: true }).flatMap((entry) => {
              const absolute = path.join(directory, entry.name);
              return entry.isDirectory() ? walk(absolute) : [absolute];
            });
          }

          function decode(value) {
            return value
              .replace(/&#x([0-9a-f]+);/gi, (_, hex) => String.fromCodePoint(Number.parseInt(hex, 16)))
              .replace(/&#(\d+);/g, (_, decimal) => String.fromCodePoint(Number.parseInt(decimal, 10)))
              .replaceAll('&quot;', '"')
              .replaceAll('&#39;', "'")
              .replaceAll('&#x27;', "'")
              .replaceAll('&lt;', '<')
              .replaceAll('&gt;', '>')
              .replaceAll('&amp;', '&');
          }

          const files = walk('dist').filter((file) => /(?:^|\/)tracks\/[^/]+\/index\.html$/.test(file.split(path.sep).join('/')));
          const summary = {
            pages: files.length,
            englishPages: 0,
            japanesePages: 0,
            slugs: 0,
            scripts: 0,
            validJsonScripts: 0,
            collectionPageNodes: 0,
            placeNodes: 0,
            baselineLinks: 0,
            countryAreaLinks: 0,
            addressValues: 0,
            canonicalMismatches: 0,
            pageFieldMismatches: 0,
            placeNameMismatches: 0,
            missingAlternateNames: 0,
            unexpectedTypes: 0,
            sportsActivityLocationClaims: 0,
            sameAsClaims: 0,
            unsafeLessThanCharacters: 0,
          };
          const slugs = new Set();

          for (const file of files) {
            const normalized = file.split(path.sep).join('/');
            const route = normalized.match(/dist\/(ja\/)?tracks\/([^/]+)\/index\.html$/);
            if (!route) continue;
            const locale = route[1] ? 'ja' : 'en';
            const slug = route[2];
            slugs.add(slug);
            if (locale === 'ja') summary.japanesePages += 1;
            else summary.englishPages += 1;

            const html = fs.readFileSync(file, 'utf8');
            const canonical = decode(html.match(/<link\s+[^>]*rel="canonical"[^>]*href="([^"]+)"|<link\s+[^>]*href="([^"]+)"[^>]*rel="canonical"/)?.slice(1).find(Boolean) || '');
            const title = decode(html.match(/<title>([\s\S]*?)<\/title>/)?.[1]?.replace(/<[^>]*>/g, '').trim() || '');
            const description = decode(html.match(/<meta\s+[^>]*name="description"[^>]*content="([^"]+)"|<meta\s+[^>]*content="([^"]+)"[^>]*name="description"/)?.slice(1).find(Boolean) || '');
            const lang = html.match(/<html\s+[^>]*lang="([^"]+)"/)?.[1];
            const placeName = decode(html.match(/<h1[^>]*id="page-title"[^>]*>([\s\S]*?)<\/h1>/)?.[1]?.replace(/<[^>]*>/g, '').trim() || '');
            const countryHref = decode(html.match(new RegExp(`<p>\\s*<strong>\\s*${locale === 'ja' ? '国:' : 'Country:'}\\s*<\\/strong>\\s*<a\\s+[^>]*href="([^"]+)"`, 'i'))?.[1] || '');
            const countryAreaId = countryHref ? `${new URL(countryHref, 'https://whr.badjoke-lab.com').toString()}#administrative-area` : '';

            const scripts = [...html.matchAll(/<script[^>]*type="application\/ld\+json"[^>]*data-racecourse-page-metadata="collection-place-v1"[^>]*>([\s\S]*?)<\/script>/g)];
            summary.scripts += scripts.length;
            if (scripts.length !== 1) continue;
            if (scripts[0][1].includes('<')) summary.unsafeLessThanCharacters += 1;
            let data;
            try {
              data = JSON.parse(scripts[0][1]);
              summary.validJsonScripts += 1;
            } catch {
              continue;
            }
            const graph = Array.isArray(data['@graph']) ? data['@graph'] : [];
            const collection = graph.find((node) => node['@type'] === 'CollectionPage');
            const place = graph.find((node) => node['@type'] === 'Place');
            summary.collectionPageNodes += collection ? 1 : 0;
            summary.placeNodes += place ? 1 : 0;
            summary.unexpectedTypes += graph.filter((node) => !['CollectionPage', 'Place'].includes(node['@type'])).length;
            summary.sportsActivityLocationClaims += graph.filter((node) => node['@type'] === 'SportsActivityLocation').length;
            summary.sameAsClaims += graph.filter((node) => Object.hasOwn(node, 'sameAs')).length;
            if (collection?.['@id'] === `${canonical}#webpage` && place?.mainEntityOfPage?.['@id'] === `${canonical}#webpage`) summary.baselineLinks += 1;
            if (place?.containedInPlace?.['@id'] === countryAreaId) summary.countryAreaLinks += 1;
            if (typeof place?.address === 'string' && place.address.length > 0) summary.addressValues += 1;
            if (collection?.url !== canonical || place?.url !== canonical || collection?.about?.['@id'] !== `${canonical}#place` || collection?.mainEntity?.['@id'] !== `${canonical}#place`) summary.canonicalMismatches += 1;
            if (collection?.name !== title || collection?.description !== description || collection?.inLanguage !== lang) summary.pageFieldMismatches += 1;
            if (place?.name !== placeName) summary.placeNameMismatches += 1;
            if (!Array.isArray(place?.alternateName) || place.alternateName.length === 0) summary.missingAlternateNames += 1;
          }

          summary.slugs = slugs.size;
          console.log(JSON.stringify(summary, null, 2));
          NODE
          cat racecourse-page-metadata-discovery.json
      - name: Upload racecourse metadata discovery
        uses: actions/upload-artifact@v4
        with:
          name: racecourse-page-metadata-discovery
          path: racecourse-page-metadata-discovery.json
          retention-days: 1
