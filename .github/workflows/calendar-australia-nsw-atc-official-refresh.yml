name: Australia NSW ATC official Calendar refresh

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Refresh scope
        required: true
        default: near
        type: choice
        options: [near, full]
  push:
    branches: [main]
    paths:
      - '.github/workflows/calendar-australia-nsw-atc-official-refresh.yml'
      - 'scripts/timetable/australia-nsw-atc-2026-27-core.mjs'
      - 'scripts/timetable/run-australia-nsw-atc-2026-27-official-window.mjs'
      - 'scripts/check-australia-nsw-atc-2026-27-adapter.mjs'
  schedule:
    - cron: '57 2 * * *'
    - cron: '23 4 * * 1'
  pull_request:
    paths:
      - '.github/workflows/calendar-australia-nsw-atc-official-refresh.yml'
      - '.github/workflows/calendar-unified-official-refresh.yml'
      - '.github/workflows/calendar-near-official-refresh.yml'
      - 'scripts/timetable/australia-nsw-atc-2026-27-core.mjs'
      - 'scripts/timetable/run-australia-nsw-atc-2026-27-official-window.mjs'
      - 'scripts/check-australia-nsw-atc-2026-27-adapter.mjs'
      - 'scripts/timetable/persist-country-on-main.sh'
      - 'data/static/calendar-acquisition-registry.json'
      - 'data/static/calendar-readiness-registry.json'
      - 'data/static/calendar-non-running-evidence-registry-v1.json'
      - 'data/static/racecourses.json'
      - 'data/static/racecourse-locations-v1.json'

permissions:
  contents: write

concurrency:
  group: australia-nsw-atc-2026-27-calendar
  cancel-in-progress: false

jobs:
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm run validate:australia-nsw-atc-2026-27
      - name: Verify live ATC 2026-27 date and four-venue denominator
        run: |
          set -euo pipefail
          mkdir -p .calendar-australia-nsw
          node scripts/timetable/run-australia-nsw-atc-2026-27-official-window.mjs --as-of=2026-10-17 --days=30 --output=.calendar-australia-nsw/atc.json
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const x=JSON.parse(fs.readFileSync('.calendar-australia-nsw/atc.json','utf8'));
          if(x.acquisition_attempt.status!=='success'||x.discovery.approved_atc_dates!==107||x.discovery.all_source_dates!==109||x.records.length!==9)throw Error('Live ATC official fixture evidence differs '+JSON.stringify(x.diagnostics));
          if(x.records.some(m=>m.capability_rank!=='C'||m.first_race_time_local!==null||m.timetable_rows.length||m.country_id!=='australia'))throw Error('ATC C scope contract');
          if(x.discovery.venue_ids.length!==4||!x.records.every(m=>x.discovery.venue_ids.includes(m.racecourse_id)))throw Error('ATC physical venue denominator drift');
          JS
          node scripts/timetable/apply-official-rolling-observations.mjs --artifact=.calendar-australia-nsw/atc.json --country-id=australia --authority-id=australian-turf-club --racing-system-id=australia-nsw-atc-thoroughbred-system --timezone=Australia/Sydney
          node scripts/check-calendar-acquisition-registry.mjs
          node scripts/check-calendar-98-tier-execution-coverage.mjs
          node scripts/check-calendar-98-tier-acquisition-methods.mjs
          node scripts/check-calendar-non-running-evidence-registry.mjs
          node scripts/check-calendar-public-map-parity.mjs
          node scripts/check-calendar-unified-audit-coverage.mjs
      - name: Verify site builds after ATC public apply
        run: npm run build

  refresh:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --no-audit --no-fund
      - id: scope
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            scope="${{ inputs.scope }}"
          elif [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event.schedule }}" = "23 4 * * 1" ]; then
            scope=full
          else
            scope=near
          fi
          if [ "$scope" = full ]; then days=90; else days=30; fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "days=$days" >> "$GITHUB_OUTPUT"
      - name: Collect and apply only ATC 2026-27 venue dates
        run: |
          mkdir -p .calendar-australia-nsw
          node scripts/timetable/run-australia-nsw-atc-2026-27-official-window.mjs --days="${{ steps.scope.outputs.days }}" --output=.calendar-australia-nsw/atc.json
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const x=JSON.parse(fs.readFileSync('.calendar-australia-nsw/atc.json','utf8'));
          if(x.acquisition_attempt.status!=='success'||x.discovery.approved_atc_dates!==107)throw Error('ATC approved source failed; preserve production state');
          JS
          node scripts/timetable/apply-official-rolling-observations.mjs --artifact=.calendar-australia-nsw/atc.json --country-id=australia --authority-id=australian-turf-club --racing-system-id=australia-nsw-atc-thoroughbred-system --timezone=Australia/Sydney
          node scripts/timetable/apply-reviewed-calendar-observations.mjs
          node scripts/check-calendar-public-country-support.mjs
          node scripts/check-calendar-public-map-parity.mjs
          node scripts/check-calendar-non-running-evidence-registry.mjs
      - name: Persist ATC projected data against latest main
        shell: bash
        run: |
          set -euo pipefail
          recollect_on_main() {
            npm install --no-package-lock --no-audit --no-fund
            rm -rf .calendar-australia-nsw
            mkdir -p .calendar-australia-nsw
            node scripts/timetable/run-australia-nsw-atc-2026-27-official-window.mjs --days="${{ steps.scope.outputs.days }}" --output=.calendar-australia-nsw/atc.json
            node --input-type=module <<'JS'
          import fs from 'node:fs';
          const x=JSON.parse(fs.readFileSync('.calendar-australia-nsw/atc.json','utf8'));
          if(x.acquisition_attempt.status!=='success'||x.discovery.approved_atc_dates!==107)throw Error('ATC source failed during latest-main retry');
          JS
            node scripts/timetable/apply-official-rolling-observations.mjs --artifact=.calendar-australia-nsw/atc.json --country-id=australia --authority-id=australian-turf-club --racing-system-id=australia-nsw-atc-thoroughbred-system --timezone=Australia/Sydney
            node scripts/timetable/apply-reviewed-calendar-observations.mjs
            node scripts/check-calendar-public-country-support.mjs
            node scripts/check-calendar-public-map-parity.mjs
            node scripts/check-calendar-non-running-evidence-registry.mjs
          }
          source scripts/timetable/persist-country-on-main.sh
          persist_country_on_main 'Australia NSW ATC' '${{ steps.scope.outputs.scope }}' recollect_on_main
