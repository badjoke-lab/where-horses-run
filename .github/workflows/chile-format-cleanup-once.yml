name: Chile format cleanup staging once

on:
  push:
    branches:
      - feat/calendar-chile-official-20260910-v2
    paths:
      - '.github/workflows/chile-format-cleanup-once.yml'

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/calendar-chile-official-20260910-v2
          fetch-depth: 0
      - name: Stage minimal-format Chile data files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          tmp=Path('data/tmp'); tmp.mkdir(parents=True, exist_ok=True)

          rp=Path('data/static/country-page-racecourses-01-04.json')
          rows=json.loads(rp.read_text())
          chile_ids={'club-hipico-de-santiago-racecourse','hipodromo-chile-racecourse','valparaiso-sporting-club-racecourse','club-hipico-de-concepcion-racecourse'}
          assert {r.get('id') for r in rows if r.get('id') in chile_ids} == chile_ids
          race='[\n' + ',\n'.join(json.dumps(r,ensure_ascii=False,separators=(',',':')) for r in rows) + '\n]\n'
          (tmp/'chile-racecourses-minimal.json').write_text(race)

          pp=Path('src/data/publicationDisplayPolicies.json')
          policy=json.loads(pp.read_text())
          matches=[p for p in policy['policies'] if p.get('id')=='chile-teletrak-reviewed-a']
          assert len(matches)==1
          assert matches[0]['max_public_rank']=='A'
          (tmp/'chile-publication-policies-minimal.json').write_text(json.dumps(policy,ensure_ascii=False,indent=2)+'\n')
          PY
          git diff --check -- data/tmp
      - name: Commit staged cleanup files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tmp/chile-racecourses-minimal.json data/tmp/chile-publication-policies-minimal.json
          git commit -m "ci: stage minimal Chile data formatting"
          git push origin HEAD:feat/calendar-chile-official-20260910-v2
