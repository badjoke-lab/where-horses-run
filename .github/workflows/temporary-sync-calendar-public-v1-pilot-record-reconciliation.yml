name: Temporary Calendar Public v1 pilot-record sync

on:
  push:
    branches:
      - work/calendar-public-v1-pilot-record-reconciliation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/calendar-public-v1-pilot-record-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install dependencies
        run: npm install
      - name: Synchronize documentation state
        run: node scripts/temporary-sync-calendar-public-v1-pilot-record-reconciliation.mjs
      - name: Validate pilot-record reconciliation
        shell: bash
        run: |
          set +e
          node scripts/check-calendar-public-v1-pilot-record-reconciliation.mjs 2>&1 | tee /tmp/calendar-public-v1-pilot-record-reconciliation.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"
      - name: Upload source reconciliation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calendar-public-v1-pilot-record-reconciliation-${{ github.run_id }}
          path: /tmp/calendar-public-v1-pilot-record-reconciliation.log
          if-no-files-found: warn
          retention-days: 7
      - name: Build deterministic rendered fixture
        env:
          WHR_CALENDAR_REFERENCE_DATE: '2026-07-01'
          WHR_CALENDAR_TIMEZONE: Asia/Tokyo
        run: npm run build
      - name: Validate rendered bilingual coverage states
        env:
          WHR_CALENDAR_REFERENCE_DATE: '2026-07-01'
          WHR_CALENDAR_TIMEZONE: Asia/Tokyo
        run: node scripts/check-calendar-public-v1-pilot-record-rendered.mjs
      - name: Validate diff hygiene
        run: git diff --check
      - name: Commit synchronized documentation
        run: |
          if git diff --quiet; then
            echo "No synchronization changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/calendar/README.md docs/calendar/implementation-roadmap.md
          git commit -m "[CF-Pages-Skip] Synchronize Public v1 pilot-record state"
          git pull --rebase origin work/calendar-public-v1-pilot-record-reconciliation
          git push origin HEAD:work/calendar-public-v1-pilot-record-reconciliation
