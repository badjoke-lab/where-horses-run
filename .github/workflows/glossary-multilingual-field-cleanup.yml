name: Glossary multilingual field cleanup gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'data/audits/glossary-schema-extension-v1.json'
      - 'data/audits/glossary-racing-type-expansion-v1.json'
      - 'data/audits/glossary-horse-breed-expansion-v1.json'
      - 'data/audits/glossary-role-expansion-v1.json'
      - 'data/audits/glossary-timetable-term-expansion-v1.json'
      - 'data/audits/glossary-official-source-term-expansion-v1.json'
      - 'data/audits/glossary-multilingual-field-cleanup-v1.json'
      - 'data/static/glossary.json'
      - 'data/static/glossary-entry-v2.schema.json'
      - 'data/static/glossary-entries-*.json'
      - 'data/static/glossary-fields-multilingual-v1.json'
      - 'data/static/glossary-category-labels-v1.json'
      - 'data/static/glossary-multilingual-field-registry-v1.json'
      - 'docs/glossary/multilingual-field-cleanup.md'
      - 'scripts/glossary-data-loader.mjs'
      - 'scripts/check-glossary-schema-extension.mjs'
      - 'scripts/check-glossary-racing-type-expansion.mjs'
      - 'scripts/check-glossary-horse-breed-expansion.mjs'
      - 'scripts/check-glossary-role-expansion.mjs'
      - 'scripts/check-glossary-timetable-term-expansion.mjs'
      - 'scripts/check-glossary-official-source-term-expansion.mjs'
      - 'scripts/check-glossary-multilingual-field-cleanup.mjs'
      - 'src/lib/glossary-data.ts'
      - 'src/pages/glossary/**'
      - 'src/pages/ja/glossary/**'
      - '.github/workflows/glossary-multilingual-field-cleanup.yml'
  push:
    branches:
      - main
    paths:
      - 'data/audits/glossary-schema-extension-v1.json'
      - 'data/audits/glossary-racing-type-expansion-v1.json'
      - 'data/audits/glossary-horse-breed-expansion-v1.json'
      - 'data/audits/glossary-role-expansion-v1.json'
      - 'data/audits/glossary-timetable-term-expansion-v1.json'
      - 'data/audits/glossary-official-source-term-expansion-v1.json'
      - 'data/audits/glossary-multilingual-field-cleanup-v1.json'
      - 'data/static/glossary.json'
      - 'data/static/glossary-entry-v2.schema.json'
      - 'data/static/glossary-entries-*.json'
      - 'data/static/glossary-fields-multilingual-v1.json'
      - 'data/static/glossary-category-labels-v1.json'
      - 'data/static/glossary-multilingual-field-registry-v1.json'
      - 'docs/glossary/multilingual-field-cleanup.md'
      - 'scripts/glossary-data-loader.mjs'
      - 'scripts/check-glossary-schema-extension.mjs'
      - 'scripts/check-glossary-racing-type-expansion.mjs'
      - 'scripts/check-glossary-horse-breed-expansion.mjs'
      - 'scripts/check-glossary-role-expansion.mjs'
      - 'scripts/check-glossary-timetable-term-expansion.mjs'
      - 'scripts/check-glossary-official-source-term-expansion.mjs'
      - 'scripts/check-glossary-multilingual-field-cleanup.mjs'
      - 'src/lib/glossary-data.ts'
      - 'src/pages/glossary/**'
      - 'src/pages/ja/glossary/**'
      - '.github/workflows/glossary-multilingual-field-cleanup.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install dependencies without generating a lockfile
        run: npm install --package-lock=false
      - name: Build bilingual glossary routes
        run: npm run build
      - name: Preserve glossary v2 migration contract
        run: node scripts/check-glossary-schema-extension.mjs
      - name: Preserve racing-type release contract
        run: node scripts/check-glossary-racing-type-expansion.mjs
      - name: Preserve horse-breed release contract
        run: node scripts/check-glossary-horse-breed-expansion.mjs
      - name: Preserve role release contract
        run: node scripts/check-glossary-role-expansion.mjs
      - name: Preserve timetable-term release contract
        run: node scripts/check-glossary-timetable-term-expansion.mjs
      - name: Preserve official-source release contract
        run: node scripts/check-glossary-official-source-term-expansion.mjs
      - name: Validate multilingual field cleanup
        run: node scripts/check-glossary-multilingual-field-cleanup.mjs
      - name: Prove repository clean
        run: |
          changes="$(git status --porcelain --untracked-files=all)"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            exit 1
          fi
