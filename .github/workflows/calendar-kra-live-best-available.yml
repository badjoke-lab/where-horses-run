name: Calendar KRA live best-available

on:
  pull_request:
    paths:
      - 'scripts/timetable/kra-todayrace-core.mjs'
      - 'scripts/timetable/collect-kra-todayrace.mjs'
      - '.github/workflows/calendar-kra-live-best-available.yml'

permissions:
  contents: read

concurrency:
  group: calendar-kra-live-best-available-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Check syntax and five-rank classifier semantics
        run: |
          node --check scripts/timetable/kra-todayrace-core.mjs
          node --check scripts/timetable/collect-kra-todayrace.mjs
          node --input-type=module <<'NODE'
          import { classifyKraObservation } from './scripts/timetable/kra-todayrace-core.mjs';
          const c = classifyKraObservation([]);
          const b = classifyKraObservation([{ race_number: 1, post_time_local: '10:00' }]);
          const bp = classifyKraObservation([{ race_number: 1, post_time_local: '10:00' }, { race_number: 3, post_time_local: '11:00' }]);
          const a = classifyKraObservation([{ race_number: 1, post_time_local: '10:00' }, { race_number: 2, post_time_local: '11:00' }]);
          const ap = classifyKraObservation([
            { race_number: 1, post_time_local: '10:00', distance_m: 1200, race_description: '국6등급' },
            { race_number: 2, post_time_local: '11:00', distance_m: 1400, race_description: '국5등급' },
          ]);
          if (c.rank !== 'C' || b.rank !== 'B' || bp.rank !== 'B+' || a.rank !== 'A' || ap.rank !== 'A+') {
            throw new Error(`five-rank semantics differ: ${JSON.stringify({c,b,bp,a,ap})}`);
          }
          console.log('KRA_FIVE_RANK_CLASSIFIER: pass');
          NODE
      - name: Check public-safe boundary
        run: |
          if grep -Eq 'writeFile|appendFile|raw.*html.*=' scripts/timetable/collect-kra-todayrace.mjs; then
            echo 'KRA live collector must not persist raw source HTML.' >&2
            exit 1
          fi
          grep -q 'raw_html_stored: false' scripts/timetable/collect-kra-todayrace.mjs
          grep -q "source_id: 'kra-today-race'" scripts/timetable/kra-todayrace-core.mjs

  live-proof:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Re-run the proven historical A+ meeting
        run: |
          node scripts/timetable/collect-kra-todayrace.mjs \
            --date=2026-06-06 \
            --racecourse-id=seoul-racecourse \
            > /tmp/kra-historical-proof.json
          cat /tmp/kra-historical-proof.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const value = JSON.parse(fs.readFileSync('/tmp/kra-historical-proof.json', 'utf8'));
          if (!['A','A+'].includes(value.capability_rank)) throw new Error(`historical proof did not reach A/A+: ${value.capability_rank}`);
          if (value.classifier.time_count < 2 || value.timetable_rows.length < 2) throw new Error('historical proof timetable incomplete');
          if (value.raw_html_stored !== false) throw new Error('raw HTML boundary differs');
          console.log(`KRA_HISTORICAL_LIVE_RANK=${value.capability_rank}`);
          NODE
      - name: Capture current September meetings without a minimum-rank requirement
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/kra-current
          while IFS='|' read -r date racecourse; do
            node scripts/timetable/collect-kra-todayrace.mjs \
              --date="$date" \
              --racecourse-id="$racecourse" \
              > "/tmp/kra-current/${date}-${racecourse}.json"
          done <<'MEETINGS'
          2026-09-04|busan-gyeongnam-racecourse
          2026-09-04|jeju-racecourse
          2026-09-05|seoul-racecourse
          2026-09-05|jeju-racecourse
          2026-09-06|seoul-racecourse
          2026-09-06|busan-gyeongnam-racecourse
          MEETINGS
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const dir = '/tmp/kra-current';
          const values = fs.readdirSync(dir).map((name) => JSON.parse(fs.readFileSync(`${dir}/${name}`, 'utf8')));
          const ranks = ['C','B','B+','A','A+'];
          if (values.length !== 6) throw new Error(`expected six KRA current observations, got ${values.length}`);
          if (values.some((value) => !ranks.includes(value.capability_rank))) throw new Error('invalid KRA current rank');
          if (values.some((value) => value.raw_html_stored !== false)) throw new Error('raw HTML boundary differs');
          const rankCounts = Object.fromEntries(ranks.map((rank) => [rank, values.filter((value) => value.capability_rank === rank).length]));
          const summary = {
            schema_version: 'kra-live-best-available-proof-v1',
            observation_count: values.length,
            rank_counts: rankCounts,
            meetings: values.map((value) => ({
              meeting_id: value.meeting_id,
              capability_rank: value.capability_rank,
              race_count: value.classifier.race_count,
              time_count: value.classifier.time_count,
              distance_count: value.classifier.distance_count,
              description_count: value.classifier.description_count,
              source_statuses: value.source_statuses,
            })),
            minimum_rank_required: false,
            raw_html_stored: false,
          };
          fs.writeFileSync('/tmp/kra-current-summary.json', `${JSON.stringify(summary, null, 2)}\n`);
          console.log(JSON.stringify(summary));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: kra-live-best-available-proof-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: |
            /tmp/kra-historical-proof.json
            /tmp/kra-current-summary.json
            /tmp/kra-current/
