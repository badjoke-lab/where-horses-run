name: Temporary Operations v2 retry-state updater

on:
  pull_request:
    paths:
      - 'scripts/update-operations-v2-retry-state.mjs'
      - '.github/workflows/temp-operations-v2-retry-state.yml'

permissions:
  contents: write

jobs:
  update:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Update Operations v2 retry-state contracts
        run: node scripts/update-operations-v2-retry-state.mjs
      - name: Commit retry-state updates
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/timetable/operations-v2.mjs \
            data/static/calendar-operations-v2.schema.json \
            data/fixtures/calendar-operations-v2-fixtures-v1.json \
            scripts/check-calendar-operations-v2.mjs \
            docs/calendar/operations-v2.md
          git commit -m "[CF-Pages-Skip] Add retry attempt and backoff state to Operations v2"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
