name: Temporary Japan actual regression ranks

on:
  push:
    branches:
      - proof/japan-actual-regression-ranks-20260905

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Inspect live NAR RaceList markup
        run: |
          node --input-type=module <<'NODE'
          const targets = [
            ['kochi-0905', 'https://www.keiba.go.jp/KeibaWeb/TodayRaceInfo/RaceList?k_babaCode=31&k_raceDate=2026%2F09%2F05'],
            ['saga-0905', 'https://www.keiba.go.jp/KeibaWeb/TodayRaceInfo/RaceList?k_babaCode=32&k_raceDate=2026%2F09%2F05'],
          ];
          for (const [name, url] of targets) {
            const response = await fetch(url, { headers: { 'user-agent': 'Mozilla/5.0 (compatible; WhereHorsesRun/1.0)', 'accept-language': 'ja,en;q=.7' } });
            if (!response.ok) throw new Error(`${name}: HTTP ${response.status}`);
            const bytes = await response.arrayBuffer();
            const candidates = ['shift_jis', 'utf-8'].map((encoding) => ({ encoding, text: new TextDecoder(encoding).decode(bytes) }));
            candidates.sort((a,b) => (b.text.match(/[競馬発走]/g)?.length ?? 0) - (a.text.match(/[競馬発走]/g)?.length ?? 0));
            const html = candidates[0].text;
            console.log(`PAGE=${name} encoding=${candidates[0].encoding} bytes=${bytes.byteLength}`);
            const rows = [...html.matchAll(/<tr\b[^>]*>[\s\S]*?<\/tr>/gi)].map((m) => m[0]);
            for (const raceNo of [1, 2]) {
              const row = rows.find((value) => new RegExp(`[?&](?:amp;)?k_raceNo=${raceNo}(?:&|&amp;|["'])`, 'i').test(value));
              console.log(`RAW_ROW_${name}_R${raceNo}=` + (row ?? 'NOT_FOUND'));
            }
          }
          NODE
