name: Temporary Japan actual regression ranks

on:
  push:
    branches:
      - proof/japan-actual-regression-ranks-20260905

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Inspect live target adapter rows
        run: |
          node --input-type=module <<'NODE'
          import { japanOfficial30dAdapters } from './scripts/timetable/japan-official-30d-adapters.mjs';

          const targets = [
            ['nar-standard', 'nar-kochi-racecourse-2026-09-05', ['2026-09-05']],
            ['nar-standard', 'nar-kochi-racecourse-2026-09-06', ['2026-09-06']],
            ['nar-standard', 'nar-saga-racecourse-2026-09-05', ['2026-09-05']],
            ['banei', 'banei-obihiro-racecourse-2026-09-07', ['2026-09-07']],
          ];

          for (const [group, meetingId, dates] of targets) {
            const adapter = japanOfficial30dAdapters[group];
            const start = dates[0];
            const end = new Date(`${dates.at(-1)}T00:00:00Z`);
            end.setUTCDate(end.getUTCDate() + 1);
            const discovered = await adapter.discover({ start, end_exclusive: end.toISOString().slice(0, 10), dates });
            const meeting = discovered.find((row) => row.meeting_id === meetingId);
            if (!meeting) throw new Error(`target not discovered: ${meetingId}`);
            const inspected = await adapter.inspect(meeting, { attempt: 1 });
            console.log('TARGET_INSPECT=' + JSON.stringify({ meetingId, discovered: meeting, inspected }, null, 2));
          }
          NODE
