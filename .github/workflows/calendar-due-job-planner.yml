name: Calendar Due-job Planner

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'data/static/calendar-due-job-policy-v1.json'
      - 'data/static/calendar-due-job-plan.schema.json'
      - 'data/fixtures/calendar-due-job-planner-fixtures-v1.json'
      - 'data/fixtures/calendar-due-job-planner-invalid-cases-v1.json'
      - 'data/static/calendar-acquisition-registry.json'
      - 'scripts/timetable/due-job-planner.mjs'
      - 'scripts/timetable/plan-calendar-due-jobs.mjs'
      - 'scripts/check-calendar-due-job-planner.mjs'
      - 'scripts/check-calendar-collection-job.mjs'
      - 'scripts/check-calendar-collection-plan.mjs'
      - 'scripts/check-calendar-rank-aware-retry-queue.mjs'
      - 'scripts/check-calendar-acquisition-registry.mjs'
      - 'scripts/check-project-governance-docs.mjs'
      - 'docs/calendar/due-job-planner.md'
      - 'docs/calendar/acquisition-control-plane-implementation-plan.md'
      - 'docs/calendar/implementation-roadmap.md'
      - 'docs/project-roadmap.md'
      - 'docs/calendar/README.md'
      - 'docs/calendar/machine-readable-contracts.md'
      - 'START-HERE.md'
      - '.github/workflows/calendar-due-job-planner.yml'
  push:
    branches:
      - main
    paths:
      - 'data/static/calendar-due-job-policy-v1.json'
      - 'data/static/calendar-due-job-plan.schema.json'
      - 'data/fixtures/calendar-due-job-planner-fixtures-v1.json'
      - 'data/fixtures/calendar-due-job-planner-invalid-cases-v1.json'
      - 'scripts/timetable/due-job-planner.mjs'
      - 'scripts/timetable/plan-calendar-due-jobs.mjs'
      - 'scripts/check-calendar-due-job-planner.mjs'
      - 'docs/calendar/due-job-planner.md'
      - 'docs/calendar/acquisition-control-plane-implementation-plan.md'
      - 'docs/calendar/implementation-roadmap.md'
      - 'docs/project-roadmap.md'
      - 'docs/calendar/README.md'
      - 'docs/calendar/machine-readable-contracts.md'
      - 'START-HERE.md'
      - '.github/workflows/calendar-due-job-planner.yml'

permissions:
  contents: read

concurrency:
  group: calendar-due-job-planner-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Check Node syntax
        run: |
          node --check scripts/timetable/due-job-planner.mjs
          node --check scripts/timetable/plan-calendar-due-jobs.mjs
          node --check scripts/check-calendar-due-job-planner.mjs

      - name: Validate Due-job Planner contract and fixtures
        run: node scripts/check-calendar-due-job-planner.mjs

      - name: Validate Collection Job, Plan, Retry Queue, and Registry dependencies
        run: |
          node scripts/check-calendar-collection-job.mjs
          node scripts/check-calendar-collection-plan.mjs
          node scripts/check-calendar-rank-aware-retry-queue.mjs
          node scripts/check-calendar-acquisition-registry.mjs

      - name: Validate Calendar contracts and governance
        run: |
          node scripts/check-calendar-contracts.mjs
          node scripts/check-project-governance-docs.mjs

      - name: Validate runtime import boundary
        run: node scripts/check-calendar-runtime-import-boundary.mjs

      - name: Check diff formatting
        run: git diff --check

  plan:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Validate planner before scheduled planning
        run: node scripts/check-calendar-due-job-planner.mjs

      - name: Plan explicit due Collection Jobs
        run: |
          node scripts/timetable/plan-calendar-due-jobs.mjs \
            --fixture=data/fixtures/calendar-due-job-planner-fixtures-v1.json \
            --output=.calendar-due-job-plan.json
          grep -q '"artifact_only": true' .calendar-due-job-plan.json
          grep -q '"jobs_executed": false' .calendar-due-job-plan.json

      - name: Upload due-job planning artifact
        uses: actions/upload-artifact@v4
        with:
          name: calendar-due-job-plan
          path: .calendar-due-job-plan.json
          retention-days: 14
