name: Calendar HKJC Entries programme live proof

on:
  push:
    branches:
      - fix/hkjc-entries-programme-layer-20260902

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hkjc-entries-programme-layer-20260902
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Fetch official HKJC Entries for 2026-09-06 Sha Tin
        run: node scripts/timetable/fetch-hkjc-entries-programme.mjs --date=2026-09-06 --racecourse=ST --output=/tmp/hkjc-entries-2026-09-06-st.json
      - name: Validate programme-only extraction without invented times or race numbers
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const data = JSON.parse(fs.readFileSync('/tmp/hkjc-entries-2026-09-06-st.json', 'utf8'));
          if (data.programme_rows.length !== 10) throw new Error(`expected 10 programme rows, got ${data.programme_rows.length}`);
          for (const row of data.programme_rows) {
            if (!row.race_name || !Number.isInteger(row.distance_m) || !row.surface || !row.course_label) throw new Error(`incomplete programme row: ${JSON.stringify(row)}`);
            if (row.post_time_local !== null) throw new Error('Entries layer must not invent post time');
            if (row.race_number !== null) throw new Error('Entries layer must not invent race number');
          }
          const distances = data.programme_rows.map((row) => row.distance_m).join(',');
          console.log(`HKJC_ENTRIES_PROGRAMME_PROOF: rows=10 distances=${distances}`);
          NODE
      - name: Upload public-safe proof
        uses: actions/upload-artifact@v4
        with:
          name: hkjc-entries-programme-live-proof-${{ github.run_id }}
          path: /tmp/hkjc-entries-2026-09-06-st.json
