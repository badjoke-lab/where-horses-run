name: Temporary map cluster visual hierarchy patch

on:
  push:
    branches:
      - fix/map-cluster-visual-hierarchy-20260909-v2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/map-cluster-visual-hierarchy-20260909-v2
          fetch-depth: 0
          persist-credentials: true
      - name: Apply patch
        run: python scripts/tmp-map-cluster-visual-patch.py
      - name: Commit patch and remove temporary files
        run: |
          rm .github/workflows/tmp-map-cluster-visual-hierarchy.yml
          rm scripts/tmp-map-cluster-visual-patch.py
          git config user.name "badjoke-lab"
          git config user.email "badjoke.lab@gmail.com"
          git add src/components/RacecourseMap.astro scripts/check-calendar-presentation-color-map.mjs .github/workflows/tmp-map-cluster-visual-hierarchy.yml scripts/tmp-map-cluster-visual-patch.py
          git commit -m "fix: refine map cluster visual hierarchy"
          git push origin HEAD:fix/map-cluster-visual-hierarchy-20260909-v2
