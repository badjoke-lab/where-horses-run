name: M5 scheduled candidate run log

on:
  pull_request:
    paths:
      - 'scripts/timetable/scheduled-candidate-run-log.mjs'
      - 'scripts/check-m5-scheduled-candidate-run-log.mjs'
      - 'docs/runbooks/m5-scheduled-candidate-generation-design.md'
      - '.github/workflows/m5-scheduled-candidate-run-log.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/timetable/scheduled-candidate-run-log.mjs'
      - 'scripts/check-m5-scheduled-candidate-run-log.mjs'
      - 'docs/runbooks/m5-scheduled-candidate-generation-design.md'
      - '.github/workflows/m5-scheduled-candidate-run-log.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m5-scheduled-candidate-run-log-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - run: node scripts/check-m5-scheduled-candidate-run-log.mjs
      - run: git diff --exit-code
