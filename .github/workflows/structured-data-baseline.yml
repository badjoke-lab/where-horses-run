name: Structured data baseline gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'data/audits/structured-data-baseline-v1.json'
      - 'data/static/structured-data-baseline-contract-v1.json'
      - 'docs/seo/structured-data-baseline.md'
      - 'scripts/check-structured-data-baseline.mjs'
      - 'src/components/StructuredDataBaseline.astro'
      - 'src/layouts/BaseLayout.astro'
      - '.github/workflows/structured-data-baseline.yml'
      - '.github/workflows/temporary-structured-data-baseline-discovery.yml'
  push:
    branches:
      - main
    paths:
      - 'data/audits/structured-data-baseline-v1.json'
      - 'data/static/structured-data-baseline-contract-v1.json'
      - 'docs/seo/structured-data-baseline.md'
      - 'scripts/check-structured-data-baseline.mjs'
      - 'src/components/StructuredDataBaseline.astro'
      - 'src/layouts/BaseLayout.astro'
      - '.github/workflows/structured-data-baseline.yml'
      - '.github/workflows/temporary-structured-data-baseline-discovery.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install dependencies without generating a lockfile
        run: npm install --package-lock=false
      - name: Build complete static site
        run: npm run build
      - name: Preserve Phase 10 UX release contract
        run: node scripts/check-ux-polish-release.mjs
      - name: Preserve sitemap and robots contract
        run: node scripts/check-sitemap-robots.mjs
      - name: Validate structured data baseline
        run: node scripts/check-structured-data-baseline.mjs
      - name: Prove repository clean
        run: |
          changes="$(git status --porcelain --untracked-files=all)"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            exit 1
          fi
