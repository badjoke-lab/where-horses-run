name: Trinidad Arima official Calendar refresh

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Refresh scope
        required: true
        default: near
        type: choice
        options:
          - near
          - full
  schedule:
    - cron: '37 4 * * *'
    - cron: '7 5 * * 1'
  pull_request:
    paths:
      - '.github/workflows/calendar-trinidad-arima-official-refresh.yml'
      - '.github/workflows/calendar-unified-official-refresh.yml'
      - '.github/workflows/calendar-near-official-refresh.yml'
      - 'scripts/timetable/trinidad-arima-calendar-core.mjs'
      - 'scripts/timetable/run-trinidad-arima-official-window.mjs'
      - 'scripts/check-trinidad-arima-adapter.mjs'
      - 'scripts/timetable/rebuild-unified-non-japan-on-main.sh'
      - 'scripts/timetable/build-refresh-audit-summary.mjs'
      - 'data/static/authority-source-inventory.json'
      - 'data/static/calendar-acquisition-registry.json'
      - 'data/static/calendar-readiness-registry.json'
      - 'data/static/calendar-public-country-support-v1.json'
      - 'data/static/calendar-non-running-evidence-registry-v1.json'
      - 'data/static/calendar-98-tier-execution-coverage.json'
      - 'data/static/racecourses.json'
      - 'data/static/racecourse-locations-v1.json'
      - 'data/static/racecourse-location-supplement-evidence-v1.json'
      - 'package.json'

permissions:
  contents: write

concurrency:
  group: trinidad-arima-official-calendar-refresh
  cancel-in-progress: false

jobs:
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm run validate:trinidad-arima
      - name: Inspect extracted Trinidad fixture text
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {getDocument} from 'pdfjs-dist/legacy/build/pdf.mjs';
          const url='https://arimaraceclub.com/wp-content/uploads/2026/04/Race-Book-Day-04.pdf';
          const r=await fetch(url,{headers:{'user-agent':'Mozilla/5.0 (compatible; WhereHorsesRun/1.0; +https://whr.badjoke-lab.com/)'}});
          if(!r.ok) throw new Error('HTTP '+r.status);
          const bytes=new Uint8Array(await r.arrayBuffer());
          const pdf=await getDocument({data:bytes,disableWorker:true}).promise;
          let text='';
          for(let n=1;n<=pdf.numPages;n++){
            const page=await pdf.getPage(n);
            const content=await page.getTextContent();
            text+='\n'+content.items.map(x=>x.str).join(' ');
          }
          const normalized=text.replace(/\s+/g,' ').trim();
          for(const needle of ['FIXTURE','RACING','ARIMA RACE CLUB','OCTOBER','NOVEMBER','DECEMBER','2026']){
            const i=normalized.toUpperCase().indexOf(needle);
            if(i>=0) console.log('TRINIDAD_TEXT',needle,normalized.slice(Math.max(0,i-700),i+2600));
          }
          NODE

      - name: Exercise Trinidad production path
        run: |
          mkdir -p .calendar-trinidad
          node scripts/timetable/run-trinidad-arima-official-window.mjs --days=90 --output=.calendar-trinidad/trinidad.json
          node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync('.calendar-trinidad/trinidad.json','utf8'));if(a.acquisition_attempt?.status!=='success'||(a.diagnostics?.source_errors?.length??0)!==0||(a.diagnostics?.parse_failures?.length??0)!==0||(a.records?.length??0)<1){console.error(JSON.stringify({attempt:a.acquisition_attempt,discovery:a.discovery,diagnostics:a.diagnostics,records:a.records?.length??0}));process.exit(1)}"
          node scripts/timetable/apply-official-rolling-observations.mjs --artifact=.calendar-trinidad/trinidad.json --country-id=trinidad-and-tobago --authority-id=arima-race-club --racing-system-id=trinidad-and-tobago-reviewed-system --timezone=America/Port_of_Spain
          node scripts/check-calendar-public-country-support.mjs
          node scripts/check-calendar-public-map-parity.mjs
          node scripts/check-calendar-non-running-evidence-registry.mjs
          node scripts/check-calendar-unified-audit-coverage.mjs

  refresh:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --no-audit --no-fund
      - id: scope
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            scope="${{ inputs.scope }}"
          elif [ "${{ github.event.schedule }}" = "7 5 * * 1" ]; then
            scope=full
          else
            scope=near
          fi
          if [ "$scope" = full ]; then days=90; else days=30; fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "days=$days" >> "$GITHUB_OUTPUT"
      - name: Collect and apply Trinidad and Tobago
        run: |
          mkdir -p .calendar-trinidad
          node scripts/timetable/run-trinidad-arima-official-window.mjs --days="${{ steps.scope.outputs.days }}" --output=.calendar-trinidad/trinidad.json
          node scripts/timetable/apply-official-rolling-observations.mjs --artifact=.calendar-trinidad/trinidad.json --country-id=trinidad-and-tobago --authority-id=arima-race-club --racing-system-id=trinidad-and-tobago-reviewed-system --timezone=America/Port_of_Spain
          node scripts/timetable/apply-reviewed-calendar-observations.mjs
          node scripts/check-calendar-public-country-support.mjs
          node scripts/check-calendar-public-map-parity.mjs
          node scripts/check-calendar-non-running-evidence-registry.mjs
      - name: Persist generated Trinidad and Tobago timetable
        shell: bash
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD)" ]; then
            echo "main advanced; refusing overwrite"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated/timetable/canonical/meetings.json data/generated/timetable/canonical/meeting-details.json data/generated/timetable/public/meeting-list.json data/generated/timetable/public/meeting-details.json
          if git diff --cached --quiet; then
            echo "No Trinidad and Tobago timetable changes"
            exit 0
          fi
          git commit -m "data: refresh Trinidad and Tobago Arima timetable (${{ steps.scope.outputs.scope }})"
          git push origin HEAD:main
