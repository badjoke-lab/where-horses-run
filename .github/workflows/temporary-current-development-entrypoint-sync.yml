name: Temporary current development entrypoint sync

on:
  push:
    branches:
      - work/current-development-entrypoint-sync

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/current-development-entrypoint-sync
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Synchronize current development entrypoints
        run: node scripts/temporary-sync-current-development-entrypoints.mjs
      - name: Commit synchronized documentation when needed
        run: |
          if git diff --quiet; then
            echo "No documentation changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md START-HERE.md docs/calendar/implementation-roadmap.md
          git commit -m "[CF-Pages-Skip] Sync current development entrypoints"
          git push origin HEAD:work/current-development-entrypoint-sync
