name: Calendar unified near proof

on:
  push:
    branches:
      - proof/calendar-unified-near

permissions:
  contents: write

concurrency:
  group: calendar-unified-near-proof
  cancel-in-progress: false

jobs:
  near-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Validate production refresh syntax
        run: |
          node --check scripts/timetable/apply-official-rolling-observations.mjs
          node --check scripts/timetable/enforce-reviewed-calendar-exclusions.mjs
          node --check scripts/timetable/run-japan-zero-based-30d.mjs
          node --check scripts/timetable/run-hkjc-official-window.mjs
          node --check scripts/timetable/run-uae-era-official-window.mjs
          node --check scripts/timetable/run-kra-official-window.mjs
          node --check scripts/timetable/run-tjk-current-best-available.mjs
      - name: Refresh Japan official near window
        run: |
          node scripts/timetable/run-japan-zero-based-30d.mjs \
            --execution-date="$(TZ=Asia/Tokyo date +%F)" \
            --scope=near
      - name: Collect non-Japan official near window
        run: |
          mkdir -p .calendar-unified
          node scripts/timetable/run-hkjc-official-window.mjs --days=3 --output=.calendar-unified/hkjc.json
          node scripts/timetable/run-uae-era-official-window.mjs --days=3 --output=.calendar-unified/uae.json
          node scripts/timetable/run-kra-official-window.mjs --days=3 --output=.calendar-unified/kra.json
          node scripts/timetable/run-tjk-current-best-available.mjs --days=3 --output=.calendar-unified/tjk.json
      - name: Enforce reviewed Calendar exclusions
        run: |
          node scripts/timetable/enforce-reviewed-calendar-exclusions.mjs \
            --artifact=.calendar-unified/hkjc.json \
            --artifact=.calendar-unified/uae.json \
            --artifact=.calendar-unified/kra.json \
            --artifact=.calendar-unified/tjk.json
      - name: Apply non-Japan official observations monotonically
        run: |
          node scripts/timetable/apply-official-rolling-observations.mjs --artifact=.calendar-unified/hkjc.json --country-id=hong-kong --authority-id=hkjc --racing-system-id=hong-kong-hkjc-system --timezone=Asia/Hong_Kong
          node scripts/timetable/apply-official-rolling-observations.mjs --artifact=.calendar-unified/uae.json --country-id=united-arab-emirates --authority-id=emirates-racing-authority --racing-system-id=uae-national-racing-system --timezone=Asia/Dubai
          node scripts/timetable/apply-official-rolling-observations.mjs --artifact=.calendar-unified/kra.json --country-id=south-korea --authority-id=korea-racing-authority --racing-system-id=kra-national-racing-system --timezone=Asia/Seoul
          node scripts/timetable/apply-official-rolling-observations.mjs --artifact=.calendar-unified/tjk.json --country-id=turkey --authority-id=turkiye-jokey-kulubu --racing-system-id=tjk-national-racing-system --timezone=Europe/Istanbul
      - name: Validate generated public site state
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run build
      - name: Publish only verified near data diff to main
        shell: bash
        run: |
          git diff --binary -- \
            data/generated/timetable/canonical/meetings.json \
            data/generated/timetable/canonical/meeting-details.json \
            data/generated/timetable/public/meeting-list.json \
            data/generated/timetable/public/meeting-details.json \
            data/generated/timetable/japan-zero-based-3d-reconciliation.json \
            > /tmp/calendar-near-proof.patch
          if [[ ! -s /tmp/calendar-near-proof.patch ]]; then
            echo "No verified near-window change to persist."
            exit 0
          fi
          git fetch origin main
          git checkout -B calendar-near-proof-publish origin/main
          git apply /tmp/calendar-near-proof.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/generated/timetable/canonical/meetings.json \
            data/generated/timetable/canonical/meeting-details.json \
            data/generated/timetable/public/meeting-list.json \
            data/generated/timetable/public/meeting-details.json
          git add data/generated/timetable/japan-zero-based-3d-reconciliation.json 2>/dev/null || true
          git commit -m "data: prove unified official near refresh"
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calendar-unified-near-proof-${{ github.run_id }}
          include-hidden-files: true
          retention-days: 7
          path: |
            .calendar-unified/
            data/generated/timetable/japan-zero-based-3d-reconciliation.json
