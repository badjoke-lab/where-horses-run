name: Mauritius MTC official Calendar refresh

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Refresh scope
        required: true
        default: near
        type: choice
        options:
          - near
          - full
  schedule:
    - cron: '7 4 * * *'
    - cron: '37 4 * * 1'
  pull_request:
    paths:
      - '.github/workflows/calendar-mauritius-mtc-official-refresh.yml'
      - 'scripts/timetable/mauritius-mtc-calendar-core.mjs'
      - 'scripts/timetable/run-mauritius-mtc-official-window.mjs'
      - 'scripts/check-mauritius-mtc-adapter.mjs'
      - 'data/static/calendar-acquisition-registry.json'
      - 'data/static/calendar-readiness-registry.json'
      - 'data/static/calendar-public-country-support-v1.json'
      - 'data/static/calendar-non-running-evidence-registry-v1.json'
      - 'data/static/racecourses.json'
      - 'data/static/racecourse-locations-v1.json'

permissions:
  contents: write

concurrency:
  group: mauritius-mtc-official-calendar-refresh
  cancel-in-progress: false

jobs:
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm run validate:mauritius-mtc
      - name: Exercise Mauritius 30-day production path
        run: |
          mkdir -p .calendar-mauritius
          node scripts/timetable/run-mauritius-mtc-official-window.mjs --as-of=2026-10-01 --days=30 --output=.calendar-mauritius/mtc.json
          node scripts/timetable/apply-official-rolling-observations.mjs --artifact=.calendar-mauritius/mtc.json --country-id=mauritius --authority-id=mtc-jockey-club --racing-system-id=mauritius-champ-de-mars-system --timezone=Indian/Mauritius
          node scripts/check-calendar-public-country-support.mjs
          node scripts/check-calendar-public-map-parity.mjs
          node scripts/check-calendar-non-running-evidence-registry.mjs

  refresh:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --no-audit --no-fund
      - id: scope
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            scope="${{ inputs.scope }}"
          elif [ "${{ github.event.schedule }}" = "37 4 * * 1" ]; then
            scope=full
          else
            scope=near
          fi
          if [ "$scope" = full ]; then days=30; else days=3; fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "days=$days" >> "$GITHUB_OUTPUT"
      - name: Collect and apply Mauritius MTC
        run: |
          mkdir -p .calendar-mauritius
          node scripts/timetable/run-mauritius-mtc-official-window.mjs --days="${{ steps.scope.outputs.days }}" --output=.calendar-mauritius/mtc.json
          node scripts/timetable/apply-official-rolling-observations.mjs --artifact=.calendar-mauritius/mtc.json --country-id=mauritius --authority-id=mtc-jockey-club --racing-system-id=mauritius-champ-de-mars-system --timezone=Indian/Mauritius
          node scripts/timetable/apply-reviewed-calendar-observations.mjs
          node scripts/check-calendar-public-country-support.mjs
          node scripts/check-calendar-public-map-parity.mjs
          node scripts/check-calendar-non-running-evidence-registry.mjs
      - name: Persist generated Mauritius timetable
        shell: bash
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD)" ]; then
            echo "main advanced; refusing overwrite"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated/timetable/canonical/meetings.json data/generated/timetable/canonical/meeting-details.json data/generated/timetable/public/meeting-list.json data/generated/timetable/public/meeting-details.json
          if git diff --cached --quiet; then
            echo "No Mauritius timetable changes"
            exit 0
          fi
          git commit -m "data: refresh Mauritius MTC timetable (${{ steps.scope.outputs.scope }})"
          git push origin HEAD:main
