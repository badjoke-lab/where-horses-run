name: Chile unified workflow staging once

on:
  push:
    branches:
      - feat/calendar-chile-official-20260910-v2
    paths:
      - '.github/workflows/chile-integration-once.yml'

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/calendar-chile-official-20260910-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Build and validate Chile unified workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/calendar-unified-official-refresh.yml')
          lines = p.read_text().splitlines()
          out=[]; collectors=0; exclusions=0; applies=0; in_exclusion=False; i=0; slash=chr(92)
          while i < len(lines):
              line=lines[i]; stripped=line.strip()
              if 'run-sorec-official-window.mjs' in line:
                  assert i+2 < len(lines) and '--days=' in lines[i+1] and '--output=.calendar-unified/sorec.json' in lines[i+2]
                  out.extend([line,lines[i+1],lines[i+2]])
                  ci=line[:len(line)-len(line.lstrip())]; oi=lines[i+2][:len(lines[i+2])-len(lines[i+2].lstrip())]
                  out.extend([f'{ci}node scripts/timetable/run-chile-teletrak-official-window.mjs {slash}',lines[i+1],f'{oi}--output=.calendar-unified/chile.json'])
                  collectors += 1; i += 3; continue
              if 'enforce-reviewed-calendar-exclusions.mjs' in line: in_exclusion=True
              elif stripped.startswith('node scripts/') and 'enforce-reviewed-calendar-exclusions.mjs' not in line: in_exclusion=False
              if in_exclusion and stripped == '--artifact=.calendar-unified/sorec.json':
                  indent=line[:len(line)-len(line.lstrip())]
                  out.extend([f'{line} {slash}',f'{indent}--artifact=.calendar-unified/chile.json'])
                  exclusions += 1; in_exclusion=False; i += 1; continue
              out.append(line)
              if stripped == '--timezone=Africa/Casablanca':
                  indent=line[:len(line)-len(line.lstrip())]; ci=indent[:-2] if len(indent)>=2 else indent
                  out.extend([f'{ci}node scripts/timetable/apply-official-rolling-observations.mjs {slash}',f'{indent}--artifact=.calendar-unified/chile.json {slash}',f'{indent}--country-id=chile {slash}',f'{indent}--authority-id=teletrak-chile {slash}',f'{indent}--racing-system-id=chile-teletrak-racing-system {slash}',f'{indent}--timezone=America/Santiago'])
                  applies += 1
              i += 1
          assert (collectors,exclusions,applies)==(2,2,2),(collectors,exclusions,applies)
          p.write_text('\n'.join(out)+'\n')
          PY
          node scripts/check-chile-teletrak-weekly-adapter.mjs
          node scripts/check-calendar-refresh-publication-boundaries.mjs
          npm install --no-package-lock --no-audit --no-fund
          npm run build
          git diff --check
          mkdir -p data/tmp
          cp .github/workflows/calendar-unified-official-refresh.yml data/tmp/chile-unified-official-refresh.yml
          git checkout -- .github/workflows/calendar-unified-official-refresh.yml
      - name: Commit validated staged workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tmp/chile-unified-official-refresh.yml
          git commit -m "ci: stage validated Chile unified workflow"
          git push origin HEAD:feat/calendar-chile-official-20260910-v2
