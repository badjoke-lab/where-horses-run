name: Chile racecourse identity commit once

on:
  push:
    branches:
      - feat/calendar-chile-official-20260910-v2
    paths:
      - '.github/workflows/chile-integration-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/calendar-chile-official-20260910-v2
          fetch-depth: 0
      - name: Add Chile racecourse identities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          racecourse_path = Path('data/static/country-page-racecourses-01-04.json')
          rows = json.loads(racecourse_path.read_text())
          existing_ids = {row.get('id') for row in rows}
          common = {
            'timezone': 'America/Santiago',
            'racing_types': ['thoroughbred-flat'],
            'status': 'active',
            'surfaces': [],
            'direction': None,
            'course_profile': {
              'turf_circumference_m': None,
              'dirt_circumference_m': None,
              'home_straight_m': None,
              'has_inner_outer_courses': None,
              'has_lighting': None,
              'elevation_notes_en': None,
              'elevation_notes_ja': None,
              'course_notes_en': 'Teletrak identifies this venue in Chile’s official weekly domestic racing view. Detailed course metrics remain unverified.',
              'course_notes_ja': 'Teletrakのチリ国内公式週間開催表示で確認できる競馬場。詳細なコース指標は未確認。'
            },
            'distance_profile': {
              'turf': {'min_m': None, 'max_m': None, 'known_distances_m': []},
              'dirt': {'min_m': None, 'max_m': None, 'known_distances_m': []},
              'all_weather': {'min_m': None, 'max_m': None, 'known_distances_m': []},
              'jump': {'min_m': None, 'max_m': None, 'known_distances_m': []},
              'harness': {'min_m': None, 'max_m': None, 'known_distances_m': []},
              'upcoming_conditions': []
            },
            'schedule_summary': {
              'today_status': 'unknown',
              'next_meeting_date': None,
              'upcoming_meetings': [],
              'status': 'official-source-verified',
              'last_checked': '2026-09-10'
            },
            'notable_races': [],
            'seasonality': {
              'summary_en': 'Use Teletrak’s official weekly view for current meeting identity.',
              'summary_ja': '現行の開催競馬場はTeletrak公式週間表示で確認する。',
              'status': 'partial'
            },
            'official_links': [{
              'label_en': 'Teletrak Chile weekly racing',
              'label_ja': 'Teletrak Chile 週間開催',
              'source_id': 'chile-teletrak-weekly-programme',
              'url': 'https://teletrak.cl/',
              'link_type': 'official'
            }],
            'related_terms': ['racecourse', 'meeting', 'fixture'],
            'related_sources': ['chile-teletrak-weekly-programme'],
            'data_status': {
              'course_profile': 'unverified',
              'schedule': 'official-source-verified',
              'source_status': 'verified',
              'last_checked': '2026-09-10'
            },
            'image_status': 'planned',
            'image_path': None,
            'course_diagram_status': 'pending'
          }
          venues = [
            ('club-hipico-de-santiago-racecourse', 'Club Hípico de Santiago', 'サンティアゴ競馬場', 'Club Hípico de Santiago', 'Santiago', 'Santiago Metropolitan Region'),
            ('hipodromo-chile-racecourse', 'Hipódromo Chile', 'イポドロモ・チレ', 'Hipódromo Chile', 'Santiago', 'Santiago Metropolitan Region'),
            ('valparaiso-sporting-club-racecourse', 'Valparaíso Sporting Club', 'バルパライソ・スポーティングクラブ', 'Valparaíso Sporting Club', 'Viña del Mar', 'Valparaíso Region'),
            ('club-hipico-de-concepcion-racecourse', 'Club Hípico de Concepción', 'コンセプシオン競馬場', 'Club Hípico de Concepción', 'Concepción', 'Biobío Region'),
          ]
          added = 0
          for rid, en, ja, local, city, region in venues:
              if rid in existing_ids:
                  continue
              row = {
                'id': rid,
                'slug': rid,
                'country_id': 'chile',
                'name_en': en,
                'name_ja': ja,
                'name_local': local,
                'city': city,
                'region': region,
                **common
              }
              row['image_alt_en'] = f'Planned illustrative image for {en}.'
              row['image_alt_ja'] = f'{ja}の説明用イメージ画像予定地。'
              row['image'] = {
                'src': '',
                'alt_en': row['image_alt_en'],
                'alt_ja': row['image_alt_ja'],
                'image_type': 'placeholder',
                'is_official_photo': False,
                'note_en': 'Illustrative image. Not an official venue photo.',
                'note_ja': '説明用のイメージ画像です。公式写真ではありません。',
                'status': 'planned'
              }
              rows.append(row)
              added += 1
          racecourse_path.write_text(json.dumps(rows, ensure_ascii=False, separators=(',', ':')) + '\n')
          print(f'CHILE_RACECOURSES_ADDED={added}')
          assert sum(1 for row in rows if row.get('country_id') == 'chile' and row.get('id') in {v[0] for v in venues}) == 4
          PY
          node scripts/check-chile-teletrak-weekly-adapter.mjs || true
          git diff --check
      - name: Commit Chile racecourse identities
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/static/country-page-racecourses-01-04.json; then
            echo 'Chile racecourse identities already present'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/static/country-page-racecourses-01-04.json
          git commit -m "data: add Chile racecourse identities"
          git push origin HEAD:feat/calendar-chile-official-20260910-v2
