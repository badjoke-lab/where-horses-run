name: Norway DNT live probe

on:
  pull_request:
    paths:
      - '.github/workflows/calendar-norway-dnt-live-probe.yml'
      - 'scripts/timetable/norway-dnt-core.mjs'
      - 'scripts/timetable/run-norway-dnt-official-window.mjs'
      - 'scripts/check-norway-dnt-adapter.mjs'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Validate Norway DNT adapter
        run: npm run validate:norway-dnt
      - name: Probe live DNT 30-day window
        run: |
          mkdir -p .calendar-norway-probe
          node scripts/timetable/run-norway-dnt-official-window.mjs \
            --as-of=2026-09-28 \
            --days=30 \
            --output=.calendar-norway-probe/dnt.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const data=JSON.parse(fs.readFileSync('.calendar-norway-probe/dnt.json','utf8'));
          console.log(JSON.stringify({records:data.records.length,dates:data.records.map(r=>r.date),venues:[...new Set(data.records.map(r=>r.racecourse_id))],diagnostics:data.diagnostics,discovery:data.discovery}));
          if(data.diagnostics.source_errors.length||data.diagnostics.parse_failures.length||data.diagnostics.unknown_venues.length) process.exitCode=1;
          if(data.discovery.source_visible_rows===0||data.records.length===0) process.exitCode=1;
          if(data.records.some(r=>r.capability_rank!=='C'||r.first_race_time_local!==null||r.last_race_time_local!==null)) process.exitCode=1;
          NODE
