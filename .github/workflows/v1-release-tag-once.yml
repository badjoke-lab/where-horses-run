name: one-shot WHR v1 release tag

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/v1-release-tag-once.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-shot-whr-v1-release-tag
  cancel-in-progress: false

jobs:
  create-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_TAG: v1.0.0
      RELEASE_COMMIT: 6d45895fb04ccbc3160e763c54438a4d51dff905
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release target
        run: |
          set -euo pipefail
          git cat-file -e "${RELEASE_COMMIT}^{commit}"
          git merge-base --is-ancestor "${RELEASE_COMMIT}" origin/main
      - name: Create or verify annotated release tag
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            existing="$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")"
            if [ "$existing" != "$RELEASE_COMMIT" ]; then
              echo "${RELEASE_TAG} already points to ${existing}, expected ${RELEASE_COMMIT}" >&2
              exit 1
            fi
            echo "${RELEASE_TAG} already points to the accepted release commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$RELEASE_COMMIT" -m "Where Horses Run v1.0.0 — reviewed static public release"
          git push origin "refs/tags/${RELEASE_TAG}"
      - name: Verify remote tag target
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          actual="$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")"
          test "$actual" = "$RELEASE_COMMIT"
          printf 'RELEASE_TAG=%s\nRELEASE_COMMIT=%s\n' "$RELEASE_TAG" "$actual"
