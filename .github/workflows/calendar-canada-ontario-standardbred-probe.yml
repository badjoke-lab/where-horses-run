name: Canada Ontario Standardbred Calendar probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/calendar-canada-ontario-standardbred-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Probe reviewed Canada official routes
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (compatible; WhereHorsesRun/1.0; +https://github.com/badjoke-lab/where-horses-run)'
          mkdir -p /tmp/canada
          for item in \
            'ontario|https://ontarioracing.com/news-and-results/top-racing-headlines/agco-and-olg-approve-race-dates-for-four-ontario-t' \
            'standardbred|https://standardbredcanada.ca/racing'; do
            name="${item%%|*}"
            url="${item#*|}"
            out="/tmp/canada/$name.out"
            code="$(curl -L -sS -A "$UA" --connect-timeout 12 --max-time 40 -o "$out" -w '%{http_code}' "$url" || true)"
            final="$(curl -L -sS -A "$UA" --connect-timeout 12 --max-time 40 -o /dev/null -w '%{url_effective}' "$url" || true)"
            echo "CANADA_PAGE name=$name HTTP=$code BYTES=$(wc -c < "$out" 2>/dev/null || echo 0) FINAL=$final"
          done

      - name: Inspect Ontario Racing date evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - /tmp/canada/ontario.out <<'PY'
          import html,re,sys
          raw=open(sys.argv[1],errors='replace').read()
          text=re.sub(r'<script\b[^>]*>.*?</script>',' ',raw,flags=re.I|re.S)
          text=re.sub(r'<style\b[^>]*>.*?</style>',' ',text,flags=re.I|re.S)
          text=html.unescape(re.sub(r'<[^>]+>',' ',text))
          text=re.sub(r'\s+',' ',text).strip()
          print('ONTARIO_TEXT_LEN',len(text))
          for needle in ['2026','Woodbine','Mohawk','Fort Erie','Ajax','race dates','approved']:
              p=text.lower().find(needle.lower())
              if p>=0:
                  print('ONTARIO_TEXT',needle,text[max(0,p-600):p+8000])
          pats=[
            r'\b(20\d{2})[/-](\d{1,2})[/-](\d{1,2})\b',
            r'\b(\d{1,2})[/-](\d{1,2})[/-](20\d{2})\b',
            r'\b(\d{1,2})\s+(January|February|March|April|May|June|July|August|September|October|November|December)\s+(20\d{2})\b',
            r'\b(January|February|March|April|May|June|July|August|September|October|November|December)\s+(\d{1,2})[,]?\s+(20\d{2})\b'
          ]
          seen=[]
          for pat in pats:
              for m in re.finditer(pat,text,re.I):
                  s=m.group(0)
                  if s not in seen: seen.append(s)
          print('ONTARIO_DATES',len(seen))
          for x in seen[:180]: print('ONTARIO_DATE',x)
          for m in re.finditer(r'href=["\']([^"\']+)["\']',raw,re.I):
              u=html.unescape(m.group(1))
              if any(k in u.lower() for k in ['race','date','schedule','calendar','woodbine','mohawk','fort','ajax','pdf']):
                  print('ONTARIO_LINK',u)
          PY

      - name: Inspect Standardbred Canada racing page
        shell: bash
        run: |
          set -euo pipefail
          python3 - /tmp/canada/standardbred.out <<'PY'
          import html,re,sys
          raw=open(sys.argv[1],errors='replace').read()
          text=re.sub(r'<script\b[^>]*>.*?</script>',' ',raw,flags=re.I|re.S)
          text=re.sub(r'<style\b[^>]*>.*?</style>',' ',text,flags=re.I|re.S)
          text=html.unescape(re.sub(r'<[^>]+>',' ',text))
          text=re.sub(r'\s+',' ',text).strip()
          print('SC_TEXT_LEN',len(text))
          for needle in ['2026','Today','Tomorrow','Mohawk','Flamboro','Western Fair','Rideau','Race Programs','Entries']:
              p=text.lower().find(needle.lower())
              if p>=0:
                  print('SC_TEXT',needle,text[max(0,p-600):p+9000])
          for m in re.finditer(r'href=["\']([^"\']+)["\']',raw,re.I):
              u=html.unescape(m.group(1))
              if any(k in u.lower() for k in ['race','entry','program','card','schedule','calendar']):
                  print('SC_LINK',u)
          PY

      - name: Probe Standardbred Canada race-dates endpoint
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (compatible; WhereHorsesRun/1.0; +https://github.com/badjoke-lab/where-horses-run)'
          mkdir -p /tmp/canada-racedates
          url='https://standardbredcanada.ca/racing/racedates'
          out='/tmp/canada-racedates/page.html'
          code="$(curl -L -sS -A "$UA" --connect-timeout 12 --max-time 40 -o "$out" -w '%{http_code}' "$url" || true)"
          echo "SC_RACEDATES_PAGE HTTP=$code BYTES=$(wc -c < "$out" 2>/dev/null || echo 0) URL=$url"
          python3 - "$out" <<'PY'
          import html,re,sys
          raw=open(sys.argv[1],errors='replace').read()
          text=re.sub(r'<script\b[^>]*>.*?</script>',' ',raw,flags=re.I|re.S)
          text=re.sub(r'<style\b[^>]*>.*?</style>',' ',text,flags=re.I|re.S)
          text=html.unescape(re.sub(r'<[^>]+>',' ',text))
          text=re.sub(r'\s+',' ',text).strip()
          print('SC_RACEDATES_TEXT_LEN',len(text))
          for needle in ['Race Dates','October','November','December','2026','Woodbine Mohawk Park','Flamboro Downs','Western Fair']:
              p=text.lower().find(needle.lower())
              if p>=0:
                  print('SC_RACEDATES_TEXT',needle,text[max(0,p-600):p+9000])
          for m in re.finditer(r'<form\b[^>]*>(.*?)</form>',raw,re.I|re.S):
              block=m.group(0)
              action=re.search(r'action=["\']([^"\']*)["\']',block,re.I)
              method=re.search(r'method=["\']([^"\']*)["\']',block,re.I)
              print('FORM',action.group(1) if action else '',method.group(1) if method else '')
              for s in re.finditer(r'<select\b[^>]*name=["\']([^"\']+)["\'][^>]*>(.*?)</select>',block,re.I|re.S):
                  name=s.group(1)
                  opts=[]
                  for o in re.finditer(r'<option\b[^>]*value=["\']?([^"\' >]*)["\']?[^>]*>(.*?)</option>',s.group(2),re.I|re.S):
                      label=html.unescape(re.sub(r'<[^>]+>',' ',o.group(2)))
                      label=re.sub(r'\s+',' ',label).strip()
                      opts.append((o.group(1),label))
                  print('SELECT',name,opts[:100])
              for inp in re.finditer(r'<input\b[^>]*>',block,re.I):
                  tag=inp.group(0)
                  name=re.search(r'name=["\']([^"\']+)["\']',tag,re.I)
                  value=re.search(r'value=["\']([^"\']*)["\']',tag,re.I)
                  typ=re.search(r'type=["\']([^"\']+)["\']',tag,re.I)
                  if name:
                      print('INPUT',name.group(1),value.group(1) if value else '',typ.group(1) if typ else '')
          for pat,label in [(r'<script[^>]+src=["\']([^"\']+)["\']','SCRIPT'),(r'href=["\']([^"\']+)["\']','LINK')]:
              seen=set()
              for m in re.finditer(pat,raw,re.I):
                  u=html.unescape(m.group(1))
                  lu=u.lower()
                  if any(k in lu for k in ['race','date','ajax','json','api','entry','result','schedule']):
                      if u not in seen:
                          seen.add(u); print(label,u)
          PY

      - name: Inspect Standardbred Canada page scripts for race-date calls
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (compatible; WhereHorsesRun/1.0; +https://github.com/badjoke-lab/where-horses-run)'
          python3 - /tmp/canada-racedates/page.html <<'PY' > /tmp/canada-racedates/scripts.txt
          import html,re,sys
          from urllib.parse import urljoin
          raw=open(sys.argv[1],errors='replace').read()
          seen=[]
          for m in re.finditer(r'<script[^>]+src=["\']([^"\']+)["\']',raw,re.I):
              u=urljoin('https://standardbredcanada.ca/',html.unescape(m.group(1)))
              if u not in seen: seen.append(u)
          print('\n'.join(seen))
          PY
          n=0
          while IFS= read -r url; do
            [ -n "$url" ] || continue
            n=$((n+1))
            out="/tmp/canada-racedates/script-$n.js"
            code="$(curl -L -sS -A "$UA" --connect-timeout 10 --max-time 30 -o "$out" -w '%{http_code}' "$url" || true)"
            [ "$code" = "200" ] || continue
            if grep -Eqi 'racedate|race.?date|ajax|drupalSettings|views/ajax|json' "$out"; then
              echo "SCRIPT_MATCH $url"
              grep -Eio '.{0,220}(racedate|race.?date|views/ajax|ajax|json).{0,450}' "$out" | head -n 80 || true
            fi
          done < /tmp/canada-racedates/scripts.txt

      - name: Inspect sc_races custom JavaScript and submit race-date form
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (compatible; WhereHorsesRun/1.0; +https://github.com/badjoke-lab/where-horses-run)'
          mkdir -p /tmp/canada-racedates
          for js in racing.js racing_init.js; do
            url="https://standardbredcanada.ca/modules/custom/sc_races/js/$js?v=10.6.17"
            out="/tmp/canada-racedates/$js"
            curl -L -sS -A "$UA" --connect-timeout 10 --max-time 30 "$url" -o "$out"
            echo "SC_CUSTOM_JS $js BYTES=$(wc -c < "$out")"
            grep -Ein 'racedate|racedates|ajax|url:|route|endpoint|form_id|races_form|entries_track|results_track' "$out" | head -n 160 || true
          done

          python3 - /tmp/canada-racedates/page.html <<'PY' > /tmp/canada-racedates/form-meta.txt
          import html,re,sys
          raw=open(sys.argv[1],errors='replace').read()
          m=re.search(r'<form\b[^>]*action=["\']/racing/racedates["\'][^>]*>(.*?)</form>',raw,re.I|re.S)
          if not m:
              raise SystemExit('RACEDATES_FORM_NOT_FOUND')
          block=m.group(0)
          for tag in re.findall(r'<input\b[^>]*>',block,re.I):
              name=re.search(r'name=["\']([^"\']+)["\']',tag,re.I)
              value=re.search(r'value=["\']([^"\']*)["\']',tag,re.I)
              typ=re.search(r'type=["\']([^"\']+)["\']',tag,re.I)
              if name:
                  print('META',name.group(1),value.group(1) if value else '',typ.group(1) if typ else '')
          PY
          cat /tmp/canada-racedates/form-meta.txt

          build_id="$(awk '$2=="form_build_id"{print $3}' /tmp/canada-racedates/form-meta.txt | head -1)"
          form_id="$(awk '$2=="form_id"{print $3}' /tmp/canada-racedates/form-meta.txt | head -1)"
          active="$(awk '$2=="races__active_tab"{print $3}' /tmp/canada-racedates/form-meta.txt | head -1)"
          echo "POST_META build_id=$build_id form_id=$form_id active=$active"

          curl -L -sS -A "$UA" -c /tmp/canada-racedates/cookies.txt             'https://standardbredcanada.ca/racing/racedates'             -o /tmp/canada-racedates/fresh.html

          python3 - /tmp/canada-racedates/fresh.html <<'PY' > /tmp/canada-racedates/post.env
          import re,sys
          raw=open(sys.argv[1],errors='replace').read()
          def field(name):
              m=re.search(r'<input\b[^>]*name=["\']'+re.escape(name)+r'["\'][^>]*value=["\']([^"\']*)["\']',raw,re.I)
              if not m:
                  m=re.search(r'<input\b[^>]*value=["\']([^"\']*)["\'][^>]*name=["\']'+re.escape(name)+r'["\']',raw,re.I)
              return m.group(1) if m else ''
          print('BUILD='+field('form_build_id'))
          print('FORM='+field('form_id'))
          print('ACTIVE='+field('races__active_tab'))
          PY
          source /tmp/canada-racedates/post.env

          curl -L -sS -A "$UA" -b /tmp/canada-racedates/cookies.txt -c /tmp/canada-racedates/cookies.txt             -X POST 'https://standardbredcanada.ca/racing/racedates'             --data-urlencode "racedates_track=ALL"             --data-urlencode "racedates_month=10"             --data-urlencode "racedates_year=2026"             --data-urlencode "races__active_tab=$ACTIVE"             --data-urlencode "form_build_id=$BUILD"             --data-urlencode "form_id=$FORM"             --data-urlencode "op=Search"             -o /tmp/canada-racedates/post.html

          python3 - /tmp/canada-racedates/post.html <<'PY'
          import html,re,sys
          raw=open(sys.argv[1],errors='replace').read()
          text=re.sub(r'<script\b[^>]*>.*?</script>',' ',raw,flags=re.I|re.S)
          text=re.sub(r'<style\b[^>]*>.*?</style>',' ',text,flags=re.I|re.S)
          text=html.unescape(re.sub(r'<[^>]+>',' ',text))
          text=re.sub(r'\s+',' ',text).strip()
          print('POST_TEXT_LEN',len(text))
          for needle in ['Race Dates','Oct 11, 2026','Woodbine Mohawk Park','Flamboro Downs','Western Fair Raceway','Leamington Raceway']:
              p=text.lower().find(needle.lower())
              if p>=0:
                  print('POST_TEXT',needle,text[max(0,p-800):p+9000])
          # Print table rows from the race-date pane, if present.
          for tr in re.finditer(r'<tr\b[^>]*>(.*?)</tr>',raw,re.I|re.S):
              row=html.unescape(re.sub(r'<[^>]+>',' ',tr.group(1)))
              row=re.sub(r'\s+',' ',row).strip()
              if re.search(r'2026|Mohawk|Flamboro|Western Fair|Leamington|Century Mile|Charlottetown|Truro|Hippodrome',row,re.I):
                  print('POST_ROW',row)
          PY

      - name: Dump Standardbred Canada racedates form mechanics
        shell: bash
        run: |
          set -euo pipefail
          echo '--- racing.js ---'
          cat /tmp/canada-racedates/racing.js
          echo '--- racing_init.js ---'
          cat /tmp/canada-racedates/racing_init.js
          echo '--- racedates form fragment ---'
          python3 - /tmp/canada-racedates/page.html <<'PY'
          import re,sys
          raw=open(sys.argv[1],errors='replace').read()
          m=re.search(r'<form\b[^>]*action=["\']/racing/racedates["\'][^>]*>(.*?)</form>',raw,re.I|re.S)
          if not m:
              raise SystemExit('RACEDATES_FORM_NOT_FOUND')
          block=m.group(0)
          p=block.lower().find('racedates_track')
          if p<0: p=0
          print(block[max(0,p-4500):p+12000])
          PY

      - name: Probe track-specific Standardbred Canada race dates
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (compatible; WhereHorsesRun/1.0; +https://github.com/badjoke-lab/where-horses-run)'
          mkdir -p /tmp/canada-track
          for item in \
            'mohawk|WBSBS|Woodbine Mohawk Park' \
            'flamboro|FLMD|Flamboro Downs' \
            'western|LON|Western Fair Raceway' \
            'leamington|LEAM|Leamington Raceway'; do
            name="${item%%|*}"
            rest="${item#*|}"
            codeid="${rest%%|*}"
            expected="${rest#*|}"
            url="https://standardbredcanada.ca/racing/racedates?active_tab=racedates&racedates_track=$codeid"
            out="/tmp/canada-track/$name.html"
            code="$(curl -L -sS -A "$UA" --connect-timeout 12 --max-time 40 -o "$out" -w '%{http_code}' "$url" || true)"
            echo "SC_TRACK_PAGE name=$name code=$codeid HTTP=$code BYTES=$(wc -c < "$out" 2>/dev/null || echo 0) URL=$url"
            python3 - "$out" "$expected" "$codeid" <<'PY'
          import html,re,sys
          raw=open(sys.argv[1],errors='replace').read()
          expected=sys.argv[2]; code=sys.argv[3]
          text=re.sub(r'<script\b[^>]*>.*?</script>',' ',raw,flags=re.I|re.S)
          text=re.sub(r'<style\b[^>]*>.*?</style>',' ',text,flags=re.I|re.S)
          text=html.unescape(re.sub(r'<[^>]+>',' ',text))
          text=re.sub(r'\s+',' ',text).strip()
          p=text.lower().find(expected.lower())
          if p<0:
              raise SystemExit('TRACK_HEADING_MISSING '+expected)
          seg=text[p:p+8000]
          rx=re.compile(r'\b(?:Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday)\s+(January|February|March|April|May|June|July|August|September|October|November|December|Jan|Feb|Mar|Apr|Jun|Jul|Aug|Sep|Sept|Oct|Nov|Dec)\s+(\d{1,2}),\s+(20\d{2})(?:\s*\(Entries\))?',re.I)
          rows=[]
          months={'jan':1,'january':1,'feb':2,'february':2,'mar':3,'march':3,'apr':4,'april':4,'may':5,'jun':6,'june':6,'jul':7,'july':7,'aug':8,'august':8,'sep':9,'sept':9,'september':9,'oct':10,'october':10,'nov':11,'november':11,'dec':12,'december':12}
          for m in rx.finditer(seg):
              key=m.group(1).lower()
              rows.append(f'{m.group(3)}-{months[key]:02d}-{int(m.group(2)):02d}')
          rows=sorted(set(rows))
          print('SC_TRACK_DATES',code,expected,len(rows),','.join(rows))
          future=[d for d in rows if d>='2026-10-11']
          print('SC_TRACK_FUTURE',code,len(future),','.join(future))
          if not future:
              raise SystemExit('NO_FUTURE_DATES '+expected)
          PY
          done
