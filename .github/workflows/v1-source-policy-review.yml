name: v1 source policy review gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'data/static/sources.json'
      - 'data/static/country-page-sources-*.json'
      - 'data/static/racecourse-link-amendments-v1.json'
      - 'data/static/source-status-filter-contract-v1.json'
      - 'data/audits/source-status-filters-v1.json'
      - 'data/static/v1-source-policy-review-v1.json'
      - 'data/audits/v1-source-policy-review-v1.json'
      - 'docs/search/source-status-filters.md'
      - 'docs/release/v1-source-policy-review.md'
      - 'scripts/validate-data.mjs'
      - 'scripts/check-source-status-filters.mjs'
      - 'scripts/check-v1-source-policy-review.mjs'
      - 'src/lib/source-filter-data.ts'
      - 'src/components/SourceDirectoryPage.astro'
      - 'src/pages/sources/**'
      - 'src/pages/ja/sources/**'
      - '.github/workflows/source-status-filters.yml'
      - '.github/workflows/v1-source-policy-review.yml'
      - '.github/workflows/temporary-v1-source-policy-discovery.yml'
      - 'scripts/temporary-discover-v1-source-policy.mjs'
      - 'scripts/temporary-normalize-v1-source-policy.mjs'
  push:
    branches:
      - main
    paths:
      - 'data/static/sources.json'
      - 'data/static/country-page-sources-*.json'
      - 'data/static/racecourse-link-amendments-v1.json'
      - 'data/static/source-status-filter-contract-v1.json'
      - 'data/audits/source-status-filters-v1.json'
      - 'data/static/v1-source-policy-review-v1.json'
      - 'data/audits/v1-source-policy-review-v1.json'
      - 'docs/search/source-status-filters.md'
      - 'docs/release/v1-source-policy-review.md'
      - 'scripts/validate-data.mjs'
      - 'scripts/check-source-status-filters.mjs'
      - 'scripts/check-v1-source-policy-review.mjs'
      - 'src/lib/source-filter-data.ts'
      - 'src/components/SourceDirectoryPage.astro'
      - 'src/pages/sources/**'
      - 'src/pages/ja/sources/**'
      - '.github/workflows/source-status-filters.yml'
      - '.github/workflows/v1-source-policy-review.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install dependencies without generating a lockfile
        run: npm install --package-lock=false
      - name: Validate source data references
        run: npm run validate:data
      - name: Build complete static site
        run: npm run build
      - name: Preserve Phase 10 UX release
        run: node scripts/check-ux-polish-release.mjs
      - name: Preserve Phase 11 SEO release
        run: node scripts/check-seo-qa-release.mjs
      - name: Preserve v1 scope freeze
        run: node scripts/check-v1-scope-freeze.mjs
      - name: Preserve v1 data audit
        run: node scripts/check-v1-data-audit.mjs
      - name: Validate revised public source directory
        run: node scripts/check-source-status-filters.mjs
      - name: Validate v1 source policy review
        run: node scripts/check-v1-source-policy-review.mjs
      - name: Prove repository clean
        run: |
          changes="$(git status --porcelain --untracked-files=all)"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            exit 1
          fi
