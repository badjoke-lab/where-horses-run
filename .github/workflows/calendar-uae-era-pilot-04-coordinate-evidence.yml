name: Calendar UAE ERA PILOT-04 coordinate evidence

on:
  pull_request:
    paths:
      - 'scripts/timetable/probe_uae_era_pdf_coordinates.py'
      - 'docs/calendar/uae-era-pilot-04-coordinate-grid-parser.md'
      - '.github/workflows/calendar-uae-era-pilot-04-coordinate-evidence.yml'

permissions:
  contents: read

jobs:
  capture-coordinate-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install coordinate extraction dependency
        run: python -m pip install --disable-pip-version-check pymupdf
      - name: Validate coordinate probe syntax and safety markers
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          source = Path('scripts/timetable/probe_uae_era_pdf_coordinates.py').read_text()
          ast.parse(source)
          required = [
              'get_text("words"',
              'search_for(alias)',
              'raw_pdf_stored',
              'raw_text_stored',
              'unapproved_text_emitted',
          ]
          for marker in required:
              if marker not in source:
                  raise SystemExit(f'missing safety/coordinate marker: {marker}')
          forbidden = ['write_bytes(', 'write_text(', 'NamedTemporaryFile', 'mkstemp']
          for marker in forbidden:
              if marker in source:
                  raise SystemExit(f'forbidden file-write primitive: {marker}')
          print('UAE_PILOT_04_COORDINATE_PROBE_STATIC: pass')
          PY
      - name: Record protected state hashes
        run: |
          sha256sum \
            data/static/racecourses.json \
            data/static/calendar-readiness-registry.json \
            data/static/calendar-acquisition-registry.json \
            data/generated/timetable/canonical/meetings.json \
            data/generated/timetable/canonical/meeting-details.json \
            data/generated/timetable/public/meeting-list.json \
            data/generated/timetable/public/meeting-details.json \
            > /tmp/uae-pilot-04-protected-before.sha256
      - name: Run coordinate-only PDF grid probe
        run: python scripts/timetable/probe_uae_era_pdf_coordinates.py > /tmp/uae-pilot-04-coordinate-summary.json
      - name: Validate public-safe coordinate summary
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const summary = JSON.parse(fs.readFileSync('/tmp/uae-pilot-04-coordinate-summary.json', 'utf8'));
          if (summary.schema_version !== 'calendar-uae-era-pilot-04-coordinate-summary-v1') throw new Error('coordinate summary schema differs');
          if (summary.work_id !== 'WHR-CAL-UAE-ERA' || summary.implementation_unit !== 'UAE-PILOT-04') throw new Error('coordinate summary Work identity differs');
          if (summary.http_status !== 200 || summary.pdf_magic !== true) throw new Error('official PDF route evidence differs');
          if (summary.final_host !== 'd2xuc5ucjmnf40.cloudfront.net') throw new Error('coordinate probe final host differs');
          if (!Number.isInteger(summary.page_count) || summary.page_count < 1 || summary.pages.length !== summary.page_count) throw new Error('page shape differs');
          const page = summary.pages[0];
          if (!(page.page_width > 0) || !(page.page_height > 0)) throw new Error('page dimensions missing');
          if (!Array.isArray(page.month_tokens) || !Array.isArray(page.weekday_tokens) || !Array.isArray(page.day_tokens) || !Array.isArray(page.venue_anchors)) throw new Error('coordinate token arrays missing');
          if (summary.totals.month_tokens < 6) throw new Error('expected at least six season month tokens');
          if (summary.totals.weekday_tokens < 7) throw new Error('expected weekday tokens');
          if (summary.totals.day_tokens < 31) throw new Error('expected calendar day-number tokens');
          if (summary.totals.venue_anchors < 5) throw new Error('expected five venue alias anchors');
          for (const collection of [page.month_tokens, page.weekday_tokens, page.day_tokens, page.venue_anchors]) {
            for (const item of collection) {
              for (const key of ['x0','y0','x1','y1']) if (typeof item[key] !== 'number') throw new Error(`coordinate ${key} missing`);
            }
          }
          if (summary.raw_pdf_stored !== false || summary.raw_text_stored !== false || summary.unapproved_text_emitted !== false) throw new Error('raw-source boundary differs');
          for (const forbiddenKey of ['raw_pdf','raw_text','source_body','page_text','extracted_text']) {
            if (Object.hasOwn(summary, forbiddenKey)) throw new Error(`forbidden summary key ${forbiddenKey}`);
          }
          console.log('UAE_PILOT_04_COORDINATE_EVIDENCE: pass');
          console.log(JSON.stringify({
            page_width: page.page_width,
            page_height: page.page_height,
            totals: summary.totals,
            drawing_cluster_count: page.drawing_cluster_count,
          }));
          NODE
      - name: Prove protected state unchanged
        if: always()
        run: sha256sum --check /tmp/uae-pilot-04-protected-before.sha256
      - name: Upload public-safe coordinate summary only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uae-pilot-04-coordinate-evidence-${{ github.run_id }}
          path: /tmp/uae-pilot-04-coordinate-summary.json
          if-no-files-found: warn
          retention-days: 30
      - name: Prove repository clean
        if: always()
        run: |
          changes="$(git status --porcelain --untracked-files=all)"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            exit 1
          fi
