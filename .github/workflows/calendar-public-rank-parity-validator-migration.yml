name: Calendar public rank parity validator migration

on:
  push:
    branches:
      - fix/public-rank-parity-validator-20260902

permissions:
  contents: write

concurrency:
  group: calendar-public-rank-parity-validator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/public-rank-parity-validator-20260902
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Migrate projection validator from ceilings to canonical parity
        run: node scripts/timetable/migrate-public-projection-validator-to-rank-parity.mjs
      - name: Validate public projection contract
        run: node scripts/check-calendar-pipeline-v1-public-projection.mjs
      - name: Verify deterministic public projection
        run: node scripts/timetable/build-public-timetable-view.mjs --check
      - name: Verify exact KRA current public A rows
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const rows = JSON.parse(fs.readFileSync('data/generated/timetable/public/meeting-list.json', 'utf8')).meetings;
          const ids = [
            'kra-busan-gyeongnam-racecourse-2026-09-04',
            'kra-jeju-racecourse-2026-09-04',
            'kra-jeju-racecourse-2026-09-05',
            'kra-seoul-racecourse-2026-09-05',
            'kra-busan-gyeongnam-racecourse-2026-09-06',
            'kra-seoul-racecourse-2026-09-06'
          ];
          for (const id of ids) {
            const row = rows.find((item) => item.meeting_id === id);
            if (!row || row.effective_public_rank !== 'A') throw new Error(`${id} is not public A`);
            if (!row.first_race_time_local || !row.last_race_time_local) throw new Error(`${id} lost race times`);
          }
          console.log('KRA_CURRENT_PUBLIC_A: 6');
          NODE
      - name: Commit validator migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/check-calendar-pipeline-v1-public-projection.mjs
          if git diff --cached --quiet; then
            echo 'No validator migration diff generated' >&2
            exit 1
          fi
          git commit -m 'FIX: validate canonical rank parity in public projection'
          git push origin HEAD:fix/public-rank-parity-validator-20260902
