name: Calendar Collection Result Manifest

on:
  pull_request:
    paths:
      - 'data/static/calendar-collection-result-manifest.schema.json'
      - 'data/fixtures/calendar-collection-result-manifests-v1.json'
      - 'data/fixtures/calendar-collection-result-manifest-invalid-cases-v1.json'
      - 'data/fixtures/calendar-collection-jobs-v1.json'
      - 'data/static/calendar-acquisition-registry.json'
      - 'data/static/calendar-coverage-observation.schema.json'
      - 'scripts/timetable/collection-result-manifest-validation.mjs'
      - 'scripts/timetable/coverage-observation-validation.mjs'
      - 'scripts/timetable/load-calendar-acquisition-registry.mjs'
      - 'scripts/check-calendar-collection-result-manifest.mjs'
      - 'scripts/check-calendar-coverage-observation-schema.mjs'
      - 'scripts/check-calendar-collection-job.mjs'
      - 'scripts/check-calendar-acquisition-registry.mjs'
      - 'scripts/check-project-governance-docs.mjs'
      - 'docs/calendar/collection-result-manifest.md'
      - 'docs/calendar/acquisition-control-plane-implementation-plan.md'
      - 'docs/calendar/machine-readable-contracts.md'
      - 'docs/calendar/README.md'
      - 'docs/calendar/implementation-roadmap.md'
      - 'docs/project-roadmap.md'
      - 'START-HERE.md'
      - '.github/workflows/calendar-collection-result-manifest.yml'
  push:
    branches:
      - main
    paths:
      - 'data/static/calendar-collection-result-manifest.schema.json'
      - 'data/fixtures/calendar-collection-result-manifests-v1.json'
      - 'data/fixtures/calendar-collection-result-manifest-invalid-cases-v1.json'
      - 'scripts/timetable/collection-result-manifest-validation.mjs'
      - 'scripts/check-calendar-collection-result-manifest.mjs'
      - 'docs/calendar/collection-result-manifest.md'
      - 'docs/calendar/acquisition-control-plane-implementation-plan.md'
      - 'docs/calendar/machine-readable-contracts.md'
      - 'docs/calendar/README.md'
      - 'docs/calendar/implementation-roadmap.md'
      - 'docs/project-roadmap.md'
      - 'START-HERE.md'
      - '.github/workflows/calendar-collection-result-manifest.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Check Node syntax
        run: |
          node --check scripts/timetable/collection-result-manifest-validation.mjs
          node --check scripts/check-calendar-collection-result-manifest.mjs

      - name: Validate Collection Result Manifest contract and fixtures
        run: node scripts/check-calendar-collection-result-manifest.mjs

      - name: Validate Collection Job and Registry dependencies
        run: |
          node scripts/check-calendar-collection-job.mjs
          node scripts/check-calendar-acquisition-registry.mjs

      - name: Validate Coverage Observation dependency
        run: node scripts/check-calendar-coverage-observation-schema.mjs

      - name: Validate Calendar contracts and governance
        run: |
          node scripts/check-calendar-contracts.mjs
          node scripts/check-project-governance-docs.mjs

      - name: Validate runtime import boundary
        run: node scripts/check-calendar-runtime-import-boundary.mjs

      - name: Check diff formatting
        run: git diff --check
