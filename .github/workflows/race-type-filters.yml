name: Race type filters gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'data/audits/race-type-filters-v1.json'
      - 'data/static/race-type-filter-contract-v1.json'
      - 'data/audits/country-filters-v1.json'
      - 'data/static/country-filter-contract-v1.json'
      - 'docs/search/country-filters.md'
      - 'docs/search/race-type-filters.md'
      - 'scripts/check-country-filters.mjs'
      - 'scripts/check-race-type-filters.mjs'
      - 'src/components/RacecourseDirectoryPage.astro'
      - 'src/lib/racecourse-filter-data.ts'
      - 'src/pages/tracks/index.astro'
      - 'src/pages/ja/tracks/index.astro'
      - '.github/workflows/race-type-filters.yml'
  push:
    branches:
      - main
    paths:
      - 'data/audits/race-type-filters-v1.json'
      - 'data/static/race-type-filter-contract-v1.json'
      - 'data/audits/country-filters-v1.json'
      - 'data/static/country-filter-contract-v1.json'
      - 'docs/search/country-filters.md'
      - 'docs/search/race-type-filters.md'
      - 'scripts/check-country-filters.mjs'
      - 'scripts/check-race-type-filters.mjs'
      - 'src/components/RacecourseDirectoryPage.astro'
      - 'src/lib/racecourse-filter-data.ts'
      - 'src/pages/tracks/index.astro'
      - 'src/pages/ja/tracks/index.astro'
      - '.github/workflows/race-type-filters.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install dependencies without generating a lockfile
        run: npm install --package-lock=false
      - name: Build bilingual racecourse directories and site
        run: npm run build
      - name: Preserve glossary public v1 contract
        run: node scripts/check-glossary-qa-release.mjs
      - name: Preserve global search foundation contract
        run: node scripts/check-global-search-foundation.mjs
      - name: Preserve country filter contract
        run: node scripts/check-country-filters.mjs
      - name: Validate race type filters
        id: race_type_filters
        shell: bash
        run: |
          set +e
          node scripts/check-race-type-filters.mjs > race-type-filter-check.log 2>&1
          status=$?
          cat race-type-filter-check.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload race type filter diagnostics
        if: steps.race_type_filters.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: race-type-filter-check-log
          path: race-type-filter-check.log
          retention-days: 1
      - name: Fail when race type filter validation failed
        if: steps.race_type_filters.outputs.status != '0'
        run: exit 1
      - name: Remove diagnostic log
        if: always()
        run: rm -f race-type-filter-check.log
      - name: Prove repository clean
        run: |
          changes="$(git status --porcelain --untracked-files=all)"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            exit 1
          fi
