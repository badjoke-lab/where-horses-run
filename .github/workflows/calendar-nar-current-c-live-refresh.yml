name: Calendar NAR current C live refresh

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/calendar-nar-current-c-live-refresh.yml'

permissions:
  contents: read

concurrency:
  group: calendar-nar-current-c-live-refresh
  cancel-in-progress: false

env:
  WHR_BATCH_ID: nar-current-c-live-refresh-2026-09-01-batch-001
  WHR_MODE: selected_meetings
  WHR_START_DATE: ''
  WHR_END_DATE_EXCLUSIVE: ''

jobs:
  collect-review-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Select current published NAR Rank C meetings dynamically
        shell: bash
        run: |
          node --input-type=module <<'NODE' > /tmp/nar-current-c-ids.txt
          import fs from 'node:fs';
          const data = JSON.parse(fs.readFileSync('data/generated/timetable/public/meeting-list.json', 'utf8'));
          const meetings = Array.isArray(data.meetings) ? data.meetings : [];
          const ids = meetings
            .filter((row) => row.date >= '2026-09-01' && row.date < '2026-10-01')
            .filter((row) => row.authority_id === 'nar-local-government-racing')
            .filter((row) => (row.effective_public_rank ?? row.capability_rank) === 'C')
            .map((row) => row.meeting_id)
            .sort();
          if (ids.length === 0) throw new Error('current September NAR Rank C cohort is empty; no refresh required');
          if (new Set(ids).size !== ids.length) throw new Error('duplicate NAR meeting identity entered selected scope');
          if (!ids.every((id) => id.startsWith('nar-'))) throw new Error('non-NAR identity entered selected scope');
          process.stdout.write(ids.join('\n') + '\n');
          NODE
          {
            echo 'WHR_MEETING_IDS<<EOF'
            paste -sd, /tmp/nar-current-c-ids.txt
            echo 'EOF'
            echo "WHR_CHECKED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_ENV"
          echo "Selected $(wc -l < /tmp/nar-current-c-ids.txt | tr -d ' ') current NAR Rank C meetings"

      - name: Record protected canonical and public hashes
        run: |
          sha256sum \
            data/generated/timetable/canonical/meetings.json \
            data/generated/timetable/canonical/meeting-details.json \
            data/generated/timetable/public/meeting-list.json \
            data/generated/timetable/public/meeting-details.json \
            > /tmp/nar-current-c-protected-before.sha256

      - name: Run official NAR selected-meeting acquisition
        shell: bash
        run: |
          node scripts/timetable/run-nar-incremental-v2-actions.mjs > /tmp/nar-current-c-live.log 2>&1
          cat /tmp/nar-current-c-live.log

      - name: Validate review-only output and summarize best available
        shell: bash
        run: |
          node scripts/check-calendar-nar-incremental-v2.mjs --batch-id="$WHR_BATCH_ID"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const batchId = process.env.WHR_BATCH_ID;
          const candidatePath = `data/candidates/nar-incremental-batches/${batchId}/batch.json`;
          const generatedRoot = `data/generated/timetable/nar-incremental-batches/${batchId}`;
          const candidates = JSON.parse(fs.readFileSync(candidatePath, 'utf8'));
          const report = JSON.parse(fs.readFileSync(`${generatedRoot}/collection-report.json`, 'utf8'));
          const coverage = JSON.parse(fs.readFileSync(`${generatedRoot}/coverage-observation.json`, 'utf8'));
          const selected = fs.readFileSync('/tmp/nar-current-c-ids.txt', 'utf8').trim().split(/\r?\n/).filter(Boolean);
          const detail = candidates.detail_candidates ?? [];
          const schedule = candidates.schedule_candidates ?? [];
          const unresolved = coverage.unresolved_meeting_ids ?? [];
          if (detail.length + schedule.length !== selected.length) throw new Error(`candidate closure differs: selected=${selected.length} detail=${detail.length} schedule=${schedule.length}`);
          if (candidates.review?.status !== 'needs_review' || candidates.review?.promotion_eligible !== false) throw new Error('review boundary differs');
          if (candidates.review?.canonical_write !== 'disabled' || candidates.review?.public_write !== 'disabled') throw new Error('write boundary differs');
          if (report.publication_effect !== 'none') throw new Error('publication effect differs');
          const summary = {
            schema_version: 'calendar-nar-current-c-live-refresh-result-v1',
            generated_at: coverage.checked_at,
            batch_id: batchId,
            selected_meeting_count: selected.length,
            a_plus_candidate_count: detail.length,
            schedule_c_candidate_count: schedule.length,
            unresolved_meeting_count: unresolved.length,
            source_error_count: (coverage.source_errors ?? []).length,
            review_state: candidates.review.status,
            canonical_write: candidates.review.canonical_write,
            public_write: candidates.review.public_write,
            publication_effect: report.publication_effect,
            a_plus_meeting_ids: detail.map((row) => row.meeting_id).sort(),
          };
          fs.writeFileSync('/tmp/nar-current-c-result.json', `${JSON.stringify(summary, null, 2)}\n`);
          console.log(JSON.stringify(summary, null, 2));
          NODE

      - name: Prove protected state unchanged
        run: sha256sum --check /tmp/nar-current-c-protected-before.sha256

      - name: Upload review-only acquisition evidence
        uses: actions/upload-artifact@v4
        with:
          name: nar-current-c-live-refresh-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: |
            /tmp/nar-current-c-ids.txt
            /tmp/nar-current-c-live.log
            /tmp/nar-current-c-result.json
            data/candidates/nar-incremental-batches/${{ env.WHR_BATCH_ID }}/
            data/generated/timetable/nar-incremental-batches/${{ env.WHR_BATCH_ID }}/
