name: Malta current Calendar source probe

on:
  pull_request:
    paths:
      - ".github/workflows/calendar-malta-current-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Probe official Malta Racing Club and Malta Equidrome routes
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (compatible; WhereHorsesRun/1.0; +https://github.com/badjoke-lab/where-horses-run)'

          mkdir -p /tmp/malta-probe

          probe() {
            local name="$1"
            local url="$2"
            local out="/tmp/malta-probe/$name.html"
            echo "::group::$name $url"
            code="$(curl -L -sS -A "$UA" --connect-timeout 15 --max-time 45 -o "$out" -w '%{http_code}' "$url" || true)"
            echo "HTTP=$code BYTES=$(wc -c < "$out" 2>/dev/null || echo 0)"
            if [ -s "$out" ]; then
              echo "-- title / key text --"
              grep -Eio '<title>[^<]+|Racing Calendar[^<]{0,160}|Oct[^<]{0,80}2026|Nov[^<]{0,80}2026|Dec[^<]{0,80}2026' "$out" | head -80 || true
              echo "-- candidate links / endpoints --"
              grep -Eo 'https?://[^"'"'"' <>]+|newsdetails\.php\?id=[0-9]+|meeting/\?id=[0-9]+|admin-ajax\.php|wp-json[^"'"'"' <>]*|[?&](mon|y|id)=[0-9]+' "$out" | sort -u | head -160 || true
            fi
            echo "::endgroup::"
          }

          probe mrc-news 'https://www.maltaracingclub.com/news.php?p=1'
          probe mrc-calendar 'https://maltaracingclub.com/index.php/calendar.php'
          probe equidrome-trot-oct 'https://www.maltaequidrome.com/trot/?mon=10&y=2026'
          probe equidrome-trot-nov 'https://www.maltaequidrome.com/trot/?mon=11&y=2026'
          probe equidrome-trot-dec 'https://www.maltaequidrome.com/trot/?mon=12&y=2026'

          echo "::group::MRC latest calendar article candidates"
          ids="$(grep -Eo 'newsdetails\.php\?id=[0-9]+' /tmp/malta-probe/mrc-news.html | sed -E 's/.*id=//' | awk '!seen[$0]++' | head -12 || true)"
          echo "IDS=$ids"
          for id in $ids; do
            url="https://www.maltaracingclub.com/newsdetails.php?id=$id"
            out="/tmp/malta-probe/article-$id.html"
            code="$(curl -L -sS -A "$UA" --connect-timeout 15 --max-time 45 -o "$out" -w '%{http_code}' "$url" || true)"
            title="$(grep -Eio '<title>[^<]+' "$out" | head -1 || true)"
            hit="$(grep -Eio 'Racing Calendar[^<]{0,200}|end of 2026|October 2026|November 2026|December 2026' "$out" | head -8 | tr '\n' ' ' || true)"
            echo "ARTICLE id=$id HTTP=$code BYTES=$(wc -c < "$out" 2>/dev/null || echo 0) TITLE=$title HIT=$hit"
            if grep -Eqi 'Racing Calendar|end of 2026' "$out"; then
              echo "-- article $id assets --"
              grep -Eo 'https?://[^"'"'"' <>]+\.(pdf|jpg|jpeg|png)(\?[^"'"'"' <>]*)?|[^"'"'"' <>]+\.(pdf|jpg|jpeg|png)(\?[^"'"'"' <>]*)?' "$out" | sort -u | head -120 || true
            fi
          done
          echo "::endgroup::"

          echo "::group::Equidrome inline script clues"
          cat /tmp/malta-probe/equidrome-trot-oct.html /tmp/malta-probe/equidrome-trot-nov.html /tmp/malta-probe/equidrome-trot-dec.html             | grep -Ei 'ajax|meeting|calendar|event|race|mon=|year|month|fetch\(|\.php|wp-json'             | sed -E 's/<[^>]+>/ /g'             | sed -E 's/[[:space:]]+/ /g'             | head -240 || true
          echo "::endgroup::"


      - name: Inspect Malta Equidrome MRC API plugin JavaScript
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (compatible; WhereHorsesRun/1.0; +https://github.com/badjoke-lab/where-horses-run)'
          base='https://www.maltaequidrome.com/wp-content/plugins/maltaequidrome-mrc-api'
          for file in events.js general.js race.js meeting.js; do
            out="/tmp/$file"
            code="$(curl -L -sS -A "$UA" --connect-timeout 15 --max-time 45 -o "$out" -w '%{http_code}' "$base/$file?ver=7.1.2" || true)"
            echo "::group::$file HTTP=$code BYTES=$(wc -c < "$out" 2>/dev/null || echo 0)"
            grep -nEi 'ajax|action|url|calendar|meeting|race|month|year|date|nonce|token|api' "$out" | head -260 || true
            echo "::endgroup::"
          done


      - name: Probe direct Malta Racing Club article ids after 446
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (compatible; WhereHorsesRun/1.0; +https://github.com/badjoke-lab/where-horses-run)'
          for id in $(seq 447 455); do
            url="https://www.maltaracingclub.com/newsdetails.php?id=$id"
            out="/tmp/mrc-$id.html"
            code="$(curl -L -sS -A "$UA" --connect-timeout 15 --max-time 45 -o "$out" -w '%{http_code}' "$url" || true)"
            title="$(grep -Eio '<title>[^<]+' "$out" | head -1 | sed -E 's/<title>//I' || true)"
            datehit="$(grep -Eio '(Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday)[^<]{0,40}(September|October|November|December)[^<]{0,20}2026' "$out" | head -1 || true)"
            calhit="$(grep -Eio 'Racing Calendar[^<]{0,220}|end of 2026' "$out" | head -8 | tr '\n' ' ' || true)"
            echo "ARTICLE id=$id HTTP=$code BYTES=$(wc -c < "$out" 2>/dev/null || echo 0) TITLE=$title DATE=$datehit HIT=$calhit"
            if grep -Eqi 'Racing Calendar|end of 2026' "$out"; then
              echo "::group::ARTICLE-$id-ASSETS"
              grep -Eo 'https?://[^"'"'"' <>]+\.(pdf|jpg|jpeg|png)(\?[^"'"'"' <>]*)?|[^"'"'"' <>]+\.(pdf|jpg|jpeg|png)(\?[^"'"'"' <>]*)?' "$out" | sort -u | head -160 || true
              echo "-- text date candidates --"
              grep -Eio '([0-3]?[0-9][/-][01]?[0-9][/-]2026|[0-3]?[0-9][[:space:]]+(October|November|December)[[:space:]]+2026)' "$out" | sort -u | head -120 || true
              echo "::endgroup::"
            fi
          done


      - name: Inspect rendered Malta Equidrome calendar structure
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (compatible; WhereHorsesRun/1.0; +https://github.com/badjoke-lab/where-horses-run)'
          curl -L -sS -A "$UA" --connect-timeout 15 --max-time 45             'https://www.maltaequidrome.com/trot/?mon=10&y=2026'             -o /tmp/malta-oct.html
          curl -L -sS -A "$UA" --connect-timeout 15 --max-time 45             'https://www.maltaequidrome.com/wp-json/wp/v2/pages/74'             -o /tmp/malta-page74.json

          python3 - <<'PY'
          import html
          import json
          import re
          from pathlib import Path

          raw = Path('/tmp/malta-oct.html').read_text(errors='replace')
          print('HTML_BYTES', len(raw))
          print('--- DATE / MEETING ATTRIBUTE TOKENS ---')
          patterns = [
              r'data-[a-zA-Z0-9_-]+=["\'][^"\']*(?:2026|meeting|race|event|date)[^"\']*["\']',
              r'href=["\'][^"\']*(?:meeting|race|event|mon=|y=)[^"\']*["\']',
              r'(?:0?[1-9]|[12][0-9]|3[01])[-/](?:0?[1-9]|1[0-2])[-/]2026',
              r'2026[-/](?:0[1-9]|1[0-2])[-/](?:0[1-9]|[12][0-9]|3[01])',
              r'(?:January|February|March|April|May|June|July|August|September|October|November|December)[^<]{0,80}2026',
          ]
          seen=set()
          for pat in patterns:
              for m in re.finditer(pat, raw, re.I):
                  s=html.unescape(m.group(0))
                  if s not in seen:
                      seen.add(s)
                      print(s[:500])

          print('--- TEXT WINDOW AROUND RACING CALENDAR ---')
          plain = re.sub(r'<script\b[^>]*>.*?</script>', ' ', raw, flags=re.I|re.S)
          plain = re.sub(r'<style\b[^>]*>.*?</style>', ' ', plain, flags=re.I|re.S)
          plain = html.unescape(re.sub(r'<[^>]+>', ' ', plain))
          plain = re.sub(r'\s+', ' ', plain)
          for needle in ['Racing Calendar','October 2026','Meeting','Sunday','Saturday']:
              pos=plain.lower().find(needle.lower())
              print('NEEDLE',needle,'POS',pos)
              if pos >= 0:
                  print(plain[max(0,pos-500):pos+3500])

          print('--- PAGE 74 REST ---')
          try:
              obj=json.loads(Path('/tmp/malta-page74.json').read_text(errors='replace'))
              print('REST_KEYS', sorted(obj.keys()))
              print('SLUG', obj.get('slug'), 'LINK', obj.get('link'))
              rendered=(obj.get('content') or {}).get('rendered','')
              print('RENDERED_BYTES',len(rendered))
              print(rendered[:12000])
              raw_field=(obj.get('content') or {}).get('raw')
              if raw_field:
                  print('RAW_CONTENT',raw_field[:12000])
          except Exception as e:
              print('REST_PARSE_ERROR',repr(e))
              print(Path('/tmp/malta-page74.json').read_text(errors='replace')[:12000])
          PY


      - name: Inspect Malta Equidrome Events calendar
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (compatible; WhereHorsesRun/1.0; +https://github.com/badjoke-lab/where-horses-run)'
          for url in             'https://www.maltaequidrome.com/events/'             'https://www.maltaequidrome.com/events/?mon=10&y=2026'             'https://www.maltaequidrome.com/events/?mon=11&y=2026'             'https://www.maltaequidrome.com/wp-json/wp/v2/pages/33'
          do
            safe="$(echo "$url" | tr '/:?&=' '_')"
            out="/tmp/$safe"
            code="$(curl -L -sS -A "$UA" --connect-timeout 15 --max-time 45 -o "$out" -w '%{http_code}' "$url" || true)"
            echo "::group::$url HTTP=$code BYTES=$(wc -c < "$out" 2>/dev/null || echo 0)"
            python3 - "$out" <<'PY'
          import html, json, re, sys
          from pathlib import Path
          p=Path(sys.argv[1])
          raw=p.read_text(errors='replace')
          if raw.lstrip().startswith('{'):
              try:
                  o=json.loads(raw)
                  raw=(o.get('content') or {}).get('rendered','') or raw
                  print('REST_SLUG',o.get('slug'),'LINK',o.get('link'),'RENDERED_BYTES',len(raw))
              except Exception as e:
                  print('JSON_ERROR',repr(e))
          print('MATCHES')
          pats=[
              r'href=["\'][^"\']*(?:meeting|race|event|mon=|y=)[^"\']*["\']',
              r'data-[a-zA-Z0-9_-]+=["\'][^"\']+["\']',
              r'(?:0?[1-9]|[12][0-9]|3[01])[-/.](?:0?[1-9]|1[0-2])[-/.]2026',
              r'2026[-/.](?:0[1-9]|1[0-2])[-/.](?:0[1-9]|[12][0-9]|3[01])',
              r'(?:Sunday|Monday|Tuesday|Wednesday|Thursday|Friday|Saturday)[^<]{0,100}(?:October|November|December)[^<]{0,60}2026',
              r'(?:October|November|December)[^<]{0,100}2026',
          ]
          seen=set()
          for pat in pats:
              for m in re.finditer(pat,raw,re.I):
                  s=html.unescape(m.group(0))
                  if s not in seen:
                      seen.add(s); print(s[:600])
          plain=re.sub(r'<script\b[^>]*>.*?</script>',' ',raw,flags=re.I|re.S)
          plain=re.sub(r'<style\b[^>]*>.*?</style>',' ',plain,flags=re.I|re.S)
          plain=html.unescape(re.sub(r'<[^>]+>',' ',plain))
          plain=re.sub(r'\s+',' ',plain)
          for needle in ['October 2026','November 2026','Racing','Trot','Meeting','04 October','4 October']:
              pos=plain.lower().find(needle.lower())
              if pos>=0:
                  print('WINDOW',needle,plain[max(0,pos-350):pos+2200])
          PY
            echo "::endgroup::"
          done
