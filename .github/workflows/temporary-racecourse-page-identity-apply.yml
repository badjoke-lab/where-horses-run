name: Temporary racecourse page identity apply

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/apply-racecourse-page-identity-reconciliation.mjs'
      - '.github/workflows/temporary-racecourse-page-identity-apply.yml'
  push:
    branches:
      - work/racecourse-page-identity-reconciliation
    paths:
      - 'scripts/apply-racecourse-page-identity-reconciliation.mjs'
      - '.github/workflows/temporary-racecourse-page-identity-apply.yml'

permissions:
  contents: write

concurrency:
  group: temporary-racecourse-page-identity-apply
  cancel-in-progress: true

jobs:
  apply:
    if: github.repository == 'badjoke-lab/where-horses-run' && (github.event_name == 'push' || github.head_ref == 'work/racecourse-page-identity-reconciliation')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/racecourse-page-identity-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Apply reviewed identity integration
        run: |
          node --check scripts/apply-racecourse-page-identity-reconciliation.mjs
          node scripts/apply-racecourse-page-identity-reconciliation.mjs
      - name: Install dependencies without lockfile mutation
        run: npm install --package-lock=false
      - name: Build static site
        run: npm run build
      - name: Validate racecourse identity reconciliation
        run: node scripts/check-racecourse-page-identity-reconciliation.mjs
      - name: Validate governance and Public v1 navigation
        run: |
          node scripts/check-project-governance-docs.mjs
          node scripts/check-calendar-public-v1-navigation-qa.mjs
      - name: Remove temporary discovery and apply mechanisms
        run: |
          rm .github/workflows/temporary-racecourse-page-identity-discovery.yml
          rm .github/workflows/temporary-racecourse-page-identity-apply.yml
          rm scripts/audit-racecourse-page-identity-reconciliation.mjs
          rm scripts/apply-racecourse-page-identity-reconciliation.mjs
      - name: Commit exact identity reconciliation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --exit-code && {
            echo 'Expected identity reconciliation changes were not produced.' >&2
            exit 1
          }
          git commit -m 'Complete racecourse page identity reconciliation'
          git push origin HEAD:work/racecourse-page-identity-reconciliation
