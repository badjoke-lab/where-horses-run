name: Publish TJK 2026-09-01 two Rank A meetings once

on:
  push:
    branches:
      - publish/tjk-2026-09-01-two-a
    paths:
      - '.github/workflows/publish-tjk-2026-09-01-two-a-once.yml'
      - 'data/candidates/tjk-2026-09-01-two-a-automated-approved.json'

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-tjk-2026-09-01-two-a-once
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Verify exact pinned TJK evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const review = JSON.parse(fs.readFileSync('data/candidates/tjk-current-2026-09-01-promotion-review-v1.json', 'utf8'));
          const candidate = JSON.parse(fs.readFileSync('data/candidates/tjk-2026-09-01-two-a-automated-approved.json', 'utf8'));
          const expectedIds = ['tjk-ankara-racecourse-2026-09-01','tjk-kocaeli-racecourse-2026-09-01'];
          const expectedSchedules = new Map([
            ['tjk-ankara-racecourse-2026-09-01', ['14:30','15:00','15:30','16:00','16:30','17:00','17:30','18:00']],
            ['tjk-kocaeli-racecourse-2026-09-01', ['17:45','18:30','19:00','19:30','20:00','20:30','21:00','21:30']]
          ]);
          const fail = (m) => { throw new Error(m); };
          if (review.source_run?.run_id !== 33471775307) fail('review source run differs');
          if (review.source_run?.head_sha !== 'bdf32f1a408844ecef67e55cea7fcce5e14a8e68') fail('review source head differs');
          if (review.source_run?.artifact_id !== 9786772486) fail('review artifact differs');
          if (review.source_run?.artifact_digest !== 'sha256:990b0265c6b9b97876113e9a1e380d0da27ca08b44eb977a27683b7350433792') fail('review artifact digest differs');
          if (review.source_run?.candidate_sha256 !== '69bee8a5469979c6a3e1d5dc5a90bce2b8e4935a9124f39d7e82c7f15e6ab5c6') fail('review candidate digest differs');
          if (review.meeting_count !== 2 || review.race_count !== 16 || review.candidate_rank !== 'A' || review.public_ceiling !== 'A') fail('review scope/rank differs');
          if (candidate.review?.status !== 'approved' || candidate.review?.reviewer !== 'automated-publication-gate') fail('automated publication review differs');
          if (candidate.review?.promotion_target !== 'canonical-timetable-v0') fail('promotion target differs');
          if (candidate.publication_ceiling !== 'A' || candidate.technical_capability_rank !== 'A+') fail('candidate rank boundary differs');
          if (candidate.provenance?.source_run_id !== 33471775307 || candidate.provenance?.source_artifact_id !== 9786772486) fail('candidate provenance differs');
          const records = candidate.records ?? [];
          if (JSON.stringify(records.map(r => r.meeting_id).sort()) !== JSON.stringify([...expectedIds].sort())) fail('candidate identity set differs');
          for (const r of records) {
            if (r.capability_rank !== 'A' || r.review_status !== 'approved') fail(`${r.meeting_id} is not approved Rank A`);
            if ((r.timetable_rows ?? []).length !== 8) fail(`${r.meeting_id} row count differs`);
            const times = r.timetable_rows.map((row, i) => {
              if (row.label !== `Race ${i + 1}`) fail(`${r.meeting_id} race labels are not contiguous`);
              const keys = Object.keys(row).sort();
              if (JSON.stringify(keys) !== JSON.stringify(['label','post_time_local'])) fail(`${r.meeting_id} contains fields outside Rank A public boundary`);
              return row.post_time_local;
            });
            if (JSON.stringify(times) !== JSON.stringify(expectedSchedules.get(r.meeting_id))) fail(`${r.meeting_id} schedule differs`);
          }
          NODE
          gh api repos/badjoke-lab/where-horses-run/actions/artifacts/9786772486/zip > /tmp/tjk-source.zip
          echo '990b0265c6b9b97876113e9a1e380d0da27ca08b44eb977a27683b7350433792  /tmp/tjk-source.zip' | sha256sum -c -
          rm -rf /tmp/tjk-source && mkdir -p /tmp/tjk-source
          unzip -q /tmp/tjk-source.zip -d /tmp/tjk-source
          found=0
          while IFS= read -r -d '' f; do
            if [ "$(sha256sum "$f" | cut -d' ' -f1)" = '69bee8a5469979c6a3e1d5dc5a90bce2b8e4935a9124f39d7e82c7f15e6ab5c6' ]; then
              found=1
              break
            fi
          done < <(find /tmp/tjk-source -type f -print0)
          test "$found" -eq 1

      - name: Snapshot and validate exact canonical prestate
        shell: bash
        run: |
          set -euo pipefail
          cp data/generated/timetable/canonical/meetings.json /tmp/tjk-before-canonical-meetings.json
          cp data/generated/timetable/canonical/meeting-details.json /tmp/tjk-before-canonical-details.json
          cp data/generated/timetable/public/meeting-list.json /tmp/tjk-before-public-meetings.json
          cp data/generated/timetable/public/meeting-details.json /tmp/tjk-before-public-details.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const ids = new Set(['tjk-ankara-racecourse-2026-09-01','tjk-kocaeli-racecourse-2026-09-01']);
          const c = JSON.parse(fs.readFileSync('/tmp/tjk-before-canonical-meetings.json','utf8'));
          const d = JSON.parse(fs.readFileSync('/tmp/tjk-before-canonical-details.json','utf8'));
          const meetings = c.meetings ?? [];
          const details = d.details ?? [];
          for (const id of ids) {
            const m = meetings.find(x => x.meeting_id === id);
            if (!m) throw new Error(`missing canonical prestate ${id}`);
            const detail = details.find(x => x.meeting_id === id);
            if (m.capability_rank === 'C') {
              if (detail) throw new Error(`${id} C prestate unexpectedly has detail`);
            } else if (m.capability_rank === 'A') {
              if (!detail || (detail.timetable_rows ?? detail.rows ?? []).length !== 8) throw new Error(`${id} A prestate is not exact idempotent state`);
            } else {
              throw new Error(`${id} unexpected prestate rank ${m.capability_rank}`);
            }
          }
          NODE

      - name: Dry-run exact promotion
        run: node scripts/timetable/promote-approved-candidate-v1.mjs --candidate=data/candidates/tjk-2026-09-01-two-a-automated-approved.json

      - name: Apply exact promotion and rebuild public projection
        run: |
          node scripts/timetable/promote-approved-candidate-v1.mjs --candidate=data/candidates/tjk-2026-09-01-two-a-automated-approved.json --apply
          node scripts/timetable/build-public-timetable-view.mjs

      - name: Prove bounded two-meeting mutation
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const ids = new Set(['tjk-ankara-racecourse-2026-09-01','tjk-kocaeli-racecourse-2026-09-01']);
          const expected = new Map([
            ['tjk-ankara-racecourse-2026-09-01', ['14:30','15:00','15:30','16:00','16:30','17:00','17:30','18:00']],
            ['tjk-kocaeli-racecourse-2026-09-01', ['17:45','18:30','19:00','19:30','20:00','20:30','21:00','21:30']]
          ]);
          const load = p => JSON.parse(fs.readFileSync(p,'utf8'));
          const beforeCM = load('/tmp/tjk-before-canonical-meetings.json');
          const beforeCD = load('/tmp/tjk-before-canonical-details.json');
          const beforePM = load('/tmp/tjk-before-public-meetings.json');
          const beforePD = load('/tmp/tjk-before-public-details.json');
          const afterCM = load('data/generated/timetable/canonical/meetings.json');
          const afterCD = load('data/generated/timetable/canonical/meeting-details.json');
          const afterPM = load('data/generated/timetable/public/meeting-list.json');
          const afterPD = load('data/generated/timetable/public/meeting-details.json');
          const rowsOf = x => x?.timetable_rows ?? x?.rows ?? [];
          const mapById = arr => new Map(arr.map(x => [x.meeting_id,x]));
          const semanticNonTargets = (arr) => arr.filter(x => !ids.has(x.meeting_id));
          if (JSON.stringify(semanticNonTargets(beforeCM.meetings ?? [])) !== JSON.stringify(semanticNonTargets(afterCM.meetings ?? []))) throw new Error('non-target canonical meetings changed');
          if (JSON.stringify(semanticNonTargets(beforeCD.details ?? [])) !== JSON.stringify(semanticNonTargets(afterCD.details ?? []))) throw new Error('non-target canonical details changed');
          if (JSON.stringify(semanticNonTargets(beforePM.meetings ?? beforePM.records ?? [])) !== JSON.stringify(semanticNonTargets(afterPM.meetings ?? afterPM.records ?? []))) throw new Error('non-target public meetings changed');
          if (JSON.stringify(semanticNonTargets(beforePD.details ?? beforePD.records ?? [])) !== JSON.stringify(semanticNonTargets(afterPD.details ?? afterPD.records ?? []))) throw new Error('non-target public details changed');
          if ((beforeCM.meetings ?? []).length !== (afterCM.meetings ?? []).length) throw new Error('canonical meeting count changed');
          if ((beforePM.meetings ?? beforePM.records ?? []).length !== (afterPM.meetings ?? afterPM.records ?? []).length) throw new Error('public meeting count changed');
          const cm = mapById(afterCM.meetings ?? []);
          const cd = mapById(afterCD.details ?? []);
          const pm = mapById(afterPM.meetings ?? afterPM.records ?? []);
          const pd = mapById(afterPD.details ?? afterPD.records ?? []);
          for (const id of ids) {
            if (cm.get(id)?.capability_rank !== 'A') throw new Error(`${id} canonical rank is not A`);
            const publicRank = pm.get(id)?.effective_rank ?? pm.get(id)?.capability_rank ?? pm.get(id)?.rank;
            if (publicRank !== 'A') throw new Error(`${id} public rank is not A: ${publicRank}`);
            for (const detail of [cd.get(id), pd.get(id)]) {
              if (!detail) throw new Error(`${id} detail missing after promotion`);
              const rows = rowsOf(detail);
              if (rows.length !== 8) throw new Error(`${id} detail row count differs`);
              const times = rows.map((row,i) => {
                const label = row.label ?? row.race_label;
                if (label !== `Race ${i+1}`) throw new Error(`${id} detail labels differ`);
                for (const forbidden of ['race_name','distance_m','surface','course_label','horse','jockey','trainer','odds','result','payout']) {
                  if (row[forbidden] !== undefined && row[forbidden] !== null) throw new Error(`${id} public-boundary field ${forbidden} present`);
                }
                return row.post_time_local;
              });
              if (JSON.stringify(times) !== JSON.stringify(expected.get(id))) throw new Error(`${id} detail schedule differs`);
            }
          }
          console.log(JSON.stringify({ promoted_meeting_ids:[...ids].sort(), target_rank:'A', non_target_changes:0 }, null, 2));
          NODE
          git diff --check

      - name: Retire one-shot workflow and commit bounded output
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/publish-tjk-2026-09-01-two-a-once.yml
          git config user.name 'badjoke-lab'
          git config user.email 'badjoke.lab@gmail.com'
          git add data/candidates/tjk-2026-09-01-two-a-automated-approved.json \
                  data/generated/timetable/canonical/meetings.json \
                  data/generated/timetable/canonical/meeting-details.json \
                  data/generated/timetable/public/meeting-list.json \
                  data/generated/timetable/public/meeting-details.json \
                  .github/workflows/publish-tjk-2026-09-01-two-a-once.yml
          git diff --cached --check
          git commit -m 'Publish Ankara and Kocaeli 2026-09-01 as Rank A'
          git push origin HEAD:publish/tjk-2026-09-01-two-a
