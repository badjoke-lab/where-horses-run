name: Inspect NAR repair projection path once

on:
  push:
    branches:
      - fix/nar-published-race-name-repair
    paths:
      - '.github/workflows/inspect-nar-repair-path-once.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect canonical shapes and projection scripts
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const id = 'nar-kanazawa-racecourse-2026-09-01';
          for (const path of [
            'data/generated/timetable/canonical/meetings.json',
            'data/generated/timetable/canonical/meeting-details.json',
          ]) {
            const data = JSON.parse(fs.readFileSync(path,'utf8'));
            const arr = data.meetings ?? data.details ?? [];
            const row = arr.find((x) => x.meeting_id === id);
            console.log(`=== ${path} ===`);
            console.log(JSON.stringify(row, null, 2));
          }
          NODE
          echo '=== projection path matches ==='
          grep -R -n --exclude-dir=node_modules --exclude='*.json' \
            -E 'public/meeting-details\.json|public/meeting-list\.json|public-timetable-meeting-details-v0|publicationDisplayPolicies' \
            scripts src .github 2>/dev/null | head -200
