name: Calendar NAR continuous retry

on:
  pull_request:
    paths:
      - 'data/static/calendar-due-job-policy-v1.json'
      - 'scripts/check-calendar-nar-continuous-retry.mjs'
      - '.github/workflows/calendar-nar-continuous-retry.yml'
  push:
    branches: [main]
    paths:
      - 'data/static/calendar-due-job-policy-v1.json'
      - 'scripts/check-calendar-nar-continuous-retry.mjs'
      - '.github/workflows/calendar-nar-continuous-retry.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - run: node --check scripts/check-calendar-nar-continuous-retry.mjs
      - run: node scripts/check-calendar-nar-continuous-retry.mjs
      - run: node scripts/check-calendar-due-job-planner.mjs
      - run: git diff --check
