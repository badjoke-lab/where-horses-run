name: Calendar Acquisition Registry

on:
  pull_request:
    paths:
      - 'data/static/calendar-acquisition-registry.schema.json'
      - 'data/static/calendar-acquisition-registry.json'
      - 'data/static/calendar-readiness-japan-v2.json'
      - 'data/static/japan-a-plus-policy.json'
      - 'data/static/authority-source-inventory*.json'
      - 'data/static/calendar-five-rank-classifier-contract-v1.json'
      - 'data/static/timetable-candidate-v1.schema.json'
      - 'data/fixtures/calendar-five-rank-classifier-fixtures-v1.json'
      - 'data/candidates/japan-jra-candidates.json'
      - 'data/candidates/japan-banei-candidates.json'
      - 'data/fixtures/calendar-hkjc-detail-reviewed-import-fixtures-v1.json'
      - 'scripts/timetable/load-calendar-acquisition-registry.mjs'
      - 'scripts/timetable/load-authority-source-inventory.mjs'
      - 'scripts/timetable/five-rank-classifier.mjs'
      - 'scripts/timetable/pipeline-v1/promotion-core.mjs'
      - 'scripts/timetable/normalize-nar-schedule-aware-month.mjs'
      - 'scripts/timetable/collect-nar-monthly-candidates.mjs'
      - 'scripts/timetable/hkjc-detail-reviewed-import-core.mjs'
      - 'scripts/timetable/build-hkjc-detail-reviewed-import-package.mjs'
      - 'scripts/timetable/extract-hkjc-detail-reviewed-import-artifacts.mjs'
      - 'scripts/check-authority-source-inventory-schema.mjs'
      - 'scripts/check-calendar-acquisition-registry.mjs'
      - 'scripts/check-calendar-five-rank-classifier.mjs'
      - 'scripts/check-calendar-hkjc-detail-reviewed-import.mjs'
      - 'scripts/check-calendar-route-runner-policy.mjs'
      - 'scripts/check-calendar-contracts.mjs'
      - 'scripts/check-calendar-runtime-import-boundary.mjs'
      - 'scripts/check-project-governance-docs.mjs'
      - 'docs/calendar/acquisition-control-plane-contract.md'
      - 'docs/calendar/acquisition-registry.md'
      - 'docs/calendar/machine-readable-contracts.md'
      - 'docs/calendar/README.md'
      - '.github/workflows/calendar-acquisition-registry.yml'
  push:
    branches:
      - main
    paths:
      - 'data/static/calendar-acquisition-registry.schema.json'
      - 'data/static/calendar-acquisition-registry.json'
      - 'data/static/calendar-readiness-japan-v2.json'
      - 'data/static/japan-a-plus-policy.json'
      - 'data/static/authority-source-inventory*.json'
      - 'data/static/calendar-five-rank-classifier-contract-v1.json'
      - 'data/static/timetable-candidate-v1.schema.json'
      - 'data/fixtures/calendar-five-rank-classifier-fixtures-v1.json'
      - 'data/candidates/japan-jra-candidates.json'
      - 'data/candidates/japan-banei-candidates.json'
      - 'data/fixtures/calendar-hkjc-detail-reviewed-import-fixtures-v1.json'
      - 'scripts/timetable/load-calendar-acquisition-registry.mjs'
      - 'scripts/timetable/load-authority-source-inventory.mjs'
      - 'scripts/timetable/five-rank-classifier.mjs'
      - 'scripts/timetable/pipeline-v1/promotion-core.mjs'
      - 'scripts/timetable/normalize-nar-schedule-aware-month.mjs'
      - 'scripts/timetable/collect-nar-monthly-candidates.mjs'
      - 'scripts/timetable/hkjc-detail-reviewed-import-core.mjs'
      - 'scripts/timetable/build-hkjc-detail-reviewed-import-package.mjs'
      - 'scripts/timetable/extract-hkjc-detail-reviewed-import-artifacts.mjs'
      - 'scripts/check-authority-source-inventory-schema.mjs'
      - 'scripts/check-calendar-acquisition-registry.mjs'
      - 'scripts/check-calendar-five-rank-classifier.mjs'
      - 'scripts/check-calendar-hkjc-detail-reviewed-import.mjs'
      - 'scripts/check-calendar-route-runner-policy.mjs'
      - 'scripts/check-calendar-contracts.mjs'
      - 'scripts/check-calendar-runtime-import-boundary.mjs'
      - 'scripts/check-project-governance-docs.mjs'
      - 'docs/calendar/acquisition-control-plane-contract.md'
      - 'docs/calendar/acquisition-registry.md'
      - 'docs/calendar/machine-readable-contracts.md'
      - 'docs/calendar/README.md'
      - '.github/workflows/calendar-acquisition-registry.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Check Node syntax
        run: |
          node --check scripts/timetable/load-calendar-acquisition-registry.mjs
          node --check scripts/timetable/five-rank-classifier.mjs
          node --check scripts/timetable/hkjc-detail-reviewed-import-core.mjs
          node --check scripts/timetable/build-hkjc-detail-reviewed-import-package.mjs
          node --check scripts/timetable/extract-hkjc-detail-reviewed-import-artifacts.mjs
          node --check scripts/check-calendar-acquisition-registry.mjs
          node --check scripts/check-calendar-five-rank-classifier.mjs
          node --check scripts/check-calendar-hkjc-detail-reviewed-import.mjs
          node --check scripts/check-calendar-contracts.mjs

      - name: Validate Acquisition Registry contract and current profiles
        run: node scripts/check-calendar-acquisition-registry.mjs

      - name: Validate five-rank acquisition classifier
        run: node scripts/check-calendar-five-rank-classifier.mjs

      - name: Validate authority/source compatibility
        run: node scripts/check-authority-source-inventory-schema.mjs

      - name: Validate HKJC reviewed-import contract
        run: |
          node scripts/check-calendar-hkjc-detail-reviewed-import.mjs
          node scripts/check-calendar-route-runner-policy.mjs

      - name: Validate Calendar contracts and governance
        run: |
          node scripts/check-calendar-contracts.mjs
          node scripts/check-project-governance-docs.mjs

      - name: Validate runtime import boundary
        run: node scripts/check-calendar-runtime-import-boundary.mjs

      - name: Check diff formatting
        run: git diff --check
