name: Argentina La Plata live bilingual production probe

on:
  pull_request:
    paths:
      - '.github/workflows/calendar-argentina-la-plata-live-publication-probe.yml'
      - 'scripts/timetable/check-argentina-la-plata-live-publication.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-deployed:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify main public JSON and deployed English/Japanese Calendar
        run: node scripts/timetable/check-argentina-la-plata-live-publication.mjs
