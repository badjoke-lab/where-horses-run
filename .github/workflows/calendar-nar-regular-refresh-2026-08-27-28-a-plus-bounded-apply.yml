name: Calendar NAR complete-detail canonical classification

on:
  pull_request:
    paths:
      - '.github/workflows/calendar-nar-regular-refresh-2026-08-27-28-a-plus-bounded-apply.yml'
      - 'scripts/timetable/build-calendar-nar-regular-refresh-2026-08-27-through-2026-08-28-a-plus-approved-candidates.mjs'

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact review head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Checkout exact daily-review source evidence
        uses: actions/checkout@v4
        with:
          ref: c83090d2114c745f631d6875dd9dccec0d385cf0
          path: review-source
          sparse-checkout: |
            data/candidates/nar-incremental-batches/due-job-plan-2026-08-24-due-japan-nar-regular-refresh-001-run-001/batch.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Classify all 13 complete-detail candidates against current canonical
        env:
          WHR_NAR_REVIEW_BATCH: ${{ github.workspace }}/review-source/data/candidates/nar-incremental-batches/due-job-plan-2026-08-24-due-japan-nar-regular-refresh-001-run-001/batch.json
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const batch = JSON.parse(fs.readFileSync(process.env.WHR_NAR_REVIEW_BATCH, 'utf8'));
          const canonical = JSON.parse(fs.readFileSync('data/generated/timetable/canonical/meetings.json', 'utf8'));
          const details = JSON.parse(fs.readFileSync('data/generated/timetable/canonical/meeting-details.json', 'utf8'));
          if ((batch.detail_candidates ?? []).length !== 13) throw new Error(`expected 13 complete-detail candidates, got ${batch.detail_candidates?.length}`);
          const meetingById = new Map(canonical.meetings.map((row) => [row.meeting_id, row]));
          const detailById = new Map(details.details.map((row) => [row.meeting_id, row]));
          const projectRows = (rows = []) => rows.map((row) => ({
            label: row.label,
            post_time_local: row.post_time_local,
            race_name: row.race_name,
            distance_m: row.distance_m,
            surface: row.surface,
            course_label: row.course_label,
          }));

          const statuses = batch.detail_candidates.map((candidate) => {
            const id = candidate.candidate_id;
            const meeting = meetingById.get(id);
            const detail = detailById.get(id);
            const sourceRows = projectRows(candidate.timetable_rows);
            const canonicalRows = projectRows(detail?.timetable_rows);
            const first = sourceRows[0]?.post_time_local ?? null;
            const last = sourceRows.at(-1)?.post_time_local ?? null;
            const firstSame = meeting?.first_race_time_local === first;
            const lastSame = meeting?.last_race_time_local === last;
            const rowsSame = JSON.stringify(canonicalRows) === JSON.stringify(sourceRows);
            const exactNoop = meeting?.capability_rank === 'A+' && detail?.capability_rank === 'A+' && firstSame && lastSame && rowsSame;
            return {
              id,
              date: candidate.date,
              current_rank: meeting?.capability_rank ?? null,
              detail_rank: detail?.capability_rank ?? null,
              current_first: meeting?.first_race_time_local ?? null,
              source_first: first,
              current_last: meeting?.last_race_time_local ?? null,
              source_last: last,
              source_rows: sourceRows.length,
              canonical_rows: canonicalRows.length,
              first_same: firstSame,
              last_same: lastSame,
              rows_same: rowsSame,
              classification: exactNoop ? 'verified_noop' : 'promotion_delta',
            };
          }).sort((a, b) => a.id.localeCompare(b.id));

          const verifiedNoop = statuses.filter((row) => row.classification === 'verified_noop').map((row) => row.id);
          const promotionDelta = statuses.filter((row) => row.classification === 'promotion_delta').map((row) => row.id);
          console.log(`NAR_CANONICAL_CLASSIFICATION=${JSON.stringify(statuses)}`);
          console.log(`NAR_VERIFIED_NOOP=${JSON.stringify(verifiedNoop)}`);
          console.log(`NAR_PROMOTION_DELTA=${JSON.stringify(promotionDelta)}`);
          console.log(`NAR_CLASSIFICATION_COUNTS=${JSON.stringify({ complete: statuses.length, verified_noop: verifiedNoop.length, promotion_delta: promotionDelta.length })}`);
          NODE
