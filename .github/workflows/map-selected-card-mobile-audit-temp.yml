name: Temporary map selected-card mobile audit

on:
  pull_request:

permissions:
  contents: read

jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install and build exact feature head
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Start built site
        shell: bash
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4321 >/tmp/whr-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4321/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/whr-preview.log
          exit 1
      - name: Diagnose and audit selected-card mobile flows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/map-selected-card-mobile /tmp/pw-map-selected-card-mobile
          cd /tmp/pw-map-selected-card-mobile
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          node <<'NODE'
          const fs = require('node:fs');
          const { chromium, devices } = require('playwright');
          const base = 'http://127.0.0.1:4321';
          const out = '/tmp/map-selected-card-mobile';
          const report = [];
          const inViewport = (el) => { const r = el.getBoundingClientRect(); return r.bottom > 0 && r.top < window.innerHeight; };
          const actionSizes = async (card) => card.locator('a:visible,button:visible').evaluateAll(nodes => nodes.map(n => ({text:(n.textContent||'').trim(),height:n.getBoundingClientRect().height,width:n.getBoundingClientRect().width})));

          (async () => {
            const browser = await chromium.launch({ headless:true });
            try {
              const mobile = await browser.newContext({ ...devices['iPhone 13'] });

              // Today diagnostics + flow.
              {
                const page = await mobile.newPage();
                const errors=[]; const consoleErrors=[];
                page.on('pageerror', e => errors.push(String(e)));
                page.on('console', m => { if (m.type()==='error') consoleErrors.push(m.text()); });
                const response = await page.goto(base + '/ja/today/?tz=Asia%2FTokyo', {waitUntil:'domcontentloaded',timeout:60000});
                if (!response || response.status() !== 200) throw new Error(`today HTTP ${response?.status()}`);
                await page.waitForTimeout(1500);
                const diag = await page.evaluate(() => {
                  const rows=[...document.querySelectorAll('[data-calendar-meeting-row]')].map(r=>({id:r.getAttribute('data-meeting-id'),hidden:r.hidden,tzHidden:r.getAttribute('data-timezone-scope-hidden'),racecourse:r.getAttribute('data-racecourse')}));
                  const node=document.querySelector('[data-today-map-meeting-map]');
                  let mapping=[]; try { mapping=JSON.parse(node?.textContent||'[]'); } catch {}
                  return {hasTodayMap:!!document.querySelector('[data-today-map-sync]'), rows, mapping, mapButtons:document.querySelectorAll('[data-meeting-map-focus]').length, bodyText:(document.body.innerText||'').slice(0,2500)};
                });
                console.log('TODAY_DIAG '+JSON.stringify({hasTodayMap:diag.hasTodayMap,rowCount:diag.rows.length,mapButtons:diag.mapButtons,mappingCount:diag.mapping.length,mappedReviewed:diag.mapping.filter(x=>x.hasReviewedLocation).length,errors,consoleErrors}));
                fs.writeFileSync(`${out}/today-diag.json`, JSON.stringify({...diag,errors,consoleErrors},null,2));
                await page.screenshot({path:`${out}/today-diag.png`,fullPage:true});
                if (errors.length) throw new Error(`today runtime errors: ${errors.join(' | ')}`);
                if (!diag.hasTodayMap) throw new Error('today map component absent');

                const eligible = diag.mapping.find(entry => entry?.hasReviewedLocation && diag.rows.some(r => r.id===entry.meetingId && !r.hidden && r.tzHidden!=='true'));
                if (!eligible) throw new Error(`today has no visible reviewed row; rows=${diag.rows.length}, mapped=${diag.mapping.filter(x=>x.hasReviewedLocation).length}`);
                const row = page.locator(`[data-calendar-meeting-row][data-meeting-id="${eligible.meetingId}"]`);
                await page.waitForFunction((id)=>document.querySelector(`[data-calendar-meeting-row][data-meeting-id="${id}"] [data-meeting-map-focus]`)!=null, eligible.meetingId, {timeout:10000});
                const rowButton=row.locator('[data-meeting-map-focus]');
                await rowButton.click();
                const section=page.locator('[data-today-map-sync]'); const mapRoot=section.locator('[data-racecourse-map]');
                await page.waitForFunction(()=>document.querySelector('[data-today-map-sync] [data-racecourse-map]')?.getAttribute('data-map-state')==='ready',null,{timeout:60000});
                await page.waitForFunction(id=>document.querySelector('[data-today-map-sync] [data-racecourse-map]')?.getAttribute('data-selected-racecourse-id')===id,eligible.racecourseId,{timeout:10000});
                await page.waitForTimeout(500);
                if (!(await section.evaluate(inViewport))) throw new Error('today List→Map did not bring map into viewport');
                const card=page.locator('[data-today-map-selected]'); await card.waitFor({state:'visible',timeout:10000});
                const meta=await card.locator('[data-today-map-selected-meta]').textContent(); const key=await card.locator('[data-today-map-selected-status]').getAttribute('data-status'); const href=await card.locator('[data-today-map-selected-track]:visible').getAttribute('href'); const sizes=await actionSizes(card);
                if (!['running','upcoming','ended','future'].includes(key||'')) throw new Error(`today bad status ${key}`);
                if (!meta?.includes('公開ランク')) throw new Error(`today rank missing ${meta}`);
                if (!href?.startsWith('/ja/tracks/')) throw new Error(`today track link missing ${href}`);
                if (sizes.some(s=>s.height<43.5)) throw new Error(`today <44px action ${JSON.stringify(sizes)}`);
                await card.locator('[data-today-map-close]').click(); await page.waitForTimeout(200);
                if (await card.isVisible()) throw new Error('today close did not hide card');
                if (await mapRoot.getAttribute('data-selected-racecourse-id')) throw new Error('today close did not clear pin selection');
                await section.scrollIntoViewIfNeeded(); const y0=await page.evaluate(()=>scrollY);
                await mapRoot.evaluate((el,id)=>el.dispatchEvent(new CustomEvent('racecourse-map:select',{bubbles:true,detail:{racecourseId:id}})),eligible.racecourseId);
                await card.waitFor({state:'visible',timeout:10000}); await page.waitForTimeout(200); const y1=await page.evaluate(()=>scrollY);
                if (Math.abs(y1-y0)>20) throw new Error(`today pin tap auto-scrolled ${y1-y0}px`);
                await card.locator('[data-today-map-show-list]').click(); await page.waitForTimeout(650);
                if (!(await row.evaluate(inViewport))) throw new Error('today Show in List did not reveal row');
                report.push({case:'today-ja-mobile',racecourseId:eligible.racecourseId,key,meta,href,sizes,pinScrollDelta:y1-y0,errors,consoleErrors});
                await page.close();
              }

              // Calendar mobile List -> Map -> List -> close.
              {
                const page=await mobile.newPage(); const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
                await page.goto(base+'/ja/calendar/?tz=Asia%2FTokyo',{waitUntil:'domcontentloaded',timeout:60000}); await page.waitForTimeout(700);
                const mapping=await page.locator('[data-calendar-map-meeting-map]').evaluate(el=>JSON.parse(el.textContent||'[]'));
                const eligible=await page.locator('[data-calendar-meeting-row]').evaluateAll((rows,mapping)=>{ for(const row of rows){const id=row.getAttribute('data-meeting-id');const e=mapping.find(x=>x.meetingId===id&&x.hasReviewedLocation);if(e&&!row.hidden&&row.getAttribute('data-timezone-scope-hidden')!=='true') return {meetingId:id,racecourseId:e.racecourseId};} return null;},mapping);
                if(!eligible) throw new Error('calendar no eligible reviewed row');
                const row=page.locator(`[data-calendar-meeting-row][data-meeting-id="${eligible.meetingId}"]`);
                await page.waitForFunction(id=>document.querySelector(`[data-calendar-meeting-row][data-meeting-id="${id}"] [data-calendar-row-map-focus]`)!=null,eligible.meetingId,{timeout:10000});
                await row.locator('[data-calendar-row-map-focus]').click();
                const section=page.locator('[data-calendar-map-switch]'); const root=section.locator('[data-racecourse-map]');
                await page.waitForFunction(()=>document.querySelector('[data-calendar-map-switch]')?.getAttribute('data-calendar-view')==='map',null,{timeout:10000});
                await page.waitForFunction(()=>document.querySelector('[data-calendar-map-switch] [data-racecourse-map]')?.getAttribute('data-map-state')==='ready',null,{timeout:60000});
                await page.waitForFunction(id=>document.querySelector('[data-calendar-map-switch] [data-racecourse-map]')?.getAttribute('data-selected-racecourse-id')===id,eligible.racecourseId,{timeout:10000});
                const card=page.locator('[data-calendar-map-selected]'); await card.waitFor({state:'visible',timeout:10000});
                const meta=await card.locator('[data-calendar-map-selected-meta]').textContent(); const key=await card.locator('[data-calendar-map-selected-status]').getAttribute('data-status'); const href=await card.locator('[data-calendar-map-selected-track]:visible').getAttribute('href'); const sizes=await actionSizes(card);
                if (!meta?.includes('公開ランク')||!['running','upcoming','ended','future'].includes(key||'')||!href?.startsWith('/ja/tracks/')||sizes.some(s=>s.height<43.5)) throw new Error(`calendar card invalid ${JSON.stringify({meta,key,href,sizes})}`);
                await card.locator('[data-calendar-map-show-list]').click(); await page.waitForTimeout(650);
                if((await page.locator('[data-calendar-view-list]').getAttribute('aria-pressed'))!=='true'||!(await row.evaluate(inViewport))) throw new Error('calendar Show in List failed');
                await row.locator('[data-calendar-row-map-focus]').click(); await card.waitFor({state:'visible',timeout:10000}); await card.locator('[data-calendar-map-close]').click(); await page.waitForTimeout(200);
                if(await card.isVisible()||await root.getAttribute('data-selected-racecourse-id')) throw new Error('calendar close failed');
                if(errors.length) throw new Error(`calendar runtime errors: ${errors.join(' | ')}`);
                await page.screenshot({path:`${out}/calendar-ja-mobile.png`,fullPage:true}); report.push({case:'calendar-ja-mobile',...eligible,key,meta,href,sizes,errors}); await page.close();
              }

              // Home period URL round-trip.
              {
                const page=await mobile.newPage(); const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
                await page.goto(base+'/ja/?tz=Asia%2FTokyo',{waitUntil:'domcontentloaded',timeout:60000}); const tomorrow=page.locator('[data-home-map-period="tomorrow"]'); await tomorrow.click();
                if(new URL(page.url()).searchParams.get('period')!=='tomorrow') throw new Error('home period URL missing'); await page.reload({waitUntil:'domcontentloaded'});
                if((await page.locator('[data-home-map-period="tomorrow"]').getAttribute('aria-pressed'))!=='true') throw new Error('home period did not survive reload'); await page.locator('[data-home-map-period="today"]').click();
                if(new URL(page.url()).searchParams.has('period')) throw new Error('home today should remove period param'); if(errors.length) throw new Error(`home runtime errors: ${errors.join(' | ')}`);
                await page.screenshot({path:`${out}/home-ja-mobile.png`,fullPage:true}); report.push({case:'home-ja-mobile',roundTrip:true,errors}); await page.close();
              }
              await mobile.close();
            } finally { await browser.close(); }
            fs.writeFileSync(`${out}/report.json`,JSON.stringify(report,null,2));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-selected-card-mobile-audit
          path: /tmp/map-selected-card-mobile
          if-no-files-found: warn
          retention-days: 1
