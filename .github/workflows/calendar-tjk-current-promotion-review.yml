name: Calendar TJK current promotion review

on:
  pull_request:
    paths:
      - 'data/candidates/tjk-current-2026-08-11-promotion-review-v1.json'
      - 'data/candidates/tjk-current-bounded-2026-08-11-v1.json'
      - 'data/static/racecourses-public-timetable-identities-v1.json'
      - 'docs/timetable-source-tests/03-turkey/implementation-status-2026-08-12.json'
      - 'docs/calendar/implementation-roadmap-2026-08-12-addendum.md'
      - 'scripts/timetable/tjk-current-bounded-adapter.mjs'
      - 'scripts/check-tjk-current-bounded-adapter.mjs'
      - 'scripts/check-tjk-current-promotion-review.mjs'
      - 'scripts/check-tjk-current-promotion-review-status.mjs'
      - '.github/workflows/calendar-tjk-current-promotion-review.yml'
  push:
    branches:
      - main
    paths:
      - 'data/candidates/tjk-current-2026-08-11-promotion-review-v1.json'
      - 'data/candidates/tjk-current-bounded-2026-08-11-v1.json'
      - 'data/static/racecourses-public-timetable-identities-v1.json'
      - 'docs/timetable-source-tests/03-turkey/implementation-status-2026-08-12.json'
      - 'docs/calendar/implementation-roadmap-2026-08-12-addendum.md'
      - 'scripts/timetable/tjk-current-bounded-adapter.mjs'
      - 'scripts/check-tjk-current-bounded-adapter.mjs'
      - 'scripts/check-tjk-current-promotion-review.mjs'
      - 'scripts/check-tjk-current-promotion-review-status.mjs'
      - '.github/workflows/calendar-tjk-current-promotion-review.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Preserve deterministic current TJK candidate
        run: node scripts/check-tjk-current-bounded-adapter.mjs
      - name: Validate pending human-review packet binding
        run: node scripts/check-tjk-current-promotion-review.mjs
      - name: Validate pending promotion-review implementation status
        run: node scripts/check-tjk-current-promotion-review-status.mjs
      - name: Prove review-only PR boundary
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
          echo "$changed"
          if echo "$changed" | grep -E '^data/generated/timetable/(canonical|public)/'; then
            echo 'TJK pending review PR must not write Canonical/public timetable data.' >&2
            exit 1
          fi
          if echo "$changed" | grep -E '^data/static/racecourses-public-timetable-identities-v1.json$'; then
            echo 'TJK pending review PR must not register public racecourse identities.' >&2
            exit 1
          fi
      - name: Prove repository clean
        run: |
          changes="$(git status --porcelain --untracked-files=all)"
          if [ -n "$changes" ]; then
            echo "$changes" >&2
            exit 1
          fi
