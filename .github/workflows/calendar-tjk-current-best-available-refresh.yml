name: Calendar TJK zero-based 30-day refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
  push:
    branches:
      - main
      - feat/tjk-zero-based-30d-publication
    paths:
      - 'scripts/timetable/tjk-current-future-candidates.mjs'
      - 'scripts/timetable/tjk-annual-fixture-discovery.mjs'
      - 'scripts/timetable/run-tjk-current-best-available.mjs'
      - 'scripts/timetable/apply-tjk-zero-based-30d.mjs'
      - 'scripts/timetable/dedupe-racecourse-public-identities.mjs'
      - 'scripts/timetable/project-tjk-zero-based-public.mjs'
      - 'scripts/check-tjk-current-future-candidates.mjs'
      - 'scripts/check-tjk-zero-based-30d.mjs'
      - 'data/static/calendar-acquisition-registry.json'
      - '.github/workflows/calendar-tjk-current-best-available-refresh.yml'
  pull_request:
    paths:
      - 'scripts/timetable/tjk-current-future-candidates.mjs'
      - 'scripts/timetable/tjk-annual-fixture-discovery.mjs'
      - 'scripts/timetable/run-tjk-current-best-available.mjs'
      - 'scripts/timetable/apply-tjk-zero-based-30d.mjs'
      - 'scripts/timetable/dedupe-racecourse-public-identities.mjs'
      - 'scripts/timetable/project-tjk-zero-based-public.mjs'
      - 'scripts/check-tjk-current-future-candidates.mjs'
      - 'scripts/check-tjk-zero-based-30d.mjs'
      - '.github/workflows/calendar-tjk-current-best-available-refresh.yml'

permissions:
  contents: write

concurrency:
  group: calendar-tjk-zero-based-30d-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acquire-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Validate TJK acquisition and publication code
        run: |
          node --check scripts/timetable/tjk-current-future-candidates.mjs
          node --check scripts/timetable/tjk-annual-fixture-discovery.mjs
          node --check scripts/timetable/run-tjk-current-best-available.mjs
          node --check scripts/timetable/apply-tjk-zero-based-30d.mjs
          node --check scripts/timetable/dedupe-racecourse-public-identities.mjs
          node --check scripts/timetable/project-tjk-zero-based-public.mjs
          node --check scripts/check-tjk-current-future-candidates.mjs
          node --check scripts/check-tjk-zero-based-30d.mjs

      - name: Acquire official TJK 30-day mother set
        run: |
          rm -rf artifacts/tjk-current-best-available
          node scripts/timetable/run-tjk-current-best-available.mjs \
            --days=30 \
            --output=artifacts/tjk-current-best-available/candidates.json

      - name: Validate official candidate boundary
        run: node scripts/check-tjk-current-future-candidates.mjs artifacts/tjk-current-best-available/candidates.json

      - name: Apply zero-based TJK 30-day mother set
        run: |
          node scripts/timetable/apply-tjk-zero-based-30d.mjs \
            --input=artifacts/tjk-current-best-available/candidates.json \
            --output=data/generated/timetable/tjk-zero-based-30d-reconciliation.json
          node scripts/timetable/dedupe-racecourse-public-identities.mjs
          node scripts/timetable/project-tjk-zero-based-public.mjs data/generated/timetable/tjk-zero-based-30d-reconciliation.json
          node scripts/check-tjk-zero-based-30d.mjs data/generated/timetable/tjk-zero-based-30d-reconciliation.json

      - name: Persist generated TJK timetable state
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/static/racecourses-public-timetable-identities-v1.json \
            data/generated/timetable/canonical/meetings.json \
            data/generated/timetable/canonical/meeting-details.json \
            data/generated/timetable/public/meeting-list.json \
            data/generated/timetable/public/meeting-details.json \
            data/generated/timetable/public/japan-a-plus-overrides.json \
            data/generated/timetable/tjk-zero-based-30d-reconciliation.json
          if git diff --cached --quiet; then
            echo "No TJK timetable changes to persist."
          else
            git commit -m "data: refresh TJK official 30-day timetable"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Validate generated site state
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run build

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tjk-zero-based-30d-${{ github.run_id }}
          path: |
            artifacts/tjk-current-best-available/candidates.json
            data/generated/timetable/tjk-zero-based-30d-reconciliation.json
            data/generated/timetable/canonical/meetings.json
            data/generated/timetable/canonical/meeting-details.json
            data/generated/timetable/public/meeting-list.json
            data/generated/timetable/public/meeting-details.json
          retention-days: 7
