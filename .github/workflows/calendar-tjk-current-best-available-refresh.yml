name: Calendar TJK current best-available refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
  push:
    branches:
      - main
    paths:
      - 'scripts/timetable/tjk-current-future-candidates.mjs'
      - 'scripts/timetable/tjk-annual-fixture-discovery.mjs'
      - 'scripts/timetable/run-tjk-current-best-available.mjs'
      - 'scripts/check-tjk-current-future-candidates.mjs'
      - 'data/static/calendar-acquisition-registry.json'
      - '.github/workflows/calendar-tjk-current-best-available-refresh.yml'

permissions:
  contents: read

concurrency:
  group: calendar-tjk-current-best-available-refresh
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Validate TJK acquisition code
        run: |
          node --check scripts/timetable/tjk-current-future-candidates.mjs
          node --check scripts/timetable/tjk-annual-fixture-discovery.mjs
          node --check scripts/timetable/run-tjk-current-best-available.mjs
          node --check scripts/check-tjk-current-future-candidates.mjs

      - name: Acquire current 30-day TJK best available candidates
        run: |
          rm -rf artifacts/tjk-current-best-available
          node scripts/timetable/run-tjk-current-best-available.mjs \
            --days=30 \
            --output=artifacts/tjk-current-best-available/candidates.json

      - name: Validate candidate boundary
        run: node scripts/check-tjk-current-future-candidates.mjs artifacts/tjk-current-best-available/candidates.json

      - name: Write review-only summary
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const p = 'artifacts/tjk-current-best-available/candidates.json';
          const a = JSON.parse(fs.readFileSync(p, 'utf8'));
          const summary = {
            generated_at: a.retrieved_at,
            window: a.window,
            official_fixture_count: a.discovery.official_fixture_count,
            candidate_count: a.candidates.length,
            rank_counts: a.discovery.rank_counts,
            detail_status_counts: a.discovery.detail_status_counts,
            schedule_source_id: a.discovery.schedule_source_id,
            schedule_source_url: a.discovery.schedule_source_url,
            meetings: a.candidates.map((x) => ({
              candidate_id: x.candidate_id,
              date: x.date,
              racecourse: x.racecourse,
              racecourse_source_id: x.racecourse_source_id,
              capability_rank: x.capability_rank,
              first_race_time_local: x.first_race_time_local,
              last_race_time_local: x.last_race_time_local,
              detail_status: x.detail_observation.status,
              source_url: x.source_url,
            })),
            publication_effect: 'none',
            requires_review: true,
          };
          fs.writeFileSync('artifacts/tjk-current-best-available/summary.json', JSON.stringify(summary, null, 2) + '\n');
          console.log(JSON.stringify(summary, null, 2));
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: tjk-current-best-available-${{ github.run_id }}
          path: artifacts/tjk-current-best-available
          retention-days: 7
