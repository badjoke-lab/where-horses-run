name: HRI racecard route probe

on:
  pull_request:
    paths:
      - 'scripts/probe-hri-racecard-route.mjs'
      - '.github/workflows/hri-racecard-route-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Probe HRI public racecard route
        run: node scripts/probe-hri-racecard-route.mjs
