name: Calendar Australia Victoria 2026-27 additional venue probe

on:
  pull_request:
    paths:
      - '.github/workflows/calendar-australia-victoria-venues-2026-27-probe.yml'
      - 'scripts/timetable/probe-australia-victoria-venues-2026-27.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  venue-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: node scripts/timetable/probe-australia-victoria-venues-2026-27.mjs
