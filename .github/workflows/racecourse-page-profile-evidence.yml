name: Racecourse page profile evidence

on:
  pull_request:
    paths:
      - 'data/audits/racecourse-page-profile-evidence-v1.json'
      - 'data/static/racecourse-profile-evidence-japan-v1.json'
      - 'data/static/racecourses*.json'
      - 'docs/racecourses/profile-evidence.md'
      - 'scripts/check-racecourse-page-profile-evidence.mjs'
      - 'src/lib/data.ts'
      - 'src/pages/tracks/**'
      - 'src/pages/ja/tracks/**'
      - '.github/workflows/racecourse-page-profile-evidence.yml'
  push:
    branches:
      - main
    paths:
      - 'data/audits/racecourse-page-profile-evidence-v1.json'
      - 'data/static/racecourse-profile-evidence-japan-v1.json'
      - 'data/static/racecourses*.json'
      - 'docs/racecourses/profile-evidence.md'
      - 'scripts/check-racecourse-page-profile-evidence.mjs'
      - 'src/lib/data.ts'
      - 'src/pages/tracks/**'
      - 'src/pages/ja/tracks/**'
      - '.github/workflows/racecourse-page-profile-evidence.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Validate checker syntax
        run: node --check scripts/check-racecourse-page-profile-evidence.mjs
      - name: Install dependencies without lockfile mutation
        run: npm install --package-lock=false
      - name: Build static site
        run: npm run build
      - name: Validate racecourse profile evidence
        run: node scripts/check-racecourse-page-profile-evidence.mjs
      - name: Validate read-only boundary
        run: |
          git diff --check
          changes="$(git status --porcelain --untracked-files=all)"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            echo 'Racecourse profile evidence validation modified repository files.' >&2
            exit 1
          fi
