name: NAR 2026-08-26 latest no-op audit once

on:
  push:
    branches:
      - ops/nar-2026-08-26-latest-noop-audit
    paths:
      - '.github/workflows/nar-2026-08-26-latest-noop-audit-once.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main-based audit branch
        uses: actions/checkout@v4

      - name: Checkout exact review-queue source head
        uses: actions/checkout@v4
        with:
          repository: badjoke-lab/where-horses-run
          ref: fa46dde30ea0faa4ad1e9a152846547b649c2702
          path: review-source

      - name: Compare latest NAR complete details with current canonical
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const sourcePath = 'review-source/data/candidates/nar-incremental-batches/due-job-plan-2026-08-26-due-japan-nar-regular-refresh-001-run-001/batch.json';
          const batch = JSON.parse(fs.readFileSync(sourcePath, 'utf8'));
          const canonical = JSON.parse(fs.readFileSync('data/generated/timetable/canonical/meetings.json', 'utf8'));
          const details = JSON.parse(fs.readFileSync('data/generated/timetable/canonical/meeting-details.json', 'utf8'));

          const expectedIds = [
            'nar-funabashi-racecourse-2026-08-27',
            'nar-funabashi-racecourse-2026-08-28',
            'nar-kasamatsu-racecourse-2026-08-27',
            'nar-kasamatsu-racecourse-2026-08-28',
            'nar-monbetsu-racecourse-2026-08-27',
            'nar-sonoda-racecourse-2026-08-27',
            'nar-sonoda-racecourse-2026-08-28',
          ].sort();

          const assert = (condition, message) => { if (!condition) throw new Error(message); };
          const publicRows = (candidate) => (candidate.timetable_rows ?? []).map((row) => ({
            label: row.label,
            post_time_local: row.post_time_local,
            race_name: row.race_name,
            distance_m: row.distance_m,
            surface: row.surface,
            course_label: row.course_label,
          }));
          const canonicalRows = (detail) => (detail?.timetable_rows ?? []).map((row) => ({
            label: row.label,
            post_time_local: row.post_time_local,
            race_name: row.race_name,
            distance_m: row.distance_m,
            surface: row.surface,
            course_label: row.course_label,
          }));

          assert(batch.schema_version === 'nar-incremental-batch-v2', 'unexpected source schema');
          assert(batch.generated_at === '2026-08-26T04:06:25.337Z', 'source generated_at differs');
          assert(batch.requested_scope?.start_date === '2026-08-27', 'source start differs');
          assert(batch.requested_scope?.end_date_exclusive === '2026-09-10', 'source end differs');
          assert((batch.scheduled_meetings ?? []).length === 48, 'scheduled count differs');
          assert((batch.detail_candidates ?? []).length === 7, 'complete-detail count differs');
          assert((batch.schedule_candidates ?? []).length === 41, 'schedule-only count differs');
          assert((batch.detail_blockers ?? []).length === 41, 'blocker count differs');
          assert((batch.schedule_errors ?? []).length === 0, 'schedule errors differ');
          assert(batch.review?.promotion_eligible === false, 'acquisition must remain promotion-ineligible');
          assert(batch.review?.canonical_write === 'disabled', 'canonical write boundary differs');
          assert(batch.review?.public_write === 'disabled', 'public write boundary differs');

          const actualIds = batch.detail_candidates.map((row) => row.candidate_id).sort();
          assert(JSON.stringify(actualIds) === JSON.stringify(expectedIds), `complete-detail IDs differ: ${JSON.stringify(actualIds)}`);

          const meetingById = new Map(canonical.meetings.map((row) => [row.meeting_id, row]));
          const detailById = new Map(details.details.map((row) => [row.meeting_id, row]));

          for (const candidate of batch.detail_candidates) {
            assert(candidate.candidate_rank === 'A+', `${candidate.candidate_id} source rank differs`);
            assert(candidate.meeting_completeness?.all_a_plus_fields_complete === true, `${candidate.candidate_id} source not complete`);
            const rows = publicRows(candidate);
            assert(rows.length === candidate.meeting_completeness?.expected_race_count, `${candidate.candidate_id} row count differs`);
            const meeting = meetingById.get(candidate.candidate_id);
            const detail = detailById.get(candidate.candidate_id);
            assert(meeting?.capability_rank === 'A+', `${candidate.candidate_id} canonical meeting not A+`);
            assert(detail?.capability_rank === 'A+', `${candidate.candidate_id} canonical detail not A+`);
            assert(meeting.first_race_time_local === rows[0].post_time_local, `${candidate.candidate_id} first time changed`);
            assert(meeting.last_race_time_local === rows.at(-1).post_time_local, `${candidate.candidate_id} last time changed`);
            assert(JSON.stringify(canonicalRows(detail)) === JSON.stringify(rows), `${candidate.candidate_id} public-safe timetable content changed`);
          }

          console.log(JSON.stringify({
            source_head: 'fa46dde30ea0faa4ad1e9a152846547b649c2702',
            source_generated_at: batch.generated_at,
            requested_scope: batch.requested_scope,
            scheduled_meetings: batch.scheduled_meetings.length,
            complete_detail_candidates: batch.detail_candidates.length,
            verified_current_noops: batch.detail_candidates.length,
            promotion_delta: 0,
            schedule_only_candidates: batch.schedule_candidates.length,
            detail_blockers: batch.detail_blockers.length,
            schedule_errors: batch.schedule_errors.length,
            publication_effect: 'none',
            canonical_write: false,
            public_write: false,
          }, null, 2));
          NODE
