name: Country page metadata gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'astro.config.mjs'
      - 'data/audits/country-page-metadata-v1.json'
      - 'data/static/country-page-metadata-contract-v1.json'
      - 'docs/seo/country-page-metadata.md'
      - 'scripts/check-country-page-metadata.mjs'
      - 'scripts/country-page-metadata-integration.mjs'
      - '.github/workflows/country-page-metadata.yml'
      - '.github/workflows/temporary-country-page-metadata-discovery.yml'
  push:
    branches:
      - main
    paths:
      - 'astro.config.mjs'
      - 'data/audits/country-page-metadata-v1.json'
      - 'data/static/country-page-metadata-contract-v1.json'
      - 'docs/seo/country-page-metadata.md'
      - 'scripts/check-country-page-metadata.mjs'
      - 'scripts/country-page-metadata-integration.mjs'
      - '.github/workflows/country-page-metadata.yml'
      - '.github/workflows/temporary-country-page-metadata-discovery.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install dependencies without generating a lockfile
        run: npm install --package-lock=false
      - name: Build complete static site
        run: npm run build
      - name: Preserve Phase 10 UX release contract
        run: node scripts/check-ux-polish-release.mjs
      - name: Preserve sitemap and robots contract
        run: node scripts/check-sitemap-robots.mjs
      - name: Preserve structured data baseline
        run: node scripts/check-structured-data-baseline.mjs
      - name: Preserve country profile runtime
        run: node scripts/check-country-detail-profile-runtime.mjs
      - name: Preserve country page programme
        run: node scripts/check-country-page-programme.mjs
      - name: Validate country page metadata
        run: node scripts/check-country-page-metadata.mjs
      - name: Prove repository clean
        run: |
          changes="$(git status --porcelain --untracked-files=all)"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            exit 1
          fi
