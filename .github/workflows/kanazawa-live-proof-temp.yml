name: Temporary Kanazawa official calendar live proof

on:
  pull_request:
    paths:
      - '.github/workflows/kanazawa-live-proof-temp.yml'
      - 'scripts/timetable/kanazawa-official-30d-discovery.mjs'
      - 'package.json'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install pinned parser dependency
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Run permanent Kanazawa adapter for current 30-day window
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { discoverKanazawaOfficial30d } from './scripts/timetable/kanazawa-official-30d-discovery.mjs';
          const dates = [];
          const cursor = new Date('2026-09-04T00:00:00Z');
          for (let index = 0; index < 30; index += 1) {
            dates.push(cursor.toISOString().slice(0, 10));
            cursor.setUTCDate(cursor.getUTCDate() + 1);
          }
          const result = await discoverKanazawaOfficial30d({ dates });
          console.log(JSON.stringify(result.completeness, null, 2));
          console.log(JSON.stringify(result.meetings, null, 2));
          const expected = [
            'nar-kanazawa-racecourse-2026-09-06',
            'nar-kanazawa-racecourse-2026-09-08',
            'nar-kanazawa-racecourse-2026-09-13',
            'nar-kanazawa-racecourse-2026-09-15',
            'nar-kanazawa-racecourse-2026-09-21',
            'nar-kanazawa-racecourse-2026-09-22',
            'nar-kanazawa-racecourse-2026-09-28',
            'nar-kanazawa-racecourse-2026-09-29',
          ];
          assert.equal(result.completeness.completeness, 'complete');
          assert.equal(result.completeness.failure_count, 0);
          assert.deepEqual(result.meetings.map((row) => row.meeting_id), expected);
          assert.ok(result.completeness.annual_meeting_count > 80);
          const september = result.completeness.monthly_comparisons.find((row) => row.month === '2026-09');
          const october = result.completeness.monthly_comparisons.find((row) => row.month === '2026-10');
          assert.equal(september?.agrees_with_annual, true);
          assert.equal(september?.selected_basis, 'monthly_html');
          assert.deepEqual(october?.monthly_dates, []);
          assert.equal(october?.selected_basis, 'annual_pdf');
          assert.ok(result.meetings.every((row) => row.venue_code === '22' && row.racecourse_id === 'kanazawa-racecourse'));
          NODE
