name: Temporary Kanazawa official calendar live proof

on:
  pull_request:
    paths:
      - '.github/workflows/kanazawa-live-proof-temp.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Inspect official Kanazawa annual PDF geometry
        shell: bash
        run: |
          set -euo pipefail
          pdf='https://www.kanazawakeiba.com/wp-content/uploads/2026/01/R8nenkan.pdf'
          curl -fsSL --retry 3 --retry-delay 2 -A 'Mozilla/5.0 (compatible; WhereHorsesRun/1.0)' "$pdf" -o /tmp/kanazawa.pdf
          echo "PDF bytes=$(wc -c < /tmp/kanazawa.pdf) sha256=$(sha256sum /tmp/kanazawa.pdf | awk '{print $1}')"
          npm install --no-save --no-package-lock --no-audit --no-fund pdfjs-dist@5.4.149 >/dev/null
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { getDocument, OPS } from 'pdfjs-dist/legacy/build/pdf.mjs';
          const mul=(a,b)=>[a[0]*b[0]+a[2]*b[1],a[1]*b[0]+a[3]*b[1],a[0]*b[2]+a[2]*b[3],a[1]*b[2]+a[3]*b[3],a[0]*b[4]+a[2]*b[5]+a[4],a[1]*b[4]+a[3]*b[5]+a[5]];
          const pt=(m,x,y)=>[m[0]*x+m[2]*y+m[4],m[1]*x+m[3]*y+m[5]];
          const bbox=(m,b)=>{const p=[pt(m,b[0],b[1]),pt(m,b[0],b[3]),pt(m,b[2],b[1]),pt(m,b[2],b[3])];const xs=p.map(v=>v[0]),ys=p.map(v=>v[1]);return [Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)].map(v=>+v.toFixed(2));};
          const data=new Uint8Array(fs.readFileSync('/tmp/kanazawa.pdf'));
          const pdf=await getDocument({data,useWorkerFetch:false,isEvalSupported:false}).promise;
          const page=await pdf.getPage(1); const ops=await page.getOperatorList();
          console.log('VIEW', page.view);
          const names=new Map(Object.entries(OPS).map(([k,v])=>[v,k]));
          let ctm=[1,0,0,1,0,0], fill=null, stroke=null, width=null, dash=null; const stack=[];
          const colored=[];
          for(let i=0;i<ops.fnArray.length;i++){
            const name=names.get(ops.fnArray[i])??String(ops.fnArray[i]); const a=ops.argsArray[i];
            if(name==='save'){stack.push({ctm:[...ctm],fill,stroke,width,dash});continue;}
            if(name==='restore'){const s=stack.pop();if(s)({ctm,fill,stroke,width,dash}=s);continue;}
            if(name==='transform'){ctm=mul(ctm,a);continue;}
            if(name==='setFillRGBColor'){fill=a;continue;}
            if(name==='setStrokeRGBColor'){stroke=a;continue;}
            if(name==='setLineWidth'){width=a?.[0]??null;continue;}
            if(name==='setLineDash'){dash=a;continue;}
            if(name!=='constructPath')continue;
            const raw=a?.[2]; if(!raw||raw.length<4)continue;
            const b=bbox(ctm,Array.from(raw)); const w=b[2]-b[0],h=b[3]-b[1];
            const color=JSON.stringify(fill??stroke??[]);
            if(w<2||h<0.4)continue;
            if(color.includes('#000000')||color.includes('#ffffff')||color==='[]'||color==='null')continue;
            colored.push({op:i,bbox:b,w:+w.toFixed(2),h:+h.toFixed(2),fill,stroke,width,dash});
          }
          console.log('COLORED', colored.length);
          for(const row of colored) console.log(JSON.stringify(row));
          NODE
