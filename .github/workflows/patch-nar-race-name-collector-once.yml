name: Patch NAR race-name collector once

on:
  push:
    branches:
      - fix/nar-race-name-category-leak
    paths:
      - .github/workflows/patch-nar-race-name-collector-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/nar-race-name-category-leak
          fetch-depth: 0
      - name: Apply exact collector patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/timetable/collect-nar-monthly-candidates.mjs')
          text = path.read_text()

          old_import = "import { execFileSync } from 'node:child_process';\n"
          new_import = old_import + "import { normalizeNarRaceName } from './nar-race-name-quality.mjs';\n"
          if new_import not in text:
              if old_import not in text:
                  raise SystemExit('expected import anchor missing')
              text = text.replace(old_import, new_import, 1)

          old_anchor = "    const value = compact(match[1]);\n    if (value && !/(出馬表|詳細|オッズ|結果)/.test(value)) return value;"
          new_anchor = "    const value = normalizeNarRaceName(compact(match[1]));\n    if (value && !/(出馬表|詳細|オッズ|結果)/.test(value)) return value;"
          if new_anchor not in text:
              if old_anchor not in text:
                  raise SystemExit('expected race-name anchor missing')
              text = text.replace(old_anchor, new_anchor, 1)

          old_tail = "    .filter((line) => !/(出馬表|オッズ|結果|払戻|映像|予想|投票|変更情報|頭数)/.test(line));\n  return lines.find((line) => line.length >= 2 && line.length <= 120) ?? null;"
          new_tail = "    .filter((line) => !/(出馬表|オッズ|結果|払戻|映像|予想|投票|変更情報|頭数)/.test(line))\n    .map((line) => normalizeNarRaceName(line))\n    .filter(Boolean);\n  return lines.find((line) => line.length >= 2 && line.length <= 120) ?? null;"
          if new_tail not in text:
              if old_tail not in text:
                  raise SystemExit('expected race-name fallback anchor missing')
              text = text.replace(old_tail, new_tail, 1)

          path.write_text(text)
          PY
          node --check scripts/timetable/nar-race-name-quality.mjs
          node --check scripts/timetable/collect-nar-monthly-candidates.mjs
      - name: Commit collector patch
        run: |
          if git diff --quiet; then
            echo 'collector already patched'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/timetable/collect-nar-monthly-candidates.mjs
          git commit -m 'FIX: reject category-only NAR race names in collector'
          git push origin HEAD:fix/nar-race-name-category-leak
