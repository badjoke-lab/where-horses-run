name: Temporary Iwate live proof

on:
  pull_request:
    paths:
      - '.github/workflows/iwate-live-proof-temp.yml'
      - 'scripts/timetable/iwate-official-30d-discovery.mjs'
      - 'scripts/check-iwate-official-30d.mjs'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Inspect live Iwate official meeting blocks
        run: |
          node --input-type=module <<'NODE'
          const urls = [
            'https://www.iwatekeiba.or.jp/calendar/2026_09',
            'https://www.iwatekeiba.or.jp/calendar/2026_10',
          ];
          const requested = new Set(Array.from({ length: 30 }, (_, index) => {
            const d = new Date('2026-09-04T00:00:00Z');
            d.setUTCDate(d.getUTCDate() + index);
            return d.toISOString().slice(0, 10);
          }));
          const pad = (value) => String(value).padStart(2, '0');
          for (const url of urls) {
            const response = await fetch(url, { headers: { 'user-agent': 'Mozilla/5.0 (compatible; WhereHorsesRun/1.0)' } });
            const text = new TextDecoder('utf-8').decode(await response.arrayBuffer());
            if (!response.ok) throw new Error(`${url} -> ${response.status}`);
            const yearMonth = url.match(/(20\d{2})_(\d{2})$/);
            if (!yearMonth) throw new Error(`unexpected month url ${url}`);
            const year = Number(yearMonth[1]);
            const month = Number(yearMonth[2]);
            const rows = [...text.matchAll(/<tr\b[^>]*>[\s\S]*?<\/tr>/gi)].map((match) => match[0]);
            console.log(`URL=${url} rows=${rows.length}`);
            for (let index = 0; index < rows.length; index += 1) {
              const row = rows[index];
              const venueMatch = row.match(/18_c_(miz|mori)\.png/i);
              if (!venueMatch) continue;
              const venue = venueMatch[1].toLowerCase() === 'miz' ? 'mizusawa-racecourse' : 'morioka-racecourse';
              const rowspan = Number(row.match(/rowspan=["']?(\d+)/i)?.[1] ?? 1);
              const block = rows.slice(index, index + rowspan).join('\n');
              const dates = [...block.matchAll(new RegExp(`${month}月(\\d{1,2})日`, 'g'))]
                .map((match) => `${year}-${pad(month)}-${pad(Number(match[1]))}`)
                .filter((date, position, all) => requested.has(date) && all.indexOf(date) === position);
              console.log(JSON.stringify({ venue, rowspan, dates }));
            }
          }
          NODE
