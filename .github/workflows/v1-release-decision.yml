name: v1 release decision gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'data/static/v1-release-decision-v1.json'
      - 'data/audits/v1-release-decision-v1.json'
      - 'docs/release/v1-release-decision.md'
      - 'docs/release/v1-release-notes.md'
      - 'scripts/check-v1-release-decision.mjs'
      - '.github/workflows/v1-release-decision.yml'
      - 'data/static/v1-release-readiness-v1.json'
      - 'data/audits/v1-release-readiness-v1.json'
      - 'data/static/v1-scope-freeze-v1.json'
      - 'data/static/v1-data-audit-v1.json'
      - 'data/static/v1-mobile-qa-v1.json'
      - 'data/static/v1-accessibility-qa-v1.json'
      - 'data/static/v1-performance-qa-v1.json'
      - 'data/static/v1-source-policy-review-v1.json'
      - 'data/static/v1-known-limitations-v1.json'
      - 'scripts/run-v1-performance-qa.mjs'
      - 'scripts/check-v1-performance-qa.mjs'
      - 'scripts/check-v1-release-readiness.mjs'
      - 'README.md'
      - 'START-HERE.md'
      - 'docs/project-roadmap.md'
      - 'src/**'
      - 'public/**'
      - 'astro.config.mjs'
  push:
    branches:
      - main
    paths:
      - 'data/static/v1-release-decision-v1.json'
      - 'data/audits/v1-release-decision-v1.json'
      - 'docs/release/v1-release-decision.md'
      - 'docs/release/v1-release-notes.md'
      - 'scripts/check-v1-release-decision.mjs'
      - '.github/workflows/v1-release-decision.yml'
      - 'data/static/v1-release-readiness-v1.json'
      - 'data/audits/v1-release-readiness-v1.json'
      - 'data/static/v1-scope-freeze-v1.json'
      - 'data/static/v1-data-audit-v1.json'
      - 'data/static/v1-mobile-qa-v1.json'
      - 'data/static/v1-accessibility-qa-v1.json'
      - 'data/static/v1-performance-qa-v1.json'
      - 'data/static/v1-source-policy-review-v1.json'
      - 'data/static/v1-known-limitations-v1.json'
      - 'scripts/run-v1-performance-qa.mjs'
      - 'scripts/check-v1-performance-qa.mjs'
      - 'scripts/check-v1-release-readiness.mjs'
      - 'README.md'
      - 'START-HERE.md'
      - 'docs/project-roadmap.md'
      - 'src/**'
      - 'public/**'
      - 'astro.config.mjs'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install dependencies without generating a lockfile
        run: npm install --package-lock=false
      - name: Validate release-decision script syntax
        run: node --check scripts/check-v1-release-decision.mjs
      - name: Validate public data references
        run: npm run validate:data
      - name: Build complete static site
        run: npm run build
      - name: Preserve Phase 11 SEO QA release
        run: node scripts/check-seo-qa-release.mjs
      - name: Preserve v1 scope freeze
        run: node scripts/check-v1-scope-freeze.mjs
      - name: Preserve v1 data audit
        run: node scripts/check-v1-data-audit.mjs
      - name: Preserve v1 source policy review
        run: node scripts/check-v1-source-policy-review.mjs
      - name: Preserve v1 known limitations
        run: node scripts/check-v1-known-limitations.mjs
      - name: Measure complete static performance inventory
        shell: bash
        run: |
          set +e
          node scripts/run-v1-performance-qa.mjs > v1-release-decision-performance.log 2>&1
          status=$?
          printf '%s\n' "$status" > v1-release-decision-performance.exit
          cat v1-release-decision-performance.log
          if [ -f v1-performance-qa-discovery.json ]; then
            mv v1-performance-qa-discovery.json v1-performance-qa-report.json
          fi
          exit 0
      - name: Upload release-decision performance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-release-decision-performance
          path: |
            v1-release-decision-performance.log
            v1-release-decision-performance.exit
            v1-performance-qa-report.json
          if-no-files-found: warn
          retention-days: 7
      - name: Enforce performance runner success
        run: |
          status="$(cat v1-release-decision-performance.exit)"
          if [ "$status" != "0" ]; then
            exit "$status"
          fi
      - name: Preserve v1 performance contract and budgets
        run: node scripts/check-v1-performance-qa.mjs
      - name: Evaluate v1 release readiness
        shell: bash
        run: |
          set +e
          node scripts/check-v1-release-readiness.mjs > v1-release-decision-readiness.log 2>&1
          status=$?
          printf '%s\n' "$status" > v1-release-decision-readiness.exit
          cat v1-release-decision-readiness.log
          exit 0
      - name: Evaluate v1 release decision
        shell: bash
        run: |
          set +e
          node scripts/check-v1-release-decision.mjs > v1-release-decision-check.log 2>&1
          status=$?
          printf '%s\n' "$status" > v1-release-decision-check.exit
          cat v1-release-decision-check.log
          exit 0
      - name: Upload release-decision validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-release-decision-validation
          path: |
            v1-release-decision-readiness.log
            v1-release-decision-readiness.exit
            v1-release-decision-check.log
            v1-release-decision-check.exit
          if-no-files-found: warn
          retention-days: 7
      - name: Enforce v1 release readiness
        run: |
          status="$(cat v1-release-decision-readiness.exit)"
          if [ "$status" != "0" ]; then
            exit "$status"
          fi
      - name: Enforce v1 release decision
        run: |
          status="$(cat v1-release-decision-check.exit)"
          if [ "$status" != "0" ]; then
            exit "$status"
          fi
      - name: Remove generated diagnostics
        if: always()
        run: rm -f v1-performance-qa-report.json v1-performance-qa-discovery.json v1-release-decision-performance.log v1-release-decision-performance.exit v1-release-decision-readiness.log v1-release-decision-readiness.exit v1-release-decision-check.log v1-release-decision-check.exit
      - name: Prove repository clean
        run: |
          changes="$(git status --porcelain --untracked-files=all)"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            exit 1
          fi
