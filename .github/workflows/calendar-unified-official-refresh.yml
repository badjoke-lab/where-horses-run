name: Calendar unified official refresh

on:
  schedule:
    - cron: '17 3 * * *'   # full rolling 30-day mother set
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/calendar-unified-official-refresh.yml'
      - 'package.json'
      - 'scripts/timetable/**'
      - 'scripts/check-calendar-refresh-publication-boundaries.mjs'
      - 'scripts/check-bahrain-btc-adapter.mjs'
      - 'scripts/check-sweden-svensk-galopp-adapter.mjs'
      - 'scripts/check-germany-deutscher-galopp-adapter.mjs'
      - 'scripts/check-spain-zarzuela-adapter.mjs'
