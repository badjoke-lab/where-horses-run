      - 'scripts/check-calendar-non-running-evidence-registry.mjs'
      - 'scripts/check-hkjc-non-running-evidence.mjs'
      - 'scripts/check-uae-era-non-running-evidence.mjs'
      - 'scripts/check-jra-non-running-evidence.mjs'
      - 'scripts/check-jra-non-running-discovery.mjs'
      - 'scripts/check-banei-non-running-evidence.mjs'
      - 'scripts/check-banei-non-running-discovery.mjs'
      - 'scripts/check-nar-non-running-evidence.mjs'
      - 'scripts/check-nar-non-running-discovery.mjs'
      - 'scripts/check-sorec-non-running-evidence.mjs'
      - 'scripts/check-chile-clubhipico-non-running-evidence.mjs'
      - 'scripts/check-france-non-running-evidence.mjs'
      - 'scripts/timetable/france-non-running-evidence.mjs'
      - 'data/static/calendar-non-running-evidence-registry-v1.json'
      - 'data/static/calendar-non-running-evidence-registry.schema.json'
      - 'scripts/check-kra-window-bounds.mjs'
      - 'scripts/check-japan-mother-set-safety.mjs'
      - 'scripts/check-japan-per-family-absence-reconciliation.mjs'
      - 'scripts/check-jra-official-30d-completeness.mjs'
      - 'scripts/check-banei-official-program-fallback.mjs'
      - 'scripts/check-nankankeiba-official-30d.mjs'
      - 'scripts/check-nankan-official-programme-fallback.mjs'
      - 'scripts/check-iwatekeiba-official-30d.mjs'
      - 'scripts/check-iwate-official-programme-fallback.mjs'
      - 'scripts/check-hyogo-official-30d.mjs'
      - 'scripts/check-tokai-official-30d.mjs'
      - 'scripts/check-hokkaido-official-30d.mjs'
      - 'scripts/check-kanazawa-official-30d.mjs'
      - 'scripts/check-kochi-official-30d.mjs'
      - 'scripts/check-saga-official-30d.mjs'
      - 'data/static/authority-source-inventory-japan-v2.json'
      - 'data/static/calendar-reviewed-exclusions.json'
      - 'data/static/calendar-reviewed-public-observations.json'
      - 'data/static/banei-2026-09-06-public-detail-v1.json'
      - 'data/static/banei-2026-09-07-public-detail-v1.json'
      - 'data/static/japan-2026-09-05-reviewed-a-plus-v1.json'
      - 'data/static/japan-2026-09-06-kochi-reviewed-a-plus-v1.json'
      - 'src/data/publicationDisplayPolicies.json'
  pull_request:
    paths:
      - '.github/workflows/calendar-unified-official-refresh.yml'
      - 'package.json'
      - 'scripts/timetable/**'
      - 'scripts/check-calendar-refresh-publication-boundaries.mjs'
      - 'scripts/check-bahrain-btc-adapter.mjs'
      - 'scripts/check-sweden-svensk-galopp-adapter.mjs'
      - 'scripts/check-germany-deutscher-galopp-adapter.mjs'
      - 'scripts/check-spain-zarzuela-adapter.mjs'
      - 'scripts/check-italy-masaf-adapter.mjs'
      - 'scripts/check-south-africa-race-coast-adapter.mjs'
      - 'scripts/check-south-africa-four-racing-adapter.mjs'
      - 'scripts/check-panama-presidente-remon-adapter.mjs'
      - 'scripts/check-brazil-jcb-reunioes-adapter.mjs'
      - 'scripts/timetable/south-africa-four-racing-core.mjs'
      - 'scripts/timetable/run-south-africa-four-racing-official-window.mjs'
      - 'scripts/timetable/panama-presidente-remon-core.mjs'
      - 'scripts/timetable/run-panama-presidente-remon-official-window.mjs'
      - 'scripts/timetable/brazil-jcb-reunioes-core.mjs'
      - 'scripts/timetable/run-brazil-jcb-reunioes-official-window.mjs'
      - 'scripts/timetable/italy-masaf-core.mjs'
      - 'scripts/timetable/run-italy-masaf-official-window.mjs'
      - 'scripts/check-calendar-public-map-parity.mjs'
      - 'data/static/racecourse-locations-v1.json'
      - 'src/lib/racecourseMapLocationPolicy.mjs'
      - 'scripts/check-calendar-live-source-readiness.mjs'
      - 'scripts/check-chile-clubhipico-non-running-evidence.mjs'
      - 'scripts/check-kra-window-bounds.mjs'
      - 'scripts/check-japan-mother-set-safety.mjs'
      - 'scripts/check-japan-per-family-absence-reconciliation.mjs'
      - 'scripts/check-jra-official-30d-completeness.mjs'
      - 'scripts/check-banei-official-program-fallback.mjs'
      - 'scripts/check-nankankeiba-official-30d.mjs'
      - 'scripts/check-nankan-official-programme-fallback.mjs'
      - 'scripts/check-iwatekeiba-official-30d.mjs'
      - 'scripts/check-iwate-official-programme-fallback.mjs'
      - 'scripts/check-hyogo-official-30d.mjs'
      - 'scripts/check-tokai-official-30d.mjs'
      - 'scripts/check-hokkaido-official-30d.mjs'
      - 'scripts/check-kanazawa-official-30d.mjs'
      - 'scripts/check-kochi-official-30d.mjs'
      - 'scripts/check-saga-official-30d.mjs'
      - 'data/static/authority-source-inventory-japan-v2.json'
      - 'data/static/calendar-reviewed-exclusions.json'
      - 'data/static/calendar-reviewed-public-observations.json'
      - 'data/static/banei-2026-09-06-public-detail-v1.json'
      - 'data/static/banei-2026-09-07-public-detail-v1.json'
      - 'data/static/japan-2026-09-05-reviewed-a-plus-v1.json'
      - 'data/static/japan-2026-09-06-kochi-reviewed-a-plus-v1.json'
      - 'src/data/publicationDisplayPolicies.json'

permissions:
  contents: write

concurrency:
  group: calendar-unified-official-refresh-${{ github.event_name == 'pull_request' && 'smoke' || 'production' }}
  cancel-in-progress: false

jobs:
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Validate unified refresh syntax
        run: |
          for file in scripts/timetable/*.mjs; do
            node --check "$file"
          done
          node scripts/check-calendar-live-source-readiness.mjs
          node scripts/check-calendar-refresh-publication-boundaries.mjs
          node scripts/check-kra-window-bounds.mjs
          node scripts/check-kra-fetch-failure-retention.mjs
          node scripts/check-tjk-fetch-failure-retention.mjs
          node scripts/check-tjk-non-running-evidence.mjs
          node scripts/check-ireland-hri-fixtures-adapter.mjs
          node scripts/check-peru-monterrico-adapter.mjs
          node scripts/check-saudi-jcsa-adapter.mjs
          node scripts/check-france-fnch-adapter.mjs
          node scripts/check-new-zealand-official-adapter.mjs
          node scripts/check-united-kingdom-bha-adapter.mjs
          node scripts/check-slovakia-zavodisko-adapter.mjs
          node scripts/check-bahrain-btc-adapter.mjs
          node scripts/check-sweden-svensk-galopp-adapter.mjs
          node scripts/check-germany-deutscher-galopp-adapter.mjs
          node scripts/check-spain-zarzuela-adapter.mjs
          node scripts/check-italy-masaf-adapter.mjs
          node scripts/check-south-africa-race-coast-adapter.mjs
          node scripts/check-south-africa-four-racing-adapter.mjs
          node scripts/check-panama-presidente-remon-adapter.mjs
          node scripts/check-brazil-jcb-reunioes-adapter.mjs
          node scripts/check-meeting-presence-contract.mjs
          node scripts/check-calendar-non-running-evidence-registry.mjs
          node scripts/check-hkjc-non-running-evidence.mjs
          node scripts/check-uae-era-non-running-evidence.mjs
          node scripts/check-jra-non-running-evidence.mjs
          node scripts/check-jra-non-running-discovery.mjs
          node scripts/check-banei-non-running-evidence.mjs
          node scripts/check-banei-non-running-discovery.mjs
          node scripts/check-nar-non-running-evidence.mjs
          node scripts/check-nar-non-running-discovery.mjs
          node scripts/check-sorec-non-running-evidence.mjs
          node scripts/check-chile-clubhipico-non-running-evidence.mjs
          node scripts/check-france-non-running-evidence.mjs
          node scripts/check-new-zealand-non-running-evidence.mjs
          node scripts/check-united-kingdom-bha-non-running-evidence.mjs
          node scripts/check-peru-fetch-failure-retention.mjs
      - name: Exercise Japan mother-set safety contracts
        run: |
          node scripts/check-japan-mother-set-safety.mjs
          node scripts/check-japan-per-family-absence-reconciliation.mjs
          node scripts/check-jra-official-30d-completeness.mjs
          node scripts/check-banei-official-program-fallback.mjs
          node scripts/check-nankankeiba-official-30d.mjs
          node scripts/check-nankan-official-programme-fallback.mjs
          node scripts/check-iwatekeiba-official-30d.mjs
          node scripts/check-iwate-official-programme-fallback.mjs
          node scripts/check-hyogo-official-30d.mjs
          node scripts/check-tokai-official-30d.mjs
          node scripts/check-hokkaido-official-30d.mjs
          node scripts/check-kanazawa-official-30d.mjs
          node scripts/check-kochi-official-30d.mjs
          node scripts/check-saga-official-30d.mjs
      - name: Exercise reviewed Calendar preservation
        run: node scripts/timetable/apply-reviewed-calendar-observations.mjs
      - name: Exercise confirmed non-running public suppression
        run: |
          node scripts/timetable/apply-meeting-presence-dispositions.mjs
          node scripts/check-confirmed-non-running-publication.mjs
      - name: Validate site build
        run: npm run build
      - name: Check diff formatting
        run: git diff --check
      - name: Exercise reset-and-rebuild persistence model
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          git init --bare "$tmp/remote.git" >/dev/null
          git clone "$tmp/remote.git" "$tmp/seed" >/dev/null 2>&1
          (
            cd "$tmp/seed"
            git config user.name test
            git config user.email test@example.invalid
            mkdir -p data/generated
            printf 'base\n' > data/generated/snapshot.json
            printf 'base-code\n' > code.txt
            git add .
            git commit -m base >/dev/null
            git branch -M main
            git push origin main >/dev/null 2>&1
          )
          git --git-dir="$tmp/remote.git" symbolic-ref HEAD refs/heads/main
          git clone "$tmp/remote.git" "$tmp/writer" >/dev/null 2>&1
          git clone "$tmp/remote.git" "$tmp/advancer" >/dev/null 2>&1
          (
            cd "$tmp/writer"
            git config user.name test
            git config user.email test@example.invalid
            printf 'stale-generated\n' > data/generated/snapshot.json
            git add data/generated/snapshot.json
            git commit -m stale-generated >/dev/null
          )
          (
            cd "$tmp/advancer"
            git config user.name test
            git config user.email test@example.invalid
            printf 'advance-one\n' > code.txt
            git add code.txt
            git commit -m advance-one >/dev/null
            git push origin HEAD:main >/dev/null 2>&1
          )
          (
            cd "$tmp/writer"
            git fetch origin main >/dev/null 2>&1
            remote_main="$(git rev-parse origin/main)"
            parent_sha="$(git rev-parse HEAD^)"
            test "$parent_sha" != "$remote_main"
            git reset --hard "$remote_main" >/dev/null
            printf 'rebuilt-one\n' > data/generated/snapshot.json
            git add data/generated/snapshot.json
            git commit -m rebuilt-one >/dev/null
          )
          (
            cd "$tmp/advancer"
            git fetch origin main >/dev/null 2>&1
            git reset --hard origin/main >/dev/null
            printf 'advance-two\n' > code.txt
            git add code.txt
            git commit -m advance-two >/dev/null
            git push origin HEAD:main >/dev/null 2>&1
          )
          (
            cd "$tmp/writer"
            git fetch origin main >/dev/null 2>&1
            remote_main="$(git rev-parse origin/main)"
            parent_sha="$(git rev-parse HEAD^)"
            test "$parent_sha" != "$remote_main"
            git reset --hard "$remote_main" >/dev/null
            printf 'rebuilt-two\n' > data/generated/snapshot.json
            git add data/generated/snapshot.json
            git commit -m rebuilt-two >/dev/null
            candidate_sha="$(git rev-parse HEAD)"
            git fetch origin main >/dev/null 2>&1
            test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/main)"
            git push origin "$candidate_sha:main" >/dev/null 2>&1
          )
          git clone "$tmp/remote.git" "$tmp/verify" >/dev/null 2>&1
          test "$(cat "$tmp/verify/data/generated/snapshot.json")" = "rebuilt-two"
          test "$(cat "$tmp/verify/code.txt")" = "advance-two"
          if grep -R -nE '^(<<<<<<<|=======|>>>>>>>)' "$tmp/verify" --exclude-dir=.git; then
            echo "Conflict markers survived reset-and-rebuild persistence." >&2
            exit 1
          fi

  refresh:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - id: scope
        name: Resolve rolling window scope
        shell: bash
        run: |
          echo "scope=full" >> "$GITHUB_OUTPUT"
          echo "days=30" >> "$GITHUB_OUTPUT"
          echo "japan_date=$(TZ=Asia/Tokyo date +%F)" >> "$GITHUB_OUTPUT"
          echo "Resolved scope=full days=30"
      - name: Validate production refresh syntax
        run: |
          for file in scripts/timetable/*.mjs; do
            node --check "$file"
          done
          node scripts/check-calendar-live-source-readiness.mjs
          node scripts/check-calendar-refresh-publication-boundaries.mjs
          node scripts/check-kra-window-bounds.mjs
          node scripts/check-ireland-hri-fixtures-adapter.mjs
          node scripts/check-peru-monterrico-adapter.mjs
          node scripts/check-saudi-jcsa-adapter.mjs
          node scripts/check-france-fnch-adapter.mjs
          node scripts/check-new-zealand-official-adapter.mjs
          node scripts/check-united-kingdom-bha-adapter.mjs
          node scripts/check-slovakia-zavodisko-adapter.mjs
          node scripts/check-bahrain-btc-adapter.mjs
          node scripts/check-sweden-svensk-galopp-adapter.mjs
          node scripts/check-germany-deutscher-galopp-adapter.mjs
          node scripts/check-spain-zarzuela-adapter.mjs
          node scripts/check-italy-masaf-adapter.mjs
          node scripts/check-south-africa-race-coast-adapter.mjs
          node scripts/check-south-africa-four-racing-adapter.mjs
          node scripts/check-panama-presidente-remon-adapter.mjs
          node scripts/check-brazil-jcb-reunioes-adapter.mjs
          node scripts/check-meeting-presence-contract.mjs
          node scripts/check-calendar-non-running-evidence-registry.mjs
          node scripts/check-hkjc-non-running-evidence.mjs
          node scripts/check-uae-era-non-running-evidence.mjs
          node scripts/check-jra-non-running-evidence.mjs
          node scripts/check-jra-non-running-discovery.mjs
          node scripts/check-banei-non-running-evidence.mjs
          node scripts/check-banei-non-running-discovery.mjs
          node scripts/check-nar-non-running-evidence.mjs
          node scripts/check-nar-non-running-discovery.mjs
      - name: Refresh Japan official mother set and best available detail
        run: |
          node scripts/timetable/run-japan-zero-based-30d.mjs \
            --execution-date="${{ steps.scope.outputs.japan_date }}" \
            --scope="${{ steps.scope.outputs.scope }}"
      - name: Re-apply frozen reviewed Calendar observations after Japan
        run: node scripts/timetable/apply-reviewed-calendar-observations.mjs
      - name: Apply explicit meeting presence dispositions after Japan
        run: |
          node scripts/timetable/run-japan-non-running-evidence.mjs \
            --as-of="${{ steps.scope.outputs.japan_date }}" \
            --days="${{ steps.scope.outputs.days }}" \
            --output=.calendar-unified/japan-non-running.json
          node scripts/timetable/run-banei-non-running-evidence.mjs \
            --as-of="${{ steps.scope.outputs.japan_date }}" \
            --days="${{ steps.scope.outputs.days }}" \
            --output=.calendar-unified/banei-non-running.json
          node scripts/timetable/run-nar-non-running-evidence.mjs \
            --as-of="${{ steps.scope.outputs.japan_date }}" \
            --days="${{ steps.scope.outputs.days }}" \
            --output=.calendar-unified/nar-non-running.json
          node scripts/timetable/apply-meeting-presence-dispositions.mjs \
            --artifact=.calendar-unified/japan-non-running.json \
            --artifact=.calendar-unified/banei-non-running.json \
            --artifact=.calendar-unified/nar-non-running.json
          node scripts/check-confirmed-non-running-publication.mjs
      - name: Validate Japan generated public site state
        run: |
          npm run validate:calendar-public-map-parity
          npm run build
      - name: Persist Japan official state before non-Japan collection
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          refresh_japan_on_main() {
            local remote_main="$1"
            echo "Resetting to latest main $remote_main and rebuilding Japan snapshot."
            git reset --hard "$remote_main"
            npm install --no-package-lock --no-audit --no-fund
            node scripts/timetable/run-japan-zero-based-30d.mjs \
              --execution-date="${{ steps.scope.outputs.japan_date }}" \
              --scope="${{ steps.scope.outputs.scope }}"
            node scripts/timetable/apply-reviewed-calendar-observations.mjs
            node scripts/timetable/run-japan-non-running-evidence.mjs \
              --as-of="${{ steps.scope.outputs.japan_date }}" \
              --days="${{ steps.scope.outputs.days }}" \
              --output=.calendar-unified/japan-non-running.json
            node scripts/timetable/run-banei-non-running-evidence.mjs \
              --as-of="${{ steps.scope.outputs.japan_date }}" \
              --days="${{ steps.scope.outputs.days }}" \
              --output=.calendar-unified/banei-non-running.json
            node scripts/timetable/run-nar-non-running-evidence.mjs \
              --as-of="${{ steps.scope.outputs.japan_date }}" \
              --days="${{ steps.scope.outputs.days }}" \
              --output=.calendar-unified/nar-non-running.json
            node scripts/timetable/apply-meeting-presence-dispositions.mjs \
              --artifact=.calendar-unified/japan-non-running.json \
              --artifact=.calendar-unified/banei-non-running.json \
              --artifact=.calendar-unified/nar-non-running.json
            node scripts/check-confirmed-non-running-publication.mjs
            npm run validate:calendar-public-map-parity
            npm run build
          }

          stage_japan_state() {
            git add \
              data/generated/timetable/canonical/meetings.json \
              data/generated/timetable/canonical/meeting-details.json \
              data/generated/timetable/public/meeting-list.json \
              data/generated/timetable/public/meeting-details.json
            git add data/generated/timetable/japan-zero-based-30d-reconciliation.json 2>/dev/null || true
            git add data/generated/timetable/japan-zero-based-3d-reconciliation.json 2>/dev/null || true
            git add data/generated/timetable/meeting-presence.json 2>/dev/null || true
          }

          git fetch origin main
          remote_main="$(git rev-parse origin/main)"
          if [[ "$(git rev-parse HEAD)" != "$remote_main" ]]; then
            refresh_japan_on_main "$remote_main"
          fi

          for attempt in 1 2 3; do
            stage_japan_state
            if git diff --cached --quiet; then
              echo "No verified Japan timetable change to persist."
              exit 0
            fi

            git commit -m "data: refresh Japan official timetable (${{ steps.scope.outputs.scope }})"
            candidate_sha="$(git rev-parse HEAD)"
            parent_sha="$(git rev-parse HEAD^)"

            git fetch origin main
            remote_main="$(git rev-parse origin/main)"
            if [[ "$parent_sha" != "$remote_main" ]]; then
              echo "main advanced before Japan push; rebuilding from $remote_main (attempt $attempt/3)."
              refresh_japan_on_main "$remote_main"
              continue
            fi

            if git push origin "$candidate_sha:main"; then
              echo "Persisted Japan snapshot from latest main on attempt $attempt/3."
              exit 0
            fi

            git fetch origin main
            remote_main="$(git rev-parse origin/main)"
            if [[ "$remote_main" != "$parent_sha" ]]; then
              echo "main advanced during Japan push; rebuilding from $remote_main (attempt $attempt/3)."
              refresh_japan_on_main "$remote_main"
              continue
            fi

            echo "Japan push failed even though main did not advance." >&2
            exit 1
          done

          echo "Japan persistence exhausted 3 bounded rebuild attempts." >&2
          exit 1
      - name: Collect HKJC official window
        run: |
          mkdir -p .calendar-unified
          node scripts/timetable/run-hkjc-official-window.mjs \
            --days="${{ steps.scope.outputs.days }}" \
            --output=.calendar-unified/hkjc.json
      - name: Collect UAE official window
        run: |
          node scripts/timetable/run-uae-era-official-window.mjs \
            --days="${{ steps.scope.outputs.days }}" \
            --output=.calendar-unified/uae.json
      - name: Collect KRA official window
        run: |
          node scripts/timetable/run-kra-official-window.mjs \
            --days="${{ steps.scope.outputs.days }}" \
            --output=.calendar-unified/kra.json
      - name: Collect TJK, SOREC, Chile, Ireland, Peru, Saudi, France, New Zealand, United Kingdom, Slovakia, Bahrain, Sweden, Germany, Spain, Italy and South Africa official windows
        run: |
          node scripts/timetable/run-tjk-current-best-available.mjs \
            --days="${{ steps.scope.outputs.days }}" \
            --output=.calendar-unified/tjk.json
          node scripts/timetable/run-sorec-official-window.mjs \
            --days="${{ steps.scope.outputs.days }}" \
