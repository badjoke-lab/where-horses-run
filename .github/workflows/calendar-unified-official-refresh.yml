          stage_remaining_state() {
            git add \
              data/generated/timetable/canonical/meetings.json \
              data/generated/timetable/canonical/meeting-details.json \
              data/generated/timetable/public/meeting-list.json \
              data/generated/timetable/public/meeting-details.json
            git add data/generated/timetable/japan-zero-based-30d-reconciliation.json 2>/dev/null || true
            git add data/generated/timetable/japan-zero-based-3d-reconciliation.json 2>/dev/null || true
            git add data/generated/timetable/meeting-presence.json 2>/dev/null || true
          }

          git fetch origin main
          remote_main="$(git rev-parse origin/main)"
          if [[ "$(git rev-parse HEAD)" != "$remote_main" ]]; then
            refresh_non_japan_on_main "$remote_main"
          fi

          for attempt in 1 2 3; do
            stage_remaining_state
            if git diff --cached --quiet; then
              echo "No verified timetable change to persist."
              exit 0
            fi

            git commit -m "data: refresh unified official rolling timetable (${{ steps.scope.outputs.scope }})"
            candidate_sha="$(git rev-parse HEAD)"
            parent_sha="$(git rev-parse HEAD^)"

            git fetch origin main
            remote_main="$(git rev-parse origin/main)"
            if [[ "$parent_sha" != "$remote_main" ]]; then
              echo "main advanced before rolling-state push; rebuilding from $remote_main (attempt $attempt/3)."
              refresh_non_japan_on_main "$remote_main"
              continue
            fi

            if git push origin "$candidate_sha:main"; then
              echo "Persisted rolling snapshot from latest main on attempt $attempt/3."
              exit 0
            fi

            git fetch origin main
            remote_main="$(git rev-parse origin/main)"
            if [[ "$remote_main" != "$parent_sha" ]]; then
              echo "main advanced during rolling-state push; rebuilding from $remote_main (attempt $attempt/3)."
              refresh_non_japan_on_main "$remote_main"
              continue
            fi

            echo "Rolling-state push failed even though main did not advance." >&2
            exit 1
          done

          echo "Rolling-state persistence exhausted 3 bounded rebuild attempts." >&2
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calendar-unified-official-refresh-${{ github.run_id }}
          include-hidden-files: true
          retention-days: 14
          path: |
            .calendar-unified/
            data/generated/timetable/japan-zero-based-30d-reconciliation.json
            data/generated/timetable/japan-zero-based-3d-reconciliation.json
            data/generated/timetable/meeting-presence.json
