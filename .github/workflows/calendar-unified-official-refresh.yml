name: Calendar unified official refresh

on:
  schedule:
    - cron: '17 3 * * *'   # full rolling 30-day mother set
    - cron: '17 11,19 * * *' # additional near-3-day detail refresh
  workflow_dispatch:
    inputs:
      scope:
        description: Refresh scope
        required: true
        default: full
        type: choice
        options:
          - full
          - near
  push:
    branches:
      - main
    paths:
      - '.github/workflows/calendar-unified-official-refresh.yml'
      - 'package.json'
      - 'scripts/timetable/apply-official-rolling-observations.mjs'
      - 'scripts/timetable/apply-reviewed-calendar-observations.mjs'
      - 'scripts/timetable/enforce-reviewed-calendar-exclusions.mjs'
      - 'scripts/timetable/consolidate-official-acquisition-artifacts.mjs'
      - 'scripts/timetable/run-japan-zero-based-30d.mjs'
      - 'scripts/timetable/japan-mother-set-safety.mjs'
      - 'scripts/timetable/jra-official-30d-discovery.mjs'
      - 'scripts/timetable/nankankeiba-official-30d-discovery.mjs'
      - 'scripts/timetable/nankan-official-programme-fallback.mjs'
      - 'scripts/timetable/iwatekeiba-official-30d-discovery.mjs'
      - 'scripts/timetable/iwate-official-programme-fallback.mjs'
      - 'scripts/timetable/hyogo-official-30d-discovery.mjs'
      - 'scripts/timetable/tokai-official-30d-discovery.mjs'
      - 'scripts/timetable/hokkaido-official-30d-discovery.mjs'
      - 'scripts/timetable/kanazawa-official-30d-discovery.mjs'
      - 'scripts/timetable/kochi-official-30d-discovery.mjs'
      - 'scripts/timetable/saga-official-30d-discovery.mjs'
      - 'scripts/timetable/saga-official-start-fallback.mjs'
      - 'scripts/timetable/run-hkjc-official-window.mjs'
      - 'scripts/timetable/run-uae-era-official-window.mjs'
      - 'scripts/timetable/run-kra-official-window.mjs'
      - 'scripts/timetable/run-tjk-current-best-available.mjs'
      - 'scripts/check-calendar-refresh-publication-boundaries.mjs'
      - 'scripts/check-kra-window-bounds.mjs'
      - 'scripts/check-japan-mother-set-safety.mjs'
      - 'scripts/check-japan-per-family-absence-reconciliation.mjs'
      - 'scripts/check-jra-official-30d-completeness.mjs'
      - 'scripts/check-nankankeiba-official-30d.mjs'
      - 'scripts/check-nankan-official-programme-fallback.mjs'
      - 'scripts/check-iwatekeiba-official-30d.mjs'
      - 'scripts/check-iwate-official-programme-fallback.mjs'
      - 'scripts/check-hyogo-official-30d.mjs'
      - 'scripts/check-tokai-official-30d.mjs'
      - 'scripts/check-hokkaido-official-30d.mjs'
      - 'scripts/check-kanazawa-official-30d.mjs'
      - 'scripts/check-kochi-official-30d.mjs'
      - 'scripts/check-saga-official-30d.mjs'
      - 'data/static/authority-source-inventory-japan-v2.json'
      - 'data/static/calendar-reviewed-exclusions.json'
      - 'data/static/calendar-reviewed-public-observations.json'
      - 'data/static/banei-2026-09-06-public-detail-v1.json'
      - 'data/static/banei-2026-09-07-public-detail-v1.json'
      - 'data/static/japan-2026-09-05-reviewed-a-plus-v1.json'
      - 'data/static/japan-2026-09-06-kochi-reviewed-a-plus-v1.json'
      - 'src/data/publicationDisplayPolicies.json'
  pull_request:
    paths:
      - '.github/workflows/calendar-unified-official-refresh.yml'
      - 'package.json'
      - 'scripts/timetable/apply-official-rolling-observations.mjs'
      - 'scripts/timetable/apply-reviewed-calendar-observations.mjs'
      - 'scripts/timetable/enforce-reviewed-calendar-exclusions.mjs'
      - 'scripts/timetable/consolidate-official-acquisition-artifacts.mjs'
      - 'scripts/timetable/run-japan-zero-based-30d.mjs'
      - 'scripts/timetable/japan-mother-set-safety.mjs'
      - 'scripts/timetable/jra-official-30d-discovery.mjs'
      - 'scripts/timetable/nankankeiba-official-30d-discovery.mjs'
      - 'scripts/timetable/nankan-official-programme-fallback.mjs'
      - 'scripts/timetable/iwatekeiba-official-30d-discovery.mjs'
      - 'scripts/timetable/iwate-official-programme-fallback.mjs'
      - 'scripts/timetable/hyogo-official-30d-discovery.mjs'
      - 'scripts/timetable/tokai-official-30d-discovery.mjs'
      - 'scripts/timetable/hokkaido-official-30d-discovery.mjs'
      - 'scripts/timetable/kanazawa-official-30d-discovery.mjs'
      - 'scripts/timetable/kochi-official-30d-discovery.mjs'
      - 'scripts/timetable/saga-official-30d-discovery.mjs'
      - 'scripts/timetable/saga-official-start-fallback.mjs'
      - 'scripts/timetable/run-hkjc-official-window.mjs'
      - 'scripts/timetable/run-uae-era-official-window.mjs'
      - 'scripts/timetable/run-kra-official-window.mjs'
      - 'scripts/timetable/run-tjk-current-best-available.mjs'
      - 'scripts/check-calendar-refresh-publication-boundaries.mjs'
      - 'scripts/check-kra-window-bounds.mjs'
      - 'scripts/check-japan-mother-set-safety.mjs'
      - 'scripts/check-japan-per-family-absence-reconciliation.mjs'
      - 'scripts/check-jra-official-30d-completeness.mjs'
      - 'scripts/check-nankankeiba-official-30d.mjs'
      - 'scripts/check-nankan-official-programme-fallback.mjs'
      - 'scripts/check-iwatekeiba-official-30d.mjs'
      - 'scripts/check-iwate-official-programme-fallback.mjs'
      - 'scripts/check-hyogo-official-30d.mjs'
      - 'scripts/check-tokai-official-30d.mjs'
      - 'scripts/check-hokkaido-official-30d.mjs'
      - 'scripts/check-kanazawa-official-30d.mjs'
      - 'scripts/check-kochi-official-30d.mjs'
      - 'scripts/check-saga-official-30d.mjs'
      - 'data/static/authority-source-inventory-japan-v2.json'
      - 'data/static/calendar-reviewed-exclusions.json'
      - 'data/static/calendar-reviewed-public-observations.json'
      - 'data/static/banei-2026-09-06-public-detail-v1.json'
      - 'data/static/banei-2026-09-07-public-detail-v1.json'
      - 'data/static/japan-2026-09-05-reviewed-a-plus-v1.json'
      - 'data/static/japan-2026-09-06-kochi-reviewed-a-plus-v1.json'
      - 'src/data/publicationDisplayPolicies.json'

permissions:
  contents: write

concurrency:
  group: calendar-unified-official-refresh
  cancel-in-progress: false

jobs:
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Validate unified refresh syntax
        run: |
          node --check scripts/timetable/apply-official-rolling-observations.mjs
          node --check scripts/timetable/apply-reviewed-calendar-observations.mjs
          node --check scripts/timetable/enforce-reviewed-calendar-exclusions.mjs
          node --check scripts/timetable/consolidate-official-acquisition-artifacts.mjs
          node --check scripts/timetable/run-japan-zero-based-30d.mjs
          node --check scripts/timetable/japan-mother-set-safety.mjs
          node --check scripts/timetable/jra-official-30d-discovery.mjs
          node --check scripts/timetable/nankankeiba-official-30d-discovery.mjs
          node --check scripts/timetable/nankan-official-programme-fallback.mjs
          node --check scripts/timetable/iwatekeiba-official-30d-discovery.mjs
          node --check scripts/timetable/iwate-official-programme-fallback.mjs
          node --check scripts/timetable/hyogo-official-30d-discovery.mjs
          node --check scripts/timetable/tokai-official-30d-discovery.mjs
          node --check scripts/timetable/hokkaido-official-30d-discovery.mjs
          node --check scripts/timetable/kanazawa-official-30d-discovery.mjs
          node --check scripts/timetable/kochi-official-30d-discovery.mjs
          node --check scripts/timetable/saga-official-30d-discovery.mjs
          node --check scripts/timetable/saga-official-start-fallback.mjs
          node --check scripts/timetable/run-hkjc-official-window.mjs
          node --check scripts/timetable/run-uae-era-official-window.mjs
          node --check scripts/timetable/run-kra-official-window.mjs
          node --check scripts/timetable/run-tjk-current-best-available.mjs
          node scripts/check-calendar-refresh-publication-boundaries.mjs
          node scripts/check-kra-window-bounds.mjs
      - name: Exercise Japan mother-set safety contracts
        run: |
          node scripts/check-japan-mother-set-safety.mjs
          node scripts/check-japan-per-family-absence-reconciliation.mjs
          node scripts/check-jra-official-30d-completeness.mjs
          node scripts/check-nankankeiba-official-30d.mjs
          node scripts/check-nankan-official-programme-fallback.mjs
          node scripts/check-iwatekeiba-official-30d.mjs
          node scripts/check-iwate-official-programme-fallback.mjs
          node scripts/check-hyogo-official-30d.mjs
          node scripts/check-tokai-official-30d.mjs
          node scripts/check-hokkaido-official-30d.mjs
          node scripts/check-kanazawa-official-30d.mjs
          node scripts/check-kochi-official-30d.mjs
          node scripts/check-saga-official-30d.mjs
      - name: Exercise reviewed Calendar preservation
        run: node scripts/timetable/apply-reviewed-calendar-observations.mjs
      - name: Validate site build
        run: npm run build
      - name: Check diff formatting
        run: git diff --check

  refresh:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - id: scope
        name: Resolve rolling window scope
        shell: bash
        env:
          DISPATCH_SCOPE: ${{ inputs.scope }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            scope="${DISPATCH_SCOPE:-full}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            scope="full"
          elif [[ "$EVENT_SCHEDULE" == "17 3 * * *" ]]; then
            scope="full"
          else
            scope="near"
          fi
          if [[ "$scope" == "full" ]]; then days=30; else days=3; fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "days=$days" >> "$GITHUB_OUTPUT"
          echo "japan_date=$(TZ=Asia/Tokyo date +%F)" >> "$GITHUB_OUTPUT"
          echo "Resolved scope=$scope days=$days"
      - name: Validate production refresh syntax
        run: |
          node --check scripts/timetable/apply-official-rolling-observations.mjs
          node --check scripts/timetable/apply-reviewed-calendar-observations.mjs
          node --check scripts/timetable/enforce-reviewed-calendar-exclusions.mjs
          node --check scripts/timetable/run-japan-zero-based-30d.mjs
          node --check scripts/timetable/japan-mother-set-safety.mjs
          node --check scripts/timetable/jra-official-30d-discovery.mjs
          node --check scripts/timetable/nankankeiba-official-30d-discovery.mjs
          node --check scripts/timetable/nankan-official-programme-fallback.mjs
          node --check scripts/timetable/iwatekeiba-official-30d-discovery.mjs
          node --check scripts/timetable/iwate-official-programme-fallback.mjs
          node --check scripts/timetable/hyogo-official-30d-discovery.mjs
          node --check scripts/timetable/tokai-official-30d-discovery.mjs
          node --check scripts/timetable/hokkaido-official-30d-discovery.mjs
          node --check scripts/timetable/kanazawa-official-30d-discovery.mjs
          node --check scripts/timetable/kochi-official-30d-discovery.mjs
          node --check scripts/timetable/saga-official-30d-discovery.mjs
          node --check scripts/timetable/saga-official-start-fallback.mjs
          node --check scripts/timetable/run-hkjc-official-window.mjs
          node --check scripts/timetable/run-uae-era-official-window.mjs
          node --check scripts/timetable/run-kra-official-window.mjs
          node --check scripts/timetable/run-tjk-current-best-available.mjs
          node scripts/check-calendar-refresh-publication-boundaries.mjs
          node scripts/check-kra-window-bounds.mjs
      - name: Refresh Japan official mother set and best available detail
        run: |
          node scripts/timetable/run-japan-zero-based-30d.mjs \
            --execution-date="${{ steps.scope.outputs.japan_date }}" \
            --scope="${{ steps.scope.outputs.scope }}"
      - name: Re-apply frozen reviewed Calendar observations after Japan
        run: node scripts/timetable/apply-reviewed-calendar-observations.mjs
      - name: Validate Japan generated public site state
        run: npm run build
      - name: Persist Japan official state before non-Japan collection
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/generated/timetable/canonical/meetings.json \
            data/generated/timetable/canonical/meeting-details.json \
            data/generated/timetable/public/meeting-list.json \
            data/generated/timetable/public/meeting-details.json
          git add data/generated/timetable/japan-zero-based-30d-reconciliation.json 2>/dev/null || true
          git add data/generated/timetable/japan-zero-based-3d-reconciliation.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No verified Japan timetable change to persist."
          else
            git commit -m "data: refresh Japan official timetable (${{ steps.scope.outputs.scope }})"
            git push origin HEAD:main
          fi
      - name: Collect HKJC official window
        run: |
          mkdir -p .calendar-unified
          node scripts/timetable/run-hkjc-official-window.mjs \
            --days="${{ steps.scope.outputs.days }}" \
            --output=.calendar-unified/hkjc.json
      - name: Collect UAE official window
        run: |
          node scripts/timetable/run-uae-era-official-window.mjs \
            --days="${{ steps.scope.outputs.days }}" \
            --output=.calendar-unified/uae.json
      - name: Collect KRA official window
        run: |
          node scripts/timetable/run-kra-official-window.mjs \
            --days="${{ steps.scope.outputs.days }}" \
            --output=.calendar-unified/kra.json
      - name: Collect TJK official window
        run: |
          node scripts/timetable/run-tjk-current-best-available.mjs \
            --days="${{ steps.scope.outputs.days }}" \
            --output=.calendar-unified/tjk.json
      - name: Enforce reviewed Calendar exclusions
        run: |
          node scripts/timetable/enforce-reviewed-calendar-exclusions.mjs \
            --artifact=.calendar-unified/hkjc.json \
            --artifact=.calendar-unified/uae.json \
            --artifact=.calendar-unified/kra.json \
            --artifact=.calendar-unified/tjk.json
      - name: Apply non-Japan official observations monotonically
        run: |
          node scripts/timetable/apply-official-rolling-observations.mjs \
            --artifact=.calendar-unified/hkjc.json \
            --country-id=hong-kong \
            --authority-id=hkjc \
            --racing-system-id=hong-kong-hkjc-system \
            --timezone=Asia/Hong_Kong
          node scripts/timetable/apply-official-rolling-observations.mjs \
            --artifact=.calendar-unified/uae.json \
            --country-id=united-arab-emirates \
            --authority-id=emirates-racing-authority \
            --racing-system-id=uae-national-racing-system \
            --timezone=Asia/Dubai
          node scripts/timetable/apply-official-rolling-observations.mjs \
            --artifact=.calendar-unified/kra.json \
            --country-id=south-korea \
            --authority-id=korea-racing-authority \
            --racing-system-id=kra-national-racing-system \
            --timezone=Asia/Seoul
          node scripts/timetable/apply-official-rolling-observations.mjs \
            --artifact=.calendar-unified/tjk.json \
            --country-id=turkey \
            --authority-id=turkiye-jokey-kulubu \
            --racing-system-id=tjk-national-racing-system \
            --timezone=Europe/Istanbul
      - name: Re-apply frozen reviewed Calendar observations
        run: node scripts/timetable/apply-reviewed-calendar-observations.mjs
      - name: Validate generated public site state
        run: npm run build
      - name: Persist remaining canonical and public rolling state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/generated/timetable/canonical/meetings.json \
            data/generated/timetable/canonical/meeting-details.json \
            data/generated/timetable/public/meeting-list.json \
            data/generated/timetable/public/meeting-details.json
          git add data/generated/timetable/japan-zero-based-30d-reconciliation.json 2>/dev/null || true
          git add data/generated/timetable/japan-zero-based-3d-reconciliation.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No verified timetable change to persist."
            exit 0
          fi
          git commit -m "data: refresh unified official rolling timetable (${{ steps.scope.outputs.scope }})"
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calendar-unified-official-refresh-${{ github.run_id }}
          include-hidden-files: true
          retention-days: 14
          path: |
            .calendar-unified/
            data/generated/timetable/japan-zero-based-30d-reconciliation.json
            data/generated/timetable/japan-zero-based-3d-reconciliation.json
