name: M5 stale data warning

on:
  pull_request:
    paths:
      - 'src/lib/timetable/publicFreshnessState.mjs'
      - 'src/components/TimetableMeetingList.astro'
      - 'src/components/CalendarDateStatus.astro'
      - 'scripts/check-m5-stale-data-warning.mjs'
      - '.github/workflows/m5-stale-data-warning.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - run: node scripts/check-m5-stale-data-warning.mjs
      - run: git diff --exit-code
