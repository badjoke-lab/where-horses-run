name: Calendar HKJC September 23 fixture apply once

on:
  push:
    branches:
      - review/hkjc-2026-09-23-happy-valley-c
    paths:
      - '.github/workflows/calendar-hkjc-september-2026-09-23-fixture-apply-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout exact daily-review source evidence
        uses: actions/checkout@v4
        with:
          ref: ca20dce8e061ed082ba6d61aac8e9ede7360ff6d
          path: review-source
          sparse-checkout: |
            data/generated/timetable/actions-multi-job/due-job-plan-2026-08-26-due-hong-kong-hkjc-season-wake-up-001-run-001/candidates.json
            data/generated/timetable/actions-multi-job/due-job-plan-2026-08-26-due-hong-kong-hkjc-season-wake-up-001-run-001/collection-report.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Rebuild exactly one reviewed HKJC fixture record
        env:
          WHR_HKJC_REVIEW_CANDIDATES: ${{ github.workspace }}/review-source/data/generated/timetable/actions-multi-job/due-job-plan-2026-08-26-due-hong-kong-hkjc-season-wake-up-001-run-001/candidates.json
          WHR_HKJC_REVIEW_REPORT: ${{ github.workspace }}/review-source/data/generated/timetable/actions-multi-job/due-job-plan-2026-08-26-due-hong-kong-hkjc-season-wake-up-001-run-001/collection-report.json
        run: node scripts/timetable/build-calendar-hkjc-september-2026-09-23-fixture-approved-candidates.mjs

      - name: Verify exact pre-promotion state
        env:
          BASE_SHA: c9f9d464acfdf9edc230b263f000e89b11db3c07
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const id = 'hkjc-happy-valley-racecourse-2026-09-23';
          const baseMeetings = JSON.parse(execFileSync('git', ['show', `${process.env.BASE_SHA}:data/generated/timetable/canonical/meetings.json`], { encoding: 'utf8' }));
          const baseDetails = JSON.parse(execFileSync('git', ['show', `${process.env.BASE_SHA}:data/generated/timetable/canonical/meeting-details.json`], { encoding: 'utf8' }));
          if (baseMeetings.meetings.some((row) => row.meeting_id === id)) throw new Error('target meeting already exists in exact base');
          if (baseDetails.details.some((row) => row.meeting_id === id)) throw new Error('target detail already exists in exact base');
          const candidate = JSON.parse(fs.readFileSync('data/candidates/hkjc-september-2026-09-23-fixture-approved.json', 'utf8'));
          if (candidate.records.length !== 1 || candidate.records[0].meeting_id !== id) throw new Error('approved candidate identity differs');
          NODE

      - name: Extend cumulative reviewed promotion sequence
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p = 'scripts/check-calendar-nar-incremental-v2-promotion-output-determinism.mjs';
          let text = fs.readFileSync(p, 'utf8');
          const declaration = "const augustNarRegularRefreshAPlusSixthPath = 'data/candidates/nar-regular-refresh-2026-08-28-funabashi-kasamatsu-a-plus-approved.json';";
          const newDeclaration = `${declaration}\nconst septemberHkjcFixtureSeptember23Path = 'data/candidates/hkjc-september-2026-09-23-fixture-approved.json';`;
          if (!text.includes(declaration) || text.includes('septemberHkjcFixtureSeptember23Path')) throw new Error('determinism declaration anchor differs');
          text = text.replace(declaration, newDeclaration);
          const continuation = '  augustNarRegularRefreshAPlusSixthPath,\n];';
          if (!text.includes(continuation)) throw new Error('determinism continuation anchor differs');
          text = text.replace(continuation, '  augustNarRegularRefreshAPlusSixthPath,\n  septemberHkjcFixtureSeptember23Path,\n];');
          const counts = '  [augustNarRegularRefreshAPlusSixthPath, [2, 2]],\n]);';
          if (!text.includes(counts)) throw new Error('determinism expected-count anchor differs');
          text = text.replace(counts, '  [augustNarRegularRefreshAPlusSixthPath, [2, 2]],\n  [septemberHkjcFixtureSeptember23Path, [1, 0]],\n]);');
          fs.writeFileSync(p, text);
          NODE

      - name: Apply reviewed Rank C meeting only
        run: node scripts/timetable/promote-timetable.mjs --input data/candidates/hkjc-september-2026-09-23-fixture-approved.json

      - name: Rebuild deterministic public and operations projections
        run: |
          node scripts/timetable/build-public-timetable-view.mjs
          node scripts/timetable/build-japan-a-plus-public-overrides.mjs
          node scripts/timetable/build-operations-status.mjs --reference-date 2026-07-01
          node scripts/timetable/build-operations-review-package.mjs

      - name: Validate generated repository data
        run: |
          node scripts/validate-data.mjs
          node scripts/check-japan-a-plus-public-overrides.mjs
          node scripts/check-calendar-operations-status.mjs
          node scripts/check-calendar-operations-review-package.mjs

      - name: Verify cumulative reviewed promotion determinism
        env:
          BASE_SHA: c9f9d464acfdf9edc230b263f000e89b11db3c07
        run: node scripts/check-calendar-nar-incremental-v2-promotion-output-determinism.mjs

      - name: Verify exact bounded delta and publication boundary
        env:
          BASE_SHA: c9f9d464acfdf9edc230b263f000e89b11db3c07
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const id = 'hkjc-happy-valley-racecourse-2026-09-23';
          const readBase = (p) => JSON.parse(execFileSync('git', ['show', `${process.env.BASE_SHA}:${p}`], { encoding: 'utf8' }));
          const baseMeetings = readBase('data/generated/timetable/canonical/meetings.json');
          const baseDetails = readBase('data/generated/timetable/canonical/meeting-details.json');
          const basePublic = readBase('data/generated/timetable/public/meeting-list.json');
          const basePublicDetails = readBase('data/generated/timetable/public/meeting-details.json');
          const baseStatus = readBase('data/generated/timetable/operations-status.json');
          const meetings = JSON.parse(fs.readFileSync('data/generated/timetable/canonical/meetings.json', 'utf8'));
          const details = JSON.parse(fs.readFileSync('data/generated/timetable/canonical/meeting-details.json', 'utf8'));
          const publicList = JSON.parse(fs.readFileSync('data/generated/timetable/public/meeting-list.json', 'utf8'));
          const publicDetails = JSON.parse(fs.readFileSync('data/generated/timetable/public/meeting-details.json', 'utf8'));
          const status = JSON.parse(fs.readFileSync('data/generated/timetable/operations-status.json', 'utf8'));
          if (meetings.meetings.length !== baseMeetings.meetings.length + 1) throw new Error('canonical meeting delta is not +1');
          if (details.details.length !== baseDetails.details.length) throw new Error('canonical detail delta is not +0');
          if (publicList.meetings.length !== basePublic.meetings.length + 1) throw new Error('public meeting delta is not +1');
          if (publicDetails.details.length !== basePublicDetails.details.length) throw new Error('public detail delta is not +0');
          const meeting = meetings.meetings.find((row) => row.meeting_id === id);
          const pub = publicList.meetings.find((row) => row.meeting_id === id);
          if (meeting?.capability_rank !== 'C' || meeting.first_race_time_local !== null || meeting.last_race_time_local !== null) throw new Error('canonical C boundary differs');
          if ((pub?.effective_public_rank ?? pub?.capability_rank) !== 'C') throw new Error('public C boundary differs');
          if (details.details.some((row) => row.meeting_id === id) || publicDetails.details.some((row) => row.meeting_id === id)) throw new Error('fixture unexpectedly has detail');
          if (status.public_projection?.meeting_count !== baseStatus.public_projection?.meeting_count) throw new Error(`operations public meeting count changed unexpectedly: ${baseStatus.public_projection?.meeting_count} -> ${status.public_projection?.meeting_count}`);
          if (status.public_projection?.detail_count !== baseStatus.public_projection?.detail_count) throw new Error(`operations public detail count changed unexpectedly: ${baseStatus.public_projection?.detail_count} -> ${status.public_projection?.detail_count}`);
          if (status.public_projection?.latest_meeting_date !== baseStatus.public_projection?.latest_meeting_date) throw new Error(`operations public horizon changed unexpectedly: ${baseStatus.public_projection?.latest_meeting_date} -> ${status.public_projection?.latest_meeting_date}`);
          const serialized = JSON.stringify(meeting).toLowerCase();
          for (const field of ['horse_name','jockey','trainer','odds','payout','result','prediction','raw_html','stream_url']) if (serialized.includes(field)) throw new Error(`forbidden field ${field}`);
          console.log(JSON.stringify({
            base_canonical_meetings: baseMeetings.meetings.length,
            head_canonical_meetings: meetings.meetings.length,
            base_public_meetings: basePublic.meetings.length,
            head_public_meetings: publicList.meetings.length,
            base_operations_meetings: baseStatus.public_projection?.meeting_count,
            head_operations_meetings: status.public_projection?.meeting_count,
            base_operations_latest: baseStatus.public_projection?.latest_meeting_date,
            head_operations_latest: status.public_projection?.latest_meeting_date,
            details: details.details.length,
            added_meeting_id: id,
            rank: 'C'
          }, null, 2));
          NODE
          git diff --check

      - name: Remove one-shot workflow and commit bounded output
        run: |
          rm .github/workflows/calendar-hkjc-september-2026-09-23-fixture-apply-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            data/candidates/hkjc-september-2026-09-23-fixture-approved.json \
            data/generated/timetable/canonical/meetings.json \
            data/generated/timetable/canonical/meeting-details.json \
            data/generated/timetable/public/meeting-list.json \
            data/generated/timetable/public/meeting-details.json \
            data/generated/timetable/public/japan-a-plus-overrides.json \
            data/generated/timetable/operations-status.json \
            data/generated/timetable/operations-review-package.json \
            scripts/check-calendar-nar-incremental-v2-promotion-output-determinism.mjs \
            .github/workflows/calendar-hkjc-september-2026-09-23-fixture-apply-once.yml
          git diff --cached --check
          git commit -m 'Apply reviewed HKJC September 23 Happy Valley fixture'
          git push origin HEAD:review/hkjc-2026-09-23-happy-valley-c
