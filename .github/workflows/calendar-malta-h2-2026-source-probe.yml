name: Calendar Malta H2 2026 official source discovery

on:
  pull_request:
    paths:
      - '.github/workflows/calendar-malta-h2-2026-source-probe.yml'
      - 'scripts/timetable/probe-malta-h2-2026-source.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/timetable/probe-malta-h2-2026-source.mjs
      - name: Inspect approved public official pages without source retention
        run: node scripts/timetable/probe-malta-h2-2026-source.mjs
