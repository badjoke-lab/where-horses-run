name: Canada AGCO Mohawk fast probe

on:
  pull_request:
    paths:
      - '.github/workflows/calendar-canada-agco-mohawk-fast-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --no-audit --no-fund
      - name: Fetch and inspect approved Woodbine Mohawk calendar
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (compatible; WhereHorsesRun/1.0; +https://github.com/badjoke-lab/where-horses-run)'
          url='https://www.agco.ca/sites/default/files/2026-03/MOHS%20-%20Approved%202026%20Race%20Date%20Calendar_E_17%20Mar%202026.pdf'
          curl -L --fail -sS -A "$UA" --connect-timeout 12 --max-time 45 "$url" -o /tmp/mohawk.pdf
          echo "AGCO_PDF_BYTES=$(wc -c < /tmp/mohawk.pdf)"
          file /tmp/mohawk.pdf
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {getDocument} from 'pdfjs-dist/legacy/build/pdf.mjs';
          const bytes=new Uint8Array(fs.readFileSync('/tmp/mohawk.pdf'));
          const pdf=await getDocument({data:bytes,disableWorker:true}).promise;
          console.log('AGCO_PAGES',pdf.numPages);
          for(let p=1;p<=pdf.numPages;p++){
            const page=await pdf.getPage(p);
            const content=await page.getTextContent();
            const rows=content.items.map((it,i)=>({
              i,
              text:String(it.str??'').trim(),
              x:Number((it.transform?.[4]??0).toFixed(2)),
              y:Number((it.transform?.[5]??0).toFixed(2)),
              w:Number((it.width??0).toFixed(2)),
              h:Number((it.height??0).toFixed(2))
            })).filter(x=>x.text);
            console.log('AGCO_ITEMS',JSON.stringify(rows));
            console.log('AGCO_TEXT',rows.map(x=>x.text).join(' '));
          }
          NODE
