name: Temporary FAQ content discovery

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/components/FaqPage.astro'
      - 'src/pages/faq/index.astro'
      - 'src/pages/ja/faq/index.astro'
      - 'src/pages/index.astro'
      - 'src/pages/ja/index.astro'
      - '.github/workflows/temporary-faq-content-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install dependencies without generating a lockfile
        run: npm install --package-lock=false
      - name: Build complete static site
        run: npm run build
      - name: Measure FAQ pages and expanded public inventory
        shell: bash
        run: |
          node <<'NODE' > faq-content-discovery.json
          const fs = require('node:fs');
          const path = require('node:path');

          function decode(value) {
            return value
              .replace(/&#x([0-9a-f]+);/gi, (_, hex) => String.fromCodePoint(Number.parseInt(hex, 16)))
              .replace(/&#(\d+);/g, (_, decimal) => String.fromCodePoint(Number.parseInt(decimal, 10)))
              .replaceAll('&quot;', '"')
              .replaceAll('&#39;', "'")
              .replaceAll('&#x27;', "'")
              .replaceAll('&lt;', '<')
              .replaceAll('&gt;', '>')
              .replaceAll('&amp;', '&');
          }

          function strip(value) {
            return decode(value.replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim());
          }

          function attrs(tag) {
            return Object.fromEntries([...tag.matchAll(/([:\w-]+)="([^"]*)"/g)].map((match) => [match[1], decode(match[2])]));
          }

          function fileFor(urlString) {
            const pathname = new URL(urlString).pathname;
            return pathname === '/' ? 'dist/index.html' : path.join('dist', pathname.replace(/^\//, ''), 'index.html');
          }

          const sitemap = fs.readFileSync('dist/sitemap.xml', 'utf8');
          const urls = [...sitemap.matchAll(/<loc>([^<]+)<\/loc>/g)].map((match) => match[1]);
          const pages = urls.map((url) => {
            const html = fs.readFileSync(fileFor(url), 'utf8');
            return {
              url,
              lang: html.match(/<html\s+[^>]*lang="([^"]+)"/)?.[1] || '',
              title: strip(html.match(/<title>([\s\S]*?)<\/title>/i)?.[1] || ''),
              html,
            };
          });

          const faqUrls = [
            'https://whr.badjoke-lab.com/faq/',
            'https://whr.badjoke-lab.com/ja/faq/',
          ];
          const faqPages = [];
          const errors = [];

          for (const url of faqUrls) {
            const page = pages.find((entry) => entry.url === url);
            if (!page) {
              errors.push(`${url}: missing from sitemap`);
              continue;
            }
            const html = page.html;
            const canonical = [...html.matchAll(/<link\s+[^>]*>/g)].map((match) => attrs(match[0])).find((link) => link.rel === 'canonical')?.href || '';
            const alternates = [...html.matchAll(/<link\s+[^>]*>/g)].map((match) => attrs(match[0])).filter((link) => link.rel === 'alternate' && link.hreflang);
            const questions = [...html.matchAll(/<article\s+[^>]*class="[^"]*faq-item[^"]*"[^>]*>([\s\S]*?)<\/article>/g)].map((match) => ({
              question: strip(match[1].match(/<h2[^>]*>([\s\S]*?)<\/h2>/)?.[1] || ''),
              answer: strip(match[1].match(/<p[^>]*>([\s\S]*?)<\/p>/)?.[1] || ''),
            }));
            const scripts = [...html.matchAll(/<script([^>]*type="application\/ld\+json"[^>]*)>([\s\S]*?)<\/script>/g)];
            const faqScripts = scripts.filter((script) => /data-faq-structured-data="faq-page-v1"/.test(script[1]));
            let structured = null;
            if (faqScripts.length === 1) {
              try { structured = JSON.parse(faqScripts[0][2]); }
              catch (error) { errors.push(`${url}: invalid FAQ JSON-LD ${error.message}`); }
            } else {
              errors.push(`${url}: expected one FAQ JSON-LD script, found ${faqScripts.length}`);
            }
            const entities = structured?.mainEntity || [];
            const visibleMatchesStructured = questions.length === entities.length && questions.every((item, index) =>
              entities[index]?.['@type'] === 'Question' &&
              entities[index]?.name === item.question &&
              entities[index]?.acceptedAnswer?.['@type'] === 'Answer' &&
              entities[index]?.acceptedAnswer?.text === item.answer
            );
            if (!visibleMatchesStructured) errors.push(`${url}: visible and structured FAQ differ`);
            faqPages.push({
              url,
              lang: page.lang,
              title: page.title,
              canonical,
              alternateLinks: alternates.length,
              alternateLanguages: alternates.map((link) => link.hreflang).sort(),
              visibleQuestions: questions.length,
              visibleAnswers: questions.filter((item) => item.answer).length,
              structuredType: structured?.['@type'] || '',
              structuredQuestions: entities.length,
              visibleMatchesStructured,
            });
          }

          const summary = {
            publicPages: pages.length,
            englishPages: pages.filter((page) => page.lang === 'en').length,
            japanesePages: pages.filter((page) => page.lang === 'ja').length,
            bilingualClusters: (pages.length - 3) / 2,
            pairedPages: pages.length - 3,
            unpairedPages: 3,
            expectedHreflangLinks: (pages.length - 3) * 3,
            faqPages: faqPages.length,
            faqVisibleQuestions: faqPages.reduce((sum, page) => sum + page.visibleQuestions, 0),
            faqVisibleAnswers: faqPages.reduce((sum, page) => sum + page.visibleAnswers, 0),
            faqStructuredQuestions: faqPages.reduce((sum, page) => sum + page.structuredQuestions, 0),
            faqPagesDetail: faqPages,
            errors,
          };
          console.log(JSON.stringify(summary, null, 2));
          NODE
          cat faq-content-discovery.json
      - name: Probe existing SEO checker compatibility
        shell: bash
        run: |
          set +e
          : > faq-existing-checker-status.txt
          for checker in \
            scripts/check-sitemap-robots.mjs \
            scripts/check-structured-data-baseline.mjs \
            scripts/check-canonical-hreflang-review.mjs \
            scripts/check-open-graph-social-cards.mjs \
            scripts/check-title-description-normalization.mjs \
            scripts/check-country-page-metadata.mjs \
            scripts/check-racecourse-page-metadata.mjs \
            scripts/check-glossary-page-metadata.mjs
          do
            printf '\n===== %s =====\n' "$checker" >> faq-existing-checker-status.txt
            node "$checker" >> faq-existing-checker-status.txt 2>&1
            printf 'exit_code=%s\n' "$?" >> faq-existing-checker-status.txt
          done
          cat faq-existing-checker-status.txt
          exit 0
      - name: Upload FAQ discovery
        uses: actions/upload-artifact@v4
        with:
          name: faq-content-discovery
          path: |
            faq-content-discovery.json
            faq-existing-checker-status.txt
          retention-days: 1
