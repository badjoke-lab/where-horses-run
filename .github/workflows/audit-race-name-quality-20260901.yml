name: Audit public race-name quality 2026-09-01

on:
  push:
    branches:
      - audit/race-name-quality-20260901

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Audit public A+ race names
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const data = JSON.parse(fs.readFileSync('data/generated/timetable/public/meeting-details.json','utf8'));
          const details = Array.isArray(data.details) ? data.details : [];
          const generic = new Set(['特別','重賞','準重賞','一般','新馬','未勝利']);
          const by = new Map();
          const genericExamples=[];
          for (const d of details) {
            const rank=d.effective_public_rank ?? d.capability_rank;
            if (rank !== 'A+' || !d.show_race_name) continue;
            const key=`${d.country_id}\t${d.authority_id}`;
            if (!by.has(key)) by.set(key,{country_id:d.country_id,authority_id:d.authority_id,meetings:0,rows:0,missing:0,generic_label_only:0});
            const x=by.get(key); x.meetings++;
            for (const row of d.timetable_rows ?? []) {
              x.rows++;
              const name=typeof row.race_name==='string'?row.race_name.trim():'';
              if (!name) x.missing++;
              if (generic.has(name)) {
                x.generic_label_only++;
                if (genericExamples.length<100) genericExamples.push({authority_id:d.authority_id,meeting_id:d.meeting_id,label:row.label,race_name:name});
              }
            }
          }
          console.log(JSON.stringify({generated_at:data.generated_at,summary:[...by.values()],generic_examples:genericExamples},null,2));
          NODE
