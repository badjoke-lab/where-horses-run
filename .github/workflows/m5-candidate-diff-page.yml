name: M5 candidate diff page

on:
  pull_request:
    paths:
      - 'scripts/timetable/candidate-diff-page.mjs'
      - 'scripts/render-m5-candidate-diff-page.mjs'
      - 'scripts/check-m5-candidate-diff-page.mjs'
      - '.github/workflows/m5-candidate-diff-page.yml'
      - 'data/candidates/japan-jra-candidates.json'
      - 'data/generated/timetable/canonical/meetings.json'
      - 'data/generated/timetable/canonical/meeting-details.json'
  push:
    branches:
      - main
    paths:
      - 'scripts/timetable/candidate-diff-page.mjs'
      - 'scripts/render-m5-candidate-diff-page.mjs'
      - 'scripts/check-m5-candidate-diff-page.mjs'
      - '.github/workflows/m5-candidate-diff-page.yml'
      - 'data/candidates/japan-jra-candidates.json'
      - 'data/generated/timetable/canonical/meetings.json'
      - 'data/generated/timetable/canonical/meeting-details.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m5-candidate-diff-page-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Validate diff contract
        run: node scripts/check-m5-candidate-diff-page.mjs
      - name: Render current JRA candidate review artifact
        run: >-
          node scripts/render-m5-candidate-diff-page.mjs
          --candidate data/candidates/japan-jra-candidates.json
          --baseline data/generated/timetable/canonical/meetings.json
          --baseline-details data/generated/timetable/canonical/meeting-details.json
          --output artifacts/m5-candidate-diff/japan-jra.html
      - name: Assert page is not wired into site output
        run: |
          test ! -e public/m5-candidate-diff
          test ! -e src/pages/m5-candidate-diff
          grep -q 'REVIEW ONLY — NOT PUBLICATION' artifacts/m5-candidate-diff/japan-jra.html
          grep -q 'noindex,nofollow,noarchive' artifacts/m5-candidate-diff/japan-jra.html
      - uses: actions/upload-artifact@v4
        with:
          name: m5-candidate-diff-japan-jra
          path: artifacts/m5-candidate-diff/japan-jra.html
          retention-days: 7
          if-no-files-found: error
      - run: git diff --exit-code
