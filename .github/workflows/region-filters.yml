name: Region filters gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'data/audits/region-filters-v1.json'
      - 'data/static/region-filter-contract-v1.json'
      - 'docs/search/region-filters.md'
      - 'scripts/check-country-filters.mjs'
      - 'scripts/check-region-filters.mjs'
      - 'src/components/CountryDirectoryPage.astro'
      - 'src/lib/country-filter-data.ts'
      - '.github/workflows/region-filters.yml'
  push:
    branches:
      - main
    paths:
      - 'data/audits/region-filters-v1.json'
      - 'data/static/region-filter-contract-v1.json'
      - 'docs/search/region-filters.md'
      - 'scripts/check-country-filters.mjs'
      - 'scripts/check-region-filters.mjs'
      - 'src/components/CountryDirectoryPage.astro'
      - 'src/lib/country-filter-data.ts'
      - '.github/workflows/region-filters.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install dependencies without generating a lockfile
        run: npm install --package-lock=false
      - name: Build bilingual region navigation and site
        run: npm run build
      - name: Preserve glossary public v1 contract
        run: node scripts/check-glossary-qa-release.mjs
      - name: Preserve global search foundation contract
        run: node scripts/check-global-search-foundation.mjs
      - name: Preserve country filter contract
        run: node scripts/check-country-filters.mjs
      - name: Preserve race type filter contract
        run: node scripts/check-race-type-filters.mjs
      - name: Validate region filters
        id: region_filters
        shell: bash
        run: |
          set +e
          node scripts/check-region-filters.mjs > region-filter-check.log 2>&1
          status=$?
          cat region-filter-check.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Capture rendered region facets
        if: steps.region_filters.outputs.status != '0'
        shell: bash
        run: |
          node <<'NODE' > region-filter-facets.log
          const fs = require('node:fs');
          const html = fs.readFileSync('dist/countries/index.html', 'utf8');
          const cards = [...html.matchAll(/<article[^>]*data-country-record(?=[\s>])[\s\S]*?<\/article>/g)].map((match) => match[0]);
          const memberships = cards.flatMap((card) => {
            const value = card.match(/data-country-regions="([^"]*)"/)?.[1] ?? '';
            return value.split('|').filter(Boolean);
          });
          const navCards = [...html.matchAll(/<article[^>]*data-region-filter-card(?=[\s>])[\s\S]*?<\/article>/g)].map((match) => match[0]);
          const navigation = navCards.map((card) => ({
            id: card.match(/data-region-id="([^"]*)"/)?.[1] ?? '',
            count: Number(card.match(/data-region-count="([^"]*)"/)?.[1] ?? 0),
          }));
          const select = html.match(/<select[^>]*id="country-filter-region"[^>]*>([\s\S]*?)<\/select>/)?.[1] ?? '';
          const options = [...select.matchAll(/<option value="([^"]*)"/g)].map((match) => match[1]).filter((value) => value !== 'all');
          console.log(JSON.stringify({
            memberships: [...new Set(memberships)].sort(),
            navigation,
            options,
          }, null, 2));
          NODE
          cat region-filter-facets.log
      - name: Upload region filter diagnostics
        if: steps.region_filters.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: region-filter-check-log
          path: |
            region-filter-check.log
            region-filter-facets.log
          retention-days: 1
      - name: Fail when region filter validation failed
        if: steps.region_filters.outputs.status != '0'
        run: exit 1
      - name: Remove diagnostic logs
        if: always()
        run: rm -f region-filter-check.log region-filter-facets.log
      - name: Prove repository clean
        run: |
          changes="$(git status --porcelain --untracked-files=all)"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            exit 1
          fi
