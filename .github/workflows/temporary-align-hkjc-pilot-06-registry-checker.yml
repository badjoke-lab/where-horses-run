name: Temporary HKJC PILOT-06 Registry checker alignment

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - work/calendar-hkjc-detail-runner-reconciliation

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/calendar-hkjc-detail-runner-reconciliation
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Align HKJC Registry checker
        run: node scripts/temporary-align-hkjc-pilot-06-registry-checker.mjs
      - name: Validate Registry and reviewed-import foundation
        run: |
          node scripts/check-calendar-acquisition-registry.mjs
          node scripts/check-calendar-runner-compatibility.mjs
          node scripts/check-calendar-hkjc-detail-reviewed-import.mjs
      - name: Commit aligned checker when needed
        run: |
          if git diff --quiet; then
            echo "No checker change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check-calendar-acquisition-registry.mjs
          git commit -m "[CF-Pages-Skip] Align HKJC Registry checker with P6 runner state"
          git push origin HEAD:work/calendar-hkjc-detail-runner-reconciliation
