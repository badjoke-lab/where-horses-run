name: Calendar Iran Aqqala autumn 1405 source probe
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/calendar-iran-aqqala-week5-source-probe.yml'
      - 'scripts/timetable/probe-iran-aqqala-week5-1405.mjs'
      - 'scripts/timetable/probe-iran-aqqala-independent-web-20261030.mjs'
permissions:
  contents: read
jobs:
  official-source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parser and robots fixtures
        run: |
          node --check scripts/timetable/probe-iran-aqqala-week5-1405.mjs
          node scripts/timetable/probe-iran-aqqala-week5-1405.mjs --self-test
      - name: Source-scoped bulletin and physical racecourse verification
        run: node scripts/timetable/probe-iran-aqqala-week5-1405.mjs
      - name: Independent web-source parser, venue guard, and robots fixtures
        run: |
          node --check scripts/timetable/probe-iran-aqqala-independent-web-20261030.mjs
          node scripts/timetable/probe-iran-aqqala-independent-web-20261030.mjs --self-test
      - name: Restricted non-Telegram 2026 local-web discovery
        run: node scripts/timetable/probe-iran-aqqala-independent-web-20261030.mjs
