name: Manual JRA refresh command

on:
  pull_request:
    paths:
      - 'refresh-jra-manual'
      - 'scripts/timetable/manual-refresh-jra.mjs'
      - 'scripts/timetable/sync-jra-derived-artifacts.mjs'
      - 'docs/calendar/manual-jra-refresh.md'
      - '.github/workflows/manual-jra-refresh-command.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Validate launcher syntax
        run: sh -n refresh-jra-manual
      - name: Validate isolated checkout contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F -- '--filter=blob:none' refresh-jra-manual
          grep -F -- '--no-checkout' refresh-jra-manual
          grep -F 'sparse-checkout init --no-cone' refresh-jra-manual
          grep -F '!/docs/' refresh-jra-manual
          grep -F 'trap cleanup' refresh-jra-manual
      - name: Validate Node syntax
        run: |
          node --check scripts/timetable/manual-refresh-jra.mjs
          node --check scripts/timetable/sync-jra-derived-artifacts.mjs
      - name: Validate command contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F "scripts/timetable/refresh-jra.mjs" scripts/timetable/manual-refresh-jra.mjs
          grep -F "scripts/timetable/build-japan-a-plus-public-overrides.mjs" scripts/timetable/manual-refresh-jra.mjs
          grep -F "scripts/check-japan-a-plus-public-overrides.mjs" scripts/timetable/manual-refresh-jra.mjs
          grep -F "scripts/timetable/sync-jra-derived-artifacts.mjs" scripts/timetable/manual-refresh-jra.mjs
          grep -F "data/generated/timetable/public/japan-a-plus-overrides.json" scripts/timetable/manual-refresh-jra.mjs
          grep -F "data/candidates/japan-jra-candidates.json" scripts/timetable/manual-refresh-jra.mjs
          grep -F "data/generated/timetable/jra-pilot-review.json" scripts/timetable/manual-refresh-jra.mjs
          grep -F "data/generated/timetable/operations-status.json" scripts/timetable/manual-refresh-jra.mjs
          grep -F "data/generated/timetable/operations-review-package.json" scripts/timetable/manual-refresh-jra.mjs
          grep -F "scripts/check-japan-jra-candidate-generator.mjs" scripts/timetable/manual-refresh-jra.mjs
          grep -F "scripts/check-jra-pilot-foundation.mjs" scripts/timetable/manual-refresh-jra.mjs
          grep -F "scripts/check-calendar-operations-status.mjs" scripts/timetable/manual-refresh-jra.mjs
          grep -F "scripts/check-calendar-operations-review-package.mjs" scripts/timetable/manual-refresh-jra.mjs
          grep -F "a_plus_meetings" scripts/timetable/manual-refresh-jra.mjs
          grep -F "isExpectedNonRacing403" scripts/timetable/manual-refresh-jra.mjs
          grep -F "}).trimEnd();" scripts/timetable/manual-refresh-jra.mjs
          ! grep -F "}).trim();" scripts/timetable/manual-refresh-jra.mjs
          grep -F "'install', '--package-lock=false', '--no-audit', '--no-fund'" scripts/timetable/manual-refresh-jra.mjs
          grep -F "'push', '--force-with-lease'" scripts/timetable/manual-refresh-jra.mjs
          grep -F "'pr', 'create'" scripts/timetable/manual-refresh-jra.mjs
          grep -F "rollbackGenerated" scripts/timetable/manual-refresh-jra.mjs
          ! grep -E '^[[:space:]]+(schedule:|- cron:)' .github/workflows/manual-jra-refresh-command.yml
      - name: Validate current Japan A+ override synchronization
        run: node scripts/timetable/build-japan-a-plus-public-overrides.mjs --check
      - run: npm install --package-lock=false --no-audit --no-fund
      - run: npm run build
