name: Calendar acquisition completion contract

on:
  pull_request:
    paths:
      - 'docs/calendar/acquisition-completion-contract.md'
      - 'data/static/calendar-acquisition-registry.json'
      - 'scripts/timetable/acquisition-completion.mjs'
      - 'scripts/timetable/**'
      - 'scripts/check-calendar-acquisition-completion.mjs'
      - 'scripts/check-calendar-non-running-evidence-registry.mjs'
      - 'scripts/check-hkjc-non-running-evidence.mjs'
      - 'scripts/check-uae-era-non-running-evidence.mjs'
      - 'scripts/check-jra-non-running-evidence.mjs'
      - 'scripts/check-jra-non-running-discovery.mjs'
      - 'scripts/check-banei-non-running-evidence.mjs'
      - 'scripts/check-banei-non-running-discovery.mjs'
      - 'scripts/check-nar-non-running-evidence.mjs'
      - 'scripts/check-nar-non-running-discovery.mjs'
      - 'data/static/calendar-non-running-evidence-registry-v1.json'
      - 'data/static/calendar-non-running-evidence-registry.schema.json'
      - 'scripts/check-japan-acquisition-completion.mjs'
      - 'scripts/check-tjk-a-plus-programme-parser.mjs'
      - 'scripts/check-tjk-non-running-evidence.mjs'
      - 'scripts/probe-sorec-non-running-calendar.mjs'
      - '.github/workflows/calendar-acquisition-completion.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/calendar/acquisition-completion-contract.md'
      - 'data/static/calendar-acquisition-registry.json'
      - 'scripts/timetable/acquisition-completion.mjs'
      - 'scripts/timetable/**'
      - 'scripts/check-calendar-acquisition-completion.mjs'
      - 'scripts/check-japan-acquisition-completion.mjs'
      - 'scripts/check-tjk-a-plus-programme-parser.mjs'
      - 'scripts/check-tjk-non-running-evidence.mjs'
      - '.github/workflows/calendar-acquisition-completion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Validate acquisition completion contract
        run: node scripts/check-calendar-acquisition-completion.mjs
      - name: Validate Wave 3 canonical authority
        run: node scripts/check-calendar-authority-wave3-canonical.mjs
      - name: Validate Wave 4 shared publication authority
        run: node scripts/check-calendar-authority-wave4-publication.mjs
      - name: Validate Wave 5 runtime consumer boundary
        run: node scripts/check-calendar-authority-wave5-runtime.mjs
      - name: Validate Japan acquisition completion normalization
        run: node scripts/check-japan-acquisition-completion.mjs
      - name: Validate TJK A+ programme parsing
        run: node scripts/check-tjk-a-plus-programme-parser.mjs
      - name: Validate non-running evidence coverage
        run: |
          node scripts/check-calendar-non-running-evidence-registry.mjs
          node scripts/check-hkjc-non-running-evidence.mjs
          node scripts/check-uae-era-non-running-evidence.mjs
          node scripts/check-jra-non-running-evidence.mjs
          node scripts/check-jra-non-running-discovery.mjs
          node scripts/check-banei-non-running-evidence.mjs
          node scripts/check-banei-non-running-discovery.mjs
          node scripts/check-nar-non-running-evidence.mjs
          node scripts/check-nar-non-running-discovery.mjs
          node scripts/check-tjk-non-running-evidence.mjs
          node scripts/probe-sorec-non-running-calendar.mjs
