name: Calendar Public v1 pilot-record reconciliation

on:
  pull_request:
    paths:
      - 'data/audits/calendar-public-v1-pilot-record-reconciliation-v1.json'
      - 'docs/calendar/public-v1-pilot-record-reconciliation.md'
      - 'docs/calendar/README.md'
      - 'docs/calendar/implementation-roadmap.md'
      - 'src/lib/timetable/publicCoverageState.mjs'
      - 'src/data/timetableMeetingRows.ts'
      - 'src/components/TimetableMeetingList.astro'
      - 'scripts/check-calendar-public-v1-pilot-record-reconciliation.mjs'
      - 'scripts/check-calendar-public-v1-pilot-record-rendered.mjs'
      - '.github/workflows/calendar-public-v1-pilot-record-reconciliation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install dependencies
        run: npm install
      - name: Validate pilot-record reconciliation
        run: node scripts/check-calendar-public-v1-pilot-record-reconciliation.mjs
      - name: Build deterministic rendered fixture
        env:
          WHR_CALENDAR_REFERENCE_DATE: '2026-07-01'
          WHR_CALENDAR_TIMEZONE: Asia/Tokyo
        run: npm run build
      - name: Validate rendered bilingual coverage states
        env:
          WHR_CALENDAR_REFERENCE_DATE: '2026-07-01'
          WHR_CALENDAR_TIMEZONE: Asia/Tokyo
        run: node scripts/check-calendar-public-v1-pilot-record-rendered.mjs
      - name: Validate read-only boundary and diff hygiene
        run: |
          git diff --check
          node - <<'NODE'
          const fs = require('node:fs');
          const workflow = fs.readFileSync('.github/workflows/calendar-public-v1-pilot-record-reconciliation.yml', 'utf8');
          if (!workflow.includes('permissions:\n  contents: read')) throw new Error('contents permission must remain read-only');
          if (/contents:\s*write/.test(workflow) || /pull-requests:\s*write/.test(workflow)) throw new Error('write permission enabled');
          if (/\bschedule\s*:|\bcron\s*:/.test(workflow)) throw new Error('scheduled execution enabled');
          console.log('CALENDAR_PUBLIC_V1_PILOT_RECORD_BOUNDARY: pass');
          NODE
