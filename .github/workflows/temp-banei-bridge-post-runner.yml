name: Temporary Banei bridge post-runner updater

on:
  pull_request:
    paths:
      - 'scripts/update-banei-bridge-after-actions-runner.mjs'
      - '.github/workflows/temp-banei-bridge-post-runner.yml'

permissions:
  contents: write

jobs:
  update:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Update Banei bridge after Actions runner convergence
        run: node scripts/update-banei-bridge-after-actions-runner.mjs
      - name: Commit bridge consistency updates
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/timetable/banei-control-plane-bridge.mjs \
            scripts/check-calendar-banei-control-plane-bridge.mjs \
            docs/calendar/banei-control-plane-bridge.md
          git commit -m "[CF-Pages-Skip] Align Banei bridge after Actions runner convergence"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
