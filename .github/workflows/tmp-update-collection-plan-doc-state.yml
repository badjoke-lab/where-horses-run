name: Temporary Collection Plan documentation state update

on:
  pull_request:
    paths:
      - 'scripts/tmp-update-collection-plan-doc-state.mjs'
      - '.github/workflows/tmp-update-collection-plan-doc-state.yml'
  push:
    branches:
      - work/calendar-collection-plan-schema

permissions:
  contents: write

jobs:
  update-and-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/calendar-collection-plan-schema
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Apply exact documentation transitions
        run: node scripts/tmp-update-collection-plan-doc-state.mjs
      - name: Validate Plan Job Registry and governance
        run: |
          node scripts/check-calendar-collection-plan.mjs
          node scripts/check-calendar-collection-job.mjs
          node scripts/check-calendar-acquisition-registry.mjs
          node scripts/check-project-governance-docs.mjs
      - name: Commit docs state and remove temporary updater
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            START-HERE.md \
            docs/project-roadmap.md \
            docs/calendar/implementation-roadmap.md \
            docs/calendar/acquisition-control-plane-implementation-plan.md \
            docs/calendar/machine-readable-contracts.md \
            docs/calendar/README.md \
            docs/calendar/acquisition-registry.md \
            scripts/check-project-governance-docs.mjs
          git rm \
            .github/workflows/tmp-update-collection-plan-doc-state.yml \
            scripts/tmp-update-collection-plan-doc-state.mjs
          git diff --cached --check
          git commit -m "[CF-Pages-Skip] Advance Collection Plan state"
          git push origin HEAD:work/calendar-collection-plan-schema
