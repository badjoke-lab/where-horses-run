name: Iwate current programme probe

on:
  push:
    branches:
      - diag/iwate-current-program-source

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe official Iwate endpoints
        run: |
          node <<'NODE'
          const urls = [
            'https://www.iwatekeiba.or.jp/',
            'https://www.iwatekeiba.or.jp/category/program',
            'https://www.iwatekeiba.or.jp/news/260902d',
            'https://www.iwatekeiba.or.jp/wp-json/wp/v2/search?search=%E4%BB%A4%E5%92%8C8%E5%B9%B4%E5%BA%A6%20%E7%AC%AC5%E5%9B%9E%E6%B0%B4%E6%B2%A2%E7%AB%B6%E9%A6%AC%E6%94%B9%E5%AE%9A%E7%95%AA%E7%B5%84&per_page=20',
            'https://www.iwatekeiba.or.jp/wp-json/wp/v2/posts?search=%E7%AC%AC5%E5%9B%9E%E6%B0%B4%E6%B2%A2%E7%AB%B6%E9%A6%AC%E6%94%B9%E5%AE%9A%E7%95%AA%E7%B5%84&per_page=20',
            'https://www.iwatekeiba.or.jp/dir/wp-content/uploads/2026/09/26-12-05mizusawa_kaitei.pdf',
            'https://www.iwatekeiba.or.jp/dir/wp-content/uploads/2026/09/26-12-05mizusawa_kaitei01.pdf',
            'https://www.iwatekeiba.or.jp/dir/wp-content/uploads/2026/09/26-12-05mizusawa_kaitei02.pdf',
            'https://www.iwatekeiba.or.jp/dir/wp-content/uploads/2026/09/26-12-05mizusawa_kaitei03.pdf',
            'https://www.iwatekeiba.or.jp/dir/wp-content/uploads/2026/09/26-12-05mizusawa_kaitei1.pdf',
            'https://www.iwatekeiba.or.jp/dir/wp-content/uploads/2026/09/26-12-05mizusawa_kaitei2.pdf',
          ];
          const decoder = new TextDecoder('utf-8');
          for (const url of urls) {
            try {
              const response = await fetch(url, {
                redirect: 'follow',
                headers: {
                  'user-agent': 'Mozilla/5.0 (compatible; WhereHorsesRun/1.0; read-only source probe)',
                  accept: '*/*',
                  'accept-language': 'ja,en;q=.7',
                  'cache-control': 'no-cache',
                  pragma: 'no-cache',
                },
              });
              const bytes = new Uint8Array(await response.arrayBuffer());
              const head = decoder.decode(bytes.slice(0, Math.min(bytes.length, 5000)));
              console.log(JSON.stringify({
                requested_url: url,
                status: response.status,
                final_url: response.url,
                content_type: response.headers.get('content-type'),
                bytes: bytes.length,
                is_pdf: bytes[0] === 0x25 && bytes[1] === 0x50 && bytes[2] === 0x44 && bytes[3] === 0x46,
                has_current_title: head.includes('第5回水沢競馬改定番組') || head.includes('第5回水沢競馬'),
                sample: /^application\/json/i.test(response.headers.get('content-type') || '') ? head.slice(0, 3000) : undefined,
              }));
            } catch (error) {
              console.log(JSON.stringify({ requested_url: url, error: String(error?.stack || error) }));
            }
          }
          NODE
