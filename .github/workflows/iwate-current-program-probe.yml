name: Iwate current programme probe

on:
  push:
    branches:
      - diag/iwate-current-program-source

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Inspect official Iwate programme PDF text layout
        run: |
          node <<'NODE'
          import { getDocument } from 'pdfjs-dist/legacy/build/pdf.mjs';

          const url = 'https://www.iwatekeiba.or.jp/dir/wp-content/uploads/2026/09/26-12-05mizusawa_kaitei.pdf';
          const response = await fetch(url, {
            redirect: 'follow',
            headers: {
              'user-agent': 'Mozilla/5.0 (compatible; WhereHorsesRun/1.0; read-only source probe)',
              accept: 'application/pdf',
              'accept-language': 'ja,en;q=.7',
              'cache-control': 'no-cache',
              pragma: 'no-cache',
            },
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const bytes = new Uint8Array(await response.arrayBuffer());
          const document = await getDocument({ data: bytes, useWorkerFetch: false, isEvalSupported: false }).promise;
          console.log(JSON.stringify({ url: response.url, bytes: bytes.length, pages: document.numPages }));
          for (let pageNumber = 1; pageNumber <= document.numPages; pageNumber += 1) {
            const page = await document.getPage(pageNumber);
            const text = await page.getTextContent();
            const items = text.items
              .filter((item) => item.str?.trim())
              .map((item) => ({
                str: item.str.trim(),
                x: Number(item.transform[4].toFixed(2)),
                y: Number(item.transform[5].toFixed(2)),
                w: Number((item.width ?? 0).toFixed(2)),
              }));
            const interesting = items.filter((item) => /9月|13日|14日|15日|発走|時刻|第\s*1|第\s*12|\d{1,2}:\d{2}|\d{1,2}時\d{2}分/.test(item.str));
            console.log(`PAGE ${pageNumber}`);
            for (const item of interesting) console.log(JSON.stringify(item));
          }
          NODE
