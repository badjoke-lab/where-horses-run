name: Calendar HKJC detail route candidate probe

on:
  pull_request:
    paths:
      - 'scripts/timetable/probe-hkjc-detail-route-candidates.mjs'
      - 'scripts/timetable/probe-hkjc-detail-shell-structure.mjs'
      - '.github/workflows/calendar-hkjc-detail-route-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Check probe syntax
        run: |
          node --check scripts/timetable/probe-hkjc-detail-route-candidates.mjs
          node --check scripts/timetable/probe-hkjc-detail-shell-structure.mjs
      - name: Probe public-safe detail route candidates
        run: node scripts/timetable/probe-hkjc-detail-route-candidates.mjs > /tmp/hkjc-detail-route-probe.json
      - name: Probe public-safe detail shell structure
        run: node scripts/timetable/probe-hkjc-detail-shell-structure.mjs > /tmp/hkjc-detail-shell-structure-probe.json
      - name: Validate public-safe probe output
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const routes = JSON.parse(fs.readFileSync('/tmp/hkjc-detail-route-probe.json', 'utf8'));
          const shell = JSON.parse(fs.readFileSync('/tmp/hkjc-detail-shell-structure-probe.json', 'utf8'));
          if (routes.schema_version !== 'calendar-hkjc-detail-route-candidate-probe-v1') throw new Error('route probe schema differs');
          if (!Array.isArray(routes.targets) || routes.targets.length !== 3) throw new Error('expected three reviewed target meetings');
          if (!Array.isArray(routes.results) || routes.results.length !== 9) throw new Error('expected nine route probe results');
          if (routes.raw_body_stored !== false) throw new Error('route probe raw-body boundary differs');
          for (const result of routes.results) if (result.raw_body_stored !== false) throw new Error(`${result.target_date}:${result.id}: raw-body boundary differs`);
          if (shell.schema_version !== 'calendar-hkjc-detail-shell-structure-probe-v1') throw new Error('shell probe schema differs');
          if (shell.raw_body_stored !== false || shell.public_safe_probe_only !== true) throw new Error('shell probe public-safe boundary differs');
          console.log(JSON.stringify({ routes, shell }));
          NODE
      - name: Upload route and shell probe summaries
        uses: actions/upload-artifact@v4
        with:
          name: hkjc-pilot-05-detail-route-probe-${{ github.run_id }}
          path: |
            /tmp/hkjc-detail-route-probe.json
            /tmp/hkjc-detail-shell-structure-probe.json
          if-no-files-found: error
          retention-days: 7
      - name: Prove repository clean
        run: |
          changes="$(git status --porcelain --untracked-files=all)"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            exit 1
          fi
