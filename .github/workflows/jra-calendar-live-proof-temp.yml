name: Temporary JRA calendar live proof

on:
  pull_request:
    paths:
      - '.github/workflows/jra-calendar-live-proof-temp.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect official JRA calendar data dependencies
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, urllib.parse, urllib.request
          base='https://www.jra.go.jp/keiba/calendar/sep.html'
          req=urllib.request.Request(base,headers={'User-Agent':'Mozilla/5.0 (compatible; WhereHorsesRun/1.0)','Accept-Language':'ja'})
          raw=urllib.request.urlopen(req,timeout=20).read()
          text=raw.decode('shift_jis','replace')
          print('PAGE_BYTES',len(raw))
          refs=[]
          for attr in ('src','href'):
              for value in re.findall(rf'{attr}=[\"\']([^\"\']+)[\"\']',text,re.I):
                  if any(token in value.lower() for token in ('calendar','schedule','.js','.json','api')):
                      refs.append(urllib.parse.urljoin(base,value))
          refs=list(dict.fromkeys(refs))
          print('REFS',len(refs))
          print('\n'.join(refs))
          for ref in refs:
              if not ref.lower().split('?',1)[0].endswith('.js'): continue
              try:
                  r=urllib.request.Request(ref,headers={'User-Agent':'Mozilla/5.0 (compatible; WhereHorsesRun/1.0)'})
                  body=urllib.request.urlopen(r,timeout=20).read().decode('utf-8','replace')
              except Exception as exc:
                  print('JS_FAIL',ref,repr(exc)); continue
              print('JS',ref,'BYTES',len(body))
              hits=[]
              for pattern in (r'[^\"\']+\.json[^\"\']*',r'[^\"\']+(?:calendar|schedule)[^\"\']*',r'url\s*:\s*[\"\'][^\"\']+[\"\']'):
                  for hit in re.findall(pattern,body,re.I):
                      value=' '.join(str(hit).split())
                      if value not in hits: hits.append(value)
              print('\n'.join(hits[:120]))
          print('INLINE_MARKERS')
          for token in ('calendarData','schedule','kaisai','開催'):
              for m in list(re.finditer(token,text,re.I))[:10]:
                  print(token, re.sub(r'\s+',' ',text[max(0,m.start()-220):m.start()+420]))
          PY
