name: Temporary Japan mother-set live proof

on:
  pull_request:
    paths:
      - '.github/workflows/jra-calendar-live-proof-temp.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Prove permanent JRA and South Kanto classifiers live
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { discoverJraOfficial30dWithCompleteness } from './scripts/timetable/jra-official-30d-discovery.mjs';
          import { discoverNankankeibaOfficial30d } from './scripts/timetable/nankankeiba-official-30d-discovery.mjs';

          const dates=[];
          const cursor=new Date('2026-09-05T00:00:00Z');
          for(let index=0;index<30;index+=1){
            dates.push(cursor.toISOString().slice(0,10));
            cursor.setUTCDate(cursor.getUTCDate()+1);
          }

          const jra=await discoverJraOfficial30dWithCompleteness({dates,delayMs:0});
          console.log('JRA_COMPLETENESS',JSON.stringify(jra.completeness,null,2));
          console.log('JRA_MEETINGS',jra.meetings.map((row)=>row.meeting_id));
          assert.equal(jra.completeness.completeness,'complete');
          assert.equal(jra.completeness.failure_count,0);
          assert.equal(jra.completeness.parsed_meeting_count,24);
          assert.equal(jra.meetings.length,24);
          assert.equal(jra.completeness.calendar_diagnostics.length,2);
          assert.ok(jra.completeness.calendar_diagnostics.every((row)=>row.structural_valid===true));
          assert.deepEqual(jra.completeness.calendar_diagnostics.map((row)=>row.meeting_count),[20,4]);

          const nankan=await discoverNankankeibaOfficial30d({dates});
          console.log('NANKAN_COMPLETENESS',JSON.stringify(nankan.completeness,null,2));
          console.log('NANKAN_MEETINGS',nankan.meetings.map((row)=>row.meeting_id));
          assert.equal(nankan.completeness.completeness,'complete');
          assert.equal(nankan.completeness.failure_count,0);
          assert.equal(nankan.completeness.parsed_meeting_count,20);
          assert.equal(nankan.meetings.length,20);
          NODE
