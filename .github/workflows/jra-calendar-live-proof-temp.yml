name: Temporary JRA calendar live proof

on:
  pull_request:
    paths:
      - '.github/workflows/jra-calendar-live-proof-temp.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prove official JRA monthly calendar JSON meetings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request
          ua={'User-Agent':'Mozilla/5.0 (compatible; WhereHorsesRun/1.0)','Accept-Language':'ja'}
          def get_json(url):
              req=urllib.request.Request(url,headers=ua)
              return json.loads(urllib.request.urlopen(req,timeout=20).read().decode('utf-8'))
          total=[]
          for ym in ('202609','202610'):
              url=f'https://www.jra.go.jp/keiba/common/calendar/json/{ym}.json'
              data=get_json(url)
              print('MONTH',ym,'ROOT_TYPE',type(data).__name__,'ROOT_LEN',len(data))
              print('ROOT_KEYS',list(data[0].keys()) if data and isinstance(data[0],dict) else None)
              entries=[]
              for root in data:
                  for day in root.get('data',[]):
                      races=[]
                      for info in day.get('info',[]):
                          for race in info.get('race',[]):
                              name=race.get('name')
                              if name: races.append(name)
                      entries.append((str(day.get('date')), races, day))
              for date,races,day in entries:
                  print('DAY',ym+date.zfill(2),'RACES',races,'KEYS',list(day.keys()))
                  if races: total.extend((ym+date.zfill(2),name) for name in races)
              print('ENTRY_COUNT',len(entries),'RACING_DAY_COUNT',sum(bool(r) for _,r,_ in entries),'RACE_MARKERS',sum(len(r) for _,r,_ in entries))
          print('TOTAL_RACE_MARKERS',len(total))
          print('TOTAL',total)
          PY
