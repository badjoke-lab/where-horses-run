name: Temporary JRA calendar live proof

on:
  pull_request:
    paths:
      - '.github/workflows/jra-calendar-live-proof-temp.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect official JRA calendar JSON contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, urllib.request
          ua={'User-Agent':'Mozilla/5.0 (compatible; WhereHorsesRun/1.0)','Accept-Language':'ja'}
          def get(url):
              req=urllib.request.Request(url,headers=ua)
              return urllib.request.urlopen(req,timeout=20).read()
          js=get('https://www.jra.go.jp/keiba/common/calendar/cal.js?version=2026').decode('shift_jis','replace')
          for token in ('cur_YM_JSON','targetJSON','setJSON','setting.json','active.json'):
              print('TOKEN',token)
              for m in list(re.finditer(re.escape(token),js,re.I))[:12]:
                  print(re.sub(r'\s+',' ',js[max(0,m.start()-500):m.start()+900]))
          for url in (
              'https://www.jra.go.jp/keiba/common/calendar/json/setting.json',
              'https://www.jra.go.jp/keiba/common/calendar/json/active.json',
          ):
              try:
                  raw=get(url)
                  print('JSON_URL',url,'BYTES',len(raw))
                  print(raw.decode('utf-8','replace')[:12000])
              except Exception as exc:
                  print('JSON_FAIL',url,repr(exc))
          candidates=[]
          for prefix in ('202609','2609','09','sep','2026_09','2026-09'):
              for suffix in ('.json','/active.json','_active.json'):
                  candidates.append('https://www.jra.go.jp/keiba/common/calendar/json/'+prefix+suffix)
          for url in candidates:
              try:
                  raw=get(url)
                  print('CANDIDATE_OK',url,'BYTES',len(raw),raw[:500])
              except Exception as exc:
                  code=getattr(exc,'code',None)
                  if code not in (403,404): print('CANDIDATE_FAIL',url,repr(exc))
          PY
