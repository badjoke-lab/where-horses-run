name: Calendar NAR current C three A+ review

on:
  pull_request:
    paths:
      - 'data/reviews/nar-current-c-three-a-plus-2026-09-01.json'
      - '.github/workflows/calendar-nar-current-c-three-a-plus-review.yml'

permissions:
  contents: read
  actions: read

jobs:
  validate-review-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Download and pin exact source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -H 'Accept: application/vnd.github+json' \
            /repos/${{ github.repository }}/actions/artifacts/9791050073/zip > /tmp/nar-source.zip
          echo '083a302a213a4287751fcf7ac056d284d00a0abe21f306b67b593d4d866cfd6c  /tmp/nar-source.zip' | sha256sum --check
          mkdir -p /tmp/nar-source
          unzip -q /tmp/nar-source.zip -d /tmp/nar-source
      - name: Validate exact three A+ candidates and current C prestates
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const review = JSON.parse(fs.readFileSync('data/reviews/nar-current-c-three-a-plus-2026-09-01.json','utf8'));
          const expected = [
            'nar-monbetsu-racecourse-2026-09-03',
            'nar-oi-racecourse-2026-09-04',
            'nar-saga-racecourse-2026-09-03',
          ].sort();
          const generic = new Set(['特別','重賞','準重賞','一般','新馬','未勝利']);
          const find = (root, name) => {
            const stack=[root];
            while(stack.length){
              const p=stack.pop();
              for(const ent of fs.readdirSync(p,{withFileTypes:true})){
                const q=path.join(p,ent.name);
                if(ent.isDirectory()) stack.push(q);
                else if(ent.name===name && q.includes(review.source_batch_id)) return q;
              }
            }
            throw new Error(`source ${name} not found`);
          };
          if (review.schema_version !== 'nar-current-c-three-a-plus-review-evidence-v1') throw new Error('review schema differs');
          if (review.source_run_id !== 33483978767 || review.source_head_sha !== 'b14e43430c6242bcdaf00f4087067fec5c2bfb80') throw new Error('source run/head differs');
          if (review.source_artifact_id !== 9791050073 || review.source_artifact_digest !== 'sha256:083a302a213a4287751fcf7ac056d284d00a0abe21f306b67b593d4d866cfd6c') throw new Error('source artifact identity differs');
          if (review.source_batch_id !== 'nar-current-c-live-refresh-2026-09-01-batch-002' || review.source_generated_at !== '2026-09-01T07:49:42Z') throw new Error('source batch identity differs');
          if (review.review?.status !== 'pending' || review.review?.reviewer !== null || review.review?.reviewed_at !== null) throw new Error('review must remain pending');
          if (review.review?.approval_effect !== 'none_until_explicit_human_review') throw new Error('approval boundary differs');
          if (JSON.stringify([...review.candidate_ids].sort()) !== JSON.stringify(expected)) throw new Error('review candidate IDs differ');

          const batchPath=find('/tmp/nar-source','batch.json');
          const batch=JSON.parse(fs.readFileSync(batchPath,'utf8'));
          if (batch.batch_id !== review.source_batch_id || batch.generated_at !== review.source_generated_at) throw new Error('artifact batch differs');
          if ((batch.scheduled_meetings??[]).length !== 59 || (batch.detail_candidates??[]).length !== 3 || (batch.schedule_candidates??[]).length !== 56) throw new Error('source result counts differ');
          if ((batch.schedule_errors??[]).length !== 0) throw new Error('source schedule errors present');
          const detail=[...(batch.detail_candidates??[])].sort((a,b)=>a.candidate_id.localeCompare(b.candidate_id));
          if (JSON.stringify(detail.map(x=>x.candidate_id)) !== JSON.stringify(expected)) throw new Error('artifact A+ identity set differs');
          for (const c of detail) {
            if (c.candidate_rank !== 'A+' || c.meeting_completeness?.all_a_fields_complete !== true || c.meeting_completeness?.all_a_plus_fields_complete !== true) throw new Error(`${c.candidate_id} completeness differs`);
            const rows=c.timetable_rows??[];
            if (!rows.length || rows.length !== c.meeting_completeness.expected_race_count) throw new Error(`${c.candidate_id} row count differs`);
            rows.forEach((r,i)=>{
              if (r.race_number !== i+1 || r.label !== `Race ${i+1}` || !/^\d{2}:\d{2}$/.test(r.post_time_local)) throw new Error(`${c.candidate_id} Rank A row ${i+1} differs`);
              for (const f of ['race_name','distance_m','surface','course_label']) if (r[f]===null || r[f]==='') throw new Error(`${c.candidate_id} row ${i+1} missing ${f}`);
              if (generic.has(String(r.race_name).trim())) throw new Error(`${c.candidate_id} row ${i+1} contains generic race_name`);
            });
          }

          const canonicalMeetings=JSON.parse(fs.readFileSync('data/generated/timetable/canonical/meetings.json','utf8')).meetings;
          const canonicalDetails=JSON.parse(fs.readFileSync('data/generated/timetable/canonical/meeting-details.json','utf8')).details;
          const publicMeetings=JSON.parse(fs.readFileSync('data/generated/timetable/public/meeting-list.json','utf8')).meetings;
          const publicDetails=JSON.parse(fs.readFileSync('data/generated/timetable/public/meeting-details.json','utf8')).details;
          const by=(rows)=>new Map(rows.map(x=>[x.meeting_id,x]));
          const cm=by(canonicalMeetings), cd=by(canonicalDetails), pm=by(publicMeetings), pd=by(publicDetails);
          for(const id of expected){
            if (cm.get(id)?.capability_rank !== 'C') throw new Error(`${id} canonical prestate is not C`);
            if (cd.has(id)) throw new Error(`${id} canonical detail already exists`);
            if (pm.get(id)?.effective_public_rank !== 'C') throw new Error(`${id} public prestate is not C`);
            if (pd.has(id)) throw new Error(`${id} public detail already exists`);
          }
          console.log(JSON.stringify({review:'pending',source_run:review.source_run_id,candidates:expected,current_c_prestates:3,source_errors:0,publication_effect:'none'},null,2));
          NODE
