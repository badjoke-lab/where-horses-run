name: Calendar TJK source revalidation staging

on:
  push:
    branches:
      - calendar/tjk-source-revalidation
    paths:
      - '.github/workflows/calendar-tjk-source-revalidation-stage.yml'

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Patch only TJK source/readiness records
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          inventory_path = Path('data/static/authority-source-inventory.json')
          inventory = json.loads(inventory_path.read_text())
          matches = [r for r in inventory['records'] if r.get('country_id') == 'turkey' and r.get('authority_id') == 'turkiye-jokey-kulubu' and r.get('official_source_id') == 'tjk-daily-programme']
          if len(matches) != 1:
              raise SystemExit(f'expected one TJK inventory record, found {len(matches)}')
          record = matches[0]
          record['official_source_url'] = 'https://www.tjk.org/TR/YarisSever/Info/Page/GunlukYarisProgrami'
          record['source_status'] = 'verified'
          record['last_checked_date'] = '2026-08-11'
          record['capability_rank'] = 'A+'
          record['adapter_candidate_status'] = 'candidate'
          record['notes'] = 'Revalidated on 2026-08-11: the annual programme and filtered-data routes remain active, while current official annual-programme links now resolve daily programmes through /TR/YarisSever/Info/Page/GunlukYarisProgrami. The superseded Info/Sehir route must not be used by a new adapter. Technical capability remains A+; public output remains capped at A.'
          inventory_path.write_text(json.dumps(inventory, ensure_ascii=False, indent=2) + '\n')

          readiness_path = Path('data/static/calendar-readiness-registry.json')
          readiness = json.loads(readiness_path.read_text())
          matches = [r for r in readiness['records'] if r.get('readiness_id') == 'turkey--tjk-national-racing-system--tjk-daily-programme']
          if len(matches) != 1:
              raise SystemExit(f'expected one TJK readiness record, found {len(matches)}')
          record = matches[0]
          record['technical_rank'] = 'A+'
          record['public_ceiling'] = 'A'
          record['access_mode'] = 'query_parameter'
          record['automation_mode'] = 'semi_automatic'
          record['readiness'] = 'prototype_ready'
          record['implementation_status'] = 'not_started'
          record['fallback'] = 'downgrade_to_C'
          record['source_status'] = 'verified'
          record['checked_date'] = '2026-08-11'
          record['evidence_reviewed_at'] = '2026-08-11'
          record['revalidation_trigger'] = 'Revalidate when TJK changes the annual-programme, filtered-data, or current /TR/YarisSever/Info/Page/GunlukYarisProgrami route or its city/date query parameters.'
          record['blocked_reason'] = None
          record['source_test_ref'] = 'docs/timetable-source-tests/03-turkey/revalidation-2026-08-11.json'
          record['limitations'] = [
              'Race names are not consistently present across all tested meetings.',
              'Public output remains capped at A even though the reviewed technical source capability is A+.',
              'The 2026-08-11 current-day parameterized daily body was not directly captured during revalidation; the official current link target was verified and recent Info/Page daily pages retain complete Race 1-N post-time evidence.',
              'Automatic approval, Canonical promotion, public writing, unattended merge, and deployment remain disabled.'
          ]
          record['notes'] = 'Bounded prototype work may use the revalidated annual and current Info/Page daily TJK routes while preserving SehirId, QueryParameter_Tarih, and SehirAdi. The former Info/Sehir route is superseded.'
          readiness_path.write_text(json.dumps(readiness, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Stage exact JSON output as unreachable Git tree
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import base64, json, os, subprocess, tempfile
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          head = os.environ['HEAD_SHA']
          files = ['data/static/authority-source-inventory.json', 'data/static/calendar-readiness-registry.json']

          def gh(args, payload=None):
              cmd = ['gh', 'api', *args]
              if payload is None:
                  return json.loads(subprocess.check_output(cmd, text=True))
              with tempfile.NamedTemporaryFile('w', delete=False, encoding='utf-8') as h:
                  json.dump(payload, h)
                  p = h.name
              try:
                  return json.loads(subprocess.check_output(cmd + ['--input', p], text=True))
              finally:
                  os.unlink(p)

          commit = gh([f'repos/{repo}/git/commits/{head}'])
          tree = []
          for file_path in files:
              raw = Path(file_path).read_bytes()
              blob = gh(['--method', 'POST', f'repos/{repo}/git/blobs'], {'content': base64.b64encode(raw).decode(), 'encoding': 'base64'})
              tree.append({'path': file_path, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          staged = gh(['--method', 'POST', f'repos/{repo}/git/trees'], {'base_tree': commit['tree']['sha'], 'tree': tree})
          Path('tjk-source-revalidation-stage.json').write_text(json.dumps({'head_sha': head, 'staged_tree_sha': staged['sha'], 'files': files}, indent=2) + '\n')
          print(staged['sha'])
          PY
      - name: Upload staged-tree manifest
        uses: actions/upload-artifact@v4
        with:
          name: tjk-source-revalidation-stage
          path: tjk-source-revalidation-stage.json
          retention-days: 7
      - name: Cleanup and prove checkout clean
        run: |
          rm -f tjk-source-revalidation-stage.json
          git checkout -- data/static/authority-source-inventory.json data/static/calendar-readiness-registry.json
          test -z "$(git status --porcelain --untracked-files=all)"
