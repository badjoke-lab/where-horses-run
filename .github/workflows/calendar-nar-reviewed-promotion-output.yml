name: Calendar NAR reviewed promotion output

on:
  pull_request:
    paths:
      - 'data/generated/timetable/**'
      - 'scripts/timetable/build-reviewed-nar-*.mjs'
      - '.github/workflows/calendar-nar-reviewed-promotion-output.yml'
  push:
    branches: [main]
    paths:
      - 'data/generated/timetable/**'
      - 'scripts/timetable/build-reviewed-nar-*.mjs'
      - '.github/workflows/calendar-nar-reviewed-promotion-output.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Validate reviewed promotion builders
        run: |
          node scripts/timetable/build-reviewed-nar-monthly-promotion-candidate.mjs --check
          node scripts/timetable/build-reviewed-nar-incremental-promotion-candidate.mjs --check
          node scripts/timetable/build-reviewed-nar-incremental-v2-promotion-candidates.mjs --check
      - name: Validate deterministic public and operations artifacts
        run: |
          node scripts/timetable/build-public-timetable-view.mjs --check
          node scripts/timetable/build-japan-a-plus-public-overrides.mjs --check
          node scripts/check-japan-a-plus-public-overrides.mjs
          node scripts/check-calendar-operations-status.mjs
          node scripts/check-calendar-operations-review-package.mjs
          node scripts/check-jra-pilot-foundation.mjs
      - name: Validate runtime boundary
        run: node scripts/check-calendar-runtime-import-boundary.mjs
      - name: Install dependencies and build site
        run: |
          npm install --package-lock=false --no-audit --no-fund
          npm run build
