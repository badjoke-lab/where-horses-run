name: Calendar NAR reviewed promotion output

on:
  pull_request:
    paths:
      - 'data/generated/timetable/canonical/meetings.json'
      - 'data/generated/timetable/canonical/meeting-details.json'
      - 'data/generated/timetable/public/meeting-list.json'
      - 'data/generated/timetable/public/meeting-details.json'
      - 'data/generated/timetable/public/japan-a-plus-overrides.json'
      - 'data/generated/timetable/jra-pilot-review.json'
      - 'data/generated/timetable/operations-status.json'
      - 'data/generated/timetable/operations-review-package.json'
      - 'scripts/check-calendar-nar-incremental-reviewed-promotion.mjs'
      - 'scripts/check-calendar-nar-incremental-v2-reviewed-promotion.mjs'
      - '.github/workflows/calendar-nar-reviewed-promotion-output.yml'
  push:
    branches:
      - main
    paths:
      - 'data/generated/timetable/canonical/meetings.json'
      - 'data/generated/timetable/canonical/meeting-details.json'
      - 'data/generated/timetable/public/meeting-list.json'
      - 'data/generated/timetable/public/meeting-details.json'
      - 'data/generated/timetable/public/japan-a-plus-overrides.json'
      - 'data/generated/timetable/jra-pilot-review.json'
      - 'data/generated/timetable/operations-status.json'
      - 'data/generated/timetable/operations-review-package.json'
      - 'scripts/check-calendar-nar-incremental-reviewed-promotion.mjs'
      - 'scripts/check-calendar-nar-incremental-v2-reviewed-promotion.mjs'
      - '.github/workflows/calendar-nar-reviewed-promotion-output.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Validate historical and current approved candidate determinism
        run: |
          node scripts/timetable/build-reviewed-nar-monthly-promotion-candidate.mjs --check
          node scripts/timetable/build-reviewed-nar-incremental-promotion-candidate.mjs --check
          node scripts/timetable/build-reviewed-nar-incremental-v2-promotion-candidates.mjs --check
      - name: Validate cumulative canonical promotion determinism
        run: |
          node scripts/timetable/promote-approved-candidate-v1.mjs \
            --input data/candidates/nar-incremental-2026-07-05-through-2026-07-07-approved.json \
            --check
          node scripts/timetable/promote-approved-candidate-v1.mjs \
            --input data/candidates/nar-incremental-v2-july-remainder-c-approved.json \
            --check
          node scripts/timetable/promote-approved-candidate-v1.mjs \
            --input data/candidates/nar-incremental-v2-july-remainder-a-plus-approved.json \
            --check
      - name: Validate public projection determinism
        run: node scripts/timetable/build-public-timetable-view.mjs --check
      - name: Validate Japan A+ runtime override synchronization
        run: |
          node scripts/timetable/build-japan-a-plus-public-overrides.mjs --check
          node scripts/check-japan-a-plus-public-overrides.mjs
      - name: Validate JRA pilot review synchronization
        run: node scripts/check-jra-pilot-foundation.mjs
      - name: Validate operations artifacts synchronization
        run: |
          node scripts/check-calendar-operations-status.mjs
          node scripts/check-calendar-operations-review-package.mjs
      - name: Validate historical and incremental NAR promoted sets
        run: |
          node scripts/check-calendar-nar-reviewed-promotion.mjs --require-promoted
          node scripts/check-calendar-nar-incremental-reviewed-promotion.mjs --require-promoted
          node scripts/check-calendar-nar-incremental-v2-reviewed-promotion.mjs --require-promoted
      - name: Validate no canonical or public IDs were removed
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');
          const baseSha = process.env.BASE_SHA;
          const datasets = [
            ['data/generated/timetable/canonical/meetings.json', 'meetings', 'meeting_id'],
            ['data/generated/timetable/canonical/meeting-details.json', 'details', 'meeting_id'],
            ['data/generated/timetable/public/meeting-list.json', 'meetings', 'meeting_id'],
            ['data/generated/timetable/public/meeting-details.json', 'details', 'meeting_id'],
          ];
          for (const [file, key, idKey] of datasets) {
            const baseText = execFileSync('git', ['show', `${baseSha}:${file}`], { encoding: 'utf8' });
            const base = JSON.parse(baseText)[key];
            const head = JSON.parse(fs.readFileSync(file, 'utf8'))[key];
            const headIds = new Set(head.map((record) => record[idKey]));
            const missing = base.map((record) => record[idKey]).filter((id) => !headIds.has(id));
            if (missing.length) throw new Error(`${file} removed IDs: ${missing.join(', ')}`);
            console.log(`${file}: base=${base.length} head=${head.length} removed=0`);
          }
          NODE
      - name: Validate runtime boundary
        run: node scripts/check-calendar-runtime-import-boundary.mjs
      - name: Validate changed-file boundary
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}")
            while IFS= read -r file; do
              [[ -z "$file" ]] && continue
              case "$file" in
                .github/workflows/calendar-nar-reviewed-promotion-output.yml|scripts/check-calendar-nar-incremental-reviewed-promotion.mjs|scripts/check-calendar-nar-incremental-v2-reviewed-promotion.mjs|data/generated/timetable/canonical/meetings.json|data/generated/timetable/canonical/meeting-details.json|data/generated/timetable/public/meeting-list.json|data/generated/timetable/public/meeting-details.json|data/generated/timetable/public/japan-a-plus-overrides.json|data/generated/timetable/jra-pilot-review.json|data/generated/timetable/operations-status.json|data/generated/timetable/operations-review-package.json) ;;
                *) echo "Unexpected NAR reviewed promotion PR path: $file"; exit 1 ;;
              esac
            done <<< "$changed"
          fi
      - name: Install dependencies
        run: npm install --package-lock=false --no-audit --no-fund
      - name: Build site
        run: npm run build
