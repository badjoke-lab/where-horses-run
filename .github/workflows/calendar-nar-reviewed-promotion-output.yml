name: Calendar NAR reviewed promotion output

on:
  pull_request:
    paths:
      - 'data/generated/timetable/**'
      - 'data/candidates/nar-current-window-a-plus-approved.json'
      - 'data/audits/calendar-nar-current-window-promotion-*.json'
      - 'data/static/calendar-nar-current-window-retry-policy-v1.json'
      - 'scripts/check-calendar-*.mjs'
      - 'scripts/check-japan-*.mjs'
      - 'scripts/check-jra-*.mjs'
      - '.github/workflows/calendar-nar-reviewed-promotion-output.yml'
  push:
    branches: [main]
    paths:
      - 'data/generated/timetable/**'
      - 'data/candidates/nar-current-window-a-plus-approved.json'
      - 'data/audits/calendar-nar-current-window-promotion-*.json'
      - 'scripts/check-calendar-nar-*.mjs'
      - '.github/workflows/calendar-nar-reviewed-promotion-output.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Validate approved Candidate determinism
        run: |
          node scripts/timetable/build-reviewed-nar-monthly-promotion-candidate.mjs --check
          node scripts/timetable/build-reviewed-nar-incremental-promotion-candidate.mjs --check
          node scripts/timetable/build-reviewed-nar-incremental-v2-promotion-candidates.mjs --check
      - name: Validate current-window approved Candidate
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const candidate = JSON.parse(fs.readFileSync('data/candidates/nar-current-window-a-plus-approved.json', 'utf8'));
          const result = JSON.parse(fs.readFileSync('data/audits/calendar-nar-current-window-retry-result-v1.json', 'utf8'));
          if (candidate.schema_version !== 'timetable-candidate-v1' || candidate.review?.status !== 'approved' || candidate.review?.promotion_target !== 'canonical-timetable-v0') throw new Error('approved Candidate envelope differs');
          if (candidate.records.length !== 15 || candidate.records.some((record) => record.capability_rank !== 'A+' || record.review_status !== 'approved')) throw new Error('approved Candidate set differs');
          if (candidate.records.reduce((sum, record) => sum + record.timetable_rows.length, 0) !== 180) throw new Error('approved race-row count differs');
          if (JSON.stringify(candidate.records.map((record) => record.meeting_id).sort()) !== JSON.stringify([...result.resolved_meeting_ids].sort())) throw new Error('approved meeting IDs differ');
          if (result.unresolved_meeting_ids.length !== 51) throw new Error('retained C set differs');
          NODE
      - name: Validate current Canonical and Public NAR state
        run: |
          node scripts/check-calendar-nar-current-window-promotion-review.mjs
          node scripts/check-calendar-nar-reviewed-promotion.mjs --require-promoted
          node scripts/check-calendar-nar-incremental-reviewed-promotion.mjs --require-promoted
          node scripts/check-calendar-nar-incremental-v2-reviewed-promotion.mjs --require-promoted
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const candidate = JSON.parse(fs.readFileSync('data/candidates/nar-current-window-a-plus-approved.json', 'utf8'));
          const result = JSON.parse(fs.readFileSync('data/audits/calendar-nar-current-window-retry-result-v1.json', 'utf8'));
          const meetings = new Map(JSON.parse(fs.readFileSync('data/generated/timetable/canonical/meetings.json', 'utf8')).meetings.map((record) => [record.meeting_id, record]));
          const details = new Map(JSON.parse(fs.readFileSync('data/generated/timetable/canonical/meeting-details.json', 'utf8')).details.map((record) => [record.meeting_id, record]));
          const publicMeetings = new Map(JSON.parse(fs.readFileSync('data/generated/timetable/public/meeting-list.json', 'utf8')).meetings.map((record) => [record.meeting_id, record]));
          const publicDetails = new Map(JSON.parse(fs.readFileSync('data/generated/timetable/public/meeting-details.json', 'utf8')).details.map((record) => [record.meeting_id, record]));
          for (const record of candidate.records) {
            if (meetings.get(record.meeting_id)?.capability_rank !== 'A+' || details.get(record.meeting_id)?.capability_rank !== 'A+') throw new Error(`${record.meeting_id} Canonical A+ differs`);
            if (publicMeetings.get(record.meeting_id)?.effective_public_rank !== 'A+' || publicDetails.get(record.meeting_id)?.effective_public_rank !== 'A+') throw new Error(`${record.meeting_id} public A+ differs`);
          }
          for (const id of result.unresolved_meeting_ids) {
            if (meetings.get(id)?.capability_rank !== 'C' || publicMeetings.get(id)?.effective_public_rank !== 'C') throw new Error(`${id} retained C differs`);
            if (details.has(id) || publicDetails.has(id)) throw new Error(`${id} unexpectedly has detail`);
          }
          NODE
      - name: Validate deterministic public and operations artifacts
        run: |
          node scripts/timetable/build-public-timetable-view.mjs --check
          node scripts/timetable/build-japan-a-plus-public-overrides.mjs --check
          node scripts/check-japan-a-plus-public-overrides.mjs
          node scripts/check-calendar-operations-status.mjs
          node scripts/check-calendar-operations-review-package.mjs
          node scripts/check-jra-pilot-foundation.mjs
      - name: Validate runtime boundary
        run: node scripts/check-calendar-runtime-import-boundary.mjs
      - name: Install dependencies and build site
        run: |
          npm install --package-lock=false --no-audit --no-fund
          npm run build
