name: Zimbabwe Borrowdale current source probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/calendar-zimbabwe-borrowdale-current-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Probe Zimracing current pages
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (compatible; WhereHorsesRun/1.0; +https://github.com/badjoke-lab/where-horses-run)'
          mkdir -p /tmp/zim
          for item in             'home|https://zimracing.com/'             'robots|https://zimracing.com/robots.txt'             'sitemap|https://zimracing.com/sitemap.xml'; do
            name="${item%%|*}"
            url="${item#*|}"
            out="/tmp/zim/$name.out"
            code="$(curl -L -sS -A "$UA" --connect-timeout 15 --max-time 45 -o "$out" -w '%{http_code}' "$url" || true)"
            final="$(curl -L -sS -A "$UA" --connect-timeout 15 --max-time 45 -o /dev/null -w '%{url_effective}' "$url" || true)"
            echo "PAGE name=$name HTTP=$code BYTES=$(wc -c < "$out" 2>/dev/null || echo 0) URL=$url FINAL=$final"
          done

      - name: Inspect current official page for meeting and PDF links
        shell: bash
        run: |
          set -euo pipefail
          python3 - /tmp/zim/home.out <<'PY'
          import html,re,sys
          from pathlib import Path
          raw=Path(sys.argv[1]).read_text(errors='replace')
          text=re.sub(r'<script\b[^>]*>.*?</script>',' ',raw,flags=re.I|re.S)
          text=re.sub(r'<style\b[^>]*>.*?</style>',' ',text,flags=re.I|re.S)
          text=html.unescape(re.sub(r'<[^>]+>',' ',text))
          text=re.sub(r'\s+',' ',text).strip()
          for needle in ['Borrowdale','race card','racecard','fixtures','meeting','October','November','December','2026']:
              pos=text.lower().find(needle.lower())
              if pos>=0:
                  print('TEXT_MATCH',needle,text[max(0,pos-220):pos+1200])
          seen=set()
          for m in re.finditer(r'href=["\']([^"\']+)["\']',raw,re.I):
              u=html.unescape(m.group(1))
              low=u.lower()
              if any(k in low for k in ['pdf','race','card','fixture','borrowdale','programme','program']):
                  if u not in seen:
                      seen.add(u)
                      print('LINK',u)
          PY

      - name: Probe discovered PDF and race-card links
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (compatible; WhereHorsesRun/1.0; +https://github.com/badjoke-lab/where-horses-run)'
          python3 - /tmp/zim/home.out <<'PY' > /tmp/zim/links.txt
          import html,re,sys
          from urllib.parse import urljoin
          raw=open(sys.argv[1],errors='replace').read()
          seen=[]
          for m in re.finditer(r'href=["\']([^"\']+)["\']',raw,re.I):
              u=urljoin('https://zimracing.com/',html.unescape(m.group(1)))
              low=u.lower()
              if any(k in low for k in ['.pdf','race','card','fixture','programme','program']) and u.startswith('http'):
                  if u not in seen: seen.append(u)
          print('\n'.join(seen[:40]))
          PY
          n=0
          while IFS= read -r url; do
            [ -n "$url" ] || continue
            n=$((n+1))
            out="/tmp/zim/link-$n.out"
            code="$(curl -L -sS -A "$UA" --connect-timeout 10 --max-time 40 -o "$out" -w '%{http_code}' "$url" || true)"
            ctype="$(curl -L -sSI -A "$UA" --connect-timeout 10 --max-time 40 "$url" 2>/dev/null | tr -d '\r' | awk -F': ' 'tolower($1)=="content-type"{print $2}' | tail -n1 || true)"
            echo "DISCOVERED index=$n HTTP=$code BYTES=$(wc -c < "$out" 2>/dev/null || echo 0) CTYPE=$ctype URL=$url"
            if file "$out" | grep -qi pdf; then
              pdftotext -f 1 -l 3 "$out" - 2>/dev/null | head -n 120 | tr '\n' ' ' | sed 's/[[:space:]][[:space:]]*/ /g' | sed 's/^/PDF_TEXT /'
            else
              python3 - "$out" <<'PY'
          import html,re,sys
          raw=open(sys.argv[1],errors='replace').read()
          text=html.unescape(re.sub(r'<[^>]+>',' ',raw))
          text=re.sub(r'\s+',' ',text).strip()
          print('PAGE_TEXT',text[:1800])
          PY
            fi
          done < /tmp/zim/links.txt
