name: Calendar UAE ERA PILOT-03 PDF evidence

on:
  pull_request:
    paths:
      - 'data/audits/calendar-uae-era-pilot-03-venue-mapping-v1.json'
      - 'scripts/timetable/probe_uae_era_pdf_text.py'
      - 'scripts/timetable/probe-uae-era-venue-pages.mjs'
      - 'scripts/check-calendar-uae-era-pilot-03-venue-mapping.mjs'
      - 'docs/calendar/uae-era-pilot-03-venue-mapping-pdf-evidence.md'
      - '.github/workflows/calendar-uae-era-pilot-03-pdf-evidence.yml'

permissions:
  contents: read

jobs:
  validate-and-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF text extraction dependency
        run: python -m pip install --disable-pip-version-check pypdf
      - name: Validate PILOT-03 mapping and probe boundaries
        run: |
          node --check scripts/check-calendar-uae-era-pilot-03-venue-mapping.mjs
          node --check scripts/timetable/probe-uae-era-venue-pages.mjs
          node scripts/check-calendar-uae-era-pilot-03-venue-mapping.mjs
          python - <<'PY'
          import ast
          from pathlib import Path
          ast.parse(Path('scripts/timetable/probe_uae_era_pdf_text.py').read_text())
          print('PYTHON_SYNTAX: pass')
          PY
      - name: Record protected state hashes
        run: |
          sha256sum \
            data/static/racecourses.json \
            data/static/calendar-readiness-registry.json \
            data/static/calendar-acquisition-registry.json \
            data/generated/timetable/canonical/meetings.json \
            data/generated/timetable/canonical/meeting-details.json \
            data/generated/timetable/public/meeting-list.json \
            data/generated/timetable/public/meeting-details.json \
            > /tmp/uae-pilot-03-protected-before.sha256
      - name: Probe official ERA venue pages
        run: node scripts/timetable/probe-uae-era-venue-pages.mjs > /tmp/uae-pilot-03-venue-page-summary.json
      - name: Validate public-safe venue-page summary
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const summary = JSON.parse(fs.readFileSync('/tmp/uae-pilot-03-venue-page-summary.json', 'utf8'));
          if (summary.schema_version !== 'calendar-uae-era-pilot-03-venue-page-evidence-summary-v1') throw new Error('venue summary schema differs');
          if (summary.work_id !== 'WHR-CAL-UAE-ERA' || summary.implementation_unit !== 'UAE-PILOT-03') throw new Error('venue summary Work identity differs');
          if (summary.page_count !== 5 || summary.pages.length !== 5) throw new Error('expected five venue pages');
          if (summary.all_pages_reachable !== true || summary.all_final_hosts_official !== true || summary.all_page_labels_observed !== true) throw new Error('official venue-page evidence incomplete');
          for (const page of summary.pages) {
            if (page.http_status !== 200 || page.response_ok !== true) throw new Error(`${page.slug}: official page not reachable`);
            if (page.final_host !== 'emiratesracing.com') throw new Error(`${page.slug}: final host differs`);
            if (page.page_label_observed !== true || page.raw_html_stored !== false) throw new Error(`${page.slug}: label/storage boundary differs`);
            if (!Number.isInteger(page.response_bytes) || page.response_bytes < 1000) throw new Error(`${page.slug}: response byte count implausible`);
          }
          if (summary.raw_html_stored !== false) throw new Error('venue summary raw HTML boundary differs');
          console.log('UAE_PILOT_03_VENUE_PAGE_EVIDENCE: pass');
          console.log(JSON.stringify(summary.pages.map((page) => ({ slug: page.slug, status: page.http_status, bytes: page.response_bytes }))));
          NODE
      - name: Run in-memory official PDF text extraction probe
        run: python scripts/timetable/probe_uae_era_pdf_text.py > /tmp/uae-pilot-03-pdf-structure-summary.json
      - name: Validate public-safe PDF structure summary
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const summary = JSON.parse(fs.readFileSync('/tmp/uae-pilot-03-pdf-structure-summary.json', 'utf8'));
          if (summary.schema_version !== 'calendar-uae-era-pilot-03-pdf-text-structure-summary-v1') throw new Error('summary schema differs');
          if (summary.work_id !== 'WHR-CAL-UAE-ERA' || summary.implementation_unit !== 'UAE-PILOT-03') throw new Error('summary Work identity differs');
          if (summary.http_status !== 200) throw new Error('official PDF route did not return 200');
          if (summary.final_host !== 'd2xuc5ucjmnf40.cloudfront.net') throw new Error('official PDF final host differs');
          if (summary.pdf_magic !== true) throw new Error('PDF magic missing');
          if (!Number.isInteger(summary.response_bytes) || summary.response_bytes < 10000) throw new Error('PDF response byte count implausible');
          if (!Number.isInteger(summary.page_count) || summary.page_count < 1) throw new Error('page count missing');
          if (!Number.isInteger(summary.extracted_text_chars) || summary.extracted_text_chars < 1) throw new Error('PDF text extraction produced no text');
          if (typeof summary.layout_extraction_available !== 'boolean') throw new Error('layout extraction state missing');
          if (!Number.isInteger(summary.layout_extracted_text_chars) || summary.layout_extracted_text_chars < 0) throw new Error('layout text character count invalid');
          if (!Number.isInteger(summary.non_empty_line_count) || summary.non_empty_line_count < 1) throw new Error('non-empty line count missing');
          if (!Number.isInteger(summary.layout_non_empty_line_count) || summary.layout_non_empty_line_count < 0) throw new Error('layout non-empty line count invalid');
          if (!/^[0-9a-f]{64}$/.test(summary.normalized_text_sha256)) throw new Error('normalized text hash invalid');
          if (summary.layout_text_sha256 !== null && !/^[0-9a-f]{64}$/.test(summary.layout_text_sha256)) throw new Error('layout text hash invalid');
          if (!Array.isArray(summary.page_text_char_counts) || summary.page_text_char_counts.length !== summary.page_count) throw new Error('page text count shape differs');
          if (!Array.isArray(summary.layout_page_text_char_counts) || summary.layout_page_text_char_counts.length !== summary.page_count) throw new Error('layout page text count shape differs');
          if (!summary.venue_label_occurrences || Object.keys(summary.venue_label_occurrences).length !== 5) throw new Error('full venue occurrence summary shape differs');
          if (!summary.venue_alias_occurrences || Object.keys(summary.venue_alias_occurrences).length !== 5) throw new Error('venue alias occurrence summary shape differs');
          if (!summary.venue_alias_line_counts || Object.keys(summary.venue_alias_line_counts).length !== 5) throw new Error('venue alias line-count summary shape differs');
          if (!Array.isArray(summary.month_year_headers)) throw new Error('month-year header summary shape differs');
          if (!Array.isArray(summary.date_candidates) || summary.date_candidate_count !== summary.date_candidates.length) throw new Error('date candidate summary shape differs');
          if (!summary.date_notation_profile || typeof summary.date_notation_profile !== 'object') throw new Error('date notation profile missing');
          if (summary.raw_pdf_stored !== false || summary.raw_text_stored !== false || summary.extracted_text_emitted !== false) throw new Error('raw-source boundary differs');
          for (const forbiddenKey of ['raw_pdf','raw_text','extracted_text','source_body','raw_html']) {
            if (Object.hasOwn(summary, forbiddenKey)) throw new Error(`forbidden summary key ${forbiddenKey}`);
          }
          console.log('UAE_PILOT_03_PDF_TEXT_EVIDENCE: pass');
          console.log(JSON.stringify({
            response_bytes: summary.response_bytes,
            page_count: summary.page_count,
            extracted_text_chars: summary.extracted_text_chars,
            layout_extraction_available: summary.layout_extraction_available,
            layout_extracted_text_chars: summary.layout_extracted_text_chars,
            non_empty_line_count: summary.non_empty_line_count,
            layout_non_empty_line_count: summary.layout_non_empty_line_count,
            venue_label_occurrences: summary.venue_label_occurrences,
            venue_alias_occurrences: summary.venue_alias_occurrences,
            venue_alias_line_counts: summary.venue_alias_line_counts,
            all_five_full_venue_labels_observed: summary.all_five_full_venue_labels_observed,
            all_five_venue_aliases_observed: summary.all_five_venue_aliases_observed,
            month_year_headers: summary.month_year_headers,
            date_candidate_count: summary.date_candidate_count,
            season_boundary_dates_observed: summary.season_boundary_dates_observed,
            date_notation_profile: summary.date_notation_profile,
          }));
          NODE
      - name: Prove protected state unchanged
        if: always()
        run: sha256sum --check /tmp/uae-pilot-03-protected-before.sha256
      - name: Upload public-safe structure summaries only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uae-pilot-03-structure-evidence-${{ github.run_id }}
          path: |
            /tmp/uae-pilot-03-venue-page-summary.json
            /tmp/uae-pilot-03-pdf-structure-summary.json
          if-no-files-found: warn
          retention-days: 30
      - name: Prove repository clean
        if: always()
        run: |
          changes="$(git status --porcelain --untracked-files=all)"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            exit 1
          fi
