name: Qatar QREC current season probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/calendar-qatar-qrec-current-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Probe QREC current pages
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (compatible; WhereHorsesRun/1.0; +https://github.com/badjoke-lab/where-horses-run)'
          mkdir -p /tmp/qrec
          for item in             'current|https://qrec.gov.qa/race-calendar'             'next-long|https://qrec.gov.qa/race-calendar-2026-2027'             'next-short|https://qrec.gov.qa/race-calendar-2026-27'             'previous|https://qrec.gov.qa/race-calendar-2025-2026'; do
            name="${item%%|*}"
            url="${item#*|}"
            out="/tmp/qrec/$name.html"
            code="$(curl -L -sS -A "$UA" --connect-timeout 15 --max-time 45 -o "$out" -w '%{http_code}' "$url" || true)"
            echo "PAGE name=$name HTTP=$code BYTES=$(wc -c < "$out" 2>/dev/null || echo 0) URL=$url"
            grep -Eo 'Race Season is closed|Racing Season Program 2025-26|2026-27|2026-2027|AL RAYYAN|AL UQDA' "$out" | sort -u || true
            grep -Eo '/_next/static/chunks/pages/race-calendar[^" ]+\.js' "$out" | sort -u || true
          done

      - name: Probe QREC calendar page chunks
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (compatible; WhereHorsesRun/1.0; +https://github.com/badjoke-lab/where-horses-run)'
          for page in current previous; do
            chunk="$(grep -Eo '/_next/static/chunks/pages/race-calendar[^" ]+\.js' "/tmp/qrec/$page.html" | head -n 1 || true)"
            [ -n "$chunk" ] || { echo "NO_CHUNK page=$page"; continue; }
            url="https://qrec.gov.qa$chunk"
            out="/tmp/qrec/$page.js"
            code="$(curl -L -sS -A "$UA" --connect-timeout 15 --max-time 45 -o "$out" -w '%{http_code}' "$url" || true)"
            echo "CHUNK page=$page HTTP=$code BYTES=$(wc -c < "$out" 2>/dev/null || echo 0) URL=$url"
            python3 - "$out" <<'PY'
          import re,sys
          from pathlib import Path
          raw=Path(sys.argv[1]).read_text(errors='replace')
          seen=set()
          for m in re.finditer(r'["\x27]([^"\x27]{4,500})["\x27]',raw):
              s=m.group(1)
              low=s.lower()
              if any(k in low for k in ('api','calendar','race','meeting','meetid','season')):
                  if s not in seen:
                      seen.add(s)
                      print('HINT',s[:800])
              if len(seen)>=120:
                  break
          PY
          done

      - name: Locate QREC race API constants
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (compatible; WhereHorsesRun/1.0; +https://github.com/badjoke-lab/where-horses-run)'
          grep -Eo '/_next/static/chunks/[^" ]+\.js' /tmp/qrec/current.html | sort -u > /tmp/qrec/chunks.txt || true
          n=0
          while IFS= read -r chunk; do
            [ -n "$chunk" ] || continue
            n=$((n+1))
            out="/tmp/qrec/chunk-$n.js"
            curl -L -sS -A "$UA" --connect-timeout 10 --max-time 30 "https://qrec.gov.qa$chunk" -o "$out" || true
            python3 - "$out" "$chunk" <<'PY'
          import re,sys
          from pathlib import Path
          raw=Path(sys.argv[1]).read_text(errors='replace')
          name=sys.argv[2]
          needles=['GET_RACE_MEETING_INFO','GET_RACE','RACE_MEETING','baseURL','baseUrl','api.qrec','qrec.gov.qa/api']
          matched=False
          for needle in needles:
              pos=raw.find(needle)
              if pos>=0:
                  if not matched:
                      print('MATCH_CHUNK',name)
                      matched=True
                  print('CONTEXT',needle,raw[max(0,pos-1200):pos+2200])
          PY
          done < /tmp/qrec/chunks.txt

      - name: Probe common QREC data surfaces
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (compatible; WhereHorsesRun/1.0; +https://github.com/badjoke-lab/where-horses-run)'
          for url in             'https://qrec.gov.qa/wp-json/'             'https://qrec.gov.qa/wp-json/wp/v2/pages?search=race%20calendar&per_page=20'             'https://qrec.gov.qa/api/'             'https://qrec.gov.qa/api/race-calendar'; do
            out='/tmp/qrec/common.out'
            code="$(curl -L -sS -A "$UA" --connect-timeout 10 --max-time 30 -o "$out" -w '%{http_code}' "$url" || true)"
            echo "COMMON HTTP=$code BYTES=$(wc -c < "$out" 2>/dev/null || echo 0) URL=$url"
            head -c 1200 "$out" | tr '\n' ' '; echo
          done
