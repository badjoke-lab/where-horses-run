name: Qatar QREC current season probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/calendar-qatar-qrec-current-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Probe QREC current pages
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (compatible; WhereHorsesRun/1.0; +https://github.com/badjoke-lab/where-horses-run)'
          mkdir -p /tmp/qrec
          for item in             'current|https://qrec.gov.qa/race-calendar'             'next-long|https://qrec.gov.qa/race-calendar-2026-2027'             'next-short|https://qrec.gov.qa/race-calendar-2026-27'             'previous|https://qrec.gov.qa/race-calendar-2025-2026'; do
            name="${item%%|*}"
            url="${item#*|}"
            out="/tmp/qrec/$name.html"
            code="$(curl -L -sS -A "$UA" --connect-timeout 15 --max-time 45 -o "$out" -w '%{http_code}' "$url" || true)"
            echo "PAGE name=$name HTTP=$code BYTES=$(wc -c < "$out" 2>/dev/null || echo 0) URL=$url"
            grep -Eo 'Race Season is closed|Racing Season Program 2025-26|2026-27|2026-2027|AL RAYYAN|AL UQDA' "$out" | sort -u || true
            grep -Eo '/_next/static/chunks/pages/race-calendar[^" ]+\.js' "$out" | sort -u || true
          done

      - name: Probe QREC calendar page chunks
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (compatible; WhereHorsesRun/1.0; +https://github.com/badjoke-lab/where-horses-run)'
          for page in current previous; do
            chunk="$(grep -Eo '/_next/static/chunks/pages/race-calendar[^" ]+\.js' "/tmp/qrec/$page.html" | head -n 1 || true)"
            [ -n "$chunk" ] || { echo "NO_CHUNK page=$page"; continue; }
            url="https://qrec.gov.qa$chunk"
            out="/tmp/qrec/$page.js"
            code="$(curl -L -sS -A "$UA" --connect-timeout 15 --max-time 45 -o "$out" -w '%{http_code}' "$url" || true)"
            echo "CHUNK page=$page HTTP=$code BYTES=$(wc -c < "$out" 2>/dev/null || echo 0) URL=$url"
            python3 - "$out" <<'PY'
          import re,sys
          from pathlib import Path
          raw=Path(sys.argv[1]).read_text(errors='replace')
          seen=set()
          for m in re.finditer(r'["\x27]([^"\x27]{4,500})["\x27]',raw):
              s=m.group(1)
              low=s.lower()
              if any(k in low for k in ('api','calendar','race','meeting','meetid','season')):
                  if s not in seen:
                      seen.add(s)
                      print('HINT',s[:800])
              if len(seen)>=120:
                  break
          PY
          done

      - name: Locate QREC race API constants
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (compatible; WhereHorsesRun/1.0; +https://github.com/badjoke-lab/where-horses-run)'
          grep -Eo '/_next/static/chunks/[^" ]+\.js' /tmp/qrec/current.html | sort -u > /tmp/qrec/chunks.txt || true
          n=0
          while IFS= read -r chunk; do
            [ -n "$chunk" ] || continue
            n=$((n+1))
            out="/tmp/qrec/chunk-$n.js"
            curl -L -sS -A "$UA" --connect-timeout 10 --max-time 30 "https://qrec.gov.qa$chunk" -o "$out" || true
            python3 - "$out" "$chunk" <<'PY'
          import re,sys
          from pathlib import Path
          raw=Path(sys.argv[1]).read_text(errors='replace')
          name=sys.argv[2]
          needles=['GET_RACE_MEETING_INFO','GET_RACE','RACE_MEETING','baseURL','baseUrl','api.qrec','qrec.gov.qa/api']
          matched=False
          for needle in needles:
              pos=raw.find(needle)
              if pos>=0:
                  if not matched:
                      print('MATCH_CHUNK',name)
                      matched=True
                  print('CONTEXT',needle,raw[max(0,pos-1200):pos+2200])
          PY
          done < /tmp/qrec/chunks.txt

      - name: Inspect QREC meeting loader and unauthenticated API
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (compatible; WhereHorsesRun/1.0; +https://github.com/badjoke-lab/where-horses-run)'
          python3 - /tmp/qrec/current.js <<'PY'
          import sys
          from pathlib import Path
          raw=Path(sys.argv[1]).read_text(errors='replace')
          for needle in ['81561:function','GET_EVENTS','jsonmeetings','NEXT_PUBLIC_API_KEY','NEXT_PUBLIC_BASE_URL']:
              pos=raw.find(needle)
              if pos>=0:
                  print('LOADER_CONTEXT',needle,raw[max(0,pos-1600):pos+3200])
          PY
          base='https://api.qrec.gov.qa/v1/race/data?pageaction=jsonmeetings'
          for suffix in             ''             '&date=2026-10-05&lang=en'             '&racedate=2026-10-05&lang=en'             '&date=2026-10-05&locale=en'             '&date=2026-01-21&lang=en'; do
            out='/tmp/qrec/api.out'
            code="$(curl -L -sS -A "$UA" --connect-timeout 10 --max-time 30 -o "$out" -w '%{http_code}' "$base$suffix" || true)"
            echo "RACE_API HTTP=$code BYTES=$(wc -c < "$out" 2>/dev/null || echo 0) SUFFIX=$suffix"
            head -c 1800 "$out" | tr '\n' ' '; echo
          done
      - name: Inspect QREC axios and token flow with values redacted
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (compatible; WhereHorsesRun/1.0; +https://github.com/badjoke-lab/where-horses-run)'
          app_chunk="$(grep -Eo '/_next/static/chunks/pages/_app-[^" ]+\.js' /tmp/qrec/current.html | head -n 1 || true)"
          [ -n "$app_chunk" ] || exit 1
          curl -L -sS -A "$UA" --connect-timeout 10 --max-time 30 "https://qrec.gov.qa$app_chunk" -o /tmp/qrec/app-redact.js
          python3 - /tmp/qrec/app-redact.js <<'PY'
          import re,sys
          raw=open(sys.argv[1],errors='replace').read()
          def redact(s):
              s=re.sub(r'NEXT_PUBLIC_API_KEY\|\|"[^"]+"','NEXT_PUBLIC_API_KEY||"<redacted>"',s)
              s=re.sub(r'NEXT_PUBLIC_AUTH_GRANT_TOKEN\|\|"[^"]+"','NEXT_PUBLIC_AUTH_GRANT_TOKEN||"<redacted>"',s)
              s=re.sub(r'(?i)(authorization.{0,40})(["\x27])[^"\x27]{20,}\2',r'\1"<redacted>"',s)
              return s
          needles=['3303:function','token/generate','x-api-key','api-key','apikey','Authorization','Bearer ','Basic ','interceptors.request','interceptors.response']
          seen=set()
          for needle in needles:
              pos=raw.find(needle)
              if pos>=0 and needle not in seen:
                  seen.add(needle)
                  print('CLIENT_CONTEXT',needle,redact(raw[max(0,pos-1800):pos+3600]))
          PY

      - name: Exercise QREC frontend API contract without exposing public keys
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (compatible; WhereHorsesRun/1.0; +https://github.com/badjoke-lab/where-horses-run)'
          app_chunk="$(grep -Eo '/_next/static/chunks/pages/_app-[^" ]+\.js' /tmp/qrec/current.html | head -n 1 || true)"
          [ -n "$app_chunk" ] || { echo 'NO_APP_CHUNK'; exit 1; }
          curl -L -sS -A "$UA" --connect-timeout 10 --max-time 30 "https://qrec.gov.qa$app_chunk" -o /tmp/qrec/app.js
          python3 - /tmp/qrec/app.js > /tmp/qrec/public-env.sh <<'PY'
          import re,sys,shlex
          raw=open(sys.argv[1],errors='replace').read()
          patterns={
            'BASE': r'NEXT_PUBLIC_BASE_URL\|\|"([^"]+)"',
            'APIKEY': r'NEXT_PUBLIC_API_KEY\|\|"([^"]+)"',
            'GRANT': r'NEXT_PUBLIC_AUTH_GRANT_TOKEN\|\|"([^"]+)"',
          }
          vals={}
          for k,p in patterns.items():
              m=re.search(p,raw)
              if not m:
                  raise SystemExit(f'missing {k}')
              vals[k]=m.group(1)
          for k,v in vals.items():
              print(f'{k}={shlex.quote(v)}')
          PY
          source /tmp/qrec/public-env.sh
          echo "API_ENV base_present=$([ -n "$BASE" ] && echo yes || echo no) api_key_present=$([ -n "$APIKEY" ] && echo yes || echo no) grant_present=$([ -n "$GRANT" ] && echo yes || echo no)"
          endpoint="${BASE%/}/race/data?pageaction=jsonmeetings"
          try_call () {
            label="$1"; start="$2"; end="$3"; mode="$4"
            out="/tmp/qrec/api-$label-$mode.json"
            args=(-L -sS -A "$UA" --connect-timeout 10 --max-time 30 -o "$out" -w '%{http_code}')
            case "$mode" in
              key) args+=(-H "x-api-key: $APIKEY") ;;
              grant) args+=(-H "Authorization: Basic $GRANT") ;;
              both) args+=(-H "x-api-key: $APIKEY" -H "Authorization: Basic $GRANT") ;;
            esac
            code="$(curl "${args[@]}" "$endpoint&startdate=$start&endate=$end&lang=en" || true)"
            bytes="$(wc -c < "$out" 2>/dev/null || echo 0)"
            summary="$(python3 - "$out" <<'PY'
          import json,sys
          try:
              obj=json.load(open(sys.argv[1]))
          except Exception:
              print('non_json'); raise SystemExit
          def shape(x):
              if isinstance(x,list): return f'list:{len(x)}'
              if isinstance(x,dict):
                  data=x.get('data')
                  if isinstance(data,list): return f'data_list:{len(data)}'
                  if isinstance(data,dict): return 'data_dict'
                  return 'dict_keys:'+','.join(sorted(x.keys())[:12])
              return type(x).__name__
          print(shape(obj))
          PY
            )"
            echo "QREC_API label=$label mode=$mode HTTP=$code BYTES=$bytes SHAPE=$summary"
          }
          for mode in none key grant both; do
            try_call current 2026-10-05 2026-10-06 "$mode"
          done
          for mode in key both; do
            try_call old 2026-01-21 2026-01-22 "$mode"
          done

      - name: Exercise exact QREC public frontend token and meeting flow
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (compatible; WhereHorsesRun/1.0; +https://github.com/badjoke-lab/where-horses-run)'
          app_chunk="$(grep -Eo '/_next/static/chunks/pages/_app-[^" ]+\.js' /tmp/qrec/current.html | head -n 1 || true)"
          [ -n "$app_chunk" ] || exit 1
          curl -L -sS -A "$UA" --connect-timeout 10 --max-time 30 "https://qrec.gov.qa$app_chunk" -o /tmp/qrec/app-exact.js
          python3 - /tmp/qrec/app-exact.js > /tmp/qrec/qrec-public-env.sh <<'PY'
          import re,sys,shlex
          raw=open(sys.argv[1],errors='replace').read()
          pats={
            'BASE':r'NEXT_PUBLIC_BASE_URL\|\|"([^"]+)"',
            'APIKEY':r'NEXT_PUBLIC_API_KEY\|\|"([^"]+)"',
            'GRANT':r'NEXT_PUBLIC_AUTH_GRANT_TOKEN\|\|"([^"]+)"',
          }
          for k,p in pats.items():
              m=re.search(p,raw)
              if not m: raise SystemExit('missing '+k)
              print(f'{k}={shlex.quote(m.group(1))}')
          PY
          source /tmp/qrec/qrec-public-env.sh
          qbase="${BASE%/}/qrec/"
          token_out=/tmp/qrec/token.json
          token_code="$(curl -L -sS -A "$UA" --connect-timeout 10 --max-time 30             -H 'Content-Type: application/x-www-form-urlencoded'             -H "Authorization: Basic $GRANT"             -H "apiKey: $APIKEY"             -H 'channel: Portal'             -H 'language: en'             --data 'grant_type=client_credentials'             -o "$token_out" -w '%{http_code}' "${qbase}token/generate" || true)"
          token_shape="$(python3 - "$token_out" <<'PY'
          import json,sys
          try: obj=json.load(open(sys.argv[1]))
          except Exception: print('non_json'); raise SystemExit
          print('dict:'+','.join(sorted(obj.keys())[:12]) if isinstance(obj,dict) else type(obj).__name__)
          PY
          )"
          echo "QREC_TOKEN HTTP=$token_code SHAPE=$token_shape"
          TOKEN="$(python3 - "$token_out" <<'PY'
          import json,sys
          try: obj=json.load(open(sys.argv[1]))
          except Exception: print(''); raise SystemExit
          print(obj.get('access_token') or obj.get('data',{}).get('access_token') or '')
          PY
          )"
          echo "QREC_TOKEN_PRESENT=$([ -n "$TOKEN" ] && echo yes || echo no)"
          call_meetings () {
            label="$1"; start="$2"; end="$3"; authmode="$4"
            out="/tmp/qrec/exact-$label-$authmode.json"
            headers=(-H "apiKey: $APIKEY" -H 'channel: Portal' -H 'language: en')
            if [ -n "$TOKEN" ]; then
              headers+=(-H "apiToken: $TOKEN")
              if [ "$authmode" = bearer ]; then headers+=(-H "Authorization: Bearer $TOKEN"); fi
            fi
            code="$(curl -L -sS -A "$UA" --connect-timeout 10 --max-time 30               "${headers[@]}"               -o "$out" -w '%{http_code}'               "${qbase}race/data?pageaction=jsonmeetings&startdate=$start&endate=$end&lang=en" || true)"
            summary="$(python3 - "$out" <<'PY'
          import json,sys
          try: obj=json.load(open(sys.argv[1]))
          except Exception: print('non_json'); raise SystemExit
          if isinstance(obj,dict):
              d=obj.get('data')
              if isinstance(d,list):
                  dates=[]
                  for row in d[:8]:
                      if isinstance(row,dict):
                          dates.append(str(row.get('date') or row.get('raceDate') or row.get('meetingDate') or ''))
                  print(f'data_list:{len(d)} dates='+'|'.join(dates))
              else:
                  print('dict_keys:'+','.join(sorted(obj.keys())[:12]))
          elif isinstance(obj,list): print(f'list:{len(obj)}')
          else: print(type(obj).__name__)
          PY
            )"
            echo "QREC_EXACT label=$label auth=$authmode HTTP=$code SHAPE=$summary"
          }
          call_meetings current 2026-10-05 2026-10-06 token
          call_meetings current 2026-10-05 2026-10-06 bearer
          call_meetings old 2026-01-21 2026-01-22 token
          call_meetings old 2026-01-21 2026-01-22 bearer

      - name: Probe common QREC data surfaces
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (compatible; WhereHorsesRun/1.0; +https://github.com/badjoke-lab/where-horses-run)'
          for url in             'https://qrec.gov.qa/wp-json/'             'https://qrec.gov.qa/wp-json/wp/v2/pages?search=race%20calendar&per_page=20'             'https://qrec.gov.qa/api/'             'https://qrec.gov.qa/api/race-calendar'; do
            out='/tmp/qrec/common.out'
            code="$(curl -L -sS -A "$UA" --connect-timeout 10 --max-time 30 -o "$out" -w '%{http_code}' "$url" || true)"
            echo "COMMON HTTP=$code BYTES=$(wc -c < "$out" 2>/dev/null || echo 0) URL=$url"
            head -c 1200 "$out" | tr '\n' ' '; echo
          done
