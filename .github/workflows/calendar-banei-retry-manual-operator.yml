name: Calendar Banei retry manual operator

on:
  pull_request:
    paths:
      - '.github/workflows/calendar-actions-multi-job.yml'
      - 'data/fixtures/calendar-collection-plans-v1.json'
      - 'data/fixtures/calendar-banei-retry-ops-evidence-v1.json'
      - 'scripts/check-calendar-banei-retry-manual-operator.mjs'
      - 'docs/calendar/banei-retry-manual-operator.md'
      - '.github/workflows/calendar-banei-retry-manual-operator.yml'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/calendar-actions-multi-job.yml'
      - 'data/fixtures/calendar-collection-plans-v1.json'
      - 'data/fixtures/calendar-banei-retry-ops-evidence-v1.json'
      - 'scripts/check-calendar-banei-retry-manual-operator.mjs'
      - 'docs/calendar/banei-retry-manual-operator.md'
      - '.github/workflows/calendar-banei-retry-manual-operator.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Check Node syntax
        run: node --check scripts/check-calendar-banei-retry-manual-operator.mjs
      - name: Validate Banei retry manual operator route
        run: node scripts/check-calendar-banei-retry-manual-operator.mjs
      - name: Validate standard Actions multi-job and Banei dependencies
        run: |
          node scripts/check-calendar-actions-multi-job.mjs
          node scripts/check-calendar-banei-retry-ops-evidence.mjs
          node scripts/check-calendar-banei-retry-activation.mjs
          node scripts/check-calendar-banei-actions-executor.mjs
      - name: Validate Registry, Due-job, and Operations dependencies
        run: |
          node scripts/check-calendar-acquisition-registry.mjs
          node scripts/check-calendar-due-job-planner.mjs
          node scripts/check-calendar-operations-v2.mjs
      - name: Validate contracts, governance, and runtime boundary
        run: |
          node scripts/check-calendar-contracts.mjs
          node scripts/check-project-governance-docs.mjs
          node scripts/check-calendar-runtime-import-boundary.mjs
      - name: Check workflow remains manual and read-only
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const workflow = fs.readFileSync('.github/workflows/calendar-actions-multi-job.yml', 'utf8');
          if (!workflow.includes('workflow_dispatch:')) throw new Error('workflow_dispatch missing');
          if (/\bschedule\s*:|\bcron\s*:/.test(workflow)) throw new Error('scheduled trigger present');
          if (!workflow.includes('permissions:\n  contents: read')) throw new Error('read-only contents permission missing');
          if (/contents:\s*write/.test(workflow)) throw new Error('contents write permission present');
          console.log('MANUAL_OPERATOR_TRIGGER: workflow_dispatch');
          console.log('SCHEDULE_TRIGGER: absent');
          console.log('CONTENTS_PERMISSION: read');
          NODE
      - name: Check diff formatting
        run: git diff --check
