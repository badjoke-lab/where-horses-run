name: Glossary racing-type expansion gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'data/audits/glossary-racing-type-expansion-v1.json'
      - 'data/static/glossary.json'
      - 'data/static/glossary-racing-type-registry-v1.json'
      - 'docs/glossary/racing-type-expansion.md'
      - 'docs/glossary/schema-extension.md'
      - 'scripts/check-glossary-schema-extension.mjs'
      - 'scripts/check-glossary-racing-type-expansion.mjs'
      - 'src/pages/glossary/**'
      - 'src/pages/ja/glossary/**'
      - '.github/workflows/glossary-racing-type-expansion.yml'
  push:
    branches:
      - main
    paths:
      - 'data/audits/glossary-racing-type-expansion-v1.json'
      - 'data/static/glossary.json'
      - 'data/static/glossary-racing-type-registry-v1.json'
      - 'docs/glossary/racing-type-expansion.md'
      - 'docs/glossary/schema-extension.md'
      - 'scripts/check-glossary-schema-extension.mjs'
      - 'scripts/check-glossary-racing-type-expansion.mjs'
      - 'src/pages/glossary/**'
      - 'src/pages/ja/glossary/**'
      - '.github/workflows/glossary-racing-type-expansion.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install dependencies without generating a lockfile
        run: npm install --package-lock=false
      - name: Build bilingual glossary routes
        run: npm run build
      - name: Preserve glossary v2 migration contract
        run: node scripts/check-glossary-schema-extension.mjs
      - name: Validate racing-type expansion
        run: node scripts/check-glossary-racing-type-expansion.mjs
      - name: Prove repository clean
        run: |
          changes="$(git status --porcelain --untracked-files=all)"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            exit 1
          fi
