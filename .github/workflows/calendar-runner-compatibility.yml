name: Calendar runner compatibility

on:
  pull_request:
    paths:
      - 'data/static/calendar-runner-compatibility-contract-v1.json'
      - 'data/fixtures/calendar-runner-compatibility-fixtures-v1.json'
      - 'data/fixtures/calendar-runner-compatibility-invalid-cases-v1.json'
      - 'data/static/calendar-acquisition-registry.json'
      - 'data/generated/timetable/jra-refresh-report.json'
      - 'data/generated/timetable/nar-incremental-batches/**/collection-report.json'
      - 'data/generated/timetable/nar-incremental-batches/**/coverage-observation.json'
      - 'scripts/timetable/runner-compatibility.mjs'
      - 'scripts/timetable/collection-job-validation.mjs'
      - 'scripts/timetable/collection-result-manifest-validation.mjs'
      - 'scripts/timetable/coverage-observation-validation.mjs'
      - 'scripts/check-calendar-runner-compatibility.mjs'
      - 'scripts/check-calendar-collection-job.mjs'
      - 'scripts/check-calendar-collection-result-manifest.mjs'
      - 'scripts/check-calendar-coverage-observation-schema.mjs'
      - 'scripts/check-calendar-acquisition-registry.mjs'
      - 'scripts/check-project-governance-docs.mjs'
      - 'docs/calendar/runner-compatibility.md'
      - 'docs/calendar/acquisition-control-plane-implementation-plan.md'
      - 'docs/calendar/machine-readable-contracts.md'
      - 'docs/calendar/README.md'
      - 'docs/calendar/implementation-roadmap.md'
      - 'docs/project-roadmap.md'
      - 'START-HERE.md'
      - '.github/workflows/calendar-runner-compatibility.yml'
  push:
    branches:
      - main
    paths:
      - 'data/static/calendar-runner-compatibility-contract-v1.json'
      - 'data/fixtures/calendar-runner-compatibility-fixtures-v1.json'
      - 'data/fixtures/calendar-runner-compatibility-invalid-cases-v1.json'
      - 'data/static/calendar-acquisition-registry.json'
      - 'data/generated/timetable/jra-refresh-report.json'
      - 'data/generated/timetable/nar-incremental-batches/**/collection-report.json'
      - 'data/generated/timetable/nar-incremental-batches/**/coverage-observation.json'
      - 'scripts/timetable/runner-compatibility.mjs'
      - 'scripts/check-calendar-runner-compatibility.mjs'
      - 'docs/calendar/runner-compatibility.md'
      - 'docs/calendar/acquisition-control-plane-implementation-plan.md'
      - 'docs/calendar/machine-readable-contracts.md'
      - 'docs/calendar/README.md'
      - 'docs/calendar/implementation-roadmap.md'
      - 'docs/project-roadmap.md'
      - 'START-HERE.md'
      - '.github/workflows/calendar-runner-compatibility.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Check Node syntax
        run: |
          node --check scripts/timetable/runner-compatibility.mjs
          node --check scripts/check-calendar-runner-compatibility.mjs

      - name: Validate runner compatibility and real result normalization
        run: node scripts/check-calendar-runner-compatibility.mjs

      - name: Validate shared Job, Coverage, Manifest, and Registry dependencies
        run: |
          node scripts/check-calendar-collection-job.mjs
          node scripts/check-calendar-coverage-observation-schema.mjs
          node scripts/check-calendar-collection-result-manifest.mjs
          node scripts/check-calendar-acquisition-registry.mjs

      - name: Validate Calendar contracts and governance
        run: |
          node scripts/check-calendar-contracts.mjs
          node scripts/check-project-governance-docs.mjs

      - name: Validate runtime import boundary
        run: node scripts/check-calendar-runtime-import-boundary.mjs

      - name: Check diff formatting
        run: git diff --check
