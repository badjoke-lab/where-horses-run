name: TJK annual programme contract probe

on:
  push:
    branches:
      - probe/tjk-annual-programme-contract

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Inspect official annual programme HTML contract
        run: |
          node - <<'NODE'
          const url = 'https://www.tjk.org/TR/YarisSever/Query/Page/YillikYarisProgramiCoklu';
          const res = await fetch(url, { headers: { 'user-agent': 'WhereHorsesRun-source-verification/1.0' } });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const html = await res.text();
          console.log(`bytes=${html.length}`);
          for (const m of html.matchAll(/<input\b[^>]*>/gi)) {
            const tag = m[0];
            if (/tarih|date|baslang|bitis/i.test(tag)) console.log(`INPUT ${tag}`);
          }
          for (const m of html.matchAll(/<select\b[^>]*>/gi)) {
            const tag = m[0];
            if (/sehir|city|tarih|date/i.test(tag)) console.log(`SELECT ${tag}`);
          }
          const lines = html.split(/\r?\n/);
          for (const line of lines) {
            if (/YillikYarisProgramiCoklu|TarihBas|TarihBit|Query\/Data|loadmore|DahaFazla|pageIndex|start|offset/i.test(line)) {
              console.log(`MATCH ${line.trim().slice(0, 2000)}`);
            }
          }
          NODE
