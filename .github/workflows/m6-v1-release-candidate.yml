name: M6 v1.0 release candidate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  m6-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install dependencies without generating a lockfile
        run: npm install --package-lock=false
      - name: Build complete static site
        run: npm run build
      - name: Preserve PR-096 mobile timetable UX
        run: node scripts/check-m6-mobile-timetable-ux.mjs
      - name: Preserve PR-097 country coverage matrix
        run: node scripts/check-m6-country-coverage-matrix.mjs
      - name: Preserve PR-098 source freshness badges
        run: node scripts/check-m6-source-freshness-badges.mjs
      - name: Preserve PR-099 Methods and Data Policy final
        run: node scripts/check-m6-methods-data-policy-final.mjs
      - name: Preserve PR-100 SEO sitemap and metadata final
        run: node scripts/check-m6-seo-sitemap-metadata-final.mjs
      - name: Validate PR-101 release candidate contract
        run: node scripts/check-m6-v1-release-candidate.mjs
      - name: Prove repository clean
        run: |
          changes="$(git status --porcelain --untracked-files=all)"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            exit 1
          fi

  mobile-current:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install dependencies without generating a lockfile
        run: npm install --package-lock=false
      - name: Build complete static site
        run: npm run build
      - name: Render every current public page at mobile widths
        run: node scripts/run-v1-mobile-qa-browser.mjs
      - name: Normalize mobile report
        run: mv v1-mobile-qa-discovery.json v1-mobile-qa-report.json
      - name: Validate current mobile QA
        run: node scripts/check-v1-mobile-qa.mjs
      - name: Remove generated mobile report
        run: rm -f v1-mobile-qa-report.json v1-mobile-qa-discovery.json
      - name: Prove repository clean
        run: |
          changes="$(git status --porcelain --untracked-files=all)"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            exit 1
          fi

  accessibility-current:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install dependencies without generating a lockfile
        run: npm install --package-lock=false
      - name: Build complete static site
        run: npm run build
      - name: Render and audit every current public page
        run: node scripts/run-v1-accessibility-qa-browser.mjs
      - name: Normalize accessibility report
        run: mv v1-accessibility-qa-discovery.json v1-accessibility-qa-report.json
      - name: Validate current accessibility QA
        run: node scripts/check-v1-accessibility-qa.mjs
      - name: Remove generated accessibility report
        run: rm -f v1-accessibility-qa-report.json v1-accessibility-qa-discovery.json
      - name: Prove repository clean
        run: |
          changes="$(git status --porcelain --untracked-files=all)"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            exit 1
          fi

  release-baseline-current:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install dependencies without generating a lockfile
        run: npm install --package-lock=false
      - name: Validate public data references
        run: npm run validate:data
      - name: Build complete static site
        run: npm run build
      - name: Preserve current SEO release gate
        run: node scripts/check-seo-qa-release.mjs
      - name: Preserve v1 scope freeze
        run: node scripts/check-v1-scope-freeze.mjs
      - name: Preserve v1 data audit
        run: node scripts/check-v1-data-audit.mjs
      - name: Preserve v1 source policy review
        run: node scripts/check-v1-source-policy-review.mjs
      - name: Preserve v1 known limitations
        run: node scripts/check-v1-known-limitations.mjs
      - name: Measure current static performance inventory
        run: node scripts/run-v1-performance-qa.mjs
      - name: Normalize performance report
        run: mv v1-performance-qa-discovery.json v1-performance-qa-report.json
      - name: Validate current performance budgets
        run: node scripts/check-v1-performance-qa.mjs
      - name: Preserve v1 release readiness baseline
        run: node scripts/check-v1-release-readiness.mjs
      - name: Preserve accepted v1 release decision
        run: node scripts/check-v1-release-decision.mjs
      - name: Remove generated performance report
        run: rm -f v1-performance-qa-report.json v1-performance-qa-discovery.json
      - name: Prove repository clean
        run: |
          changes="$(git status --porcelain --untracked-files=all)"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            exit 1
          fi

  candidate:
    needs:
      - m6-contracts
      - mobile-current
      - accessibility-current
      - release-baseline-current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate aggregate RC contract
        run: node scripts/check-m6-v1-release-candidate.mjs
      - name: Prove repository clean
        run: |
          changes="$(git status --porcelain --untracked-files=all)"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            exit 1
          fi
