name: Calendar Banei current-window promotion review

on:
  pull_request:
    paths:
      - 'data/reviews/banei-current-window-promotion-review-v1.json'
      - 'data/reviews/banei-current-window-schedule-readiness-activation-v1.json'
      - 'data/audits/calendar-banei-current-window-acquisition-result-v1.json'
      - 'data/audits/calendar-banei-current-window-promotion-proposal-v1.json'
      - 'data/candidates/banei-current-window-c-schedule-approved.json'
      - 'data/candidates/banei-current-window-a-plus-approved.json'
      - 'scripts/check-calendar-banei-current-window-promotion-review.mjs'
      - 'docs/calendar/banei-current-window-promotion-review.md'
      - '.github/workflows/calendar-banei-current-window-promotion-review.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calendar-banei-current-window-promotion-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-completed-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Validate immutable review and applied state
        run: |
          node --check scripts/check-calendar-banei-current-window-promotion-review.mjs
          node scripts/check-calendar-banei-current-window-promotion-review.mjs
          node scripts/check-calendar-pipeline-v1-release-gate.mjs
      - name: Validate committed reviewed proposal closure
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const read = (file) => JSON.parse(fs.readFileSync(file, 'utf8'));
          const cCandidate = read('data/candidates/banei-current-window-c-schedule-approved.json');
          const aPlusCandidate = read('data/candidates/banei-current-window-a-plus-approved.json');
          const proposal = read('data/audits/calendar-banei-current-window-promotion-proposal-v1.json');
          if (cCandidate.source_id !== 'banei-official-schedule' || cCandidate.records.length !== 12) throw new Error('committed C Candidate differs');
          if (cCandidate.records.some((record) => record.capability_rank !== 'C' || record.first_race_time_local !== null || record.last_race_time_local !== null || record.timetable_rows.length !== 0)) throw new Error('committed C Candidate boundary differs');
          if (aPlusCandidate.source_id !== 'nar-banei-race-list-deba-table' || aPlusCandidate.records.length !== 1 || aPlusCandidate.records[0].capability_rank !== 'A+' || aPlusCandidate.records[0].timetable_rows.length !== 12) throw new Error('committed A+ Candidate differs');
          if (proposal.promoted_meeting_count !== 13 || proposal.promoted_detail_count !== 1 || proposal.promoted_race_row_count !== 12 || proposal.retained_c_retry_target_count !== 12) throw new Error('committed proposal counts differ');
          console.log('BANEI_REVIEWED_PROPOSAL: committed_and_retired');
          NODE
      - name: Confirm no proposal rebuild or write path
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const text = fs.readFileSync('.github/workflows/calendar-banei-current-window-promotion-review.yml', 'utf8');
          const executable = text.slice(0, text.indexOf('- name: Confirm no proposal rebuild or write path'));
          const forbidden = ['prepare-banei-current-window-promotion-' + 'proposal.mjs', 'contents: ' + 'write', 'create-pull-' + 'request'];
          for (const marker of forbidden) if (executable.includes(marker)) throw new Error(`retired review workflow contains forbidden marker: ${marker}`);
          console.log('BANEI_REVIEW_SIDE_EFFECTS: disabled');
          NODE
