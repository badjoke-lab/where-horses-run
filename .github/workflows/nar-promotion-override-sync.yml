name: NAR promotion override sync

on:
  push:
    branches:
      - promote/nar-2026-09-04-nagoya-sonoda-a-plus
    paths:
      - '.github/workflows/nar-promotion-override-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: promote/nar-2026-09-04-nagoya-sonoda-a-plus
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Rebuild Japan A+ public overrides
        run: node scripts/timetable/build-japan-a-plus-public-overrides.mjs
      - name: Commit generated override
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/generated/timetable/public/japan-a-plus-overrides.json
          git diff --cached --check
          git diff --cached --quiet && { echo 'No override delta produced'; exit 1; }
          git commit -m 'Sync Japan A+ public overrides with promoted timetable'
          git push origin HEAD:promote/nar-2026-09-04-nagoya-sonoda-a-plus
