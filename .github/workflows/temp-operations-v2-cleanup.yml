name: Temporary Operations v2 cleanup

on:
  pull_request:
    paths:
      - '.github/workflows/temp-operations-v2-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Remove temporary updater artifacts
        run: |
          git rm \
            scripts/update-calendar-operations-v2-doc-state.mjs \
            .github/workflows/temp-calendar-operations-v2-doc-state.yml \
            .github/workflows/temp-operations-v2-cleanup.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "[CF-Pages-Skip] Remove temporary Operations v2 updater artifacts"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
