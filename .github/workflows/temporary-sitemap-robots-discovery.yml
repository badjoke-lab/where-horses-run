name: Temporary sitemap and robots discovery

on:
  pull_request:
    branches:
      - main
    paths:
      - 'astro.config.mjs'
      - 'scripts/sitemap-robots-integration.mjs'
      - 'public/robots.txt'
      - 'public/sitemap.xml'
      - '.github/workflows/temporary-sitemap-robots-discovery.yml'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install dependencies without generating a lockfile
        run: npm install --package-lock=false
      - name: Build complete static site
        run: npm run build
      - name: Capture sitemap and robots measurements
        shell: bash
        run: |
          node <<'NODE' > sitemap-robots-discovery.json
          const fs = require('node:fs');
          const sitemap = fs.readFileSync('dist/sitemap.xml', 'utf8');
          const robots = fs.readFileSync('dist/robots.txt', 'utf8');
          const urls = [...sitemap.matchAll(/<loc>([^<]+)<\/loc>/g)].map((match) => match[1]);
          const paths = urls.map((value) => new URL(value).pathname);
          const count = (pattern) => paths.filter((value) => pattern.test(value)).length;
          const duplicateUrls = urls.length - new Set(urls).size;
          const summary = {
            totalUrls: urls.length,
            englishUrls: paths.filter((value) => !value.startsWith('/ja/')).length,
            japaneseUrls: paths.filter((value) => value.startsWith('/ja/')).length,
            countryDetailUrls: count(/^\/(?:ja\/)?countries\/[^/]+\/$/),
            racecourseDetailUrls: count(/^\/(?:ja\/)?tracks\/[^/]+\/$/),
            glossaryDetailUrls: count(/^\/(?:ja\/)?glossary\/[^/]+\/$/),
            sourceCountryUrls: count(/^\/(?:ja\/)?sources\/[^/]+\/$/),
            meetingDetailUrls: count(/^\/(?:ja\/)?timetable\/meetings\/[^/]+\/$/),
            duplicateUrls,
            nonHttpsUrls: urls.filter((value) => !value.startsWith('https://')).length,
            wrongOriginUrls: urls.filter((value) => new URL(value).origin !== 'https://whr.badjoke-lab.com').length,
            queryOrFragmentUrls: urls.filter((value) => {
              const url = new URL(value);
              return Boolean(url.search || url.hash);
            }).length,
            urlsWithoutTrailingSlash: paths.filter((value) => value !== '/' && !value.endsWith('/')).length,
            hasRoot: urls.includes('https://whr.badjoke-lab.com/'),
            hasJapaneseRoot: urls.includes('https://whr.badjoke-lab.com/ja/'),
            has404: paths.includes('/404/') || paths.includes('/404.html'),
            robotsLines: robots.trimEnd().split('\n'),
          };
          console.log(JSON.stringify(summary, null, 2));
          NODE
          cat sitemap-robots-discovery.json
      - name: Upload sitemap discovery
        uses: actions/upload-artifact@v4
        with:
          name: sitemap-robots-discovery
          path: |
            sitemap-robots-discovery.json
            dist/sitemap.xml
            dist/robots.txt
          retention-days: 1
