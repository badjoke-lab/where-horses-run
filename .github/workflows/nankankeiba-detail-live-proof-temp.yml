name: Nankankeiba detail live proof temp

on:
  push:
    branches:
      - fix/nankankeiba-dynamic-detail
    paths:
      - '.github/workflows/nankankeiba-detail-live-proof-temp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe live Kawasaki programme HTML
        run: |
          node --input-type=module <<'NODE'
          const probes = [
            ['https://www.nankankeiba.com/program/20260908210702.do', ['キリギリス賞', '15:00', '1400']],
            ['https://www.nankankeiba.com/program/20260910210704.do', ['Ｃ３(一)(二)', '20:50', '1600']],
          ];
          for (const [url, markers] of probes) {
            const r = await fetch(url, { headers: { 'user-agent': 'Mozilla/5.0 (compatible; WhereHorsesRun/1.0)' } });
            console.log('URL', url, 'STATUS', r.status, 'FINAL', r.url, 'CTYPE', r.headers.get('content-type'));
            const bytes = await r.arrayBuffer();
            const html = new TextDecoder('shift_jis').decode(bytes);
            console.log('LEN', html.length);
            for (const marker of markers) {
              const i = html.indexOf(marker);
              console.log('MARKER', marker, 'INDEX', i);
              if (i >= 0) console.log(html.slice(Math.max(0, i - 1200), i + 1800).replace(/\s+/g, ' '));
            }
            console.log('RACE CLASS TOKENS', [...new Set([...html.matchAll(/class=["']([^"']*(?:race|Race|program|time|course)[^"']*)["']/g)].map(m => m[1]))].slice(0,80));
          }
          NODE
