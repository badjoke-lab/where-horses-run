name: Nankankeiba detail live proof temp

on:
  push:
    branches:
      - fix/nankankeiba-dynamic-detail
    paths:
      - '.github/workflows/nankankeiba-detail-live-proof-temp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run permanent South Kanto fallback contract
        run: node scripts/check-nankan-official-programme-fallback.mjs
      - name: Prove live Kawasaki five-day detail acquisition through production functions
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { discoverNankankeibaOfficial30d } from './scripts/timetable/nankankeiba-official-30d-discovery.mjs';
          import { fetchNankanOfficialProgramme } from './scripts/timetable/nankan-official-programme-fallback.mjs';

          const dates = ['2026-09-07', '2026-09-08', '2026-09-09', '2026-09-10', '2026-09-11'];
          const discovered = await discoverNankankeibaOfficial30d({ dates });
          assert.equal(discovered.completeness.result, 'complete');
          const kawasaki = discovered.meetings.filter((row) => row.racecourse_id === 'kawasaki-racecourse');
          assert.deepEqual(kawasaki.map((row) => row.date), dates);
          assert.ok(kawasaki.every((row) => /^https:\/\/www\.nankankeiba\.com\/program\/\d{14}\.do$/.test(row.nankankeiba_program_url ?? '')));

          for (const meeting of kawasaki) {
            const result = await fetchNankanOfficialProgramme(meeting);
            assert.equal(result?.status, 'ok', `${meeting.date} must acquire official race detail`);
            assert.equal(result.meeting.capability_rank, 'A+');
            assert.equal(result.meeting.timetable_rows.length, 12, `${meeting.date} must have 12 races`);
            assert.ok(result.meeting.timetable_rows.every((row) => row.post_time_local && row.race_name && row.distance_m && row.surface === 'Dirt'));
            console.log(JSON.stringify({
              date: meeting.date,
              programme: meeting.nankankeiba_program_url,
              source: result.meeting.official_source_url,
              races: result.meeting.timetable_rows.length,
              first: result.meeting.timetable_rows[0],
              last: result.meeting.timetable_rows.at(-1),
            }));
          }
          NODE
