name: Nankankeiba detail live proof temp

on:
  push:
    branches:
      - fix/nankankeiba-dynamic-detail
    paths:
      - '.github/workflows/nankankeiba-detail-live-proof-temp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe live South Kanto links and race rows
        run: |
          node --input-type=module <<'NODE'
          const fetchSj = async (url) => {
            const r = await fetch(url, { headers: { 'user-agent': 'Mozilla/5.0 (compatible; WhereHorsesRun/1.0)' } });
            console.log('URL', url, 'STATUS', r.status, 'FINAL', r.url);
            return new TextDecoder('shift_jis').decode(await r.arrayBuffer());
          };
          const bangumiUrl = 'https://www.nankankeiba.com/bangumi/20262107.do';
          const bangumi = await fetchSj(bangumiUrl);
          console.log('PROGRAM LINKS', [...new Set([...bangumi.matchAll(/href=["']([^"']*\/program\/\d{14}\.do[^"']*)["']/gi)].map(m => new URL(m[1], bangumiUrl).toString()))]);
          for (const marker of ['9月7日', '9月8日', '9月9日', '9月10日', '9月11日']) {
            const i = bangumi.indexOf(marker);
            console.log('BANGUMI MARKER', marker, 'INDEX', i);
            if (i >= 0) console.log(bangumi.slice(Math.max(0, i - 500), i + 1000).replace(/\s+/g, ' '));
          }
          for (const url of [
            'https://www.nankankeiba.com/program/20260908210702.do',
            'https://www.nankankeiba.com/program/20260910210704.do',
          ]) {
            const html = await fetchSj(url);
            const rows = [...html.matchAll(/<li\b[^>]*class=["'][^"']*nk23_c-block01__list__item[^"']*["'][^>]*>([\s\S]*?)<\/li>/gi)].map(m => m[1]);
            console.log('ROW COUNT', url, rows.length);
            console.log('FIRST ROW', rows[0]?.replace(/\s+/g, ' '));
            console.log('LAST ROW', rows.at(-1)?.replace(/\s+/g, ' '));
          }
          NODE
