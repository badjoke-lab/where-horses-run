name: Temp retire NAR reviewed supplements

on:
  push:
    branches: [fix/nar-unquoted-race-name-links]

permissions:
  contents: write

jobs:
  retire:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/nar-unquoted-race-name-links
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Retire superseded reviewed supplements
        run: |
          node scripts/tmp-retire-nar-reviewed-supplements.mjs
          node scripts/check-japan-zero-based-30d.mjs
          npm run build
          git diff --check
      - name: Commit retirement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/static/calendar-reviewed-public-observations.json
          git rm data/static/japan-2026-09-05-reviewed-a-plus-v1.json data/static/japan-2026-09-06-kochi-reviewed-a-plus-v1.json
          git commit -m "data: retire superseded Kochi and Saga reviewed supplements"
          git push origin HEAD:fix/nar-unquoted-race-name-links
