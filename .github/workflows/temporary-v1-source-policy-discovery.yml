name: Temporary v1 source policy discovery

on:
  pull_request:
    branches:
      - main
    paths:
      - 'data/static/**'
      - 'src/lib/data.ts'
      - 'src/lib/source-filter-data.ts'
      - 'src/components/SourceDirectoryPage.astro'
      - 'src/pages/sources/**'
      - 'src/pages/ja/sources/**'
      - 'scripts/validate-data.mjs'
      - 'scripts/temporary-discover-v1-source-policy.mjs'
      - 'scripts/temporary-normalize-v1-source-policy.mjs'
      - '.github/workflows/temporary-v1-source-policy-discovery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install dependencies without generating a lockfile
        run: npm install --package-lock=false
      - name: Validate temporary script syntax
        run: |
          node --check scripts/temporary-normalize-v1-source-policy.mjs
          node --check scripts/temporary-discover-v1-source-policy.mjs
      - name: Normalize source registry public fields
        run: node scripts/temporary-normalize-v1-source-policy.mjs
      - name: Align base source validator with public source contract
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/validate-data.mjs')
          text = path.read_text()
          old = "for (const key of ['country_id', 'source_type', 'url', 'data_type', 'auto_level', 'terms_risk']) {"
          new = "for (const key of ['country_id', 'source_type', 'url', 'data_type', 'auto_level', 'notes']) {"
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit('source validator marker not found')
          PY
      - name: Validate normalized source data references
        run: npm run validate:data
      - name: Build complete static site
        run: npm run build
      - name: Measure normalized registry and rendered policy exposure
        shell: bash
        run: |
          set +e
          node scripts/temporary-discover-v1-source-policy.mjs > v1-source-policy-discovery.log 2>&1
          status=$?
          printf '%s\n' "$status" > v1-source-policy-discovery.exit
          cat v1-source-policy-discovery.log
          exit 0
      - name: Upload normalized source registry and discovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-source-policy-discovery
          path: |
            data/static/sources.json
            data/static/country-page-sources-*.json
            data/static/racecourse-link-amendments-v1.json
            scripts/validate-data.mjs
            v1-source-policy-normalization.json
            v1-source-policy-discovery.log
            v1-source-policy-discovery.exit
            v1-source-policy-discovery.json
          if-no-files-found: error
          retention-days: 1
      - name: Enforce discovery success
        run: |
          status="$(cat v1-source-policy-discovery.exit)"
          if [ "$status" != "0" ]; then
            exit "$status"
          fi
      - name: Commit validated normalization to PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          rm -f v1-source-policy-normalization.json v1-source-policy-discovery.log v1-source-policy-discovery.exit v1-source-policy-discovery.json
          git add data/static/sources.json data/static/country-page-sources-*.json data/static/racecourse-link-amendments-v1.json scripts/validate-data.mjs
          if git diff --cached --quiet; then
            echo 'Validated source registry is already normalized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Normalize public source registry policy'
          git push origin "HEAD:${HEAD_REF}"
