name: Temporary structured data baseline discovery

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/layouts/BaseLayout.astro'
      - '.github/workflows/temporary-structured-data-baseline-discovery.yml'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install dependencies without generating a lockfile
        run: npm install --package-lock=false
      - name: Build complete static site
        run: npm run build
      - name: Capture structured data measurements
        shell: bash
        run: |
          node <<'NODE' > structured-data-baseline-discovery.json
          const fs = require('node:fs');
          const path = require('node:path');

          function walk(directory) {
            return fs.readdirSync(directory, { withFileTypes: true }).flatMap((entry) => {
              const absolute = path.join(directory, entry.name);
              return entry.isDirectory() ? walk(absolute) : [absolute];
            });
          }

          const files = walk('dist').filter((file) => file.endsWith('.html') && path.basename(file) !== '404.html');
          const summary = {
            publicHtmlPages: 0,
            structuredDataScripts: 0,
            validJsonScripts: 0,
            websiteNodes: 0,
            webpageNodes: 0,
            missingScripts: 0,
            multipleScripts: 0,
            contextMismatches: 0,
            websiteIdMismatches: 0,
            webpageIdMismatches: 0,
            canonicalUrlMismatches: 0,
            languageMismatches: 0,
            missingNames: 0,
            missingDescriptions: 0,
            unexpectedTypes: 0,
            organizationNodes: 0,
            searchActionNodes: 0,
            eventNodes: 0,
          };

          for (const file of files) {
            const html = fs.readFileSync(file, 'utf8');
            if (/<meta\s+[^>]*name="robots"[^>]*content="[^"]*noindex/i.test(html)) continue;
            summary.publicHtmlPages += 1;
            const scripts = [...html.matchAll(/<script[^>]*type="application\/ld\+json"[^>]*data-structured-data-baseline="website-webpage-v1"[^>]*>([\s\S]*?)<\/script>/g)];
            summary.structuredDataScripts += scripts.length;
            if (scripts.length === 0) {
              summary.missingScripts += 1;
              continue;
            }
            if (scripts.length > 1) summary.multipleScripts += 1;
            const canonical = html.match(/<link\s+[^>]*rel="canonical"[^>]*href="([^"]+)"|<link\s+[^>]*href="([^"]+)"[^>]*rel="canonical"/)?.slice(1).find(Boolean);
            const lang = html.match(/<html\s+lang="([^"]+)"/)?.[1];
            for (const script of scripts) {
              let data;
              try {
                data = JSON.parse(script[1]);
                summary.validJsonScripts += 1;
              } catch {
                continue;
              }
              if (data['@context'] !== 'https://schema.org') summary.contextMismatches += 1;
              const graph = Array.isArray(data['@graph']) ? data['@graph'] : [];
              const website = graph.find((node) => node['@type'] === 'WebSite');
              const webpage = graph.find((node) => node['@type'] === 'WebPage');
              summary.websiteNodes += website ? 1 : 0;
              summary.webpageNodes += webpage ? 1 : 0;
              if (website?.['@id'] !== 'https://whr.badjoke-lab.com/#website') summary.websiteIdMismatches += 1;
              if (webpage?.['@id'] !== `${canonical}#webpage`) summary.webpageIdMismatches += 1;
              if (webpage?.url !== canonical) summary.canonicalUrlMismatches += 1;
              if (webpage?.inLanguage !== lang) summary.languageMismatches += 1;
              if (!website?.name || !webpage?.name) summary.missingNames += 1;
              if (!webpage?.description) summary.missingDescriptions += 1;
              summary.organizationNodes += graph.filter((node) => node['@type'] === 'Organization').length;
              summary.searchActionNodes += graph.filter((node) => node['@type'] === 'SearchAction').length;
              summary.eventNodes += graph.filter((node) => ['Event', 'SportsEvent'].includes(node['@type'])).length;
              summary.unexpectedTypes += graph.filter((node) => !['WebSite', 'WebPage'].includes(node['@type'])).length;
            }
          }

          console.log(JSON.stringify(summary, null, 2));
          NODE
          cat structured-data-baseline-discovery.json
      - name: Upload structured data discovery
        uses: actions/upload-artifact@v4
        with:
          name: structured-data-baseline-discovery
          path: structured-data-baseline-discovery.json
          retention-days: 1
