name: M6 v1.0 release

on:
  pull_request:
    branches:
      - main
    paths:
      - 'data/static/m6-v1-release-v1.json'
      - 'docs/release/m6-v1-release.md'
      - 'scripts/check-m6-v1-release.mjs'
      - '.github/workflows/m6-v1-release.yml'
      - 'data/static/m6-v1-release-candidate-v1.json'
      - 'scripts/check-m6-v1-release-candidate.mjs'
  push:
    branches:
      - main
    paths:
      - 'data/static/m6-v1-release-v1.json'
      - 'docs/release/m6-v1-release.md'
      - 'scripts/check-m6-v1-release.mjs'
      - '.github/workflows/m6-v1-release.yml'
      - 'data/static/m6-v1-release-candidate-v1.json'
      - 'scripts/check-m6-v1-release-candidate.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  final-release-record:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout full release history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install dependencies without generating a lockfile
        run: npm install --package-lock=false
      - name: Build complete static site
        run: npm run build
      - name: Preserve PR-101 release candidate contract
        run: node scripts/check-m6-v1-release-candidate.mjs
      - name: Validate PR-102 final release record and immutable historical tag
        run: node scripts/check-m6-v1-release.mjs
      - name: Prove repository clean
        run: |
          changes="$(git status --porcelain --untracked-files=all)"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            exit 1
          fi
