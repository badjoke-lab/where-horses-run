name: M6 Methods and Data Policy final

on:
  pull_request:
    paths:
      - 'src/components/MethodsPage.astro'
      - 'data/static/m6-methods-data-policy-final-v1.json'
      - 'data/static/m6-source-freshness-badges-v1.json'
      - 'src/lib/timetable/publicFreshnessState.mjs'
      - '.github/workflows/m5-human-review.yml'
      - 'scripts/check-m5-human-review-workflow.mjs'
      - 'scripts/check-m6-source-freshness-badges.mjs'
      - 'scripts/check-m6-methods-data-policy-final.mjs'
      - 'docs/release/m6-methods-data-policy-final.md'
      - '.github/workflows/m6-methods-data-policy-final.yml'
  push:
    branches:
      - main
    paths:
      - 'src/components/MethodsPage.astro'
      - 'data/static/m6-methods-data-policy-final-v1.json'
      - 'data/static/m6-source-freshness-badges-v1.json'
      - 'src/lib/timetable/publicFreshnessState.mjs'
      - '.github/workflows/m5-human-review.yml'
      - 'scripts/check-m5-human-review-workflow.mjs'
      - 'scripts/check-m6-source-freshness-badges.mjs'
      - 'scripts/check-m6-methods-data-policy-final.mjs'
      - 'docs/release/m6-methods-data-policy-final.md'
      - '.github/workflows/m6-methods-data-policy-final.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - run: npm install --package-lock=false
      - run: npm run build
      - run: node scripts/check-methods-data-policy.mjs
      - run: node scripts/check-m5-human-review-workflow.mjs
      - run: node scripts/check-m6-source-freshness-badges.mjs
      - run: node scripts/check-m6-methods-data-policy-final.mjs
      - run: git diff --exit-code
