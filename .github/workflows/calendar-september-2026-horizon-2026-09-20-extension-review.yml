# Exact review evidence is pinned intentionally; future queue updates require a new reviewed candidate.
name: Calendar September 2026 horizon September 20 extension review

on:
  pull_request:
    paths:
      - '.github/workflows/calendar-september-2026-horizon-2026-09-20-extension-review.yml'
      - 'scripts/timetable/build-calendar-september-2026-horizon-extension-2026-09-20-approved-candidates.mjs'
      - 'data/candidates/nar-horizon-extension-2026-09-20-approved.json'
      - 'data/generated/timetable/canonical/**'
      - 'data/generated/timetable/public/**'
      - 'data/generated/timetable/operations-status.json'
      - 'data/generated/timetable/operations-review-package.json'
      - 'scripts/check-calendar-nar-incremental-v2-promotion-output-determinism.mjs'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/calendar-september-2026-horizon-2026-09-20-extension-review.yml'
      - 'scripts/timetable/build-calendar-september-2026-horizon-extension-2026-09-20-approved-candidates.mjs'
      - 'data/candidates/nar-horizon-extension-2026-09-20-approved.json'
      - 'data/generated/timetable/canonical/**'
      - 'data/generated/timetable/public/**'
      - 'data/generated/timetable/operations-status.json'
      - 'data/generated/timetable/operations-review-package.json'
      - 'scripts/check-calendar-nar-incremental-v2-promotion-output-determinism.mjs'

permissions:
  contents: read

concurrency:
  group: calendar-september-2026-horizon-2026-09-20-extension-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          path: work
          fetch-depth: 0

      - name: Checkout exact daily-review source evidence
        uses: actions/checkout@v4
        with:
          ref: 9806279dc43b51299124405fffb70d7010b258a9
          path: review-source
          sparse-checkout: |
            data/candidates/nar-incremental-batches/due-job-plan-2026-08-22-due-japan-nar-coverage-gap-001-run-001/batch.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Rebuild approved Rank C September 20 candidate envelope from exact review evidence
        working-directory: work
        env:
          WHR_NAR_REVIEW_BATCH: ${{ github.workspace }}/review-source/data/candidates/nar-incremental-batches/due-job-plan-2026-08-22-due-japan-nar-coverage-gap-001-run-001/batch.json
        run: node scripts/timetable/build-calendar-september-2026-horizon-extension-2026-09-20-approved-candidates.mjs

      - name: Verify approved Candidate remains deterministic
        working-directory: work
        run: git diff --exit-code -- data/candidates/nar-horizon-extension-2026-09-20-approved.json

      - name: Dry-run promotion validation
        working-directory: work
        run: node scripts/timetable/promote-timetable.mjs --input data/candidates/nar-horizon-extension-2026-09-20-approved.json --dry-run

      - name: Rebuild current deterministic public and operations projections
        working-directory: work
        run: |
          node scripts/timetable/build-public-timetable-view.mjs
          node scripts/timetable/build-japan-a-plus-public-overrides.mjs
          node scripts/timetable/build-operations-status.mjs --reference-date 2026-07-01
          node scripts/timetable/build-operations-review-package.mjs

      - name: Validate current generated repository data
        working-directory: work
        run: |
          node scripts/validate-data.mjs
          node scripts/check-japan-a-plus-public-overrides.mjs
          node scripts/check-calendar-operations-status.mjs
          node scripts/check-calendar-operations-review-package.mjs

      - name: Verify cumulative NAR promotion determinism
        working-directory: work
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-calendar-nar-incremental-v2-promotion-output-determinism.mjs

      - name: Verify September 20 reviewed historical invariant
        working-directory: work
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const candidate = JSON.parse(fs.readFileSync('data/candidates/nar-horizon-extension-2026-09-20-approved.json', 'utf8'));
          const expectedIds = [
            'nar-kochi-racecourse-2026-09-20',
            'nar-saga-racecourse-2026-09-20',
          ].sort();
          const actualIds = candidate.records.map((record) => record.meeting_id).sort();
          if (candidate.review?.status !== 'approved') throw new Error('review status differs');
          if (candidate.review?.promotion_target !== 'canonical-timetable-v0') throw new Error('promotion target differs');
          if (JSON.stringify(actualIds) !== JSON.stringify(expectedIds)) throw new Error('reviewed meeting identities differ');
          for (const record of candidate.records) {
            if (record.capability_rank !== 'C') throw new Error(`${record.meeting_id}: reviewed rank differs from C`);
            if (record.first_race_time_local !== null || record.last_race_time_local !== null) throw new Error(`${record.meeting_id}: reviewed candidate contains race time`);
            if (!Array.isArray(record.timetable_rows) || record.timetable_rows.length !== 0) throw new Error(`${record.meeting_id}: reviewed candidate contains timetable rows`);
          }

          const rankOrder = new Map([['C', 0], ['B', 1], ['B+', 2], ['A', 3], ['A+', 4]]);
          const canonical = JSON.parse(fs.readFileSync('data/generated/timetable/canonical/meetings.json', 'utf8'));
          const details = JSON.parse(fs.readFileSync('data/generated/timetable/canonical/meeting-details.json', 'utf8'));
          const publicList = JSON.parse(fs.readFileSync('data/generated/timetable/public/meeting-list.json', 'utf8'));
          const publicDetails = JSON.parse(fs.readFileSync('data/generated/timetable/public/meeting-details.json', 'utf8'));
          const canonicalById = new Map(canonical.meetings.map((meeting) => [meeting.meeting_id, meeting]));
          const publicById = new Map(publicList.meetings.map((meeting) => [meeting.meeting_id, meeting]));
          const stableFields = ['country_id', 'authority_id', 'racecourse_id', 'date', 'timezone'];
          for (const record of candidate.records) {
            const canonicalMeeting = canonicalById.get(record.meeting_id);
            const publicMeeting = publicById.get(record.meeting_id);
            if (!canonicalMeeting) throw new Error(`${record.meeting_id}: meeting missing from canonical output`);
            if (!publicMeeting) throw new Error(`${record.meeting_id}: meeting missing from public output`);
            for (const field of stableFields) {
              if (canonicalMeeting[field] !== record[field]) throw new Error(`${record.meeting_id}: canonical ${field} drifted`);
              if (publicMeeting[field] !== record[field]) throw new Error(`${record.meeting_id}: public ${field} drifted`);
            }
            const canonicalRank = rankOrder.get(canonicalMeeting.capability_rank);
            const publicRank = rankOrder.get(publicMeeting.capability_rank);
            if (canonicalRank === undefined || canonicalRank < rankOrder.get('C')) throw new Error(`${record.meeting_id}: canonical rank regressed below C`);
            if (publicRank === undefined || publicRank < rankOrder.get('C')) throw new Error(`${record.meeting_id}: public rank regressed below C`);
          }

          const status = JSON.parse(fs.readFileSync('data/generated/timetable/operations-status.json', 'utf8'));
          if (canonical.meetings.length < 433) throw new Error(`canonical meeting count regressed below September 20 baseline: ${canonical.meetings.length}`);
          if (details.details.length < 87) throw new Error(`canonical detail count regressed below September 20 baseline: ${details.details.length}`);
          if ((status.public_projection?.meeting_count ?? 0) < 420) throw new Error(`public meeting count regressed below September 20 baseline: ${status.public_projection?.meeting_count}`);
          if ((status.public_projection?.detail_count ?? 0) < 87) throw new Error(`public detail count regressed below September 20 baseline: ${status.public_projection?.detail_count}`);
          if ((status.public_projection?.latest_meeting_date ?? '') < '2026-09-20') throw new Error(`public horizon regressed below September 20 baseline: ${status.public_projection?.latest_meeting_date}`);
          if (publicDetails.details.length < 87) throw new Error(`public detail dataset regressed below September 20 baseline: ${publicDetails.details.length}`);
          NODE

      - name: Verify deterministic current outputs
        working-directory: work
        run: |
          node scripts/timetable/build-public-timetable-view.mjs --check
          git diff --exit-code -- \
            data/candidates/nar-horizon-extension-2026-09-20-approved.json \
            data/generated/timetable/canonical/meetings.json \
            data/generated/timetable/canonical/meeting-details.json \
            data/generated/timetable/public/meeting-list.json \
            data/generated/timetable/public/meeting-details.json \
            data/generated/timetable/public/japan-a-plus-overrides.json \
            data/generated/timetable/operations-status.json \
            data/generated/timetable/operations-review-package.json

      - name: Check formatting
        working-directory: work
        run: git diff --check
