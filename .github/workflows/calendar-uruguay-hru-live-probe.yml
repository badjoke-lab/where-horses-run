name: Uruguay HRU live probe

on:
  pull_request:
    paths:
      - '.github/workflows/calendar-uruguay-hru-live-probe.yml'
      - 'scripts/timetable/uruguay-hru-calendar-core.mjs'
      - 'scripts/timetable/run-uruguay-hru-official-window.mjs'
      - 'scripts/check-uruguay-hru-adapter.mjs'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Validate Uruguay HRU adapter
        run: npm run validate:uruguay-hru
      - name: Probe live 30-day Uruguay window
        run: |
          mkdir -p .calendar-uruguay-hru-probe
          node scripts/timetable/run-uruguay-hru-official-window.mjs \
            --as-of=2026-09-27 \
            --days=30 \
            --output=.calendar-uruguay-hru-probe/uruguay.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const d=JSON.parse(fs.readFileSync('.calendar-uruguay-hru-probe/uruguay.json','utf8'));
          console.log(JSON.stringify({meetings:d.records.map(r=>({date:r.date,racecourse_id:r.racecourse_id})),diagnostics:d.diagnostics,discovery:d.discovery}));
          if(d.diagnostics.source_errors.length||d.diagnostics.parse_failures.length) process.exitCode=1;
          if(!d.records.some(r=>r.date==='2026-09-27'&&r.racecourse_id==='uruguay--hipodromo-nacional-de-maronas')) process.exitCode=1;
          const allowed=new Set(['uruguay--hipodromo-nacional-de-maronas','uruguay--hipodromo-las-piedras']);
          if(d.records.some(r=>!allowed.has(r.racecourse_id))) process.exitCode=1;
          if(d.records.some(r=>r.capability_rank!=='C'||r.first_race_time_local!==null||r.last_race_time_local!==null||r.timetable_rows.length)) process.exitCode=1;
          NODE
