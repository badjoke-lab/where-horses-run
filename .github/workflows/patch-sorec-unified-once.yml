name: Patch SOREC unified once

on:
  push:
    branches:
      - fix/morocco-sorec-best-available-20260909
    paths:
      - '.github/workflows/patch-sorec-unified-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/morocco-sorec-best-available-20260909
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Wire SOREC into unified rolling refresh
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = '.github/workflows/calendar-unified-official-refresh.yml';
          let text = fs.readFileSync(file, 'utf8');
          const expr = '$' + '{{ steps.scope.outputs.days }}';
          const lines = (items) => items.join('\n');

          function replaceExact(before, after, label) {
            const parts = text.split(before);
            const count = parts.length - 1;
            if (count !== 1) throw new Error(`${label}: expected 1 occurrence, found ${count}`);
            text = parts.join(after);
          }

          const topTjkCollect = lines([
            '          node scripts/timetable/run-tjk-current-best-available.mjs \\',
            `            --days="${expr}" \\`,
            '            --output=.calendar-unified/tjk.json',
          ]);
          replaceExact(topTjkCollect, lines([
            topTjkCollect,
            '          node scripts/timetable/run-sorec-official-window.mjs \\',
            `            --days="${expr}" \\`,
            '            --output=.calendar-unified/sorec.json',
          ]), 'top collector wiring');

          const rebuildTjkCollect = lines([
            '            node scripts/timetable/run-tjk-current-best-available.mjs \\',
            `              --days="${expr}" \\`,
            '              --output=.calendar-unified/tjk.json',
          ]);
          replaceExact(rebuildTjkCollect, lines([
            rebuildTjkCollect,
            '            node scripts/timetable/run-sorec-official-window.mjs \\',
            `              --days="${expr}" \\`,
            '              --output=.calendar-unified/sorec.json',
          ]), 'rebuild collector wiring');

          const topExclusionTail = lines([
            '            --artifact=.calendar-unified/kra.json \\',
            '            --artifact=.calendar-unified/tjk.json',
          ]);
          replaceExact(topExclusionTail, lines([
            '            --artifact=.calendar-unified/kra.json \\',
            '            --artifact=.calendar-unified/tjk.json \\',
            '            --artifact=.calendar-unified/sorec.json',
          ]), 'top exclusion wiring');

          const rebuildExclusionTail = lines([
            '              --artifact=.calendar-unified/kra.json \\',
            '              --artifact=.calendar-unified/tjk.json',
          ]);
          replaceExact(rebuildExclusionTail, lines([
            '              --artifact=.calendar-unified/kra.json \\',
            '              --artifact=.calendar-unified/tjk.json \\',
            '              --artifact=.calendar-unified/sorec.json',
          ]), 'rebuild exclusion wiring');

          const topTjkApply = lines([
            '          node scripts/timetable/apply-official-rolling-observations.mjs \\',
            '            --artifact=.calendar-unified/tjk.json \\',
            '            --country-id=turkey \\',
            '            --authority-id=turkiye-jokey-kulubu \\',
            '            --racing-system-id=tjk-national-racing-system \\',
            '            --timezone=Europe/Istanbul',
          ]);
          replaceExact(topTjkApply, lines([
            topTjkApply,
            '          node scripts/timetable/apply-official-rolling-observations.mjs \\',
            '            --artifact=.calendar-unified/sorec.json \\',
            '            --country-id=morocco \\',
            '            --authority-id=sorec \\',
            '            --racing-system-id=sorec-racing-information-system \\',
            '            --timezone=Africa/Casablanca',
          ]), 'top apply wiring');

          const rebuildTjkApply = lines([
            '            node scripts/timetable/apply-official-rolling-observations.mjs \\',
            '              --artifact=.calendar-unified/tjk.json \\',
            '              --country-id=turkey \\',
            '              --authority-id=turkiye-jokey-kulubu \\',
            '              --racing-system-id=tjk-national-racing-system \\',
            '              --timezone=Europe/Istanbul',
          ]);
          replaceExact(rebuildTjkApply, lines([
            rebuildTjkApply,
            '            node scripts/timetable/apply-official-rolling-observations.mjs \\',
            '              --artifact=.calendar-unified/sorec.json \\',
            '              --country-id=morocco \\',
            '              --authority-id=sorec \\',
            '              --racing-system-id=sorec-racing-information-system \\',
            '              --timezone=Africa/Casablanca',
          ]), 'rebuild apply wiring');

          replaceExact(
            '      - name: Collect TJK official window',
            '      - name: Collect TJK and SOREC official windows',
            'step label',
          );

          fs.writeFileSync(file, text);
          NODE
          git diff --check
          test "$(grep -c 'run-sorec-official-window.mjs' .github/workflows/calendar-unified-official-refresh.yml)" -eq 2
          test "$(grep -c -- '--authority-id=sorec' .github/workflows/calendar-unified-official-refresh.yml)" -eq 2
          test "$(grep -c -- '--artifact=.calendar-unified/sorec.json' .github/workflows/calendar-unified-official-refresh.yml)" -eq 4
          git diff -- .github/workflows/calendar-unified-official-refresh.yml
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/calendar-unified-official-refresh.yml
          git commit -m "feat(calendar): wire SOREC into unified official refresh"
          git push origin HEAD:fix/morocco-sorec-best-available-20260909
