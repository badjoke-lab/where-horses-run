name: Calendar India independent official route probe

on:
  pull_request:
    paths:
      - '.github/workflows/calendar-india-hyderabad-source-probe.yml'
      - 'scripts/timetable/probe-india-hyderabad-source-2026.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  india-official:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only official source check, no downloaded body retained
        run: node scripts/timetable/probe-india-hyderabad-source-2026.mjs
