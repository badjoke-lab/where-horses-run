name: Calendar Malta Equidrome first-party 2026 source check
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/calendar-malta-equidrome-source-check.yml'
      - 'scripts/timetable/probe-malta-equidrome-first-party-2026.mjs'
permissions:
  contents: read
jobs:
  verify-source:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parser and robots safety tests
        run: |
          node --check scripts/timetable/probe-malta-equidrome-first-party-2026.mjs
          node scripts/timetable/probe-malta-equidrome-first-party-2026.mjs --self-test
      - name: First-party venue schedule access (read-only, no ingestion)
        run: node scripts/timetable/probe-malta-equidrome-first-party-2026.mjs
