name: India club Calendar probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/calendar-india-clubs-current-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Probe Bangalore and RWITC official routes
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (compatible; WhereHorsesRun/1.0; +https://github.com/badjoke-lab/where-horses-run)'
          mkdir -p /tmp/india
          for item in \
            'bangalore-fixtures|https://www.bangaloreraces.com/Club/Fixtures' \
            'bangalore-home|https://www.bangaloreraces.com/home' \
            'rwitc-calendar|https://www.rwitc.com/new/calendar.php' \
            'rwitc-home|https://www.rwitc.com/'; do
            name="${item%%|*}"
            url="${item#*|}"
            out="/tmp/india/$name.out"
            code="$(curl -L -sS -A "$UA" --connect-timeout 12 --max-time 40 -o "$out" -w '%{http_code}' "$url" || true)"
            final="$(curl -L -sS -A "$UA" --connect-timeout 12 --max-time 40 -o /dev/null -w '%{url_effective}' "$url" || true)"
            echo "INDIA_PAGE name=$name HTTP=$code BYTES=$(wc -c < "$out" 2>/dev/null || echo 0) FINAL=$final"
          done

      - name: Inspect Bangalore fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 - /tmp/india/bangalore-fixtures.out <<'PY'
          import html,re,sys
          raw=open(sys.argv[1],errors='replace').read()
          text=re.sub(r'<script\b[^>]*>.*?</script>',' ',raw,flags=re.I|re.S)
          text=re.sub(r'<style\b[^>]*>.*?</style>',' ',text,flags=re.I|re.S)
          text=html.unescape(re.sub(r'<[^>]+>',' ',text))
          text=re.sub(r'\s+',' ',text).strip()
          print('BANGALORE_TEXT_LEN',len(text))
          for needle in ['2026','October','November','December','Winter','Bangalore','Fixture','Race Day']:
              p=text.lower().find(needle.lower())
              if p>=0:
                  print('BANGALORE_TEXT',needle,text[max(0,p-500):p+6000])
          pats=[
            r'\b(\d{1,2})[/-](\d{1,2})[/-](20\d{2})\b',
            r'\b(20\d{2})[/-](\d{1,2})[/-](\d{1,2})\b',
            r'\b(\d{1,2})\s+(January|February|March|April|May|June|July|August|September|October|November|December)\s+(20\d{2})\b',
            r'\b(January|February|March|April|May|June|July|August|September|October|November|December)\s+(\d{1,2})[,]?\s+(20\d{2})\b'
          ]
          seen=[]
          for pat in pats:
              for m in re.finditer(pat,text,re.I):
                  s=m.group(0)
                  if s not in seen: seen.append(s)
          print('BANGALORE_DATES',len(seen))
          for x in seen[:120]: print('BANGALORE_DATE',x)
          for m in re.finditer(r'href=["\']([^"\']+)["\']',raw,re.I):
              u=html.unescape(m.group(1))
              if any(k in u.lower() for k in ['fixture','race','calendar','card','program','pdf']):
                  print('BANGALORE_LINK',u)
          PY

      - name: Inspect RWITC calendar
        shell: bash
        run: |
          set -euo pipefail
          python3 - /tmp/india/rwitc-calendar.out <<'PY'
          import html,re,sys
          raw=open(sys.argv[1],errors='replace').read()
          text=re.sub(r'<script\b[^>]*>.*?</script>',' ',raw,flags=re.I|re.S)
          text=re.sub(r'<style\b[^>]*>.*?</style>',' ',text,flags=re.I|re.S)
          text=html.unescape(re.sub(r'<[^>]+>',' ',text))
          text=re.sub(r'\s+',' ',text).strip()
          print('RWITC_TEXT_LEN',len(text))
          for needle in ['2026','October','November','December','Mumbai','Pune','Calendar','Race']:
              p=text.lower().find(needle.lower())
              if p>=0:
                  print('RWITC_TEXT',needle,text[max(0,p-500):p+7000])
          pats=[
            r'\b(\d{1,2})[/-](\d{1,2})[/-](20\d{2})\b',
            r'\b(20\d{2})[/-](\d{1,2})[/-](\d{1,2})\b',
            r'\b(\d{1,2})\s+(January|February|March|April|May|June|July|August|September|October|November|December)\s+(20\d{2})\b',
            r'\b(January|February|March|April|May|June|July|August|September|October|November|December)\s+(\d{1,2})[,]?\s+(20\d{2})\b'
          ]
          seen=[]
          for pat in pats:
              for m in re.finditer(pat,text,re.I):
                  s=m.group(0)
                  if s not in seen: seen.append(s)
          print('RWITC_DATES',len(seen))
          for x in seen[:160]: print('RWITC_DATE',x)
          for m in re.finditer(r'href=["\']([^"\']+)["\']',raw,re.I):
              u=html.unescape(m.group(1))
              if any(k in u.lower() for k in ['calendar','race','card','program','pdf','fixture']):
                  print('RWITC_LINK',u)
          PY
