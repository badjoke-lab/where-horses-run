name: Estonia Tuula current Calendar probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/calendar-estonia-tuula-current-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Probe Hipodroom official calendar
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (compatible; WhereHorsesRun/1.0; +https://github.com/badjoke-lab/where-horses-run)'
          mkdir -p /tmp/estonia
          for item in \
            'calendar|https://hipodroom.ee/kalender/' \
            'home|https://hipodroom.ee/' \
            'robots|https://hipodroom.ee/robots.txt'; do
            name="${item%%|*}"
            url="${item#*|}"
            out="/tmp/estonia/$name.html"
            code="$(curl -L -sS -A "$UA" --connect-timeout 15 --max-time 45 -o "$out" -w '%{http_code}' "$url" || true)"
            final="$(curl -L -sS -A "$UA" --connect-timeout 15 --max-time 45 -o /dev/null -w '%{url_effective}' "$url" || true)"
            echo "ESTONIA_PAGE name=$name HTTP=$code BYTES=$(wc -c < "$out" 2>/dev/null || echo 0) FINAL=$final"
          done

      - name: Inspect Tuula calendar structure
        shell: bash
        run: |
          set -euo pipefail
          python3 - /tmp/estonia/calendar.html <<'PY'
          import html,re,sys
          from pathlib import Path
          raw=Path(sys.argv[1]).read_text(errors='replace')
          text=re.sub(r'<script\b[^>]*>.*?</script>',' ',raw,flags=re.I|re.S)
          text=re.sub(r'<style\b[^>]*>.*?</style>',' ',text,flags=re.I|re.S)
          text=html.unescape(re.sub(r'<[^>]+>',' ',text))
          text=re.sub(r'\s+',' ',text).strip()
          print('TEXT_LEN',len(text))
          for needle in ['2026','2027','Tuula','hipodroom','kalender','oktoober','november','detsember']:
              p=text.lower().find(needle.lower())
              if p>=0:
                  print('ESTONIA_TEXT',needle,text[max(0,p-500):p+6000])
          pats=[
            r'\b(20\d{2})[./-](\d{1,2})[./-](\d{1,2})\b',
            r'\b(\d{1,2})[./-](\d{1,2})[./-](20\d{2})\b',
            r'\b(\d{1,2})\s+(jaanuar|veebruar|märts|marts|aprill|mai|juuni|juuli|august|september|oktoober|november|detsember)(?:\s+(20\d{2}))?\b'
          ]
          seen=[]
          for pat in pats:
              for m in re.finditer(pat,text,re.I):
                  s=m.group(0)
                  if s not in seen: seen.append(s)
          print('DATE_MATCHES',len(seen))
          for x in seen[:160]: print('DATE',x)
          links=[]
          for m in re.finditer(r'href=["\']([^"\']+)["\']',raw,re.I):
              u=html.unescape(m.group(1))
              low=u.lower()
              if any(k in low for k in ['kalend','võist','voist','race','event','tuula','pdf','ical']):
                  if u not in links: links.append(u)
          for u in links[:160]: print('LINK',u)
          PY

      - name: Inspect structured data and APIs
        shell: bash
        run: |
          set -euo pipefail
          python3 - /tmp/estonia/calendar.html <<'PY'
          import html,re,sys
          raw=open(sys.argv[1],errors='replace').read()
          for label,pat in [
            ('JSONLD',r'<script[^>]+type=["\']application/ld\+json["\'][^>]*>(.*?)</script>'),
            ('IFRAME',r'<iframe[^>]+src=["\']([^"\']+)["\']'),
            ('SCRIPT',r'<script[^>]+src=["\']([^"\']+)["\']')
          ]:
            n=0
            for m in re.finditer(pat,raw,re.I|re.S):
              s=html.unescape(m.group(1)).strip()
              if label=='SCRIPT' and not any(k in s.lower() for k in ['calendar','event','api','ajax','race','kalend']): continue
              print(label,s[:2000].replace('\n',' '))
              n+=1
              if n>=100: break
          PY

      - name: Probe Estonia 2026 calendar page and WP API
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (compatible; WhereHorsesRun/1.0; +https://github.com/badjoke-lab/where-horses-run)'
          mkdir -p /tmp/estonia-2026
          for item in \
            'page|https://hipodroom.ee/2026-aasta-urituste-kalender/' \
            'wp-page|https://hipodroom.ee/wp-json/wp/v2/pages?slug=2026-aasta-urituste-kalender' \
            'wp-search|https://hipodroom.ee/wp-json/wp/v2/search?search=2026%20aasta%20urituste%20kalender&per_page=20' \
            'events|https://hipodroom.ee/events/'; do
            name="${item%%|*}"
            url="${item#*|}"
            out="/tmp/estonia-2026/$name.out"
            code="$(curl -L -sS -A "$UA" --connect-timeout 15 --max-time 45 -o "$out" -w '%{http_code}' "$url" || true)"
            echo "ESTONIA_2026 name=$name HTTP=$code BYTES=$(wc -c < "$out" 2>/dev/null || echo 0) URL=$url"
          done

      - name: Inspect Estonia 2026 page content
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html,json,re
          from pathlib import Path
          raw=Path('/tmp/estonia-2026/page.out').read_text(errors='replace')
          text=re.sub(r'<script\b[^>]*>.*?</script>',' ',raw,flags=re.I|re.S)
          text=re.sub(r'<style\b[^>]*>.*?</style>',' ',text,flags=re.I|re.S)
          text=html.unescape(re.sub(r'<[^>]+>',' ',text))
          text=re.sub(r'\s+',' ',text).strip()
          print('ESTONIA_2026_TEXT',text[:12000])
          for needle in ['2026','Tuula','hipodroom','jaanuar','veebruar','märts','aprill','mai','juuni','juuli','august','september','oktoober','november','detsember']:
              p=text.lower().find(needle.lower())
              if p>=0: print('ESTONIA_2026_MATCH',needle,text[max(0,p-500):p+5000])
          for m in re.finditer(r'(?:href|src)=["\']([^"\']+)["\']',raw,re.I):
              u=html.unescape(m.group(1))
              if any(k in u.lower() for k in ['2026','kalend','calendar','pdf','png','jpg','event','voist','võist']):
                  print('ESTONIA_2026_LINK',u)

          try:
              pages=json.loads(Path('/tmp/estonia-2026/wp-page.out').read_text(errors='replace'))
              print('WP_PAGE_COUNT',len(pages))
              for p in pages:
                  print('WP_PAGE',json.dumps({
                    'id':p.get('id'),'link':p.get('link'),'date':p.get('date'),'modified':p.get('modified'),
                    'title':(p.get('title') or {}).get('rendered'),
                    'content':(p.get('content') or {}).get('rendered')
                  },ensure_ascii=False)[:16000])
          except Exception as e:
              print('WP_PAGE_ERROR',type(e).__name__,str(e))
          PY

      - name: Geocode Tuula Hipodroom
        shell: bash
        run: |
          set -euo pipefail
          UA='WhereHorsesRun/1.0 (+https://github.com/badjoke-lab/where-horses-run)'
          mkdir -p /tmp/estonia-geo
          python3 - <<'PY' > /tmp/estonia-geo/queries.txt
          for q in [
            'Tuula Hipodroom, Tuula, Harjumaa, Estonia',
            'Tuula Küla, Harjumaa 76618, Estonia',
            'Tuula Hipodroom, Saue vald, Estonia'
          ]:
              print(q)
          PY
          n=0
          found=0
          while IFS= read -r query; do
            n=$((n+1))
            out="/tmp/estonia-geo/$n.json"
            curl -L -sS -A "$UA" --get               --data-urlencode "q=$query"               --data 'format=jsonv2'               --data 'limit=8'               'https://nominatim.openstreetmap.org/search'               -o "$out"
            python3 - "$out" "$query" <<'PY'
          import json,sys
          rows=json.load(open(sys.argv[1]))
          print('TUULA_GEOCODE_QUERY',sys.argv[2],'RESULTS',len(rows))
          for r in rows:
              print('TUULA_GEOCODE',json.dumps({
                'lat':r.get('lat'),'lon':r.get('lon'),'display_name':r.get('display_name'),
                'osm_type':r.get('osm_type'),'osm_id':r.get('osm_id'),'type':r.get('type'),'class':r.get('class')
              },ensure_ascii=False))
          PY
            if [ "$(python3 -c 'import json,sys;print(len(json.load(open(sys.argv[1]))))' "$out")" -gt 0 ]; then found=1; fi
            sleep 1
          done < /tmp/estonia-geo/queries.txt
          [ "$found" -eq 1 ] || { echo 'NO_TUULA_GEOCODE_RESULTS'; exit 1; }

      - name: Inspect official Tuula contact map
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (compatible; WhereHorsesRun/1.0; +https://github.com/badjoke-lab/where-horses-run)'
          mkdir -p /tmp/estonia-contact
          for item in \
            'contact|https://hipodroom.ee/kontakt/' \
            'contact-api|https://hipodroom.ee/wp-json/wp/v2/pages?slug=kontakt'; do
            name="${item%%|*}"
            url="${item#*|}"
            out="/tmp/estonia-contact/$name.out"
            code="$(curl -L -sS -A "$UA" --connect-timeout 15 --max-time 45 -o "$out" -w '%{http_code}' "$url" || true)"
            echo "TUULA_CONTACT name=$name HTTP=$code BYTES=$(wc -c < "$out" 2>/dev/null || echo 0) URL=$url"
          done
          python3 - <<'PY'
          import html,json,re
          from pathlib import Path
          raw=Path('/tmp/estonia-contact/contact.out').read_text(errors='replace')
          text=re.sub(r'<script\b[^>]*>.*?</script>',' ',raw,flags=re.I|re.S)
          text=re.sub(r'<style\b[^>]*>.*?</style>',' ',text,flags=re.I|re.S)
          text=html.unescape(re.sub(r'<[^>]+>',' ',text))
          text=re.sub(r'\s+',' ',text).strip()
          print('TUULA_CONTACT_TEXT',text[:9000])
          for m in re.finditer(r'<iframe[^>]+src=["\']([^"\']+)["\']',raw,re.I):
              print('TUULA_IFRAME',html.unescape(m.group(1)))
          for m in re.finditer(r'https?://[^"\'<> ]+',raw,re.I):
              u=html.unescape(m.group(0))
              if any(k in u.lower() for k in ['maps','google','openstreet','geo','lat','lng','place']):
                  print('TUULA_MAP_URL',u[:1800])
          for pat in [
              r'(-?5\d\.\d{4,})[,; ]+(-?2\d\.\d{4,})',
              r'lat(?:itude)?["\'=:\s]+(-?\d+\.\d+)',
              r'(?:lng|lon|longitude)["\'=:\s]+(-?\d+\.\d+)'
          ]:
              for m in re.finditer(pat,raw,re.I):
                  print('TUULA_COORD_MATCH',m.group(0)[:500])
          try:
              pages=json.loads(Path('/tmp/estonia-contact/contact-api.out').read_text(errors='replace'))
              for p in pages:
                  print('TUULA_CONTACT_API',json.dumps({
                    'id':p.get('id'),'link':p.get('link'),
                    'content':(p.get('content') or {}).get('rendered')
                  },ensure_ascii=False)[:18000])
          except Exception as e:
              print('TUULA_CONTACT_API_ERROR',type(e).__name__,str(e))
          PY

      - name: Resolve exact Tuula venue coordinates
        shell: bash
        run: |
          set -euo pipefail
          UA='WhereHorsesRun/1.0 (+https://github.com/badjoke-lab/where-horses-run)'
          mkdir -p /tmp/estonia-exact

          echo '--- NOMINATIM EXACT ADDRESS ---'
          curl -L -sS -A "$UA" --get \
            --data-urlencode 'q=Vana-Tuula tee 2a, Tuula, 76618 Harjumaa, Estonia' \
            --data 'format=jsonv2' --data 'limit=10' \
            'https://nominatim.openstreetmap.org/search' \
            -o /tmp/estonia-exact/nominatim.json
          python3 - <<'PY'
          import json
          rows=json.load(open('/tmp/estonia-exact/nominatim.json'))
          print('TUULA_EXACT_NOMINATIM_RESULTS',len(rows))
          for r in rows:
              print('TUULA_EXACT_NOMINATIM',json.dumps({
                  'lat':r.get('lat'),'lon':r.get('lon'),'display_name':r.get('display_name'),
                  'osm_type':r.get('osm_type'),'osm_id':r.get('osm_id'),'type':r.get('type'),'class':r.get('class')
              },ensure_ascii=False))
          PY

          echo '--- PHOTON EXACT ADDRESS ---'
          curl -L -sS --get \
            --data-urlencode 'q=Vana-Tuula tee 2a Tuula Estonia' \
            --data 'limit=10' \
            'https://photon.komoot.io/api/' \
            -o /tmp/estonia-exact/photon.json
          python3 - <<'PY'
          import json
          obj=json.load(open('/tmp/estonia-exact/photon.json'))
          fs=obj.get('features') or []
          print('TUULA_EXACT_PHOTON_RESULTS',len(fs))
          for f in fs:
              p=f.get('properties') or {}
              print('TUULA_EXACT_PHOTON',json.dumps({
                  'coordinates':(f.get('geometry') or {}).get('coordinates'),
                  'name':p.get('name'),'street':p.get('street'),'housenumber':p.get('housenumber'),
                  'city':p.get('city'),'district':p.get('district'),'county':p.get('county'),
                  'postcode':p.get('postcode'),'country':p.get('country'),
                  'osm_type':p.get('osm_type'),'osm_id':p.get('osm_id'),'type':p.get('type')
              },ensure_ascii=False))
          PY

          echo '--- OVERPASS HORSE RACING AROUND TUULA ---'
          query='[out:json][timeout:25];(
            nwr["sport"="horse_racing"](59.20,24.35,59.33,24.58);
            nwr["name"~"Hipodroom|hipodroom|Tallinna Hipodroom|Tuula",i](59.20,24.35,59.33,24.58);
            nwr["leisure"="track"](59.20,24.35,59.33,24.58);
          );out center tags;'
          curl -L -sS --get --data-urlencode "data=$query" \
            'https://overpass-api.de/api/interpreter' \
            -o /tmp/estonia-exact/overpass.json || true
          python3 - <<'PY'
          import json
          try:
              obj=json.load(open('/tmp/estonia-exact/overpass.json'))
          except Exception as e:
              print('TUULA_OVERPASS_ERROR',type(e).__name__,str(e)); raise SystemExit(0)
          rows=obj.get('elements') or []
          print('TUULA_OVERPASS_OBJECTS',len(rows))
          for r in rows:
              tags=r.get('tags') or {}
              if any(k in tags for k in ['name','sport','leisure','addr:street','addr:housenumber']):
                  print('TUULA_OVERPASS',json.dumps({
                    'type':r.get('type'),'id':r.get('id'),
                    'lat':r.get('lat') or (r.get('center') or {}).get('lat'),
                    'lon':r.get('lon') or (r.get('center') or {}).get('lon'),
                    'tags':tags
                  },ensure_ascii=False))
          PY

          echo '--- OFFICIAL GOOGLE EMBED RESPONSE ---'
          curl -L -sS -A 'Mozilla/5.0' \
            'https://maps.google.com/maps?q=Tallinna%20Hipodroom%20MT%C3%9C%20%28Tuulas%29&t=m&z=14&output=embed&iwloc=near' \
            -o /tmp/estonia-exact/google-embed.html || true
          python3 - <<'PY'
          import re
          raw=open('/tmp/estonia-exact/google-embed.html',errors='replace').read()
          print('TUULA_GOOGLE_BYTES',len(raw))
          pats=[
            r'center=([-0-9.]+)%2C([-0-9.]+)',
            r'@([-0-9.]+),([-0-9.]+)',
            r'([-]?[0-9]{1,2}\.[0-9]{5,})[, ]+([0-9]{1,3}\.[0-9]{5,})'
          ]
          seen=set()
          for pat in pats:
              for m in re.finditer(pat,raw,re.I):
                  pair=(m.group(1),m.group(2))
                  if pair not in seen:
                      seen.add(pair); print('TUULA_GOOGLE_COORD',pair[0],pair[1])
          for needle in ['Tallinna Hipodroom','Vana-Tuula','Tuula']:
              i=raw.lower().find(needle.lower())
              if i>=0: print('TUULA_GOOGLE_MATCH',needle,raw[max(0,i-500):i+1800].replace('\n',' ')[:2400])
          PY
