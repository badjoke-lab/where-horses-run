name: Calendar Banei current-window acquisition

on:
  pull_request:
    paths:
      - 'data/static/calendar-banei-current-window-policy-v1.json'
      - 'data/audits/calendar-banei-current-window-acquisition-result-v1.json'
      - 'data/generated/timetable/canonical/meetings.json'
      - 'data/static/calendar-acquisition-registry.json'
      - 'data/static/calendar-runner-compatibility-contract-v1.json'
      - 'scripts/check-calendar-banei-current-window-acquisition.mjs'
      - '.github/workflows/calendar-banei-current-window-acquisition.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calendar-banei-current-window-acquisition-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-completed-campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Validate immutable acquisition evidence and current state
        run: |
          node --check scripts/check-calendar-banei-current-window-acquisition.mjs
          node scripts/check-calendar-banei-current-window-acquisition.mjs
          node scripts/check-calendar-acquisition-registry.mjs
          node scripts/check-calendar-runner-compatibility.mjs
      - name: Confirm one-time campaign is retired
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const audit = JSON.parse(fs.readFileSync('data/audits/calendar-banei-current-window-acquisition-result-v1.json', 'utf8'));
          const canonical = JSON.parse(fs.readFileSync('data/generated/timetable/canonical/meetings.json', 'utf8'));
          const current = canonical.meetings.filter((meeting) => meeting.authority_id === 'banei-tokachi' && meeting.date >= '2026-07-13' && meeting.date < '2026-08-12');
          if (audit.result?.records_discovered !== 13) throw new Error('Banei acquisition evidence is incomplete');
          if (current.length !== 13) throw new Error(`Banei applied current-window count differs: ${current.length}`);
          console.log('BANEI_ONE_TIME_ACQUISITION: completed_and_retired');
          NODE
      - name: Confirm no acquisition or deployment side effect
        run: |
          if grep -E 'run-banei-actions-job|wrangler pages deploy|npm run deploy|contents: write' .github/workflows/calendar-banei-current-window-acquisition.yml; then
            echo 'retired acquisition workflow contains an execution or deployment path'
            exit 1
          fi
          echo 'BANEI_ACQUISITION_SIDE_EFFECTS: disabled'
