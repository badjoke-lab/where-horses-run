name: v1 accessibility QA gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'data/static/v1-accessibility-qa-v1.json'
      - 'data/audits/v1-accessibility-qa-v1.json'
      - 'docs/release/v1-accessibility-qa.md'
      - 'scripts/run-v1-accessibility-qa-browser.mjs'
      - 'scripts/check-v1-accessibility-qa.mjs'
      - '.github/workflows/v1-accessibility-qa.yml'
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'data/static/v1-accessibility-qa-v1.json'
      - 'data/audits/v1-accessibility-qa-v1.json'
      - 'docs/release/v1-accessibility-qa.md'
      - 'scripts/run-v1-accessibility-qa-browser.mjs'
      - 'scripts/check-v1-accessibility-qa.mjs'
      - '.github/workflows/v1-accessibility-qa.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install dependencies without generating a lockfile
        run: npm install --package-lock=false
      - name: Validate QA script syntax
        run: |
          node --check scripts/run-v1-accessibility-qa-browser.mjs
          node --check scripts/check-v1-accessibility-qa.mjs
      - name: Build complete static site
        run: npm run build
      - name: Preserve Phase 10 UX release
        run: node scripts/check-ux-polish-release.mjs
      - name: Preserve Phase 11 SEO release
        run: node scripts/check-seo-qa-release.mjs
      - name: Preserve v1 scope freeze
        run: node scripts/check-v1-scope-freeze.mjs
      - name: Preserve v1 data audit
        run: node scripts/check-v1-data-audit.mjs
      - name: Render and audit every public page
        shell: bash
        run: |
          set +e
          node scripts/run-v1-accessibility-qa-browser.mjs > v1-accessibility-qa-browser.log 2>&1
          status=$?
          printf '%s\n' "$status" > v1-accessibility-qa-browser.exit
          cat v1-accessibility-qa-browser.log
          if [ -f v1-accessibility-qa-discovery.json ]; then
            mv v1-accessibility-qa-discovery.json v1-accessibility-qa-report.json
          fi
          exit 0
      - name: Upload accessibility diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-accessibility-qa-report
          path: |
            v1-accessibility-qa-browser.log
            v1-accessibility-qa-browser.exit
            v1-accessibility-qa-report.json
          if-no-files-found: warn
          retention-days: 7
      - name: Enforce browser runner success
        run: |
          status="$(cat v1-accessibility-qa-browser.exit)"
          if [ "$status" != "0" ]; then
            exit "$status"
          fi
      - name: Normalize permanent report name
        run: test -f v1-accessibility-qa-report.json
      - name: Validate v1 accessibility contract and report
        run: node scripts/check-v1-accessibility-qa.mjs
      - name: Remove generated diagnostics
        if: always()
        run: rm -f v1-accessibility-qa-report.json v1-accessibility-qa-discovery.json v1-accessibility-qa-browser.log v1-accessibility-qa-browser.exit
      - name: Prove repository clean
        run: |
          changes="$(git status --porcelain --untracked-files=all)"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            exit 1
          fi
