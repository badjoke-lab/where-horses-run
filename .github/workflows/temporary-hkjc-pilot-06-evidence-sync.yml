name: Temporary HKJC PILOT-06 evidence sync

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - work/calendar-hkjc-detail-runner-reconciliation

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/calendar-hkjc-detail-runner-reconciliation
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Apply PILOT-06 evidence sync
        run: node scripts/temporary-sync-hkjc-pilot-06-evidence.mjs
      - name: Validate synchronized state
        run: |
          node scripts/check-calendar-hkjc-pilot-06-reviewed-import-evidence.mjs
          node scripts/check-project-governance-docs.mjs
      - name: Commit synchronized state when needed
        run: |
          if git diff --quiet; then
            echo "No synchronization changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/project-roadmap.md \
            docs/calendar/implementation-roadmap.md \
            docs/calendar/README.md
          git commit -m "[CF-Pages-Skip] Sync HKJC PILOT-06 reviewed-import evidence"
          git push origin HEAD:work/calendar-hkjc-detail-runner-reconciliation
