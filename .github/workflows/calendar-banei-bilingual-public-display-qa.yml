name: Calendar Banei bilingual public-display QA

on:
  pull_request:
    paths:
      - 'data/static/calendar-readiness-banei-detail-v1.json'
      - 'scripts/timetable/load-calendar-readiness.mjs'
      - 'scripts/check-calendar-banei-bilingual-public-display-qa.mjs'
      - 'scripts/check-calendar-banei-bilingual-rendered-fixture.mjs'
      - 'src/components/TimetableMeetingList.astro'
      # Use directory globs for Astro dynamic routes; literal bracketed route names make GitHub reject the workflow definition.
      - 'src/pages/timetable/meetings/**'
      - 'src/pages/ja/timetable/meetings/**'
      - 'src/data/publicationDisplayPolicies.json'
      - 'docs/calendar/banei-bilingual-public-display-qa.md'
      - '.github/workflows/calendar-banei-bilingual-public-display-qa.yml'
  push:
    branches:
      - main
    paths:
      - 'data/static/calendar-readiness-banei-detail-v1.json'
      - 'scripts/timetable/load-calendar-readiness.mjs'
      - 'scripts/check-calendar-banei-bilingual-public-display-qa.mjs'
      - 'scripts/check-calendar-banei-bilingual-rendered-fixture.mjs'
      - 'src/components/TimetableMeetingList.astro'
      # Keep push coverage aligned with pull_request coverage.
      - 'src/pages/timetable/meetings/**'
      - 'src/pages/ja/timetable/meetings/**'
      - 'src/data/publicationDisplayPolicies.json'
      - 'docs/calendar/banei-bilingual-public-display-qa.md'
      - '.github/workflows/calendar-banei-bilingual-public-display-qa.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Check Node syntax
        run: |
          node --check scripts/check-calendar-banei-bilingual-public-display-qa.mjs
          node --check scripts/check-calendar-banei-bilingual-rendered-fixture.mjs
      - name: Validate Banei pure projection and bilingual route contract
        run: node scripts/check-calendar-banei-bilingual-public-display-qa.mjs
      - name: Install dependencies without lockfile mutation
        run: npm install --package-lock=false
      - name: Build static site for rendered QA
        run: npm run build
      - name: Validate rendered Banei bilingual fixture in temporary worktree
        run: node scripts/check-calendar-banei-bilingual-rendered-fixture.mjs
      - name: Validate existing public projection and runtime boundaries
        run: |
          node scripts/check-calendar-pipeline-v1-public-projection.mjs
          node scripts/check-calendar-runtime-import-boundary.mjs
          node scripts/check-calendar-public-projection-rendered-qa.mjs
      - name: Validate Calendar contracts and governance
        run: |
          node scripts/check-calendar-contracts.mjs
          node scripts/check-project-governance-docs.mjs
      - name: Preserve committed Banei public records for Banei-publication PRs
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Shared UI/checker changes can coexist with reviewed publication changes for
          # other authorities. Freeze only Banei/Obihiro public records rather than
          # rejecting unrelated changes to the shared public projection files.
          banei_publication_changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- \
            data/static/calendar-readiness-banei-detail-v1.json \
            scripts/timetable/load-calendar-readiness.mjs \
            scripts/check-calendar-banei-bilingual-public-display-qa.mjs \
            scripts/check-calendar-banei-bilingual-rendered-fixture.mjs \
            docs/calendar/banei-bilingual-public-display-qa.md)"
          banei_policy_changed="$(git diff -U0 "$BASE_SHA" "$HEAD_SHA" -- src/data/publicationDisplayPolicies.json | grep -E '^[+-].*(banei|obihiro)' || true)"
          if [ -z "${banei_publication_changed}${banei_policy_changed}" ]; then
            echo 'BANEI_PUBLICATION_SCOPE_CHANGED: false'
            echo 'COMMITTED_BANEI_PUBLIC_RECORD_FREEZE_APPLICABLE: false'
            exit 0
          fi
          node - <<'NODE'
          const { execFileSync } = require('node:child_process');
          const baseSha = process.env.BASE_SHA;
          const headSha = process.env.HEAD_SHA;
          const files = [
            ['data/generated/timetable/public/meeting-list.json', ['meetings']],
            ['data/generated/timetable/public/meeting-details.json', ['details']],
            ['data/generated/timetable/public/japan-a-plus-overrides.json', ['meeting_overrides', 'detail_overrides']],
          ];
          const loadAt = (sha, file) => JSON.parse(execFileSync('git', ['show', `${sha}:${file}`], { encoding: 'utf8' }));
          const isBanei = (record) =>
            record?.authority_id === 'banei-tokachi' ||
            record?.racecourse_id === 'obihiro-racecourse' ||
            String(record?.meeting_id ?? '').includes('obihiro-racecourse');
          const select = (dataset, keys) => Object.fromEntries(
            keys.map((key) => [key, (dataset[key] ?? []).filter(isBanei)]),
          );
          for (const [file, keys] of files) {
            const before = select(loadAt(baseSha, file), keys);
            const after = select(loadAt(headSha, file), keys);
            if (JSON.stringify(before) !== JSON.stringify(after)) {
              console.error(`Banei public records changed in ${file}`);
              console.error(`base=${JSON.stringify(before)}`);
              console.error(`head=${JSON.stringify(after)}`);
              process.exit(1);
            }
          }
          console.log('BANEI_PUBLICATION_SCOPE_CHANGED: true');
          console.log('COMMITTED_BANEI_PUBLIC_RECORDS_CHANGED: false');
          NODE
      - name: Check workflow and QA safety boundary
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const workflow = fs.readFileSync('.github/workflows/calendar-banei-bilingual-public-display-qa.yml', 'utf8');
          if (!workflow.includes('permissions:\n  contents: read')) throw new Error('read-only workflow permission missing');
          if (/contents:\s*write/.test(workflow) || /pull-requests:\s*write/.test(workflow)) throw new Error('write permission enabled');
          if (/\bschedule\s*:|\bcron\s*:/.test(workflow)) throw new Error('scheduled trigger enabled');
          console.log('WORKFLOW_CONTENTS_PERMISSION: read');
          console.log('SCHEDULED_EXECUTION: false');
          console.log('PUBLIC_FIXTURE_BUILD_LOCATION: temporary worktree');
          NODE
      - name: Check diff formatting
        run: git diff --check
