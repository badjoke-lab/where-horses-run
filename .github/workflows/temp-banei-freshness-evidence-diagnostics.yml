name: Temporary Banei freshness evidence diagnostics

on:
  pull_request:
    paths:
      - 'scripts/update-banei-freshness-evidence-checker-marker.mjs'
      - '.github/workflows/temp-banei-freshness-evidence-diagnostics.yml'

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Fix checker marker
        run: node scripts/update-banei-freshness-evidence-checker-marker.mjs
      - name: Run checker and capture diagnostics
        run: |
          mkdir -p .diagnostics
          set +e
          node scripts/check-calendar-banei-freshness-rollback-operating-evidence.mjs > .diagnostics/banei-freshness-evidence.log 2>&1
          status=$?
          echo "EXIT_STATUS=${status}" >> .diagnostics/banei-freshness-evidence.log
          exit 0
      - name: Commit checker and diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/check-calendar-banei-freshness-rollback-operating-evidence.mjs \
            .diagnostics/banei-freshness-evidence.log
          git commit -m "[CF-Pages-Skip] Fix Banei freshness evidence checker marker"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
