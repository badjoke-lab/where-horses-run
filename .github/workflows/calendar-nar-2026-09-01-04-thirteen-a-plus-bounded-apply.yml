name: Calendar NAR September 1-4 thirteen A+ bounded apply

on:
  pull_request:
    paths:
      - '.github/workflows/calendar-nar-2026-09-01-04-thirteen-a-plus-bounded-apply.yml'
      - 'scripts/timetable/build-calendar-nar-2026-09-01-04-thirteen-a-plus-approved-candidates.mjs'

permissions:
  contents: write

concurrency:
  group: calendar-nar-september-1-4-thirteen-a-plus-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact review head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Checkout exact daily-review source evidence
        uses: actions/checkout@v4
        with:
          ref: dd020851bfdda70bfa9806058406b41c79e81c9f
          path: review-source
          sparse-checkout: |
            data/candidates/nar-incremental-batches/due-job-plan-2026-08-31-due-japan-nar-regular-refresh-001-run-001/batch.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Build reviewed A+ deltas from all thirteen complete-detail records
        env:
          WHR_NAR_REVIEW_BATCH: ${{ github.workspace }}/review-source/data/candidates/nar-incremental-batches/due-job-plan-2026-08-31-due-japan-nar-regular-refresh-001-run-001/batch.json
        run: node scripts/timetable/build-calendar-nar-2026-09-01-04-thirteen-a-plus-approved-candidates.mjs

      - name: Validate and apply reviewed promotion
        run: |
          node scripts/timetable/promote-timetable.mjs --input data/candidates/nar-regular-refresh-2026-09-01-through-2026-09-04-a-plus-approved.json --dry-run
          node scripts/timetable/promote-timetable.mjs --input data/candidates/nar-regular-refresh-2026-09-01-through-2026-09-04-a-plus-approved.json

      - name: Rebuild deterministic public and operations projections
        run: |
          node scripts/timetable/build-public-timetable-view.mjs
          node scripts/timetable/build-japan-a-plus-public-overrides.mjs
          node scripts/timetable/build-operations-status.mjs --reference-date 2026-07-01
          node scripts/timetable/build-operations-review-package.mjs

      - name: Validate applied repository state
        run: |
          node scripts/validate-data.mjs
          node scripts/check-japan-a-plus-public-overrides.mjs
          node scripts/check-calendar-operations-status.mjs
          node scripts/check-calendar-operations-review-package.mjs

      - name: Verify bounded A+ publication boundary
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const baseSha = process.env.BASE_SHA;
          const readBase = (file) => JSON.parse(execFileSync('git', ['show', `${baseSha}:${file}`], { encoding: 'utf8' }));
          const projectPublicSafeRows = (rows) => (rows ?? []).map((row) => ({
            label: row.label,
            post_time_local: row.post_time_local,
            race_name: row.race_name,
            distance_m: row.distance_m,
            surface: row.surface,
            course_label: row.course_label,
          }));
          const allReviewedIds = [
            'nar-kanazawa-racecourse-2026-09-01',
            'nar-monbetsu-racecourse-2026-09-01',
            'nar-monbetsu-racecourse-2026-09-02',
            'nar-morioka-racecourse-2026-09-01',
            'nar-nagoya-racecourse-2026-09-01',
            'nar-nagoya-racecourse-2026-09-02',
            'nar-nagoya-racecourse-2026-09-03',
            'nar-oi-racecourse-2026-09-01',
            'nar-oi-racecourse-2026-09-02',
            'nar-oi-racecourse-2026-09-03',
            'nar-sonoda-racecourse-2026-09-02',
            'nar-sonoda-racecourse-2026-09-03',
            'nar-sonoda-racecourse-2026-09-04',
          ].sort();
          const candidate = JSON.parse(fs.readFileSync('data/candidates/nar-regular-refresh-2026-09-01-through-2026-09-04-a-plus-approved.json', 'utf8'));
          if (candidate.review?.status !== 'approved' || candidate.review?.promotion_target !== 'canonical-timetable-v0') throw new Error('review contract differs');
          if (!Array.isArray(candidate.records) || candidate.records.length < 1 || candidate.records.length > 13) throw new Error(`approved delta count differs: ${candidate.records?.length}`);
          const candidateIds = candidate.records.map((row) => row.meeting_id).sort();
          if (!candidateIds.every((id) => allReviewedIds.includes(id))) throw new Error(`approved identity set escaped reviewed thirteen: ${JSON.stringify(candidateIds)}`);
          const canonical = JSON.parse(fs.readFileSync('data/generated/timetable/canonical/meetings.json', 'utf8'));
          const details = JSON.parse(fs.readFileSync('data/generated/timetable/canonical/meeting-details.json', 'utf8'));
          const publicList = JSON.parse(fs.readFileSync('data/generated/timetable/public/meeting-list.json', 'utf8'));
          const publicDetails = JSON.parse(fs.readFileSync('data/generated/timetable/public/meeting-details.json', 'utf8'));
          const baseCanonical = readBase('data/generated/timetable/canonical/meetings.json');
          const baseDetails = readBase('data/generated/timetable/canonical/meeting-details.json');
          const basePublicList = readBase('data/generated/timetable/public/meeting-list.json');
          const basePublicDetails = readBase('data/generated/timetable/public/meeting-details.json');
          const baseStatus = readBase('data/generated/timetable/operations-status.json');
          for (const id of candidateIds) {
            const baseMeeting = baseCanonical.meetings.find((row) => row.meeting_id === id);
            const baseDetail = baseDetails.details.find((row) => row.meeting_id === id);
            if (baseMeeting?.capability_rank !== 'C' || baseMeeting.first_race_time_local !== null || baseMeeting.last_race_time_local !== null || baseDetail) {
              throw new Error(`${id} PR base is not exact C/no-detail prestate`);
            }
            const record = candidate.records.find((row) => row.meeting_id === id);
            if (record?.capability_rank !== 'A+' || !Array.isArray(record.timetable_rows) || record.timetable_rows.length === 0) throw new Error(`${id} reviewed record differs`);
            const serialized = JSON.stringify(record).toLowerCase();
            for (const field of ['horse_name','jockey','trainer','odds','payout','result','prediction','raw_html','stream_url']) {
              if (serialized.includes(field)) throw new Error(`${id} contains forbidden field ${field}`);
            }
            const meeting = canonical.meetings.find((row) => row.meeting_id === id);
            const detail = details.details.find((row) => row.meeting_id === id);
            const publicMeeting = publicList.meetings.find((row) => row.meeting_id === id);
            const publicDetail = publicDetails.details.find((row) => row.meeting_id === id);
            if (meeting?.capability_rank !== 'A+' || meeting.first_race_time_local !== record.first_race_time_local || meeting.last_race_time_local !== record.last_race_time_local) throw new Error(`${id} canonical meeting differs`);
            if (detail?.capability_rank !== 'A+' || JSON.stringify(projectPublicSafeRows(detail.timetable_rows)) !== JSON.stringify(record.timetable_rows)) throw new Error(`${id} canonical detail differs`);
            if ((publicMeeting?.effective_public_rank ?? publicMeeting?.capability_rank) !== 'A+') throw new Error(`${id} public meeting rank differs`);
            if ((publicDetail?.effective_public_rank ?? publicDetail?.capability_rank) !== 'A+' || JSON.stringify(projectPublicSafeRows(publicDetail.timetable_rows)) !== JSON.stringify(record.timetable_rows)) throw new Error(`${id} public detail differs`);
          }
          const delta = candidate.records.length;
          if (canonical.meetings.length !== baseCanonical.meetings.length) throw new Error('canonical meeting count changed for C-to-A+ upgrades');
          if (details.details.length !== baseDetails.details.length + delta) throw new Error(`canonical detail delta differs: base=${baseDetails.details.length} head=${details.details.length} delta=${delta}`);
          if (publicList.meetings.length !== basePublicList.meetings.length) throw new Error('public meeting count changed for existing meetings');
          if (publicDetails.details.length !== basePublicDetails.details.length + delta) throw new Error(`public detail delta differs: base=${basePublicDetails.details.length} head=${publicDetails.details.length} delta=${delta}`);
          const status = JSON.parse(fs.readFileSync('data/generated/timetable/operations-status.json', 'utf8'));
          if (status.public_projection?.meeting_count !== baseStatus.public_projection?.meeting_count) throw new Error('operations public meeting count changed');
          if (status.public_projection?.detail_count !== baseStatus.public_projection?.detail_count + delta) throw new Error('operations public detail delta differs');
          if (status.public_projection?.latest_meeting_date !== baseStatus.public_projection?.latest_meeting_date) throw new Error('public horizon changed unexpectedly');
          console.log(JSON.stringify({ reviewed_complete_detail_count: 13, promoted_delta_count: delta, promoted_ids: candidateIds }));
          NODE

      - name: Remove one-shot workflow and commit bounded output
        run: |
          git rm .github/workflows/calendar-nar-2026-09-01-04-thirteen-a-plus-bounded-apply.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            data/candidates/nar-regular-refresh-2026-09-01-through-2026-09-04-a-plus-approved.json \
            data/generated/timetable/canonical/meetings.json \
            data/generated/timetable/canonical/meeting-details.json \
            data/generated/timetable/public/meeting-list.json \
            data/generated/timetable/public/meeting-details.json \
            data/generated/timetable/public/japan-a-plus-overrides.json \
            data/generated/timetable/operations-status.json \
            data/generated/timetable/operations-review-package.json
          git diff --cached --check
          git commit -m 'Apply reviewed NAR September 1-4 A+ promotion'
          git push origin HEAD:${{ github.head_ref }}
