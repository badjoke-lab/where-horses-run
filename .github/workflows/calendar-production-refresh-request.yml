name: Calendar production refresh request

on:
  push:
    branches:
      - main
    paths:
      - 'data/operations/calendar-refresh-plans/calendar-production-banei-retry-2026-09-01-002.json'
      - '.github/workflows/calendar-production-refresh-request.yml'

permissions:
  contents: read

concurrency:
  group: calendar-production-banei-retry-2026-09-01-002
  cancel-in-progress: false

env:
  PLAN_FILE: data/operations/calendar-refresh-plans/calendar-production-banei-retry-2026-09-01-002.json

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - id: plan
        name: Compile production hosted Job matrix
        shell: bash
        run: |
          node scripts/timetable/plan-actions-multi-job.mjs \
            --plan-file="$PLAN_FILE" \
            --output=.calendar-production-actions-plan.json \
            --matrix-output=.calendar-production-actions-matrix.json
          node --input-type=module -e "import fs from 'node:fs'; const plan=JSON.parse(fs.readFileSync('.calendar-production-actions-plan.json','utf8')); if (plan.excluded.length) { console.error(JSON.stringify(plan.excluded)); process.exit(1); } if (plan.jobs.length !== 1) { console.error('Banei retry must plan exactly one hosted job'); process.exit(1); }"
          echo "matrix=$(cat .calendar-production-actions-matrix.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: calendar-production-actions-plan-banei-retry-2026-09-01-002
          path: .calendar-production-actions-plan.json
          retention-days: 14

  execute:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Write immutable Job and execution specifications
        env:
          COLLECTION_JOB_JSON: ${{ toJson(matrix.collection_job) }}
          EXECUTION_JSON: ${{ toJson(matrix.execution) }}
        shell: bash
        run: |
          printf '%s\n' "$COLLECTION_JOB_JSON" > .calendar-collection-job.json
          printf '%s\n' "$EXECUTION_JSON" > .calendar-execution.json
      - name: Run production acquisition Job
        run: |
          node scripts/timetable/run-calendar-actions-job.mjs \
            --job=.calendar-collection-job.json \
            --execution=.calendar-execution.json
      - name: Upload Job artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calendar-production-job-${{ matrix.job_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            data/generated/timetable/actions-multi-job-status/${{ matrix.batch_id }}.json
            data/generated/timetable/actions-multi-job/${{ matrix.batch_id }}/

  collect:
    if: always()
    needs:
      - prepare
      - execute
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: calendar-production-job-*
          merge-multiple: true
          path: .calendar-production-artifacts
      - name: Collect acquisition statuses
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root = '.calendar-production-artifacts';
          const statuses = [];
          function walk(dir) {
            if (!fs.existsSync(dir)) return;
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.name.endsWith('.json')) {
                try {
                  const value = JSON.parse(fs.readFileSync(full, 'utf8'));
                  if (value?.schema_version === 'calendar-actions-job-status-v1') statuses.push(value);
                } catch {}
              }
            }
          }
          walk(root);
          statuses.sort((a, b) => a.job_id.localeCompare(b.job_id));
          const summary = {
            schema_version: 'calendar-production-refresh-summary-v1',
            plan_id: 'calendar-production-banei-retry-2026-09-01-002',
            statuses,
            counts: Object.fromEntries(['success', 'partial', 'source_error'].map((status) => [status, statuses.filter((item) => item.status === status).length])),
          };
          fs.writeFileSync('calendar-production-refresh-summary.json', `${JSON.stringify(summary, null, 2)}\n`);
          console.log(JSON.stringify(summary));
          if (statuses.length !== 1) process.exit(1);
          if (statuses.some((item) => item.status === 'source_error')) process.exit(1);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calendar-production-refresh-summary-banei-retry-2026-09-01-002
          path: calendar-production-refresh-summary.json
          retention-days: 14
