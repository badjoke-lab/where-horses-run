name: Calendar JRA August 29-30 reviewed import review

on:
  pull_request:
    paths:
      - '.github/workflows/calendar-jra-2026-08-29-30-reviewed-import-review.yml'
      - 'scripts/timetable/build-calendar-jra-2026-08-29-30-reviewed-import-approved.mjs'
      - 'data/candidates/jra-2026-08-29-30-reviewed-import-a-plus-approved.json'
      - 'data/generated/timetable/canonical/**'
      - 'data/generated/timetable/public/**'
      - 'data/generated/timetable/operations-status.json'
      - 'data/generated/timetable/operations-review-package.json'
      - 'data/static/calendar-acquisition-registry.json'
      - 'data/static/calendar-runner-compatibility-contract-v1.json'
      - 'data/static/authority-source-inventory.json'
      - 'data/static/calendar-readiness-registry.json'
      - 'data/static/calendar-readiness-amendments-v1.json'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/calendar-jra-2026-08-29-30-reviewed-import-review.yml'
      - 'scripts/timetable/build-calendar-jra-2026-08-29-30-reviewed-import-approved.mjs'
      - 'data/candidates/jra-2026-08-29-30-reviewed-import-a-plus-approved.json'
      - 'data/generated/timetable/canonical/**'
      - 'data/generated/timetable/public/**'
      - 'data/generated/timetable/operations-status.json'
      - 'data/generated/timetable/operations-review-package.json'
      - 'data/static/calendar-acquisition-registry.json'
      - 'data/static/calendar-runner-compatibility-contract-v1.json'
      - 'data/static/authority-source-inventory.json'
      - 'data/static/calendar-readiness-registry.json'
      - 'data/static/calendar-readiness-amendments-v1.json'

permissions:
  contents: read

concurrency:
  group: calendar-jra-2026-08-29-30-reviewed-import-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Rebuild exact reviewed-import Candidate
        run: node scripts/timetable/build-calendar-jra-2026-08-29-30-reviewed-import-approved.mjs

      - name: Verify Candidate determinism
        run: git diff --exit-code -- data/candidates/jra-2026-08-29-30-reviewed-import-a-plus-approved.json

      - name: Verify canonical promotion determinism
        run: node scripts/timetable/promote-timetable.mjs --input data/candidates/jra-2026-08-29-30-reviewed-import-a-plus-approved.json --check

      - name: Rebuild deterministic public and operations projections
        run: |
          node scripts/timetable/build-public-timetable-view.mjs
          node scripts/timetable/build-japan-a-plus-public-overrides.mjs
          node scripts/timetable/build-operations-status.mjs --reference-date 2026-07-01
          node scripts/timetable/build-operations-review-package.mjs

      - name: Validate generated repository data
        run: |
          node scripts/validate-data.mjs
          node scripts/check-japan-a-plus-public-overrides.mjs
          node scripts/check-calendar-operations-status.mjs
          node scripts/check-calendar-operations-review-package.mjs

      - name: Verify reviewed-import historical invariant
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const candidate = JSON.parse(fs.readFileSync('data/candidates/jra-2026-08-29-30-reviewed-import-a-plus-approved.json','utf8'));
          const canonical = JSON.parse(fs.readFileSync('data/generated/timetable/canonical/meetings.json','utf8'));
          const details = JSON.parse(fs.readFileSync('data/generated/timetable/canonical/meeting-details.json','utf8'));
          const publicList = JSON.parse(fs.readFileSync('data/generated/timetable/public/meeting-list.json','utf8'));
          const publicDetails = JSON.parse(fs.readFileSync('data/generated/timetable/public/meeting-details.json','utf8'));
          const status = JSON.parse(fs.readFileSync('data/generated/timetable/operations-status.json','utf8'));
          const expected = [
            'jra-chukyo-racecourse-2026-08-29','jra-niigata-racecourse-2026-08-29','jra-sapporo-racecourse-2026-08-29',
            'jra-chukyo-racecourse-2026-08-30','jra-niigata-racecourse-2026-08-30','jra-sapporo-racecourse-2026-08-30'
          ].sort();
          const ids = candidate.records.map((row)=>row.meeting_id).sort();
          if (JSON.stringify(ids)!==JSON.stringify(expected)) throw new Error('reviewed identity set differs');
          if (candidate.records.length!==6 || candidate.records.reduce((sum,row)=>sum+row.timetable_rows.length,0)!==72) throw new Error('reviewed count differs');
          if (candidate.review?.status!=='approved' || candidate.review?.promotion_target!=='canonical-timetable-v0') throw new Error('review envelope differs');
          for (const record of candidate.records) {
            if (record.capability_rank!=='A+' || record.timetable_rows.length!==12) throw new Error(`${record.meeting_id} candidate differs`);
            if (record.source?.extraction_method!=='manual_import' || new URL(record.source.official_url).hostname!=='www.jra.go.jp') throw new Error(`${record.meeting_id} reviewed-import source differs`);
            const meeting = canonical.meetings.find((row)=>row.meeting_id===record.meeting_id);
            const detail = details.details.find((row)=>row.meeting_id===record.meeting_id);
            const pub = publicList.meetings.find((row)=>row.meeting_id===record.meeting_id);
            const pubDetail = publicDetails.details.find((row)=>row.meeting_id===record.meeting_id);
            if (meeting?.capability_rank!=='A+' || detail?.capability_rank!=='A+' || detail?.timetable_rows?.length!==12) throw new Error(`${record.meeting_id} canonical invariant differs`);
            if ((pub?.effective_public_rank ?? pub?.capability_rank)!=='A+' || (pubDetail?.effective_public_rank ?? pubDetail?.capability_rank)!=='A+' || pubDetail?.timetable_rows?.length!==12) throw new Error(`${record.meeting_id} public invariant differs`);
            if (meeting.first_race_time_local!==record.first_race_time_local || meeting.last_race_time_local!==record.last_race_time_local) throw new Error(`${record.meeting_id} time invariant differs`);
            const serialized = JSON.stringify(record).toLowerCase();
            for (const field of ['horse_name','jockey','trainer','odds','popularity','payout','result','prediction','raw_html','stream_url']) {
              if (serialized.includes(field)) throw new Error(`${record.meeting_id} contains forbidden field ${field}`);
            }
          }
          if (canonical.meetings.length < 437) throw new Error(`canonical meeting count regressed: ${canonical.meetings.length}`);
          if (details.details.length < 101) throw new Error(`canonical detail count regressed: ${details.details.length}`);
          if ((status.public_projection?.meeting_count ?? 0) < 424) throw new Error(`public meeting count regressed: ${status.public_projection?.meeting_count}`);
          if ((status.public_projection?.detail_count ?? 0) < 101) throw new Error(`public detail count regressed: ${status.public_projection?.detail_count}`);
          if ((status.public_projection?.latest_meeting_date ?? '') < '2026-09-21') throw new Error(`public horizon regressed: ${status.public_projection?.latest_meeting_date}`);
          NODE

      - name: Verify deterministic current outputs
        run: |
          node scripts/timetable/build-public-timetable-view.mjs --check
          git diff --exit-code -- \
            data/candidates/jra-2026-08-29-30-reviewed-import-a-plus-approved.json \
            data/generated/timetable/canonical/meetings.json \
            data/generated/timetable/canonical/meeting-details.json \
            data/generated/timetable/public/meeting-list.json \
            data/generated/timetable/public/meeting-details.json \
            data/generated/timetable/public/japan-a-plus-overrides.json \
            data/generated/timetable/operations-status.json \
            data/generated/timetable/operations-review-package.json

      - name: Check formatting
        run: git diff --check
