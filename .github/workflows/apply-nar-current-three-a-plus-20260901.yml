name: Apply exact three current NAR A+ candidates

on:
  push:
    branches:
      - apply/nar-current-three-a-plus-20260901
    paths:
      - '.github/workflows/apply-nar-current-three-a-plus-20260901.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: apply-nar-current-three-a-plus-20260901
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: apply/nar-current-three-a-plus-20260901
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Download exact successful acquisition artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api /repos/badjoke-lab/where-horses-run/actions/artifacts/9791050073/zip > /tmp/nar-source.zip
          echo '083a302a213a4287751fcf7ac056d284d00a0abe21f306b67b593d4d866cfd6c  /tmp/nar-source.zip' | sha256sum --check
          mkdir -p /tmp/nar-source
          unzip -q /tmp/nar-source.zip -d /tmp/nar-source
          test -f /tmp/nar-source/home/runner/work/where-horses-run/where-horses-run/data/candidates/nar-incremental-batches/nar-current-c-live-refresh-2026-09-01-batch-002/batch.json

      - name: Build exact approved three-record candidate
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const sourcePath='/tmp/nar-source/home/runner/work/where-horses-run/where-horses-run/data/candidates/nar-incremental-batches/nar-current-c-live-refresh-2026-09-01-batch-002/batch.json';
          const outputPath='data/candidates/nar-current-three-a-plus-approved-2026-09-01.json';
          const ids=[
            'nar-monbetsu-racecourse-2026-09-03',
            'nar-oi-racecourse-2026-09-04',
            'nar-saga-racecourse-2026-09-03',
          ].sort();
          const generic=new Set(['特別','重賞','準重賞','一般','新馬','未勝利']);
          const source=JSON.parse(fs.readFileSync(sourcePath,'utf8'));
          if(source.schema_version!=='nar-incremental-batch-v2') throw new Error('source schema differs');
          if(source.batch_id!=='nar-current-c-live-refresh-2026-09-01-batch-002') throw new Error('source batch differs');
          const detail=source.detail_candidates??[];
          const actual=detail.map(x=>x.candidate_id).sort();
          if(JSON.stringify(actual)!==JSON.stringify(ids)) throw new Error(`exact A+ identity set differs: ${JSON.stringify(actual)}`);
          const canonical=JSON.parse(fs.readFileSync('data/generated/timetable/canonical/meetings.json','utf8'));
          const canonicalDetails=JSON.parse(fs.readFileSync('data/generated/timetable/canonical/meeting-details.json','utf8'));
          const publicList=JSON.parse(fs.readFileSync('data/generated/timetable/public/meeting-list.json','utf8'));
          const publicDetails=JSON.parse(fs.readFileSync('data/generated/timetable/public/meeting-details.json','utf8'));
          const cById=new Map(canonical.meetings.map(x=>[x.meeting_id,x]));
          const cdById=new Map(canonicalDetails.details.map(x=>[x.meeting_id,x]));
          const pById=new Map(publicList.meetings.map(x=>[x.meeting_id,x]));
          const pdById=new Map(publicDetails.details.map(x=>[x.meeting_id,x]));
          const records=detail.map(candidate=>{
            if(candidate.candidate_rank!=='A+'||candidate.meeting_completeness?.all_a_plus_fields_complete!==true) throw new Error(`${candidate.candidate_id} is not A+ complete`);
            if(candidate.review?.status!=='needs_review'||candidate.review?.promotion_eligible!==false) throw new Error(`${candidate.candidate_id} acquisition review boundary differs`);
            const rows=(candidate.timetable_rows??[]).map((row,index)=>{
              if(row.race_number!==index+1||row.label!==`Race ${index+1}`) throw new Error(`${candidate.candidate_id} race sequence differs`);
              for(const field of ['post_time_local','race_name','distance_m','surface','course_label']) if(row[field]===null||row[field]==='') throw new Error(`${candidate.candidate_id} missing ${field}`);
              if(generic.has(String(row.race_name).trim())) throw new Error(`${candidate.candidate_id} generic category-only race_name: ${row.race_name}`);
              return {label:row.label,post_time_local:row.post_time_local,race_name:row.race_name,distance_m:row.distance_m,surface:row.surface,course_label:row.course_label};
            });
            if(rows.length!==candidate.meeting_completeness.expected_race_count||rows.length!==candidate.meeting_completeness.observed_race_count) throw new Error(`${candidate.candidate_id} row count differs`);
            const cm=cById.get(candidate.candidate_id), pm=pById.get(candidate.candidate_id);
            if(cm?.capability_rank!=='C'||cm.first_race_time_local!==null||cm.last_race_time_local!==null||cdById.has(candidate.candidate_id)) throw new Error(`${candidate.candidate_id} canonical prestate is not exact C/no-detail`);
            if((pm?.effective_public_rank??pm?.capability_rank)!=='C'||pdById.has(candidate.candidate_id)) throw new Error(`${candidate.candidate_id} public prestate is not exact C/no-detail`);
            return {
              candidate_id:`approved-${candidate.candidate_id}`,
              meeting_id:candidate.candidate_id,
              country_id:candidate.country_id,
              authority_id:candidate.authority_id,
              racing_system_id:candidate.racing_system_id,
              racecourse_id:candidate.racecourse_id,
              date:candidate.date,
              timezone:candidate.timezone,
              capability_rank:'A+',
              first_race_time_local:rows[0].post_time_local,
              last_race_time_local:rows.at(-1).post_time_local,
              timetable_rows:rows,
              source:{source_id:'nar-race-list-deba-table',official_url:candidate.source.official_race_list_url,checked_at:source.generated_at,extraction_method:'adapter_candidate'},
              confidence:'high',
              review_status:'approved',
              notes:'Approved from exact pinned current-C live acquisition artifact after automated public-boundary and current-prestate validation.'
            };
          }).sort((a,b)=>a.meeting_id.localeCompare(b.meeting_id));
          const output={
            schema_version:'timetable-candidate-v1',
            generated_at:source.generated_at,
            adapter_id:'nar-current-three-a-plus-reviewed-detail-promotion-v1',
            country_id:'japan',
            authority_id:'nar-local-government-racing',
            source_id:'nar-race-list-deba-table',
            candidate_window:{start_date:'2026-09-03',end_date_exclusive:'2026-09-05',timezone:'Asia/Tokyo'},
            records,
            review:{status:'approved',reviewed_at:'2026-09-01T08:18:00Z',reviewer:'badjoke-lab',summary:'Exact three current NAR C meetings with complete public-safe A+ fields, zero generic category-only race names, and exact C/no-detail prestates approved for bounded promotion.',promotion_target:'canonical-timetable-v0'}
          };
          fs.mkdirSync(path.dirname(outputPath),{recursive:true});
          fs.writeFileSync(outputPath,JSON.stringify(output,null,2)+'\n');
          console.log(JSON.stringify({records:records.map(x=>x.meeting_id),race_rows:records.reduce((n,x)=>n+x.timetable_rows.length,0)},null,2));
          NODE

      - name: Dry-run and apply canonical promotion
        run: |
          node scripts/timetable/promote-timetable.mjs --input data/candidates/nar-current-three-a-plus-approved-2026-09-01.json --dry-run
          node scripts/timetable/promote-timetable.mjs --input data/candidates/nar-current-three-a-plus-approved-2026-09-01.json

      - name: Rebuild public and operations projections
        run: |
          node scripts/timetable/build-public-timetable-view.mjs
          node scripts/timetable/build-japan-a-plus-public-overrides.mjs
          node scripts/timetable/build-operations-status.mjs --reference-date 2026-07-01
          node scripts/timetable/build-operations-review-package.mjs

      - name: Verify exact bounded publication result
        env:
          BASE_SHA: f62310b35075ea655b59221a571bd5104d76224d
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const ids=['nar-monbetsu-racecourse-2026-09-03','nar-oi-racecourse-2026-09-04','nar-saga-racecourse-2026-09-03'].sort();
          const generic=new Set(['特別','重賞','準重賞','一般','新馬','未勝利']);
          const read=x=>JSON.parse(fs.readFileSync(x,'utf8'));
          const base=x=>JSON.parse(execFileSync('git',['show',`${process.env.BASE_SHA}:${x}`],{encoding:'utf8'}));
          const candidate=read('data/candidates/nar-current-three-a-plus-approved-2026-09-01.json');
          const cm=read('data/generated/timetable/canonical/meetings.json'), cd=read('data/generated/timetable/canonical/meeting-details.json');
          const pm=read('data/generated/timetable/public/meeting-list.json'), pd=read('data/generated/timetable/public/meeting-details.json');
          const bcm=base('data/generated/timetable/canonical/meetings.json'), bcd=base('data/generated/timetable/canonical/meeting-details.json');
          const bpm=base('data/generated/timetable/public/meeting-list.json'), bpd=base('data/generated/timetable/public/meeting-details.json');
          if(cm.meetings.length!==bcm.meetings.length||pm.meetings.length!==bpm.meetings.length) throw new Error('meeting count changed');
          if(cd.details.length!==bcd.details.length+3||pd.details.length!==bpd.details.length+3) throw new Error('detail count delta is not exactly +3');
          const proj=rows=>(rows??[]).map(r=>({label:r.label,post_time_local:r.post_time_local,race_name:r.race_name,distance_m:r.distance_m,surface:r.surface,course_label:r.course_label}));
          for(const id of ids){
            const rec=candidate.records.find(x=>x.meeting_id===id);
            const m=cm.meetings.find(x=>x.meeting_id===id), d=cd.details.find(x=>x.meeting_id===id);
            const p=pm.meetings.find(x=>x.meeting_id===id), q=pd.details.find(x=>x.meeting_id===id);
            if(m?.capability_rank!=='A+'||d?.capability_rank!=='A+') throw new Error(`${id} canonical not A+`);
            if((p?.effective_public_rank??p?.capability_rank)!=='A+'||(q?.effective_public_rank??q?.capability_rank)!=='A+') throw new Error(`${id} public not A+`);
            if(JSON.stringify(proj(d.timetable_rows))!==JSON.stringify(rec.timetable_rows)||JSON.stringify(proj(q.timetable_rows))!==JSON.stringify(rec.timetable_rows)) throw new Error(`${id} rows differ from approved source`);
            if(rec.timetable_rows.some(r=>generic.has(String(r.race_name).trim()))) throw new Error(`${id} generic category-only race_name leaked`);
          }
          const changed=[];
          const before=new Map(bcm.meetings.map(x=>[x.meeting_id,x]));
          for(const m of cm.meetings){const b=before.get(m.meeting_id); if(JSON.stringify(m)!==JSON.stringify(b)) changed.push(m.meeting_id)}
          if(JSON.stringify(changed.sort())!==JSON.stringify(ids)) throw new Error(`canonical meeting mutation escaped exact three: ${JSON.stringify(changed.sort())}`);
          console.log(JSON.stringify({promoted_ids:ids,canonical_detail_delta:3,public_detail_delta:3,generic_category_only_race_names:0},null,2));
          NODE
          node scripts/validate-data.mjs
          node scripts/check-japan-a-plus-public-overrides.mjs
          node scripts/check-calendar-operations-status.mjs
          node scripts/check-calendar-operations-review-package.mjs

      - name: Commit bounded result and retire one-shot workflow
        run: |
          rm .github/workflows/apply-nar-current-three-a-plus-20260901.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/candidates/nar-current-three-a-plus-approved-2026-09-01.json \
            data/generated/timetable/canonical/meetings.json \
            data/generated/timetable/canonical/meeting-details.json \
            data/generated/timetable/public/meeting-list.json \
            data/generated/timetable/public/meeting-details.json \
            data/generated/timetable/public/japan-a-plus-overrides.json \
            data/generated/timetable/operations-status.json \
            data/generated/timetable/operations-review-package.json \
            .github/workflows/apply-nar-current-three-a-plus-20260901.yml
          git diff --cached --check
          git commit -m 'Apply exact three current NAR A+ promotions'
          git push origin HEAD:apply/nar-current-three-a-plus-20260901
