name: Probe SOREC session-bound status route

on:
  pull_request:
    paths:
      - 'scripts/diagnostics/probe-sorec-session-route.mjs'
      - '.github/workflows/probe-sorec-session-route.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Probe session-bound SOREC calendar discovery
        run: node scripts/diagnostics/probe-sorec-session-route.mjs
