name: Glossary master integrity

on:
  pull_request:
    paths:
      - 'data/glossary-master/**'
      - 'scripts/check-glossary-master-integrity.mjs'
      - 'package.json'
      - '.github/workflows/glossary-master-integrity.yml'
  push:
    branches:
      - main
    paths:
      - 'data/glossary-master/**'
      - 'scripts/check-glossary-master-integrity.mjs'
      - 'package.json'
      - '.github/workflows/glossary-master-integrity.yml'

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate glossary master
        shell: bash
        run: |
          set -o pipefail
          node scripts/check-glossary-master-integrity.mjs 2>&1 | tee glossary-integrity.log
      - name: Upload integrity diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glossary-integrity-log
          path: glossary-integrity.log
          if-no-files-found: error
