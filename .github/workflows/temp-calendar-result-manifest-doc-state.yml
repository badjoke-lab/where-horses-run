name: Temporary Calendar Result Manifest doc state updater

on:
  pull_request:
    paths:
      - 'scripts/update-calendar-result-manifest-doc-state.mjs'
      - '.github/workflows/temp-calendar-result-manifest-doc-state.yml'

permissions:
  contents: write

jobs:
  update:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Update canonical documentation state
        run: node scripts/update-calendar-result-manifest-doc-state.mjs

      - name: Commit documentation state update
        run: |
          if git diff --quiet; then
            echo "No documentation changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            START-HERE.md \
            docs/project-roadmap.md \
            docs/calendar/README.md \
            docs/calendar/machine-readable-contracts.md \
            docs/calendar/implementation-roadmap.md \
            docs/calendar/acquisition-control-plane-implementation-plan.md
          git commit -m "[CF-Pages-Skip] Advance Result Manifest state"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
