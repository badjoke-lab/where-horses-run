name: SOREC live proof once

on:
  push:
    branches:
      - fix/morocco-sorec-best-available-20260909
    paths:
      - '.github/workflows/sorec-live-proof-once.yml'

permissions:
  contents: read

jobs:
  live-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Run SOREC live official window
        run: |
          node scripts/timetable/run-sorec-official-window.mjs \
            --days=30 \
            --output=/tmp/sorec-live.json
          node - <<'NODE'
          const fs = require('node:fs');
          const x = JSON.parse(fs.readFileSync('/tmp/sorec-live.json', 'utf8'));
          if (x.source_id !== 'sorec-programme-reunion') throw new Error('wrong source_id');
          if (x.collection_target_rank !== 'best_available') throw new Error('not best_available');
          if (x.window?.coverage_claim !== 'source_visible_partial') throw new Error('wrong coverage claim');
          if ((x.diagnostics?.unknown_venues ?? []).length) throw new Error('unknown venues');
          if ((x.diagnostics?.parse_failures ?? []).length) throw new Error('parse failures');
          console.log(JSON.stringify({
            meetings: x.records.length,
            rank_counts: x.discovery?.rank_counts,
            source_rows: x.discovery?.source_row_count,
            coverage_claim: x.window?.coverage_claim,
          }));
          NODE
