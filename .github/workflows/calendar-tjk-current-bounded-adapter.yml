name: Calendar TJK current bounded adapter

on:
  pull_request:
    paths:
      - 'data/candidates/tjk-current-bounded-2026-08-11-v1.json'
      - 'docs/timetable-source-tests/03-turkey/revalidation-2026-08-12.json'
      - 'docs/timetable-source-tests/03-turkey/implementation-status-2026-08-12.json'
      - 'docs/calendar/implementation-roadmap-2026-08-12-addendum.md'
      - 'scripts/timetable/tjk-current-bounded-adapter.mjs'
      - 'scripts/check-tjk-current-bounded-adapter.mjs'
      - 'scripts/check-tjk-current-adapter-status.mjs'
      - 'scripts/check-tjk-current-programme-evidence.mjs'
      - '.github/workflows/calendar-tjk-current-bounded-adapter.yml'
  push:
    branches:
      - main
    paths:
      - 'data/candidates/tjk-current-bounded-2026-08-11-v1.json'
      - 'docs/timetable-source-tests/03-turkey/revalidation-2026-08-12.json'
      - 'docs/timetable-source-tests/03-turkey/implementation-status-2026-08-12.json'
      - 'docs/calendar/implementation-roadmap-2026-08-12-addendum.md'
      - 'scripts/timetable/tjk-current-bounded-adapter.mjs'
      - 'scripts/check-tjk-current-bounded-adapter.mjs'
      - 'scripts/check-tjk-current-adapter-status.mjs'
      - 'scripts/check-tjk-current-programme-evidence.mjs'
      - '.github/workflows/calendar-tjk-current-bounded-adapter.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Preserve reviewed current TJK programme evidence
        run: node scripts/check-tjk-current-programme-evidence.mjs
      - name: Validate deterministic current TJK bounded candidate
        run: node scripts/check-tjk-current-bounded-adapter.mjs
      - name: Validate current TJK adapter implementation status
        run: node scripts/check-tjk-current-adapter-status.mjs
      - name: Validate committed candidate determinism
        run: node scripts/timetable/tjk-current-bounded-adapter.mjs --check
      - name: Prove candidate-only PR boundary while adapter stage is current
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          current_unit="$(node -e "const s=require('./docs/timetable-source-tests/03-turkey/implementation-status-2026-08-12.json'); process.stdout.write(s.current_implementation_unit)")"
          if [ "$current_unit" != 'TJK-CURRENT-BOUNDED-ADAPTER-01' ]; then
            echo "Candidate-only diff boundary is not applicable after bounded-adapter completion: $current_unit"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
          echo "$changed"
          if echo "$changed" | grep -E '^data/generated/timetable/(canonical|public)/'; then
            echo 'Current TJK bounded adapter PR must not write Canonical/public timetable data.' >&2
            exit 1
          fi
          if echo "$changed" | grep -E '^data/static/racecourses-public-timetable-identities-v1.json$'; then
            echo 'Current TJK bounded adapter PR must not register public racecourse identity data.' >&2
            exit 1
          fi
      - name: Prove repository clean
        run: |
          changes="$(git status --porcelain --untracked-files=all)"
          if [ -n "$changes" ]; then
            echo "$changes" >&2
            exit 1
          fi
