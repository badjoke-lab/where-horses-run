name: Calendar NAR current-window promotion apply

on:
  pull_request:
    paths:
      - '.github/workflows/calendar-nar-current-window-promotion-apply.yml'
      - 'src/components/CountryDetailPage.astro'
      - 'data/generated/timetable/public/japan-a-plus-overrides.json'
      - 'data/generated/timetable/jra-pilot-review.json'
      - 'data/generated/timetable/operations-status.json'
      - 'data/generated/timetable/operations-review-package.json'

permissions:
  contents: write

concurrency:
  group: calendar-nar-current-window-promotion-apply-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  synchronize-reviewed-promotion:
    if: github.head_ref == 'work/calendar-nar-current-window-promotion-apply'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Validate Public v1 country boundary
        run: |
          node scripts/check-live-fetch-probe-status-ui.mjs
          node scripts/check-m3-hong-kong-alpha-ui.mjs
          node scripts/check-m3-uae-generated-fallback.mjs
      - name: Synchronize Japan A+ and JRA derived artifacts
        run: |
          node scripts/timetable/build-japan-a-plus-public-overrides.mjs
          node scripts/timetable/sync-jra-derived-artifacts.mjs
      - name: Validate synchronized derived artifacts
        run: |
          node scripts/timetable/build-japan-a-plus-public-overrides.mjs --check
          node scripts/check-japan-a-plus-public-overrides.mjs
          node scripts/check-jra-pilot-foundation.mjs
          node scripts/check-calendar-operations-status.mjs
          node scripts/check-calendar-operations-review-package.mjs
      - name: Commit synchronized derived state to PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/candidates/japan-jra-candidates.json \
            data/generated/timetable/public/japan-a-plus-overrides.json \
            data/generated/timetable/jra-pilot-review.json \
            data/generated/timetable/operations-status.json \
            data/generated/timetable/operations-review-package.json
          if git diff --cached --quiet; then
            echo 'Japan A+ and JRA derived state are already synchronized.'
          else
            git commit -m 'Synchronize Japan A+ and JRA derived promotion state'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
