name: Temporary racecourse page profile evidence discovery

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/audit-racecourse-page-profile-evidence.mjs'
      - '.github/workflows/temporary-racecourse-page-profile-evidence-discovery.yml'
  push:
    branches:
      - work/racecourse-page-profile-evidence
    paths:
      - 'scripts/audit-racecourse-page-profile-evidence.mjs'
      - '.github/workflows/temporary-racecourse-page-profile-evidence-discovery.yml'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Validate audit syntax
        run: node --check scripts/audit-racecourse-page-profile-evidence.mjs
      - name: Generate profile evidence discovery
        run: node scripts/audit-racecourse-page-profile-evidence.mjs --output=/tmp/racecourse-page-profile-evidence-discovery.json
      - name: Upload discovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: racecourse-page-profile-evidence-discovery-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: error
          path: /tmp/racecourse-page-profile-evidence-discovery.json
      - name: Prove repository clean
        run: |
          changes="$(git status --porcelain --untracked-files=all)"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            exit 1
          fi
