name: Ireland HRI racecard contract

on:
  pull_request:
    paths:
      - 'scripts/timetable/ireland-hri-fixtures-core.mjs'
      - 'scripts/timetable/run-ireland-hri-official-window.mjs'
      - 'scripts/check-ireland-hri-fixtures-adapter.mjs'
      - 'data/fixtures/ireland-hri-racecard-month-observed-v1.html'
      - 'data/static/calendar-acquisition-registry.json'
      - 'data/static/authority-source-inventory-ireland-hri-v1.json'
      - 'scripts/timetable/load-authority-source-inventory.mjs'
      - '.github/workflows/ireland-hri-racecard-contract.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/timetable/ireland-hri-fixtures-core.mjs'
      - 'scripts/timetable/run-ireland-hri-official-window.mjs'
      - 'scripts/check-ireland-hri-fixtures-adapter.mjs'
      - 'data/fixtures/ireland-hri-racecard-month-observed-v1.html'
      - 'data/static/calendar-acquisition-registry.json'
      - 'data/static/authority-source-inventory-ireland-hri-v1.json'
      - 'scripts/timetable/load-authority-source-inventory.mjs'
      - '.github/workflows/ireland-hri-racecard-contract.yml'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Check Node syntax
        run: |
          node --check scripts/timetable/ireland-hri-fixtures-core.mjs
          node --check scripts/timetable/run-ireland-hri-official-window.mjs
          node --check scripts/check-ireland-hri-fixtures-adapter.mjs
      - name: Validate HRI racecard parser and completion states
        run: node scripts/check-ireland-hri-fixtures-adapter.mjs
      - name: Live-verify production HRI racecard runner
        shell: bash
        run: |
          set -euo pipefail
          output="$(mktemp)"
          trap 'rm -f "$output"' EXIT
          node scripts/timetable/run-ireland-hri-official-window.mjs \
            --days=30 \
            --output="$output"
          OUTPUT="$output" node --input-type=module -e '
            import fs from "node:fs";
            const artifact = JSON.parse(fs.readFileSync(process.env.OUTPUT, "utf8"));
            if (!Array.isArray(artifact.records) || artifact.records.length === 0) {
              throw new Error("current 30-day HRI runner emitted no official fixture records");
            }
            const failedMonths = (artifact.diagnostics?.racecard_months ?? []).filter((row) =>
              row.status === "source_error" || row.status === "parser_failure"
            );
            if (failedMonths.length) {
              throw new Error(`current HRI racecard month acquisition failed: ${JSON.stringify(failedMonths)}`);
            }
            for (const row of artifact.records) {
              const status = row.detail_observation?.status;
              if (status === "available") {
                if (row.capability_rank !== "A") throw new Error(`${row.meeting_id} available detail rank ${row.capability_rank} != A`);
                if (!Array.isArray(row.timetable_rows) || row.timetable_rows.length === 0) throw new Error(`${row.meeting_id} available detail has no race rows`);
              } else if (status === "not_published") {
                if (row.capability_rank !== "C") throw new Error(`${row.meeting_id} pending detail rank ${row.capability_rank} != C`);
              } else {
                throw new Error(`${row.meeting_id} unexpected live detail status ${status}`);
              }
            }
            console.log(`IRELAND_HRI_LIVE_RUNNER: pass meetings=${artifact.records.length} A=${artifact.records.filter((row) => row.capability_rank === "A").length} C=${artifact.records.filter((row) => row.capability_rank === "C").length}`);
          '
      - name: Validate Acquisition Registry resolution
        run: node scripts/check-calendar-acquisition-registry.mjs
      - name: Check diff formatting
        run: git diff --check
