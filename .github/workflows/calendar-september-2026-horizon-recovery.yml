name: Calendar September 2026 horizon recovery

on:
  pull_request:
    paths:
      - '.github/workflows/calendar-september-2026-horizon-recovery.yml'
      - 'scripts/timetable/build-calendar-september-2026-horizon-recovery-approved-candidates.mjs'
      - 'data/generated/timetable/horizon-recovery-2026-08-17/**'
      - 'data/candidates/nar-horizon-recovery-2026-09-15-approved.json'
      - 'data/generated/timetable/canonical/**'
      - 'data/generated/timetable/public/**'
      - 'data/generated/timetable/operations-status.json'
      - 'data/generated/timetable/operations-review-package.json'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/calendar-september-2026-horizon-recovery.yml'
      - 'scripts/timetable/build-calendar-september-2026-horizon-recovery-approved-candidates.mjs'
      - 'data/generated/timetable/horizon-recovery-2026-08-17/**'
      - 'data/candidates/nar-horizon-recovery-2026-09-15-approved.json'
      - 'data/generated/timetable/canonical/**'
      - 'data/generated/timetable/public/**'
      - 'data/generated/timetable/operations-status.json'
      - 'data/generated/timetable/operations-review-package.json'

permissions:
  contents: read

concurrency:
  group: calendar-september-2026-horizon-recovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Build reviewed Rank C NAR candidate envelope
        run: node scripts/timetable/build-calendar-september-2026-horizon-recovery-approved-candidates.mjs
      - name: Verify historical recovery candidate remains deterministic
        run: git diff --exit-code -- data/candidates/nar-horizon-recovery-2026-09-15-approved.json
      - name: Dry-run Promotion Validation
        run: node scripts/timetable/promote-timetable.mjs --input data/candidates/nar-horizon-recovery-2026-09-15-approved.json --dry-run
      - name: Build deterministic public timetable projection from current canonical state
        run: node scripts/timetable/build-public-timetable-view.mjs
      - name: Rebuild coupled public derivative
        run: node scripts/timetable/build-japan-a-plus-public-overrides.mjs
      - name: Validate generated repository data
        run: node scripts/validate-data.mjs
      - name: Verify coupled public and committed operations derivatives
        run: |
          node scripts/check-japan-a-plus-public-overrides.mjs
          node scripts/check-calendar-operations-status.mjs
          node scripts/check-calendar-operations-review-package.mjs
      - name: Verify September 15 recovery historical invariant
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const candidatePath = 'data/candidates/nar-horizon-recovery-2026-09-15-approved.json';
          const candidate = JSON.parse(fs.readFileSync(candidatePath, 'utf8'));
          if (candidate.review?.status !== 'approved' || candidate.review?.promotion_target !== 'canonical-timetable-v0') throw new Error('approval envelope differs');
          if (candidate.records.length !== 32) throw new Error(`approved recovery record count differs: ${candidate.records.length}`);
          const ids = candidate.records.map((record) => record.meeting_id);
          if (new Set(ids).size !== ids.length) throw new Error('recovery meeting IDs are not unique');
          for (const record of candidate.records) {
            if (record.date < '2026-09-07' || record.date > '2026-09-15') throw new Error(`${record.meeting_id}: date outside reviewed window`);
            if (record.capability_rank !== 'C' || record.first_race_time_local !== null || record.last_race_time_local !== null || record.timetable_rows.length !== 0) throw new Error(`${record.meeting_id}: historical recovery envelope exceeded Rank C`);
          }
          const candidateDates = candidate.records.map((record) => record.date).sort();
          if (candidateDates[0] !== '2026-09-07' || candidateDates.at(-1) !== '2026-09-15') throw new Error('historical recovery candidate window differs');

          const rankOrder = new Map([['C', 0], ['B', 1], ['B+', 2], ['A', 3], ['A+', 4]]);
          const canonical = JSON.parse(fs.readFileSync('data/generated/timetable/canonical/meetings.json', 'utf8'));
          const publicList = JSON.parse(fs.readFileSync('data/generated/timetable/public/meeting-list.json', 'utf8'));
          const canonicalById = new Map(canonical.meetings.map((meeting) => [meeting.meeting_id, meeting]));
          const publicById = new Map(publicList.meetings.map((meeting) => [meeting.meeting_id, meeting]));
          const stableFields = ['country_id', 'authority_id', 'racecourse_id', 'date', 'timezone'];

          for (const record of candidate.records) {
            const canonicalMeeting = canonicalById.get(record.meeting_id);
            const publicMeeting = publicById.get(record.meeting_id);
            if (!canonicalMeeting) throw new Error(`${record.meeting_id}: recovered meeting missing from canonical output`);
            if (!publicMeeting) throw new Error(`${record.meeting_id}: recovered meeting missing from public output`);
            for (const field of stableFields) {
              if (canonicalMeeting[field] !== record[field]) throw new Error(`${record.meeting_id}: canonical ${field} drifted from reviewed recovery identity`);
              if (publicMeeting[field] !== record[field]) throw new Error(`${record.meeting_id}: public ${field} drifted from reviewed recovery identity`);
            }
            const canonicalRank = rankOrder.get(canonicalMeeting.capability_rank);
            const publicRank = rankOrder.get(publicMeeting.capability_rank);
            if (canonicalRank === undefined || canonicalRank < rankOrder.get('C')) throw new Error(`${record.meeting_id}: canonical rank regressed below recovered baseline`);
            if (publicRank === undefined || publicRank < rankOrder.get('C')) throw new Error(`${record.meeting_id}: public rank regressed below recovered baseline`);
          }

          const status = JSON.parse(fs.readFileSync('data/generated/timetable/operations-status.json', 'utf8'));
          if ((status.public_projection?.meeting_count ?? 0) < 403) throw new Error(`public meeting count regressed below September 15 recovery baseline: ${status.public_projection?.meeting_count}`);
          if ((status.public_projection?.latest_meeting_date ?? '') < '2026-09-15') throw new Error(`public horizon regressed below September 15 recovery baseline: ${status.public_projection?.latest_meeting_date}`);
          console.log(JSON.stringify({
            historical_recovery_records: candidate.records.length,
            historical_first_date: candidateDates[0],
            historical_last_date: candidateDates.at(-1),
            current_public_meetings: status.public_projection.meeting_count,
            current_public_latest_date: status.public_projection.latest_meeting_date,
          }));
          NODE
      - name: Verify deterministic public projection
        run: node scripts/timetable/build-public-timetable-view.mjs --check
      - name: Verify committed timetable outputs are deterministic
        run: |
          git diff --exit-code -- \
            data/candidates/nar-horizon-recovery-2026-09-15-approved.json \
            data/generated/timetable/canonical/meetings.json \
            data/generated/timetable/canonical/meeting-details.json \
            data/generated/timetable/public/meeting-list.json \
            data/generated/timetable/public/meeting-details.json \
            data/generated/timetable/public/japan-a-plus-overrides.json
      - name: Check generated diff formatting
        run: git diff --check
      - name: Upload reviewed recovery output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calendar-september-2026-horizon-recovery-output
          if-no-files-found: error
          retention-days: 14
          path: |
            data/candidates/nar-horizon-recovery-2026-09-15-approved.json
            data/generated/timetable/canonical/meetings.json
            data/generated/timetable/canonical/meeting-details.json
            data/generated/timetable/public/meeting-list.json
            data/generated/timetable/public/meeting-details.json
            data/generated/timetable/public/japan-a-plus-overrides.json
            data/generated/timetable/operations-status.json
            data/generated/timetable/operations-review-package.json
