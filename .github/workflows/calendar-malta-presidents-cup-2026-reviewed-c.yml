name: Calendar Malta November 8 reviewed C candidate contract
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/calendar-malta-presidents-cup-2026-reviewed-c.yml'
      - 'scripts/timetable/malta-presidents-cup-2026-reviewed-c-core.mjs'
      - 'scripts/timetable/run-malta-presidents-cup-2026-reviewed-c-window.mjs'
      - 'scripts/check-malta-presidents-cup-2026-reviewed-c.mjs'
      - 'data/static/calendar-reviewed-malta-presidents-cup-2026.json'
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Strict source identity and C/venue contract
        run: |
          node --check scripts/timetable/malta-presidents-cup-2026-reviewed-c-core.mjs
          node --check scripts/timetable/run-malta-presidents-cup-2026-reviewed-c-window.mjs
          node scripts/check-malta-presidents-cup-2026-reviewed-c.mjs
      - name: Manual reviewed one-event candidate on current 30d horizon
        run: |
          node scripts/timetable/run-malta-presidents-cup-2026-reviewed-c-window.mjs --as-of=2026-10-29 --days=30 --output=/tmp/malta-reviewed-c.json
          node --input-type=module -e '
            import fs from "node:fs"; import assert from "node:assert/strict";
            const j=JSON.parse(fs.readFileSync("/tmp/malta-reviewed-c.json","utf8"));
            assert.equal(j.records.length,1);
            assert.equal(j.records[0].date,"2026-11-08");
            assert.equal(j.records[0].capability_rank,"C");
            assert.equal(j.records[0].racecourse_id,"malta--malta-equidrome");
            assert.equal(j.source_access,"human_reviewed_no_network");
            assert.equal(j.rights_status,"REVIEW_REQUIRED");
            assert.equal(j.production_routing,false);
            console.log("MALTA_NOV_8_C_POSITIVE source_method=human_reviewed source_copy=none");
          '
      - name: Expiry and non-extrapolation contract
        run: |
          node scripts/timetable/run-malta-presidents-cup-2026-reviewed-c-window.mjs --as-of=2026-11-09 --days=30 --output=/tmp/malta-after.json
          node --input-type=module -e '
            import fs from "node:fs"; import assert from "node:assert/strict";
            const j=JSON.parse(fs.readFileSync("/tmp/malta-after.json","utf8"));
            assert.equal(j.records.length,0);
            assert.equal(j.discovery.source_visible_rows,1);
            console.log("MALTA_NOV_8_EXPIRED_NO_2027_INFERENCE");
          '
