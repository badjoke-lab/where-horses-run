name: Calendar Malta November 8 reviewed C candidate contract
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/calendar-malta-presidents-cup-2026-reviewed-c.yml'
      - 'scripts/timetable/malta-presidents-cup-2026-reviewed-c-core.mjs'
      - 'scripts/timetable/run-malta-presidents-cup-2026-reviewed-c-window.mjs'
      - 'scripts/check-malta-presidents-cup-2026-reviewed-c.mjs'
      - 'data/static/calendar-reviewed-malta-presidents-cup-2026.json'
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Strict source identity and C/venue contract
        run: |
          node --check scripts/timetable/malta-presidents-cup-2026-reviewed-c-core.mjs
          node --check scripts/timetable/run-malta-presidents-cup-2026-reviewed-c-window.mjs
          node scripts/check-malta-presidents-cup-2026-reviewed-c.mjs
      - name: Manual reviewed one-event candidate on current 30d horizon
        run: |
          node scripts/timetable/run-malta-presidents-cup-2026-reviewed-c-window.mjs --as-of=2026-10-29 --days=30 --output=/tmp/malta-reviewed-c.json
          node --input-type=module -e '
            import fs from "node:fs"; import assert from "node:assert/strict";
            const j=JSON.parse(fs.readFileSync("/tmp/malta-reviewed-c.json","utf8"));
            assert.equal(j.records.length,1);
            assert.equal(j.records[0].date,"2026-11-08");
            assert.equal(j.records[0].capability_rank,"C");
            assert.equal(j.records[0].racecourse_id,"malta--malta-equidrome");
            assert.equal(j.source_access,"reviewed_no_network");
            assert.equal(j.rights_status,"USABLE_WITH_CONDITIONS");
            assert.equal(j.production_routing,false);
            console.log("MALTA_NOV_8_C_POSITIVE source_method=reviewed source_copy=none");
          '
      - name: Expiry and non-extrapolation contract
        run: |
          node scripts/timetable/run-malta-presidents-cup-2026-reviewed-c-window.mjs --as-of=2026-11-09 --days=30 --output=/tmp/malta-after.json
          node --input-type=module -e '
            import fs from "node:fs"; import assert from "node:assert/strict";
            const j=JSON.parse(fs.readFileSync("/tmp/malta-after.json","utf8"));
            assert.equal(j.records.length,0);
            assert.equal(j.discovery.source_visible_rows,1);
            console.log("MALTA_NOV_8_EXPIRED_NO_2027_INFERENCE");
          '

      - name: Isolated canonical-to-public acceptance proof (no repository write)
        run: |
          mkdir -p /tmp/whr-malta-canary
          cp data/generated/timetable/canonical/meetings.json /tmp/whr-malta-canary/canonical.json
          cp data/generated/timetable/canonical/meeting-details.json /tmp/whr-malta-canary/canonical-details.json
          cp data/generated/timetable/public/meeting-list.json /tmp/whr-malta-canary/public.json
          cp data/generated/timetable/public/meeting-details.json /tmp/whr-malta-canary/public-details.json
          node scripts/timetable/apply-official-rolling-observations.mjs \
            --artifact=/tmp/malta-reviewed-c.json \
            --country-id=malta \
            --authority-id=malta-racing-club \
            --racing-system-id=malta-reviewed-system \
            --timezone=Europe/Malta \
            --canonical=/tmp/whr-malta-canary/canonical.json \
            --canonical-details=/tmp/whr-malta-canary/canonical-details.json \
            --public=/tmp/whr-malta-canary/public.json \
            --public-details=/tmp/whr-malta-canary/public-details.json
          node --input-type=module -e '
            import fs from "node:fs"; import assert from "node:assert/strict";
            const dir="/tmp/whr-malta-canary/";
            const c=JSON.parse(fs.readFileSync(dir+"canonical.json","utf8"));
            const p=JSON.parse(fs.readFileSync(dir+"public.json","utf8"));
            const id="malta-marsa-presidents-cup-2026-11-08";
            const cm=c.meetings.filter(x=>x.meeting_id===id);
            const pm=p.meetings.filter(x=>x.meeting_id===id);
            assert.equal(cm.length,1,"new canonical meeting missing/duplicated");
            assert.equal(pm.length,1,"public C meeting not included/duplicated");
            assert.equal(cm[0].country_id,"malta");
            assert.equal(pm[0].country_id,"malta");
            assert.equal(cm[0].capability_rank,"C");
            assert.equal(cm[0].racecourse_id,"malta--malta-equidrome");
            assert.equal(cm[0].source_trace.source_label,"AI-assisted reviewed press-conference report (not a first-party organizer fixture)");
            assert.match(cm[0].source_trace.official_source_url,/maltasport\.mt/);
            assert.equal(cm[0].evidence_support.meeting_date.acquisition_method,"reviewed");
            assert.equal(cm[0].evidence_support.meeting_date.review.reviewed_at,"2026-10-29T00:00:00Z");
            console.log("MALTA_CANONICAL_PUBLIC_POSITIVE country=malta rank=C records=1");
          '
