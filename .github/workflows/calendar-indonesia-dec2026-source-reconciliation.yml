name: Calendar Indonesia December 2026 source reconciliation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/calendar-indonesia-dec2026-source-reconciliation.yml'
      - 'scripts/timetable/probe-indonesia-dec2026-fixture-reconciliation.mjs'
permissions:
  contents: read
jobs:
  date-source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node syntax and negative/positive fixtures
        run: |
          node --check scripts/timetable/probe-indonesia-dec2026-fixture-reconciliation.mjs
          node scripts/timetable/probe-indonesia-dec2026-fixture-reconciliation.mjs --self-test
      - name: Bounded official schedule-source comparison (no ingestion)
        run: node scripts/timetable/probe-indonesia-dec2026-fixture-reconciliation.mjs
