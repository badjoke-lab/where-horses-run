# Exact reviewed source evidence is pinned intentionally.
name: Calendar HKJC September 23 fixture review

on:
  pull_request:
    paths:
      - '.github/workflows/calendar-hkjc-september-2026-09-23-fixture-review.yml'
      - 'scripts/timetable/build-calendar-hkjc-september-2026-09-23-fixture-approved-candidates.mjs'
      - 'data/candidates/hkjc-september-2026-09-23-fixture-approved.json'
      - 'data/generated/timetable/canonical/**'
      - 'data/generated/timetable/public/**'
      - 'data/generated/timetable/operations-status.json'
      - 'data/generated/timetable/operations-review-package.json'
      - 'scripts/check-calendar-nar-incremental-v2-promotion-output-determinism.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/calendar-hkjc-september-2026-09-23-fixture-review.yml'
      - 'scripts/timetable/build-calendar-hkjc-september-2026-09-23-fixture-approved-candidates.mjs'
      - 'data/candidates/hkjc-september-2026-09-23-fixture-approved.json'
      - 'data/generated/timetable/canonical/**'
      - 'data/generated/timetable/public/**'
      - 'data/generated/timetable/operations-status.json'
      - 'data/generated/timetable/operations-review-package.json'
      - 'scripts/check-calendar-nar-incremental-v2-promotion-output-determinism.mjs'

permissions:
  contents: read

concurrency:
  group: calendar-hkjc-september-23-fixture-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          path: work
          fetch-depth: 0

      - name: Checkout exact daily-review source evidence
        uses: actions/checkout@v4
        with:
          ref: ca20dce8e061ed082ba6d61aac8e9ede7360ff6d
          path: review-source
          sparse-checkout: |
            data/generated/timetable/actions-multi-job/due-job-plan-2026-08-26-due-hong-kong-hkjc-season-wake-up-001-run-001/candidates.json
            data/generated/timetable/actions-multi-job/due-job-plan-2026-08-26-due-hong-kong-hkjc-season-wake-up-001-run-001/collection-report.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Rebuild exactly one reviewed HKJC fixture record
        working-directory: work
        env:
          WHR_HKJC_REVIEW_CANDIDATES: ${{ github.workspace }}/review-source/data/generated/timetable/actions-multi-job/due-job-plan-2026-08-26-due-hong-kong-hkjc-season-wake-up-001-run-001/candidates.json
          WHR_HKJC_REVIEW_REPORT: ${{ github.workspace }}/review-source/data/generated/timetable/actions-multi-job/due-job-plan-2026-08-26-due-hong-kong-hkjc-season-wake-up-001-run-001/collection-report.json
        run: node scripts/timetable/build-calendar-hkjc-september-2026-09-23-fixture-approved-candidates.mjs

      - name: Verify candidate deterministic and promotion valid
        working-directory: work
        run: |
          git diff --exit-code -- data/candidates/hkjc-september-2026-09-23-fixture-approved.json
          node scripts/timetable/promote-timetable.mjs --input data/candidates/hkjc-september-2026-09-23-fixture-approved.json --dry-run

      - name: Rebuild and validate deterministic projections
        working-directory: work
        run: |
          node scripts/timetable/build-public-timetable-view.mjs
          node scripts/timetable/build-japan-a-plus-public-overrides.mjs
          node scripts/timetable/build-operations-status.mjs --reference-date 2026-07-01
          node scripts/timetable/build-operations-review-package.mjs
          node scripts/validate-data.mjs
          node scripts/check-japan-a-plus-public-overrides.mjs
          node scripts/check-calendar-operations-status.mjs
          node scripts/check-calendar-operations-review-package.mjs

      - name: Verify cumulative reviewed promotion determinism
        working-directory: work
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-calendar-nar-incremental-v2-promotion-output-determinism.mjs

      - name: Verify HKJC September 23 reviewed invariant
        working-directory: work
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const id = 'hkjc-happy-valley-racecourse-2026-09-23';
          const forbiddenKeys = new Set(['horse_name','jockey','trainer','odds','payout','result','prediction','raw_html','stream_url']);
          const assertNoForbiddenKeys = (value, path = 'value') => {
            if (Array.isArray(value)) {
              value.forEach((item, index) => assertNoForbiddenKeys(item, `${path}[${index}]`));
              return;
            }
            if (!value || typeof value !== 'object') return;
            for (const [key, child] of Object.entries(value)) {
              if (forbiddenKeys.has(key.toLowerCase())) throw new Error(`forbidden field key ${path}.${key}`);
              assertNoForbiddenKeys(child, `${path}.${key}`);
            }
          };

          const candidate = JSON.parse(fs.readFileSync('data/candidates/hkjc-september-2026-09-23-fixture-approved.json', 'utf8'));
          if (candidate.review?.status !== 'approved' || candidate.review?.promotion_target !== 'canonical-timetable-v0') throw new Error('review contract differs');
          if (candidate.records.length !== 1 || candidate.records[0].meeting_id !== id) throw new Error('reviewed identity differs');
          const record = candidate.records[0];
          if (record.country_id !== 'hong-kong' || record.authority_id !== 'hkjc' || record.racecourse_id !== 'happy-valley-racecourse' || record.date !== '2026-09-23' || record.timezone !== 'Asia/Hong_Kong') throw new Error('reviewed fixture coordinates differ');
          if (record.capability_rank !== 'C' || record.first_race_time_local !== null || record.last_race_time_local !== null || record.timetable_rows?.length !== 0) throw new Error('reviewed Rank C boundary differs');
          if (record.source?.source_id !== 'hkjc-fixture-list' || record.source?.official_url !== 'https://racing.hkjc.com/en-us/local/information/fixture?CalMonth=09&CalYear=2026') throw new Error('reviewed official source differs');
          assertNoForbiddenKeys(record, 'candidate');

          const canonical = JSON.parse(fs.readFileSync('data/generated/timetable/canonical/meetings.json', 'utf8'));
          const details = JSON.parse(fs.readFileSync('data/generated/timetable/canonical/meeting-details.json', 'utf8'));
          const publicList = JSON.parse(fs.readFileSync('data/generated/timetable/public/meeting-list.json', 'utf8'));
          const publicDetails = JSON.parse(fs.readFileSync('data/generated/timetable/public/meeting-details.json', 'utf8'));
          const meeting = canonical.meetings.find((row) => row.meeting_id === id);
          const publicMeeting = publicList.meetings.find((row) => row.meeting_id === id);
          if (!meeting || !publicMeeting) throw new Error('reviewed meeting missing from canonical/public projection');
          if (meeting.country_id !== 'hong-kong' || meeting.authority_id !== 'hkjc' || meeting.racecourse_id !== 'happy-valley-racecourse' || meeting.date !== '2026-09-23' || meeting.timezone !== 'Asia/Hong_Kong') throw new Error('canonical fixture coordinates differ');
          if (meeting.capability_rank !== 'C' || meeting.first_race_time_local !== null || meeting.last_race_time_local !== null) throw new Error('canonical Rank C boundary differs');
          if ((publicMeeting.effective_public_rank ?? publicMeeting.capability_rank) !== 'C') throw new Error('public rank differs');
          if (publicMeeting.first_race_time_local !== null || publicMeeting.last_race_time_local !== null) throw new Error('public Rank C times differ');
          if (details.details.some((row) => row.meeting_id === id) || publicDetails.details.some((row) => row.meeting_id === id)) throw new Error('fixture unexpectedly has detail');
          assertNoForbiddenKeys(meeting, 'canonical');
          assertNoForbiddenKeys(publicMeeting, 'public');

          const status = JSON.parse(fs.readFileSync('data/generated/timetable/operations-status.json', 'utf8'));
          if ((status.public_projection?.meeting_count ?? 0) < 425) throw new Error(`public meeting count regressed: ${status.public_projection?.meeting_count}`);
          if ((status.public_projection?.detail_count ?? 0) < 111) throw new Error(`public detail count regressed: ${status.public_projection?.detail_count}`);
          if ((status.public_projection?.latest_meeting_date ?? '') < '2026-09-23') throw new Error(`public horizon regressed: ${status.public_projection?.latest_meeting_date}`);
          NODE

      - name: Verify deterministic current outputs and formatting
        working-directory: work
        run: |
          node scripts/timetable/build-public-timetable-view.mjs --check
          git diff --exit-code -- \
            data/candidates/hkjc-september-2026-09-23-fixture-approved.json \
            data/generated/timetable/canonical/meetings.json \
            data/generated/timetable/canonical/meeting-details.json \
            data/generated/timetable/public/meeting-list.json \
            data/generated/timetable/public/meeting-details.json \
            data/generated/timetable/public/japan-a-plus-overrides.json \
            data/generated/timetable/operations-status.json \
            data/generated/timetable/operations-review-package.json
          git diff --check
