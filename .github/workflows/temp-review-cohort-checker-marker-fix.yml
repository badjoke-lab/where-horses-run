name: Temporary Review Cohort checker marker fixer

on:
  pull_request:
    paths:
      - 'scripts/fix-review-cohort-checker-markers.mjs'
      - '.github/workflows/temp-review-cohort-checker-marker-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Fix checker markers
        run: node scripts/fix-review-cohort-checker-markers.mjs
      - name: Commit checker marker fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check-calendar-review-cohort-planner.mjs
          git commit -m "[CF-Pages-Skip] Align Review Cohort checker markers"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
