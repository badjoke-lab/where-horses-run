name: Calendar KRA Rank C adapter

on:
  pull_request:
    paths:
      - 'data/static/kra-2026-reviewed-calendar-plan-v1.json'
      - 'docs/timetable-source-tests/02-south-korea/**'
      - 'scripts/timetable/kra-calendar-plan-adapter.mjs'
      - 'scripts/check-kra-calendar-plan-adapter.mjs'
      - '.github/workflows/calendar-kra-rank-c-adapter.yml'
  push:
    branches:
      - main
    paths:
      - 'data/static/kra-2026-reviewed-calendar-plan-v1.json'
      - 'docs/timetable-source-tests/02-south-korea/**'
      - 'scripts/timetable/kra-calendar-plan-adapter.mjs'
      - 'scripts/check-kra-calendar-plan-adapter.mjs'
      - '.github/workflows/calendar-kra-rank-c-adapter.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Validate reviewed KRA Rank C candidate generation
        run: node scripts/check-kra-calendar-plan-adapter.mjs
      - name: Prove repository clean
        run: |
          changes="$(git status --porcelain --untracked-files=all)"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            exit 1
          fi
