name: M6 source freshness badges

on:
  pull_request:
    paths:
      - 'data/static/calendar-readiness-registry.json'
      - 'data/static/m6-source-freshness-badges-v1.json'
      - 'src/lib/sourceFreshnessState.mjs'
      - 'src/lib/timetable/coverageDashboard.ts'
      - 'src/components/SourceFreshnessBadge.astro'
      - 'src/components/CalendarCoverageDashboard.astro'
      - 'src/components/CountryCoverageMatrix.astro'
      - 'src/pages/about/data-coverage.astro'
      - 'src/pages/ja/about/data-coverage.astro'
      - 'scripts/check-m6-source-freshness-badges.mjs'
      - '.github/workflows/m6-source-freshness-badges.yml'
  push:
    branches:
      - main
    paths:
      - 'data/static/calendar-readiness-registry.json'
      - 'data/static/m6-source-freshness-badges-v1.json'
      - 'src/lib/sourceFreshnessState.mjs'
      - 'src/lib/timetable/coverageDashboard.ts'
      - 'src/components/SourceFreshnessBadge.astro'
      - 'src/components/CalendarCoverageDashboard.astro'
      - 'src/components/CountryCoverageMatrix.astro'
      - 'src/pages/about/data-coverage.astro'
      - 'src/pages/ja/about/data-coverage.astro'
      - 'scripts/check-m6-source-freshness-badges.mjs'
      - '.github/workflows/m6-source-freshness-badges.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - run: npm install --package-lock=false
      - run: npm run build
      - run: node scripts/check-m6-source-freshness-badges.mjs
      - run: node scripts/check-m6-country-coverage-matrix.mjs
      - run: git diff --exit-code
