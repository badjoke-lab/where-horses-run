name: Calendar US New Jersey official PDF color probe

on:
  pull_request:
    paths:
      - '.github/workflows/calendar-us-njrc-2026-pdf-color-probe.yml'
      - 'scripts/timetable/probe-us-njrc-2026-pdf-colors.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pdf-color-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pymupdf==1.26.5
      - name: Inspect state-issued NJRC 2026 PDF text/drawing colors
        run: python scripts/timetable/probe-us-njrc-2026-pdf-colors.py
