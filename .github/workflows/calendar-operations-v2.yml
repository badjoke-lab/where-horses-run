name: Calendar Operations v2

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'data/static/calendar-operations-v2.schema.json'
      - 'data/fixtures/calendar-operations-v2-fixtures-v1.json'
      - 'data/fixtures/calendar-operations-v2-invalid-cases-v1.json'
      - 'data/static/calendar-due-job-policy-v1.json'
      - 'data/fixtures/calendar-due-job-planner-fixtures-v1.json'
      - 'data/fixtures/calendar-review-cohort-planner-fixtures-v1.json'
      - 'data/static/calendar-acquisition-registry.json'
      - 'scripts/timetable/operations-v2.mjs'
      - 'scripts/timetable/build-calendar-operations-v2.mjs'
      - 'scripts/check-calendar-operations-v2.mjs'
      - 'scripts/check-calendar-due-job-planner.mjs'
      - 'scripts/check-calendar-review-cohort-planner.mjs'
      - 'scripts/check-calendar-review-queue.mjs'
      - 'scripts/check-calendar-rank-aware-retry-queue.mjs'
      - 'scripts/check-calendar-acquisition-registry.mjs'
      - 'scripts/check-project-governance-docs.mjs'
      - 'docs/calendar/operations-v2.md'
      - 'docs/calendar/acquisition-control-plane-implementation-plan.md'
      - 'docs/calendar/implementation-roadmap.md'
      - 'docs/project-roadmap.md'
      - 'docs/calendar/README.md'
      - 'docs/calendar/machine-readable-contracts.md'
      - 'START-HERE.md'
      - '.github/workflows/calendar-operations-v2.yml'
  push:
    branches:
      - main
    paths:
      - 'data/static/calendar-operations-v2.schema.json'
      - 'data/fixtures/calendar-operations-v2-fixtures-v1.json'
      - 'data/fixtures/calendar-operations-v2-invalid-cases-v1.json'
      - 'scripts/timetable/operations-v2.mjs'
      - 'scripts/timetable/build-calendar-operations-v2.mjs'
      - 'scripts/check-calendar-operations-v2.mjs'
      - 'docs/calendar/operations-v2.md'
      - 'docs/calendar/acquisition-control-plane-implementation-plan.md'
      - 'docs/calendar/implementation-roadmap.md'
      - 'docs/project-roadmap.md'
      - 'docs/calendar/README.md'
      - 'docs/calendar/machine-readable-contracts.md'
      - 'START-HERE.md'
      - '.github/workflows/calendar-operations-v2.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Check Node syntax
        run: |
          node --check scripts/timetable/operations-v2.mjs
          node --check scripts/timetable/build-calendar-operations-v2.mjs
          node --check scripts/check-calendar-operations-v2.mjs

      - name: Validate Operations v2 aggregation and fixtures
        run: node scripts/check-calendar-operations-v2.mjs

      - name: Validate Due, Review, Retry, and Registry dependencies
        run: |
          node scripts/check-calendar-due-job-planner.mjs
          node scripts/check-calendar-review-cohort-planner.mjs
          node scripts/check-calendar-review-queue.mjs
          node scripts/check-calendar-rank-aware-retry-queue.mjs
          node scripts/check-calendar-acquisition-registry.mjs

      - name: Validate Calendar contracts and governance
        run: |
          node scripts/check-calendar-contracts.mjs
          node scripts/check-project-governance-docs.mjs

      - name: Validate runtime import boundary
        run: node scripts/check-calendar-runtime-import-boundary.mjs

      - name: Check diff formatting
        run: git diff --check

  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Build read-only Calendar Operations v2 artifact
        run: |
          node scripts/timetable/build-calendar-operations-v2.mjs \
            --fixture=data/fixtures/calendar-operations-v2-fixtures-v1.json \
            --output=.calendar-operations-v2.json
          grep -q '"mode": "read_only_control_plane_view"' .calendar-operations-v2.json
          grep -q '"job_execution_performed": false' .calendar-operations-v2.json

      - name: Upload Operations v2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: calendar-operations-v2
          path: .calendar-operations-v2.json
          retention-days: 14
