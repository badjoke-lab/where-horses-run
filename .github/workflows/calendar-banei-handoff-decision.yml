name: Calendar Banei handoff decision

on:
  pull_request:
    paths:
      - 'data/static/calendar-banei-handoff-decision.schema.json'
      - 'data/static/calendar-banei-handoff-decision-v1.json'
      - 'data/static/calendar-acquisition-registry.json'
      - 'data/static/calendar-readiness-banei-detail-v1.json'
      - 'src/data/publicationDisplayPolicies.json'
      - 'docs/calendar/banei-handoff-decision.md'
      - 'docs/calendar/README.md'
      - 'docs/project-roadmap.md'
      - 'docs/calendar/implementation-roadmap.md'
      - 'docs/calendar/acquisition-control-plane-implementation-plan.md'
      - 'docs/governance/document-authority.md'
      - 'scripts/check-calendar-banei-handoff-decision.mjs'
      - '.github/workflows/calendar-banei-handoff-decision.yml'
  push:
    branches:
      - main
    paths:
      - 'data/static/calendar-banei-handoff-decision.schema.json'
      - 'data/static/calendar-banei-handoff-decision-v1.json'
      - 'data/static/calendar-acquisition-registry.json'
      - 'data/static/calendar-readiness-banei-detail-v1.json'
      - 'src/data/publicationDisplayPolicies.json'
      - 'docs/calendar/banei-handoff-decision.md'
      - 'docs/calendar/README.md'
      - 'docs/project-roadmap.md'
      - 'docs/calendar/implementation-roadmap.md'
      - 'docs/calendar/acquisition-control-plane-implementation-plan.md'
      - 'docs/governance/document-authority.md'
      - 'scripts/check-calendar-banei-handoff-decision.mjs'
      - '.github/workflows/calendar-banei-handoff-decision.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Check Node syntax
        run: node --check scripts/check-calendar-banei-handoff-decision.mjs
      - name: Validate Banei handoff decision
        run: node scripts/check-calendar-banei-handoff-decision.mjs
      - name: Validate Banei handoff dependencies
        run: |
          node scripts/check-calendar-banei-retry-queue-state-apply.mjs
          node scripts/check-calendar-banei-freshness-rollback-operating-evidence.mjs
          node scripts/check-calendar-banei-bilingual-public-display-qa.mjs
      - name: Validate governance and runtime boundaries
        run: |
          node scripts/check-project-governance-docs.mjs
          node scripts/check-calendar-runtime-import-boundary.mjs
      - name: Check workflow boundary
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const workflow = fs.readFileSync('.github/workflows/calendar-banei-handoff-decision.yml', 'utf8');
          if (!workflow.includes('permissions:\n  contents: read')) throw new Error('read-only workflow permission missing');
          if (/contents:\s*write/.test(workflow) || /pull-requests:\s*write/.test(workflow)) throw new Error('write permission enabled');
          if (/\bschedule\s*:|\bcron\s*:/.test(workflow)) throw new Error('scheduled trigger enabled');
          console.log('WORKFLOW_CONTENTS_PERMISSION: read');
          console.log('SCHEDULED_EXECUTION: false');
          console.log('AUTOMATIC_PUBLICATION: false');
          NODE
      - name: Check diff formatting
        run: git diff --check
