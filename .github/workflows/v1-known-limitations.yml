name: v1 known limitations gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'data/static/v1-known-limitations-v1.json'
      - 'data/audits/v1-known-limitations-v1.json'
      - 'docs/release/v1-known-limitations.md'
      - 'scripts/check-v1-known-limitations.mjs'
      - '.github/workflows/v1-known-limitations.yml'
      - 'src/components/FaqPage.astro'
      - 'src/components/MethodsPage.astro'
      - 'src/pages/faq/**'
      - 'src/pages/ja/faq/**'
      - 'src/pages/methods/**'
      - 'src/pages/ja/methods/**'
      - 'data/static/v1-scope-freeze-v1.json'
      - 'data/static/v1-data-audit-v1.json'
      - 'data/static/v1-mobile-qa-v1.json'
      - 'data/static/v1-accessibility-qa-v1.json'
      - 'data/static/v1-performance-qa-v1.json'
      - 'data/static/v1-source-policy-review-v1.json'
      - 'data/static/faq-content-pages-contract-v1.json'
      - 'data/static/methods-data-policy-contract-v1.json'
  push:
    branches:
      - main
    paths:
      - 'data/static/v1-known-limitations-v1.json'
      - 'data/audits/v1-known-limitations-v1.json'
      - 'docs/release/v1-known-limitations.md'
      - 'scripts/check-v1-known-limitations.mjs'
      - '.github/workflows/v1-known-limitations.yml'
      - 'src/components/FaqPage.astro'
      - 'src/components/MethodsPage.astro'
      - 'src/pages/faq/**'
      - 'src/pages/ja/faq/**'
      - 'src/pages/methods/**'
      - 'src/pages/ja/methods/**'
      - 'data/static/v1-scope-freeze-v1.json'
      - 'data/static/v1-data-audit-v1.json'
      - 'data/static/v1-mobile-qa-v1.json'
      - 'data/static/v1-accessibility-qa-v1.json'
      - 'data/static/v1-performance-qa-v1.json'
      - 'data/static/v1-source-policy-review-v1.json'
      - 'data/static/faq-content-pages-contract-v1.json'
      - 'data/static/methods-data-policy-contract-v1.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install dependencies without generating a lockfile
        run: npm install --package-lock=false
      - name: Validate public data references
        run: npm run validate:data
      - name: Build complete static site
        run: npm run build
      - name: Preserve v1 scope freeze
        run: node scripts/check-v1-scope-freeze.mjs
      - name: Preserve v1 data audit
        run: node scripts/check-v1-data-audit.mjs
      - name: Preserve v1 mobile QA
        run: node scripts/check-v1-mobile-qa.mjs
      - name: Preserve v1 accessibility QA
        run: node scripts/check-v1-accessibility-qa.mjs
      - name: Preserve v1 performance QA
        run: node scripts/check-v1-performance-qa.mjs
      - name: Preserve v1 source policy review
        run: node scripts/check-v1-source-policy-review.mjs
      - name: Preserve FAQ content pages
        run: node scripts/check-faq-content-pages.mjs
      - name: Preserve Methods and Data Policy pages
        run: node scripts/check-methods-data-policy.mjs
      - name: Validate v1 known limitations
        run: node scripts/check-v1-known-limitations.mjs
      - name: Prove repository clean
        run: |
          changes="$(git status --porcelain --untracked-files=all)"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            exit 1
          fi
