name: Calendar Morocco SOREC revalidation

on:
  pull_request:
    paths:
      - 'docs/timetable-source-tests/04-morocco/README.md'
      - 'docs/timetable-source-tests/04-morocco/pending-summary.json'
      - 'docs/timetable-source-tests/04-morocco/revalidation-2026-08-14.json'
      - 'data/static/authority-source-inventory.json'
      - 'scripts/check-morocco-sorec-revalidation.mjs'
      - '.github/workflows/calendar-morocco-sorec-revalidation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - run: node scripts/check-morocco-sorec-revalidation.mjs
