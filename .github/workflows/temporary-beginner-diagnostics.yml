name: Temporary beginner explanation diagnostics

on:
  pull_request:
    branches:
      - main
    paths:
      - 'data/static/glossary-fields-beginner-v1.json'
      - 'scripts/diagnose-glossary-beginner.mjs'
      - '.github/workflows/temporary-beginner-diagnostics.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Print diagnostics
        run: node scripts/diagnose-glossary-beginner.mjs
