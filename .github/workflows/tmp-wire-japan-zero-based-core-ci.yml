name: Temporary wire Japan zero-based core CI

on:
  push:
    branches:
      - fix/report-actual-japan-regression-rank

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/report-actual-japan-regression-rank
          fetch-depth: 0
      - name: Wire core and contract into unified workflow
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = '.github/workflows/calendar-unified-official-refresh.yml';
          let text = fs.readFileSync(path, 'utf8');

          const pathNeedle = "      - 'scripts/timetable/run-japan-zero-based-30d.mjs'\n";
          const pathReplacement = pathNeedle + "      - 'scripts/timetable/japan-zero-based-30d-core.mjs'\n";
          const pathCount = text.split(pathNeedle).length - 1;
          if (pathCount !== 2) throw new Error(`expected 2 run-japan path entries, got ${pathCount}`);
          text = text.replaceAll(pathNeedle, pathReplacement);

          const checkPathNeedle = "      - 'scripts/check-japan-per-family-absence-reconciliation.mjs'\n";
          const checkPathReplacement = checkPathNeedle + "      - 'scripts/check-japan-zero-based-30d.mjs'\n";
          const checkPathCount = text.split(checkPathNeedle).length - 1;
          if (checkPathCount !== 2) throw new Error(`expected 2 Japan check path entries, got ${checkPathCount}`);
          text = text.replaceAll(checkPathNeedle, checkPathReplacement);

          const syntaxNeedle = "          node --check scripts/timetable/run-japan-zero-based-30d.mjs\n";
          const syntaxReplacement = syntaxNeedle + "          node --check scripts/timetable/japan-zero-based-30d-core.mjs\n";
          const syntaxCount = text.split(syntaxNeedle).length - 1;
          if (syntaxCount !== 2) throw new Error(`expected 2 production/smoke syntax entries, got ${syntaxCount}`);
          text = text.replaceAll(syntaxNeedle, syntaxReplacement);

          const safetyNeedle = "          node scripts/check-japan-per-family-absence-reconciliation.mjs\n";
          const safetyReplacement = safetyNeedle + "          node scripts/check-japan-zero-based-30d.mjs\n";
          const safetyCount = text.split(safetyNeedle).length - 1;
          if (safetyCount !== 1) throw new Error(`expected 1 smoke safety entry, got ${safetyCount}`);
          text = text.replace(safetyNeedle, safetyReplacement);

          fs.writeFileSync(path, text);
          NODE
          node scripts/check-japan-zero-based-30d.mjs
          git diff --check
      - name: Commit wiring and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-wire-japan-zero-based-core-ci.yml
          git add .github/workflows/calendar-unified-official-refresh.yml
          git commit -m "ci: watch Japan zero-based core directly"
          git push origin HEAD:fix/report-actual-japan-regression-rank
