name: Calendar HKJC September 23 boundary diagnostic

on:
  push:
    branches:
      - review/hkjc-2026-09-23-happy-valley-c
    paths:
      - '.github/workflows/calendar-hkjc-september-2026-09-23-fixture-boundary-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout exact daily-review source evidence
        uses: actions/checkout@v4
        with:
          ref: ca20dce8e061ed082ba6d61aac8e9ede7360ff6d
          path: review-source
          sparse-checkout: |
            data/generated/timetable/actions-multi-job/due-job-plan-2026-08-26-due-hong-kong-hkjc-season-wake-up-001-run-001/candidates.json
            data/generated/timetable/actions-multi-job/due-job-plan-2026-08-26-due-hong-kong-hkjc-season-wake-up-001-run-001/collection-report.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Rebuild candidate and post-promotion state
        env:
          WHR_HKJC_REVIEW_CANDIDATES: ${{ github.workspace }}/review-source/data/generated/timetable/actions-multi-job/due-job-plan-2026-08-26-due-hong-kong-hkjc-season-wake-up-001-run-001/candidates.json
          WHR_HKJC_REVIEW_REPORT: ${{ github.workspace }}/review-source/data/generated/timetable/actions-multi-job/due-job-plan-2026-08-26-due-hong-kong-hkjc-season-wake-up-001-run-001/collection-report.json
        run: |
          node scripts/timetable/build-calendar-hkjc-september-2026-09-23-fixture-approved-candidates.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p = 'scripts/check-calendar-nar-incremental-v2-promotion-output-determinism.mjs';
          let text = fs.readFileSync(p, 'utf8');
          const declaration = "const augustNarRegularRefreshAPlusSixthPath = 'data/candidates/nar-regular-refresh-2026-08-28-funabashi-kasamatsu-a-plus-approved.json';";
          text = text.replace(declaration, `${declaration}\nconst septemberHkjcFixtureSeptember23Path = 'data/candidates/hkjc-september-2026-09-23-fixture-approved.json';`);
          text = text.replace('  augustNarRegularRefreshAPlusSixthPath,\n];', '  augustNarRegularRefreshAPlusSixthPath,\n  septemberHkjcFixtureSeptember23Path,\n];');
          text = text.replace('  [augustNarRegularRefreshAPlusSixthPath, [2, 2]],\n]);', '  [augustNarRegularRefreshAPlusSixthPath, [2, 2]],\n  [septemberHkjcFixtureSeptember23Path, [1, 0]],\n]);');
          fs.writeFileSync(p, text);
          NODE
          node scripts/timetable/promote-timetable.mjs --input data/candidates/hkjc-september-2026-09-23-fixture-approved.json
          node scripts/timetable/build-public-timetable-view.mjs
          node scripts/timetable/build-japan-a-plus-public-overrides.mjs
          node scripts/timetable/build-operations-status.mjs --reference-date 2026-07-01
          node scripts/timetable/build-operations-review-package.mjs

      - name: Assert canonical meetings delta +1
        continue-on-error: true
        env: { BASE_SHA: c9f9d464acfdf9edc230b263f000e89b11db3c07 }
        run: node --input-type=module -e "import fs from 'node:fs'; import {execFileSync} from 'node:child_process'; const b=JSON.parse(execFileSync('git',['show',process.env.BASE_SHA+':data/generated/timetable/canonical/meetings.json'],{encoding:'utf8'})); const h=JSON.parse(fs.readFileSync('data/generated/timetable/canonical/meetings.json')); console.log(b.meetings.length,h.meetings.length); if(h.meetings.length!==b.meetings.length+1) process.exit(1)"

      - name: Assert canonical details delta +0
        continue-on-error: true
        env: { BASE_SHA: c9f9d464acfdf9edc230b263f000e89b11db3c07 }
        run: node --input-type=module -e "import fs from 'node:fs'; import {execFileSync} from 'node:child_process'; const b=JSON.parse(execFileSync('git',['show',process.env.BASE_SHA+':data/generated/timetable/canonical/meeting-details.json'],{encoding:'utf8'})); const h=JSON.parse(fs.readFileSync('data/generated/timetable/canonical/meeting-details.json')); console.log(b.details.length,h.details.length); if(h.details.length!==b.details.length) process.exit(1)"

      - name: Assert raw public meetings delta +1
        continue-on-error: true
        env: { BASE_SHA: c9f9d464acfdf9edc230b263f000e89b11db3c07 }
        run: node --input-type=module -e "import fs from 'node:fs'; import {execFileSync} from 'node:child_process'; const b=JSON.parse(execFileSync('git',['show',process.env.BASE_SHA+':data/generated/timetable/public/meeting-list.json'],{encoding:'utf8'})); const h=JSON.parse(fs.readFileSync('data/generated/timetable/public/meeting-list.json')); console.log(b.meetings.length,h.meetings.length); if(h.meetings.length!==b.meetings.length+1) process.exit(1)"

      - name: Assert raw public details delta +0
        continue-on-error: true
        env: { BASE_SHA: c9f9d464acfdf9edc230b263f000e89b11db3c07 }
        run: node --input-type=module -e "import fs from 'node:fs'; import {execFileSync} from 'node:child_process'; const b=JSON.parse(execFileSync('git',['show',process.env.BASE_SHA+':data/generated/timetable/public/meeting-details.json'],{encoding:'utf8'})); const h=JSON.parse(fs.readFileSync('data/generated/timetable/public/meeting-details.json')); console.log(b.details.length,h.details.length); if(h.details.length!==b.details.length) process.exit(1)"

      - name: Assert canonical target is C with no times
        continue-on-error: true
        run: node --input-type=module -e "import fs from 'node:fs'; const h=JSON.parse(fs.readFileSync('data/generated/timetable/canonical/meetings.json')); const r=h.meetings.find(x=>x.meeting_id==='hkjc-happy-valley-racecourse-2026-09-23'); console.log(JSON.stringify(r)); if(r?.capability_rank!=='C'||r.first_race_time_local!==null||r.last_race_time_local!==null) process.exit(1)"

      - name: Assert public target rank is C
        continue-on-error: true
        run: node --input-type=module -e "import fs from 'node:fs'; const h=JSON.parse(fs.readFileSync('data/generated/timetable/public/meeting-list.json')); const r=h.meetings.find(x=>x.meeting_id==='hkjc-happy-valley-racecourse-2026-09-23'); console.log(JSON.stringify(r)); if((r?.effective_public_rank??r?.capability_rank)!=='C') process.exit(1)"

      - name: Assert target has no canonical or public detail
        continue-on-error: true
        run: node --input-type=module -e "import fs from 'node:fs'; const id='hkjc-happy-valley-racecourse-2026-09-23'; const c=JSON.parse(fs.readFileSync('data/generated/timetable/canonical/meeting-details.json')); const p=JSON.parse(fs.readFileSync('data/generated/timetable/public/meeting-details.json')); if(c.details.some(x=>x.meeting_id===id)||p.details.some(x=>x.meeting_id===id)) process.exit(1)"

      - name: Assert operations meeting count unchanged
        continue-on-error: true
        env: { BASE_SHA: c9f9d464acfdf9edc230b263f000e89b11db3c07 }
        run: node --input-type=module -e "import fs from 'node:fs'; import {execFileSync} from 'node:child_process'; const b=JSON.parse(execFileSync('git',['show',process.env.BASE_SHA+':data/generated/timetable/operations-status.json'],{encoding:'utf8'})); const h=JSON.parse(fs.readFileSync('data/generated/timetable/operations-status.json')); console.log(b.public_projection?.meeting_count,h.public_projection?.meeting_count); if(h.public_projection?.meeting_count!==b.public_projection?.meeting_count) process.exit(1)"

      - name: Assert operations detail count unchanged
        continue-on-error: true
        env: { BASE_SHA: c9f9d464acfdf9edc230b263f000e89b11db3c07 }
        run: node --input-type=module -e "import fs from 'node:fs'; import {execFileSync} from 'node:child_process'; const b=JSON.parse(execFileSync('git',['show',process.env.BASE_SHA+':data/generated/timetable/operations-status.json'],{encoding:'utf8'})); const h=JSON.parse(fs.readFileSync('data/generated/timetable/operations-status.json')); console.log(b.public_projection?.detail_count,h.public_projection?.detail_count); if(h.public_projection?.detail_count!==b.public_projection?.detail_count) process.exit(1)"

      - name: Assert operations horizon unchanged
        continue-on-error: true
        env: { BASE_SHA: c9f9d464acfdf9edc230b263f000e89b11db3c07 }
        run: node --input-type=module -e "import fs from 'node:fs'; import {execFileSync} from 'node:child_process'; const b=JSON.parse(execFileSync('git',['show',process.env.BASE_SHA+':data/generated/timetable/operations-status.json'],{encoding:'utf8'})); const h=JSON.parse(fs.readFileSync('data/generated/timetable/operations-status.json')); console.log(b.public_projection?.latest_meeting_date,h.public_projection?.latest_meeting_date); if(h.public_projection?.latest_meeting_date!==b.public_projection?.latest_meeting_date) process.exit(1)"

      - name: Assert forbidden fields absent
        continue-on-error: true
        run: node --input-type=module -e "import fs from 'node:fs'; const h=JSON.parse(fs.readFileSync('data/generated/timetable/canonical/meetings.json')); const r=h.meetings.find(x=>x.meeting_id==='hkjc-happy-valley-racecourse-2026-09-23'); const s=JSON.stringify(r).toLowerCase(); for(const f of ['horse_name','jockey','trainer','odds','payout','result','prediction','raw_html','stream_url']) if(s.includes(f)) process.exit(1)"

      - name: Assert git diff check
        continue-on-error: true
        run: git diff --check
