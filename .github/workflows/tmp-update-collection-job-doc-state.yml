name: Temporary Collection Job documentation state update

on:
  pull_request:
    paths:
      - 'scripts/tmp-update-collection-job-doc-state.mjs'
      - '.github/workflows/tmp-update-collection-job-doc-state.yml'
  push:
    branches:
      - work/calendar-collection-job-schema

permissions:
  contents: write

concurrency:
  group: tmp-update-collection-job-doc-state
  cancel-in-progress: false

jobs:
  update-and-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/calendar-collection-job-schema
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Apply exact documentation transitions
        run: node scripts/tmp-update-collection-job-doc-state.mjs
      - name: Validate Collection Job after documentation update
        run: node scripts/check-calendar-collection-job.mjs
      - name: Validate diff formatting
        run: git diff --check
      - name: Commit documentation state and remove temporary updater
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            START-HERE.md \
            docs/project-roadmap.md \
            docs/calendar/implementation-roadmap.md \
            docs/calendar/acquisition-control-plane-implementation-plan.md \
            docs/calendar/machine-readable-contracts.md \
            docs/calendar/README.md
          git rm \
            .github/workflows/tmp-update-collection-job-doc-state.yml \
            scripts/tmp-update-collection-job-doc-state.mjs
          git diff --cached --check
          git commit -m "[CF-Pages-Skip] Advance Collection Job state"
          git push origin HEAD:work/calendar-collection-job-schema
