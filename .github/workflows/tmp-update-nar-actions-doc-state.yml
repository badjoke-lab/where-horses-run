name: Temporary NAR Actions documentation state update

on:
  pull_request:
    paths:
      - 'scripts/tmp-update-nar-actions-doc-state.mjs'
      - '.github/workflows/tmp-update-nar-actions-doc-state.yml'
  push:
    branches:
      - work/nar-actions-manual-dispatch

permissions:
  contents: write

concurrency:
  group: tmp-update-nar-actions-doc-state
  cancel-in-progress: false

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/nar-actions-manual-dispatch
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Apply exact documentation state transitions
        run: node scripts/tmp-update-nar-actions-doc-state.mjs
      - name: Validate diff formatting
        run: git diff --check
      - name: Commit documentation state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            START-HERE.md \
            docs/project-roadmap.md \
            docs/calendar/implementation-roadmap.md \
            docs/calendar/acquisition-control-plane-implementation-plan.md \
            docs/calendar/manual-nar-incremental-collection.md \
            docs/calendar/nar-a-plus-pilot-plan.md \
            docs/calendar/README.md
          if git diff --cached --quiet; then
            echo "Documentation state already current."
            exit 0
          fi
          git commit -m "[CF-Pages-Skip] Advance NAR Actions control-plane state"
          git push origin HEAD:work/nar-actions-manual-dispatch
