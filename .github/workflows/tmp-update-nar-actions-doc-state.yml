name: Temporary NAR Actions docs cleanup

on:
  push:
    branches:
      - work/nar-actions-manual-dispatch

permissions:
  contents: write

concurrency:
  group: tmp-update-nar-actions-doc-state
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/nar-actions-manual-dispatch
      - name: Remove temporary documentation updater files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/tmp-update-nar-actions-doc-state.yml \
            scripts/tmp-update-nar-actions-doc-state.mjs \
            scripts/tmp-clean-doc-diff-whitespace.mjs
          git commit -m "[CF-Pages-Skip] Remove temporary NAR Actions docs updater"
          git push origin HEAD:work/nar-actions-manual-dispatch
