name: Temporary UAE PILOT-06 profile sync

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - work/calendar-uae-era-profile-foundation

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/calendar-uae-era-profile-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Apply UAE PILOT-06 profile synchronization
        run: node scripts/temporary-sync-uae-pilot-06-profile.mjs
      - name: Apply UAE PILOT-06 checker patch
        run: node scripts/temporary-patch-uae-pilot-06-checker.mjs
      - name: Apply UAE PILOT-06 Acquisition checker patch
        run: node scripts/temporary-patch-uae-pilot-06-acquisition-checker.mjs
      - name: Validate UAE PILOT-06 synchronized foundation
        shell: bash
        run: |
          set +e
          node scripts/check-calendar-uae-era-pilot-06-profile-foundation.mjs 2>&1 | tee /tmp/uae-pilot-06-foundation-check.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"
      - name: Upload foundation checker diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uae-pilot-06-foundation-check-${{ github.run_id }}
          path: /tmp/uae-pilot-06-foundation-check.log
          if-no-files-found: warn
          retention-days: 7
      - name: Validate Acquisition Registry
        run: node scripts/check-calendar-acquisition-registry.mjs
      - name: Validate runner compatibility
        run: node scripts/check-calendar-runner-compatibility.mjs
      - name: Validate governance docs
        run: node scripts/check-project-governance-docs.mjs
      - name: Commit synchronized state when needed
        run: |
          if git diff --quiet; then
            echo "No synchronization changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/static/racecourses-extensions.json \
            data/static/calendar-readiness-registry.json \
            data/static/calendar-acquisition-registry.json \
            data/static/calendar-runner-compatibility-contract-v1.json \
            scripts/check-calendar-uae-era-pilot-06-profile-foundation.mjs \
            scripts/check-calendar-acquisition-registry.mjs
          git commit -m "[CF-Pages-Skip] Activate UAE PILOT-06 profile foundation"
          git push origin HEAD:work/calendar-uae-era-profile-foundation
