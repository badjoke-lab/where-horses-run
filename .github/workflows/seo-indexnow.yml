name: SEO IndexNow

on:
  push:
    branches:
      - main
    paths:
      - 'data/generated/timetable/public/meeting-list.json'
      - 'data/generated/timetable/public/meeting-details.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-indexnow
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Submit changed public URLs to IndexNow
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          node scripts/indexnow-changed-urls.mjs \
            --before="${BEFORE_SHA}" \
            --after="${AFTER_SHA}" \
            --submit
