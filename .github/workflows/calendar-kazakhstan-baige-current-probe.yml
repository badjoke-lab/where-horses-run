name: Kazakhstan Baige current Calendar probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/calendar-kazakhstan-baige-current-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Probe Baige Federation official routes
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (compatible; WhereHorsesRun/1.0; +https://github.com/badjoke-lab/where-horses-run)'
          mkdir -p /tmp/baige
          for item in \
            'home-kz|https://baigefederation.kz/kz' \
            'home-ru|https://baigefederation.kz/ru' \
            'robots|https://baigefederation.kz/robots.txt' \
            'sitemap|https://baigefederation.kz/sitemap.xml'; do
            name="${item%%|*}"
            url="${item#*|}"
            out="/tmp/baige/$name.out"
            hdr="/tmp/baige/$name.headers"
            code="$(curl -L -sS -D "$hdr" -A "$UA" --connect-timeout 15 --max-time 45 -o "$out" -w '%{http_code}' "$url" || true)"
            final="$(curl -L -sS -A "$UA" --connect-timeout 15 --max-time 45 -o /dev/null -w '%{url_effective}' "$url" || true)"
            echo "BAIGE_PAGE name=$name HTTP=$code BYTES=$(wc -c < "$out" 2>/dev/null || echo 0) FINAL=$final"
            grep -iE '^(content-type:|server:|location:)' "$hdr" | tail -n 10 | sed "s/^/HEADER $name /" || true
          done

      - name: Inspect Baige calendar text and links
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html,re
          from pathlib import Path
          for name in ['home-kz','home-ru','sitemap']:
              p=Path('/tmp/baige')/(name+'.out')
              raw=p.read_text(errors='replace') if p.exists() else ''
              text=re.sub(r'<script\b[^>]*>.*?</script>',' ',raw,flags=re.I|re.S)
              text=re.sub(r'<style\b[^>]*>.*?</style>',' ',text,flags=re.I|re.S)
              text=html.unescape(re.sub(r'<[^>]+>',' ',text))
              text=re.sub(r'\s+',' ',text).strip()
              print('BAIGE_TEXT',name,text[:12000])
              for needle in ['2026','күнтізбе','календар','жарыс','скач','Алматы','Астана','Шымкент','Қостанай','Костанай','Талдықорған','Талдыкорган','ипподром']:
                  pos=text.lower().find(needle.lower())
                  if pos>=0:
                      print('BAIGE_MATCH',name,needle,text[max(0,pos-500):pos+5200])
              seen=set()
              for m in re.finditer(r'(?:href|src)=["\']([^"\']+)["\']',raw,re.I):
                  u=html.unescape(m.group(1))
                  low=u.lower()
                  if any(k in low for k in ['2026','calendar','kalendar','kalend','event','race','baige','api','news','article','champ','chemp','turnir']):
                      if u not in seen:
                          seen.add(u); print('BAIGE_LINK',name,u)
          PY

      - name: Inspect structured data and JS API hints
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html,re
          from pathlib import Path
          raw=Path('/tmp/baige/home-kz.out').read_text(errors='replace')
          for label,pat in [
            ('JSONLD',r'<script[^>]+type=["\']application/ld\+json["\'][^>]*>(.*?)</script>'),
            ('NEXTDATA',r'<script[^>]+id=["\']__NEXT_DATA__["\'][^>]*>(.*?)</script>'),
            ('SCRIPT',r'<script[^>]+src=["\']([^"\']+)["\']')
          ]:
              count=0
              for m in re.finditer(pat,raw,re.I|re.S):
                  s=html.unescape(m.group(1)).strip()
                  if label=='SCRIPT' and not any(k in s.lower() for k in ['next','app','main','chunk','api','calendar','event']): continue
                  print(label,s[:12000].replace('\n',' '))
                  count+=1
                  if count>=80: break
          PY

      - name: Probe discovered scripts for API endpoints
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (compatible; WhereHorsesRun/1.0; +https://github.com/badjoke-lab/where-horses-run)'
          python3 - <<'PY' > /tmp/baige/scripts.txt
          import html,re
          from urllib.parse import urljoin
          raw=open('/tmp/baige/home-kz.out',errors='replace').read()
          seen=[]
          for m in re.finditer(r'<script[^>]+src=["\']([^"\']+)["\']',raw,re.I):
              u=urljoin('https://baigefederation.kz/kz',html.unescape(m.group(1)))
              if u not in seen: seen.append(u)
          print('\n'.join(seen[:80]))
          PY
          n=0
          while IFS= read -r url; do
            [ -n "$url" ] || continue
            n=$((n+1))
            out="/tmp/baige/script-$n.js"
            code="$(curl -L -sS -A "$UA" --connect-timeout 10 --max-time 40 -o "$out" -w '%{http_code}' "$url" || true)"
            echo "SCRIPT_FETCH index=$n HTTP=$code BYTES=$(wc -c < "$out" 2>/dev/null || echo 0) URL=$url"
            python3 - "$out" <<'PY'
          import re,sys
          raw=open(sys.argv[1],errors='replace').read()
          pats=[
            r'https?://[^"\'\s)]+',
            r'["\']([^"\']*(?:api|calendar|event|race|championship|tournament|news)[^"\']*)["\']'
          ]
          seen=set()
          for pat in pats:
              for m in re.finditer(pat,raw,re.I):
                  s=m.group(1) if m.lastindex else m.group(0)
                  if 5<len(s)<700 and s not in seen:
                      seen.add(s); print('API_HINT',s)
                      if len(seen)>=120: raise SystemExit
          PY
          done < /tmp/baige/scripts.txt

      - name: Probe Baige 2026 stage pages
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (compatible; WhereHorsesRun/1.0; +https://github.com/badjoke-lab/where-horses-run)'
          mkdir -p /tmp/baige-stages
          python3 - <<'PY' > /tmp/baige-stages/urls.txt
          import html,re
          from pathlib import Path
          from urllib.parse import urljoin
          seen=[]
          for source in ['/tmp/baige/home-kz.out','/tmp/baige/sitemap.out']:
              raw=Path(source).read_text(errors='replace')
              for m in re.finditer(r'(?:href=["\']([^"\']+)["\']|<loc>([^<]+)</loc>)',raw,re.I):
                  u=html.unescape(next(x for x in m.groups() if x))
                  u=urljoin('https://baigefederation.kz/kz',u)
                  low=u.lower()
                  if 'baigefederation.kz' in low and ('2026' in low or any(k in low for k in ['ekibastuz','pavlodar','zaysan','aktobe','kostanay','taldykorgan','kyzylorda'])):
                      if u not in seen: seen.append(u)
          # Add cautious same-site guesses for city-labelled stages; 404s are evidence only.
          for slug in ['kyzylorda-2026','taldykorgan-2026','ekibastuz-2026','pavlodar-2026','zaysan-2026','aktobe-2026','kostanay-2026','final-2026']:
              u='https://baigefederation.kz/kz/'+slug
              if u not in seen: seen.append(u)
          print('\n'.join(seen[:80]))
          PY
          n=0
          while IFS= read -r url; do
            [ -n "$url" ] || continue
            n=$((n+1))
            out="/tmp/baige-stages/$n.html"
            code="$(curl -L -sS -A "$UA" --connect-timeout 10 --max-time 40 -o "$out" -w '%{http_code}' "$url" || true)"
            echo "STAGE_PAGE index=$n HTTP=$code BYTES=$(wc -c < "$out" 2>/dev/null || echo 0) URL=$url"
            if [ "$code" = "200" ]; then
              python3 - "$out" "$url" <<'PY'
          import html,re,sys
          raw=open(sys.argv[1],errors='replace').read()
          text=re.sub(r'<script\b[^>]*>.*?</script>',' ',raw,flags=re.I|re.S)
          text=re.sub(r'<style\b[^>]*>.*?</style>',' ',text,flags=re.I|re.S)
          text=html.unescape(re.sub(r'<[^>]+>',' ',text))
          text=re.sub(r'\s+',' ',text).strip()
          print('STAGE_TEXT',sys.argv[2],text[:9000])
          for needle in ['2026','ипподром','Ипподром','мекен','Мекен','өтетін','орны','Адрес','адрес','Кызылорда','Талдықорған','Екібастұз','Павлодар','Зайсан','Ақтөбе','Қостанай']:
              p=text.lower().find(needle.lower())
              if p>=0: print('STAGE_MATCH',needle,text[max(0,p-400):p+2600])
          for m in re.finditer(r'<iframe[^>]+src=["\']([^"\']+)["\']',raw,re.I):
              print('STAGE_IFRAME',html.unescape(m.group(1)))
          for m in re.finditer(r'https?://[^"\'<> ]+',raw,re.I):
              u=html.unescape(m.group(0))
              if any(k in u.lower() for k in ['maps','google','2gis','yandex','geo','map']):
                  print('STAGE_MAP_URL',u[:1500])
          PY
            fi
          done < /tmp/baige-stages/urls.txt
