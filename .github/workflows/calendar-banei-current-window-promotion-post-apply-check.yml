name: Calendar Banei promotion post-apply check

on:
  pull_request:
    paths:
      - 'data/audits/calendar-banei-current-window-promotion-apply-v1.json'
      - 'data/audits/calendar-banei-current-window-promotion-proposal-v1.json'
      - 'data/audits/calendar-banei-current-window-readiness-activation-proposal-v1.json'
      - 'data/candidates/banei-current-window-c-schedule-approved.json'
      - 'data/candidates/banei-current-window-a-plus-approved.json'
      - 'data/static/calendar-readiness-registry.json'
      - 'data/generated/timetable/canonical/meetings.json'
      - 'data/generated/timetable/canonical/meeting-details.json'
      - 'data/generated/timetable/public/meeting-list.json'
      - 'data/generated/timetable/public/meeting-details.json'
      - 'scripts/check-calendar-pipeline-v1-public-projection.mjs'
      - 'scripts/check-calendar-japan-current-window-operations.mjs'
      - 'scripts/check-calendar-banei-current-window-acquisition.mjs'
      - 'scripts/check-calendar-banei-current-window-promotion-review.mjs'
      - 'scripts/timetable/build-banei-current-window-spec.mjs'
      - '.github/workflows/calendar-banei-current-window-acquisition.yml'
      - '.github/workflows/calendar-banei-current-window-promotion-post-apply-check.yml'
  workflow_dispatch:

concurrency:
  group: calendar-banei-promotion-post-apply-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  validate-post-apply-state:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Detect committed reviewed application
        id: applied
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const required = [
            'data/candidates/banei-current-window-c-schedule-approved.json',
            'data/candidates/banei-current-window-a-plus-approved.json',
            'data/audits/calendar-banei-current-window-readiness-activation-proposal-v1.json'
          ];
          let applied = required.every((file) => fs.existsSync(file));
          if (applied) {
            const registry = JSON.parse(fs.readFileSync('data/static/calendar-readiness-registry.json', 'utf8'));
            const proposal = JSON.parse(fs.readFileSync('data/audits/calendar-banei-current-window-readiness-activation-proposal-v1.json', 'utf8'));
            const current = registry.records.find((record) => record.authority_source_key === proposal.authority_source_key);
            const normalizedAfter = { ...proposal.after, implementation_status: 'candidate_active' };
            applied = JSON.stringify(current) === JSON.stringify(normalizedAfter);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `value=${applied ? 'true' : 'false'}\n`);
          console.log(`BANEI_REVIEWED_APPLICATION_COMMITTED: ${applied}`);
          NODE
      - name: Download exact reviewed proposal
        if: steps.applied.outputs.value == 'false'
        uses: actions/download-artifact@v4
        with:
          name: banei-current-window-promotion-proposal-29277596978
          path: /tmp/banei-reviewed-proposal
          github-token: ${{ github.token }}
          repository: badjoke-lab/where-horses-run
          run-id: 29277596978
      - name: Apply proposal in read-only workspace
        if: steps.applied.outputs.value == 'false'
        run: |
          proposal_dir="$(find /tmp/banei-reviewed-proposal -type f -name promotion-proposal.json -printf '%h\n' | head -1)"
          if [ -z "$proposal_dir" ]; then
            echo 'Banei promotion proposal directory missing'
            exit 1
          fi
          cp "$proposal_dir/approved-c-schedule-candidate.json" data/candidates/banei-current-window-c-schedule-approved.json
          cp "$proposal_dir/approved-a-plus-detail-candidate.json" data/candidates/banei-current-window-a-plus-approved.json
          cp "$proposal_dir/promotion-proposal.json" data/audits/calendar-banei-current-window-promotion-proposal-v1.json
          cp "$proposal_dir/promotion-summary.json" data/audits/calendar-banei-current-window-promotion-summary-v1.json
          cp "$proposal_dir/reviewed-readiness-activation.json" data/audits/calendar-banei-current-window-readiness-activation-proposal-v1.json
          cp "$proposal_dir/proposed-canonical-meetings.json" data/generated/timetable/canonical/meetings.json
          cp "$proposal_dir/proposed-canonical-meeting-details.json" data/generated/timetable/canonical/meeting-details.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const registryPath = 'data/static/calendar-readiness-registry.json';
          const registry = JSON.parse(fs.readFileSync(registryPath, 'utf8'));
          const proposal = JSON.parse(fs.readFileSync('data/audits/calendar-banei-current-window-readiness-activation-proposal-v1.json', 'utf8'));
          const index = registry.records.findIndex((record) => record.authority_source_key === proposal.authority_source_key);
          if (index < 0) throw new Error('Banei schedule Readiness record is missing');
          if (JSON.stringify(registry.records[index]) !== JSON.stringify(proposal.before)) throw new Error('Banei schedule Readiness before-state differs');
          registry.records[index] = proposal.after;
          fs.writeFileSync(registryPath, `${JSON.stringify(registry, null, 2)}\n`);
          NODE
          node scripts/timetable/build-public-timetable-view.mjs
          node scripts/timetable/build-japan-a-plus-public-overrides.mjs
          node scripts/timetable/build-operations-status.mjs --reference-date=2026-07-02
          node scripts/timetable/build-operations-review-package.mjs
      - name: Validate committed Banei state
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const audit = JSON.parse(fs.readFileSync('data/audits/calendar-banei-current-window-promotion-apply-v1.json', 'utf8'));
          const cCandidate = JSON.parse(fs.readFileSync(audit.apply_scope.approved_c_candidate_path, 'utf8'));
          const aPlusCandidate = JSON.parse(fs.readFileSync(audit.apply_scope.approved_a_plus_candidate_path, 'utf8'));
          const readinessRegistry = JSON.parse(fs.readFileSync(audit.apply_scope.readiness_registry_path, 'utf8'));
          const readiness = readinessRegistry.records.find((record) => record.authority_source_key === audit.apply_scope.readiness_source_key);
          const canonicalMeetings = new Map(JSON.parse(fs.readFileSync(audit.apply_scope.canonical_meetings_path, 'utf8')).meetings.map((record) => [record.meeting_id, record]));
          const canonicalDetails = new Map(JSON.parse(fs.readFileSync(audit.apply_scope.canonical_details_path, 'utf8')).details.map((record) => [record.meeting_id, record]));
          const publicMeetings = new Map(JSON.parse(fs.readFileSync(audit.apply_scope.public_meetings_path, 'utf8')).meetings.map((record) => [record.meeting_id, record]));
          const publicDetails = new Map(JSON.parse(fs.readFileSync(audit.apply_scope.public_details_path, 'utf8')).details.map((record) => [record.meeting_id, record]));
          if (readiness?.readiness !== 'prototype_ready' || readiness?.automation_mode !== 'semi_automatic' || readiness?.implementation_status !== 'candidate_active') throw new Error('Banei readiness after-state differs');
          if (cCandidate.records.length !== 12 || aPlusCandidate.records.length !== 1) throw new Error('Banei approved candidate counts differ');
          for (const record of cCandidate.records) {
            const canonical = canonicalMeetings.get(record.meeting_id);
            const publicMeeting = publicMeetings.get(record.meeting_id);
            if (canonical?.capability_rank !== 'C' || publicMeeting?.effective_public_rank !== 'C') throw new Error(`${record.meeting_id} C state differs`);
            if (canonicalDetails.has(record.meeting_id) || publicDetails.has(record.meeting_id) || publicMeeting.detail_path !== null) throw new Error(`${record.meeting_id} C detail exposure differs`);
          }
          const aPlus = aPlusCandidate.records[0];
          if (canonicalDetails.get(aPlus.meeting_id)?.timetable_rows.length !== 12 || publicDetails.get(aPlus.meeting_id)?.timetable_rows.length !== 12) throw new Error('Banei A+ row count differs');
          console.log('BANEI_COMMITTED_POST_APPLY_STATE: pass');
          NODE
      - name: Validate deterministic derived artifacts
        run: |
          node scripts/timetable/build-public-timetable-view.mjs --check
          node scripts/timetable/build-japan-a-plus-public-overrides.mjs --check
          node scripts/check-calendar-pipeline-v1-release-gate.mjs
          node scripts/check-calendar-operations-status.mjs
          node scripts/check-calendar-operations-review-package.mjs
      - name: Install dependencies and run full repository check
        run: |
          npm install --package-lock=false --no-audit --no-fund
          npm run check
      - name: Prove repository source branch unchanged
        if: always()
        run: |
          changes="$(git status --porcelain --untracked-files=all)"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            exit 1
          fi
