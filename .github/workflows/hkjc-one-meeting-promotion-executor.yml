name: HKJC one-meeting promotion executor

on:
  push:
    branches:
      - promote/hkjc-2026-09-06-sha-tin-a-plus
    paths:
      - '.github/workflows/hkjc-one-meeting-promotion-executor.yml'
      - 'data/candidates/hkjc-2026-09-06-sha-tin-a-plus-approved.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: promote/hkjc-2026-09-06-sha-tin-a-plus
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Promote exact reviewed candidate
        run: |
          node scripts/timetable/promote-timetable.mjs --input data/candidates/hkjc-2026-09-06-sha-tin-a-plus-approved.json
          node scripts/timetable/build-public-timetable-view.mjs
      - name: Commit only generated timetable outputs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/generated/timetable/canonical/meetings.json \
            data/generated/timetable/canonical/meeting-details.json \
            data/generated/timetable/public/meeting-list.json \
            data/generated/timetable/public/meeting-details.json
          git diff --cached --check
          git diff --cached --quiet && { echo 'No promotion delta produced'; exit 1; }
          git commit -m 'Promote HKJC Sha Tin 2026-09-06 to A+'
          git push origin HEAD:promote/hkjc-2026-09-06-sha-tin-a-plus
