name: Temporary Operations v2 finalizer

on:
  pull_request:
    paths:
      - '.github/workflows/temp-operations-v2-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Ensure publication summary validation is present
        run: |
          if ! grep -q "publication summary state invalid" scripts/timetable/operations-v2.mjs; then
            node scripts/fix-operations-v2-publication-validation.mjs
          fi
      - name: Validate Operations v2 before cleanup
        run: node scripts/check-calendar-operations-v2.mjs
      - name: Remove temporary artifacts
        run: |
          git rm -f --ignore-unmatch \
            scripts/fix-operations-v2-publication-validation.mjs \
            .github/workflows/temp-operations-v2-publication-fix.yml \
            .github/workflows/temp-operations-v2-finalize.yml \
            scripts/update-calendar-operations-v2-doc-state.mjs \
            .github/workflows/temp-calendar-operations-v2-doc-state.yml \
            .github/workflows/temp-operations-v2-cleanup.yml
      - name: Commit final Operations v2 state
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/timetable/operations-v2.mjs
          git commit -m "[CF-Pages-Skip] Finalize Operations v2 validation"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
