name: Temporary apply map mobile card patch

on:
  push:
    branches:
      - fix/map-mobile-card-dismiss-scroll-20260906

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/map-mobile-card-dismiss-scroll-20260906

      - name: Apply mobile card interaction patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing expected block in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          race = 'src/components/RacecourseMap.astro'
          replace_once(
              race,
              """      let selectedFeatureId = null;\n      let visibleRacecourseIds = new Set(allowedVisibleIds);\n\n      const setSelected = (racecourseId, emit = true) => {\n        const feature = featureByRacecourseId.get(racecourseId);\n        if (!feature || !visibleRacecourseIds.has(racecourseId)) return;\n        if (selectedFeatureId !== null) {\n          map.setFeatureState({ source: MAP_SOURCE, id: selectedFeatureId }, { selected: false });\n        }\n        selectedFeatureId = feature.id;\n        map.setFeatureState({ source: MAP_SOURCE, id: selectedFeatureId }, { selected: true });\n        root.dataset.selectedRacecourseId = racecourseId;\n        if (emit) {\n          root.dispatchEvent(new CustomEvent('racecourse-map:select', {\n            bubbles: true,\n            detail: { racecourseId }\n          }));\n        }\n      };\n""",
              """      let selectedFeatureId = null;\n      let visibleRacecourseIds = new Set(allowedVisibleIds);\n\n      const clearSelected = (emit = true) => {\n        const racecourseId = root.dataset.selectedRacecourseId || null;\n        if (selectedFeatureId !== null) {\n          try {\n            map.setFeatureState({ source: MAP_SOURCE, id: selectedFeatureId }, { selected: false });\n          } catch {\n            // The feature may have been re-clustered or removed from the visible source.\n          }\n        }\n        selectedFeatureId = null;\n        delete root.dataset.selectedRacecourseId;\n        if (emit && racecourseId) {\n          root.dispatchEvent(new CustomEvent('racecourse-map:deselect', {\n            bubbles: true,\n            detail: { racecourseId }\n          }));\n        }\n      };\n\n      const setSelected = (racecourseId, emit = true, toggle = false) => {\n        const feature = featureByRacecourseId.get(racecourseId);\n        if (!feature || !visibleRacecourseIds.has(racecourseId)) return;\n        if (toggle && root.dataset.selectedRacecourseId === racecourseId) {\n          clearSelected(emit);\n          return;\n        }\n        if (selectedFeatureId !== null) {\n          map.setFeatureState({ source: MAP_SOURCE, id: selectedFeatureId }, { selected: false });\n        }\n        selectedFeatureId = feature.id;\n        map.setFeatureState({ source: MAP_SOURCE, id: selectedFeatureId }, { selected: true });\n        root.dataset.selectedRacecourseId = racecourseId;\n        if (emit) {\n          root.dispatchEvent(new CustomEvent('racecourse-map:select', {\n            bubbles: true,\n            detail: { racecourseId }\n          }));\n        }\n      };\n"""
          )

          replace_once(
              race,
              """        map.on('click', MAP_HIT_LAYER, (event) => {\n          const racecourseId = event.features?.[0]?.properties?.racecourse_id;\n          if (typeof racecourseId === 'string') setSelected(racecourseId, true);\n        });\n\n        ready = true;\n""",
              """        map.on('click', MAP_HIT_LAYER, (event) => {\n          const racecourseId = event.features?.[0]?.properties?.racecourse_id;\n          if (typeof racecourseId === 'string') setSelected(racecourseId, true, true);\n        });\n\n        map.on('click', (event) => {\n          if (!root.dataset.selectedRacecourseId) return;\n          const interactive = map.queryRenderedFeatures(event.point, {\n            layers: [MAP_CLUSTER_LAYER, MAP_HIT_LAYER]\n          });\n          if (interactive.length === 0) clearSelected(true);\n        });\n\n        ready = true;\n"""
          )

          replace_once(
              race,
              """        root.addEventListener('racecourse-map:focus', (event) => {\n          const racecourseId = event?.detail?.racecourseId;\n          if (typeof racecourseId === 'string') focusRacecourse(racecourseId);\n        });\n\n        root.dataset.mapState = 'ready';\n""",
              """        root.addEventListener('racecourse-map:focus', (event) => {\n          const racecourseId = event?.detail?.racecourseId;\n          if (typeof racecourseId === 'string') focusRacecourse(racecourseId);\n        });\n\n        root.addEventListener('racecourse-map:clear-selection', () => clearSelected(false));\n        document.addEventListener('keydown', (event) => {\n          if (event.key === 'Escape' && root.dataset.selectedRacecourseId) clearSelected(true);\n        });\n\n        root.dataset.mapState = 'ready';\n"""
          )

          for path, selector, hide_fn in [
              ('src/components/TodayMeetingMap.astro', 'data-today-map-close', 'hideSelected'),
              ('src/components/CalendarMeetingMap.astro', 'data-calendar-map-close', 'hideSelected'),
              ('src/components/HomeRacingMap.astro', 'data-home-map-close', 'clearSelected'),
          ]:
              p = Path(path)
              text = p.read_text()
              pattern = re.compile(r"        const clearMapSelection = \(racecourseId\) => \{.*?\n        \};", re.S)
              repl = """        const clearMapSelection = () => {\n          if (!(mapRoot instanceof HTMLElement)) return;\n          mapRoot.dispatchEvent(new CustomEvent('racecourse-map:clear-selection'));\n        };"""
              text, count = pattern.subn(repl, text, count=1)
              if count != 1:
                  raise SystemExit(f'clearMapSelection block not found in {path}')
              if path.endswith('HomeRacingMap.astro'):
                  old = """          mapRoot.addEventListener('racecourse-map:select', (event) => {\n            const racecourseId = event?.detail?.racecourseId;\n            if (typeof racecourseId === 'string') renderSelected(racecourseId);\n          });\n"""
                  new = old + "          mapRoot.addEventListener('racecourse-map:deselect', clearSelected);\n"
              else:
                  old = """        mapRoot.addEventListener('racecourse-map:select', (event) => {\n"""
                  idx = text.find(old)
                  if idx < 0:
                      raise SystemExit(f'select listener not found in {path}')
                  # Insert one deselect listener immediately before the existing select listener.
                  text = text[:idx] + f"        mapRoot.addEventListener('racecourse-map:deselect', {hide_fn});\n" + text[idx:]
                  p.write_text(text)
                  continue
              if old not in text:
                  raise SystemExit(f'home select listener not found in {path}')
              text = text.replace(old, new, 1)
              p.write_text(text)

          css = Path('src/styles/racecourse-map.css')
          text = css.read_text()
          old = """  .today-meeting-map__selected,\n  .calendar-map-switch__selected,\n  .home-racing-map__selected {\n    position: sticky;\n    bottom: var(--whr-space-2);\n    z-index: 3;\n    box-shadow: 0 0.35rem 1.2rem rgb(0 0 0 / 0.14);\n  }\n"""
          new = """  .today-meeting-map__selected,\n  .calendar-map-switch__selected,\n  .home-racing-map__selected {\n    position: relative;\n    z-index: 1;\n    box-shadow: 0 0.35rem 1.2rem rgb(0 0 0 / 0.14);\n  }\n\n  .today-meeting-map__selected,\n  .calendar-map-switch__selected {\n    padding-right: 3.75rem;\n  }\n\n  .today-meeting-map__selected .map-selected-card__close,\n  .calendar-map-switch__selected .map-selected-card__close {\n    position: absolute;\n    top: 0.5rem;\n    right: 0.5rem;\n    z-index: 1;\n    display: inline-flex;\n    align-items: center;\n    justify-content: center;\n    background: var(--whr-color-bg);\n  }\n"""
          if old not in text:
              raise SystemExit('mobile sticky selected-card block not found')
          css.write_text(text.replace(old, new, 1))
          PY

          git rm .github/workflows/apply-map-mobile-card-fix-temp.yml
          git config user.name badjoke-lab
          git config user.email badjoke.lab@gmail.com
          git add src/components/RacecourseMap.astro src/components/TodayMeetingMap.astro src/components/CalendarMeetingMap.astro src/components/HomeRacingMap.astro src/styles/racecourse-map.css
          git commit -m 'fix(map): make mobile selected cards dismiss naturally'
          git push origin HEAD:fix/map-mobile-card-dismiss-scroll-20260906
