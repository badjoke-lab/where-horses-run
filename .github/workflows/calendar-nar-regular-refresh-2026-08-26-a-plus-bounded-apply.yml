name: Calendar NAR August 26 A+ bounded apply

on:
  pull_request:
    paths:
      - '.github/workflows/calendar-nar-regular-refresh-2026-08-26-a-plus-bounded-apply.yml'
      - 'scripts/timetable/build-calendar-nar-regular-refresh-2026-08-26-a-plus-approved-candidates.mjs'

permissions:
  contents: write

concurrency:
  group: calendar-nar-august-26-a-plus-bounded-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact review head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Checkout exact daily-review source evidence
        uses: actions/checkout@v4
        with:
          ref: 087feda950f547e7cec13c3845dfdecba36164fa
          path: review-source
          sparse-checkout: |
            data/candidates/nar-incremental-batches/due-job-plan-2026-08-23-due-japan-nar-regular-refresh-001-run-001/batch.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Build exactly one newly reviewed A+ candidate
        env:
          WHR_NAR_REVIEW_BATCH: ${{ github.workspace }}/review-source/data/candidates/nar-incremental-batches/due-job-plan-2026-08-23-due-japan-nar-regular-refresh-001-run-001/batch.json
        run: node scripts/timetable/build-calendar-nar-regular-refresh-2026-08-26-a-plus-approved-candidates.mjs

      - name: Extend cumulative reviewed promotion contract
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'scripts/check-calendar-nar-incremental-v2-promotion-output-determinism.mjs';
          let text = fs.readFileSync(file, 'utf8');
          const constAnchor = "const septemberNarExtensionSeptember21Path = 'data/candidates/nar-horizon-extension-2026-09-21-approved.json';\n";
          if (!text.includes("const augustNarRegularRefreshAPlusThirdPath =")) {
            if (!text.includes(constAnchor)) throw new Error('determinism const anchor missing');
            text = text.replace(constAnchor, `${constAnchor}const augustNarRegularRefreshAPlusThirdPath = 'data/candidates/nar-regular-refresh-2026-08-26-a-plus-approved.json';\n`);
          }
          const sequenceAnchor = '  septemberNarExtensionSeptember21Path,\n];';
          if (!text.includes('  augustNarRegularRefreshAPlusThirdPath,\n];')) {
            if (!text.includes(sequenceAnchor)) throw new Error('determinism continuation anchor missing');
            text = text.replace(sequenceAnchor, '  septemberNarExtensionSeptember21Path,\n  augustNarRegularRefreshAPlusThirdPath,\n];');
          }
          const countAnchor = '  [septemberNarExtensionSeptember21Path, [3, 0]],\n]);';
          if (!text.includes('  [augustNarRegularRefreshAPlusThirdPath, [1, 1]],')) {
            if (!text.includes(countAnchor)) throw new Error('determinism count anchor missing');
            text = text.replace(countAnchor, '  [septemberNarExtensionSeptember21Path, [3, 0]],\n  [augustNarRegularRefreshAPlusThirdPath, [1, 1]],\n]);');
          }
          fs.writeFileSync(file, text);
          NODE

      - name: Validate and apply reviewed promotion
        run: |
          node scripts/timetable/promote-timetable.mjs --input data/candidates/nar-regular-refresh-2026-08-26-a-plus-approved.json --dry-run
          node scripts/timetable/promote-timetable.mjs --input data/candidates/nar-regular-refresh-2026-08-26-a-plus-approved.json

      - name: Rebuild deterministic public and operations projections
        run: |
          node scripts/timetable/build-public-timetable-view.mjs
          node scripts/timetable/build-japan-a-plus-public-overrides.mjs
          node scripts/timetable/build-operations-status.mjs --reference-date 2026-07-01
          node scripts/timetable/build-operations-review-package.mjs

      - name: Validate applied repository state
        run: |
          node scripts/validate-data.mjs
          node scripts/check-japan-a-plus-public-overrides.mjs
          node scripts/check-calendar-operations-status.mjs
          node scripts/check-calendar-operations-review-package.mjs

      - name: Verify exact one-record A+ publication boundary
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const id = 'nar-kasamatsu-racecourse-2026-08-26';
          const candidate = JSON.parse(fs.readFileSync('data/candidates/nar-regular-refresh-2026-08-26-a-plus-approved.json', 'utf8'));
          if (candidate.review?.status !== 'approved' || candidate.review?.promotion_target !== 'canonical-timetable-v0') throw new Error('review contract differs');
          if (candidate.records.length !== 1 || candidate.records[0].meeting_id !== id) throw new Error('reviewed A+ identity differs');
          const record = candidate.records[0];
          if (record.capability_rank !== 'A+') throw new Error('reviewed rank differs');
          if (record.timetable_rows?.length !== 10) throw new Error('reviewed row count differs');
          if (record.first_race_time_local !== '11:55' || record.last_race_time_local !== '17:00') throw new Error('reviewed first/last time differs');
          const forbidden = ['horse_name','jockey','trainer','odds','payout','result','prediction','raw_html','stream_url'];
          const serialized = JSON.stringify(record).toLowerCase();
          for (const field of forbidden) if (serialized.includes(field)) throw new Error(`reviewed record contains forbidden field ${field}`);

          const canonical = JSON.parse(fs.readFileSync('data/generated/timetable/canonical/meetings.json', 'utf8'));
          const details = JSON.parse(fs.readFileSync('data/generated/timetable/canonical/meeting-details.json', 'utf8'));
          const publicList = JSON.parse(fs.readFileSync('data/generated/timetable/public/meeting-list.json', 'utf8'));
          const publicDetails = JSON.parse(fs.readFileSync('data/generated/timetable/public/meeting-details.json', 'utf8'));
          const meeting = canonical.meetings.find((row) => row.meeting_id === id);
          const detail = details.details.find((row) => row.meeting_id === id);
          const publicMeeting = publicList.meetings.find((row) => row.meeting_id === id);
          const publicDetail = publicDetails.details.find((row) => row.meeting_id === id);
          if (meeting?.capability_rank !== 'A+') throw new Error('canonical rank differs');
          if (detail?.capability_rank !== 'A+' || detail.timetable_rows?.length !== 10) throw new Error('canonical detail differs');
          if ((publicMeeting?.effective_public_rank ?? publicMeeting?.capability_rank) !== 'A+') throw new Error('public rank differs');
          if ((publicDetail?.effective_public_rank ?? publicDetail?.capability_rank) !== 'A+' || publicDetail.timetable_rows?.length !== 10) throw new Error('public detail differs');
          if (meeting.first_race_time_local !== '11:55' || meeting.last_race_time_local !== '17:00') throw new Error('canonical first/last time differs');

          const status = JSON.parse(fs.readFileSync('data/generated/timetable/operations-status.json', 'utf8'));
          if (canonical.meetings.length !== 436) throw new Error(`expected 436 canonical meetings, got ${canonical.meetings.length}`);
          if (details.details.length !== 95) throw new Error(`expected 95 canonical details, got ${details.details.length}`);
          if (status.public_projection?.meeting_count !== 423) throw new Error(`expected 423 public meetings, got ${status.public_projection?.meeting_count}`);
          if (status.public_projection?.detail_count !== 95) throw new Error(`expected 95 public details, got ${status.public_projection?.detail_count}`);
          if (status.public_projection?.latest_meeting_date !== '2026-09-21') throw new Error(`expected horizon 2026-09-21, got ${status.public_projection?.latest_meeting_date}`);
          NODE

      - name: Verify cumulative NAR promotion determinism
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-calendar-nar-incremental-v2-promotion-output-determinism.mjs

      - name: Remove one-shot workflow and commit bounded output
        run: |
          git rm .github/workflows/calendar-nar-regular-refresh-2026-08-26-a-plus-bounded-apply.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            data/candidates/nar-regular-refresh-2026-08-26-a-plus-approved.json \
            data/generated/timetable/canonical/meetings.json \
            data/generated/timetable/canonical/meeting-details.json \
            data/generated/timetable/public/meeting-list.json \
            data/generated/timetable/public/meeting-details.json \
            data/generated/timetable/public/japan-a-plus-overrides.json \
            data/generated/timetable/operations-status.json \
            data/generated/timetable/operations-review-package.json \
            scripts/check-calendar-nar-incremental-v2-promotion-output-determinism.mjs
          git diff --cached --check
          git commit -m "Apply reviewed NAR August 26 A+ detail promotion"
          git push origin HEAD:post-v1-calendar-nar-a-plus-2026-08-26-review
