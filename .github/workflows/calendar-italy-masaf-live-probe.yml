name: Italy MASAF live probe

on:
  pull_request:
    paths:
      - '.github/workflows/calendar-italy-masaf-live-probe.yml'
      - 'scripts/timetable/italy-masaf-core.mjs'
      - 'scripts/timetable/run-italy-masaf-official-window.mjs'
      - 'scripts/check-italy-masaf-adapter.mjs'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate Italy adapter
        run: npm run validate:italy-masaf
      - name: Probe live MASAF 30-day window
        run: |
          mkdir -p .calendar-italy-probe
          node scripts/timetable/run-italy-masaf-official-window.mjs \
            --as-of=2026-09-25 \
            --days=30 \
            --gallop-output=.calendar-italy-probe/italy-gallop.json \
            --trot-output=.calendar-italy-probe/italy-trot.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          for (const file of ['italy-gallop.json','italy-trot.json']) {
            const data=JSON.parse(fs.readFileSync('.calendar-italy-probe/'+file,'utf8'));
            console.log(JSON.stringify({
              file,
              records:data.records.length,
              venues:[...new Set(data.records.map(r=>r.racecourse_id))].sort(),
              dates:[...new Set(data.records.map(r=>r.date))].sort(),
              diagnostics:data.diagnostics,
              discovery:data.discovery
            }));
          }
          NODE
