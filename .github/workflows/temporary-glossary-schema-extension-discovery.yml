name: Temporary glossary schema extension discovery

on:
  push:
    branches:
      - work/glossary-schema-extension
    paths:
      - 'scripts/audit-glossary-schema-extension.mjs'
      - '.github/workflows/temporary-glossary-schema-extension-discovery.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/audit-glossary-schema-extension.mjs'
      - '.github/workflows/temporary-glossary-schema-extension-discovery.yml'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Validate audit syntax
        run: node --check scripts/audit-glossary-schema-extension.mjs
      - name: Generate glossary schema discovery
        run: node scripts/audit-glossary-schema-extension.mjs --output=/tmp/glossary-schema-extension-discovery.json
      - name: Upload discovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: glossary-schema-extension-discovery-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: error
          path: /tmp/glossary-schema-extension-discovery.json
      - name: Prove repository clean
        run: |
          changes="$(git status --porcelain --untracked-files=all)"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            exit 1
          fi
