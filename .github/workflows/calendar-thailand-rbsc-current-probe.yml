name: Thailand RBSC current Calendar probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/calendar-thailand-rbsc-current-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Probe RBSC official event routes
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (compatible; WhereHorsesRun/1.0; +https://github.com/badjoke-lab/where-horses-run)'
          mkdir -p /tmp/rbsc
          for item in \
            'events|https://www.rbsc.org/events/' \
            'home|https://www.rbsc.org/' \
            'robots|https://www.rbsc.org/robots.txt' \
            'sitemap|https://www.rbsc.org/wp-sitemap.xml'; do
            name="${item%%|*}"
            url="${item#*|}"
            out="/tmp/rbsc/$name.out"
            code="$(curl -L -sS -A "$UA" --connect-timeout 15 --max-time 45 -o "$out" -w '%{http_code}' "$url" || true)"
            final="$(curl -L -sS -A "$UA" --connect-timeout 15 --max-time 45 -o /dev/null -w '%{url_effective}' "$url" || true)"
            echo "RBSC_PAGE name=$name HTTP=$code BYTES=$(wc -c < "$out" 2>/dev/null || echo 0) FINAL=$final"
          done

      - name: Inspect RBSC racing events and structured data
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html,re,json
          from pathlib import Path
          for name in ['events','home','sitemap']:
              raw=(Path('/tmp/rbsc')/(name+'.out')).read_text(errors='replace')
              text=re.sub(r'<script\b[^>]*>.*?</script>',' ',raw,flags=re.I|re.S)
              text=re.sub(r'<style\b[^>]*>.*?</style>',' ',text,flags=re.I|re.S)
              text=html.unescape(re.sub(r'<[^>]+>',' ',text))
              text=re.sub(r'\s+',' ',text).strip()
              print('RBSC_TEXT',name,text[:20000])
              for needle in ['Horse Racing','Racing','Race','October','November','December','2026','ราชกรีฑา','แข่งม้า']:
                  p=text.lower().find(needle.lower())
                  if p>=0:
                      print('RBSC_MATCH',name,needle,text[max(0,p-700):p+7500])
              links=[]
              for pat in [r'href=["\']([^"\']+)["\']',r'<loc>(.*?)</loc>']:
                  for m in re.finditer(pat,raw,re.I|re.S):
                      u=html.unescape(m.group(1)).strip()
                      low=u.lower()
                      if any(k in low for k in ['event','race','racing','horse','calendar','2026']):
                          if u not in links: links.append(u)
              for u in links[:260]: print('RBSC_LINK',name,u)

              for m in re.finditer(r'<script[^>]+type=["\']application/ld\+json["\'][^>]*>(.*?)</script>',raw,re.I|re.S):
                  s=html.unescape(m.group(1)).strip()
                  if any(k in s.lower() for k in ['event','race','horse']):
                      print('RBSC_JSONLD',name,s[:7000].replace('\n',' '))
          PY

      - name: Probe RBSC racing-specific surfaces
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (compatible; WhereHorsesRun/1.0; +https://github.com/badjoke-lab/where-horses-run)'
          mkdir -p /tmp/rbsc-racing
          for item in \
            'racing|https://www.rbsc.org/racing/' \
            'race-taxonomy-sitemap|https://www.rbsc.org/wp-sitemap-taxonomies-category_race-1.xml' \
            'events-sitemap|https://www.rbsc.org/wp-sitemap-posts-events-1.xml'; do
            name="${item%%|*}"
            url="${item#*|}"
            out="/tmp/rbsc-racing/$name.out"
            code="$(curl -L -sS -A "$UA" --connect-timeout 15 --max-time 45 -o "$out" -w '%{http_code}' "$url" || true)"
            final="$(curl -L -sS -A "$UA" --connect-timeout 15 --max-time 45 -o /dev/null -w '%{url_effective}' "$url" || true)"
            echo "RBSC_RACING_PAGE name=$name HTTP=$code BYTES=$(wc -c < "$out" 2>/dev/null || echo 0) FINAL=$final"
          done

      - name: Inspect RBSC racing-specific data
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html,re
          from pathlib import Path
          for name in ['racing','race-taxonomy-sitemap','events-sitemap']:
              raw=(Path('/tmp/rbsc-racing')/(name+'.out')).read_text(errors='replace')
              text=re.sub(r'<script\b[^>]*>.*?</script>',' ',raw,flags=re.I|re.S)
              text=re.sub(r'<style\b[^>]*>.*?</style>',' ',text,flags=re.I|re.S)
              text=html.unescape(re.sub(r'<[^>]+>',' ',text))
              text=re.sub(r'\s+',' ',text).strip()
              print('RBSC_RACING_TEXT',name,text[:26000])
              for needle in ['Race Meeting','Race Day','Racing Calendar','October','November','December','2026','แข่งม้า','วันแข่ง']:
                  p=text.lower().find(needle.lower())
                  if p>=0:
                      print('RBSC_RACING_MATCH',name,needle,text[max(0,p-800):p+9000])
              links=[]
              for pat in [r'href=["\']([^"\']+)["\']',r'<loc>(.*?)</loc>']:
                  for m in re.finditer(pat,raw,re.I|re.S):
                      u=html.unescape(m.group(1)).strip()
                      low=u.lower()
                      if any(k in low for k in ['race','racing','calendar','result','program','2026']):
                          if u not in links: links.append(u)
              for u in links[:320]: print('RBSC_RACING_LINK',name,u)
              for m in re.finditer(r'<script[^>]+type=["\']application/ld\+json["\'][^>]*>(.*?)</script>',raw,re.I|re.S):
                  s=html.unescape(m.group(1)).strip()
                  if any(k in s.lower() for k in ['race','racing','event']):
                      print('RBSC_RACING_JSONLD',name,s[:10000].replace('\n',' '))
          PY

      - name: Confirm RBSC physical venue
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (compatible; WhereHorsesRun/1.0; +https://github.com/badjoke-lab/where-horses-run)'
          mkdir -p /tmp/rbsc-location
          for item in \
            'contact|https://www.rbsc.org/contact/' \
            'about|https://www.rbsc.org/about/'; do
            name="${item%%|*}"
            url="${item#*|}"
            out="/tmp/rbsc-location/$name.out"
            code="$(curl -L -sS -A "$UA" --connect-timeout 15 --max-time 45 -o "$out" -w '%{http_code}' "$url" || true)"
            echo "RBSC_LOCATION_PAGE name=$name HTTP=$code BYTES=$(wc -c < "$out" 2>/dev/null || echo 0)"
          done
          python3 - <<'PY'
          import html,re
          from pathlib import Path
          for name in ['contact','about']:
              raw=(Path('/tmp/rbsc-location')/(name+'.out')).read_text(errors='replace')
              text=re.sub(r'<script\b[^>]*>.*?</script>',' ',raw,flags=re.I|re.S)
              text=re.sub(r'<style\b[^>]*>.*?</style>',' ',text,flags=re.I|re.S)
              text=html.unescape(re.sub(r'<[^>]+>',' ',text))
              text=re.sub(r'\s+',' ',text).strip()
              for needle in ['Henri Dunant','Pathum Wan','Bangkok','10330','Royal Bangkok Sports Club']:
                  p=text.lower().find(needle.lower())
                  if p>=0:
                      print('RBSC_LOCATION_TEXT',name,needle,text[max(0,p-700):p+3500])
          PY

      - name: Geocode RBSC official address
        shell: bash
        run: |
          set -euo pipefail
          UA='WhereHorsesRun/1.0 (+https://github.com/badjoke-lab/where-horses-run)'
          for q in \
            'Royal Bangkok Sports Club, Bangkok, Thailand' \
            '1 Henri Dunant Road, Pathum Wan, Bangkok 10330, Thailand'; do
            echo "RBSC_GEOCODE_QUERY $q"
            curl -L -sS -A "$UA" --get \
              --data-urlencode "q=$q" \
              --data 'format=jsonv2' \
              --data 'limit=5' \
              'https://nominatim.openstreetmap.org/search' |
            python3 -c "import json,sys; rows=json.load(sys.stdin); print('RBSC_GEOCODE_RESULTS',len(rows)); [print('RBSC_GEOCODE',json.dumps({k:r.get(k) for k in ['lat','lon','display_name','osm_type','osm_id','type','class']},ensure_ascii=False)) for r in rows]"
            sleep 1
          done
