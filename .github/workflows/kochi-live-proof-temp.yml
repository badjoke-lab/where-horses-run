name: Temporary Kochi official calendar live proof

on:
  pull_request:
    paths:
      - '.github/workflows/kochi-live-proof-temp.yml'
      - 'scripts/timetable/kochi-official-30d-discovery.mjs'
      - 'package.json'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install pinned parser dependency
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Run permanent Kochi adapter for current 30-day window
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { discoverKochiOfficial30d } from './scripts/timetable/kochi-official-30d-discovery.mjs';
          const dates = [];
          const cursor = new Date('2026-09-04T00:00:00Z');
          for (let index = 0; index < 30; index += 1) {
            dates.push(cursor.toISOString().slice(0, 10));
            cursor.setUTCDate(cursor.getUTCDate() + 1);
          }
          const result = await discoverKochiOfficial30d({ dates });
          console.log(JSON.stringify(result.completeness, null, 2));
          console.log(JSON.stringify(result.meetings, null, 2));
          const expected = [
            'nar-kochi-racecourse-2026-09-05',
            'nar-kochi-racecourse-2026-09-06',
            'nar-kochi-racecourse-2026-09-12',
            'nar-kochi-racecourse-2026-09-13',
            'nar-kochi-racecourse-2026-09-20',
            'nar-kochi-racecourse-2026-09-22',
            'nar-kochi-racecourse-2026-09-26',
            'nar-kochi-racecourse-2026-09-27',
            'nar-kochi-racecourse-2026-10-03',
          ];
          assert.equal(result.completeness.completeness, 'complete');
          assert.equal(result.completeness.failure_count, 0);
          assert.equal(result.completeness.parsed_meeting_count, 9);
          assert.equal(result.completeness.annual_calendar_bytes, 362689);
          assert.equal(result.completeness.annual_calendar_sha256, 'e706fde5d4ef7110923d586727900972bf02fc053befbaf48dba4e18fa4b63b3');
          assert.deepEqual(result.completeness.annual_parsed_months, ['2026-09', '2026-10']);
          assert.deepEqual(result.meetings.map((row) => row.meeting_id), expected);
          assert.ok(result.meetings.every((row) => row.venue_code === '31' && row.racecourse_id === 'kochi-racecourse'));
          NODE
