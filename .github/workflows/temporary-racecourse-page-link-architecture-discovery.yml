name: Temporary racecourse page link architecture discovery

on:
  push:
    branches:
      - work/racecourse-page-link-architecture
    paths:
      - 'scripts/audit-racecourse-page-link-architecture.mjs'
      - '.github/workflows/temporary-racecourse-page-link-architecture-discovery.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/audit-racecourse-page-link-architecture.mjs'
      - '.github/workflows/temporary-racecourse-page-link-architecture-discovery.yml'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Validate audit syntax
        run: node --check scripts/audit-racecourse-page-link-architecture.mjs
      - name: Install dependencies without lockfile mutation
        run: npm install --package-lock=false
      - name: Build static site
        run: npm run build
      - name: Generate page-link discovery
        run: node scripts/audit-racecourse-page-link-architecture.mjs --output=/tmp/racecourse-page-link-architecture-discovery.json
      - name: Upload discovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: racecourse-page-link-architecture-discovery-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: error
          path: /tmp/racecourse-page-link-architecture-discovery.json
      - name: Prove repository clean
        run: |
          changes="$(git status --porcelain --untracked-files=all)"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            exit 1
          fi
