name: Temporary refresh UAE operations status

on:
  pull_request:
  push:
    branches:
      - agent/uae-era-detail-recovery

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/uae-era-detail-recovery
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Regenerate deterministic operations status
        run: node scripts/timetable/build-operations-status.mjs --reference-date 2026-07-02
      - name: Validate Operations v1 and UAE recovery
        run: |
          set +e
          : > /tmp/operations-v1-refresh-validation.log
          status=0
          for command in \
            "node scripts/check-calendar-operations-status.mjs" \
            "node scripts/check-calendar-operations-v1-release-gate.mjs" \
            "node scripts/check-calendar-uae-era-detail-recovery.mjs" \
            "node scripts/check-calendar-acquisition-registry.mjs"
          do
            printf '\n$ %s\n' "$command" | tee -a /tmp/operations-v1-refresh-validation.log
            bash -lc "$command" 2>&1 | tee -a /tmp/operations-v1-refresh-validation.log
            current=${PIPESTATUS[0]}
            if [ "$current" -ne 0 ]; then status="$current"; fi
          done
          exit "$status"
      - name: Upload refresh diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operations-v1-refresh-diagnostics-${{ github.run_id }}
          path: /tmp/operations-v1-refresh-validation.log
          if-no-files-found: warn
          retention-days: 7
      - name: Remove temporary workflow and commit status
        run: |
          rm -f .github/workflows/temporary-refresh-uae-operations-status.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/generated/timetable/operations-status.json .github/workflows/temporary-refresh-uae-operations-status.yml
          git commit -m "Refresh operations status for UAE A-level capability"
          git push origin HEAD:agent/uae-era-detail-recovery
