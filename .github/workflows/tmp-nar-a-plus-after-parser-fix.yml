name: Temporary NAR A+ proof after parser fix

on:
  push:
    branches:
      - proof/nar-a-plus-after-parser-fix-20260905

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Run live Japan 30-day acquisition
        run: node scripts/timetable/run-japan-zero-based-30d.mjs --execution-date=2026-09-05 --scope=full
      - name: Print target reconciliation ranks
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('data/generated/timetable/japan-zero-based-30d-reconciliation.json', 'utf8'));
          const targets = new Set([
            'nar-kochi-racecourse-2026-09-05',
            'nar-kochi-racecourse-2026-09-06',
            'nar-saga-racecourse-2026-09-05',
            'banei-obihiro-racecourse-2026-09-07',
          ]);
          const rows = report.reconciliations
            .filter((row) => targets.has(row.meeting_id))
            .map(({ meeting_id, acquisition_group, outcome, reason, official_rank, public_rank }) => ({
              meeting_id, acquisition_group, outcome, reason: reason ?? null, official_rank, public_rank,
            }));
          if (rows.length !== targets.size) throw new Error(`Expected ${targets.size} target rows, got ${rows.length}`);
          console.log(JSON.stringify(rows, null, 2));
          NODE
