name: Temporary Calendar roadmap state checker updater

on:
  pull_request:
    paths:
      - 'scripts/update-calendar-roadmap-state-checkers.mjs'
      - '.github/workflows/temp-calendar-roadmap-state-checkers.yml'

permissions:
  contents: write

jobs:
  update:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Update stale Calendar roadmap-state checkers
        run: node scripts/update-calendar-roadmap-state-checkers.mjs
      - name: Commit checker synchronization
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/check-calendar-runner-compatibility.mjs \
            scripts/check-calendar-local-multi-job.mjs \
            scripts/check-calendar-operations-v1-release-gate.mjs
          git commit -m "[CF-Pages-Skip] Sync stale Calendar roadmap-state checkers"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
