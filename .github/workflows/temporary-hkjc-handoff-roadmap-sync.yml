name: Temporary HKJC handoff roadmap sync

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - work/calendar-hkjc-handoff-decision

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/calendar-hkjc-handoff-decision
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Apply HKJC handoff roadmap sync
        run: node scripts/temporary-sync-hkjc-handoff-roadmaps.mjs
      - name: Validate synchronized handoff state
        run: |
          node scripts/check-calendar-hkjc-handoff-decision.mjs
          node scripts/check-project-governance-docs.mjs
      - name: Commit synchronized roadmap state when needed
        run: |
          if git diff --quiet; then
            echo "No synchronization changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/project-roadmap.md docs/calendar/implementation-roadmap.md docs/calendar/README.md
          git commit -m "[CF-Pages-Skip] Sync HKJC handoff roadmap state"
          git push origin HEAD:work/calendar-hkjc-handoff-decision
