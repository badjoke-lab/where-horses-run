name: M6 mobile timetable UX

on:
  pull_request:
    paths:
      - 'src/styles/v1-mobile-qa.css'
      - 'src/components/TimetableMeetingList.astro'
      - 'scripts/check-m6-mobile-timetable-ux.mjs'
      - '.github/workflows/m6-mobile-timetable-ux.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - run: npm install --package-lock=false
      - run: npm run build
      - run: node scripts/check-m6-mobile-timetable-ux.mjs
      - run: git diff --exit-code
