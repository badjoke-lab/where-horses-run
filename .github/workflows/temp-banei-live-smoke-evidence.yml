name: Temporary Banei live smoke evidence

on:
  pull_request:
    paths:
      - '.github/workflows/temp-banei-live-smoke-evidence.yml'
      - 'scripts/timetable/summarize-banei-live-smoke-evidence.mjs'
      - 'scripts/check-calendar-banei-live-smoke-evidence.mjs'

permissions:
  contents: write

jobs:
  evidence:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Validate adapter before live source request
        run: node scripts/check-calendar-banei-detail-adapter.mjs

      - name: Collect bounded official Banei meeting
        run: |
          rm -rf .banei-live-evidence
          node scripts/timetable/collect-banei-detail-window.mjs \
            --input=data/fixtures/calendar-banei-control-plane-bridge-v1.json \
            --start-date=2026-07-04 \
            --end-date-exclusive=2026-07-05 \
            --batch-id=banei-live-evidence-2026-07-04 \
            --output-root=.banei-live-evidence \
            --delay-ms=140

      - name: Build public-safe evidence summary
        run: |
          node scripts/timetable/summarize-banei-live-smoke-evidence.mjs \
            --input-root=.banei-live-evidence \
            --output=data/fixtures/calendar-banei-live-smoke-evidence-v1.json
          node scripts/check-calendar-banei-live-smoke-evidence.mjs

      - name: Commit evidence summary only
        run: |
          rm -rf .banei-live-evidence
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fixtures/calendar-banei-live-smoke-evidence-v1.json
          if git diff --cached --quiet; then
            echo "Evidence summary already current."
            exit 0
          fi
          git commit -m "[CF-Pages-Skip] Record bounded Banei live smoke evidence"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
