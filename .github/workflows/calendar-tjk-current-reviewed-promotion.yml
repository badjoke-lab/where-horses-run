name: Calendar TJK current reviewed promotion

on:
  pull_request:
    paths:
      - 'data/candidates/tjk-current-2026-08-11-promotion-review-v1.json'
      - 'data/candidates/tjk-current-2026-08-11-approved.json'
      - 'data/static/tjk-2026-08-11-reviewed-public-timetable-identities-v1.json'
      - 'data/static/racecourses-public-timetable-identities-v1.json'
      - 'data/generated/timetable/canonical/meetings.json'
      - 'data/generated/timetable/canonical/meeting-details.json'
      - 'data/generated/timetable/public/meeting-list.json'
      - 'data/generated/timetable/public/meeting-details.json'
      - 'src/data/publicationDisplayPolicies.json'
      - 'docs/timetable-source-tests/03-turkey/implementation-status-2026-08-12.json'
      - 'scripts/timetable/build-tjk-current-approved-candidate.mjs'
      - 'scripts/timetable/manual-promote-reviewed-tjk-current.mjs'
      - 'scripts/check-tjk-public-timetable-identities.mjs'
      - 'scripts/check-tjk-current-reviewed-promotion.mjs'
      - '.github/workflows/calendar-tjk-current-reviewed-promotion.yml'
  push:
    branches:
      - main
    paths:
      - 'data/candidates/tjk-current-2026-08-11-promotion-review-v1.json'
      - 'data/candidates/tjk-current-2026-08-11-approved.json'
      - 'data/static/tjk-2026-08-11-reviewed-public-timetable-identities-v1.json'
      - 'data/static/racecourses-public-timetable-identities-v1.json'
      - 'data/generated/timetable/canonical/meetings.json'
      - 'data/generated/timetable/canonical/meeting-details.json'
      - 'data/generated/timetable/public/meeting-list.json'
      - 'data/generated/timetable/public/meeting-details.json'
      - 'src/data/publicationDisplayPolicies.json'
      - 'docs/timetable-source-tests/03-turkey/implementation-status-2026-08-12.json'
      - 'scripts/timetable/build-tjk-current-approved-candidate.mjs'
      - 'scripts/timetable/manual-promote-reviewed-tjk-current.mjs'
      - 'scripts/check-tjk-public-timetable-identities.mjs'
      - 'scripts/check-tjk-current-reviewed-promotion.mjs'
      - '.github/workflows/calendar-tjk-current-reviewed-promotion.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Validate reviewed approval binding
        run: node scripts/check-tjk-current-promotion-review.mjs
      - name: Validate reviewed public identities
        run: node scripts/check-tjk-public-timetable-identities.mjs
      - name: Validate approved candidate determinism
        run: node scripts/timetable/build-tjk-current-approved-candidate.mjs --check
      - name: Validate canonical promotion determinism
        run: node scripts/timetable/promote-approved-candidate-v1.mjs --input data/candidates/tjk-current-2026-08-11-approved.json --check
      - name: Validate public projection determinism
        run: node scripts/timetable/build-public-timetable-view.mjs --check
      - name: Validate exact reviewed TJK publication
        run: node scripts/check-tjk-current-reviewed-promotion.mjs
      - name: Validate implementation status
        run: node scripts/check-tjk-current-promotion-review-status.mjs
      - name: Validate runtime import boundary
        run: node scripts/check-calendar-runtime-import-boundary.mjs
      - name: Prove no deployment or automatic merge capability
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const files = [
            'data/candidates/tjk-current-2026-08-11-promotion-review-v1.json',
            'data/static/tjk-2026-08-11-reviewed-public-timetable-identities-v1.json'
          ];
          for (const file of files) {
            const value = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (value.publication_boundary.automatic_approval !== false || value.publication_boundary.automatic_merge !== false || value.publication_boundary.deployment_performed !== false) process.exit(1);
          }
          NODE
      - name: Prove repository clean
        run: |
          changes="$(git status --porcelain --untracked-files=all)"
          if [ -n "$changes" ]; then
            echo "$changes" >&2
            exit 1
          fi
