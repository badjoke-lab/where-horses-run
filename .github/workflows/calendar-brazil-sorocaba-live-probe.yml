name: Brazil Sorocaba live probe

on:
  pull_request:
    paths:
      - '.github/workflows/calendar-brazil-sorocaba-live-probe.yml'
      - 'scripts/timetable/brazil-sorocaba-core.mjs'
      - 'scripts/timetable/run-brazil-sorocaba-official-window.mjs'
      - 'scripts/check-brazil-sorocaba-adapter.mjs'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Validate Sorocaba adapter
        run: npm run validate:brazil-sorocaba
      - name: Probe live 30-day Sorocaba window
        run: |
          mkdir -p .calendar-brazil-sorocaba-probe
          node scripts/timetable/run-brazil-sorocaba-official-window.mjs \
            --as-of=2026-09-26 \
            --days=30 \
            --output=.calendar-brazil-sorocaba-probe/sorocaba.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const d=JSON.parse(fs.readFileSync('.calendar-brazil-sorocaba-probe/sorocaba.json','utf8'));
          console.log(JSON.stringify({dates:d.records.map(r=>r.date),diagnostics:d.diagnostics,discovery:d.discovery}));
          if(d.diagnostics.source_errors.length||d.diagnostics.parse_failures.length) process.exitCode=1;
          for(const expected of ['2026-09-26','2026-10-10','2026-10-24']) if(!d.records.some(r=>r.date===expected)) process.exitCode=1;
          if(d.records.some(r=>r.first_race_time_local!==null||r.last_race_time_local!==null)) process.exitCode=1;
          NODE
