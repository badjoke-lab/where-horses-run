name: Calendar Banei Actions executor

on:
  pull_request:
    paths:
      - 'data/fixtures/calendar-banei-actions-executor-fixture-v1.json'
      - 'data/fixtures/calendar-collection-plans-v1.json'
      - 'data/fixtures/calendar-collection-job-invalid-cases-v1.json'
      - 'data/fixtures/calendar-collection-result-manifests-v1.json'
      - 'data/fixtures/calendar-collection-result-manifest-invalid-cases-v1.json'
      - 'data/fixtures/calendar-review-queue-v1.json'
      - 'data/fixtures/calendar-review-queue-invalid-cases-v1.json'
      - 'data/static/calendar-acquisition-registry.json'
      - 'data/static/calendar-runner-compatibility-contract-v1.json'
      - 'data/static/calendar-collection-result-manifest.schema.json'
      - 'data/static/calendar-review-queue.schema.json'
      - 'scripts/timetable/banei-actions-executor-core.mjs'
      - 'scripts/timetable/run-banei-actions-job.mjs'
      - 'scripts/timetable/run-calendar-actions-job.mjs'
      - 'scripts/timetable/actions-multi-job-core.mjs'
      - 'scripts/timetable/collection-result-manifest-validation.mjs'
      - 'scripts/timetable/review-queue-validation.mjs'
      - 'scripts/check-calendar-banei-actions-executor.mjs'
      - 'scripts/check-calendar-actions-multi-job.mjs'
      - 'scripts/check-calendar-runner-compatibility.mjs'
      - 'scripts/check-calendar-acquisition-registry.mjs'
      - 'scripts/check-calendar-collection-job.mjs'
      - 'scripts/check-calendar-collection-result-manifest.mjs'
      - 'scripts/check-calendar-review-queue.mjs'
      - 'docs/calendar/banei-actions-executor.md'
      - 'docs/calendar/collection-result-manifest.md'
      - 'docs/calendar/review-queue.md'
      - '.github/workflows/calendar-banei-actions-executor.yml'
  push:
    branches:
      - main
    paths:
      - 'data/fixtures/calendar-banei-actions-executor-fixture-v1.json'
      - 'data/fixtures/calendar-collection-plans-v1.json'
      - 'data/fixtures/calendar-collection-job-invalid-cases-v1.json'
      - 'data/fixtures/calendar-collection-result-manifests-v1.json'
      - 'data/fixtures/calendar-collection-result-manifest-invalid-cases-v1.json'
      - 'data/fixtures/calendar-review-queue-v1.json'
      - 'data/fixtures/calendar-review-queue-invalid-cases-v1.json'
      - 'data/static/calendar-acquisition-registry.json'
      - 'data/static/calendar-runner-compatibility-contract-v1.json'
      - 'data/static/calendar-collection-result-manifest.schema.json'
      - 'data/static/calendar-review-queue.schema.json'
      - 'scripts/timetable/banei-actions-executor-core.mjs'
      - 'scripts/timetable/run-banei-actions-job.mjs'
      - 'scripts/timetable/run-calendar-actions-job.mjs'
      - 'scripts/timetable/actions-multi-job-core.mjs'
      - 'scripts/timetable/collection-result-manifest-validation.mjs'
      - 'scripts/timetable/review-queue-validation.mjs'
      - 'scripts/check-calendar-banei-actions-executor.mjs'
      - 'scripts/check-calendar-actions-multi-job.mjs'
      - 'scripts/check-calendar-runner-compatibility.mjs'
      - 'scripts/check-calendar-acquisition-registry.mjs'
      - 'scripts/check-calendar-collection-job.mjs'
      - 'scripts/check-calendar-collection-result-manifest.mjs'
      - 'scripts/check-calendar-review-queue.mjs'
      - 'docs/calendar/banei-actions-executor.md'
      - 'docs/calendar/collection-result-manifest.md'
      - 'docs/calendar/review-queue.md'
      - '.github/workflows/calendar-banei-actions-executor.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Check Node syntax
        run: |
          node --check scripts/timetable/banei-actions-executor-core.mjs
          node --check scripts/timetable/run-banei-actions-job.mjs
          node --check scripts/timetable/run-calendar-actions-job.mjs
          node --check scripts/check-calendar-banei-actions-executor.mjs
          node --check scripts/check-calendar-collection-result-manifest.mjs
          node --check scripts/check-calendar-review-queue.mjs

      - name: Validate Banei Actions executor normalization and runtime fixture path
        run: node scripts/check-calendar-banei-actions-executor.mjs

      - name: Validate shared Actions planning and runner compatibility
        run: |
          node scripts/check-calendar-actions-multi-job.mjs
          node scripts/check-calendar-runner-compatibility.mjs

      - name: Validate Registry and Collection Job capability boundaries
        run: |
          node scripts/check-calendar-acquisition-registry.mjs
          node scripts/check-calendar-collection-job.mjs

      - name: Validate shared Manifest and Review Queue dependencies
        run: |
          node scripts/check-calendar-collection-result-manifest.mjs
          node scripts/check-calendar-review-queue.mjs

      - name: Validate current Banei Due-job policy
        run: node scripts/check-calendar-due-job-planner.mjs

      - name: Validate Calendar contracts and governance
        run: |
          node scripts/check-calendar-contracts.mjs
          node scripts/check-project-governance-docs.mjs

      - name: Validate runtime import boundary
        run: node scripts/check-calendar-runtime-import-boundary.mjs

      - name: Check diff formatting
        run: git diff --check
