name: Audit current public rank summary 2026-09-01

on:
  push:
    branches:
      - audit/public-rank-summary-20260901
    paths:
      - '.github/workflows/audit-public-rank-summary-20260901.yml'

permissions:
  contents: read

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Summarize public ranks by country and authority
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const data = JSON.parse(fs.readFileSync('data/generated/timetable/public/meeting-list.json','utf8'));
          const rows = Array.isArray(data.meetings) ? data.meetings : [];
          const by = new Map();
          for (const r of rows) {
            const key = `${r.country_id}\t${r.authority_id}`;
            if (!by.has(key)) by.set(key,{country_id:r.country_id,authority_id:r.authority_id,total:0,C:0,B:0,'B+':0,A:0,'A+':0,a_or_above:0});
            const x = by.get(key);
            const rank = r.effective_public_rank ?? r.capability_rank ?? 'C';
            x.total++;
            if (Object.hasOwn(x,rank)) x[rank]++;
            if (rank === 'A' || rank === 'A+') x.a_or_above++;
          }
          const out = {
            schema_version:'public-rank-summary-v1',
            generated_at:data.generated_at,
            meeting_count:rows.length,
            systems:[...by.values()].sort((a,b)=>a.country_id.localeCompare(b.country_id)||a.authority_id.localeCompare(b.authority_id))
          };
          fs.writeFileSync('/tmp/public-rank-summary.json',JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify(out,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: public-rank-summary-20260901
          path: /tmp/public-rank-summary.json
          if-no-files-found: error
          retention-days: 7
