name: Mauritius MTC fixtures live probe

on:
  pull_request:
    paths:
      - '.github/workflows/calendar-mauritius-mtc-live-probe.yml'
      - 'scripts/timetable/probe-mauritius-mtc-fixtures.mjs'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe official MTC fixtures
        run: node scripts/timetable/probe-mauritius-mtc-fixtures.mjs
