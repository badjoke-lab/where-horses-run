name: Canonical hreflang review gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'data/audits/canonical-hreflang-review-v1.json'
      - 'data/static/canonical-hreflang-review-contract-v1.json'
      - 'docs/seo/canonical-hreflang-review.md'
      - 'scripts/check-canonical-hreflang-review.mjs'
      - 'src/layouts/BaseLayout.astro'
      - '.github/workflows/canonical-hreflang-review.yml'
      - '.github/workflows/temporary-canonical-hreflang-discovery.yml'
  push:
    branches:
      - main
    paths:
      - 'data/audits/canonical-hreflang-review-v1.json'
      - 'data/static/canonical-hreflang-review-contract-v1.json'
      - 'docs/seo/canonical-hreflang-review.md'
      - 'scripts/check-canonical-hreflang-review.mjs'
      - 'src/layouts/BaseLayout.astro'
      - '.github/workflows/canonical-hreflang-review.yml'
      - '.github/workflows/temporary-canonical-hreflang-discovery.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install dependencies without generating a lockfile
        run: npm install --package-lock=false
      - name: Build complete static site
        run: npm run build
      - name: Preserve Phase 10 UX release contract
        run: node scripts/check-ux-polish-release.mjs
      - name: Preserve sitemap and robots contract
        run: node scripts/check-sitemap-robots.mjs
      - name: Preserve structured data baseline
        run: node scripts/check-structured-data-baseline.mjs
      - name: Preserve country page metadata
        run: node scripts/check-country-page-metadata.mjs
      - name: Preserve racecourse page metadata
        run: node scripts/check-racecourse-page-metadata.mjs
      - name: Preserve glossary page metadata
        run: node scripts/check-glossary-page-metadata.mjs
      - name: Preserve mobile language navigation
        run: node scripts/check-mobile-navigation-improvement.mjs
      - name: Validate canonical and hreflang review
        run: node scripts/check-canonical-hreflang-review.mjs
      - name: Prove repository clean
        run: |
          changes="$(git status --porcelain --untracked-files=all)"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            exit 1
          fi
