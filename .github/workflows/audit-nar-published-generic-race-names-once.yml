name: Audit published NAR generic race names once

on:
  push:
    branches:
      - fix/nar-published-race-name-repair
    paths:
      - '.github/workflows/audit-nar-published-generic-race-names-once.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Audit current public and canonical NAR details
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const generic = new Set(['特別','重賞','準重賞','一般','新馬','未勝利']);
          const publicData = JSON.parse(fs.readFileSync('data/generated/timetable/public/meeting-details.json','utf8'));
          const canonicalData = JSON.parse(fs.readFileSync('data/generated/timetable/canonical/meeting-details.json','utf8'));
          const publicDetails = publicData.details ?? [];
          const canonicalDetails = canonicalData.details ?? [];
          const affected = [];
          let badRows = 0;
          let missingAFields = 0;
          for (const meeting of publicDetails) {
            if (meeting.authority_id !== 'nar-local-government-racing') continue;
            const rows = meeting.timetable_rows ?? [];
            const bad = rows.filter((r) => generic.has(String(r.race_name ?? '').trim()));
            if (!bad.length) continue;
            badRows += bad.length;
            const aInvalid = rows.filter((r) => !String(r.label ?? '').trim() || !/^\d{2}:\d{2}$/.test(String(r.post_time_local ?? '')));
            missingAFields += aInvalid.length;
            affected.push({
              meeting_id: meeting.meeting_id,
              date: meeting.date,
              racecourse_id: meeting.racecourse_id,
              effective_public_rank: meeting.effective_public_rank,
              row_count: rows.length,
              bad_row_count: bad.length,
              bad_values: [...new Set(bad.map((r) => String(r.race_name).trim()))].sort(),
              a_field_failures: aInvalid.length,
              canonical_found: canonicalDetails.some((c) => c.meeting_id === meeting.meeting_id),
            });
          }
          affected.sort((a,b) => a.meeting_id.localeCompare(b.meeting_id));
          const canonicalMissing = affected.filter((x) => !x.canonical_found).length;
          console.log(JSON.stringify({
            public_generated_at: publicData.generated_at,
            canonical_generated_at: canonicalData.generated_at,
            affected_meeting_count: affected.length,
            generic_race_name_row_count: badRows,
            a_field_failure_row_count: missingAFields,
            canonical_missing_meeting_count: canonicalMissing,
            affected,
          }, null, 2));
          if (badRows === 0) throw new Error('audit expected existing generic NAR race names but found none');
          if (canonicalMissing !== 0) throw new Error('affected public meeting missing from canonical');
          NODE
