name: Calendar HKJC current best-available refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '11 1,7,13,19 * * *'
  push:
    branches:
      - main
      - fix/hkjc-kra-current-best-available-refresh
    paths:
      - '.github/workflows/calendar-hkjc-current-best-available-refresh.yml'
      - 'scripts/timetable/run-current-lower-rank-best-available.mjs'
      - 'scripts/timetable/run-hkjc-live-fixture-job.mjs'
      - 'scripts/timetable/hkjc-live-best-available-core.mjs'
      - 'scripts/timetable/collect-hkjc-fixture-artifacts.mjs'
      - 'data/static/calendar-acquisition-registry.json'
      - 'data/static/calendar-runner-compatibility-contract-v1.json'

permissions:
  contents: read

concurrency:
  group: calendar-hkjc-current-best-available-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Validate HKJC current best-available orchestrator
        run: node --check scripts/timetable/run-current-lower-rank-best-available.mjs
      - name: Record protected timetable hashes
        shell: bash
        run: |
          sha256sum \
            data/generated/timetable/canonical/meetings.json \
            data/generated/timetable/canonical/meeting-details.json \
            data/generated/timetable/public/meeting-list.json \
            data/generated/timetable/public/meeting-details.json \
            > /tmp/hkjc-current-best-available-before.sha256
      - name: Acquire HKJC current lower-rank meetings at best available rank
        run: |
          node scripts/timetable/run-current-lower-rank-best-available.mjs \
            --system=hkjc \
            --days=30 \
            --output-dir=/tmp/hkjc-current-best-available
      - name: Prove HKJC review-only publication boundary
        shell: bash
        run: |
          sha256sum -c /tmp/hkjc-current-best-available-before.sha256
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const summary = JSON.parse(fs.readFileSync('/tmp/hkjc-current-best-available/summary.json', 'utf8'));
          if (summary.system_id !== 'hong-kong-hkjc-system') throw new Error('HKJC summary system differs');
          if (summary.canonical_write !== false || summary.public_write !== false) throw new Error('HKJC refresh crossed publication boundary');
          if (summary.automatic_approval !== false || summary.automatic_promotion !== false) throw new Error('HKJC refresh crossed review boundary');
          if (summary.public_ceiling !== 'A') throw new Error('HKJC public ceiling differs');
          if (summary.source_error_count !== 0) throw new Error(`HKJC source errors: ${summary.source_error_count}`);
          console.log(JSON.stringify({
            selected_lower_rank_meeting_count: summary.selected_lower_rank_meeting_count,
            observed_rank_counts: summary.observed_rank_counts,
            upgrade_candidate_count: summary.upgrade_candidate_count,
            upgrade_candidates: summary.upgrade_candidates,
            public_ceiling: summary.public_ceiling,
            canonical_write: summary.canonical_write,
            public_write: summary.public_write,
          }, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hkjc-current-best-available-${{ github.run_id }}
          path: |
            /tmp/hkjc-current-best-available
            data/generated/timetable/actions-multi-job/
          retention-days: 14
