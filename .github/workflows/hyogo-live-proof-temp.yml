name: Temporary Hyogo live proof

on:
  pull_request:
    paths:
      - '.github/workflows/hyogo-live-proof-temp.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Inspect live Hyogo official calendar HTML
        run: |
          node --input-type=module <<'NODE'
          for (const url of ['https://www.sonoda-himeji.jp/schedule/2026/09','https://www.sonoda-himeji.jp/schedule/2026/10']) {
            const response = await fetch(url, { headers: { 'user-agent': 'Mozilla/5.0 (compatible; WhereHorsesRun/1.0)' } });
            const bytes = await response.arrayBuffer();
            const contentType = response.headers.get('content-type') ?? '';
            const text = new TextDecoder('utf-8').decode(bytes);
            console.log(`URL=${url} STATUS=${response.status} TYPE=${contentType} BYTES=${bytes.byteLength}`);
            if (!response.ok) throw new Error(`${url} -> ${response.status}`);
            const markers = [...text.matchAll(/(?:園田|姫路)競馬\d+回\d+日目/g)];
            console.log(`MARKERS=${markers.length}`);
            for (const marker of markers) {
              const start = Math.max(0, marker.index - 700);
              const end = Math.min(text.length, marker.index + marker[0].length + 300);
              console.log('---MARKER---');
              console.log(text.slice(start, end).replace(/\s+/g, ' '));
            }
          }
          NODE
