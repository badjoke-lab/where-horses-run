name: Temporary Calendar Result Manifest governance marker fixer

on:
  pull_request:
    paths:
      - 'scripts/fix-calendar-result-manifest-governance-marker.mjs'
      - '.github/workflows/temp-calendar-result-manifest-governance-marker.yml'

permissions:
  contents: write

jobs:
  update:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Fix governance compatibility marker
        run: node scripts/fix-calendar-result-manifest-governance-marker.mjs

      - name: Commit governance marker fix
        run: |
          if git diff --quiet; then
            echo "No documentation changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/calendar/machine-readable-contracts.md
          git commit -m "[CF-Pages-Skip] Align Result Manifest governance marker"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
