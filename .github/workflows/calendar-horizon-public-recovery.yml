name: Calendar horizon public recovery

on:
  pull_request:
    paths:
      - '.github/workflows/calendar-horizon-public-recovery.yml'
      - 'scripts/timetable/build-calendar-horizon-recovery-approved-candidates.mjs'
      - 'scripts/check-calendar-japan-current-window-operations.mjs'
      - 'data/candidates/jra-horizon-recovery-2026-08-01-through-2026-08-16.json'
      - 'data/candidates/banei-horizon-recovery-2026-08-15-through-2026-08-17.json'
      - 'data/candidates/nar-incremental-batches/**'
      - 'data/candidates/*horizon-recovery*approved.json'
      - 'data/generated/timetable/nar-incremental-batches/**'
      - 'data/generated/timetable/canonical/**'
      - 'data/generated/timetable/public/**'
      - 'data/generated/timetable/operations-status.json'
      - 'data/generated/timetable/operations-review-package.json'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/calendar-horizon-public-recovery.yml'
      - 'scripts/timetable/build-calendar-horizon-recovery-approved-candidates.mjs'
      - 'scripts/check-calendar-japan-current-window-operations.mjs'
      - 'data/candidates/jra-horizon-recovery-2026-08-01-through-2026-08-16.json'
      - 'data/candidates/banei-horizon-recovery-2026-08-15-through-2026-08-17.json'
      - 'data/candidates/nar-incremental-batches/**'
      - 'data/candidates/*horizon-recovery*approved.json'
      - 'data/generated/timetable/nar-incremental-batches/**'
      - 'data/generated/timetable/canonical/**'
      - 'data/generated/timetable/public/**'
      - 'data/generated/timetable/operations-status.json'
      - 'data/generated/timetable/operations-review-package.json'

permissions:
  contents: read

concurrency:
  group: calendar-horizon-public-recovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Build exact reviewed Rank C candidate envelopes
        run: node scripts/timetable/build-calendar-horizon-recovery-approved-candidates.mjs
      - name: Verify historical recovery candidates remain deterministic
        run: |
          git diff --exit-code -- \
            data/candidates/nar-august-2026-horizon-recovery-c-approved.json \
            data/candidates/jra-horizon-recovery-2026-08-01-through-2026-08-16-approved.json \
            data/candidates/banei-horizon-recovery-2026-08-15-through-2026-08-17-approved.json
      - name: Dry-run NAR Promotion Validation
        run: node scripts/timetable/promote-timetable.mjs --input data/candidates/nar-august-2026-horizon-recovery-c-approved.json --dry-run
      - name: Dry-run JRA Promotion Validation
        run: node scripts/timetable/promote-timetable.mjs --input data/candidates/jra-horizon-recovery-2026-08-01-through-2026-08-16-approved.json --dry-run
      - name: Dry-run Banei Promotion Validation
        run: node scripts/timetable/promote-timetable.mjs --input data/candidates/banei-horizon-recovery-2026-08-15-through-2026-08-17-approved.json --dry-run
      - name: Validate current repository data
        run: node scripts/validate-data.mjs
      - name: Verify recovered horizon historical invariant
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const candidatePaths = [
            'data/candidates/nar-august-2026-horizon-recovery-c-approved.json',
            'data/candidates/jra-horizon-recovery-2026-08-01-through-2026-08-16-approved.json',
            'data/candidates/banei-horizon-recovery-2026-08-15-through-2026-08-17-approved.json',
          ];
          const expected = [51, 18, 3];
          const records = [];
          candidatePaths.forEach((candidatePath, index) => {
            const value = JSON.parse(fs.readFileSync(candidatePath, 'utf8'));
            if (value.review?.status !== 'approved' || value.review?.promotion_target !== 'canonical-timetable-v0') throw new Error(`${candidatePath}: approval envelope differs`);
            if (value.records.length !== expected[index]) throw new Error(`${candidatePath}: record count differs`);
            for (const record of value.records) {
              if (record.capability_rank !== 'C' || record.first_race_time_local !== null || record.last_race_time_local !== null || record.timetable_rows.length !== 0) throw new Error(`${record.meeting_id}: historical recovery envelope exceeded Rank C`);
              records.push(record);
            }
          });
          const ids = records.map((record) => record.meeting_id);
          if (ids.length !== 72 || new Set(ids).size !== 72) throw new Error('recovery meeting identity count differs');
          const historicalDates = records.map((record) => record.date).sort();
          if (historicalDates[0] !== '2026-08-01' || historicalDates.at(-1) !== '2026-08-17') throw new Error('historical recovery date range differs');

          const rankOrder = new Map([['C', 0], ['B', 1], ['B+', 2], ['A', 3], ['A+', 4]]);
          const canonical = JSON.parse(fs.readFileSync('data/generated/timetable/canonical/meetings.json', 'utf8'));
          const publicList = JSON.parse(fs.readFileSync('data/generated/timetable/public/meeting-list.json', 'utf8'));
          const canonicalById = new Map(canonical.meetings.map((meeting) => [meeting.meeting_id, meeting]));
          const publicById = new Map(publicList.meetings.map((meeting) => [meeting.meeting_id, meeting]));
          const stableFields = ['country_id', 'authority_id', 'racing_system_id', 'racecourse_id', 'date', 'timezone'];

          for (const record of records) {
            const canonicalMeeting = canonicalById.get(record.meeting_id);
            const publicMeeting = publicById.get(record.meeting_id);
            if (!canonicalMeeting) throw new Error(`${record.meeting_id}: recovered meeting missing from canonical output`);
            if (!publicMeeting) throw new Error(`${record.meeting_id}: recovered meeting missing from public output`);
            for (const field of stableFields) {
              if (canonicalMeeting[field] !== record[field]) throw new Error(`${record.meeting_id}: canonical ${field} drifted from reviewed recovery identity`);
              if (publicMeeting[field] !== record[field]) throw new Error(`${record.meeting_id}: public ${field} drifted from reviewed recovery identity`);
            }
            const canonicalRank = rankOrder.get(canonicalMeeting.capability_rank);
            const publicRank = rankOrder.get(publicMeeting.capability_rank);
            if (canonicalRank === undefined || canonicalRank < rankOrder.get('C')) throw new Error(`${record.meeting_id}: canonical rank regressed below recovered baseline`);
            if (publicRank === undefined || publicRank < rankOrder.get('C')) throw new Error(`${record.meeting_id}: public rank regressed below recovered baseline`);
          }

          const status = JSON.parse(fs.readFileSync('data/generated/timetable/operations-status.json', 'utf8'));
          if ((status.public_projection?.latest_meeting_date ?? '') < '2026-08-17') throw new Error(`public horizon regressed below August recovery baseline: ${status.public_projection?.latest_meeting_date}`);
          console.log(JSON.stringify({
            historical_recovery_records: records.length,
            historical_first_date: historicalDates[0],
            historical_last_date: historicalDates.at(-1),
            current_public_meetings: status.public_projection?.meeting_count,
            current_public_latest_date: status.public_projection?.latest_meeting_date,
          }));
          NODE
      - name: Verify current public and operations consumers
        run: |
          node scripts/timetable/build-public-timetable-view.mjs --check
          node scripts/timetable/build-japan-a-plus-public-overrides.mjs --check
          node scripts/check-japan-a-plus-public-overrides.mjs
          node scripts/check-calendar-operations-status.mjs
          node scripts/check-calendar-operations-review-package.mjs
          node scripts/check-calendar-japan-current-window-operations.mjs
          node scripts/check-jra-pilot-foundation.mjs
      - name: Check generated diff formatting
        run: git diff --check
      - name: Upload reviewed historical recovery inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calendar-horizon-public-recovery-inputs
          if-no-files-found: error
          retention-days: 14
          path: |
            data/candidates/nar-august-2026-horizon-recovery-c-approved.json
            data/candidates/jra-horizon-recovery-2026-08-01-through-2026-08-16-approved.json
            data/candidates/banei-horizon-recovery-2026-08-15-through-2026-08-17-approved.json
