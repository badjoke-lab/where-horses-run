name: Calendar dynamic dates

on:
  pull_request:
    paths:
      - 'data/fixtures/calendar-banei-actions-executor-fixture-v1.json'
      - 'data/static/calendar-readiness-registry.json'
      - 'data/static/timetable-source-aliases-v1.json'
      - 'src/lib/timetable/calendarDateContext.mjs'
      - 'src/data/timetableMeetingRows.ts'
      - 'src/data/publicationDisplayPolicies.json'
      - 'src/components/CalendarDateStatus.astro'
      - 'src/components/TimetableMeetingList.astro'
      - 'src/components/CountryDetailPage.astro'
      - 'src/pages/calendar/index.astro'
      - 'src/pages/today.astro'
      - 'src/pages/tomorrow.astro'
      - 'src/pages/ja/calendar/index.astro'
      - 'src/pages/ja/today.astro'
      - 'src/pages/ja/tomorrow.astro'
      - 'docs/calendar/dynamic-dates-contract.md'
      - 'scripts/timetable/load-calendar-readiness.mjs'
      - 'scripts/timetable/pipeline-v1/public-projection-core.mjs'
      - 'scripts/check-calendar-30d-timetable-ui.mjs'
      - 'scripts/check-calendar-banei-bilingual-rendered-fixture.mjs'
      - 'scripts/check-calendar-dynamic-dates.mjs'
      - 'scripts/check-calendar-dynamic-dates-rendered.mjs'
      - 'scripts/check-calendar-runtime-import-boundary.mjs'
      - '.github/workflows/calendar-dynamic-dates.yml'
  push:
    branches:
      - main
    paths:
      - 'data/fixtures/calendar-banei-actions-executor-fixture-v1.json'
      - 'data/static/calendar-readiness-registry.json'
      - 'data/static/timetable-source-aliases-v1.json'
      - 'src/lib/timetable/calendarDateContext.mjs'
      - 'src/data/timetableMeetingRows.ts'
      - 'src/data/publicationDisplayPolicies.json'
      - 'src/components/CalendarDateStatus.astro'
      - 'src/components/TimetableMeetingList.astro'
      - 'src/components/CountryDetailPage.astro'
      - 'src/pages/calendar/index.astro'
      - 'src/pages/today.astro'
      - 'src/pages/tomorrow.astro'
      - 'src/pages/ja/calendar/index.astro'
      - 'src/pages/ja/today.astro'
      - 'src/pages/ja/tomorrow.astro'
      - 'docs/calendar/dynamic-dates-contract.md'
      - 'scripts/timetable/load-calendar-readiness.mjs'
      - 'scripts/timetable/pipeline-v1/public-projection-core.mjs'
      - 'scripts/check-calendar-30d-timetable-ui.mjs'
      - 'scripts/check-calendar-banei-bilingual-rendered-fixture.mjs'
      - 'scripts/check-calendar-dynamic-dates.mjs'
      - 'scripts/check-calendar-dynamic-dates-rendered.mjs'
      - 'scripts/check-calendar-runtime-import-boundary.mjs'
      - '.github/workflows/calendar-dynamic-dates.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Validate date and timezone contract
        run: node scripts/check-calendar-dynamic-dates.mjs
      - name: Validate current 30-day Calendar UI contract
        run: node scripts/check-calendar-30d-timetable-ui.mjs
      - name: Validate runtime import boundary
        run: node scripts/check-calendar-runtime-import-boundary.mjs
      - name: Install dependencies without lockfile mutation
        run: npm install --package-lock=false
      - name: Validate rendered Banei bilingual fixture
        run: node scripts/check-calendar-banei-bilingual-rendered-fixture.mjs
      - name: Build current site
        run: npm run build
      - name: Validate rendered dynamic dates
        run: node scripts/check-calendar-dynamic-dates-rendered.mjs
      - name: Prove validation leaves the repository clean
        run: |
          rm -rf dist
          changes="$(git status --porcelain --untracked-files=all)"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            echo 'Dynamic Dates validation modified repository files.' >&2
            exit 1
          fi
