name: Calendar dynamic dates

on:
  pull_request:
    paths:
      - 'src/lib/timetable/calendarDateContext.mjs'
      - 'src/data/timetableMeetingRows.ts'
      - 'src/components/CalendarDateStatus.astro'
      - 'src/components/CountryDetailPage.astro'
      - 'src/pages/calendar/index.astro'
      - 'src/pages/today.astro'
      - 'src/pages/tomorrow.astro'
      - 'src/pages/ja/calendar/index.astro'
      - 'src/pages/ja/today.astro'
      - 'src/pages/ja/tomorrow.astro'
      - 'docs/calendar/dynamic-dates-contract.md'
      - 'scripts/check-calendar-dynamic-dates.mjs'
      - 'scripts/check-calendar-dynamic-dates-rendered.mjs'
      - '.github/workflows/calendar-dynamic-dates.yml'
  push:
    branches:
      - main
    paths:
      - 'src/lib/timetable/calendarDateContext.mjs'
      - 'src/data/timetableMeetingRows.ts'
      - 'src/components/CalendarDateStatus.astro'
      - 'src/components/CountryDetailPage.astro'
      - 'src/pages/calendar/index.astro'
      - 'src/pages/today.astro'
      - 'src/pages/tomorrow.astro'
      - 'src/pages/ja/calendar/index.astro'
      - 'src/pages/ja/today.astro'
      - 'src/pages/ja/tomorrow.astro'
      - 'docs/calendar/dynamic-dates-contract.md'
      - 'scripts/check-calendar-dynamic-dates.mjs'
      - 'scripts/check-calendar-dynamic-dates-rendered.mjs'
      - '.github/workflows/calendar-dynamic-dates.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Validate date and timezone contract
        run: node scripts/check-calendar-dynamic-dates.mjs
      - name: Validate runtime and Pipeline v1 boundaries
        run: |
          node scripts/check-calendar-runtime-import-boundary.mjs
          node scripts/check-calendar-pipeline-v1-release-gate.mjs
      - name: Install dependencies without lockfile mutation
        run: npm install --package-lock=false
      - name: Build fixture window with reviewed meetings
        id: fixture
        continue-on-error: true
        env:
          WHR_CALENDAR_REFERENCE_DATE: '2026-06-06'
          WHR_CALENDAR_TIMEZONE: 'Asia/Tokyo'
        shell: bash
        run: |
          set +e
          rm -rf dist
          npm run build > /tmp/dynamic-fixture-build.log 2>&1
          build_status=$?
          if [ "$build_status" = "0" ]; then
            node scripts/check-calendar-dynamic-dates-rendered.mjs > /tmp/dynamic-fixture-rendered.log 2>&1
            rendered_status=$?
          else
            rendered_status=99
            printf 'rendered QA skipped because build failed\n' > /tmp/dynamic-fixture-rendered.log
          fi
          printf '%s\n' "$build_status" > /tmp/dynamic-fixture-build.exit
          printf '%s\n' "$rendered_status" > /tmp/dynamic-fixture-rendered.exit
          cat /tmp/dynamic-fixture-build.log
          cat /tmp/dynamic-fixture-rendered.log
          exit 0
      - name: Build current empty/stale window
        id: current
        continue-on-error: true
        env:
          WHR_CALENDAR_REFERENCE_DATE: '2026-07-01'
          WHR_CALENDAR_TIMEZONE: 'Asia/Tokyo'
        shell: bash
        run: |
          set +e
          rm -rf dist
          npm run build > /tmp/dynamic-current-build.log 2>&1
          build_status=$?
          if [ "$build_status" = "0" ]; then
            node scripts/check-calendar-dynamic-dates-rendered.mjs > /tmp/dynamic-current-rendered.log 2>&1
            rendered_status=$?
          else
            rendered_status=99
            printf 'rendered QA skipped because build failed\n' > /tmp/dynamic-current-rendered.log
          fi
          printf '%s\n' "$build_status" > /tmp/dynamic-current-build.exit
          printf '%s\n' "$rendered_status" > /tmp/dynamic-current-rendered.exit
          cat /tmp/dynamic-current-build.log
          cat /tmp/dynamic-current-rendered.log
          exit 0
      - name: Upload Dynamic Dates diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calendar-dynamic-dates-diagnostics-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: error
          path: |
            /tmp/dynamic-fixture-build.log
            /tmp/dynamic-fixture-build.exit
            /tmp/dynamic-fixture-rendered.log
            /tmp/dynamic-fixture-rendered.exit
            /tmp/dynamic-current-build.log
            /tmp/dynamic-current-build.exit
            /tmp/dynamic-current-rendered.log
            /tmp/dynamic-current-rendered.exit
      - name: Enforce Dynamic Dates closure
        run: |
          fixture_build="$(cat /tmp/dynamic-fixture-build.exit)"
          fixture_rendered="$(cat /tmp/dynamic-fixture-rendered.exit)"
          current_build="$(cat /tmp/dynamic-current-build.exit)"
          current_rendered="$(cat /tmp/dynamic-current-rendered.exit)"
          if [ "$fixture_build" != "0" ] || [ "$fixture_rendered" != "0" ] || [ "$current_build" != "0" ] || [ "$current_rendered" != "0" ]; then
            printf 'fixture_build=%s fixture_rendered=%s current_build=%s current_rendered=%s\n' "$fixture_build" "$fixture_rendered" "$current_build" "$current_rendered"
            exit 1
          fi
      - name: Prove validation leaves the repository clean
        run: |
          rm -rf dist
          changes="$(git status --porcelain --untracked-files=all)"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            echo 'Dynamic Dates validation modified repository files.' >&2
            exit 1
          fi
