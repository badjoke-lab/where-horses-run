name: Calendar UAE all public C live probe 2026-09-01

on:
  push:
    branches:
      - ops/uae-current-live-probe-20260901
    paths:
      - '.github/workflows/calendar-uae-current-c-live-probe-20260901.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Probe every public UAE Rank C meeting
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { spawnSync } from 'node:child_process';

          const publicList = JSON.parse(fs.readFileSync('data/generated/timetable/public/meeting-list.json', 'utf8'));
          const rows = (publicList.meetings ?? []).filter((row) =>
            row.country_id === 'united-arab-emirates' &&
            (row.effective_public_rank ?? row.capability_rank) === 'C'
          );
          const results = [];
          for (const row of rows) {
            const proc = spawnSync(process.execPath, [
              'scripts/timetable/collect-uae-era-detail-artifacts.mjs',
              `--date=${row.date}`,
              `--racecourse-id=${row.racecourse_id}`,
            ], { encoding: 'utf8', maxBuffer: 20 * 1024 * 1024 });
            if (proc.status !== 0) {
              results.push({ meeting_id: row.meeting_id, date: row.date, racecourse_id: row.racecourse_id, current_rank: 'C', probe_status: 'unavailable', error: String(proc.stderr || proc.stdout || '').trim().slice(0, 1000) });
              continue;
            }
            const evidence = JSON.parse(proc.stdout);
            results.push({
              meeting_id: row.meeting_id,
              date: row.date,
              racecourse_id: row.racecourse_id,
              current_rank: 'C',
              probe_status: 'success',
              classification: evidence.classification,
              race_count: evidence.meeting?.race_count ?? 0,
              source_error_count: evidence.source_errors?.length ?? 0,
              observations: (evidence.observations ?? []).map((race) => ({ race_number: race.race_number, post_time_local: race.post_time_local, missing_fields: race.missing_fields })),
            });
          }
          const summary = {
            generated_at: new Date().toISOString(),
            public_uae_c_count: rows.length,
            date_span: rows.length ? [rows.map(r => r.date).sort()[0], rows.map(r => r.date).sort().at(-1)] : null,
            successful_probe_count: results.filter((r) => r.probe_status === 'success').length,
            unavailable_probe_count: results.filter((r) => r.probe_status === 'unavailable').length,
            results,
            canonical_write: false,
            public_write: false,
          };
          fs.writeFileSync('/tmp/uae-all-public-c-live-probe.json', JSON.stringify(summary, null, 2) + '\n');
          console.log(JSON.stringify(summary, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: uae-all-public-c-live-probe-20260901
          path: /tmp/uae-all-public-c-live-probe.json
          retention-days: 7
