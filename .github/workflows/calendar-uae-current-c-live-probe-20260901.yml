name: Calendar UAE exact four Rank A review evidence

on:
  push:
    branches:
      - ops/uae-current-live-probe-20260901
    paths:
      - '.github/workflows/calendar-uae-current-c-live-probe-20260901.yml'

permissions:
  contents: read

jobs:
  review-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Re-acquire and build exact four UAE C-to-A candidates
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { spawnSync } from 'node:child_process';
          import { buildUaeEraRankUpgradeArtifactsV1, sha256UaeJsonV1 } from './scripts/timetable/uae-era-rank-upgrade-core.mjs';

          const ids = [
            'era-al-ain-racecourse-2026-04-03',
            'era-abu-dhabi-turf-club-2026-04-04',
            'era-al-ain-racecourse-2026-04-10',
            'era-abu-dhabi-turf-club-2026-04-11',
          ];
          const canonical = JSON.parse(fs.readFileSync('data/generated/timetable/canonical/meetings.json', 'utf8'));
          const byId = new Map(canonical.meetings.map((row) => [row.meeting_id, row]));
          const evidenceByMeetingId = {};
          for (const id of ids) {
            const row = byId.get(id);
            if (!row || row.capability_rank !== 'C') throw new Error(`${id} is not exact canonical C prestate`);
            const proc = spawnSync(process.execPath, [
              'scripts/timetable/collect-uae-era-detail-artifacts.mjs',
              `--date=${row.date}`,
              `--racecourse-id=${row.racecourse_id}`,
            ], { encoding: 'utf8', maxBuffer: 20 * 1024 * 1024 });
            if (proc.status !== 0) throw new Error(`${id} live ERA collection failed: ${proc.stderr || proc.stdout}`);
            const evidence = JSON.parse(proc.stdout);
            if (evidence.classification?.rank !== 'A') throw new Error(`${id} no longer proves exact Rank A`);
            if ((evidence.source_errors ?? []).length !== 0) throw new Error(`${id} has source errors`);
            evidenceByMeetingId[id] = evidence;
          }
          const generatedAt = new Date().toISOString();
          const job = {
            schema_version: 'calendar-collection-job-v1',
            job_id: 'uae-public-c-four-rank-a-review-job',
            campaign_id: 'uae-public-c-four-rank-a-review',
            system_id: 'uae-national-racing-system',
            runner_policy: { mode: 'exact', runner: 'github_actions' },
            collection_mode: 'selected_meetings',
            requested_scope: { meeting_ids: ids },
            rank_strategy: 'target_rank',
            target_rank: 'A',
            reason: 'rank_upgrade_retry',
            requested_at: generatedAt,
          };
          const artifacts = buildUaeEraRankUpgradeArtifactsV1({
            job,
            batchId: 'uae-public-c-four-rank-a-review-batch-20260901',
            generatedAt,
            canonicalMeetings: canonical.meetings,
            evidenceByMeetingId,
          });
          if (artifacts.candidate.records.length !== 4 || artifacts.manifest.rank_counts.A !== 4) throw new Error('exact four Rank A candidate closure failed');
          if (artifacts.manifest.coverage_claim !== 'source_window_complete') throw new Error('coverage is not complete');
          fs.mkdirSync('/tmp/uae-four-review', { recursive: true });
          for (const [name, value] of Object.entries({
            'candidates.json': artifacts.candidate,
            'manifest.json': artifacts.manifest,
            'coverage.json': artifacts.coverage,
            'report.json': artifacts.report,
          })) fs.writeFileSync(`/tmp/uae-four-review/${name}`, JSON.stringify(value, null, 2) + '\n');
          console.log(JSON.stringify({
            candidate_sha256: sha256UaeJsonV1(artifacts.candidate),
            manifest_sha256: sha256UaeJsonV1(artifacts.manifest),
            meeting_ids: artifacts.candidate.records.map(r => r.meeting_id),
            rank_counts: artifacts.manifest.rank_counts,
            coverage_claim: artifacts.manifest.coverage_claim,
            canonical_write: false,
            public_write: false,
          }, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: uae-four-rank-a-review-20260901
          path: /tmp/uae-four-review
          retention-days: 14
